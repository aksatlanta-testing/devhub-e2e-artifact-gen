apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-echo
  labels:
    app: go-echo
    kubernetes.azure.com/generator: devhub
  namespace: devhub-e2e-test-id-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-echo
  template:
    metadata:
      labels:
        app: go-echo
    spec:
      containers:
        - name: go-echo
          image: devhube2e34ee357c4d344b16843ab4601d061c0a.azurecr.io/kubeimage:latest:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 1323