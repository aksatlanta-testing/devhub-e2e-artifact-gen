apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1b7be39a-b215-41ff-bda6-74343d825582.fullname" . }}
  labels:
    {{- include "go-echo1b7be39a-b215-41ff-bda6-74343d825582.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1b7be39a-b215-41ff-bda6-74343d825582.selectorLabels" . | nindent 6 }}
