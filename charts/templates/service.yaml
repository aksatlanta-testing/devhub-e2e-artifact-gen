apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoedbf8f93-7953-481b-a670-d24206121b91.fullname" . }}
  labels:
    {{- include "go-echoedbf8f93-7953-481b-a670-d24206121b91.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoedbf8f93-7953-481b-a670-d24206121b91.selectorLabels" . | nindent 6 }}
