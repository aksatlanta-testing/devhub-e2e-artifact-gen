apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7f7665ca-b4e1-4fd6-a0c5-fcc145c06563.fullname" . }}
  labels:
    {{- include "go-echo7f7665ca-b4e1-4fd6-a0c5-fcc145c06563.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7f7665ca-b4e1-4fd6-a0c5-fcc145c06563.selectorLabels" . | nindent 6 }}
