apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofe2ba294-2887-4489-8e14-1f383855fcd8.fullname" . }}
  labels:
    {{- include "go-echofe2ba294-2887-4489-8e14-1f383855fcd8.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofe2ba294-2887-4489-8e14-1f383855fcd8.selectorLabels" . | nindent 6 }}
