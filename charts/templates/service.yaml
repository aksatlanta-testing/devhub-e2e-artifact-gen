apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoda7a2a1c-ea2d-4901-9f41-d9a3932f485e.fullname" . }}
  labels:
    {{- include "go-echoda7a2a1c-ea2d-4901-9f41-d9a3932f485e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoda7a2a1c-ea2d-4901-9f41-d9a3932f485e.selectorLabels" . | nindent 6 }}
