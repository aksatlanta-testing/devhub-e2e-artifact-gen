apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9595bd84-3496-4b71-a6c9-b7cd08abd449.fullname" . }}
  labels:
    {{- include "go-echo9595bd84-3496-4b71-a6c9-b7cd08abd449.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9595bd84-3496-4b71-a6c9-b7cd08abd449.selectorLabels" . | nindent 6 }}
