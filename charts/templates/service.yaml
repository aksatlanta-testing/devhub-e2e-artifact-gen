apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoec01ed3f-7884-42fa-a215-71021536897c.fullname" . }}
  labels:
    {{- include "go-echoec01ed3f-7884-42fa-a215-71021536897c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoec01ed3f-7884-42fa-a215-71021536897c.selectorLabels" . | nindent 6 }}
