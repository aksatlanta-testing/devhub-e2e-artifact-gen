apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc955802b-43d6-4d1f-9cda-81c14913cd3c.fullname" . }}
  labels:
    {{- include "go-echoc955802b-43d6-4d1f-9cda-81c14913cd3c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc955802b-43d6-4d1f-9cda-81c14913cd3c.selectorLabels" . | nindent 6 }}
