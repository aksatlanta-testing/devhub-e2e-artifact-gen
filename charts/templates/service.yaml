apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9cadd3ad-aee9-494c-8be7-f385fb0c6a41.fullname" . }}
  labels:
    {{- include "go-echo9cadd3ad-aee9-494c-8be7-f385fb0c6a41.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9cadd3ad-aee9-494c-8be7-f385fb0c6a41.selectorLabels" . | nindent 6 }}
