apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo938e49e2-3152-429f-b467-70f133d73bfa.fullname" . }}
  labels:
    {{- include "go-echo938e49e2-3152-429f-b467-70f133d73bfa.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
