apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo96580f30-3d3b-4336-bd5f-1e7880649381.fullname" . }}
  labels:
    {{- include "go-echo96580f30-3d3b-4336-bd5f-1e7880649381.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo96580f30-3d3b-4336-bd5f-1e7880649381.selectorLabels" . | nindent 6 }}
