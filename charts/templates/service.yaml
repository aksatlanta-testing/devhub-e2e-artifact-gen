apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoed3944d2-c41e-4e52-ae58-f54c3b551945.fullname" . }}
  labels:
    {{- include "go-echoed3944d2-c41e-4e52-ae58-f54c3b551945.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoed3944d2-c41e-4e52-ae58-f54c3b551945.selectorLabels" . | nindent 6 }}
