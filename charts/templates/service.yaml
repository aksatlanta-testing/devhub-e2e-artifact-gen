apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof3619f24-d85c-4696-88b4-9a213c999c5d.fullname" . }}
  labels:
    {{- include "go-echof3619f24-d85c-4696-88b4-9a213c999c5d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof3619f24-d85c-4696-88b4-9a213c999c5d.selectorLabels" . | nindent 6 }}
