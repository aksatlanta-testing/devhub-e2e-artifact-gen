apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo83a8cb1d-f097-473b-bcea-aa16e70daf26.fullname" . }}
  labels:
    {{- include "go-echo83a8cb1d-f097-473b-bcea-aa16e70daf26.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo83a8cb1d-f097-473b-bcea-aa16e70daf26.selectorLabels" . | nindent 6 }}
