apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo50093b27-6ae7-495c-ae62-68573bfd1e48.fullname" . }}
  labels:
    {{- include "go-echo50093b27-6ae7-495c-ae62-68573bfd1e48.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo50093b27-6ae7-495c-ae62-68573bfd1e48.selectorLabels" . | nindent 6 }}
