apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod8f4d5ec-fbb6-45dd-b9c7-ce4d1ac4dd48.fullname" . }}
  labels:
    {{- include "go-echod8f4d5ec-fbb6-45dd-b9c7-ce4d1ac4dd48.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod8f4d5ec-fbb6-45dd-b9c7-ce4d1ac4dd48.selectorLabels" . | nindent 6 }}
