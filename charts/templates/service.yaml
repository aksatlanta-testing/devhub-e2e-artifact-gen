apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod7f5d73c-f0cb-4e4c-9b43-bf6a0fc21c04.fullname" . }}
  labels:
    {{- include "go-echod7f5d73c-f0cb-4e4c-9b43-bf6a0fc21c04.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod7f5d73c-f0cb-4e4c-9b43-bf6a0fc21c04.selectorLabels" . | nindent 6 }}
