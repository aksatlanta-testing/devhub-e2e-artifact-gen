apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo37a0a73a-3649-453d-82d0-bc30b26fd011.fullname" . }}
  labels:
    {{- include "go-echo37a0a73a-3649-453d-82d0-bc30b26fd011.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo37a0a73a-3649-453d-82d0-bc30b26fd011.selectorLabels" . | nindent 6 }}
