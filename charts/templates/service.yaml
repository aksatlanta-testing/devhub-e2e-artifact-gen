apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9dcc5431-5778-488c-b892-95edd6bf365a.fullname" . }}
  labels:
    {{- include "go-echo9dcc5431-5778-488c-b892-95edd6bf365a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9dcc5431-5778-488c-b892-95edd6bf365a.selectorLabels" . | nindent 6 }}
