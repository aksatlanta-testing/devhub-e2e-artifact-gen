apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6cf79523-08b6-49e5-bba0-c63f6b041fef.fullname" . }}
  labels:
    {{- include "go-echo6cf79523-08b6-49e5-bba0-c63f6b041fef.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6cf79523-08b6-49e5-bba0-c63f6b041fef.selectorLabels" . | nindent 6 }}
