apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo125ad49a-32c0-4897-b9b0-248e905eb3bd.fullname" . }}
  labels:
    {{- include "go-echo125ad49a-32c0-4897-b9b0-248e905eb3bd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo125ad49a-32c0-4897-b9b0-248e905eb3bd.selectorLabels" . | nindent 6 }}
