apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1a246002-098b-49cf-9c43-1b2a4829e47b.fullname" . }}
  labels:
    {{- include "go-echo1a246002-098b-49cf-9c43-1b2a4829e47b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1a246002-098b-49cf-9c43-1b2a4829e47b.selectorLabels" . | nindent 6 }}
