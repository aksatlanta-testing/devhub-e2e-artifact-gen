apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7cf903ae-c9fd-43ca-9dc3-671f3e8797e7.fullname" . }}
  labels:
    {{- include "go-echo7cf903ae-c9fd-43ca-9dc3-671f3e8797e7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7cf903ae-c9fd-43ca-9dc3-671f3e8797e7.selectorLabels" . | nindent 6 }}
