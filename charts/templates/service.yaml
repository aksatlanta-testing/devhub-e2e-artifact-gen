apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1dba3084-0336-40ec-b26d-3880594fdb72.fullname" . }}
  labels:
    {{- include "go-echo1dba3084-0336-40ec-b26d-3880594fdb72.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1dba3084-0336-40ec-b26d-3880594fdb72.selectorLabels" . | nindent 6 }}
