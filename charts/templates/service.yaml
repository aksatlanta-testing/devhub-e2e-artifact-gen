apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9de6090a-7022-4e62-96ee-65c59aa7af31.fullname" . }}
  labels:
    {{- include "go-echo9de6090a-7022-4e62-96ee-65c59aa7af31.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9de6090a-7022-4e62-96ee-65c59aa7af31.selectorLabels" . | nindent 6 }}
