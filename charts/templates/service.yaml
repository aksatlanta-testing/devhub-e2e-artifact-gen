apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo86642d67-1729-414d-bc37-f85b4e057de4.fullname" . }}
  labels:
    {{- include "go-echo86642d67-1729-414d-bc37-f85b4e057de4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo86642d67-1729-414d-bc37-f85b4e057de4.selectorLabels" . | nindent 6 }}
