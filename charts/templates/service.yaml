apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe09183a4-a518-446b-aa68-5d21b1e6c4b1.fullname" . }}
  labels:
    {{- include "go-echoe09183a4-a518-446b-aa68-5d21b1e6c4b1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe09183a4-a518-446b-aa68-5d21b1e6c4b1.selectorLabels" . | nindent 6 }}
