apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0caa4463-628f-42a0-ac8c-e54cf2ee0e05.fullname" . }}
  labels:
    {{- include "go-echo0caa4463-628f-42a0-ac8c-e54cf2ee0e05.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0caa4463-628f-42a0-ac8c-e54cf2ee0e05.selectorLabels" . | nindent 6 }}
