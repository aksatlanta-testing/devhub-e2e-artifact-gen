apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo392f8dc2-0276-42b5-8347-56952e363295.fullname" . }}
  labels:
    {{- include "go-echo392f8dc2-0276-42b5-8347-56952e363295.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo392f8dc2-0276-42b5-8347-56952e363295.selectorLabels" . | nindent 6 }}
