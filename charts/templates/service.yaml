apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4c720451-6c22-48b4-8ad8-7f6f230c545f.fullname" . }}
  labels:
    {{- include "go-echo4c720451-6c22-48b4-8ad8-7f6f230c545f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4c720451-6c22-48b4-8ad8-7f6f230c545f.selectorLabels" . | nindent 6 }}
