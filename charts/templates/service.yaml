apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoba6d6adc-820e-4670-99b4-caadfb3e0e04.fullname" . }}
  labels:
    {{- include "go-echoba6d6adc-820e-4670-99b4-caadfb3e0e04.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoba6d6adc-820e-4670-99b4-caadfb3e0e04.selectorLabels" . | nindent 6 }}
