apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5d1d0359-0d6d-41b9-b81d-54470df8eecc.fullname" . }}
  labels:
    {{- include "go-echo5d1d0359-0d6d-41b9-b81d-54470df8eecc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5d1d0359-0d6d-41b9-b81d-54470df8eecc.selectorLabels" . | nindent 6 }}
