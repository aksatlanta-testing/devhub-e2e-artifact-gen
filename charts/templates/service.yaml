apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe7bf54bb-908d-41ca-81e4-414384484566.fullname" . }}
  labels:
    {{- include "go-echoe7bf54bb-908d-41ca-81e4-414384484566.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe7bf54bb-908d-41ca-81e4-414384484566.selectorLabels" . | nindent 6 }}
