apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5eb55355-9adc-43f2-8819-1d313e9603b3.fullname" . }}
  labels:
    {{- include "go-echo5eb55355-9adc-43f2-8819-1d313e9603b3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5eb55355-9adc-43f2-8819-1d313e9603b3.selectorLabels" . | nindent 6 }}
