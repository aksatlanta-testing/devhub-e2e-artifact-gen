apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5e5a435e-dddd-4fbe-84d4-c3e6e7f1076b.fullname" . }}
  labels:
    {{- include "go-echo5e5a435e-dddd-4fbe-84d4-c3e6e7f1076b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5e5a435e-dddd-4fbe-84d4-c3e6e7f1076b.selectorLabels" . | nindent 6 }}
