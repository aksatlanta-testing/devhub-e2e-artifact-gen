apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoee279197-1046-4a8b-974a-0c8f8e2788ac.fullname" . }}
  labels:
    {{- include "go-echoee279197-1046-4a8b-974a-0c8f8e2788ac.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoee279197-1046-4a8b-974a-0c8f8e2788ac.selectorLabels" . | nindent 6 }}
