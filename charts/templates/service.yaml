apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8309c2c2-6a1f-4ab0-86d8-b2ec71b2ee7d.fullname" . }}
  labels:
    {{- include "go-echo8309c2c2-6a1f-4ab0-86d8-b2ec71b2ee7d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8309c2c2-6a1f-4ab0-86d8-b2ec71b2ee7d.selectorLabels" . | nindent 6 }}
