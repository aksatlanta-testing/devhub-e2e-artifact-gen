apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa3526406-5a01-4920-b1f3-09c9dad9df08.fullname" . }}
  labels:
    {{- include "go-echoa3526406-5a01-4920-b1f3-09c9dad9df08.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa3526406-5a01-4920-b1f3-09c9dad9df08.selectorLabels" . | nindent 6 }}
