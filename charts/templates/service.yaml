apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echode7a601b-f5bc-499f-89b6-2c41e4e41273.fullname" . }}
  labels:
    {{- include "go-echode7a601b-f5bc-499f-89b6-2c41e4e41273.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echode7a601b-f5bc-499f-89b6-2c41e4e41273.selectorLabels" . | nindent 6 }}
