apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodebeeb4f-f6a0-4535-b4ed-5a7c277cdf3f.fullname" . }}
  labels:
    {{- include "go-echodebeeb4f-f6a0-4535-b4ed-5a7c277cdf3f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodebeeb4f-f6a0-4535-b4ed-5a7c277cdf3f.selectorLabels" . | nindent 6 }}
