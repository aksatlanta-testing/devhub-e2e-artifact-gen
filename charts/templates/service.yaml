apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo253ca434-9d18-4259-8a1f-cb6c8e5399d6.fullname" . }}
  labels:
    {{- include "go-echo253ca434-9d18-4259-8a1f-cb6c8e5399d6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo253ca434-9d18-4259-8a1f-cb6c8e5399d6.selectorLabels" . | nindent 6 }}
