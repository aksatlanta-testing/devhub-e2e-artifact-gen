apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo12b2aafa-e462-4128-bc29-526d2cbff5d3.fullname" . }}
  labels:
    {{- include "go-echo12b2aafa-e462-4128-bc29-526d2cbff5d3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo12b2aafa-e462-4128-bc29-526d2cbff5d3.selectorLabels" . | nindent 6 }}
