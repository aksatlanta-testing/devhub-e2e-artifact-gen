apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo95c98fb8-a4cd-428d-9111-32959514359d.fullname" . }}
  labels:
    {{- include "go-echo95c98fb8-a4cd-428d-9111-32959514359d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo95c98fb8-a4cd-428d-9111-32959514359d.selectorLabels" . | nindent 6 }}
