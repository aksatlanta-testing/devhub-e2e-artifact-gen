apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe4c0638a-ff71-40ee-9128-3edd5e8d5142.fullname" . }}
  labels:
    {{- include "go-echoe4c0638a-ff71-40ee-9128-3edd5e8d5142.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe4c0638a-ff71-40ee-9128-3edd5e8d5142.selectorLabels" . | nindent 6 }}
