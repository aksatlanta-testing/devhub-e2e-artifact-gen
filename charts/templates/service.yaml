apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2f06675f-5163-4890-b434-43860f336fc5.fullname" . }}
  labels:
    {{- include "go-echo2f06675f-5163-4890-b434-43860f336fc5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2f06675f-5163-4890-b434-43860f336fc5.selectorLabels" . | nindent 6 }}
