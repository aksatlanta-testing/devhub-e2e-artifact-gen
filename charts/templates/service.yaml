apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1ba694fe-4acd-4d2c-9159-2a79990c510e.fullname" . }}
  labels:
    {{- include "go-echo1ba694fe-4acd-4d2c-9159-2a79990c510e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1ba694fe-4acd-4d2c-9159-2a79990c510e.selectorLabels" . | nindent 6 }}
