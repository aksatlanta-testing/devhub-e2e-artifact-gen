apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofc8283ad-5c26-4ac0-8ffe-1bd0bda44b7e.fullname" . }}
  labels:
    {{- include "go-echofc8283ad-5c26-4ac0-8ffe-1bd0bda44b7e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofc8283ad-5c26-4ac0-8ffe-1bd0bda44b7e.selectorLabels" . | nindent 6 }}
