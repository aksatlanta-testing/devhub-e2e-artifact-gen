apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoee6de102-c306-404e-b021-269733b40319.fullname" . }}
  labels:
    {{- include "go-echoee6de102-c306-404e-b021-269733b40319.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoee6de102-c306-404e-b021-269733b40319.selectorLabels" . | nindent 6 }}
