apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo61a21ee3-efa1-4fec-a0b6-bbedcf23b8f8.fullname" . }}
  labels:
    {{- include "go-echo61a21ee3-efa1-4fec-a0b6-bbedcf23b8f8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo61a21ee3-efa1-4fec-a0b6-bbedcf23b8f8.selectorLabels" . | nindent 6 }}
