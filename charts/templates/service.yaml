apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4460f5ef-bc3c-46b0-bc67-1ef6ce8fa685.fullname" . }}
  labels:
    {{- include "go-echo4460f5ef-bc3c-46b0-bc67-1ef6ce8fa685.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4460f5ef-bc3c-46b0-bc67-1ef6ce8fa685.selectorLabels" . | nindent 6 }}
