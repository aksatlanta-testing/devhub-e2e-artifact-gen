apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6d163bd3-d00f-407a-8467-cb2b0136ffa4.fullname" . }}
  labels:
    {{- include "go-echo6d163bd3-d00f-407a-8467-cb2b0136ffa4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6d163bd3-d00f-407a-8467-cb2b0136ffa4.selectorLabels" . | nindent 6 }}
