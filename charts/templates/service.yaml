apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe3621b5b-78f7-45a7-8ca2-530bbd7dcc19.fullname" . }}
  labels:
    {{- include "go-echoe3621b5b-78f7-45a7-8ca2-530bbd7dcc19.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe3621b5b-78f7-45a7-8ca2-530bbd7dcc19.selectorLabels" . | nindent 6 }}
