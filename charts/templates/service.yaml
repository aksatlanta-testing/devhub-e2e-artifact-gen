apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4311f56e-08ee-4b47-8768-b473bcf897cd.fullname" . }}
  labels:
    {{- include "go-echo4311f56e-08ee-4b47-8768-b473bcf897cd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4311f56e-08ee-4b47-8768-b473bcf897cd.selectorLabels" . | nindent 6 }}
