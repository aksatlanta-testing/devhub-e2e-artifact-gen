apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo537579a3-2b8b-415d-98fa-a2cdd60d26bd.fullname" . }}
  labels:
    {{- include "go-echo537579a3-2b8b-415d-98fa-a2cdd60d26bd.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo537579a3-2b8b-415d-98fa-a2cdd60d26bd.selectorLabels" . | nindent 6 }}
