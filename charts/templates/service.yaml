apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc03b135b-f4d9-4480-82ad-2984f4b8df06.fullname" . }}
  labels:
    {{- include "go-echoc03b135b-f4d9-4480-82ad-2984f4b8df06.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc03b135b-f4d9-4480-82ad-2984f4b8df06.selectorLabels" . | nindent 6 }}
