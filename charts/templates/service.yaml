apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe933876b-8d29-4fdb-b682-08bcb416510c.fullname" . }}
  labels:
    {{- include "go-echoe933876b-8d29-4fdb-b682-08bcb416510c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe933876b-8d29-4fdb-b682-08bcb416510c.selectorLabels" . | nindent 6 }}
