apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0d1d23a8-370b-4ceb-aca9-09fcc3ca5efe.fullname" . }}
  labels:
    {{- include "go-echo0d1d23a8-370b-4ceb-aca9-09fcc3ca5efe.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0d1d23a8-370b-4ceb-aca9-09fcc3ca5efe.selectorLabels" . | nindent 6 }}
