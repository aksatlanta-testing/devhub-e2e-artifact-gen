apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo650162d5-8635-4533-9ba0-8abb42dd83da.fullname" . }}
  labels:
    {{- include "go-echo650162d5-8635-4533-9ba0-8abb42dd83da.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo650162d5-8635-4533-9ba0-8abb42dd83da.selectorLabels" . | nindent 6 }}
