apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo639b8dcb-bd61-463a-923b-6839d02de547.fullname" . }}
  labels:
    {{- include "go-echo639b8dcb-bd61-463a-923b-6839d02de547.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo639b8dcb-bd61-463a-923b-6839d02de547.selectorLabels" . | nindent 6 }}
