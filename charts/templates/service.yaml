apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4201656d-7f86-4f0a-92c5-38fbac789659.fullname" . }}
  labels:
    {{- include "go-echo4201656d-7f86-4f0a-92c5-38fbac789659.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4201656d-7f86-4f0a-92c5-38fbac789659.selectorLabels" . | nindent 6 }}
