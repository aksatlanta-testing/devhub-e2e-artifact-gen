apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo939a4b14-fcc1-4d00-9b11-e492a9daae43.fullname" . }}
  labels:
    {{- include "go-echo939a4b14-fcc1-4d00-9b11-e492a9daae43.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo939a4b14-fcc1-4d00-9b11-e492a9daae43.selectorLabels" . | nindent 6 }}
