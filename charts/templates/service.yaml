apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo35152cd7-0165-4981-8442-34480872ee0f.fullname" . }}
  labels:
    {{- include "go-echo35152cd7-0165-4981-8442-34480872ee0f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo35152cd7-0165-4981-8442-34480872ee0f.selectorLabels" . | nindent 6 }}
