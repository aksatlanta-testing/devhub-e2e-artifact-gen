apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoffdad95f-ff4a-44f2-af78-10d7f5bc8f10.fullname" . }}
  labels:
    {{- include "go-echoffdad95f-ff4a-44f2-af78-10d7f5bc8f10.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoffdad95f-ff4a-44f2-af78-10d7f5bc8f10.selectorLabels" . | nindent 6 }}
