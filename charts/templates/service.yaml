apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo97f4584a-ab78-4b30-8ea2-d8d8500019ef.fullname" . }}
  labels:
    {{- include "go-echo97f4584a-ab78-4b30-8ea2-d8d8500019ef.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo97f4584a-ab78-4b30-8ea2-d8d8500019ef.selectorLabels" . | nindent 6 }}
