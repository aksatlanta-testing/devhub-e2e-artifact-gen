apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobae735ee-ade0-4947-afb7-1af657c5b664.fullname" . }}
  labels:
    {{- include "go-echobae735ee-ade0-4947-afb7-1af657c5b664.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobae735ee-ade0-4947-afb7-1af657c5b664.selectorLabels" . | nindent 6 }}
