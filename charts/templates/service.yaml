apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoebde9a7f-08e4-4f2a-9acd-60bb046bd34b.fullname" . }}
  labels:
    {{- include "go-echoebde9a7f-08e4-4f2a-9acd-60bb046bd34b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoebde9a7f-08e4-4f2a-9acd-60bb046bd34b.selectorLabels" . | nindent 6 }}
