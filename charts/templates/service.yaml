apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo679a13d9-e639-4b4c-b1ab-236946ae6567.fullname" . }}
  labels:
    {{- include "go-echo679a13d9-e639-4b4c-b1ab-236946ae6567.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo679a13d9-e639-4b4c-b1ab-236946ae6567.selectorLabels" . | nindent 6 }}
