apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo06e7970a-c01c-4fd9-bbbc-847335d2faac.fullname" . }}
  labels:
    {{- include "go-echo06e7970a-c01c-4fd9-bbbc-847335d2faac.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo06e7970a-c01c-4fd9-bbbc-847335d2faac.selectorLabels" . | nindent 6 }}
