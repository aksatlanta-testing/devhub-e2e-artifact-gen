apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo19040857-64da-4662-a48b-cdc2e465e99b.fullname" . }}
  labels:
    {{- include "go-echo19040857-64da-4662-a48b-cdc2e465e99b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo19040857-64da-4662-a48b-cdc2e465e99b.selectorLabels" . | nindent 6 }}
