apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo13b744a2-92c2-424c-979f-03cbca8e78d5.fullname" . }}
  labels:
    {{- include "go-echo13b744a2-92c2-424c-979f-03cbca8e78d5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo13b744a2-92c2-424c-979f-03cbca8e78d5.selectorLabels" . | nindent 6 }}
