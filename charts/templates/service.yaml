apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2d58e973-7076-4e29-bb90-afc6952b7776.fullname" . }}
  labels:
    {{- include "go-echo2d58e973-7076-4e29-bb90-afc6952b7776.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2d58e973-7076-4e29-bb90-afc6952b7776.selectorLabels" . | nindent 6 }}
