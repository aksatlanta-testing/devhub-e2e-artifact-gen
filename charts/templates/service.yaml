apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo63b248aa-7db6-4c3c-a975-fe839f6c26da.fullname" . }}
  labels:
    {{- include "go-echo63b248aa-7db6-4c3c-a975-fe839f6c26da.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo63b248aa-7db6-4c3c-a975-fe839f6c26da.selectorLabels" . | nindent 6 }}
