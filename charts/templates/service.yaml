apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod3c384ca-a4a5-4799-b209-a1464dfc8f14.fullname" . }}
  labels:
    {{- include "go-echod3c384ca-a4a5-4799-b209-a1464dfc8f14.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod3c384ca-a4a5-4799-b209-a1464dfc8f14.selectorLabels" . | nindent 6 }}
