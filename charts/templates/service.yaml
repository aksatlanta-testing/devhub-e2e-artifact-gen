apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod7a73150-ab81-43bd-9ee2-7576a7212a86.fullname" . }}
  labels:
    {{- include "go-echod7a73150-ab81-43bd-9ee2-7576a7212a86.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod7a73150-ab81-43bd-9ee2-7576a7212a86.selectorLabels" . | nindent 6 }}
