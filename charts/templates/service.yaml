apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6e9f6ee7-6287-498b-80fc-c2d181bbbe1e.fullname" . }}
  labels:
    {{- include "go-echo6e9f6ee7-6287-498b-80fc-c2d181bbbe1e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6e9f6ee7-6287-498b-80fc-c2d181bbbe1e.selectorLabels" . | nindent 6 }}
