apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc508ae0a-8d71-4485-8ef2-024467087db9.fullname" . }}
  labels:
    {{- include "go-echoc508ae0a-8d71-4485-8ef2-024467087db9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc508ae0a-8d71-4485-8ef2-024467087db9.selectorLabels" . | nindent 6 }}
