apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4d28c419-e016-4222-9285-9f82cae6fe80.fullname" . }}
  labels:
    {{- include "go-echo4d28c419-e016-4222-9285-9f82cae6fe80.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4d28c419-e016-4222-9285-9f82cae6fe80.selectorLabels" . | nindent 6 }}
