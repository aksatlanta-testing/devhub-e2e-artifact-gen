apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo486a228d-cf67-4e52-87a2-4f537969d02a.fullname" . }}
  labels:
    {{- include "go-echo486a228d-cf67-4e52-87a2-4f537969d02a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo486a228d-cf67-4e52-87a2-4f537969d02a.selectorLabels" . | nindent 6 }}
