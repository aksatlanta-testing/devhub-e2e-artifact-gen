apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob00e93e3-b30b-414a-b07b-68ce174a40f6.fullname" . }}
  labels:
    {{- include "go-echob00e93e3-b30b-414a-b07b-68ce174a40f6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob00e93e3-b30b-414a-b07b-68ce174a40f6.selectorLabels" . | nindent 6 }}
