apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6d570add-2acc-4eb2-83a3-5c41de165b73.fullname" . }}
  labels:
    {{- include "go-echo6d570add-2acc-4eb2-83a3-5c41de165b73.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6d570add-2acc-4eb2-83a3-5c41de165b73.selectorLabels" . | nindent 6 }}
