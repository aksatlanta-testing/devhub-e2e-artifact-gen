apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2a6b0d67-033a-4a08-b6da-b5b8a3f3b929.fullname" . }}
  labels:
    {{- include "go-echo2a6b0d67-033a-4a08-b6da-b5b8a3f3b929.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2a6b0d67-033a-4a08-b6da-b5b8a3f3b929.selectorLabels" . | nindent 6 }}
