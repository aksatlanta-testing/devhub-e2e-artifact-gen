apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob171e109-f918-46fc-b35b-6556a84c8733.fullname" . }}
  labels:
    {{- include "go-echob171e109-f918-46fc-b35b-6556a84c8733.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob171e109-f918-46fc-b35b-6556a84c8733.selectorLabels" . | nindent 6 }}
