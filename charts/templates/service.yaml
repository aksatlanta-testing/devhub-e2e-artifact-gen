apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa11fda6a-a10d-488f-8440-f867f3260881.fullname" . }}
  labels:
    {{- include "go-echoa11fda6a-a10d-488f-8440-f867f3260881.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa11fda6a-a10d-488f-8440-f867f3260881.selectorLabels" . | nindent 6 }}
