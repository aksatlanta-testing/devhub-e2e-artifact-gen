apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof796aa54-5242-40a1-8f12-2c46daa6354f.fullname" . }}
  labels:
    {{- include "go-echof796aa54-5242-40a1-8f12-2c46daa6354f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof796aa54-5242-40a1-8f12-2c46daa6354f.selectorLabels" . | nindent 6 }}
