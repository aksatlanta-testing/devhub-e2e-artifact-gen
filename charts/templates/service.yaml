apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoce32f844-76d3-4580-902d-6f94c92eae95.fullname" . }}
  labels:
    {{- include "go-echoce32f844-76d3-4580-902d-6f94c92eae95.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoce32f844-76d3-4580-902d-6f94c92eae95.selectorLabels" . | nindent 6 }}
