apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo99ec1dca-4cce-4fa7-8fc5-1f5e9ba82931.fullname" . }}
  labels:
    {{- include "go-echo99ec1dca-4cce-4fa7-8fc5-1f5e9ba82931.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo99ec1dca-4cce-4fa7-8fc5-1f5e9ba82931.selectorLabels" . | nindent 6 }}
