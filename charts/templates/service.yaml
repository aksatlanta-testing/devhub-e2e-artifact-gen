apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7ea21c2b-4796-4b90-809b-4b3908e38245.fullname" . }}
  labels:
    {{- include "go-echo7ea21c2b-4796-4b90-809b-4b3908e38245.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7ea21c2b-4796-4b90-809b-4b3908e38245.selectorLabels" . | nindent 6 }}
