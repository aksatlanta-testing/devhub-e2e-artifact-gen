apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3906fc2c-07e8-4be7-82ee-0c2224b8ff52.fullname" . }}
  labels:
    {{- include "go-echo3906fc2c-07e8-4be7-82ee-0c2224b8ff52.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3906fc2c-07e8-4be7-82ee-0c2224b8ff52.selectorLabels" . | nindent 6 }}
