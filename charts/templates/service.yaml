apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob51bda00-22ed-4d1d-9ee2-844a5fa5b366.fullname" . }}
  labels:
    {{- include "go-echob51bda00-22ed-4d1d-9ee2-844a5fa5b366.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob51bda00-22ed-4d1d-9ee2-844a5fa5b366.selectorLabels" . | nindent 6 }}
