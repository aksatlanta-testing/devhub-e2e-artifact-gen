apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7e4572e4-cc1f-4341-8bff-89230e01aa4f.fullname" . }}
  labels:
    {{- include "go-echo7e4572e4-cc1f-4341-8bff-89230e01aa4f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7e4572e4-cc1f-4341-8bff-89230e01aa4f.selectorLabels" . | nindent 6 }}
