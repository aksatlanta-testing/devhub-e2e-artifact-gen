apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo17d717aa-2fe5-4349-83d1-5cb518cd79eb.fullname" . }}
  labels:
    {{- include "go-echo17d717aa-2fe5-4349-83d1-5cb518cd79eb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo17d717aa-2fe5-4349-83d1-5cb518cd79eb.selectorLabels" . | nindent 6 }}
