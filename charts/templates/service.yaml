apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6f0c60b2-2c41-46a6-94ce-09eca3a069f6.fullname" . }}
  labels:
    {{- include "go-echo6f0c60b2-2c41-46a6-94ce-09eca3a069f6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6f0c60b2-2c41-46a6-94ce-09eca3a069f6.selectorLabels" . | nindent 6 }}
