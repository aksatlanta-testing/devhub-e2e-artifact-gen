apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob911792b-de00-4182-a3d5-591de9f6f640.fullname" . }}
  labels:
    {{- include "go-echob911792b-de00-4182-a3d5-591de9f6f640.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob911792b-de00-4182-a3d5-591de9f6f640.selectorLabels" . | nindent 6 }}
