apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0c0e260a-ab7e-42ec-a5e3-38bef9df59d2.fullname" . }}
  labels:
    {{- include "go-echo0c0e260a-ab7e-42ec-a5e3-38bef9df59d2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0c0e260a-ab7e-42ec-a5e3-38bef9df59d2.selectorLabels" . | nindent 6 }}
