apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1fcf9d81-0bab-4a22-9631-4a0e29d60d35.fullname" . }}
  labels:
    {{- include "go-echo1fcf9d81-0bab-4a22-9631-4a0e29d60d35.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1fcf9d81-0bab-4a22-9631-4a0e29d60d35.selectorLabels" . | nindent 6 }}
