apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo64915f9e-5b79-46ae-a183-336f453a9b0b.fullname" . }}
  labels:
    {{- include "go-echo64915f9e-5b79-46ae-a183-336f453a9b0b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo64915f9e-5b79-46ae-a183-336f453a9b0b.selectorLabels" . | nindent 6 }}
