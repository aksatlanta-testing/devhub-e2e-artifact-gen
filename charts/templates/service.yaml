apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo382ec110-d612-4a83-ba7b-51ab5fd27fc9.fullname" . }}
  labels:
    {{- include "go-echo382ec110-d612-4a83-ba7b-51ab5fd27fc9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo382ec110-d612-4a83-ba7b-51ab5fd27fc9.selectorLabels" . | nindent 6 }}
