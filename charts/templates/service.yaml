apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe6640621-c6fd-47c2-8107-92a4ffdac7ee.fullname" . }}
  labels:
    {{- include "go-echoe6640621-c6fd-47c2-8107-92a4ffdac7ee.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe6640621-c6fd-47c2-8107-92a4ffdac7ee.selectorLabels" . | nindent 6 }}
