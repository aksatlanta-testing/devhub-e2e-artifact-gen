apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof4e7a3ce-0da1-4d2d-ade3-5bf21dfe8fde.fullname" . }}
  labels:
    {{- include "go-echof4e7a3ce-0da1-4d2d-ade3-5bf21dfe8fde.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof4e7a3ce-0da1-4d2d-ade3-5bf21dfe8fde.selectorLabels" . | nindent 6 }}
