apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8dc7e43c-7626-4734-9dcc-689ef79d9580.fullname" . }}
  labels:
    {{- include "go-echo8dc7e43c-7626-4734-9dcc-689ef79d9580.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8dc7e43c-7626-4734-9dcc-689ef79d9580.selectorLabels" . | nindent 6 }}
