apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo04364d76-da29-408d-ad32-2b7735a55c05.fullname" . }}
  labels:
    {{- include "go-echo04364d76-da29-408d-ad32-2b7735a55c05.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo04364d76-da29-408d-ad32-2b7735a55c05.selectorLabels" . | nindent 6 }}
