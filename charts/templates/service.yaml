apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo97c75a6f-7464-4e29-9351-13aa3b92a2e9.fullname" . }}
  labels:
    {{- include "go-echo97c75a6f-7464-4e29-9351-13aa3b92a2e9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo97c75a6f-7464-4e29-9351-13aa3b92a2e9.selectorLabels" . | nindent 6 }}
