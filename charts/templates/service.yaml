apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod3cb08a7-d56b-4332-a13f-3e2370d2581f.fullname" . }}
  labels:
    {{- include "go-echod3cb08a7-d56b-4332-a13f-3e2370d2581f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod3cb08a7-d56b-4332-a13f-3e2370d2581f.selectorLabels" . | nindent 6 }}
