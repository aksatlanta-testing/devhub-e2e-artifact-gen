apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoff37f519-7e4d-40e7-9342-0e2a2119ad33.fullname" . }}
  labels:
    {{- include "go-echoff37f519-7e4d-40e7-9342-0e2a2119ad33.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoff37f519-7e4d-40e7-9342-0e2a2119ad33.selectorLabels" . | nindent 6 }}
