apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo49e9edfd-9b97-428b-9d38-816ac0874bee.fullname" . }}
  labels:
    {{- include "go-echo49e9edfd-9b97-428b-9d38-816ac0874bee.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo49e9edfd-9b97-428b-9d38-816ac0874bee.selectorLabels" . | nindent 6 }}
