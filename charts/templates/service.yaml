apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3653f027-fb1c-4621-baf8-9994c62ffeeb.fullname" . }}
  labels:
    {{- include "go-echo3653f027-fb1c-4621-baf8-9994c62ffeeb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3653f027-fb1c-4621-baf8-9994c62ffeeb.selectorLabels" . | nindent 6 }}
