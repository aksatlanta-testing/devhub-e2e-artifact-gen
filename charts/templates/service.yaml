apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6fe642a4-9bfc-445b-b983-59228b78feb7.fullname" . }}
  labels:
    {{- include "go-echo6fe642a4-9bfc-445b-b983-59228b78feb7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6fe642a4-9bfc-445b-b983-59228b78feb7.selectorLabels" . | nindent 6 }}
