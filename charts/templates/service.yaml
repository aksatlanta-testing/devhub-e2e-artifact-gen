apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod611a3db-e9bd-4a20-a668-528414d09842.fullname" . }}
  labels:
    {{- include "go-echod611a3db-e9bd-4a20-a668-528414d09842.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod611a3db-e9bd-4a20-a668-528414d09842.selectorLabels" . | nindent 6 }}
