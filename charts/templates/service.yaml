apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodcaf856d-8238-4823-9cb3-653cef7cf5f7.fullname" . }}
  labels:
    {{- include "go-echodcaf856d-8238-4823-9cb3-653cef7cf5f7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodcaf856d-8238-4823-9cb3-653cef7cf5f7.selectorLabels" . | nindent 6 }}
