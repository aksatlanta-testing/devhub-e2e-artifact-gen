apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6a30fb32-54ed-4fe2-bbcb-1433fe568a58.fullname" . }}
  labels:
    {{- include "go-echo6a30fb32-54ed-4fe2-bbcb-1433fe568a58.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6a30fb32-54ed-4fe2-bbcb-1433fe568a58.selectorLabels" . | nindent 6 }}
