apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo36162708-ef5b-40de-834e-820d06b4b251.fullname" . }}
  labels:
    {{- include "go-echo36162708-ef5b-40de-834e-820d06b4b251.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo36162708-ef5b-40de-834e-820d06b4b251.selectorLabels" . | nindent 6 }}
