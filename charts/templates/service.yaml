apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo93ff28f6-77d2-4194-aad2-26dfc67f6efc.fullname" . }}
  labels:
    {{- include "go-echo93ff28f6-77d2-4194-aad2-26dfc67f6efc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo93ff28f6-77d2-4194-aad2-26dfc67f6efc.selectorLabels" . | nindent 6 }}
