apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3826a0ea-ae98-4d35-ba54-36f3251e60b8.fullname" . }}
  labels:
    {{- include "go-echo3826a0ea-ae98-4d35-ba54-36f3251e60b8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3826a0ea-ae98-4d35-ba54-36f3251e60b8.selectorLabels" . | nindent 6 }}
