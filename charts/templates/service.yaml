apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa596a658-cb4d-4620-ae1c-2c28c720cdce.fullname" . }}
  labels:
    {{- include "go-echoa596a658-cb4d-4620-ae1c-2c28c720cdce.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa596a658-cb4d-4620-ae1c-2c28c720cdce.selectorLabels" . | nindent 6 }}
