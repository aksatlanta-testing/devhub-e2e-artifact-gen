apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod6b2e3b7-1f82-418f-991b-fd30c20ee987.fullname" . }}
  labels:
    {{- include "go-echod6b2e3b7-1f82-418f-991b-fd30c20ee987.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod6b2e3b7-1f82-418f-991b-fd30c20ee987.selectorLabels" . | nindent 6 }}
