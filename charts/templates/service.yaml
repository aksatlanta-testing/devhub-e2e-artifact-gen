apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo739b2d45-4a01-4e46-ba5f-185695fd0c92.fullname" . }}
  labels:
    {{- include "go-echo739b2d45-4a01-4e46-ba5f-185695fd0c92.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo739b2d45-4a01-4e46-ba5f-185695fd0c92.selectorLabels" . | nindent 6 }}
