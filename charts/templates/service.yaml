apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo755b33c0-c520-4cc0-88cf-8df855ff9b8a.fullname" . }}
  labels:
    {{- include "go-echo755b33c0-c520-4cc0-88cf-8df855ff9b8a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo755b33c0-c520-4cc0-88cf-8df855ff9b8a.selectorLabels" . | nindent 6 }}
