apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoff950fbd-0f32-4c90-b984-1e3c68eb8074.fullname" . }}
  labels:
    {{- include "go-echoff950fbd-0f32-4c90-b984-1e3c68eb8074.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoff950fbd-0f32-4c90-b984-1e3c68eb8074.selectorLabels" . | nindent 6 }}
