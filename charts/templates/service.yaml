apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3c5d9186-c391-4adc-a0e7-d8a4cfde8a39.fullname" . }}
  labels:
    {{- include "go-echo3c5d9186-c391-4adc-a0e7-d8a4cfde8a39.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3c5d9186-c391-4adc-a0e7-d8a4cfde8a39.selectorLabels" . | nindent 6 }}
