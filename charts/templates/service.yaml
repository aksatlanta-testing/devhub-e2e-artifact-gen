apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo05b51102-e9b9-4f01-bc4c-d3587930c40d.fullname" . }}
  labels:
    {{- include "go-echo05b51102-e9b9-4f01-bc4c-d3587930c40d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo05b51102-e9b9-4f01-bc4c-d3587930c40d.selectorLabels" . | nindent 6 }}
