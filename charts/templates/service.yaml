apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3ffb9f34-190d-418e-92ea-92cff6981414.fullname" . }}
  labels:
    {{- include "go-echo3ffb9f34-190d-418e-92ea-92cff6981414.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3ffb9f34-190d-418e-92ea-92cff6981414.selectorLabels" . | nindent 6 }}
