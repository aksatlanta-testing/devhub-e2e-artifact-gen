apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe2b055b4-a79c-442e-93a7-550758d6252d.fullname" . }}
  labels:
    {{- include "go-echoe2b055b4-a79c-442e-93a7-550758d6252d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe2b055b4-a79c-442e-93a7-550758d6252d.selectorLabels" . | nindent 6 }}
