apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8bd7651a-e046-40d3-8e73-cb08c066b3df.fullname" . }}
  labels:
    {{- include "go-echo8bd7651a-e046-40d3-8e73-cb08c066b3df.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8bd7651a-e046-40d3-8e73-cb08c066b3df.selectorLabels" . | nindent 6 }}
