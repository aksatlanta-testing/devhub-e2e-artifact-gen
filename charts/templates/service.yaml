apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo96a1a8a9-1fa1-4b15-9a17-4422a22e6c79.fullname" . }}
  labels:
    {{- include "go-echo96a1a8a9-1fa1-4b15-9a17-4422a22e6c79.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo96a1a8a9-1fa1-4b15-9a17-4422a22e6c79.selectorLabels" . | nindent 6 }}
