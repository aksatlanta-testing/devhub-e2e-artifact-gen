apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo378e65de-ed03-4d81-99a3-40943bd6a5b6.fullname" . }}
  labels:
    {{- include "go-echo378e65de-ed03-4d81-99a3-40943bd6a5b6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo378e65de-ed03-4d81-99a3-40943bd6a5b6.selectorLabels" . | nindent 6 }}
