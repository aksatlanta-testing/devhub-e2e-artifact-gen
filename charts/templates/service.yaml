apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof75e30c5-33ea-4f3c-91b3-fa9f4f2bb2d4.fullname" . }}
  labels:
    {{- include "go-echof75e30c5-33ea-4f3c-91b3-fa9f4f2bb2d4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof75e30c5-33ea-4f3c-91b3-fa9f4f2bb2d4.selectorLabels" . | nindent 6 }}
