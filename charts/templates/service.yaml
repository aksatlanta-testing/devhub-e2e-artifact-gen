apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7c7f8da6-15b0-42a6-a6e0-6ec442832139.fullname" . }}
  labels:
    {{- include "go-echo7c7f8da6-15b0-42a6-a6e0-6ec442832139.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7c7f8da6-15b0-42a6-a6e0-6ec442832139.selectorLabels" . | nindent 6 }}
