apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo27f5d0c1-074e-4a5d-a4eb-25b841138de6.fullname" . }}
  labels:
    {{- include "go-echo27f5d0c1-074e-4a5d-a4eb-25b841138de6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo27f5d0c1-074e-4a5d-a4eb-25b841138de6.selectorLabels" . | nindent 6 }}
