apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo34b501f9-0ea4-4702-9cf7-a27cb1b7b2ed.fullname" . }}
  labels:
    {{- include "go-echo34b501f9-0ea4-4702-9cf7-a27cb1b7b2ed.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo34b501f9-0ea4-4702-9cf7-a27cb1b7b2ed.selectorLabels" . | nindent 6 }}
