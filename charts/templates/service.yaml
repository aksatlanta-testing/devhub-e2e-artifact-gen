apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo57148151-87b8-4d54-9e1c-8bea146c4178.fullname" . }}
  labels:
    {{- include "go-echo57148151-87b8-4d54-9e1c-8bea146c4178.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo57148151-87b8-4d54-9e1c-8bea146c4178.selectorLabels" . | nindent 6 }}
