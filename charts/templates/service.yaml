apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa5769ac7-b5a2-4fcc-a04b-13cf4c777bd9.fullname" . }}
  labels:
    {{- include "go-echoa5769ac7-b5a2-4fcc-a04b-13cf4c777bd9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa5769ac7-b5a2-4fcc-a04b-13cf4c777bd9.selectorLabels" . | nindent 6 }}
