apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofeeda93b-53c6-472a-90c5-f3955dad2aea.fullname" . }}
  labels:
    {{- include "go-echofeeda93b-53c6-472a-90c5-f3955dad2aea.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofeeda93b-53c6-472a-90c5-f3955dad2aea.selectorLabels" . | nindent 6 }}
