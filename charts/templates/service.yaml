apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo27ad81a5-8f84-4f9c-a1b5-95337f4798dc.fullname" . }}
  labels:
    {{- include "go-echo27ad81a5-8f84-4f9c-a1b5-95337f4798dc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo27ad81a5-8f84-4f9c-a1b5-95337f4798dc.selectorLabels" . | nindent 6 }}
