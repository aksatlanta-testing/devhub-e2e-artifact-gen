apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo94867f4e-40d8-4d3a-b5f5-fc464b34a87f.fullname" . }}
  labels:
    {{- include "go-echo94867f4e-40d8-4d3a-b5f5-fc464b34a87f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo94867f4e-40d8-4d3a-b5f5-fc464b34a87f.selectorLabels" . | nindent 6 }}
