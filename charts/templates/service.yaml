apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo009cee87-beca-426f-b8a4-2f19da10edc4.fullname" . }}
  labels:
    {{- include "go-echo009cee87-beca-426f-b8a4-2f19da10edc4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo009cee87-beca-426f-b8a4-2f19da10edc4.selectorLabels" . | nindent 6 }}
