apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0ac3c257-bd9f-4d79-9936-4816ab879cd8.fullname" . }}
  labels:
    {{- include "go-echo0ac3c257-bd9f-4d79-9936-4816ab879cd8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0ac3c257-bd9f-4d79-9936-4816ab879cd8.selectorLabels" . | nindent 6 }}
