apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoee404e81-b056-4ce6-9503-2c526f3edaf1.fullname" . }}
  labels:
    {{- include "go-echoee404e81-b056-4ce6-9503-2c526f3edaf1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoee404e81-b056-4ce6-9503-2c526f3edaf1.selectorLabels" . | nindent 6 }}
