apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo30b2930b-b043-46c2-8791-063bb9bc0268.fullname" . }}
  labels:
    {{- include "go-echo30b2930b-b043-46c2-8791-063bb9bc0268.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo30b2930b-b043-46c2-8791-063bb9bc0268.selectorLabels" . | nindent 6 }}
