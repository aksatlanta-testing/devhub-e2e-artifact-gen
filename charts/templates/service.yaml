apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo99cd7669-b95b-403f-83b6-d31d31735da5.fullname" . }}
  labels:
    {{- include "go-echo99cd7669-b95b-403f-83b6-d31d31735da5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo99cd7669-b95b-403f-83b6-d31d31735da5.selectorLabels" . | nindent 6 }}
