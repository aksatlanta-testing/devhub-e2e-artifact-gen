apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo70108fce-8cba-4788-af58-9cefc1cbee58.fullname" . }}
  labels:
    {{- include "go-echo70108fce-8cba-4788-af58-9cefc1cbee58.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo70108fce-8cba-4788-af58-9cefc1cbee58.selectorLabels" . | nindent 6 }}
