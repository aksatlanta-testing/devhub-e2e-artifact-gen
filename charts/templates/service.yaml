apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc6285e72-e0e8-474d-9872-6daf946c04c5.fullname" . }}
  labels:
    {{- include "go-echoc6285e72-e0e8-474d-9872-6daf946c04c5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc6285e72-e0e8-474d-9872-6daf946c04c5.selectorLabels" . | nindent 6 }}
