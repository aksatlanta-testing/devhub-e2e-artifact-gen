apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoabc94888-e6b7-46df-9ecb-a139eadae731.fullname" . }}
  labels:
    {{- include "go-echoabc94888-e6b7-46df-9ecb-a139eadae731.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoabc94888-e6b7-46df-9ecb-a139eadae731.selectorLabels" . | nindent 6 }}
