apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo853bd2a4-6d40-43d2-8c17-691122cc1be7.fullname" . }}
  labels:
    {{- include "go-echo853bd2a4-6d40-43d2-8c17-691122cc1be7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo853bd2a4-6d40-43d2-8c17-691122cc1be7.selectorLabels" . | nindent 6 }}
