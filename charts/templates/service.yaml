apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod529812c-2c62-419a-8e24-77b471915f3d.fullname" . }}
  labels:
    {{- include "go-echod529812c-2c62-419a-8e24-77b471915f3d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod529812c-2c62-419a-8e24-77b471915f3d.selectorLabels" . | nindent 6 }}
