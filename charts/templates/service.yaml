apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa883c448-d469-4e62-9010-40f6a337d132.fullname" . }}
  labels:
    {{- include "go-echoa883c448-d469-4e62-9010-40f6a337d132.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa883c448-d469-4e62-9010-40f6a337d132.selectorLabels" . | nindent 6 }}
