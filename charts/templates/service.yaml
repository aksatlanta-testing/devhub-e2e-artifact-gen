apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0f75b1fd-7914-47d1-a527-150588cf6cf4.fullname" . }}
  labels:
    {{- include "go-echo0f75b1fd-7914-47d1-a527-150588cf6cf4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0f75b1fd-7914-47d1-a527-150588cf6cf4.selectorLabels" . | nindent 6 }}
