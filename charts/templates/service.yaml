apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo02043d3e-f921-4101-aaea-7a356ce9be51.fullname" . }}
  labels:
    {{- include "go-echo02043d3e-f921-4101-aaea-7a356ce9be51.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo02043d3e-f921-4101-aaea-7a356ce9be51.selectorLabels" . | nindent 6 }}
