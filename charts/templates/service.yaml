apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo16ebd0b4-148f-4a47-8b2c-c387543653b7.fullname" . }}
  labels:
    {{- include "go-echo16ebd0b4-148f-4a47-8b2c-c387543653b7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo16ebd0b4-148f-4a47-8b2c-c387543653b7.selectorLabels" . | nindent 6 }}
