apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3c682170-a350-4a2a-8bba-21bc3a216fe7.fullname" . }}
  labels:
    {{- include "go-echo3c682170-a350-4a2a-8bba-21bc3a216fe7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3c682170-a350-4a2a-8bba-21bc3a216fe7.selectorLabels" . | nindent 6 }}
