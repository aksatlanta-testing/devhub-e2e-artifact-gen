apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo23e11025-f07f-47ac-a717-d7649e9cfa77.fullname" . }}
  labels:
    {{- include "go-echo23e11025-f07f-47ac-a717-d7649e9cfa77.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo23e11025-f07f-47ac-a717-d7649e9cfa77.selectorLabels" . | nindent 6 }}
