apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9431265c-16cc-456c-ac39-f79cb6a51097.fullname" . }}
  labels:
    {{- include "go-echo9431265c-16cc-456c-ac39-f79cb6a51097.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9431265c-16cc-456c-ac39-f79cb6a51097.selectorLabels" . | nindent 6 }}
