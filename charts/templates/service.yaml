apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof82fea14-92bc-4fb3-bd7d-789b72d90835.fullname" . }}
  labels:
    {{- include "go-echof82fea14-92bc-4fb3-bd7d-789b72d90835.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof82fea14-92bc-4fb3-bd7d-789b72d90835.selectorLabels" . | nindent 6 }}
