apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo312dc35e-9a17-4379-89d8-dfdcc6942dd2.fullname" . }}
  labels:
    {{- include "go-echo312dc35e-9a17-4379-89d8-dfdcc6942dd2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo312dc35e-9a17-4379-89d8-dfdcc6942dd2.selectorLabels" . | nindent 6 }}
