apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5bee1ef5-7ae9-4d96-9a2f-ff1e61765406.fullname" . }}
  labels:
    {{- include "go-echo5bee1ef5-7ae9-4d96-9a2f-ff1e61765406.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5bee1ef5-7ae9-4d96-9a2f-ff1e61765406.selectorLabels" . | nindent 6 }}
