apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaf6a5fb5-cb73-4728-891a-d4104ad21b20.fullname" . }}
  labels:
    {{- include "go-echoaf6a5fb5-cb73-4728-891a-d4104ad21b20.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaf6a5fb5-cb73-4728-891a-d4104ad21b20.selectorLabels" . | nindent 6 }}
