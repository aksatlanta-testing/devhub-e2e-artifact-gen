apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo97ad2670-303c-4921-a2a7-723200016f63.fullname" . }}
  labels:
    {{- include "go-echo97ad2670-303c-4921-a2a7-723200016f63.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo97ad2670-303c-4921-a2a7-723200016f63.selectorLabels" . | nindent 6 }}
