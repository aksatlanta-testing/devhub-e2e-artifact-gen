apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo53ff92b9-7976-45e2-818c-6f8a5378a308.fullname" . }}
  labels:
    {{- include "go-echo53ff92b9-7976-45e2-818c-6f8a5378a308.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo53ff92b9-7976-45e2-818c-6f8a5378a308.selectorLabels" . | nindent 6 }}
