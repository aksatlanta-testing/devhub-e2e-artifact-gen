apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9e18c685-c2f4-4f48-9dfc-28c0255662ca.fullname" . }}
  labels:
    {{- include "go-echo9e18c685-c2f4-4f48-9dfc-28c0255662ca.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9e18c685-c2f4-4f48-9dfc-28c0255662ca.selectorLabels" . | nindent 6 }}
