apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo938a0498-2571-49c0-8f62-151fe54f2632.fullname" . }}
  labels:
    {{- include "go-echo938a0498-2571-49c0-8f62-151fe54f2632.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
