apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo48314744-320b-4f7f-86e4-483cca502f96.fullname" . }}
  labels:
    {{- include "go-echo48314744-320b-4f7f-86e4-483cca502f96.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo48314744-320b-4f7f-86e4-483cca502f96.selectorLabels" . | nindent 6 }}
