apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocd2b2a14-84a2-43e0-886b-fb4044e26bbb.fullname" . }}
  labels:
    {{- include "go-echocd2b2a14-84a2-43e0-886b-fb4044e26bbb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocd2b2a14-84a2-43e0-886b-fb4044e26bbb.selectorLabels" . | nindent 6 }}
