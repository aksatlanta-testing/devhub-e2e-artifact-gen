apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobad34c26-299f-4559-afc7-80c69bccb42a.fullname" . }}
  labels:
    {{- include "go-echobad34c26-299f-4559-afc7-80c69bccb42a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobad34c26-299f-4559-afc7-80c69bccb42a.selectorLabels" . | nindent 6 }}
