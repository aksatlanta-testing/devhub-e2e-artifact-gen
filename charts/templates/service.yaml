apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe0c55052-ecd3-4711-a5df-3ab509a643a4.fullname" . }}
  labels:
    {{- include "go-echoe0c55052-ecd3-4711-a5df-3ab509a643a4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe0c55052-ecd3-4711-a5df-3ab509a643a4.selectorLabels" . | nindent 6 }}
