apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6a3dabc9-c196-439f-ae64-a52cbfbdab49.fullname" . }}
  labels:
    {{- include "go-echo6a3dabc9-c196-439f-ae64-a52cbfbdab49.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6a3dabc9-c196-439f-ae64-a52cbfbdab49.selectorLabels" . | nindent 6 }}
