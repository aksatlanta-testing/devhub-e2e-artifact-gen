apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa5c74583-11f6-4419-ae15-7d2b05153ec8.fullname" . }}
  labels:
    {{- include "go-echoa5c74583-11f6-4419-ae15-7d2b05153ec8.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa5c74583-11f6-4419-ae15-7d2b05153ec8.selectorLabels" . | nindent 6 }}
