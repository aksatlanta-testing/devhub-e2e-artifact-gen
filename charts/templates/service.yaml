apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa466c7dc-58e5-45cb-b1ab-8d0c1a67b87a.fullname" . }}
  labels:
    {{- include "go-echoa466c7dc-58e5-45cb-b1ab-8d0c1a67b87a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa466c7dc-58e5-45cb-b1ab-8d0c1a67b87a.selectorLabels" . | nindent 6 }}
