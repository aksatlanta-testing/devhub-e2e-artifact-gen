apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofbd21993-9f5f-4c3e-b916-148a1f0cf5c1.fullname" . }}
  labels:
    {{- include "go-echofbd21993-9f5f-4c3e-b916-148a1f0cf5c1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofbd21993-9f5f-4c3e-b916-148a1f0cf5c1.selectorLabels" . | nindent 6 }}
