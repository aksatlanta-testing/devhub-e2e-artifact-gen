apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod1301e35-6b47-42be-8336-4a87f0f44276.fullname" . }}
  labels:
    {{- include "go-echod1301e35-6b47-42be-8336-4a87f0f44276.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod1301e35-6b47-42be-8336-4a87f0f44276.selectorLabels" . | nindent 6 }}
