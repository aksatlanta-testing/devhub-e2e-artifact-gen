apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo300fde9f-4639-4eb8-ac69-cdaf0a505c27.fullname" . }}
  labels:
    {{- include "go-echo300fde9f-4639-4eb8-ac69-cdaf0a505c27.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo300fde9f-4639-4eb8-ac69-cdaf0a505c27.selectorLabels" . | nindent 6 }}
