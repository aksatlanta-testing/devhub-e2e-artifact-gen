apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodc9f36b5-355c-4703-a05f-d8f61b3b352b.fullname" . }}
  labels:
    {{- include "go-echodc9f36b5-355c-4703-a05f-d8f61b3b352b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodc9f36b5-355c-4703-a05f-d8f61b3b352b.selectorLabels" . | nindent 6 }}
