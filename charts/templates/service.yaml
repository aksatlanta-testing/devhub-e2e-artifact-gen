apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5e3e8d9b-30e1-4b52-be59-0ef204ff6f31.fullname" . }}
  labels:
    {{- include "go-echo5e3e8d9b-30e1-4b52-be59-0ef204ff6f31.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5e3e8d9b-30e1-4b52-be59-0ef204ff6f31.selectorLabels" . | nindent 6 }}
