apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6f2f057a-3c4f-44da-9806-7cddd3d7d019.fullname" . }}
  labels:
    {{- include "go-echo6f2f057a-3c4f-44da-9806-7cddd3d7d019.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6f2f057a-3c4f-44da-9806-7cddd3d7d019.selectorLabels" . | nindent 6 }}
