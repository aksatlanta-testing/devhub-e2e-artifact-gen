apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofbcabc87-7414-48a6-996c-b48a27ac34a1.fullname" . }}
  labels:
    {{- include "go-echofbcabc87-7414-48a6-996c-b48a27ac34a1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofbcabc87-7414-48a6-996c-b48a27ac34a1.selectorLabels" . | nindent 6 }}
