apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofbca1025-b592-4355-b56b-d17233384399.fullname" . }}
  labels:
    {{- include "go-echofbca1025-b592-4355-b56b-d17233384399.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofbca1025-b592-4355-b56b-d17233384399.selectorLabels" . | nindent 6 }}
