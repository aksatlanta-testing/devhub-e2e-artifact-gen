apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo79b272dd-69b6-417b-9f28-6b8214092db4.fullname" . }}
  labels:
    {{- include "go-echo79b272dd-69b6-417b-9f28-6b8214092db4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo79b272dd-69b6-417b-9f28-6b8214092db4.selectorLabels" . | nindent 6 }}
