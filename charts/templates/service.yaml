apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo94e638d6-71e3-452c-9fe1-b2659eb1a001.fullname" . }}
  labels:
    {{- include "go-echo94e638d6-71e3-452c-9fe1-b2659eb1a001.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo94e638d6-71e3-452c-9fe1-b2659eb1a001.selectorLabels" . | nindent 6 }}
