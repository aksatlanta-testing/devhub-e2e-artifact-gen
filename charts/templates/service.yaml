apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoeb9091a0-827b-471b-bca0-41b4376362dd.fullname" . }}
  labels:
    {{- include "go-echoeb9091a0-827b-471b-bca0-41b4376362dd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoeb9091a0-827b-471b-bca0-41b4376362dd.selectorLabels" . | nindent 6 }}
