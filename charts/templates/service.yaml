apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1dd2bf8a-a947-4bf3-9344-19be82642fc4.fullname" . }}
  labels:
    {{- include "go-echo1dd2bf8a-a947-4bf3-9344-19be82642fc4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1dd2bf8a-a947-4bf3-9344-19be82642fc4.selectorLabels" . | nindent 6 }}
