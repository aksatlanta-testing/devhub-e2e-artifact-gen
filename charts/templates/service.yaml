apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0e4827f9-61ae-421d-973b-28a13ca730cd.fullname" . }}
  labels:
    {{- include "go-echo0e4827f9-61ae-421d-973b-28a13ca730cd.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0e4827f9-61ae-421d-973b-28a13ca730cd.selectorLabels" . | nindent 6 }}
