apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3a8802e0-c25c-417d-af49-fd4b6f3c721f.fullname" . }}
  labels:
    {{- include "go-echo3a8802e0-c25c-417d-af49-fd4b6f3c721f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3a8802e0-c25c-417d-af49-fd4b6f3c721f.selectorLabels" . | nindent 6 }}
