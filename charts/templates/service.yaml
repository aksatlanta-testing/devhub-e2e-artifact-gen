apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobbfafba4-32ed-4858-8f2a-2104706cfef9.fullname" . }}
  labels:
    {{- include "go-echobbfafba4-32ed-4858-8f2a-2104706cfef9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobbfafba4-32ed-4858-8f2a-2104706cfef9.selectorLabels" . | nindent 6 }}
