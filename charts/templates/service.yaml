apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4cebbd3d-8444-4d55-aa92-25a2cddab12f.fullname" . }}
  labels:
    {{- include "go-echo4cebbd3d-8444-4d55-aa92-25a2cddab12f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4cebbd3d-8444-4d55-aa92-25a2cddab12f.selectorLabels" . | nindent 6 }}
