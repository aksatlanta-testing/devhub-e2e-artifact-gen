apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8fe8dd31-f2fc-48ed-8bb2-1c1833ca6f13.fullname" . }}
  labels:
    {{- include "go-echo8fe8dd31-f2fc-48ed-8bb2-1c1833ca6f13.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8fe8dd31-f2fc-48ed-8bb2-1c1833ca6f13.selectorLabels" . | nindent 6 }}
