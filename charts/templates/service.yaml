apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe5f258a0-dd41-41f4-b55b-d25f07f6b1d6.fullname" . }}
  labels:
    {{- include "go-echoe5f258a0-dd41-41f4-b55b-d25f07f6b1d6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe5f258a0-dd41-41f4-b55b-d25f07f6b1d6.selectorLabels" . | nindent 6 }}
