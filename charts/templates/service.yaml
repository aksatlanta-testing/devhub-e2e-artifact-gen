apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo10ebf737-3056-4325-9dd2-581c6902686a.fullname" . }}
  labels:
    {{- include "go-echo10ebf737-3056-4325-9dd2-581c6902686a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo10ebf737-3056-4325-9dd2-581c6902686a.selectorLabels" . | nindent 6 }}
