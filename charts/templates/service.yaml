apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe30efad4-7b6f-4b64-a3e0-7059a457bd9b.fullname" . }}
  labels:
    {{- include "go-echoe30efad4-7b6f-4b64-a3e0-7059a457bd9b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe30efad4-7b6f-4b64-a3e0-7059a457bd9b.selectorLabels" . | nindent 6 }}
