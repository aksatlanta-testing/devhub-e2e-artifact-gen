apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo01e0908f-68de-4132-8c13-0836881c12bb.fullname" . }}
  labels:
    {{- include "go-echo01e0908f-68de-4132-8c13-0836881c12bb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo01e0908f-68de-4132-8c13-0836881c12bb.selectorLabels" . | nindent 6 }}
