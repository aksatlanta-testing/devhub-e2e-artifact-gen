apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe1ff09c0-76c6-40b2-bbf0-b7c0c511f1ab.fullname" . }}
  labels:
    {{- include "go-echoe1ff09c0-76c6-40b2-bbf0-b7c0c511f1ab.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe1ff09c0-76c6-40b2-bbf0-b7c0c511f1ab.selectorLabels" . | nindent 6 }}
