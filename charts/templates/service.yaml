apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo59b887cb-35b5-4965-962a-7c97b6142932.fullname" . }}
  labels:
    {{- include "go-echo59b887cb-35b5-4965-962a-7c97b6142932.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo59b887cb-35b5-4965-962a-7c97b6142932.selectorLabels" . | nindent 6 }}
