apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8518a6f5-e7ef-4296-81d9-31e7c5d49419.fullname" . }}
  labels:
    {{- include "go-echo8518a6f5-e7ef-4296-81d9-31e7c5d49419.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8518a6f5-e7ef-4296-81d9-31e7c5d49419.selectorLabels" . | nindent 6 }}
