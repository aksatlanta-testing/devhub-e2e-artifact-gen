apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo81ffd170-dee0-4392-9ddb-5c56d3f3015d.fullname" . }}
  labels:
    {{- include "go-echo81ffd170-dee0-4392-9ddb-5c56d3f3015d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo81ffd170-dee0-4392-9ddb-5c56d3f3015d.selectorLabels" . | nindent 6 }}
