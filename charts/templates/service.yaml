apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoedf3b798-94a5-480b-9a03-583c26496642.fullname" . }}
  labels:
    {{- include "go-echoedf3b798-94a5-480b-9a03-583c26496642.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoedf3b798-94a5-480b-9a03-583c26496642.selectorLabels" . | nindent 6 }}
