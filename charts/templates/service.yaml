apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc784f91e-9677-48da-8f1f-462b65f430c8.fullname" . }}
  labels:
    {{- include "go-echoc784f91e-9677-48da-8f1f-462b65f430c8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc784f91e-9677-48da-8f1f-462b65f430c8.selectorLabels" . | nindent 6 }}
