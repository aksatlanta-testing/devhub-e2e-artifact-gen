apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo06fc44f8-97f2-43e6-b110-2c2f146ff70d.fullname" . }}
  labels:
    {{- include "go-echo06fc44f8-97f2-43e6-b110-2c2f146ff70d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo06fc44f8-97f2-43e6-b110-2c2f146ff70d.selectorLabels" . | nindent 6 }}
