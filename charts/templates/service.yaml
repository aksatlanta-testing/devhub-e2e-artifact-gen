apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo109c1d73-c599-4987-88b7-2f63fbacb02e.fullname" . }}
  labels:
    {{- include "go-echo109c1d73-c599-4987-88b7-2f63fbacb02e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo109c1d73-c599-4987-88b7-2f63fbacb02e.selectorLabels" . | nindent 6 }}
