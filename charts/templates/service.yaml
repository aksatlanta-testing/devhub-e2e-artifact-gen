apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3d568a0b-7768-4bf3-801d-adf18d1bce0b.fullname" . }}
  labels:
    {{- include "go-echo3d568a0b-7768-4bf3-801d-adf18d1bce0b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3d568a0b-7768-4bf3-801d-adf18d1bce0b.selectorLabels" . | nindent 6 }}
