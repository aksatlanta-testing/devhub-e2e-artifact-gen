apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo126a3304-ae4a-49b8-bdab-1af12f508459.fullname" . }}
  labels:
    {{- include "go-echo126a3304-ae4a-49b8-bdab-1af12f508459.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo126a3304-ae4a-49b8-bdab-1af12f508459.selectorLabels" . | nindent 6 }}
