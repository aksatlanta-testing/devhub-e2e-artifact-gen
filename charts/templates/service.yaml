apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo652d7692-7fa9-45b1-8152-afaf8ce1e479.fullname" . }}
  labels:
    {{- include "go-echo652d7692-7fa9-45b1-8152-afaf8ce1e479.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo652d7692-7fa9-45b1-8152-afaf8ce1e479.selectorLabels" . | nindent 6 }}
