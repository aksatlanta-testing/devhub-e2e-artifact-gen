apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof99102b3-ac9e-4479-8973-d220216eecb6.fullname" . }}
  labels:
    {{- include "go-echof99102b3-ac9e-4479-8973-d220216eecb6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof99102b3-ac9e-4479-8973-d220216eecb6.selectorLabels" . | nindent 6 }}
