apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa8574c33-a525-4a3a-b30b-8dfb75e5260a.fullname" . }}
  labels:
    {{- include "go-echoa8574c33-a525-4a3a-b30b-8dfb75e5260a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa8574c33-a525-4a3a-b30b-8dfb75e5260a.selectorLabels" . | nindent 6 }}
