apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo889911ff-0939-4e77-a788-0e340df1d3ae.fullname" . }}
  labels:
    {{- include "go-echo889911ff-0939-4e77-a788-0e340df1d3ae.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo889911ff-0939-4e77-a788-0e340df1d3ae.selectorLabels" . | nindent 6 }}
