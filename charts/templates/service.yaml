apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6c65c9f2-2e95-40f5-b0f5-3f77f2c4f45a.fullname" . }}
  labels:
    {{- include "go-echo6c65c9f2-2e95-40f5-b0f5-3f77f2c4f45a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6c65c9f2-2e95-40f5-b0f5-3f77f2c4f45a.selectorLabels" . | nindent 6 }}
