apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobd9883f8-3c21-484a-bb8d-3f72e7ce3252.fullname" . }}
  labels:
    {{- include "go-echobd9883f8-3c21-484a-bb8d-3f72e7ce3252.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobd9883f8-3c21-484a-bb8d-3f72e7ce3252.selectorLabels" . | nindent 6 }}
