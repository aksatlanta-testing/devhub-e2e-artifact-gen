apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo85bccf42-edbd-4203-a9a0-be73b553e76b.fullname" . }}
  labels:
    {{- include "go-echo85bccf42-edbd-4203-a9a0-be73b553e76b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo85bccf42-edbd-4203-a9a0-be73b553e76b.selectorLabels" . | nindent 6 }}
