apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobd349d4f-9d54-4c15-b456-c5c7b676f08a.fullname" . }}
  labels:
    {{- include "go-echobd349d4f-9d54-4c15-b456-c5c7b676f08a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobd349d4f-9d54-4c15-b456-c5c7b676f08a.selectorLabels" . | nindent 6 }}
