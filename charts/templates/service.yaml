apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo16cd8dd0-bba5-4d17-88f4-ad0a7b1c3ad6.fullname" . }}
  labels:
    {{- include "go-echo16cd8dd0-bba5-4d17-88f4-ad0a7b1c3ad6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo16cd8dd0-bba5-4d17-88f4-ad0a7b1c3ad6.selectorLabels" . | nindent 6 }}
