apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob3ac13ef-926c-4958-989e-8edb99f00c5a.fullname" . }}
  labels:
    {{- include "go-echob3ac13ef-926c-4958-989e-8edb99f00c5a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob3ac13ef-926c-4958-989e-8edb99f00c5a.selectorLabels" . | nindent 6 }}
