apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofe730125-c63e-4c61-b66d-30cbc28f99a7.fullname" . }}
  labels:
    {{- include "go-echofe730125-c63e-4c61-b66d-30cbc28f99a7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofe730125-c63e-4c61-b66d-30cbc28f99a7.selectorLabels" . | nindent 6 }}
