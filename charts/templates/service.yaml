apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4c46f0cc-325b-4e1d-8fbc-d5c882a297c4.fullname" . }}
  labels:
    {{- include "go-echo4c46f0cc-325b-4e1d-8fbc-d5c882a297c4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4c46f0cc-325b-4e1d-8fbc-d5c882a297c4.selectorLabels" . | nindent 6 }}
