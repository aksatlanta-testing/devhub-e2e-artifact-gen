apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4f10d93c-92e0-4026-907b-41342479acd6.fullname" . }}
  labels:
    {{- include "go-echo4f10d93c-92e0-4026-907b-41342479acd6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4f10d93c-92e0-4026-907b-41342479acd6.selectorLabels" . | nindent 6 }}
