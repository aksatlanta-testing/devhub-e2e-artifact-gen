apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodde1fbcc-4743-4b4a-a43a-b0e226998b6e.fullname" . }}
  labels:
    {{- include "go-echodde1fbcc-4743-4b4a-a43a-b0e226998b6e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodde1fbcc-4743-4b4a-a43a-b0e226998b6e.selectorLabels" . | nindent 6 }}
