apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof8314fd4-7c42-4d44-bc77-7ad513116122.fullname" . }}
  labels:
    {{- include "go-echof8314fd4-7c42-4d44-bc77-7ad513116122.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof8314fd4-7c42-4d44-bc77-7ad513116122.selectorLabels" . | nindent 6 }}
