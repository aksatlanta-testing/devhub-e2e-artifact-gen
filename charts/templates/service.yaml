apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodc26f63f-d291-46c6-a650-7d0bfb584dec.fullname" . }}
  labels:
    {{- include "go-echodc26f63f-d291-46c6-a650-7d0bfb584dec.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodc26f63f-d291-46c6-a650-7d0bfb584dec.selectorLabels" . | nindent 6 }}
