apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobed71f86-d577-4798-94f4-e0f39bc54dd6.fullname" . }}
  labels:
    {{- include "go-echobed71f86-d577-4798-94f4-e0f39bc54dd6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobed71f86-d577-4798-94f4-e0f39bc54dd6.selectorLabels" . | nindent 6 }}
