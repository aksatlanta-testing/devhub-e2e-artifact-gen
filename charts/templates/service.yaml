apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo61896c37-f01f-46b0-ba0a-2daebb49e268.fullname" . }}
  labels:
    {{- include "go-echo61896c37-f01f-46b0-ba0a-2daebb49e268.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo61896c37-f01f-46b0-ba0a-2daebb49e268.selectorLabels" . | nindent 6 }}
