apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofea89148-57dc-4800-8dec-aab78ab6fd85.fullname" . }}
  labels:
    {{- include "go-echofea89148-57dc-4800-8dec-aab78ab6fd85.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofea89148-57dc-4800-8dec-aab78ab6fd85.selectorLabels" . | nindent 6 }}
