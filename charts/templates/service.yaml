apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7c68cb15-2dec-444d-985f-9e37ad8bd011.fullname" . }}
  labels:
    {{- include "go-echo7c68cb15-2dec-444d-985f-9e37ad8bd011.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7c68cb15-2dec-444d-985f-9e37ad8bd011.selectorLabels" . | nindent 6 }}
