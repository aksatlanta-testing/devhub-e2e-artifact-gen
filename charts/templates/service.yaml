apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo68f7c8bb-9121-4bed-a1ff-1c083cc93c49.fullname" . }}
  labels:
    {{- include "go-echo68f7c8bb-9121-4bed-a1ff-1c083cc93c49.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo68f7c8bb-9121-4bed-a1ff-1c083cc93c49.selectorLabels" . | nindent 6 }}
