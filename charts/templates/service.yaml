apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8fc5aec5-1c42-4671-aaf3-41a25db9dc68.fullname" . }}
  labels:
    {{- include "go-echo8fc5aec5-1c42-4671-aaf3-41a25db9dc68.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8fc5aec5-1c42-4671-aaf3-41a25db9dc68.selectorLabels" . | nindent 6 }}
