apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo37a1bdf6-7378-42f1-b92a-1d6904b1c245.fullname" . }}
  labels:
    {{- include "go-echo37a1bdf6-7378-42f1-b92a-1d6904b1c245.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo37a1bdf6-7378-42f1-b92a-1d6904b1c245.selectorLabels" . | nindent 6 }}
