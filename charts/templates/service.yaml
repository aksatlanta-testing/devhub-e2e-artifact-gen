apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoab557d69-a286-4fb7-95ef-54779bf877d7.fullname" . }}
  labels:
    {{- include "go-echoab557d69-a286-4fb7-95ef-54779bf877d7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoab557d69-a286-4fb7-95ef-54779bf877d7.selectorLabels" . | nindent 6 }}
