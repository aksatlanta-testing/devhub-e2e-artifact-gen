apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9abb1309-8827-49fd-83c0-78a9c9e019cb.fullname" . }}
  labels:
    {{- include "go-echo9abb1309-8827-49fd-83c0-78a9c9e019cb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9abb1309-8827-49fd-83c0-78a9c9e019cb.selectorLabels" . | nindent 6 }}
