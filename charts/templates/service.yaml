apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo26567396-2cb6-4eb7-9bb7-c6b50b24f943.fullname" . }}
  labels:
    {{- include "go-echo26567396-2cb6-4eb7-9bb7-c6b50b24f943.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo26567396-2cb6-4eb7-9bb7-c6b50b24f943.selectorLabels" . | nindent 6 }}
