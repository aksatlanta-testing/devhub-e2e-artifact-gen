apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2677dcef-666d-4c62-a745-9e5648f3981e.fullname" . }}
  labels:
    {{- include "go-echo2677dcef-666d-4c62-a745-9e5648f3981e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2677dcef-666d-4c62-a745-9e5648f3981e.selectorLabels" . | nindent 6 }}
