apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob780f7f1-fe16-48be-bfd7-04782238b3d5.fullname" . }}
  labels:
    {{- include "go-echob780f7f1-fe16-48be-bfd7-04782238b3d5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob780f7f1-fe16-48be-bfd7-04782238b3d5.selectorLabels" . | nindent 6 }}
