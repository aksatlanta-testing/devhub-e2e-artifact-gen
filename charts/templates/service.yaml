apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofa438a34-2d17-475c-a20d-874b790b6513.fullname" . }}
  labels:
    {{- include "go-echofa438a34-2d17-475c-a20d-874b790b6513.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofa438a34-2d17-475c-a20d-874b790b6513.selectorLabels" . | nindent 6 }}
