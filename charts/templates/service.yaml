apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof6e4b3d7-41e4-4ba1-808a-81de78219866.fullname" . }}
  labels:
    {{- include "go-echof6e4b3d7-41e4-4ba1-808a-81de78219866.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof6e4b3d7-41e4-4ba1-808a-81de78219866.selectorLabels" . | nindent 6 }}
