apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob5032e9a-edd5-4ab1-b296-885c50a891a1.fullname" . }}
  labels:
    {{- include "go-echob5032e9a-edd5-4ab1-b296-885c50a891a1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob5032e9a-edd5-4ab1-b296-885c50a891a1.selectorLabels" . | nindent 6 }}
