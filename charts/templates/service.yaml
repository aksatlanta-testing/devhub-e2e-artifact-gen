apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo22cb4196-c8c0-49ab-b7ff-1061b376ef23.fullname" . }}
  labels:
    {{- include "go-echo22cb4196-c8c0-49ab-b7ff-1061b376ef23.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo22cb4196-c8c0-49ab-b7ff-1061b376ef23.selectorLabels" . | nindent 6 }}
