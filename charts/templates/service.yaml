apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo854d5c08-0566-4244-ba01-45cf05ececf0.fullname" . }}
  labels:
    {{- include "go-echo854d5c08-0566-4244-ba01-45cf05ececf0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo854d5c08-0566-4244-ba01-45cf05ececf0.selectorLabels" . | nindent 6 }}
