apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3e3b51e0-5ff6-4fa2-b840-cd579242221f.fullname" . }}
  labels:
    {{- include "go-echo3e3b51e0-5ff6-4fa2-b840-cd579242221f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3e3b51e0-5ff6-4fa2-b840-cd579242221f.selectorLabels" . | nindent 6 }}
