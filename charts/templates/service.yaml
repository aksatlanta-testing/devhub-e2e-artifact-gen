apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1e5937c1-d13a-4587-8304-278b99447f53.fullname" . }}
  labels:
    {{- include "go-echo1e5937c1-d13a-4587-8304-278b99447f53.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1e5937c1-d13a-4587-8304-278b99447f53.selectorLabels" . | nindent 6 }}
