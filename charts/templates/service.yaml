apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8155a75d-7945-4c90-ae1c-50081ae138ad.fullname" . }}
  labels:
    {{- include "go-echo8155a75d-7945-4c90-ae1c-50081ae138ad.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8155a75d-7945-4c90-ae1c-50081ae138ad.selectorLabels" . | nindent 6 }}
