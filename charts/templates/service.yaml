apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoab215038-d70d-4b48-a460-f066e22d6e64.fullname" . }}
  labels:
    {{- include "go-echoab215038-d70d-4b48-a460-f066e22d6e64.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoab215038-d70d-4b48-a460-f066e22d6e64.selectorLabels" . | nindent 6 }}
