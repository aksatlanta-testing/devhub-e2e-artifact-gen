apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoec0f81bd-278e-4165-9238-0b59a5438afc.fullname" . }}
  labels:
    {{- include "go-echoec0f81bd-278e-4165-9238-0b59a5438afc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoec0f81bd-278e-4165-9238-0b59a5438afc.selectorLabels" . | nindent 6 }}
