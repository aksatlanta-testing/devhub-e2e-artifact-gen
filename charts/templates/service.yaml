apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa34d5c27-0c03-40c8-bda6-8ddc0e42d5ae.fullname" . }}
  labels:
    {{- include "go-echoa34d5c27-0c03-40c8-bda6-8ddc0e42d5ae.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa34d5c27-0c03-40c8-bda6-8ddc0e42d5ae.selectorLabels" . | nindent 6 }}
