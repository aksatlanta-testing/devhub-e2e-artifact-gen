apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0a1b9045-d43f-415a-a23b-10d07d13e086.fullname" . }}
  labels:
    {{- include "go-echo0a1b9045-d43f-415a-a23b-10d07d13e086.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0a1b9045-d43f-415a-a23b-10d07d13e086.selectorLabels" . | nindent 6 }}
