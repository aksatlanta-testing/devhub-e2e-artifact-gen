apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof69a3822-522d-4b6e-aa1c-7561ca5b4b17.fullname" . }}
  labels:
    {{- include "go-echof69a3822-522d-4b6e-aa1c-7561ca5b4b17.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof69a3822-522d-4b6e-aa1c-7561ca5b4b17.selectorLabels" . | nindent 6 }}
