apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo77e3dd85-7931-44b4-8002-9ab1c59f6d8a.fullname" . }}
  labels:
    {{- include "go-echo77e3dd85-7931-44b4-8002-9ab1c59f6d8a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo77e3dd85-7931-44b4-8002-9ab1c59f6d8a.selectorLabels" . | nindent 6 }}
