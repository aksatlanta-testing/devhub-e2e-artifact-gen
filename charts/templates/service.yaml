apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod4d5d29b-8288-4077-a97c-09fd75a2bd96.fullname" . }}
  labels:
    {{- include "go-echod4d5d29b-8288-4077-a97c-09fd75a2bd96.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod4d5d29b-8288-4077-a97c-09fd75a2bd96.selectorLabels" . | nindent 6 }}
