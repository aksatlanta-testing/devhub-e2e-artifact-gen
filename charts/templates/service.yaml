apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa6eba013-c2cc-4825-9808-da237c12b003.fullname" . }}
  labels:
    {{- include "go-echoa6eba013-c2cc-4825-9808-da237c12b003.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa6eba013-c2cc-4825-9808-da237c12b003.selectorLabels" . | nindent 6 }}
