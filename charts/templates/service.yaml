apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo69ef061f-3f87-4eb9-92c5-aff615068ea3.fullname" . }}
  labels:
    {{- include "go-echo69ef061f-3f87-4eb9-92c5-aff615068ea3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo69ef061f-3f87-4eb9-92c5-aff615068ea3.selectorLabels" . | nindent 6 }}
