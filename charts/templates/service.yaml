apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3a6883b3-f0ac-42e9-b771-f13e175fcc98.fullname" . }}
  labels:
    {{- include "go-echo3a6883b3-f0ac-42e9-b771-f13e175fcc98.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3a6883b3-f0ac-42e9-b771-f13e175fcc98.selectorLabels" . | nindent 6 }}
