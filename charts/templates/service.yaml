apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocfcf5d7c-053d-4f66-bec8-2e9a0becb370.fullname" . }}
  labels:
    {{- include "go-echocfcf5d7c-053d-4f66-bec8-2e9a0becb370.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocfcf5d7c-053d-4f66-bec8-2e9a0becb370.selectorLabels" . | nindent 6 }}
