apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc2368c0a-3de2-4b9f-b9ca-cc6ff8e25b35.fullname" . }}
  labels:
    {{- include "go-echoc2368c0a-3de2-4b9f-b9ca-cc6ff8e25b35.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc2368c0a-3de2-4b9f-b9ca-cc6ff8e25b35.selectorLabels" . | nindent 6 }}
