apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofa6f79db-d7ee-4d13-8745-c5ad071289f8.fullname" . }}
  labels:
    {{- include "go-echofa6f79db-d7ee-4d13-8745-c5ad071289f8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofa6f79db-d7ee-4d13-8745-c5ad071289f8.selectorLabels" . | nindent 6 }}
