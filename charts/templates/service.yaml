apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob95fd56f-b040-4fff-bd38-7d56d75654c2.fullname" . }}
  labels:
    {{- include "go-echob95fd56f-b040-4fff-bd38-7d56d75654c2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob95fd56f-b040-4fff-bd38-7d56d75654c2.selectorLabels" . | nindent 6 }}
