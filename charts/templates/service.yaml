apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc3a99a07-c390-4c99-a268-a8ff4a5de400.fullname" . }}
  labels:
    {{- include "go-echoc3a99a07-c390-4c99-a268-a8ff4a5de400.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc3a99a07-c390-4c99-a268-a8ff4a5de400.selectorLabels" . | nindent 6 }}
