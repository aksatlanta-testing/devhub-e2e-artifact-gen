apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7503f1c0-98d7-4996-9f63-2348f84dcf1c.fullname" . }}
  labels:
    {{- include "go-echo7503f1c0-98d7-4996-9f63-2348f84dcf1c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7503f1c0-98d7-4996-9f63-2348f84dcf1c.selectorLabels" . | nindent 6 }}
