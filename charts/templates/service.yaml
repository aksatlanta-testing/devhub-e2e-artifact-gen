apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod55c3b45-cb6c-41f3-a271-c37f8431937c.fullname" . }}
  labels:
    {{- include "go-echod55c3b45-cb6c-41f3-a271-c37f8431937c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod55c3b45-cb6c-41f3-a271-c37f8431937c.selectorLabels" . | nindent 6 }}
