apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1df44110-469c-4c28-bf43-a77449594d74.fullname" . }}
  labels:
    {{- include "go-echo1df44110-469c-4c28-bf43-a77449594d74.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1df44110-469c-4c28-bf43-a77449594d74.selectorLabels" . | nindent 6 }}
