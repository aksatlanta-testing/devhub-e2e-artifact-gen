apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc27b77cd-04e4-4bd0-9906-ce0c38acae1f.fullname" . }}
  labels:
    {{- include "go-echoc27b77cd-04e4-4bd0-9906-ce0c38acae1f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc27b77cd-04e4-4bd0-9906-ce0c38acae1f.selectorLabels" . | nindent 6 }}
