apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3c96017f-140c-4b0b-bb3f-086410d042bf.fullname" . }}
  labels:
    {{- include "go-echo3c96017f-140c-4b0b-bb3f-086410d042bf.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3c96017f-140c-4b0b-bb3f-086410d042bf.selectorLabels" . | nindent 6 }}
