apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo56cce4a4-faeb-4df9-a217-79df2c403426.fullname" . }}
  labels:
    {{- include "go-echo56cce4a4-faeb-4df9-a217-79df2c403426.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo56cce4a4-faeb-4df9-a217-79df2c403426.selectorLabels" . | nindent 6 }}
