apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod560339c-6640-40e1-ba93-80d5e72d1836.fullname" . }}
  labels:
    {{- include "go-echod560339c-6640-40e1-ba93-80d5e72d1836.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod560339c-6640-40e1-ba93-80d5e72d1836.selectorLabels" . | nindent 6 }}
