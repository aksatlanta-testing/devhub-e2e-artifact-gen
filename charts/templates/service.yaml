apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0e1b3c9c-6204-4b6c-aed0-3ca6d45d0566.fullname" . }}
  labels:
    {{- include "go-echo0e1b3c9c-6204-4b6c-aed0-3ca6d45d0566.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0e1b3c9c-6204-4b6c-aed0-3ca6d45d0566.selectorLabels" . | nindent 6 }}
