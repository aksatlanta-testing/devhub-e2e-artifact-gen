apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1297ff65-1161-4d17-b87f-b97cf88ee89c.fullname" . }}
  labels:
    {{- include "go-echo1297ff65-1161-4d17-b87f-b97cf88ee89c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1297ff65-1161-4d17-b87f-b97cf88ee89c.selectorLabels" . | nindent 6 }}
