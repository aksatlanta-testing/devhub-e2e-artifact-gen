apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo20344bd0-6ad8-49e2-98ce-a014c063292c.fullname" . }}
  labels:
    {{- include "go-echo20344bd0-6ad8-49e2-98ce-a014c063292c.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo20344bd0-6ad8-49e2-98ce-a014c063292c.selectorLabels" . | nindent 6 }}
