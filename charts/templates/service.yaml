apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo75792a82-f1e0-46a2-a859-3361e444da94.fullname" . }}
  labels:
    {{- include "go-echo75792a82-f1e0-46a2-a859-3361e444da94.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo75792a82-f1e0-46a2-a859-3361e444da94.selectorLabels" . | nindent 6 }}
