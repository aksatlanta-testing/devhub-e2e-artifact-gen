apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo148647f7-de3e-499d-9f85-a60265a43c1c.fullname" . }}
  labels:
    {{- include "go-echo148647f7-de3e-499d-9f85-a60265a43c1c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo148647f7-de3e-499d-9f85-a60265a43c1c.selectorLabels" . | nindent 6 }}
