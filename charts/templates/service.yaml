apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoab35870a-03c7-49d5-9ae5-9808e9a962ea.fullname" . }}
  labels:
    {{- include "go-echoab35870a-03c7-49d5-9ae5-9808e9a962ea.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoab35870a-03c7-49d5-9ae5-9808e9a962ea.selectorLabels" . | nindent 6 }}
