apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof6105bd6-884b-4c8e-a91a-f099b5912b78.fullname" . }}
  labels:
    {{- include "go-echof6105bd6-884b-4c8e-a91a-f099b5912b78.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof6105bd6-884b-4c8e-a91a-f099b5912b78.selectorLabels" . | nindent 6 }}
