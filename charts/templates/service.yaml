apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofbb83042-83cf-47cc-82bf-031fe87d71be.fullname" . }}
  labels:
    {{- include "go-echofbb83042-83cf-47cc-82bf-031fe87d71be.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofbb83042-83cf-47cc-82bf-031fe87d71be.selectorLabels" . | nindent 6 }}
