apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3622f452-136e-4abf-8f90-6939a461a67c.fullname" . }}
  labels:
    {{- include "go-echo3622f452-136e-4abf-8f90-6939a461a67c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3622f452-136e-4abf-8f90-6939a461a67c.selectorLabels" . | nindent 6 }}
