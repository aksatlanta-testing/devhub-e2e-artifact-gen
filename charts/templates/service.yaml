apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobf43a7c6-d779-433d-a9e8-3beb0887e430.fullname" . }}
  labels:
    {{- include "go-echobf43a7c6-d779-433d-a9e8-3beb0887e430.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobf43a7c6-d779-433d-a9e8-3beb0887e430.selectorLabels" . | nindent 6 }}
