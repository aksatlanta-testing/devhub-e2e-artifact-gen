apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobace5d1e-27d7-4f91-809f-0cfca8ca3097.fullname" . }}
  labels:
    {{- include "go-echobace5d1e-27d7-4f91-809f-0cfca8ca3097.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobace5d1e-27d7-4f91-809f-0cfca8ca3097.selectorLabels" . | nindent 6 }}
