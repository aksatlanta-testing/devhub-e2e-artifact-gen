apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7f33e04d-648d-45f0-a23e-7c1117c412f6.fullname" . }}
  labels:
    {{- include "go-echo7f33e04d-648d-45f0-a23e-7c1117c412f6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7f33e04d-648d-45f0-a23e-7c1117c412f6.selectorLabels" . | nindent 6 }}
