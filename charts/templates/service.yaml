apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9c3d337a-b88a-498b-861e-3f38acf699d9.fullname" . }}
  labels:
    {{- include "go-echo9c3d337a-b88a-498b-861e-3f38acf699d9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9c3d337a-b88a-498b-861e-3f38acf699d9.selectorLabels" . | nindent 6 }}
