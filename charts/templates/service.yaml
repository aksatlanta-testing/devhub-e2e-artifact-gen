apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6364d2f6-00e2-4c2c-b0a9-9eb060eb6f49.fullname" . }}
  labels:
    {{- include "go-echo6364d2f6-00e2-4c2c-b0a9-9eb060eb6f49.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6364d2f6-00e2-4c2c-b0a9-9eb060eb6f49.selectorLabels" . | nindent 6 }}
