apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo979ed00a-a5ed-49c7-abae-94305c48e622.fullname" . }}
  labels:
    {{- include "go-echo979ed00a-a5ed-49c7-abae-94305c48e622.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo979ed00a-a5ed-49c7-abae-94305c48e622.selectorLabels" . | nindent 6 }}
