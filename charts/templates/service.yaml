apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo728959d6-623f-474a-8be5-f9b0f1a99116.fullname" . }}
  labels:
    {{- include "go-echo728959d6-623f-474a-8be5-f9b0f1a99116.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo728959d6-623f-474a-8be5-f9b0f1a99116.selectorLabels" . | nindent 6 }}
