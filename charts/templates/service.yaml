apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe729f2bb-3a5a-4143-8405-93b5e71037f9.fullname" . }}
  labels:
    {{- include "go-echoe729f2bb-3a5a-4143-8405-93b5e71037f9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe729f2bb-3a5a-4143-8405-93b5e71037f9.selectorLabels" . | nindent 6 }}
