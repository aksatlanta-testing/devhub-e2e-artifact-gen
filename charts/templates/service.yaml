apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4da47a1b-e7c2-4919-9d84-0bd29571f558.fullname" . }}
  labels:
    {{- include "go-echo4da47a1b-e7c2-4919-9d84-0bd29571f558.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4da47a1b-e7c2-4919-9d84-0bd29571f558.selectorLabels" . | nindent 6 }}
