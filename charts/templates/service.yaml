apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo91a8d3e8-13cc-4455-9833-3c2faee661d4.fullname" . }}
  labels:
    {{- include "go-echo91a8d3e8-13cc-4455-9833-3c2faee661d4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo91a8d3e8-13cc-4455-9833-3c2faee661d4.selectorLabels" . | nindent 6 }}
