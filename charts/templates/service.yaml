apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5ec537c8-6cd4-421c-82e9-faf8ff6813db.fullname" . }}
  labels:
    {{- include "go-echo5ec537c8-6cd4-421c-82e9-faf8ff6813db.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5ec537c8-6cd4-421c-82e9-faf8ff6813db.selectorLabels" . | nindent 6 }}
