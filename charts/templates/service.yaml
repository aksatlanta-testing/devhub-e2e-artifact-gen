apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo95da6e61-3ac9-430a-9b97-5a4927be36ee.fullname" . }}
  labels:
    {{- include "go-echo95da6e61-3ac9-430a-9b97-5a4927be36ee.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo95da6e61-3ac9-430a-9b97-5a4927be36ee.selectorLabels" . | nindent 6 }}
