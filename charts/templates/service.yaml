apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0a5d5205-7e97-44db-bad7-3a61fcb2b43d.fullname" . }}
  labels:
    {{- include "go-echo0a5d5205-7e97-44db-bad7-3a61fcb2b43d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0a5d5205-7e97-44db-bad7-3a61fcb2b43d.selectorLabels" . | nindent 6 }}
