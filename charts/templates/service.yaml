apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo953ba48c-51f1-4df7-9b27-111d2986c128.fullname" . }}
  labels:
    {{- include "go-echo953ba48c-51f1-4df7-9b27-111d2986c128.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo953ba48c-51f1-4df7-9b27-111d2986c128.selectorLabels" . | nindent 6 }}
