apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc851c915-daf1-404d-a313-d23d826bc3e5.fullname" . }}
  labels:
    {{- include "go-echoc851c915-daf1-404d-a313-d23d826bc3e5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc851c915-daf1-404d-a313-d23d826bc3e5.selectorLabels" . | nindent 6 }}
