apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob1beb8b1-72fb-43f3-b00b-f82c8d521700.fullname" . }}
  labels:
    {{- include "go-echob1beb8b1-72fb-43f3-b00b-f82c8d521700.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob1beb8b1-72fb-43f3-b00b-f82c8d521700.selectorLabels" . | nindent 6 }}
