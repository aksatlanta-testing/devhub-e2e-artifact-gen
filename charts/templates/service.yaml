apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoff540889-1856-4962-ab12-4e2275a5b945.fullname" . }}
  labels:
    {{- include "go-echoff540889-1856-4962-ab12-4e2275a5b945.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoff540889-1856-4962-ab12-4e2275a5b945.selectorLabels" . | nindent 6 }}
