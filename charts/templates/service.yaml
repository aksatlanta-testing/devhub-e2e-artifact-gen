apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa98eb09d-f79c-439e-88b4-fd8998321c83.fullname" . }}
  labels:
    {{- include "go-echoa98eb09d-f79c-439e-88b4-fd8998321c83.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa98eb09d-f79c-439e-88b4-fd8998321c83.selectorLabels" . | nindent 6 }}
