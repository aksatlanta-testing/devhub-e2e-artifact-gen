apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo408fc9ad-8076-4798-8001-1c7be582356a.fullname" . }}
  labels:
    {{- include "go-echo408fc9ad-8076-4798-8001-1c7be582356a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo408fc9ad-8076-4798-8001-1c7be582356a.selectorLabels" . | nindent 6 }}
