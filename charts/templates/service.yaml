apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo06e8bd8a-093a-4de0-b0b3-b84f8f857454.fullname" . }}
  labels:
    {{- include "go-echo06e8bd8a-093a-4de0-b0b3-b84f8f857454.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo06e8bd8a-093a-4de0-b0b3-b84f8f857454.selectorLabels" . | nindent 6 }}
