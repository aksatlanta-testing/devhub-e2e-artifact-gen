apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3007b357-62c3-4eef-8043-9b261661dd77.fullname" . }}
  labels:
    {{- include "go-echo3007b357-62c3-4eef-8043-9b261661dd77.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3007b357-62c3-4eef-8043-9b261661dd77.selectorLabels" . | nindent 6 }}
