apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo394bce31-12d2-4c0d-8794-018a7dd0dbf6.fullname" . }}
  labels:
    {{- include "go-echo394bce31-12d2-4c0d-8794-018a7dd0dbf6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo394bce31-12d2-4c0d-8794-018a7dd0dbf6.selectorLabels" . | nindent 6 }}
