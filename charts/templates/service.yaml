apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo56245217-bd74-4fc4-8a02-eb0e634f9c35.fullname" . }}
  labels:
    {{- include "go-echo56245217-bd74-4fc4-8a02-eb0e634f9c35.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo56245217-bd74-4fc4-8a02-eb0e634f9c35.selectorLabels" . | nindent 6 }}
