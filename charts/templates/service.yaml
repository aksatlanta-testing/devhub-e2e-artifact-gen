apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob04ef94e-3284-4e6b-ad62-4823cf8a1635.fullname" . }}
  labels:
    {{- include "go-echob04ef94e-3284-4e6b-ad62-4823cf8a1635.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob04ef94e-3284-4e6b-ad62-4823cf8a1635.selectorLabels" . | nindent 6 }}
