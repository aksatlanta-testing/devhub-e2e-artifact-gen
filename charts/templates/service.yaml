apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe19d8f67-57ef-4c7d-99cd-91d69b01e579.fullname" . }}
  labels:
    {{- include "go-echoe19d8f67-57ef-4c7d-99cd-91d69b01e579.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe19d8f67-57ef-4c7d-99cd-91d69b01e579.selectorLabels" . | nindent 6 }}
