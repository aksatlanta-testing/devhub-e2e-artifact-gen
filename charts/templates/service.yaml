apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6e3e3ba8-0932-4d32-b020-2cfb2f83289f.fullname" . }}
  labels:
    {{- include "go-echo6e3e3ba8-0932-4d32-b020-2cfb2f83289f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6e3e3ba8-0932-4d32-b020-2cfb2f83289f.selectorLabels" . | nindent 6 }}
