apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3effdf9e-ac39-47bb-8b4f-e7b701ca773d.fullname" . }}
  labels:
    {{- include "go-echo3effdf9e-ac39-47bb-8b4f-e7b701ca773d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3effdf9e-ac39-47bb-8b4f-e7b701ca773d.selectorLabels" . | nindent 6 }}
