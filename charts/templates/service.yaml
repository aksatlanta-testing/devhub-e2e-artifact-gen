apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3356ce97-c613-4eae-bacb-529119ff6be6.fullname" . }}
  labels:
    {{- include "go-echo3356ce97-c613-4eae-bacb-529119ff6be6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3356ce97-c613-4eae-bacb-529119ff6be6.selectorLabels" . | nindent 6 }}
