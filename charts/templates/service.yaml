apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8d77cb35-9973-4689-a281-0b0b532a6cc8.fullname" . }}
  labels:
    {{- include "go-echo8d77cb35-9973-4689-a281-0b0b532a6cc8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8d77cb35-9973-4689-a281-0b0b532a6cc8.selectorLabels" . | nindent 6 }}
