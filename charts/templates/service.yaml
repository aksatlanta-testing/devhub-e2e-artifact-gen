apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodd5c8247-0c68-4fa5-9822-b0371bba05e2.fullname" . }}
  labels:
    {{- include "go-echodd5c8247-0c68-4fa5-9822-b0371bba05e2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodd5c8247-0c68-4fa5-9822-b0371bba05e2.selectorLabels" . | nindent 6 }}
