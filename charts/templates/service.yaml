apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo17401c7f-2b91-47ee-ae98-9fca46eb63c4.fullname" . }}
  labels:
    {{- include "go-echo17401c7f-2b91-47ee-ae98-9fca46eb63c4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo17401c7f-2b91-47ee-ae98-9fca46eb63c4.selectorLabels" . | nindent 6 }}
