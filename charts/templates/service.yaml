apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4e78d0c8-d424-420c-8b14-f80be4254de1.fullname" . }}
  labels:
    {{- include "go-echo4e78d0c8-d424-420c-8b14-f80be4254de1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4e78d0c8-d424-420c-8b14-f80be4254de1.selectorLabels" . | nindent 6 }}
