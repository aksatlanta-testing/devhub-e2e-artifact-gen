apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof8caef3e-4e02-4791-8052-c095a121f3c2.fullname" . }}
  labels:
    {{- include "go-echof8caef3e-4e02-4791-8052-c095a121f3c2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof8caef3e-4e02-4791-8052-c095a121f3c2.selectorLabels" . | nindent 6 }}
