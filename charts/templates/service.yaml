apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof68b6bab-6373-4671-806a-edb6bbbf53da.fullname" . }}
  labels:
    {{- include "go-echof68b6bab-6373-4671-806a-edb6bbbf53da.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof68b6bab-6373-4671-806a-edb6bbbf53da.selectorLabels" . | nindent 6 }}
