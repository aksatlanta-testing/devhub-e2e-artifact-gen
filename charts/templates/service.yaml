apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo37a1a84f-7de1-47c6-b311-f9ce438743be.fullname" . }}
  labels:
    {{- include "go-echo37a1a84f-7de1-47c6-b311-f9ce438743be.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo37a1a84f-7de1-47c6-b311-f9ce438743be.selectorLabels" . | nindent 6 }}
