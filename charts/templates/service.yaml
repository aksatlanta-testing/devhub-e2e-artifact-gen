apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0717cca4-73b6-4ce0-9557-48684bca3b1c.fullname" . }}
  labels:
    {{- include "go-echo0717cca4-73b6-4ce0-9557-48684bca3b1c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0717cca4-73b6-4ce0-9557-48684bca3b1c.selectorLabels" . | nindent 6 }}
