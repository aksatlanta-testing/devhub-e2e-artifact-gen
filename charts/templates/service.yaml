apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof75d2f5a-de6e-470c-adbe-91ccc866f8b4.fullname" . }}
  labels:
    {{- include "go-echof75d2f5a-de6e-470c-adbe-91ccc866f8b4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof75d2f5a-de6e-470c-adbe-91ccc866f8b4.selectorLabels" . | nindent 6 }}
