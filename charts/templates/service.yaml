apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo67ce5888-5999-43a0-9464-2e7492307de0.fullname" . }}
  labels:
    {{- include "go-echo67ce5888-5999-43a0-9464-2e7492307de0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo67ce5888-5999-43a0-9464-2e7492307de0.selectorLabels" . | nindent 6 }}
