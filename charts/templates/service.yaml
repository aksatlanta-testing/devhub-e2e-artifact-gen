apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7135cc7c-c9e8-481d-9f42-bfd5cf5b6bc3.fullname" . }}
  labels:
    {{- include "go-echo7135cc7c-c9e8-481d-9f42-bfd5cf5b6bc3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7135cc7c-c9e8-481d-9f42-bfd5cf5b6bc3.selectorLabels" . | nindent 6 }}
