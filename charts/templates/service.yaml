apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo77b0aabb-632e-433e-9d37-3b193935a98f.fullname" . }}
  labels:
    {{- include "go-echo77b0aabb-632e-433e-9d37-3b193935a98f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo77b0aabb-632e-433e-9d37-3b193935a98f.selectorLabels" . | nindent 6 }}
