apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7c453873-71f3-4058-8f78-f5b5527fc5dd.fullname" . }}
  labels:
    {{- include "go-echo7c453873-71f3-4058-8f78-f5b5527fc5dd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7c453873-71f3-4058-8f78-f5b5527fc5dd.selectorLabels" . | nindent 6 }}
