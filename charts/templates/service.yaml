apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof4ec7b33-13c2-4de4-a72f-960756e40758.fullname" . }}
  labels:
    {{- include "go-echof4ec7b33-13c2-4de4-a72f-960756e40758.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof4ec7b33-13c2-4de4-a72f-960756e40758.selectorLabels" . | nindent 6 }}
