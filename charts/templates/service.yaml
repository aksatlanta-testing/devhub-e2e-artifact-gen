apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0b1d1124-5a60-4676-ac9c-47ff43cf4030.fullname" . }}
  labels:
    {{- include "go-echo0b1d1124-5a60-4676-ac9c-47ff43cf4030.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0b1d1124-5a60-4676-ac9c-47ff43cf4030.selectorLabels" . | nindent 6 }}
