apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob6850726-97a3-4501-bbed-87d7df6759d4.fullname" . }}
  labels:
    {{- include "go-echob6850726-97a3-4501-bbed-87d7df6759d4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob6850726-97a3-4501-bbed-87d7df6759d4.selectorLabels" . | nindent 6 }}
