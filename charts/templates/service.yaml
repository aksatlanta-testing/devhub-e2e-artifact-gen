apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4bac720a-fa02-496c-831c-96bb213461ea.fullname" . }}
  labels:
    {{- include "go-echo4bac720a-fa02-496c-831c-96bb213461ea.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4bac720a-fa02-496c-831c-96bb213461ea.selectorLabels" . | nindent 6 }}
