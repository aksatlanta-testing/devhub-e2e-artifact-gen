apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaf8cd6ea-079b-473e-b0a8-9a1f344be4dc.fullname" . }}
  labels:
    {{- include "go-echoaf8cd6ea-079b-473e-b0a8-9a1f344be4dc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaf8cd6ea-079b-473e-b0a8-9a1f344be4dc.selectorLabels" . | nindent 6 }}
