apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2f190ae7-8681-4164-bd51-7094f05d89a6.fullname" . }}
  labels:
    {{- include "go-echo2f190ae7-8681-4164-bd51-7094f05d89a6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2f190ae7-8681-4164-bd51-7094f05d89a6.selectorLabels" . | nindent 6 }}
