apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof1a0549a-220a-4cc2-9553-8bdc9f0ba073.fullname" . }}
  labels:
    {{- include "go-echof1a0549a-220a-4cc2-9553-8bdc9f0ba073.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof1a0549a-220a-4cc2-9553-8bdc9f0ba073.selectorLabels" . | nindent 6 }}
