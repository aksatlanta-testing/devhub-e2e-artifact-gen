apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo21610933-6cbe-445e-a8e5-08d5dd33bc1b.fullname" . }}
  labels:
    {{- include "go-echo21610933-6cbe-445e-a8e5-08d5dd33bc1b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo21610933-6cbe-445e-a8e5-08d5dd33bc1b.selectorLabels" . | nindent 6 }}
