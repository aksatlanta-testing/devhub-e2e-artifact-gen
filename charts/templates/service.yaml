apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe5d9ca67-08a9-4428-be1e-ecaac035c8d3.fullname" . }}
  labels:
    {{- include "go-echoe5d9ca67-08a9-4428-be1e-ecaac035c8d3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe5d9ca67-08a9-4428-be1e-ecaac035c8d3.selectorLabels" . | nindent 6 }}
