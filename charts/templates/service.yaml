apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8f360673-017f-4e69-acd9-8df04730fd8c.fullname" . }}
  labels:
    {{- include "go-echo8f360673-017f-4e69-acd9-8df04730fd8c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8f360673-017f-4e69-acd9-8df04730fd8c.selectorLabels" . | nindent 6 }}
