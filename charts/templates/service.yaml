apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2637ce79-8b82-49fe-b6fa-8f5e8009df87.fullname" . }}
  labels:
    {{- include "go-echo2637ce79-8b82-49fe-b6fa-8f5e8009df87.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2637ce79-8b82-49fe-b6fa-8f5e8009df87.selectorLabels" . | nindent 6 }}
