apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5c5795ce-989c-472e-92f2-211f2d456c16.fullname" . }}
  labels:
    {{- include "go-echo5c5795ce-989c-472e-92f2-211f2d456c16.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5c5795ce-989c-472e-92f2-211f2d456c16.selectorLabels" . | nindent 6 }}
