apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo53194578-4479-49dd-acb1-696688bc8b13.fullname" . }}
  labels:
    {{- include "go-echo53194578-4479-49dd-acb1-696688bc8b13.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo53194578-4479-49dd-acb1-696688bc8b13.selectorLabels" . | nindent 6 }}
