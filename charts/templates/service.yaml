apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa7ea8f70-076b-49fe-97e5-7f568fe520c2.fullname" . }}
  labels:
    {{- include "go-echoa7ea8f70-076b-49fe-97e5-7f568fe520c2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa7ea8f70-076b-49fe-97e5-7f568fe520c2.selectorLabels" . | nindent 6 }}
