apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe8c1daec-85ef-4ec6-9a4c-b57fc4359d0c.fullname" . }}
  labels:
    {{- include "go-echoe8c1daec-85ef-4ec6-9a4c-b57fc4359d0c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe8c1daec-85ef-4ec6-9a4c-b57fc4359d0c.selectorLabels" . | nindent 6 }}
