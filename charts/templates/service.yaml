apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof7872733-8130-4665-801d-dca7406f622a.fullname" . }}
  labels:
    {{- include "go-echof7872733-8130-4665-801d-dca7406f622a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof7872733-8130-4665-801d-dca7406f622a.selectorLabels" . | nindent 6 }}
