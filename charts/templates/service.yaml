apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7c3f69e7-4ddb-45dc-9628-c0727415a949.fullname" . }}
  labels:
    {{- include "go-echo7c3f69e7-4ddb-45dc-9628-c0727415a949.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7c3f69e7-4ddb-45dc-9628-c0727415a949.selectorLabels" . | nindent 6 }}
