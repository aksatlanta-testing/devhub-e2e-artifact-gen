apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3905357d-5819-4d7b-9cd4-c60e10fa5ac6.fullname" . }}
  labels:
    {{- include "go-echo3905357d-5819-4d7b-9cd4-c60e10fa5ac6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3905357d-5819-4d7b-9cd4-c60e10fa5ac6.selectorLabels" . | nindent 6 }}
