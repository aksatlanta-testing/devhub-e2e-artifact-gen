apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa34b484b-523c-4921-94a4-6878166be624.fullname" . }}
  labels:
    {{- include "go-echoa34b484b-523c-4921-94a4-6878166be624.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa34b484b-523c-4921-94a4-6878166be624.selectorLabels" . | nindent 6 }}
