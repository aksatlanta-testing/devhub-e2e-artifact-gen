apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo529cf7ca-c01a-4b6c-ac9e-3aa180b8ff30.fullname" . }}
  labels:
    {{- include "go-echo529cf7ca-c01a-4b6c-ac9e-3aa180b8ff30.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo529cf7ca-c01a-4b6c-ac9e-3aa180b8ff30.selectorLabels" . | nindent 6 }}
