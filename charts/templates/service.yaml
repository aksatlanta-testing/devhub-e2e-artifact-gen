apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo25778b77-5c9d-4cce-b510-6520b3df60e8.fullname" . }}
  labels:
    {{- include "go-echo25778b77-5c9d-4cce-b510-6520b3df60e8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo25778b77-5c9d-4cce-b510-6520b3df60e8.selectorLabels" . | nindent 6 }}
