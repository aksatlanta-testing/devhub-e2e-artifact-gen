apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo761a76d9-ca42-461e-832b-eff22982dde2.fullname" . }}
  labels:
    {{- include "go-echo761a76d9-ca42-461e-832b-eff22982dde2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo761a76d9-ca42-461e-832b-eff22982dde2.selectorLabels" . | nindent 6 }}
