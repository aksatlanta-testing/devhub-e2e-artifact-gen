apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofc9c3df0-7164-44f0-a91e-153bf255f013.fullname" . }}
  labels:
    {{- include "go-echofc9c3df0-7164-44f0-a91e-153bf255f013.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofc9c3df0-7164-44f0-a91e-153bf255f013.selectorLabels" . | nindent 6 }}
