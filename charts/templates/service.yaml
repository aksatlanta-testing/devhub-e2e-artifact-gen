apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa3479a84-228d-4ef4-a6aa-b7622dbe3b1a.fullname" . }}
  labels:
    {{- include "go-echoa3479a84-228d-4ef4-a6aa-b7622dbe3b1a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa3479a84-228d-4ef4-a6aa-b7622dbe3b1a.selectorLabels" . | nindent 6 }}
