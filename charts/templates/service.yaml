apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe4332e7f-84c8-4d0b-b2ad-9075a43eba89.fullname" . }}
  labels:
    {{- include "go-echoe4332e7f-84c8-4d0b-b2ad-9075a43eba89.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe4332e7f-84c8-4d0b-b2ad-9075a43eba89.selectorLabels" . | nindent 6 }}
