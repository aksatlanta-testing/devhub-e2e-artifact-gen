apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6aef0496-db53-4472-a008-84e72562a371.fullname" . }}
  labels:
    {{- include "go-echo6aef0496-db53-4472-a008-84e72562a371.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6aef0496-db53-4472-a008-84e72562a371.selectorLabels" . | nindent 6 }}
