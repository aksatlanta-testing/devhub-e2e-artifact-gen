apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo354713b5-42f8-4370-b65a-aed5cc858255.fullname" . }}
  labels:
    {{- include "go-echo354713b5-42f8-4370-b65a-aed5cc858255.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo354713b5-42f8-4370-b65a-aed5cc858255.selectorLabels" . | nindent 6 }}
