apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo47ef7e22-043a-4959-8ba1-c51d3a883159.fullname" . }}
  labels:
    {{- include "go-echo47ef7e22-043a-4959-8ba1-c51d3a883159.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo47ef7e22-043a-4959-8ba1-c51d3a883159.selectorLabels" . | nindent 6 }}
