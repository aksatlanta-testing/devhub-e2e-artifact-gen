apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8fac74b3-b934-4003-8685-bfce894c8aa8.fullname" . }}
  labels:
    {{- include "go-echo8fac74b3-b934-4003-8685-bfce894c8aa8.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8fac74b3-b934-4003-8685-bfce894c8aa8.selectorLabels" . | nindent 6 }}
