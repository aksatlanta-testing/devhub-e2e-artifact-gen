apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2d87e721-3f73-4dcd-a79f-c5fdb7785b52.fullname" . }}
  labels:
    {{- include "go-echo2d87e721-3f73-4dcd-a79f-c5fdb7785b52.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2d87e721-3f73-4dcd-a79f-c5fdb7785b52.selectorLabels" . | nindent 6 }}
