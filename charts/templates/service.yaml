apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo549042fe-c6ea-43c0-85a5-75ab992d7acf.fullname" . }}
  labels:
    {{- include "go-echo549042fe-c6ea-43c0-85a5-75ab992d7acf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo549042fe-c6ea-43c0-85a5-75ab992d7acf.selectorLabels" . | nindent 6 }}
