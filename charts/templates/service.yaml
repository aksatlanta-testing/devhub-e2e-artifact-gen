apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4df9ed0f-9d0d-42d8-bafa-fa6530e7f3b7.fullname" . }}
  labels:
    {{- include "go-echo4df9ed0f-9d0d-42d8-bafa-fa6530e7f3b7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4df9ed0f-9d0d-42d8-bafa-fa6530e7f3b7.selectorLabels" . | nindent 6 }}
