apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo92e2ec7b-91bb-4c53-905b-ff2694e7c7be.fullname" . }}
  labels:
    {{- include "go-echo92e2ec7b-91bb-4c53-905b-ff2694e7c7be.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo92e2ec7b-91bb-4c53-905b-ff2694e7c7be.selectorLabels" . | nindent 6 }}
