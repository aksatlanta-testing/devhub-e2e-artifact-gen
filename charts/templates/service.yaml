apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo84f3c83f-1426-4434-a049-94a662dae64f.fullname" . }}
  labels:
    {{- include "go-echo84f3c83f-1426-4434-a049-94a662dae64f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo84f3c83f-1426-4434-a049-94a662dae64f.selectorLabels" . | nindent 6 }}
