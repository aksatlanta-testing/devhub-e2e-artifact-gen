apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod736dec3-b5e4-48da-9a24-75206ac52d86.fullname" . }}
  labels:
    {{- include "go-echod736dec3-b5e4-48da-9a24-75206ac52d86.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod736dec3-b5e4-48da-9a24-75206ac52d86.selectorLabels" . | nindent 6 }}
