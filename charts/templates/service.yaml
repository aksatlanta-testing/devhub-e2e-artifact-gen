apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo971610e3-82f6-4a5e-b9fe-3daeb5c30c8a.fullname" . }}
  labels:
    {{- include "go-echo971610e3-82f6-4a5e-b9fe-3daeb5c30c8a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo971610e3-82f6-4a5e-b9fe-3daeb5c30c8a.selectorLabels" . | nindent 6 }}
