apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob961cd76-84c2-4158-9a98-47fda787f64c.fullname" . }}
  labels:
    {{- include "go-echob961cd76-84c2-4158-9a98-47fda787f64c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob961cd76-84c2-4158-9a98-47fda787f64c.selectorLabels" . | nindent 6 }}
