apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1e1d752c-6341-48b5-927c-39cc0980264d.fullname" . }}
  labels:
    {{- include "go-echo1e1d752c-6341-48b5-927c-39cc0980264d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1e1d752c-6341-48b5-927c-39cc0980264d.selectorLabels" . | nindent 6 }}
