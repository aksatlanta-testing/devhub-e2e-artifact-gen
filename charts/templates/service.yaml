apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo176a1109-73ac-461e-a95d-4c62f38cb1dc.fullname" . }}
  labels:
    {{- include "go-echo176a1109-73ac-461e-a95d-4c62f38cb1dc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo176a1109-73ac-461e-a95d-4c62f38cb1dc.selectorLabels" . | nindent 6 }}
