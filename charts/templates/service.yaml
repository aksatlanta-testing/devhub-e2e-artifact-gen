apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob32daae8-a9f1-420f-b805-3e494a09b1b3.fullname" . }}
  labels:
    {{- include "go-echob32daae8-a9f1-420f-b805-3e494a09b1b3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob32daae8-a9f1-420f-b805-3e494a09b1b3.selectorLabels" . | nindent 6 }}
