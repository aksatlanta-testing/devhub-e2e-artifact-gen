apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod99631a2-61b2-4a61-8e1a-2c4b7c193dc3.fullname" . }}
  labels:
    {{- include "go-echod99631a2-61b2-4a61-8e1a-2c4b7c193dc3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod99631a2-61b2-4a61-8e1a-2c4b7c193dc3.selectorLabels" . | nindent 6 }}
