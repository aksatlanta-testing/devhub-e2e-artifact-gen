apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo740e9cd2-b598-406f-9512-3397de204328.fullname" . }}
  labels:
    {{- include "go-echo740e9cd2-b598-406f-9512-3397de204328.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo740e9cd2-b598-406f-9512-3397de204328.selectorLabels" . | nindent 6 }}
