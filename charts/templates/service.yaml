apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2f95692c-38e1-40e9-a5ad-f6f6a9ddad79.fullname" . }}
  labels:
    {{- include "go-echo2f95692c-38e1-40e9-a5ad-f6f6a9ddad79.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2f95692c-38e1-40e9-a5ad-f6f6a9ddad79.selectorLabels" . | nindent 6 }}
