apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoad067ae8-d74e-484a-9478-4ccfc94edd21.fullname" . }}
  labels:
    {{- include "go-echoad067ae8-d74e-484a-9478-4ccfc94edd21.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoad067ae8-d74e-484a-9478-4ccfc94edd21.selectorLabels" . | nindent 6 }}
