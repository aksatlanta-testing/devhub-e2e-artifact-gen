apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4bf35f23-4baf-4960-a175-28c1e3a50da7.fullname" . }}
  labels:
    {{- include "go-echo4bf35f23-4baf-4960-a175-28c1e3a50da7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4bf35f23-4baf-4960-a175-28c1e3a50da7.selectorLabels" . | nindent 6 }}
