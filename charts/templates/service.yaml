apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8cdb3e4a-3b86-4ca5-93e3-e31ffd1a26bf.fullname" . }}
  labels:
    {{- include "go-echo8cdb3e4a-3b86-4ca5-93e3-e31ffd1a26bf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8cdb3e4a-3b86-4ca5-93e3-e31ffd1a26bf.selectorLabels" . | nindent 6 }}
