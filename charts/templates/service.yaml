apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod35ae51c-af7a-4f93-945c-0fba409f5c8d.fullname" . }}
  labels:
    {{- include "go-echod35ae51c-af7a-4f93-945c-0fba409f5c8d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod35ae51c-af7a-4f93-945c-0fba409f5c8d.selectorLabels" . | nindent 6 }}
