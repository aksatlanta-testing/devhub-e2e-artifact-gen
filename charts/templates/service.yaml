apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1cd70528-07b3-4527-9600-9825c4291157.fullname" . }}
  labels:
    {{- include "go-echo1cd70528-07b3-4527-9600-9825c4291157.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1cd70528-07b3-4527-9600-9825c4291157.selectorLabels" . | nindent 6 }}
