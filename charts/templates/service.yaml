apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo69a7a0d7-c4f6-40f6-a76f-45b34b665c26.fullname" . }}
  labels:
    {{- include "go-echo69a7a0d7-c4f6-40f6-a76f-45b34b665c26.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo69a7a0d7-c4f6-40f6-a76f-45b34b665c26.selectorLabels" . | nindent 6 }}
