apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe5222e05-9b2c-43c3-b4aa-aea0ed13ebbf.fullname" . }}
  labels:
    {{- include "go-echoe5222e05-9b2c-43c3-b4aa-aea0ed13ebbf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe5222e05-9b2c-43c3-b4aa-aea0ed13ebbf.selectorLabels" . | nindent 6 }}
