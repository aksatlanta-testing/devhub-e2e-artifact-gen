apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc26a39e7-a398-482f-b6de-aa51c158cbb9.fullname" . }}
  labels:
    {{- include "go-echoc26a39e7-a398-482f-b6de-aa51c158cbb9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc26a39e7-a398-482f-b6de-aa51c158cbb9.selectorLabels" . | nindent 6 }}
