apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa1f977ac-9118-4dba-91dd-c975c628e088.fullname" . }}
  labels:
    {{- include "go-echoa1f977ac-9118-4dba-91dd-c975c628e088.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa1f977ac-9118-4dba-91dd-c975c628e088.selectorLabels" . | nindent 6 }}
