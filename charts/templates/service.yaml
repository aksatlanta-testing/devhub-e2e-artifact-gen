apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8a9ee5aa-42c1-4312-b926-1167fdebb7ae.fullname" . }}
  labels:
    {{- include "go-echo8a9ee5aa-42c1-4312-b926-1167fdebb7ae.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8a9ee5aa-42c1-4312-b926-1167fdebb7ae.selectorLabels" . | nindent 6 }}
