apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobb4feea9-38b8-48e7-97fd-125e1d6bb923.fullname" . }}
  labels:
    {{- include "go-echobb4feea9-38b8-48e7-97fd-125e1d6bb923.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobb4feea9-38b8-48e7-97fd-125e1d6bb923.selectorLabels" . | nindent 6 }}
