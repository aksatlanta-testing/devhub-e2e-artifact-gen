apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo67a90365-09f1-42c1-bd1f-8e69d707ca68.fullname" . }}
  labels:
    {{- include "go-echo67a90365-09f1-42c1-bd1f-8e69d707ca68.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo67a90365-09f1-42c1-bd1f-8e69d707ca68.selectorLabels" . | nindent 6 }}
