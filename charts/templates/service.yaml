apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo03457ab4-8e1d-44c6-863b-4ba839d68f7d.fullname" . }}
  labels:
    {{- include "go-echo03457ab4-8e1d-44c6-863b-4ba839d68f7d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo03457ab4-8e1d-44c6-863b-4ba839d68f7d.selectorLabels" . | nindent 6 }}
