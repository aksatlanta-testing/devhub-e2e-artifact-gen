apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9f583ad8-21b6-4284-bc54-00ada499643e.fullname" . }}
  labels:
    {{- include "go-echo9f583ad8-21b6-4284-bc54-00ada499643e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9f583ad8-21b6-4284-bc54-00ada499643e.selectorLabels" . | nindent 6 }}
