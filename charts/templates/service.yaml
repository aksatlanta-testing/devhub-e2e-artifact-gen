apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo30e6f822-d8cc-45fd-b66d-71b595ef1db1.fullname" . }}
  labels:
    {{- include "go-echo30e6f822-d8cc-45fd-b66d-71b595ef1db1.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo30e6f822-d8cc-45fd-b66d-71b595ef1db1.selectorLabels" . | nindent 6 }}
