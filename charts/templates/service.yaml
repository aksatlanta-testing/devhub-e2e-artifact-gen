apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo08c6298f-932f-46bb-910c-a7bb0e1fb96c.fullname" . }}
  labels:
    {{- include "go-echo08c6298f-932f-46bb-910c-a7bb0e1fb96c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo08c6298f-932f-46bb-910c-a7bb0e1fb96c.selectorLabels" . | nindent 6 }}
