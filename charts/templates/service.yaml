apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2c586e9e-e0cb-41d4-b652-9ce7a0d65fbf.fullname" . }}
  labels:
    {{- include "go-echo2c586e9e-e0cb-41d4-b652-9ce7a0d65fbf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2c586e9e-e0cb-41d4-b652-9ce7a0d65fbf.selectorLabels" . | nindent 6 }}
