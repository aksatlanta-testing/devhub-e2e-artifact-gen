apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoddd46792-4aaf-44e4-974e-49d8cf30c66c.fullname" . }}
  labels:
    {{- include "go-echoddd46792-4aaf-44e4-974e-49d8cf30c66c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoddd46792-4aaf-44e4-974e-49d8cf30c66c.selectorLabels" . | nindent 6 }}
