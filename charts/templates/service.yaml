apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod935e344-446d-4a37-84df-f621cb3f10aa.fullname" . }}
  labels:
    {{- include "go-echod935e344-446d-4a37-84df-f621cb3f10aa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod935e344-446d-4a37-84df-f621cb3f10aa.selectorLabels" . | nindent 6 }}
