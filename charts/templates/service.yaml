apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe360708c-87c5-47c4-81c5-6dcdd25cfb03.fullname" . }}
  labels:
    {{- include "go-echoe360708c-87c5-47c4-81c5-6dcdd25cfb03.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe360708c-87c5-47c4-81c5-6dcdd25cfb03.selectorLabels" . | nindent 6 }}
