apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo29903923-239c-4c1d-9970-5f8b3eb5137e.fullname" . }}
  labels:
    {{- include "go-echo29903923-239c-4c1d-9970-5f8b3eb5137e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo29903923-239c-4c1d-9970-5f8b3eb5137e.selectorLabels" . | nindent 6 }}
