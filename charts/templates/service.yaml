apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe3523843-3446-47ff-bd23-98433965374a.fullname" . }}
  labels:
    {{- include "go-echoe3523843-3446-47ff-bd23-98433965374a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe3523843-3446-47ff-bd23-98433965374a.selectorLabels" . | nindent 6 }}
