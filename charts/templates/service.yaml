apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3cf9648b-7cb5-43ec-a2d3-a546da6a34c9.fullname" . }}
  labels:
    {{- include "go-echo3cf9648b-7cb5-43ec-a2d3-a546da6a34c9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3cf9648b-7cb5-43ec-a2d3-a546da6a34c9.selectorLabels" . | nindent 6 }}
