apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc6c89393-8a46-4d6e-9a58-8777dece7682.fullname" . }}
  labels:
    {{- include "go-echoc6c89393-8a46-4d6e-9a58-8777dece7682.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc6c89393-8a46-4d6e-9a58-8777dece7682.selectorLabels" . | nindent 6 }}
