apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoae199f35-6ce5-4d80-8f73-057be650fb68.fullname" . }}
  labels:
    {{- include "go-echoae199f35-6ce5-4d80-8f73-057be650fb68.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoae199f35-6ce5-4d80-8f73-057be650fb68.selectorLabels" . | nindent 6 }}
