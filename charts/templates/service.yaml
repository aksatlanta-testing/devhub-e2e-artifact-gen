apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodfb1220a-252e-450c-ad39-d0088076d17d.fullname" . }}
  labels:
    {{- include "go-echodfb1220a-252e-450c-ad39-d0088076d17d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodfb1220a-252e-450c-ad39-d0088076d17d.selectorLabels" . | nindent 6 }}
