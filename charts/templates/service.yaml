apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo326a82a8-336f-4b05-80e2-688762942427.fullname" . }}
  labels:
    {{- include "go-echo326a82a8-336f-4b05-80e2-688762942427.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo326a82a8-336f-4b05-80e2-688762942427.selectorLabels" . | nindent 6 }}
