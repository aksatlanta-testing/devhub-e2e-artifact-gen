apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo69263736-35d2-4d25-bed7-e30171f87c22.fullname" . }}
  labels:
    {{- include "go-echo69263736-35d2-4d25-bed7-e30171f87c22.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo69263736-35d2-4d25-bed7-e30171f87c22.selectorLabels" . | nindent 6 }}
