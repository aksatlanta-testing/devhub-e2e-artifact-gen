apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2b2c3c16-99d9-4298-8752-85386b8a7d40.fullname" . }}
  labels:
    {{- include "go-echo2b2c3c16-99d9-4298-8752-85386b8a7d40.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2b2c3c16-99d9-4298-8752-85386b8a7d40.selectorLabels" . | nindent 6 }}
