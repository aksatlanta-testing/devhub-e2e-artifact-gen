apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo59258711-768b-44fb-80e2-4721cac42370.fullname" . }}
  labels:
    {{- include "go-echo59258711-768b-44fb-80e2-4721cac42370.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo59258711-768b-44fb-80e2-4721cac42370.selectorLabels" . | nindent 6 }}
