apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo112336aa-e86b-4dc4-802d-3d17ced1e02c.fullname" . }}
  labels:
    {{- include "go-echo112336aa-e86b-4dc4-802d-3d17ced1e02c.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo112336aa-e86b-4dc4-802d-3d17ced1e02c.selectorLabels" . | nindent 6 }}
