apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoad67ad41-9834-4c28-8ebc-e54d783affff.fullname" . }}
  labels:
    {{- include "go-echoad67ad41-9834-4c28-8ebc-e54d783affff.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoad67ad41-9834-4c28-8ebc-e54d783affff.selectorLabels" . | nindent 6 }}
