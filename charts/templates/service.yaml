apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocf60b501-9267-4f69-99b1-08649fb0ffc1.fullname" . }}
  labels:
    {{- include "go-echocf60b501-9267-4f69-99b1-08649fb0ffc1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocf60b501-9267-4f69-99b1-08649fb0ffc1.selectorLabels" . | nindent 6 }}
