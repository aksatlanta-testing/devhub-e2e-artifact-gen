apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa099cab9-a76a-4680-ae53-6eb7ddf233ef.fullname" . }}
  labels:
    {{- include "go-echoa099cab9-a76a-4680-ae53-6eb7ddf233ef.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa099cab9-a76a-4680-ae53-6eb7ddf233ef.selectorLabels" . | nindent 6 }}
