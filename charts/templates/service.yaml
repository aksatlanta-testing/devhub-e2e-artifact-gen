apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa614bb77-ae41-4285-bf69-fc457c1de28e.fullname" . }}
  labels:
    {{- include "go-echoa614bb77-ae41-4285-bf69-fc457c1de28e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa614bb77-ae41-4285-bf69-fc457c1de28e.selectorLabels" . | nindent 6 }}
