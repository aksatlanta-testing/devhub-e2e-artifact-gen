apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo86532134-e3f5-4946-b5fd-2d3c77f4e9b6.fullname" . }}
  labels:
    {{- include "go-echo86532134-e3f5-4946-b5fd-2d3c77f4e9b6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo86532134-e3f5-4946-b5fd-2d3c77f4e9b6.selectorLabels" . | nindent 6 }}
