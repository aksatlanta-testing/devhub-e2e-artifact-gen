apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo608d7bf2-1f93-4a1a-b8f7-8583de5e4219.fullname" . }}
  labels:
    {{- include "go-echo608d7bf2-1f93-4a1a-b8f7-8583de5e4219.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo608d7bf2-1f93-4a1a-b8f7-8583de5e4219.selectorLabels" . | nindent 6 }}
