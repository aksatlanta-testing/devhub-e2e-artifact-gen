apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7d6da272-f3c0-49a6-bd17-94589a21007c.fullname" . }}
  labels:
    {{- include "go-echo7d6da272-f3c0-49a6-bd17-94589a21007c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7d6da272-f3c0-49a6-bd17-94589a21007c.selectorLabels" . | nindent 6 }}
