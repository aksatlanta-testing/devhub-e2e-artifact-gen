apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaeded94e-1efe-40e8-a338-90f1a68273fc.fullname" . }}
  labels:
    {{- include "go-echoaeded94e-1efe-40e8-a338-90f1a68273fc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaeded94e-1efe-40e8-a338-90f1a68273fc.selectorLabels" . | nindent 6 }}
