apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe0a7504c-3e1e-42bc-8213-fce0b195f188.fullname" . }}
  labels:
    {{- include "go-echoe0a7504c-3e1e-42bc-8213-fce0b195f188.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe0a7504c-3e1e-42bc-8213-fce0b195f188.selectorLabels" . | nindent 6 }}
