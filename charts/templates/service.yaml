apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo03afa0f0-acfc-4151-863f-84db612e941a.fullname" . }}
  labels:
    {{- include "go-echo03afa0f0-acfc-4151-863f-84db612e941a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo03afa0f0-acfc-4151-863f-84db612e941a.selectorLabels" . | nindent 6 }}
