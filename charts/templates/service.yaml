apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoed5adef8-a152-40cf-9b7d-137ae5d43e3f.fullname" . }}
  labels:
    {{- include "go-echoed5adef8-a152-40cf-9b7d-137ae5d43e3f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoed5adef8-a152-40cf-9b7d-137ae5d43e3f.selectorLabels" . | nindent 6 }}
