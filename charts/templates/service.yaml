apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4a0cf7a1-1520-4f7a-8404-da7d60722dd1.fullname" . }}
  labels:
    {{- include "go-echo4a0cf7a1-1520-4f7a-8404-da7d60722dd1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4a0cf7a1-1520-4f7a-8404-da7d60722dd1.selectorLabels" . | nindent 6 }}
