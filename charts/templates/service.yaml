apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodafadd45-ae30-4e6a-948b-31910c075256.fullname" . }}
  labels:
    {{- include "go-echodafadd45-ae30-4e6a-948b-31910c075256.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodafadd45-ae30-4e6a-948b-31910c075256.selectorLabels" . | nindent 6 }}
