apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1660d191-3e36-405a-baa8-2237f603752c.fullname" . }}
  labels:
    {{- include "go-echo1660d191-3e36-405a-baa8-2237f603752c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1660d191-3e36-405a-baa8-2237f603752c.selectorLabels" . | nindent 6 }}
