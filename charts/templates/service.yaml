apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo28b4cb08-d198-4358-b8f6-630f9f562b94.fullname" . }}
  labels:
    {{- include "go-echo28b4cb08-d198-4358-b8f6-630f9f562b94.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo28b4cb08-d198-4358-b8f6-630f9f562b94.selectorLabels" . | nindent 6 }}
