apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo02667202-1118-42a4-aa05-4ed3e1bad536.fullname" . }}
  labels:
    {{- include "go-echo02667202-1118-42a4-aa05-4ed3e1bad536.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo02667202-1118-42a4-aa05-4ed3e1bad536.selectorLabels" . | nindent 6 }}
