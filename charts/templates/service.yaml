apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob84805bf-dbd7-48a3-aae4-00dc6512d186.fullname" . }}
  labels:
    {{- include "go-echob84805bf-dbd7-48a3-aae4-00dc6512d186.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob84805bf-dbd7-48a3-aae4-00dc6512d186.selectorLabels" . | nindent 6 }}
