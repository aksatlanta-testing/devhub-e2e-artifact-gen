apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2bad9cb0-cdc2-4e43-b97d-b8044a1d8d38.fullname" . }}
  labels:
    {{- include "go-echo2bad9cb0-cdc2-4e43-b97d-b8044a1d8d38.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2bad9cb0-cdc2-4e43-b97d-b8044a1d8d38.selectorLabels" . | nindent 6 }}
