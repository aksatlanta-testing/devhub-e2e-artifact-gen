apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoeb495149-c9a2-4e10-9292-aea0051ee428.fullname" . }}
  labels:
    {{- include "go-echoeb495149-c9a2-4e10-9292-aea0051ee428.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoeb495149-c9a2-4e10-9292-aea0051ee428.selectorLabels" . | nindent 6 }}
