apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe511a20b-1bc3-4801-9024-9590cba0c38a.fullname" . }}
  labels:
    {{- include "go-echoe511a20b-1bc3-4801-9024-9590cba0c38a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe511a20b-1bc3-4801-9024-9590cba0c38a.selectorLabels" . | nindent 6 }}
