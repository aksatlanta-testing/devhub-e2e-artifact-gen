apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo723a14f4-02e4-46a4-8921-6619226175ad.fullname" . }}
  labels:
    {{- include "go-echo723a14f4-02e4-46a4-8921-6619226175ad.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo723a14f4-02e4-46a4-8921-6619226175ad.selectorLabels" . | nindent 6 }}
