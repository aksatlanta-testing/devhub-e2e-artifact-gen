apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5b83b322-133b-412f-9fca-ad4bc56ebdee.fullname" . }}
  labels:
    {{- include "go-echo5b83b322-133b-412f-9fca-ad4bc56ebdee.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5b83b322-133b-412f-9fca-ad4bc56ebdee.selectorLabels" . | nindent 6 }}
