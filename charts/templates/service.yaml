apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoee765e52-146e-4dbb-bcee-458e57a2c6be.fullname" . }}
  labels:
    {{- include "go-echoee765e52-146e-4dbb-bcee-458e57a2c6be.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoee765e52-146e-4dbb-bcee-458e57a2c6be.selectorLabels" . | nindent 6 }}
