apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocb01d817-28e1-4c95-bf96-b9861b924655.fullname" . }}
  labels:
    {{- include "go-echocb01d817-28e1-4c95-bf96-b9861b924655.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocb01d817-28e1-4c95-bf96-b9861b924655.selectorLabels" . | nindent 6 }}
