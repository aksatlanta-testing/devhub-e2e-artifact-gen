apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo217502e0-6a52-4174-8482-702fa0014cac.fullname" . }}
  labels:
    {{- include "go-echo217502e0-6a52-4174-8482-702fa0014cac.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo217502e0-6a52-4174-8482-702fa0014cac.selectorLabels" . | nindent 6 }}
