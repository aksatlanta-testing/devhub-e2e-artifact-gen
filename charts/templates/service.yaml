apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoabeefe2c-c8d8-4079-b8a6-b934b6889f4d.fullname" . }}
  labels:
    {{- include "go-echoabeefe2c-c8d8-4079-b8a6-b934b6889f4d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoabeefe2c-c8d8-4079-b8a6-b934b6889f4d.selectorLabels" . | nindent 6 }}
