apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo62004dc5-3536-41ee-8c1c-6b39579bece9.fullname" . }}
  labels:
    {{- include "go-echo62004dc5-3536-41ee-8c1c-6b39579bece9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo62004dc5-3536-41ee-8c1c-6b39579bece9.selectorLabels" . | nindent 6 }}
