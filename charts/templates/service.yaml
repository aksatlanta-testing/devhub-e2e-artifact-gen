apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo268add7a-a01d-4d11-8749-bc18cf167149.fullname" . }}
  labels:
    {{- include "go-echo268add7a-a01d-4d11-8749-bc18cf167149.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo268add7a-a01d-4d11-8749-bc18cf167149.selectorLabels" . | nindent 6 }}
