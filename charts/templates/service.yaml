apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod55b0978-71b9-4295-8a60-0be9876bea0f.fullname" . }}
  labels:
    {{- include "go-echod55b0978-71b9-4295-8a60-0be9876bea0f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod55b0978-71b9-4295-8a60-0be9876bea0f.selectorLabels" . | nindent 6 }}
