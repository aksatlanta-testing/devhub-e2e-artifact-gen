apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo637a5ee7-bc37-41e3-bd3b-f8311e5cf361.fullname" . }}
  labels:
    {{- include "go-echo637a5ee7-bc37-41e3-bd3b-f8311e5cf361.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo637a5ee7-bc37-41e3-bd3b-f8311e5cf361.selectorLabels" . | nindent 6 }}
