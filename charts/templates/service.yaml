apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1708158d-0c0d-4c30-a8cd-61d8659f3afe.fullname" . }}
  labels:
    {{- include "go-echo1708158d-0c0d-4c30-a8cd-61d8659f3afe.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1708158d-0c0d-4c30-a8cd-61d8659f3afe.selectorLabels" . | nindent 6 }}
