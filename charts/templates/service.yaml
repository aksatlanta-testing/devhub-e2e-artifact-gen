apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3b24b076-bbb1-4ec9-a8ab-e06db77e9152.fullname" . }}
  labels:
    {{- include "go-echo3b24b076-bbb1-4ec9-a8ab-e06db77e9152.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3b24b076-bbb1-4ec9-a8ab-e06db77e9152.selectorLabels" . | nindent 6 }}
