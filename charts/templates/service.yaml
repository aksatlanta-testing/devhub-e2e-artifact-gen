apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof496fb8b-b2be-4f7d-ba5f-8a14a12c0c21.fullname" . }}
  labels:
    {{- include "go-echof496fb8b-b2be-4f7d-ba5f-8a14a12c0c21.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof496fb8b-b2be-4f7d-ba5f-8a14a12c0c21.selectorLabels" . | nindent 6 }}
