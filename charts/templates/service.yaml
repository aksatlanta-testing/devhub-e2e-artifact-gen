apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1ae77c10-1ed3-4b47-b5e8-0e8f3a9a7573.fullname" . }}
  labels:
    {{- include "go-echo1ae77c10-1ed3-4b47-b5e8-0e8f3a9a7573.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1ae77c10-1ed3-4b47-b5e8-0e8f3a9a7573.selectorLabels" . | nindent 6 }}
