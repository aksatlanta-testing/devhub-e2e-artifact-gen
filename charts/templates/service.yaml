apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob3483088-41ff-492f-a450-323a8d27b6a6.fullname" . }}
  labels:
    {{- include "go-echob3483088-41ff-492f-a450-323a8d27b6a6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob3483088-41ff-492f-a450-323a8d27b6a6.selectorLabels" . | nindent 6 }}
