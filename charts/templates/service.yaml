apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob7578734-9a7a-41c5-82ba-749696b3d166.fullname" . }}
  labels:
    {{- include "go-echob7578734-9a7a-41c5-82ba-749696b3d166.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob7578734-9a7a-41c5-82ba-749696b3d166.selectorLabels" . | nindent 6 }}
