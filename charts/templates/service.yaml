apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo81d52c31-fe84-4658-ba5b-cf43422188c2.fullname" . }}
  labels:
    {{- include "go-echo81d52c31-fe84-4658-ba5b-cf43422188c2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo81d52c31-fe84-4658-ba5b-cf43422188c2.selectorLabels" . | nindent 6 }}
