apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8a11b39d-8059-43c2-8e11-3bfdbf3aa5ca.fullname" . }}
  labels:
    {{- include "go-echo8a11b39d-8059-43c2-8e11-3bfdbf3aa5ca.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8a11b39d-8059-43c2-8e11-3bfdbf3aa5ca.selectorLabels" . | nindent 6 }}
