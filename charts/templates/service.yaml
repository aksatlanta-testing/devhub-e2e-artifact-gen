apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7c4841f4-eff3-482f-8da2-04eda83c8ead.fullname" . }}
  labels:
    {{- include "go-echo7c4841f4-eff3-482f-8da2-04eda83c8ead.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7c4841f4-eff3-482f-8da2-04eda83c8ead.selectorLabels" . | nindent 6 }}
