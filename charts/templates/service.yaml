apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8c6ace87-b5b5-4e9f-bf55-6e5f42b02390.fullname" . }}
  labels:
    {{- include "go-echo8c6ace87-b5b5-4e9f-bf55-6e5f42b02390.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8c6ace87-b5b5-4e9f-bf55-6e5f42b02390.selectorLabels" . | nindent 6 }}
