apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0a5e2c68-2408-4db6-b8ae-603a36b8cb03.fullname" . }}
  labels:
    {{- include "go-echo0a5e2c68-2408-4db6-b8ae-603a36b8cb03.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0a5e2c68-2408-4db6-b8ae-603a36b8cb03.selectorLabels" . | nindent 6 }}
