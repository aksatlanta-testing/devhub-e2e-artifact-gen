apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa9f52424-527c-49d9-9781-67eb75ead1da.fullname" . }}
  labels:
    {{- include "go-echoa9f52424-527c-49d9-9781-67eb75ead1da.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa9f52424-527c-49d9-9781-67eb75ead1da.selectorLabels" . | nindent 6 }}
