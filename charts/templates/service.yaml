apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoae0e3e2c-417b-4936-9073-c7960e3fc79f.fullname" . }}
  labels:
    {{- include "go-echoae0e3e2c-417b-4936-9073-c7960e3fc79f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoae0e3e2c-417b-4936-9073-c7960e3fc79f.selectorLabels" . | nindent 6 }}
