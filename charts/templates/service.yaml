apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof6167c3c-909a-4a0b-aaf1-f6110e96b215.fullname" . }}
  labels:
    {{- include "go-echof6167c3c-909a-4a0b-aaf1-f6110e96b215.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof6167c3c-909a-4a0b-aaf1-f6110e96b215.selectorLabels" . | nindent 6 }}
