apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1f6c1d88-e41e-4065-9cd3-f01d9fa36067.fullname" . }}
  labels:
    {{- include "go-echo1f6c1d88-e41e-4065-9cd3-f01d9fa36067.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1f6c1d88-e41e-4065-9cd3-f01d9fa36067.selectorLabels" . | nindent 6 }}
