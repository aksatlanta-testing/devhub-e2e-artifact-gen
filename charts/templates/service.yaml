apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4ce5b6fb-3d3d-48ca-9c8a-2cb9125493ab.fullname" . }}
  labels:
    {{- include "go-echo4ce5b6fb-3d3d-48ca-9c8a-2cb9125493ab.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4ce5b6fb-3d3d-48ca-9c8a-2cb9125493ab.selectorLabels" . | nindent 6 }}
