apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofecf1e7a-31dd-48fa-bbfb-390728648e0b.fullname" . }}
  labels:
    {{- include "go-echofecf1e7a-31dd-48fa-bbfb-390728648e0b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofecf1e7a-31dd-48fa-bbfb-390728648e0b.selectorLabels" . | nindent 6 }}
