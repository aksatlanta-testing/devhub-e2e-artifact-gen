apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2e0adf92-206c-4203-89db-fda4d2384bd2.fullname" . }}
  labels:
    {{- include "go-echo2e0adf92-206c-4203-89db-fda4d2384bd2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2e0adf92-206c-4203-89db-fda4d2384bd2.selectorLabels" . | nindent 6 }}
