apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2ec68bc4-1372-4a84-9cd4-951c9773e7cd.fullname" . }}
  labels:
    {{- include "go-echo2ec68bc4-1372-4a84-9cd4-951c9773e7cd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2ec68bc4-1372-4a84-9cd4-951c9773e7cd.selectorLabels" . | nindent 6 }}
