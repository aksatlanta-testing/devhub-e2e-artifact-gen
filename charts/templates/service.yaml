apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob93ed16c-f9f1-4725-a2f0-09dc661ad103.fullname" . }}
  labels:
    {{- include "go-echob93ed16c-f9f1-4725-a2f0-09dc661ad103.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob93ed16c-f9f1-4725-a2f0-09dc661ad103.selectorLabels" . | nindent 6 }}
