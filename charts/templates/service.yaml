apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa7596829-74f1-4d9a-a3c9-8686c6a8f011.fullname" . }}
  labels:
    {{- include "go-echoa7596829-74f1-4d9a-a3c9-8686c6a8f011.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa7596829-74f1-4d9a-a3c9-8686c6a8f011.selectorLabels" . | nindent 6 }}
