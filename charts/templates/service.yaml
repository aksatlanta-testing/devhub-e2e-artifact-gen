apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobdee9ead-8755-4fc2-a4cd-9bce1cab72a1.fullname" . }}
  labels:
    {{- include "go-echobdee9ead-8755-4fc2-a4cd-9bce1cab72a1.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobdee9ead-8755-4fc2-a4cd-9bce1cab72a1.selectorLabels" . | nindent 6 }}
