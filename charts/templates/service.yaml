apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoca53768f-8a4d-4674-ad50-b8aed0b1b698.fullname" . }}
  labels:
    {{- include "go-echoca53768f-8a4d-4674-ad50-b8aed0b1b698.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoca53768f-8a4d-4674-ad50-b8aed0b1b698.selectorLabels" . | nindent 6 }}
