apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo82eb9e8c-1cac-4ccc-a405-d944a63c5ce6.fullname" . }}
  labels:
    {{- include "go-echo82eb9e8c-1cac-4ccc-a405-d944a63c5ce6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo82eb9e8c-1cac-4ccc-a405-d944a63c5ce6.selectorLabels" . | nindent 6 }}
