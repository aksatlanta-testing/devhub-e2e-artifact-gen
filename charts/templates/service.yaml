apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocc7b10eb-d25e-43e6-8d04-9985b8dae0db.fullname" . }}
  labels:
    {{- include "go-echocc7b10eb-d25e-43e6-8d04-9985b8dae0db.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocc7b10eb-d25e-43e6-8d04-9985b8dae0db.selectorLabels" . | nindent 6 }}
