apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4d70a599-001b-4766-bab5-d207a5a776ac.fullname" . }}
  labels:
    {{- include "go-echo4d70a599-001b-4766-bab5-d207a5a776ac.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4d70a599-001b-4766-bab5-d207a5a776ac.selectorLabels" . | nindent 6 }}
