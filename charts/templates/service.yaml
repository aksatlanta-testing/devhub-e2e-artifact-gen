apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo77001757-64e0-426c-9fd6-c7bad0e12853.fullname" . }}
  labels:
    {{- include "go-echo77001757-64e0-426c-9fd6-c7bad0e12853.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo77001757-64e0-426c-9fd6-c7bad0e12853.selectorLabels" . | nindent 6 }}
