apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo78a85fc2-66ae-4365-b2d1-9889f3f4cf84.fullname" . }}
  labels:
    {{- include "go-echo78a85fc2-66ae-4365-b2d1-9889f3f4cf84.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo78a85fc2-66ae-4365-b2d1-9889f3f4cf84.selectorLabels" . | nindent 6 }}
