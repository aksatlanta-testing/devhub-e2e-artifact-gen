apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo63f178b7-01fb-45b8-8a51-f70959e8f450.fullname" . }}
  labels:
    {{- include "go-echo63f178b7-01fb-45b8-8a51-f70959e8f450.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo63f178b7-01fb-45b8-8a51-f70959e8f450.selectorLabels" . | nindent 6 }}
