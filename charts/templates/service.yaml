apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod7c3fdef-e7b1-4864-9b3c-7eb70b89446e.fullname" . }}
  labels:
    {{- include "go-echod7c3fdef-e7b1-4864-9b3c-7eb70b89446e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod7c3fdef-e7b1-4864-9b3c-7eb70b89446e.selectorLabels" . | nindent 6 }}
