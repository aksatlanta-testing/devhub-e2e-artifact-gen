apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4824f2b0-0517-48fe-a38b-1f81334fb970.fullname" . }}
  labels:
    {{- include "go-echo4824f2b0-0517-48fe-a38b-1f81334fb970.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4824f2b0-0517-48fe-a38b-1f81334fb970.selectorLabels" . | nindent 6 }}
