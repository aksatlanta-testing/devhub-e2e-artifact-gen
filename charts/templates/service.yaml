apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4b8c90a9-a7c6-4ee2-841b-9a89de8f0688.fullname" . }}
  labels:
    {{- include "go-echo4b8c90a9-a7c6-4ee2-841b-9a89de8f0688.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4b8c90a9-a7c6-4ee2-841b-9a89de8f0688.selectorLabels" . | nindent 6 }}
