apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoae17c4c0-970c-4346-9cf6-4c21c71063a1.fullname" . }}
  labels:
    {{- include "go-echoae17c4c0-970c-4346-9cf6-4c21c71063a1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoae17c4c0-970c-4346-9cf6-4c21c71063a1.selectorLabels" . | nindent 6 }}
