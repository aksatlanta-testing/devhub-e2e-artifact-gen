apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7cc05c8b-ca17-4623-b50a-6da0af90dbf2.fullname" . }}
  labels:
    {{- include "go-echo7cc05c8b-ca17-4623-b50a-6da0af90dbf2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7cc05c8b-ca17-4623-b50a-6da0af90dbf2.selectorLabels" . | nindent 6 }}
