apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo89d01f5f-d149-4c4b-ab01-6cc22e1d30bc.fullname" . }}
  labels:
    {{- include "go-echo89d01f5f-d149-4c4b-ab01-6cc22e1d30bc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo89d01f5f-d149-4c4b-ab01-6cc22e1d30bc.selectorLabels" . | nindent 6 }}
