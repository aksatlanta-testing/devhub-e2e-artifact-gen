apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo07dd9f90-0841-4624-b29c-e22df3b5aa1c.fullname" . }}
  labels:
    {{- include "go-echo07dd9f90-0841-4624-b29c-e22df3b5aa1c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo07dd9f90-0841-4624-b29c-e22df3b5aa1c.selectorLabels" . | nindent 6 }}
