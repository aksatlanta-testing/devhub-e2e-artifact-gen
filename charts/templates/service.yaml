apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobff6350f-d1c2-4853-9446-6503674e8b06.fullname" . }}
  labels:
    {{- include "go-echobff6350f-d1c2-4853-9446-6503674e8b06.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobff6350f-d1c2-4853-9446-6503674e8b06.selectorLabels" . | nindent 6 }}
