apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoae669228-f67e-4e4c-859d-b08ce9fae5af.fullname" . }}
  labels:
    {{- include "go-echoae669228-f67e-4e4c-859d-b08ce9fae5af.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoae669228-f67e-4e4c-859d-b08ce9fae5af.selectorLabels" . | nindent 6 }}
