apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod1935918-3231-43f1-ac91-8dde3b782da1.fullname" . }}
  labels:
    {{- include "go-echod1935918-3231-43f1-ac91-8dde3b782da1.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod1935918-3231-43f1-ac91-8dde3b782da1.selectorLabels" . | nindent 6 }}
