apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo80502bc8-2666-42ad-addd-4a4284b5e9ee.fullname" . }}
  labels:
    {{- include "go-echo80502bc8-2666-42ad-addd-4a4284b5e9ee.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo80502bc8-2666-42ad-addd-4a4284b5e9ee.selectorLabels" . | nindent 6 }}
