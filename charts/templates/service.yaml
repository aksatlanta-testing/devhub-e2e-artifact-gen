apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo33cde7ed-6120-42ee-8bbf-e416afa0590b.fullname" . }}
  labels:
    {{- include "go-echo33cde7ed-6120-42ee-8bbf-e416afa0590b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo33cde7ed-6120-42ee-8bbf-e416afa0590b.selectorLabels" . | nindent 6 }}
