apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo89c9627a-b7e4-4b6d-9b20-54b282c0ab18.fullname" . }}
  labels:
    {{- include "go-echo89c9627a-b7e4-4b6d-9b20-54b282c0ab18.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo89c9627a-b7e4-4b6d-9b20-54b282c0ab18.selectorLabels" . | nindent 6 }}
