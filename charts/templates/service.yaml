apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo97dddd2e-6847-4c15-bd0b-63d2414b94ef.fullname" . }}
  labels:
    {{- include "go-echo97dddd2e-6847-4c15-bd0b-63d2414b94ef.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo97dddd2e-6847-4c15-bd0b-63d2414b94ef.selectorLabels" . | nindent 6 }}
