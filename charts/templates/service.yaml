apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa74b64e6-9334-4a53-9294-2df6ad776f1f.fullname" . }}
  labels:
    {{- include "go-echoa74b64e6-9334-4a53-9294-2df6ad776f1f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa74b64e6-9334-4a53-9294-2df6ad776f1f.selectorLabels" . | nindent 6 }}
