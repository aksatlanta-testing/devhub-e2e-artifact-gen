apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofaaae87f-125b-422f-91e8-cefe0d4b8509.fullname" . }}
  labels:
    {{- include "go-echofaaae87f-125b-422f-91e8-cefe0d4b8509.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofaaae87f-125b-422f-91e8-cefe0d4b8509.selectorLabels" . | nindent 6 }}
