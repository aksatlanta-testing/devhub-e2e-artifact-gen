apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe7e9be57-e8d9-4f1a-842c-625322f0d5f5.fullname" . }}
  labels:
    {{- include "go-echoe7e9be57-e8d9-4f1a-842c-625322f0d5f5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe7e9be57-e8d9-4f1a-842c-625322f0d5f5.selectorLabels" . | nindent 6 }}
