apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc26fa95d-cf33-4aef-bfaa-dee63c39f5cf.fullname" . }}
  labels:
    {{- include "go-echoc26fa95d-cf33-4aef-bfaa-dee63c39f5cf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc26fa95d-cf33-4aef-bfaa-dee63c39f5cf.selectorLabels" . | nindent 6 }}
