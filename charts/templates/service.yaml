apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo66a7c558-5aef-4e71-8633-fc815eee7f8b.fullname" . }}
  labels:
    {{- include "go-echo66a7c558-5aef-4e71-8633-fc815eee7f8b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo66a7c558-5aef-4e71-8633-fc815eee7f8b.selectorLabels" . | nindent 6 }}
