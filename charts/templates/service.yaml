apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod10384ce-8f48-472e-b3a8-534e1d193c7b.fullname" . }}
  labels:
    {{- include "go-echod10384ce-8f48-472e-b3a8-534e1d193c7b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod10384ce-8f48-472e-b3a8-534e1d193c7b.selectorLabels" . | nindent 6 }}
