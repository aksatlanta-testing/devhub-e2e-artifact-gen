apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo540fb9e8-a42a-49b5-8dd8-87f4e3c587b9.fullname" . }}
  labels:
    {{- include "go-echo540fb9e8-a42a-49b5-8dd8-87f4e3c587b9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo540fb9e8-a42a-49b5-8dd8-87f4e3c587b9.selectorLabels" . | nindent 6 }}
