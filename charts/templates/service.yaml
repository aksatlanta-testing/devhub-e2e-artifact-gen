apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc1f607bd-13fb-4714-a4fe-e90a119ce1ab.fullname" . }}
  labels:
    {{- include "go-echoc1f607bd-13fb-4714-a4fe-e90a119ce1ab.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc1f607bd-13fb-4714-a4fe-e90a119ce1ab.selectorLabels" . | nindent 6 }}
