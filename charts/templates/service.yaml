apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo89a48f6e-5b55-4d3b-94e2-d6b4a4bb5b9a.fullname" . }}
  labels:
    {{- include "go-echo89a48f6e-5b55-4d3b-94e2-d6b4a4bb5b9a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo89a48f6e-5b55-4d3b-94e2-d6b4a4bb5b9a.selectorLabels" . | nindent 6 }}
