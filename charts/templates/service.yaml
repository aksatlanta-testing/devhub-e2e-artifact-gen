apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo74272ec4-6f56-4cf9-9997-904b8e64a57e.fullname" . }}
  labels:
    {{- include "go-echo74272ec4-6f56-4cf9-9997-904b8e64a57e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo74272ec4-6f56-4cf9-9997-904b8e64a57e.selectorLabels" . | nindent 6 }}
