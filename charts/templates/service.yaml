apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7ab903b9-8403-49f9-a77a-95417ef38270.fullname" . }}
  labels:
    {{- include "go-echo7ab903b9-8403-49f9-a77a-95417ef38270.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7ab903b9-8403-49f9-a77a-95417ef38270.selectorLabels" . | nindent 6 }}
