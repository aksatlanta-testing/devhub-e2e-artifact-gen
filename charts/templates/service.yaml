apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo129296f5-8bb1-4861-8989-f740208e847d.fullname" . }}
  labels:
    {{- include "go-echo129296f5-8bb1-4861-8989-f740208e847d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo129296f5-8bb1-4861-8989-f740208e847d.selectorLabels" . | nindent 6 }}
