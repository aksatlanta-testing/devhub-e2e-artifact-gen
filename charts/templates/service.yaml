apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa6c0c1a4-1abf-47bb-a91b-c0add70b3d53.fullname" . }}
  labels:
    {{- include "go-echoa6c0c1a4-1abf-47bb-a91b-c0add70b3d53.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa6c0c1a4-1abf-47bb-a91b-c0add70b3d53.selectorLabels" . | nindent 6 }}
