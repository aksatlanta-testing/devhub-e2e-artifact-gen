apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod3ee9061-ea98-4c8d-8e86-60438ba85d11.fullname" . }}
  labels:
    {{- include "go-echod3ee9061-ea98-4c8d-8e86-60438ba85d11.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod3ee9061-ea98-4c8d-8e86-60438ba85d11.selectorLabels" . | nindent 6 }}
