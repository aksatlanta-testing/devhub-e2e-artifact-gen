apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2f84309e-fff3-4526-803d-7b35e60df17f.fullname" . }}
  labels:
    {{- include "go-echo2f84309e-fff3-4526-803d-7b35e60df17f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2f84309e-fff3-4526-803d-7b35e60df17f.selectorLabels" . | nindent 6 }}
