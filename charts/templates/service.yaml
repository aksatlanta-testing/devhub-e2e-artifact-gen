apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9ceb72ff-7ba3-4340-afdd-610019265492.fullname" . }}
  labels:
    {{- include "go-echo9ceb72ff-7ba3-4340-afdd-610019265492.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9ceb72ff-7ba3-4340-afdd-610019265492.selectorLabels" . | nindent 6 }}
