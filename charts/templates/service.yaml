apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9b3c56e2-48e6-46cf-8539-598ac2f17722.fullname" . }}
  labels:
    {{- include "go-echo9b3c56e2-48e6-46cf-8539-598ac2f17722.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9b3c56e2-48e6-46cf-8539-598ac2f17722.selectorLabels" . | nindent 6 }}
