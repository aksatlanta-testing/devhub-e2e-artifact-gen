apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo82d8505a-b518-431d-9e7f-14b3e2068fe1.fullname" . }}
  labels:
    {{- include "go-echo82d8505a-b518-431d-9e7f-14b3e2068fe1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo82d8505a-b518-431d-9e7f-14b3e2068fe1.selectorLabels" . | nindent 6 }}
