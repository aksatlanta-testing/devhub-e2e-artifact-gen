apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo057de5e5-c4dc-422a-a544-93df17b78895.fullname" . }}
  labels:
    {{- include "go-echo057de5e5-c4dc-422a-a544-93df17b78895.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo057de5e5-c4dc-422a-a544-93df17b78895.selectorLabels" . | nindent 6 }}
