apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7fbe2186-23ab-45cf-b617-25a3446f993c.fullname" . }}
  labels:
    {{- include "go-echo7fbe2186-23ab-45cf-b617-25a3446f993c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7fbe2186-23ab-45cf-b617-25a3446f993c.selectorLabels" . | nindent 6 }}
