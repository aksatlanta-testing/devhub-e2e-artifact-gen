apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo599a6b5b-0d91-4ca9-8189-6485ae949231.fullname" . }}
  labels:
    {{- include "go-echo599a6b5b-0d91-4ca9-8189-6485ae949231.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo599a6b5b-0d91-4ca9-8189-6485ae949231.selectorLabels" . | nindent 6 }}
