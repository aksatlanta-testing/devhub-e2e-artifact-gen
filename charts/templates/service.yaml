apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo297838fd-85d3-4967-a8ae-43210ffa42de.fullname" . }}
  labels:
    {{- include "go-echo297838fd-85d3-4967-a8ae-43210ffa42de.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo297838fd-85d3-4967-a8ae-43210ffa42de.selectorLabels" . | nindent 6 }}
