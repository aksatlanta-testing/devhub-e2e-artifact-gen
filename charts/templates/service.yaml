apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe1aa0fd5-7ff0-42e1-9946-8bbd44c7d5bd.fullname" . }}
  labels:
    {{- include "go-echoe1aa0fd5-7ff0-42e1-9946-8bbd44c7d5bd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe1aa0fd5-7ff0-42e1-9946-8bbd44c7d5bd.selectorLabels" . | nindent 6 }}
