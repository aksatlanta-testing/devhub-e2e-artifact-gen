apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa8a7a33b-b290-48fa-b14a-3f97704edf5a.fullname" . }}
  labels:
    {{- include "go-echoa8a7a33b-b290-48fa-b14a-3f97704edf5a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa8a7a33b-b290-48fa-b14a-3f97704edf5a.selectorLabels" . | nindent 6 }}
