apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofd3d0f5a-9131-499e-9d8c-69465363f8b1.fullname" . }}
  labels:
    {{- include "go-echofd3d0f5a-9131-499e-9d8c-69465363f8b1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofd3d0f5a-9131-499e-9d8c-69465363f8b1.selectorLabels" . | nindent 6 }}
