apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo86c659dd-b770-428e-9063-a1b6d42eb2e1.fullname" . }}
  labels:
    {{- include "go-echo86c659dd-b770-428e-9063-a1b6d42eb2e1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo86c659dd-b770-428e-9063-a1b6d42eb2e1.selectorLabels" . | nindent 6 }}
