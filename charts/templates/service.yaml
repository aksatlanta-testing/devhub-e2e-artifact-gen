apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9b6291c2-77fe-418c-b1b0-94845e3d11bf.fullname" . }}
  labels:
    {{- include "go-echo9b6291c2-77fe-418c-b1b0-94845e3d11bf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9b6291c2-77fe-418c-b1b0-94845e3d11bf.selectorLabels" . | nindent 6 }}
