apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo64a5f5e7-dab9-4893-9b78-93d92c20ed49.fullname" . }}
  labels:
    {{- include "go-echo64a5f5e7-dab9-4893-9b78-93d92c20ed49.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo64a5f5e7-dab9-4893-9b78-93d92c20ed49.selectorLabels" . | nindent 6 }}
