apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofb1da7f6-91c3-4c17-aa89-969b9fea3591.fullname" . }}
  labels:
    {{- include "go-echofb1da7f6-91c3-4c17-aa89-969b9fea3591.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofb1da7f6-91c3-4c17-aa89-969b9fea3591.selectorLabels" . | nindent 6 }}
