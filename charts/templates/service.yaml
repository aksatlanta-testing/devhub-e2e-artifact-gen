apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofcd726b0-3a67-4646-8bc4-51b69a7b48bc.fullname" . }}
  labels:
    {{- include "go-echofcd726b0-3a67-4646-8bc4-51b69a7b48bc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofcd726b0-3a67-4646-8bc4-51b69a7b48bc.selectorLabels" . | nindent 6 }}
