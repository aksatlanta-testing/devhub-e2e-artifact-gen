apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob4a3a62d-6e03-4b6f-a6c4-e348c5fccbb7.fullname" . }}
  labels:
    {{- include "go-echob4a3a62d-6e03-4b6f-a6c4-e348c5fccbb7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob4a3a62d-6e03-4b6f-a6c4-e348c5fccbb7.selectorLabels" . | nindent 6 }}
