apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1bae8c4f-f82f-4943-9136-a5d7e1209f3f.fullname" . }}
  labels:
    {{- include "go-echo1bae8c4f-f82f-4943-9136-a5d7e1209f3f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1bae8c4f-f82f-4943-9136-a5d7e1209f3f.selectorLabels" . | nindent 6 }}
