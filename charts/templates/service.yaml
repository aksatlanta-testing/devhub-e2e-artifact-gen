apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8aaad822-cf31-406c-ab27-b0b416e686a1.fullname" . }}
  labels:
    {{- include "go-echo8aaad822-cf31-406c-ab27-b0b416e686a1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8aaad822-cf31-406c-ab27-b0b416e686a1.selectorLabels" . | nindent 6 }}
