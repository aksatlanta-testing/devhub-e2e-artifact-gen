apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8511a80d-203a-4dd6-8a4a-4f125d3278e9.fullname" . }}
  labels:
    {{- include "go-echo8511a80d-203a-4dd6-8a4a-4f125d3278e9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8511a80d-203a-4dd6-8a4a-4f125d3278e9.selectorLabels" . | nindent 6 }}
