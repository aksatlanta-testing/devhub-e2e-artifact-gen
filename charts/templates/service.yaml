apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6f55e645-608b-43f1-adb7-3e01a770ce48.fullname" . }}
  labels:
    {{- include "go-echo6f55e645-608b-43f1-adb7-3e01a770ce48.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6f55e645-608b-43f1-adb7-3e01a770ce48.selectorLabels" . | nindent 6 }}
