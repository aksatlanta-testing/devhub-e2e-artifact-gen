apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2808fbff-231c-4012-a95f-f7c7ba60aafa.fullname" . }}
  labels:
    {{- include "go-echo2808fbff-231c-4012-a95f-f7c7ba60aafa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2808fbff-231c-4012-a95f-f7c7ba60aafa.selectorLabels" . | nindent 6 }}
