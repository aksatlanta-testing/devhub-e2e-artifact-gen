apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo975db7b2-2243-4701-b72f-4647c54395c9.fullname" . }}
  labels:
    {{- include "go-echo975db7b2-2243-4701-b72f-4647c54395c9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo975db7b2-2243-4701-b72f-4647c54395c9.selectorLabels" . | nindent 6 }}
