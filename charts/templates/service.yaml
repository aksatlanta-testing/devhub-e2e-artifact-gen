apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo721cb3a4-6f48-4627-8b1f-9b7abc57acce.fullname" . }}
  labels:
    {{- include "go-echo721cb3a4-6f48-4627-8b1f-9b7abc57acce.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo721cb3a4-6f48-4627-8b1f-9b7abc57acce.selectorLabels" . | nindent 6 }}
