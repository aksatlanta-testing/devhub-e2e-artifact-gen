apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8804a76d-2682-4c54-afad-52a04ac93220.fullname" . }}
  labels:
    {{- include "go-echo8804a76d-2682-4c54-afad-52a04ac93220.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8804a76d-2682-4c54-afad-52a04ac93220.selectorLabels" . | nindent 6 }}
