apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoacc2fd3b-b307-41ae-8d3c-f9cbb36a92c7.fullname" . }}
  labels:
    {{- include "go-echoacc2fd3b-b307-41ae-8d3c-f9cbb36a92c7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoacc2fd3b-b307-41ae-8d3c-f9cbb36a92c7.selectorLabels" . | nindent 6 }}
