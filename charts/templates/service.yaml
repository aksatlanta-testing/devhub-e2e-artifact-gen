apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof68c3072-c869-4830-9685-d19b6c7a3b18.fullname" . }}
  labels:
    {{- include "go-echof68c3072-c869-4830-9685-d19b6c7a3b18.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof68c3072-c869-4830-9685-d19b6c7a3b18.selectorLabels" . | nindent 6 }}
