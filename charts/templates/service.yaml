apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob38099f1-9f50-44e3-9f74-7a64bd2d79da.fullname" . }}
  labels:
    {{- include "go-echob38099f1-9f50-44e3-9f74-7a64bd2d79da.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob38099f1-9f50-44e3-9f74-7a64bd2d79da.selectorLabels" . | nindent 6 }}
