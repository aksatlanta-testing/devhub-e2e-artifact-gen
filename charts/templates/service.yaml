apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo51a6920d-d7c5-411a-a28d-9f318c6a5876.fullname" . }}
  labels:
    {{- include "go-echo51a6920d-d7c5-411a-a28d-9f318c6a5876.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo51a6920d-d7c5-411a-a28d-9f318c6a5876.selectorLabels" . | nindent 6 }}
