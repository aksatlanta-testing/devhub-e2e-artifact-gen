apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo55010179-7bfc-4fa2-a1a2-6288f1b416ec.fullname" . }}
  labels:
    {{- include "go-echo55010179-7bfc-4fa2-a1a2-6288f1b416ec.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo55010179-7bfc-4fa2-a1a2-6288f1b416ec.selectorLabels" . | nindent 6 }}
