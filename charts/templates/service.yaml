apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo89179773-55ac-40cd-8636-08dc4914cd53.fullname" . }}
  labels:
    {{- include "go-echo89179773-55ac-40cd-8636-08dc4914cd53.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo89179773-55ac-40cd-8636-08dc4914cd53.selectorLabels" . | nindent 6 }}
