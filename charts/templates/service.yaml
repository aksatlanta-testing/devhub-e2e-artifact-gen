apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo686735fa-21e0-49de-b016-730883d89eac.fullname" . }}
  labels:
    {{- include "go-echo686735fa-21e0-49de-b016-730883d89eac.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo686735fa-21e0-49de-b016-730883d89eac.selectorLabels" . | nindent 6 }}
