apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo63663a67-277d-4f94-ab4f-bf82a0e16987.fullname" . }}
  labels:
    {{- include "go-echo63663a67-277d-4f94-ab4f-bf82a0e16987.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo63663a67-277d-4f94-ab4f-bf82a0e16987.selectorLabels" . | nindent 6 }}
