apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6237c69c-15eb-42a1-a642-680233d88450.fullname" . }}
  labels:
    {{- include "go-echo6237c69c-15eb-42a1-a642-680233d88450.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6237c69c-15eb-42a1-a642-680233d88450.selectorLabels" . | nindent 6 }}
