apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe519fdd0-9c40-4c12-86b6-2858b9f14384.fullname" . }}
  labels:
    {{- include "go-echoe519fdd0-9c40-4c12-86b6-2858b9f14384.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe519fdd0-9c40-4c12-86b6-2858b9f14384.selectorLabels" . | nindent 6 }}
