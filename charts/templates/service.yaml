apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob89689db-0973-4bb3-8e2b-a83acb70619e.fullname" . }}
  labels:
    {{- include "go-echob89689db-0973-4bb3-8e2b-a83acb70619e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob89689db-0973-4bb3-8e2b-a83acb70619e.selectorLabels" . | nindent 6 }}
