apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo05291048-ae0f-4fe4-8dd0-b038845891ae.fullname" . }}
  labels:
    {{- include "go-echo05291048-ae0f-4fe4-8dd0-b038845891ae.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo05291048-ae0f-4fe4-8dd0-b038845891ae.selectorLabels" . | nindent 6 }}
