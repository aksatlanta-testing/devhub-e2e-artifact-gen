apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc7f33c43-5320-4d38-9bf9-ec4a6f327154.fullname" . }}
  labels:
    {{- include "go-echoc7f33c43-5320-4d38-9bf9-ec4a6f327154.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc7f33c43-5320-4d38-9bf9-ec4a6f327154.selectorLabels" . | nindent 6 }}
