apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1b2af9d6-e678-4d6d-bbdc-b7d8039b0348.fullname" . }}
  labels:
    {{- include "go-echo1b2af9d6-e678-4d6d-bbdc-b7d8039b0348.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1b2af9d6-e678-4d6d-bbdc-b7d8039b0348.selectorLabels" . | nindent 6 }}
