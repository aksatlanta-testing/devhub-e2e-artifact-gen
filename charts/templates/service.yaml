apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofd96254a-37ea-407c-a8d7-390273c3a553.fullname" . }}
  labels:
    {{- include "go-echofd96254a-37ea-407c-a8d7-390273c3a553.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofd96254a-37ea-407c-a8d7-390273c3a553.selectorLabels" . | nindent 6 }}
