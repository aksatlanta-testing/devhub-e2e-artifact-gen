apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4e54cb30-dfa0-49ac-a177-51ad4900a3b2.fullname" . }}
  labels:
    {{- include "go-echo4e54cb30-dfa0-49ac-a177-51ad4900a3b2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4e54cb30-dfa0-49ac-a177-51ad4900a3b2.selectorLabels" . | nindent 6 }}
