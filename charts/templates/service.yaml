apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo779036b6-bcc7-4c6c-8c6c-77e9dd79d4de.fullname" . }}
  labels:
    {{- include "go-echo779036b6-bcc7-4c6c-8c6c-77e9dd79d4de.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo779036b6-bcc7-4c6c-8c6c-77e9dd79d4de.selectorLabels" . | nindent 6 }}
