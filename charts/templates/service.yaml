apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo50756806-d8f1-400b-ab5e-b2650a81a147.fullname" . }}
  labels:
    {{- include "go-echo50756806-d8f1-400b-ab5e-b2650a81a147.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo50756806-d8f1-400b-ab5e-b2650a81a147.selectorLabels" . | nindent 6 }}
