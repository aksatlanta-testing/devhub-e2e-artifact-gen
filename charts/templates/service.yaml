apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo12af6fcb-be49-4e6a-a9c7-64c54a8f8ec6.fullname" . }}
  labels:
    {{- include "go-echo12af6fcb-be49-4e6a-a9c7-64c54a8f8ec6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo12af6fcb-be49-4e6a-a9c7-64c54a8f8ec6.selectorLabels" . | nindent 6 }}
