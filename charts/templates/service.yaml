apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo21a75c79-01bd-4e38-afcd-a4952804ffb5.fullname" . }}
  labels:
    {{- include "go-echo21a75c79-01bd-4e38-afcd-a4952804ffb5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo21a75c79-01bd-4e38-afcd-a4952804ffb5.selectorLabels" . | nindent 6 }}
