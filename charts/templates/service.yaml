apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5d32f972-a9f3-4ff2-94af-41e6f37b8cd1.fullname" . }}
  labels:
    {{- include "go-echo5d32f972-a9f3-4ff2-94af-41e6f37b8cd1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5d32f972-a9f3-4ff2-94af-41e6f37b8cd1.selectorLabels" . | nindent 6 }}
