apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc0b5a57e-cd0f-430d-a259-c0468d5c5124.fullname" . }}
  labels:
    {{- include "go-echoc0b5a57e-cd0f-430d-a259-c0468d5c5124.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc0b5a57e-cd0f-430d-a259-c0468d5c5124.selectorLabels" . | nindent 6 }}
