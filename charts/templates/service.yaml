apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod9ee32cd-9f3d-452e-a567-fb02a9d605e1.fullname" . }}
  labels:
    {{- include "go-echod9ee32cd-9f3d-452e-a567-fb02a9d605e1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod9ee32cd-9f3d-452e-a567-fb02a9d605e1.selectorLabels" . | nindent 6 }}
