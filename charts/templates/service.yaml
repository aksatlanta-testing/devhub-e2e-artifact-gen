apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc4c6b0ee-a196-4550-af36-f3a27d45d55f.fullname" . }}
  labels:
    {{- include "go-echoc4c6b0ee-a196-4550-af36-f3a27d45d55f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc4c6b0ee-a196-4550-af36-f3a27d45d55f.selectorLabels" . | nindent 6 }}
