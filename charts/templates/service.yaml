apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2012251e-9d0d-448b-8486-cffbaf2b3312.fullname" . }}
  labels:
    {{- include "go-echo2012251e-9d0d-448b-8486-cffbaf2b3312.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2012251e-9d0d-448b-8486-cffbaf2b3312.selectorLabels" . | nindent 6 }}
