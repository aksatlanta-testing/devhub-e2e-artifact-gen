apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo89e0c905-7e22-4674-8ae8-5b5c7d5510e4.fullname" . }}
  labels:
    {{- include "go-echo89e0c905-7e22-4674-8ae8-5b5c7d5510e4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo89e0c905-7e22-4674-8ae8-5b5c7d5510e4.selectorLabels" . | nindent 6 }}
