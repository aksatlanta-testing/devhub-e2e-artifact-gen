apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo615116f1-6b2f-4735-b6d5-aaeb1fd08d9c.fullname" . }}
  labels:
    {{- include "go-echo615116f1-6b2f-4735-b6d5-aaeb1fd08d9c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo615116f1-6b2f-4735-b6d5-aaeb1fd08d9c.selectorLabels" . | nindent 6 }}
