apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoeae712b3-237b-49f2-a2b9-afbcd3002769.fullname" . }}
  labels:
    {{- include "go-echoeae712b3-237b-49f2-a2b9-afbcd3002769.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoeae712b3-237b-49f2-a2b9-afbcd3002769.selectorLabels" . | nindent 6 }}
