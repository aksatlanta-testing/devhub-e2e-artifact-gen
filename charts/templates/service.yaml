apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoff67dae7-4d33-465a-ad43-41e774060f74.fullname" . }}
  labels:
    {{- include "go-echoff67dae7-4d33-465a-ad43-41e774060f74.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoff67dae7-4d33-465a-ad43-41e774060f74.selectorLabels" . | nindent 6 }}
