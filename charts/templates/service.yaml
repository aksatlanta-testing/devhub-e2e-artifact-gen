apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodb3361b4-a525-411e-a327-734474ed404b.fullname" . }}
  labels:
    {{- include "go-echodb3361b4-a525-411e-a327-734474ed404b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodb3361b4-a525-411e-a327-734474ed404b.selectorLabels" . | nindent 6 }}
