apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo771e927a-42f0-4c88-8961-9dc0cef7fd0c.fullname" . }}
  labels:
    {{- include "go-echo771e927a-42f0-4c88-8961-9dc0cef7fd0c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo771e927a-42f0-4c88-8961-9dc0cef7fd0c.selectorLabels" . | nindent 6 }}
