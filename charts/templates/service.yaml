apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocc1f20a5-be7c-4d5b-b71c-892ab93d2a0f.fullname" . }}
  labels:
    {{- include "go-echocc1f20a5-be7c-4d5b-b71c-892ab93d2a0f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocc1f20a5-be7c-4d5b-b71c-892ab93d2a0f.selectorLabels" . | nindent 6 }}
