apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6d9d7e8d-3e09-40bf-99c3-081572e5615f.fullname" . }}
  labels:
    {{- include "go-echo6d9d7e8d-3e09-40bf-99c3-081572e5615f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6d9d7e8d-3e09-40bf-99c3-081572e5615f.selectorLabels" . | nindent 6 }}
