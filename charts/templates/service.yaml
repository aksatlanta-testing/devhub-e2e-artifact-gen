apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4f7a63bc-b634-4758-ad3f-621008b03ef5.fullname" . }}
  labels:
    {{- include "go-echo4f7a63bc-b634-4758-ad3f-621008b03ef5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4f7a63bc-b634-4758-ad3f-621008b03ef5.selectorLabels" . | nindent 6 }}
