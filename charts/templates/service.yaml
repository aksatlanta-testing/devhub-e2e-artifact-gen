apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof129acaa-0103-421b-b999-c64f813e78aa.fullname" . }}
  labels:
    {{- include "go-echof129acaa-0103-421b-b999-c64f813e78aa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof129acaa-0103-421b-b999-c64f813e78aa.selectorLabels" . | nindent 6 }}
