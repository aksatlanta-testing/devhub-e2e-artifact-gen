apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof903101f-1754-40bc-9b4d-24890091b12d.fullname" . }}
  labels:
    {{- include "go-echof903101f-1754-40bc-9b4d-24890091b12d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof903101f-1754-40bc-9b4d-24890091b12d.selectorLabels" . | nindent 6 }}
