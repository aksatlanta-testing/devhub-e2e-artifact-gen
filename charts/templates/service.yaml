apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4921ceba-5cef-44ce-b1b7-1141a9579622.fullname" . }}
  labels:
    {{- include "go-echo4921ceba-5cef-44ce-b1b7-1141a9579622.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4921ceba-5cef-44ce-b1b7-1141a9579622.selectorLabels" . | nindent 6 }}
