apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa1a1b730-b774-4e95-9d16-f5690ee2dbbc.fullname" . }}
  labels:
    {{- include "go-echoa1a1b730-b774-4e95-9d16-f5690ee2dbbc.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa1a1b730-b774-4e95-9d16-f5690ee2dbbc.selectorLabels" . | nindent 6 }}
