apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4bc5e45d-ea02-48f7-a83c-b00bc14d3766.fullname" . }}
  labels:
    {{- include "go-echo4bc5e45d-ea02-48f7-a83c-b00bc14d3766.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4bc5e45d-ea02-48f7-a83c-b00bc14d3766.selectorLabels" . | nindent 6 }}
