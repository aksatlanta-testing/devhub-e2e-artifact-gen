apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo545f30bc-b6a4-4d04-87f7-4649e120ebd2.fullname" . }}
  labels:
    {{- include "go-echo545f30bc-b6a4-4d04-87f7-4649e120ebd2.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo545f30bc-b6a4-4d04-87f7-4649e120ebd2.selectorLabels" . | nindent 6 }}
