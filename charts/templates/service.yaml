apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa998c59d-f386-4d7c-8fa6-587195bd9c7c.fullname" . }}
  labels:
    {{- include "go-echoa998c59d-f386-4d7c-8fa6-587195bd9c7c.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa998c59d-f386-4d7c-8fa6-587195bd9c7c.selectorLabels" . | nindent 6 }}
