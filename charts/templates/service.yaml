apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo138c4962-2c6d-4835-a85b-d9754827fa41.fullname" . }}
  labels:
    {{- include "go-echo138c4962-2c6d-4835-a85b-d9754827fa41.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo138c4962-2c6d-4835-a85b-d9754827fa41.selectorLabels" . | nindent 6 }}
