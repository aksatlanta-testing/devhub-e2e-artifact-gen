apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo38b4eb91-ab6d-4a7c-ae32-bfd30318d162.fullname" . }}
  labels:
    {{- include "go-echo38b4eb91-ab6d-4a7c-ae32-bfd30318d162.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo38b4eb91-ab6d-4a7c-ae32-bfd30318d162.selectorLabels" . | nindent 6 }}
