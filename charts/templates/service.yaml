apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3a665bd8-d29a-4f82-9318-9a600c53399d.fullname" . }}
  labels:
    {{- include "go-echo3a665bd8-d29a-4f82-9318-9a600c53399d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3a665bd8-d29a-4f82-9318-9a600c53399d.selectorLabels" . | nindent 6 }}
