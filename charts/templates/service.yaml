apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo443bae69-4d71-45be-9a72-0e6801f7265b.fullname" . }}
  labels:
    {{- include "go-echo443bae69-4d71-45be-9a72-0e6801f7265b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo443bae69-4d71-45be-9a72-0e6801f7265b.selectorLabels" . | nindent 6 }}
