apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo13381cc2-95bf-40a7-b11d-00ad96ef7113.fullname" . }}
  labels:
    {{- include "go-echo13381cc2-95bf-40a7-b11d-00ad96ef7113.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo13381cc2-95bf-40a7-b11d-00ad96ef7113.selectorLabels" . | nindent 6 }}
