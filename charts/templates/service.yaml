apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocad873d7-496d-446c-b335-6d3319b1dcf6.fullname" . }}
  labels:
    {{- include "go-echocad873d7-496d-446c-b335-6d3319b1dcf6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocad873d7-496d-446c-b335-6d3319b1dcf6.selectorLabels" . | nindent 6 }}
