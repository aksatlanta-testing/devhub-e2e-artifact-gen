apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofd6f944d-abb3-4451-a1f7-fb178d62f125.fullname" . }}
  labels:
    {{- include "go-echofd6f944d-abb3-4451-a1f7-fb178d62f125.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofd6f944d-abb3-4451-a1f7-fb178d62f125.selectorLabels" . | nindent 6 }}
