apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof8e8d256-676e-4884-8f18-87e0ab4a863d.fullname" . }}
  labels:
    {{- include "go-echof8e8d256-676e-4884-8f18-87e0ab4a863d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof8e8d256-676e-4884-8f18-87e0ab4a863d.selectorLabels" . | nindent 6 }}
