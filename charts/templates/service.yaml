apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9aec9014-09f1-42c3-8e64-819dab3ceacc.fullname" . }}
  labels:
    {{- include "go-echo9aec9014-09f1-42c3-8e64-819dab3ceacc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9aec9014-09f1-42c3-8e64-819dab3ceacc.selectorLabels" . | nindent 6 }}
