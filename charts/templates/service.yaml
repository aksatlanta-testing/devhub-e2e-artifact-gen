apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3877fef0-a32e-461b-bd6a-fde446db9542.fullname" . }}
  labels:
    {{- include "go-echo3877fef0-a32e-461b-bd6a-fde446db9542.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3877fef0-a32e-461b-bd6a-fde446db9542.selectorLabels" . | nindent 6 }}
