apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1bab6b0d-c5f5-449d-829c-befed689f0db.fullname" . }}
  labels:
    {{- include "go-echo1bab6b0d-c5f5-449d-829c-befed689f0db.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1bab6b0d-c5f5-449d-829c-befed689f0db.selectorLabels" . | nindent 6 }}
