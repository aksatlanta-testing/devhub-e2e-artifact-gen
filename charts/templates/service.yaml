apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo616e5308-8d0f-452a-a9d2-e61aa3c942db.fullname" . }}
  labels:
    {{- include "go-echo616e5308-8d0f-452a-a9d2-e61aa3c942db.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo616e5308-8d0f-452a-a9d2-e61aa3c942db.selectorLabels" . | nindent 6 }}
