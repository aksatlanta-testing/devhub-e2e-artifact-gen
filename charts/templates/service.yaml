apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3dda7d61-4e98-4aa0-b93c-7d9b0c3cba1d.fullname" . }}
  labels:
    {{- include "go-echo3dda7d61-4e98-4aa0-b93c-7d9b0c3cba1d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3dda7d61-4e98-4aa0-b93c-7d9b0c3cba1d.selectorLabels" . | nindent 6 }}
