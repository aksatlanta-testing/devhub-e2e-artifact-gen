apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc313e1e4-4164-4044-8e0a-e3a9379e3a13.fullname" . }}
  labels:
    {{- include "go-echoc313e1e4-4164-4044-8e0a-e3a9379e3a13.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc313e1e4-4164-4044-8e0a-e3a9379e3a13.selectorLabels" . | nindent 6 }}
