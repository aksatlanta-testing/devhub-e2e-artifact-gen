apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo975af3e9-27b2-409b-8f34-09814f5d3f72.fullname" . }}
  labels:
    {{- include "go-echo975af3e9-27b2-409b-8f34-09814f5d3f72.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo975af3e9-27b2-409b-8f34-09814f5d3f72.selectorLabels" . | nindent 6 }}
