apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofd33d291-5834-46c0-89c5-2f550941ac38.fullname" . }}
  labels:
    {{- include "go-echofd33d291-5834-46c0-89c5-2f550941ac38.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofd33d291-5834-46c0-89c5-2f550941ac38.selectorLabels" . | nindent 6 }}
