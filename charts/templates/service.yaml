apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobb469a86-bcab-47d3-b37f-fbe4df901f00.fullname" . }}
  labels:
    {{- include "go-echobb469a86-bcab-47d3-b37f-fbe4df901f00.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobb469a86-bcab-47d3-b37f-fbe4df901f00.selectorLabels" . | nindent 6 }}
