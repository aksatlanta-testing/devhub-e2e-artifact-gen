apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo543b468b-46c5-41b3-8297-f5fc48eda25f.fullname" . }}
  labels:
    {{- include "go-echo543b468b-46c5-41b3-8297-f5fc48eda25f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo543b468b-46c5-41b3-8297-f5fc48eda25f.selectorLabels" . | nindent 6 }}
