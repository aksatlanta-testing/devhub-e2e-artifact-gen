apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo05e5b9d3-93b3-410c-a09c-03683edc7fc2.fullname" . }}
  labels:
    {{- include "go-echo05e5b9d3-93b3-410c-a09c-03683edc7fc2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo05e5b9d3-93b3-410c-a09c-03683edc7fc2.selectorLabels" . | nindent 6 }}
