apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8f91f8b1-b8e1-4a86-a44a-08bbd4390361.fullname" . }}
  labels:
    {{- include "go-echo8f91f8b1-b8e1-4a86-a44a-08bbd4390361.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8f91f8b1-b8e1-4a86-a44a-08bbd4390361.selectorLabels" . | nindent 6 }}
