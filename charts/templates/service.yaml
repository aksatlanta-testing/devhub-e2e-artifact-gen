apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1b0d1e8f-4735-4845-9cef-10c49707e02c.fullname" . }}
  labels:
    {{- include "go-echo1b0d1e8f-4735-4845-9cef-10c49707e02c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1b0d1e8f-4735-4845-9cef-10c49707e02c.selectorLabels" . | nindent 6 }}
