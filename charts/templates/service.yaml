apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobded6edb-96e4-4fab-97b4-24fa426b68ed.fullname" . }}
  labels:
    {{- include "go-echobded6edb-96e4-4fab-97b4-24fa426b68ed.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobded6edb-96e4-4fab-97b4-24fa426b68ed.selectorLabels" . | nindent 6 }}
