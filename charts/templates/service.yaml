apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo35abfeab-4871-4bd6-bdff-8f1be5979998.fullname" . }}
  labels:
    {{- include "go-echo35abfeab-4871-4bd6-bdff-8f1be5979998.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo35abfeab-4871-4bd6-bdff-8f1be5979998.selectorLabels" . | nindent 6 }}
