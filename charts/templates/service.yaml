apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe9b2f4a5-9e20-43f0-ae00-db226d91703d.fullname" . }}
  labels:
    {{- include "go-echoe9b2f4a5-9e20-43f0-ae00-db226d91703d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe9b2f4a5-9e20-43f0-ae00-db226d91703d.selectorLabels" . | nindent 6 }}
