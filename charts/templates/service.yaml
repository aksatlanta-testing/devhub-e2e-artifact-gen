apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo606f94af-550a-4ca4-a341-18bf9b9aac2c.fullname" . }}
  labels:
    {{- include "go-echo606f94af-550a-4ca4-a341-18bf9b9aac2c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo606f94af-550a-4ca4-a341-18bf9b9aac2c.selectorLabels" . | nindent 6 }}
