apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9dbe4bba-78fe-4a85-ad44-a5b0817b0325.fullname" . }}
  labels:
    {{- include "go-echo9dbe4bba-78fe-4a85-ad44-a5b0817b0325.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9dbe4bba-78fe-4a85-ad44-a5b0817b0325.selectorLabels" . | nindent 6 }}
