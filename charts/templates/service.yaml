apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc381af7f-5f5a-4c96-82a3-7a174c888490.fullname" . }}
  labels:
    {{- include "go-echoc381af7f-5f5a-4c96-82a3-7a174c888490.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc381af7f-5f5a-4c96-82a3-7a174c888490.selectorLabels" . | nindent 6 }}
