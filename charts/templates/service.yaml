apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo151d1a1e-2ba9-4026-87cc-b9fd9a9ebc85.fullname" . }}
  labels:
    {{- include "go-echo151d1a1e-2ba9-4026-87cc-b9fd9a9ebc85.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo151d1a1e-2ba9-4026-87cc-b9fd9a9ebc85.selectorLabels" . | nindent 6 }}
