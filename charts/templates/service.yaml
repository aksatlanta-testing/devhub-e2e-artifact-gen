apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7652d0c6-f143-40aa-b014-7ed7deb1be41.fullname" . }}
  labels:
    {{- include "go-echo7652d0c6-f143-40aa-b014-7ed7deb1be41.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7652d0c6-f143-40aa-b014-7ed7deb1be41.selectorLabels" . | nindent 6 }}
