apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3b06edb0-1858-4a7d-82fa-36bd2a71e090.fullname" . }}
  labels:
    {{- include "go-echo3b06edb0-1858-4a7d-82fa-36bd2a71e090.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3b06edb0-1858-4a7d-82fa-36bd2a71e090.selectorLabels" . | nindent 6 }}
