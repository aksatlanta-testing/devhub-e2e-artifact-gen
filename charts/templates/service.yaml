apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1aa60cd5-b2d0-4408-9bcf-e834687ba948.fullname" . }}
  labels:
    {{- include "go-echo1aa60cd5-b2d0-4408-9bcf-e834687ba948.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1aa60cd5-b2d0-4408-9bcf-e834687ba948.selectorLabels" . | nindent 6 }}
