apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo896f7a9a-9997-4f2d-9445-d9412504c97f.fullname" . }}
  labels:
    {{- include "go-echo896f7a9a-9997-4f2d-9445-d9412504c97f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo896f7a9a-9997-4f2d-9445-d9412504c97f.selectorLabels" . | nindent 6 }}
