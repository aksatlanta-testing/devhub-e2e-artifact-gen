apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod9085e0a-a951-4e92-8620-3bbbed949305.fullname" . }}
  labels:
    {{- include "go-echod9085e0a-a951-4e92-8620-3bbbed949305.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod9085e0a-a951-4e92-8620-3bbbed949305.selectorLabels" . | nindent 6 }}
