apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo450193da-0964-491a-b31b-51cdcc95fb80.fullname" . }}
  labels:
    {{- include "go-echo450193da-0964-491a-b31b-51cdcc95fb80.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo450193da-0964-491a-b31b-51cdcc95fb80.selectorLabels" . | nindent 6 }}
