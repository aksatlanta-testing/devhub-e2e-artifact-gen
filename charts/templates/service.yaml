apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoec0c171e-1fef-49e0-b2eb-6e01f67de04e.fullname" . }}
  labels:
    {{- include "go-echoec0c171e-1fef-49e0-b2eb-6e01f67de04e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoec0c171e-1fef-49e0-b2eb-6e01f67de04e.selectorLabels" . | nindent 6 }}
