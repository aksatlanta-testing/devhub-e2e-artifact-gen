apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc5bcfba9-802e-429e-9d20-74d060cefe3a.fullname" . }}
  labels:
    {{- include "go-echoc5bcfba9-802e-429e-9d20-74d060cefe3a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc5bcfba9-802e-429e-9d20-74d060cefe3a.selectorLabels" . | nindent 6 }}
