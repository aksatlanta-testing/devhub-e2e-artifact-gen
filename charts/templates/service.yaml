apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4195a228-38fb-4282-86ea-35caffc9b001.fullname" . }}
  labels:
    {{- include "go-echo4195a228-38fb-4282-86ea-35caffc9b001.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4195a228-38fb-4282-86ea-35caffc9b001.selectorLabels" . | nindent 6 }}
