apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod517db86-045f-4f8a-825b-38920dca1f02.fullname" . }}
  labels:
    {{- include "go-echod517db86-045f-4f8a-825b-38920dca1f02.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod517db86-045f-4f8a-825b-38920dca1f02.selectorLabels" . | nindent 6 }}
