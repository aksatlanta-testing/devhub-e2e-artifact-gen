apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof8c24be2-4c4d-41c6-871a-a986f2175e67.fullname" . }}
  labels:
    {{- include "go-echof8c24be2-4c4d-41c6-871a-a986f2175e67.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof8c24be2-4c4d-41c6-871a-a986f2175e67.selectorLabels" . | nindent 6 }}
