apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3dbadf8e-1f80-4310-8361-2442fdef0263.fullname" . }}
  labels:
    {{- include "go-echo3dbadf8e-1f80-4310-8361-2442fdef0263.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3dbadf8e-1f80-4310-8361-2442fdef0263.selectorLabels" . | nindent 6 }}
