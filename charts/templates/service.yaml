apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo336aa2d0-5d8b-4236-9630-c9f71995f91b.fullname" . }}
  labels:
    {{- include "go-echo336aa2d0-5d8b-4236-9630-c9f71995f91b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo336aa2d0-5d8b-4236-9630-c9f71995f91b.selectorLabels" . | nindent 6 }}
