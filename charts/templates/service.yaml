apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7a5fecaa-8897-40d3-a277-8bdab60a4225.fullname" . }}
  labels:
    {{- include "go-echo7a5fecaa-8897-40d3-a277-8bdab60a4225.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7a5fecaa-8897-40d3-a277-8bdab60a4225.selectorLabels" . | nindent 6 }}
