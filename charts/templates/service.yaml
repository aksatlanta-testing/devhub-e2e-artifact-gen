apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe61494f4-049b-4888-80ea-3e1ba04c76bf.fullname" . }}
  labels:
    {{- include "go-echoe61494f4-049b-4888-80ea-3e1ba04c76bf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe61494f4-049b-4888-80ea-3e1ba04c76bf.selectorLabels" . | nindent 6 }}
