apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe9eb3201-b7b1-4b90-9045-ea99d653e456.fullname" . }}
  labels:
    {{- include "go-echoe9eb3201-b7b1-4b90-9045-ea99d653e456.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe9eb3201-b7b1-4b90-9045-ea99d653e456.selectorLabels" . | nindent 6 }}
