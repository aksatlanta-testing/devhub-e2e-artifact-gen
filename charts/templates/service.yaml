apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe7a18f83-e11d-4a96-b29e-5c9d8ceca775.fullname" . }}
  labels:
    {{- include "go-echoe7a18f83-e11d-4a96-b29e-5c9d8ceca775.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe7a18f83-e11d-4a96-b29e-5c9d8ceca775.selectorLabels" . | nindent 6 }}
