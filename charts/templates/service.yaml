apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof625f90e-e2a1-4f11-91a3-29f059429988.fullname" . }}
  labels:
    {{- include "go-echof625f90e-e2a1-4f11-91a3-29f059429988.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof625f90e-e2a1-4f11-91a3-29f059429988.selectorLabels" . | nindent 6 }}
