apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo906232d4-205d-455b-89bb-85cb9c44e029.fullname" . }}
  labels:
    {{- include "go-echo906232d4-205d-455b-89bb-85cb9c44e029.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo906232d4-205d-455b-89bb-85cb9c44e029.selectorLabels" . | nindent 6 }}
