apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0d0a174b-898f-4bb0-ac95-9e165b4611b8.fullname" . }}
  labels:
    {{- include "go-echo0d0a174b-898f-4bb0-ac95-9e165b4611b8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0d0a174b-898f-4bb0-ac95-9e165b4611b8.selectorLabels" . | nindent 6 }}
