apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo61a2dc7c-6819-451f-954d-c17df53326f3.fullname" . }}
  labels:
    {{- include "go-echo61a2dc7c-6819-451f-954d-c17df53326f3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo61a2dc7c-6819-451f-954d-c17df53326f3.selectorLabels" . | nindent 6 }}
