apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4d924850-a320-476f-88ea-39cd9b994c57.fullname" . }}
  labels:
    {{- include "go-echo4d924850-a320-476f-88ea-39cd9b994c57.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4d924850-a320-476f-88ea-39cd9b994c57.selectorLabels" . | nindent 6 }}
