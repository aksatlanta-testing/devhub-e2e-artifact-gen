apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocd9bc742-ba3f-408f-932b-1a04d96f7779.fullname" . }}
  labels:
    {{- include "go-echocd9bc742-ba3f-408f-932b-1a04d96f7779.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocd9bc742-ba3f-408f-932b-1a04d96f7779.selectorLabels" . | nindent 6 }}
