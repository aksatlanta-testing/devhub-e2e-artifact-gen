apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoab97fcbb-0217-4006-a3a9-e8764e4fc496.fullname" . }}
  labels:
    {{- include "go-echoab97fcbb-0217-4006-a3a9-e8764e4fc496.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoab97fcbb-0217-4006-a3a9-e8764e4fc496.selectorLabels" . | nindent 6 }}
