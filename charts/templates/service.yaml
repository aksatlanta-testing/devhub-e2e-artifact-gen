apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo80dbe172-4fa6-4674-8c24-c0c5dd92576a.fullname" . }}
  labels:
    {{- include "go-echo80dbe172-4fa6-4674-8c24-c0c5dd92576a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo80dbe172-4fa6-4674-8c24-c0c5dd92576a.selectorLabels" . | nindent 6 }}
