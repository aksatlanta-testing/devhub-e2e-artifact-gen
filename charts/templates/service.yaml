apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo95e979b9-caf5-4624-8be9-c586ec802f7f.fullname" . }}
  labels:
    {{- include "go-echo95e979b9-caf5-4624-8be9-c586ec802f7f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo95e979b9-caf5-4624-8be9-c586ec802f7f.selectorLabels" . | nindent 6 }}
