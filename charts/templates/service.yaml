apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo73b33c14-6b85-4e05-b3f1-cfb8f76d5e03.fullname" . }}
  labels:
    {{- include "go-echo73b33c14-6b85-4e05-b3f1-cfb8f76d5e03.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo73b33c14-6b85-4e05-b3f1-cfb8f76d5e03.selectorLabels" . | nindent 6 }}
