apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4e5e6369-4ffe-477d-af9a-81082036fce7.fullname" . }}
  labels:
    {{- include "go-echo4e5e6369-4ffe-477d-af9a-81082036fce7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4e5e6369-4ffe-477d-af9a-81082036fce7.selectorLabels" . | nindent 6 }}
