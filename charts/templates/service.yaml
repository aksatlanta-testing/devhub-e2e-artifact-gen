apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo842556cf-aa4e-42f3-89b3-65e9c13e99bf.fullname" . }}
  labels:
    {{- include "go-echo842556cf-aa4e-42f3-89b3-65e9c13e99bf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo842556cf-aa4e-42f3-89b3-65e9c13e99bf.selectorLabels" . | nindent 6 }}
