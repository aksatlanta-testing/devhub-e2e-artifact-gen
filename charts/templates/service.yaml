apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3a2912a8-7367-4198-9725-e8ca07c5cf4c.fullname" . }}
  labels:
    {{- include "go-echo3a2912a8-7367-4198-9725-e8ca07c5cf4c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3a2912a8-7367-4198-9725-e8ca07c5cf4c.selectorLabels" . | nindent 6 }}
