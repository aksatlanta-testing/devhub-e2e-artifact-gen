apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa450cf1d-00ab-40a4-83da-7206b9c29ede.fullname" . }}
  labels:
    {{- include "go-echoa450cf1d-00ab-40a4-83da-7206b9c29ede.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa450cf1d-00ab-40a4-83da-7206b9c29ede.selectorLabels" . | nindent 6 }}
