apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob33ea34c-0608-472f-add9-04b111b82a79.fullname" . }}
  labels:
    {{- include "go-echob33ea34c-0608-472f-add9-04b111b82a79.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob33ea34c-0608-472f-add9-04b111b82a79.selectorLabels" . | nindent 6 }}
