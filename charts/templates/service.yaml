apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5d030fc8-db85-4bcb-9d2d-89076a95ccf3.fullname" . }}
  labels:
    {{- include "go-echo5d030fc8-db85-4bcb-9d2d-89076a95ccf3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5d030fc8-db85-4bcb-9d2d-89076a95ccf3.selectorLabels" . | nindent 6 }}
