apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo32973c20-5601-4fe9-9670-725d8bc8505e.fullname" . }}
  labels:
    {{- include "go-echo32973c20-5601-4fe9-9670-725d8bc8505e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo32973c20-5601-4fe9-9670-725d8bc8505e.selectorLabels" . | nindent 6 }}
