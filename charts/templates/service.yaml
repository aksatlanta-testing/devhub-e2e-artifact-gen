apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof6dd3769-c890-44ea-9d3b-c417024638dc.fullname" . }}
  labels:
    {{- include "go-echof6dd3769-c890-44ea-9d3b-c417024638dc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof6dd3769-c890-44ea-9d3b-c417024638dc.selectorLabels" . | nindent 6 }}
