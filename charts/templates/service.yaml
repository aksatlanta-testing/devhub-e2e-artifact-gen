apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7f3ecc85-6e81-4b9a-ab3d-8d0828ab84d9.fullname" . }}
  labels:
    {{- include "go-echo7f3ecc85-6e81-4b9a-ab3d-8d0828ab84d9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7f3ecc85-6e81-4b9a-ab3d-8d0828ab84d9.selectorLabels" . | nindent 6 }}
