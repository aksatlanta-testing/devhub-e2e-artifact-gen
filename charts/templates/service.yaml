apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof82f9d8c-61cc-4a23-9c50-c2af87b2dcd5.fullname" . }}
  labels:
    {{- include "go-echof82f9d8c-61cc-4a23-9c50-c2af87b2dcd5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof82f9d8c-61cc-4a23-9c50-c2af87b2dcd5.selectorLabels" . | nindent 6 }}
