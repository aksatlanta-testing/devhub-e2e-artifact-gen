apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodadaeace-662a-4841-a515-d8086b562482.fullname" . }}
  labels:
    {{- include "go-echodadaeace-662a-4841-a515-d8086b562482.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodadaeace-662a-4841-a515-d8086b562482.selectorLabels" . | nindent 6 }}
