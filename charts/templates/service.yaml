apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoda7cae90-1a39-43f7-875a-09d6751308b9.fullname" . }}
  labels:
    {{- include "go-echoda7cae90-1a39-43f7-875a-09d6751308b9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoda7cae90-1a39-43f7-875a-09d6751308b9.selectorLabels" . | nindent 6 }}
