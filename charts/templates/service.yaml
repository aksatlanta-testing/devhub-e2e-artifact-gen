apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9dadc3b9-1742-4116-9877-0b33e07be806.fullname" . }}
  labels:
    {{- include "go-echo9dadc3b9-1742-4116-9877-0b33e07be806.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9dadc3b9-1742-4116-9877-0b33e07be806.selectorLabels" . | nindent 6 }}
