apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof5a16840-ae0f-47dc-9b05-72dc582f9fd1.fullname" . }}
  labels:
    {{- include "go-echof5a16840-ae0f-47dc-9b05-72dc582f9fd1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof5a16840-ae0f-47dc-9b05-72dc582f9fd1.selectorLabels" . | nindent 6 }}
