apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo95e2712a-f417-49c1-b20f-86eddcbf42d7.fullname" . }}
  labels:
    {{- include "go-echo95e2712a-f417-49c1-b20f-86eddcbf42d7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo95e2712a-f417-49c1-b20f-86eddcbf42d7.selectorLabels" . | nindent 6 }}
