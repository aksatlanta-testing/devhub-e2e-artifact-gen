apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod1bad029-7480-4a33-9de1-aea8e81888d8.fullname" . }}
  labels:
    {{- include "go-echod1bad029-7480-4a33-9de1-aea8e81888d8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod1bad029-7480-4a33-9de1-aea8e81888d8.selectorLabels" . | nindent 6 }}
