apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo61a3986c-135a-4a3d-bf2f-f8c6d1a238cf.fullname" . }}
  labels:
    {{- include "go-echo61a3986c-135a-4a3d-bf2f-f8c6d1a238cf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo61a3986c-135a-4a3d-bf2f-f8c6d1a238cf.selectorLabels" . | nindent 6 }}
