apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc56384b9-71da-4952-b528-3907f7cee6b3.fullname" . }}
  labels:
    {{- include "go-echoc56384b9-71da-4952-b528-3907f7cee6b3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc56384b9-71da-4952-b528-3907f7cee6b3.selectorLabels" . | nindent 6 }}
