apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob87be4a7-ff88-47a1-a844-081b102d2061.fullname" . }}
  labels:
    {{- include "go-echob87be4a7-ff88-47a1-a844-081b102d2061.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob87be4a7-ff88-47a1-a844-081b102d2061.selectorLabels" . | nindent 6 }}
