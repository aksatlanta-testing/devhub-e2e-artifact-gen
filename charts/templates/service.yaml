apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocc9ea8d7-d458-43b0-a07f-c7f99cf6c91b.fullname" . }}
  labels:
    {{- include "go-echocc9ea8d7-d458-43b0-a07f-c7f99cf6c91b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocc9ea8d7-d458-43b0-a07f-c7f99cf6c91b.selectorLabels" . | nindent 6 }}
