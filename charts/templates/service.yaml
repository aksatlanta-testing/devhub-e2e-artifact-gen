apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoee1c0721-9c1a-4bbe-b496-299a41680b17.fullname" . }}
  labels:
    {{- include "go-echoee1c0721-9c1a-4bbe-b496-299a41680b17.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoee1c0721-9c1a-4bbe-b496-299a41680b17.selectorLabels" . | nindent 6 }}
