apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofd33484c-c825-4743-88d3-58083077b40e.fullname" . }}
  labels:
    {{- include "go-echofd33484c-c825-4743-88d3-58083077b40e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofd33484c-c825-4743-88d3-58083077b40e.selectorLabels" . | nindent 6 }}
