apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6fc5ab1c-33eb-4442-97ad-8935a6915a51.fullname" . }}
  labels:
    {{- include "go-echo6fc5ab1c-33eb-4442-97ad-8935a6915a51.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6fc5ab1c-33eb-4442-97ad-8935a6915a51.selectorLabels" . | nindent 6 }}
