apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobaf13819-1cc0-4457-9a7f-1c25386c5707.fullname" . }}
  labels:
    {{- include "go-echobaf13819-1cc0-4457-9a7f-1c25386c5707.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobaf13819-1cc0-4457-9a7f-1c25386c5707.selectorLabels" . | nindent 6 }}
