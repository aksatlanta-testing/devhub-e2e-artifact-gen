apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodd3ea921-cad8-48d4-86b8-beaecc818419.fullname" . }}
  labels:
    {{- include "go-echodd3ea921-cad8-48d4-86b8-beaecc818419.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodd3ea921-cad8-48d4-86b8-beaecc818419.selectorLabels" . | nindent 6 }}
