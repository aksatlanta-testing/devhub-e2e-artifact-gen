apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7911b5e7-fb93-4982-b6bb-987b1d3d6588.fullname" . }}
  labels:
    {{- include "go-echo7911b5e7-fb93-4982-b6bb-987b1d3d6588.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7911b5e7-fb93-4982-b6bb-987b1d3d6588.selectorLabels" . | nindent 6 }}
