apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof2e5ee6c-58d4-4640-97a4-0e3abbefd3a7.fullname" . }}
  labels:
    {{- include "go-echof2e5ee6c-58d4-4640-97a4-0e3abbefd3a7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof2e5ee6c-58d4-4640-97a4-0e3abbefd3a7.selectorLabels" . | nindent 6 }}
