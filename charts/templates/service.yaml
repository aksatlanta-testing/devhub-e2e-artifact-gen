apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo542f2ea4-8810-4de3-b45c-719d77200c38.fullname" . }}
  labels:
    {{- include "go-echo542f2ea4-8810-4de3-b45c-719d77200c38.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo542f2ea4-8810-4de3-b45c-719d77200c38.selectorLabels" . | nindent 6 }}
