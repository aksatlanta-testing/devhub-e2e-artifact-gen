apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6d4dac36-2549-4366-b59f-bb599c759871.fullname" . }}
  labels:
    {{- include "go-echo6d4dac36-2549-4366-b59f-bb599c759871.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6d4dac36-2549-4366-b59f-bb599c759871.selectorLabels" . | nindent 6 }}
