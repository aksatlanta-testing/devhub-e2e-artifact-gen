apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodb582a53-a4b4-4059-996d-d7c71e712a68.fullname" . }}
  labels:
    {{- include "go-echodb582a53-a4b4-4059-996d-d7c71e712a68.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodb582a53-a4b4-4059-996d-d7c71e712a68.selectorLabels" . | nindent 6 }}
