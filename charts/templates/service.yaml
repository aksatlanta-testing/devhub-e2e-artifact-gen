apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof89c0959-672d-482a-ba96-635d9106d74e.fullname" . }}
  labels:
    {{- include "go-echof89c0959-672d-482a-ba96-635d9106d74e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof89c0959-672d-482a-ba96-635d9106d74e.selectorLabels" . | nindent 6 }}
