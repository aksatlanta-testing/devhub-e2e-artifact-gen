apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0809f124-384e-49d0-b28b-ca97df787e6f.fullname" . }}
  labels:
    {{- include "go-echo0809f124-384e-49d0-b28b-ca97df787e6f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0809f124-384e-49d0-b28b-ca97df787e6f.selectorLabels" . | nindent 6 }}
