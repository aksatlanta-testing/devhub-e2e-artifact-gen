apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob0b8f916-8b23-4ec1-a1a4-757b74d537c9.fullname" . }}
  labels:
    {{- include "go-echob0b8f916-8b23-4ec1-a1a4-757b74d537c9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob0b8f916-8b23-4ec1-a1a4-757b74d537c9.selectorLabels" . | nindent 6 }}
