apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo25ec9c1d-9548-4099-8cec-f5c97e992d34.fullname" . }}
  labels:
    {{- include "go-echo25ec9c1d-9548-4099-8cec-f5c97e992d34.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo25ec9c1d-9548-4099-8cec-f5c97e992d34.selectorLabels" . | nindent 6 }}
