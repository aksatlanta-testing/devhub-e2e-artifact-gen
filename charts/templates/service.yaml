apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod4cea1f5-a1e3-4cc6-a96f-67721bc42a8f.fullname" . }}
  labels:
    {{- include "go-echod4cea1f5-a1e3-4cc6-a96f-67721bc42a8f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod4cea1f5-a1e3-4cc6-a96f-67721bc42a8f.selectorLabels" . | nindent 6 }}
