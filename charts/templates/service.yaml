apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3a351a21-b301-434c-84cb-732f088628a0.fullname" . }}
  labels:
    {{- include "go-echo3a351a21-b301-434c-84cb-732f088628a0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3a351a21-b301-434c-84cb-732f088628a0.selectorLabels" . | nindent 6 }}
