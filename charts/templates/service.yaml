apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4e47124f-a0c9-4e32-8e34-58509448aa45.fullname" . }}
  labels:
    {{- include "go-echo4e47124f-a0c9-4e32-8e34-58509448aa45.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4e47124f-a0c9-4e32-8e34-58509448aa45.selectorLabels" . | nindent 6 }}
