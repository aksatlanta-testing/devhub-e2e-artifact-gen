apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1cd1afbf-5762-4b71-87b3-f4d568b01f9f.fullname" . }}
  labels:
    {{- include "go-echo1cd1afbf-5762-4b71-87b3-f4d568b01f9f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1cd1afbf-5762-4b71-87b3-f4d568b01f9f.selectorLabels" . | nindent 6 }}
