apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc7f97ace-3cc5-4011-9118-e7388aa2c844.fullname" . }}
  labels:
    {{- include "go-echoc7f97ace-3cc5-4011-9118-e7388aa2c844.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc7f97ace-3cc5-4011-9118-e7388aa2c844.selectorLabels" . | nindent 6 }}
