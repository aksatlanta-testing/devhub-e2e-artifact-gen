apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo711b1d20-3e18-4ed6-ad40-78e58e534a94.fullname" . }}
  labels:
    {{- include "go-echo711b1d20-3e18-4ed6-ad40-78e58e534a94.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo711b1d20-3e18-4ed6-ad40-78e58e534a94.selectorLabels" . | nindent 6 }}
