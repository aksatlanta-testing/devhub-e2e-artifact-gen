apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa98b39db-042e-449d-86e0-25f868e8797d.fullname" . }}
  labels:
    {{- include "go-echoa98b39db-042e-449d-86e0-25f868e8797d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa98b39db-042e-449d-86e0-25f868e8797d.selectorLabels" . | nindent 6 }}
