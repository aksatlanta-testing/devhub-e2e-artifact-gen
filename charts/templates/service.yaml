apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo50cf6238-478a-45b2-a0a4-f588722fd82f.fullname" . }}
  labels:
    {{- include "go-echo50cf6238-478a-45b2-a0a4-f588722fd82f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo50cf6238-478a-45b2-a0a4-f588722fd82f.selectorLabels" . | nindent 6 }}
