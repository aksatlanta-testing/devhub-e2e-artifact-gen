apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo98a5bc5e-20c7-4beb-842f-f252d991cdbc.fullname" . }}
  labels:
    {{- include "go-echo98a5bc5e-20c7-4beb-842f-f252d991cdbc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo98a5bc5e-20c7-4beb-842f-f252d991cdbc.selectorLabels" . | nindent 6 }}
