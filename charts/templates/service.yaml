apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodf2e5a47-3746-4646-8a6a-14bdf1965a56.fullname" . }}
  labels:
    {{- include "go-echodf2e5a47-3746-4646-8a6a-14bdf1965a56.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodf2e5a47-3746-4646-8a6a-14bdf1965a56.selectorLabels" . | nindent 6 }}
