apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7016b225-4731-4e3a-9cfa-049919e41248.fullname" . }}
  labels:
    {{- include "go-echo7016b225-4731-4e3a-9cfa-049919e41248.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7016b225-4731-4e3a-9cfa-049919e41248.selectorLabels" . | nindent 6 }}
