apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc55f0a30-062e-4143-8ba2-fff5f90f35d0.fullname" . }}
  labels:
    {{- include "go-echoc55f0a30-062e-4143-8ba2-fff5f90f35d0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc55f0a30-062e-4143-8ba2-fff5f90f35d0.selectorLabels" . | nindent 6 }}
