apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1b30ceeb-c4df-462f-86fc-6cbd540fd28e.fullname" . }}
  labels:
    {{- include "go-echo1b30ceeb-c4df-462f-86fc-6cbd540fd28e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1b30ceeb-c4df-462f-86fc-6cbd540fd28e.selectorLabels" . | nindent 6 }}
