apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa49eafec-5dac-4113-96ca-53b2545bc5eb.fullname" . }}
  labels:
    {{- include "go-echoa49eafec-5dac-4113-96ca-53b2545bc5eb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa49eafec-5dac-4113-96ca-53b2545bc5eb.selectorLabels" . | nindent 6 }}
