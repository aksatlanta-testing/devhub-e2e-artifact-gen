apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo06e16d1c-3f2b-40c9-9068-fd19c405a361.fullname" . }}
  labels:
    {{- include "go-echo06e16d1c-3f2b-40c9-9068-fd19c405a361.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo06e16d1c-3f2b-40c9-9068-fd19c405a361.selectorLabels" . | nindent 6 }}
