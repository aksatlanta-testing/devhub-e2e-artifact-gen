apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1a3916a0-0570-425d-a8e8-6de5262d6f92.fullname" . }}
  labels:
    {{- include "go-echo1a3916a0-0570-425d-a8e8-6de5262d6f92.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1a3916a0-0570-425d-a8e8-6de5262d6f92.selectorLabels" . | nindent 6 }}
