apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo48b42b50-596b-4293-9906-781279642bd4.fullname" . }}
  labels:
    {{- include "go-echo48b42b50-596b-4293-9906-781279642bd4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo48b42b50-596b-4293-9906-781279642bd4.selectorLabels" . | nindent 6 }}
