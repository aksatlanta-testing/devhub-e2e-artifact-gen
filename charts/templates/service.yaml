apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof192af59-b8d6-4d84-868b-19eeabdf7ddf.fullname" . }}
  labels:
    {{- include "go-echof192af59-b8d6-4d84-868b-19eeabdf7ddf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof192af59-b8d6-4d84-868b-19eeabdf7ddf.selectorLabels" . | nindent 6 }}
