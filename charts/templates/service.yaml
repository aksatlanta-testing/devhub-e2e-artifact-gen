apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocaa00db2-e497-401a-ad38-a068d05c9487.fullname" . }}
  labels:
    {{- include "go-echocaa00db2-e497-401a-ad38-a068d05c9487.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocaa00db2-e497-401a-ad38-a068d05c9487.selectorLabels" . | nindent 6 }}
