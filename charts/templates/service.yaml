apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof98e2315-2198-4f6a-bdac-9207ca3f4d89.fullname" . }}
  labels:
    {{- include "go-echof98e2315-2198-4f6a-bdac-9207ca3f4d89.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof98e2315-2198-4f6a-bdac-9207ca3f4d89.selectorLabels" . | nindent 6 }}
