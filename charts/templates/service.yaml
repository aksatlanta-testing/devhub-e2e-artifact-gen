apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9413b395-9e13-4e96-8547-ef3085887a02.fullname" . }}
  labels:
    {{- include "go-echo9413b395-9e13-4e96-8547-ef3085887a02.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9413b395-9e13-4e96-8547-ef3085887a02.selectorLabels" . | nindent 6 }}
