apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob79d1df5-20c4-48ac-aa60-9cdeb14888c0.fullname" . }}
  labels:
    {{- include "go-echob79d1df5-20c4-48ac-aa60-9cdeb14888c0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob79d1df5-20c4-48ac-aa60-9cdeb14888c0.selectorLabels" . | nindent 6 }}
