apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6fcad98c-d758-4432-9ad4-ce5cdf4d0715.fullname" . }}
  labels:
    {{- include "go-echo6fcad98c-d758-4432-9ad4-ce5cdf4d0715.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: devhub
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6fcad98c-d758-4432-9ad4-ce5cdf4d0715.selectorLabels" . | nindent 4 }}
