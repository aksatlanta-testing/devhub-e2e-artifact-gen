apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7dcd5dc5-8be6-431d-a289-c6dcdd421b39.fullname" . }}
  labels:
    {{- include "go-echo7dcd5dc5-8be6-431d-a289-c6dcdd421b39.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7dcd5dc5-8be6-431d-a289-c6dcdd421b39.selectorLabels" . | nindent 6 }}
