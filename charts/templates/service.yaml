apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo025fa799-1fab-4d49-a55b-26f253f79f5d.fullname" . }}
  labels:
    {{- include "go-echo025fa799-1fab-4d49-a55b-26f253f79f5d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo025fa799-1fab-4d49-a55b-26f253f79f5d.selectorLabels" . | nindent 6 }}
