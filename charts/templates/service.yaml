apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0148a5f0-820e-49eb-8459-6f60b01c84af.fullname" . }}
  labels:
    {{- include "go-echo0148a5f0-820e-49eb-8459-6f60b01c84af.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0148a5f0-820e-49eb-8459-6f60b01c84af.selectorLabels" . | nindent 6 }}
