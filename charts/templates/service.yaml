apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo52e67080-0afe-45c8-b7c4-cb32945835fe.fullname" . }}
  labels:
    {{- include "go-echo52e67080-0afe-45c8-b7c4-cb32945835fe.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo52e67080-0afe-45c8-b7c4-cb32945835fe.selectorLabels" . | nindent 6 }}
