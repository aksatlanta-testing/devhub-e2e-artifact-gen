apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo00d47a3b-325f-475f-b24b-0a747f4840a6.fullname" . }}
  labels:
    {{- include "go-echo00d47a3b-325f-475f-b24b-0a747f4840a6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo00d47a3b-325f-475f-b24b-0a747f4840a6.selectorLabels" . | nindent 6 }}
