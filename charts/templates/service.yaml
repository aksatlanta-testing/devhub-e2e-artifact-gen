apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe61e28bc-3341-46da-8b9f-a384dffbc853.fullname" . }}
  labels:
    {{- include "go-echoe61e28bc-3341-46da-8b9f-a384dffbc853.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe61e28bc-3341-46da-8b9f-a384dffbc853.selectorLabels" . | nindent 6 }}
