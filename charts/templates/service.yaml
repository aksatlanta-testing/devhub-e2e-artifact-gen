apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2592750f-358e-4aa7-b786-807b71dd35d6.fullname" . }}
  labels:
    {{- include "go-echo2592750f-358e-4aa7-b786-807b71dd35d6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2592750f-358e-4aa7-b786-807b71dd35d6.selectorLabels" . | nindent 6 }}
