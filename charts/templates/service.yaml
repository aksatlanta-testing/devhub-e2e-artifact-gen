apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3545fb4e-d843-4396-abcc-b1d096f63c52.fullname" . }}
  labels:
    {{- include "go-echo3545fb4e-d843-4396-abcc-b1d096f63c52.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3545fb4e-d843-4396-abcc-b1d096f63c52.selectorLabels" . | nindent 6 }}
