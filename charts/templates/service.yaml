apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe7040550-b13f-4887-9cbf-7817c0323a5a.fullname" . }}
  labels:
    {{- include "go-echoe7040550-b13f-4887-9cbf-7817c0323a5a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe7040550-b13f-4887-9cbf-7817c0323a5a.selectorLabels" . | nindent 6 }}
