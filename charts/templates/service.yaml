apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3074b4bb-ca2a-4d38-ae10-7624bf3c6386.fullname" . }}
  labels:
    {{- include "go-echo3074b4bb-ca2a-4d38-ae10-7624bf3c6386.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3074b4bb-ca2a-4d38-ae10-7624bf3c6386.selectorLabels" . | nindent 6 }}
