apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1e47e849-b40b-4ee9-8fb1-dfc0236ccf01.fullname" . }}
  labels:
    {{- include "go-echo1e47e849-b40b-4ee9-8fb1-dfc0236ccf01.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1e47e849-b40b-4ee9-8fb1-dfc0236ccf01.selectorLabels" . | nindent 6 }}
