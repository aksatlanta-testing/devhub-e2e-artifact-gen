apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7d3bc754-12b4-4e74-b8e6-af6f9ca7387d.fullname" . }}
  labels:
    {{- include "go-echo7d3bc754-12b4-4e74-b8e6-af6f9ca7387d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7d3bc754-12b4-4e74-b8e6-af6f9ca7387d.selectorLabels" . | nindent 6 }}
