apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob9d3e190-b8e8-4354-9d29-8aefbd06ee23.fullname" . }}
  labels:
    {{- include "go-echob9d3e190-b8e8-4354-9d29-8aefbd06ee23.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob9d3e190-b8e8-4354-9d29-8aefbd06ee23.selectorLabels" . | nindent 6 }}
