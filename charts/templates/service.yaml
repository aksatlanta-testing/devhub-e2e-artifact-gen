apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoea9965ce-b3f9-4ce7-97ca-265fbe27ef65.fullname" . }}
  labels:
    {{- include "go-echoea9965ce-b3f9-4ce7-97ca-265fbe27ef65.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoea9965ce-b3f9-4ce7-97ca-265fbe27ef65.selectorLabels" . | nindent 6 }}
