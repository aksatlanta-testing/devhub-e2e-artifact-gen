apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo53eddb3e-07ae-47e9-bb9e-fc7b17663c7d.fullname" . }}
  labels:
    {{- include "go-echo53eddb3e-07ae-47e9-bb9e-fc7b17663c7d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo53eddb3e-07ae-47e9-bb9e-fc7b17663c7d.selectorLabels" . | nindent 6 }}
