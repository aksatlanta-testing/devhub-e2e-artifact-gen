apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1035fd14-b0a7-427b-b263-29a4d328a854.fullname" . }}
  labels:
    {{- include "go-echo1035fd14-b0a7-427b-b263-29a4d328a854.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1035fd14-b0a7-427b-b263-29a4d328a854.selectorLabels" . | nindent 6 }}
