apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe936c92c-ef35-48f5-a3b4-d3d04d0d05e4.fullname" . }}
  labels:
    {{- include "go-echoe936c92c-ef35-48f5-a3b4-d3d04d0d05e4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe936c92c-ef35-48f5-a3b4-d3d04d0d05e4.selectorLabels" . | nindent 6 }}
