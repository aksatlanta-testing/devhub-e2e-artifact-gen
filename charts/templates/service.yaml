apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe2d800ac-55d1-478b-bbca-4359f2998792.fullname" . }}
  labels:
    {{- include "go-echoe2d800ac-55d1-478b-bbca-4359f2998792.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe2d800ac-55d1-478b-bbca-4359f2998792.selectorLabels" . | nindent 6 }}
