apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3986b8e5-4376-406a-a266-fa1aae837bed.fullname" . }}
  labels:
    {{- include "go-echo3986b8e5-4376-406a-a266-fa1aae837bed.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3986b8e5-4376-406a-a266-fa1aae837bed.selectorLabels" . | nindent 6 }}
