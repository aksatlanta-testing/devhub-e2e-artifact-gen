apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo03eebf53-e02c-4df0-99d3-eaf52c181f6c.fullname" . }}
  labels:
    {{- include "go-echo03eebf53-e02c-4df0-99d3-eaf52c181f6c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo03eebf53-e02c-4df0-99d3-eaf52c181f6c.selectorLabels" . | nindent 6 }}
