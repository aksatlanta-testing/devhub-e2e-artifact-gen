apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3b048a0e-ce28-4cd8-a88b-93ac8812c390.fullname" . }}
  labels:
    {{- include "go-echo3b048a0e-ce28-4cd8-a88b-93ac8812c390.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3b048a0e-ce28-4cd8-a88b-93ac8812c390.selectorLabels" . | nindent 6 }}
