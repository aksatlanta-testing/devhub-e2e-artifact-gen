apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod2b9f6e7-6865-4e09-bf4a-a200d62ec3b3.fullname" . }}
  labels:
    {{- include "go-echod2b9f6e7-6865-4e09-bf4a-a200d62ec3b3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod2b9f6e7-6865-4e09-bf4a-a200d62ec3b3.selectorLabels" . | nindent 6 }}
