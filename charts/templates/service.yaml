apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9e7dea43-faad-4d61-878a-e01694798800.fullname" . }}
  labels:
    {{- include "go-echo9e7dea43-faad-4d61-878a-e01694798800.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9e7dea43-faad-4d61-878a-e01694798800.selectorLabels" . | nindent 6 }}
