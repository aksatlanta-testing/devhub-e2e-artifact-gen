apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6c93f1cc-780c-4f2f-94db-8369bcb18e54.fullname" . }}
  labels:
    {{- include "go-echo6c93f1cc-780c-4f2f-94db-8369bcb18e54.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6c93f1cc-780c-4f2f-94db-8369bcb18e54.selectorLabels" . | nindent 6 }}
