apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof096f9b1-8bd3-44f8-b961-9a93b3ec1852.fullname" . }}
  labels:
    {{- include "go-echof096f9b1-8bd3-44f8-b961-9a93b3ec1852.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof096f9b1-8bd3-44f8-b961-9a93b3ec1852.selectorLabels" . | nindent 6 }}
