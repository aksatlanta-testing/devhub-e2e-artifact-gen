apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo996b4b78-734b-4015-94b4-822a9ba4b9c6.fullname" . }}
  labels:
    {{- include "go-echo996b4b78-734b-4015-94b4-822a9ba4b9c6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo996b4b78-734b-4015-94b4-822a9ba4b9c6.selectorLabels" . | nindent 6 }}
