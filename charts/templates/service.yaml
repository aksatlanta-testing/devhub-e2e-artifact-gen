apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo16168f45-f596-4165-9a2c-d79db88f8185.fullname" . }}
  labels:
    {{- include "go-echo16168f45-f596-4165-9a2c-d79db88f8185.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo16168f45-f596-4165-9a2c-d79db88f8185.selectorLabels" . | nindent 6 }}
