apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoccc7103b-38ce-424c-8c9e-bb67ee480611.fullname" . }}
  labels:
    {{- include "go-echoccc7103b-38ce-424c-8c9e-bb67ee480611.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoccc7103b-38ce-424c-8c9e-bb67ee480611.selectorLabels" . | nindent 6 }}
