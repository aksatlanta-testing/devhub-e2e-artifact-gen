apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4cf7d103-43fd-4280-b42e-9152ee1d85b9.fullname" . }}
  labels:
    {{- include "go-echo4cf7d103-43fd-4280-b42e-9152ee1d85b9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4cf7d103-43fd-4280-b42e-9152ee1d85b9.selectorLabels" . | nindent 6 }}
