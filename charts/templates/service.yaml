apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofe670c1a-8542-4eda-8dbb-51eae85a6a47.fullname" . }}
  labels:
    {{- include "go-echofe670c1a-8542-4eda-8dbb-51eae85a6a47.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofe670c1a-8542-4eda-8dbb-51eae85a6a47.selectorLabels" . | nindent 6 }}
