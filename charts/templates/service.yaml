apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofa2a4c03-f199-4faa-9a3e-a7330c628c6a.fullname" . }}
  labels:
    {{- include "go-echofa2a4c03-f199-4faa-9a3e-a7330c628c6a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofa2a4c03-f199-4faa-9a3e-a7330c628c6a.selectorLabels" . | nindent 6 }}
