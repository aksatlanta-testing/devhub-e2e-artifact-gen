apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob2438a54-d0a1-49c1-b6a4-dff2df4e7287.fullname" . }}
  labels:
    {{- include "go-echob2438a54-d0a1-49c1-b6a4-dff2df4e7287.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob2438a54-d0a1-49c1-b6a4-dff2df4e7287.selectorLabels" . | nindent 6 }}
