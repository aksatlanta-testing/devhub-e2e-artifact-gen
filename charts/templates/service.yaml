apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo77b4f7cc-de0b-43be-aaf4-67933ee09c87.fullname" . }}
  labels:
    {{- include "go-echo77b4f7cc-de0b-43be-aaf4-67933ee09c87.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo77b4f7cc-de0b-43be-aaf4-67933ee09c87.selectorLabels" . | nindent 6 }}
