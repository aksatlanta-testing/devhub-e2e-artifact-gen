apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob5fd5ada-4c20-4609-9397-79144ede1fac.fullname" . }}
  labels:
    {{- include "go-echob5fd5ada-4c20-4609-9397-79144ede1fac.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob5fd5ada-4c20-4609-9397-79144ede1fac.selectorLabels" . | nindent 6 }}
