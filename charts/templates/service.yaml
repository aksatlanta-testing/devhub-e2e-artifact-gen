apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8724094c-beab-42ce-baf4-4e69853d1c47.fullname" . }}
  labels:
    {{- include "go-echo8724094c-beab-42ce-baf4-4e69853d1c47.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8724094c-beab-42ce-baf4-4e69853d1c47.selectorLabels" . | nindent 6 }}
