apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4680b0d0-f32a-4fcb-9a0f-b68c28e0959a.fullname" . }}
  labels:
    {{- include "go-echo4680b0d0-f32a-4fcb-9a0f-b68c28e0959a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4680b0d0-f32a-4fcb-9a0f-b68c28e0959a.selectorLabels" . | nindent 6 }}
