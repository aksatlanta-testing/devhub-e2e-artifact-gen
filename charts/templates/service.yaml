apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2305803f-1a6d-4b94-8132-be88f9d7c114.fullname" . }}
  labels:
    {{- include "go-echo2305803f-1a6d-4b94-8132-be88f9d7c114.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2305803f-1a6d-4b94-8132-be88f9d7c114.selectorLabels" . | nindent 6 }}
