apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1bfb45e1-e219-4704-80b3-6fea88353a0c.fullname" . }}
  labels:
    {{- include "go-echo1bfb45e1-e219-4704-80b3-6fea88353a0c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1bfb45e1-e219-4704-80b3-6fea88353a0c.selectorLabels" . | nindent 6 }}
