apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod7f556fd-7fd5-4cdb-9cd3-8534aeb6e3ff.fullname" . }}
  labels:
    {{- include "go-echod7f556fd-7fd5-4cdb-9cd3-8534aeb6e3ff.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod7f556fd-7fd5-4cdb-9cd3-8534aeb6e3ff.selectorLabels" . | nindent 6 }}
