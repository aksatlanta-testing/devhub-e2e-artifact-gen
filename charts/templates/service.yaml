apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2673d11b-4902-4ccc-8086-70c0f6bc3f2f.fullname" . }}
  labels:
    {{- include "go-echo2673d11b-4902-4ccc-8086-70c0f6bc3f2f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2673d11b-4902-4ccc-8086-70c0f6bc3f2f.selectorLabels" . | nindent 6 }}
