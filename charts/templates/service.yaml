apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa33374ca-ec8b-43e3-9575-7b1ff96101fe.fullname" . }}
  labels:
    {{- include "go-echoa33374ca-ec8b-43e3-9575-7b1ff96101fe.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa33374ca-ec8b-43e3-9575-7b1ff96101fe.selectorLabels" . | nindent 6 }}
