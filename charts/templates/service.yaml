apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofb2deec0-4bcd-4937-97f1-dc15db224d37.fullname" . }}
  labels:
    {{- include "go-echofb2deec0-4bcd-4937-97f1-dc15db224d37.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofb2deec0-4bcd-4937-97f1-dc15db224d37.selectorLabels" . | nindent 6 }}
