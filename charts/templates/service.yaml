apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc94e46a9-3a35-4918-8d9d-988cc354c85a.fullname" . }}
  labels:
    {{- include "go-echoc94e46a9-3a35-4918-8d9d-988cc354c85a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc94e46a9-3a35-4918-8d9d-988cc354c85a.selectorLabels" . | nindent 6 }}
