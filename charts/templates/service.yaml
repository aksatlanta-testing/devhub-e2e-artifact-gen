apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3fa44c90-dc72-4d69-83f2-766d9830f6a7.fullname" . }}
  labels:
    {{- include "go-echo3fa44c90-dc72-4d69-83f2-766d9830f6a7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3fa44c90-dc72-4d69-83f2-766d9830f6a7.selectorLabels" . | nindent 6 }}
