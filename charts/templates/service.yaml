apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2e17c435-c223-4371-bb96-dc016494938d.fullname" . }}
  labels:
    {{- include "go-echo2e17c435-c223-4371-bb96-dc016494938d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2e17c435-c223-4371-bb96-dc016494938d.selectorLabels" . | nindent 6 }}
