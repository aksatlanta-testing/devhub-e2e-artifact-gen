apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo13c40b93-66b3-4884-9023-d5e2b4d637f6.fullname" . }}
  labels:
    {{- include "go-echo13c40b93-66b3-4884-9023-d5e2b4d637f6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo13c40b93-66b3-4884-9023-d5e2b4d637f6.selectorLabels" . | nindent 6 }}
