apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo55a0b93f-16f5-4bc6-a420-0dbcca1515aa.fullname" . }}
  labels:
    {{- include "go-echo55a0b93f-16f5-4bc6-a420-0dbcca1515aa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo55a0b93f-16f5-4bc6-a420-0dbcca1515aa.selectorLabels" . | nindent 6 }}
