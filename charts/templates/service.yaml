apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocd5e9339-74cd-437d-9449-4618c144880a.fullname" . }}
  labels:
    {{- include "go-echocd5e9339-74cd-437d-9449-4618c144880a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocd5e9339-74cd-437d-9449-4618c144880a.selectorLabels" . | nindent 6 }}
