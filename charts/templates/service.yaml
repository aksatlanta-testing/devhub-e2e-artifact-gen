apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7c589479-40a9-4c4d-beb4-fb8e1eff2b87.fullname" . }}
  labels:
    {{- include "go-echo7c589479-40a9-4c4d-beb4-fb8e1eff2b87.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7c589479-40a9-4c4d-beb4-fb8e1eff2b87.selectorLabels" . | nindent 6 }}
