apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo38a9dd99-ed8e-4cbf-bd65-e194fda3577d.fullname" . }}
  labels:
    {{- include "go-echo38a9dd99-ed8e-4cbf-bd65-e194fda3577d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo38a9dd99-ed8e-4cbf-bd65-e194fda3577d.selectorLabels" . | nindent 6 }}
