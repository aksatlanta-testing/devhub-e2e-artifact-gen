apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe4738101-73c8-4cdd-91d8-c1ed19f84841.fullname" . }}
  labels:
    {{- include "go-echoe4738101-73c8-4cdd-91d8-c1ed19f84841.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe4738101-73c8-4cdd-91d8-c1ed19f84841.selectorLabels" . | nindent 6 }}
