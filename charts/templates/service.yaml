apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2b7f3475-090e-4cbe-b3d4-6920da5017f7.fullname" . }}
  labels:
    {{- include "go-echo2b7f3475-090e-4cbe-b3d4-6920da5017f7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2b7f3475-090e-4cbe-b3d4-6920da5017f7.selectorLabels" . | nindent 6 }}
