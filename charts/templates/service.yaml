apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa04bf346-6c67-4d1e-ba4b-fe109f93f622.fullname" . }}
  labels:
    {{- include "go-echoa04bf346-6c67-4d1e-ba4b-fe109f93f622.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa04bf346-6c67-4d1e-ba4b-fe109f93f622.selectorLabels" . | nindent 6 }}
