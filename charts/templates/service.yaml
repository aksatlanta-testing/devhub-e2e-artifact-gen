apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4b8411dd-736c-418b-8e77-6bf0275300ab.fullname" . }}
  labels:
    {{- include "go-echo4b8411dd-736c-418b-8e77-6bf0275300ab.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4b8411dd-736c-418b-8e77-6bf0275300ab.selectorLabels" . | nindent 6 }}
