apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod805576b-58c9-4d00-92bc-a65033f2b05d.fullname" . }}
  labels:
    {{- include "go-echod805576b-58c9-4d00-92bc-a65033f2b05d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod805576b-58c9-4d00-92bc-a65033f2b05d.selectorLabels" . | nindent 6 }}
