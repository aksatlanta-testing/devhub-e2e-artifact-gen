apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo239933c4-b78e-45fc-bcb3-9a6fd8972cd8.fullname" . }}
  labels:
    {{- include "go-echo239933c4-b78e-45fc-bcb3-9a6fd8972cd8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo239933c4-b78e-45fc-bcb3-9a6fd8972cd8.selectorLabels" . | nindent 6 }}
