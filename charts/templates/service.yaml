apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo65df1784-e04d-4edd-b845-e6ca574f332e.fullname" . }}
  labels:
    {{- include "go-echo65df1784-e04d-4edd-b845-e6ca574f332e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo65df1784-e04d-4edd-b845-e6ca574f332e.selectorLabels" . | nindent 6 }}
