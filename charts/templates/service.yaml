apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod82703a1-49e5-4419-b134-c6de12ef2c12.fullname" . }}
  labels:
    {{- include "go-echod82703a1-49e5-4419-b134-c6de12ef2c12.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod82703a1-49e5-4419-b134-c6de12ef2c12.selectorLabels" . | nindent 6 }}
