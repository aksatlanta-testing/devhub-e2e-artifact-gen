apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob85cb165-c4f3-42d6-971d-929079078c64.fullname" . }}
  labels:
    {{- include "go-echob85cb165-c4f3-42d6-971d-929079078c64.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob85cb165-c4f3-42d6-971d-929079078c64.selectorLabels" . | nindent 6 }}
