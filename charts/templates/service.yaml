apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoef5ccc27-3deb-4bf1-a96c-94738f759bb5.fullname" . }}
  labels:
    {{- include "go-echoef5ccc27-3deb-4bf1-a96c-94738f759bb5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoef5ccc27-3deb-4bf1-a96c-94738f759bb5.selectorLabels" . | nindent 6 }}
