apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa29263e0-fce1-4ed6-be11-9d20077c0bac.fullname" . }}
  labels:
    {{- include "go-echoa29263e0-fce1-4ed6-be11-9d20077c0bac.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa29263e0-fce1-4ed6-be11-9d20077c0bac.selectorLabels" . | nindent 6 }}
