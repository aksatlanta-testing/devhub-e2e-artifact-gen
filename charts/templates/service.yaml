apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4ce31f93-3e19-44a6-9631-458e8bbc1575.fullname" . }}
  labels:
    {{- include "go-echo4ce31f93-3e19-44a6-9631-458e8bbc1575.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4ce31f93-3e19-44a6-9631-458e8bbc1575.selectorLabels" . | nindent 6 }}
