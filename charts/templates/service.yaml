apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob69cac64-275b-46bf-8eac-b07b78de6541.fullname" . }}
  labels:
    {{- include "go-echob69cac64-275b-46bf-8eac-b07b78de6541.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob69cac64-275b-46bf-8eac-b07b78de6541.selectorLabels" . | nindent 6 }}
