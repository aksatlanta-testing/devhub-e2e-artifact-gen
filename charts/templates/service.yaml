apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5d5b0299-d241-4ce0-a8a8-5e85559353b3.fullname" . }}
  labels:
    {{- include "go-echo5d5b0299-d241-4ce0-a8a8-5e85559353b3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5d5b0299-d241-4ce0-a8a8-5e85559353b3.selectorLabels" . | nindent 6 }}
