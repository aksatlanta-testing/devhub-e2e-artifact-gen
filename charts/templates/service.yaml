apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9ea8ebaf-ae0c-4b71-b2cd-2eab785642b2.fullname" . }}
  labels:
    {{- include "go-echo9ea8ebaf-ae0c-4b71-b2cd-2eab785642b2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9ea8ebaf-ae0c-4b71-b2cd-2eab785642b2.selectorLabels" . | nindent 6 }}
