apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo824b9c8a-5ee0-45d6-8b37-ef3baeb3a0a5.fullname" . }}
  labels:
    {{- include "go-echo824b9c8a-5ee0-45d6-8b37-ef3baeb3a0a5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo824b9c8a-5ee0-45d6-8b37-ef3baeb3a0a5.selectorLabels" . | nindent 6 }}
