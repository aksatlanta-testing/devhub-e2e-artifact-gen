apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo08fc95cf-4341-4e30-a543-ac04c543ca88.fullname" . }}
  labels:
    {{- include "go-echo08fc95cf-4341-4e30-a543-ac04c543ca88.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo08fc95cf-4341-4e30-a543-ac04c543ca88.selectorLabels" . | nindent 6 }}
