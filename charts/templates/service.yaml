apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo03e54edd-e1f6-48cb-90d5-00588273f069.fullname" . }}
  labels:
    {{- include "go-echo03e54edd-e1f6-48cb-90d5-00588273f069.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo03e54edd-e1f6-48cb-90d5-00588273f069.selectorLabels" . | nindent 6 }}
