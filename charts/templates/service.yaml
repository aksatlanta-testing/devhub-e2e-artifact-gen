apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob000e65f-e92f-42d3-86be-eb594e6391b2.fullname" . }}
  labels:
    {{- include "go-echob000e65f-e92f-42d3-86be-eb594e6391b2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob000e65f-e92f-42d3-86be-eb594e6391b2.selectorLabels" . | nindent 6 }}
