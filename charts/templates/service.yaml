apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5ae1f03c-b30f-4445-b22b-369860b0a9ff.fullname" . }}
  labels:
    {{- include "go-echo5ae1f03c-b30f-4445-b22b-369860b0a9ff.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5ae1f03c-b30f-4445-b22b-369860b0a9ff.selectorLabels" . | nindent 6 }}
