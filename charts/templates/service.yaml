apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe3ec0849-9405-4ab2-a654-aa818783f4c3.fullname" . }}
  labels:
    {{- include "go-echoe3ec0849-9405-4ab2-a654-aa818783f4c3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe3ec0849-9405-4ab2-a654-aa818783f4c3.selectorLabels" . | nindent 6 }}
