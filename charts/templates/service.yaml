apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof8431e44-c446-4e47-ab83-07ed7dd4d2b5.fullname" . }}
  labels:
    {{- include "go-echof8431e44-c446-4e47-ab83-07ed7dd4d2b5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof8431e44-c446-4e47-ab83-07ed7dd4d2b5.selectorLabels" . | nindent 6 }}
