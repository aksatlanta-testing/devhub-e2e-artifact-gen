apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0ee7aa02-33e5-4bd2-b45f-08e513eb6505.fullname" . }}
  labels:
    {{- include "go-echo0ee7aa02-33e5-4bd2-b45f-08e513eb6505.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0ee7aa02-33e5-4bd2-b45f-08e513eb6505.selectorLabels" . | nindent 6 }}
