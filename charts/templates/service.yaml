apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo47b4937e-eab7-486a-8380-294131e8c27c.fullname" . }}
  labels:
    {{- include "go-echo47b4937e-eab7-486a-8380-294131e8c27c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo47b4937e-eab7-486a-8380-294131e8c27c.selectorLabels" . | nindent 6 }}
