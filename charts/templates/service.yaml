apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo098c3174-0e97-4117-a9ad-2e00773cd55d.fullname" . }}
  labels:
    {{- include "go-echo098c3174-0e97-4117-a9ad-2e00773cd55d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo098c3174-0e97-4117-a9ad-2e00773cd55d.selectorLabels" . | nindent 6 }}
