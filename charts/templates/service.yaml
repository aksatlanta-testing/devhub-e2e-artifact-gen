apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo420dc108-e0ad-498b-8460-129f9ce71d4e.fullname" . }}
  labels:
    {{- include "go-echo420dc108-e0ad-498b-8460-129f9ce71d4e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo420dc108-e0ad-498b-8460-129f9ce71d4e.selectorLabels" . | nindent 6 }}
