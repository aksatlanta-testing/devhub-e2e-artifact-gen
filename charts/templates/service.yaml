apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1506539a-855d-4dd1-be64-963d51e6b843.fullname" . }}
  labels:
    {{- include "go-echo1506539a-855d-4dd1-be64-963d51e6b843.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1506539a-855d-4dd1-be64-963d51e6b843.selectorLabels" . | nindent 6 }}
