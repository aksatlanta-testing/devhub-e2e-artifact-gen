apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0503e1de-47a2-4710-85a2-2298b2405740.fullname" . }}
  labels:
    {{- include "go-echo0503e1de-47a2-4710-85a2-2298b2405740.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0503e1de-47a2-4710-85a2-2298b2405740.selectorLabels" . | nindent 6 }}
