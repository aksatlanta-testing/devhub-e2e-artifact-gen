apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodd344071-46b9-4b30-b480-03fcdd06877f.fullname" . }}
  labels:
    {{- include "go-echodd344071-46b9-4b30-b480-03fcdd06877f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodd344071-46b9-4b30-b480-03fcdd06877f.selectorLabels" . | nindent 6 }}
