apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof09e917b-15b0-4605-87b4-bd28202871cc.fullname" . }}
  labels:
    {{- include "go-echof09e917b-15b0-4605-87b4-bd28202871cc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof09e917b-15b0-4605-87b4-bd28202871cc.selectorLabels" . | nindent 6 }}
