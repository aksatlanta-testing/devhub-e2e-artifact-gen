apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo594d9812-e6f2-420b-953f-a485e5ec7332.fullname" . }}
  labels:
    {{- include "go-echo594d9812-e6f2-420b-953f-a485e5ec7332.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo594d9812-e6f2-420b-953f-a485e5ec7332.selectorLabels" . | nindent 6 }}
