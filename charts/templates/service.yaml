apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa52695be-3ff4-41c2-9768-3d58b67f4ffb.fullname" . }}
  labels:
    {{- include "go-echoa52695be-3ff4-41c2-9768-3d58b67f4ffb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa52695be-3ff4-41c2-9768-3d58b67f4ffb.selectorLabels" . | nindent 6 }}
