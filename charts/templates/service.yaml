apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod15f6421-a240-45a2-b892-1b230c1f71e3.fullname" . }}
  labels:
    {{- include "go-echod15f6421-a240-45a2-b892-1b230c1f71e3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod15f6421-a240-45a2-b892-1b230c1f71e3.selectorLabels" . | nindent 6 }}
