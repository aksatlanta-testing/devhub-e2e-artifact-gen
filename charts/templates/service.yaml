apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0858e71a-712a-4495-9e02-54db65cc2086.fullname" . }}
  labels:
    {{- include "go-echo0858e71a-712a-4495-9e02-54db65cc2086.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0858e71a-712a-4495-9e02-54db65cc2086.selectorLabels" . | nindent 6 }}
