apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1d17cfbd-cdee-4f24-b51c-acb24a025e63.fullname" . }}
  labels:
    {{- include "go-echo1d17cfbd-cdee-4f24-b51c-acb24a025e63.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1d17cfbd-cdee-4f24-b51c-acb24a025e63.selectorLabels" . | nindent 6 }}
