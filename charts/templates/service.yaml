apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6f08e407-17d3-4163-98b4-6a2319ef3000.fullname" . }}
  labels:
    {{- include "go-echo6f08e407-17d3-4163-98b4-6a2319ef3000.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6f08e407-17d3-4163-98b4-6a2319ef3000.selectorLabels" . | nindent 6 }}
