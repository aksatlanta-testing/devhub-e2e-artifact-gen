apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4647dc4b-ca8f-42cf-9b61-50a07b8c1b0a.fullname" . }}
  labels:
    {{- include "go-echo4647dc4b-ca8f-42cf-9b61-50a07b8c1b0a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4647dc4b-ca8f-42cf-9b61-50a07b8c1b0a.selectorLabels" . | nindent 6 }}
