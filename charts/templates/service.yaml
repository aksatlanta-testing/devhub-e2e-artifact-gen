apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo47a01302-d73e-47cd-b232-e2cf74c0c90c.fullname" . }}
  labels:
    {{- include "go-echo47a01302-d73e-47cd-b232-e2cf74c0c90c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo47a01302-d73e-47cd-b232-e2cf74c0c90c.selectorLabels" . | nindent 6 }}
