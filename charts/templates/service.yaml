apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo23afa020-07b2-4282-81b7-5eed9135494b.fullname" . }}
  labels:
    {{- include "go-echo23afa020-07b2-4282-81b7-5eed9135494b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo23afa020-07b2-4282-81b7-5eed9135494b.selectorLabels" . | nindent 6 }}
