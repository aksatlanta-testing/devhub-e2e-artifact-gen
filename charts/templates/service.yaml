apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod8cf5dab-c54b-401f-94e4-fc075f46f8e6.fullname" . }}
  labels:
    {{- include "go-echod8cf5dab-c54b-401f-94e4-fc075f46f8e6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod8cf5dab-c54b-401f-94e4-fc075f46f8e6.selectorLabels" . | nindent 6 }}
