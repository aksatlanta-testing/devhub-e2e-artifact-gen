apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0efa5bea-1a31-444e-a744-e993a718b3ea.fullname" . }}
  labels:
    {{- include "go-echo0efa5bea-1a31-444e-a744-e993a718b3ea.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0efa5bea-1a31-444e-a744-e993a718b3ea.selectorLabels" . | nindent 6 }}
