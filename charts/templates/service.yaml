apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofa986c47-13b2-4698-ba26-53f7a0a38827.fullname" . }}
  labels:
    {{- include "go-echofa986c47-13b2-4698-ba26-53f7a0a38827.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofa986c47-13b2-4698-ba26-53f7a0a38827.selectorLabels" . | nindent 6 }}
