apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc48a2734-e613-4955-bcd9-8c6005af2c16.fullname" . }}
  labels:
    {{- include "go-echoc48a2734-e613-4955-bcd9-8c6005af2c16.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc48a2734-e613-4955-bcd9-8c6005af2c16.selectorLabels" . | nindent 6 }}
