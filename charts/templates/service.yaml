apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob904626f-9493-4366-bb68-8d77308cd71d.fullname" . }}
  labels:
    {{- include "go-echob904626f-9493-4366-bb68-8d77308cd71d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob904626f-9493-4366-bb68-8d77308cd71d.selectorLabels" . | nindent 6 }}
