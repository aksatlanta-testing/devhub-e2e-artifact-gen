apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9d77e139-3719-4c71-b770-67a61aad6b77.fullname" . }}
  labels:
    {{- include "go-echo9d77e139-3719-4c71-b770-67a61aad6b77.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9d77e139-3719-4c71-b770-67a61aad6b77.selectorLabels" . | nindent 6 }}
