apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0a3cf7c4-ba22-412c-baf7-79b38034db57.fullname" . }}
  labels:
    {{- include "go-echo0a3cf7c4-ba22-412c-baf7-79b38034db57.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0a3cf7c4-ba22-412c-baf7-79b38034db57.selectorLabels" . | nindent 6 }}
