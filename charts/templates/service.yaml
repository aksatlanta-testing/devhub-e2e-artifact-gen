apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo02887e49-bc11-430a-a25a-a95388758003.fullname" . }}
  labels:
    {{- include "go-echo02887e49-bc11-430a-a25a-a95388758003.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo02887e49-bc11-430a-a25a-a95388758003.selectorLabels" . | nindent 6 }}
