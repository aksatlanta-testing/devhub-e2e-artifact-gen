apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1ce2084b-5230-4ed6-a586-b42ec70c1599.fullname" . }}
  labels:
    {{- include "go-echo1ce2084b-5230-4ed6-a586-b42ec70c1599.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1ce2084b-5230-4ed6-a586-b42ec70c1599.selectorLabels" . | nindent 6 }}
