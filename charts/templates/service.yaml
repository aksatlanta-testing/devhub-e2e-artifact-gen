apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo70f8ada0-55ed-4f45-aa96-6b147a9f0b03.fullname" . }}
  labels:
    {{- include "go-echo70f8ada0-55ed-4f45-aa96-6b147a9f0b03.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo70f8ada0-55ed-4f45-aa96-6b147a9f0b03.selectorLabels" . | nindent 6 }}
