apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof2de124a-6ed9-4a2f-b20e-89e87b2bdf5d.fullname" . }}
  labels:
    {{- include "go-echof2de124a-6ed9-4a2f-b20e-89e87b2bdf5d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof2de124a-6ed9-4a2f-b20e-89e87b2bdf5d.selectorLabels" . | nindent 6 }}
