apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo96c46a2b-e341-426f-a756-b3834feeabac.fullname" . }}
  labels:
    {{- include "go-echo96c46a2b-e341-426f-a756-b3834feeabac.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo96c46a2b-e341-426f-a756-b3834feeabac.selectorLabels" . | nindent 6 }}
