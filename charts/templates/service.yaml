apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofc9b49c7-6404-46e4-9064-829ab02ac848.fullname" . }}
  labels:
    {{- include "go-echofc9b49c7-6404-46e4-9064-829ab02ac848.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofc9b49c7-6404-46e4-9064-829ab02ac848.selectorLabels" . | nindent 6 }}
