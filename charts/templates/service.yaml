apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo00ed1b9d-0392-4204-82d3-ce3223f005d1.fullname" . }}
  labels:
    {{- include "go-echo00ed1b9d-0392-4204-82d3-ce3223f005d1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo00ed1b9d-0392-4204-82d3-ce3223f005d1.selectorLabels" . | nindent 6 }}
