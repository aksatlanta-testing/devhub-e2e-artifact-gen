apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof3fc5097-3cd7-4b99-8409-0831718f451d.fullname" . }}
  labels:
    {{- include "go-echof3fc5097-3cd7-4b99-8409-0831718f451d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof3fc5097-3cd7-4b99-8409-0831718f451d.selectorLabels" . | nindent 6 }}
