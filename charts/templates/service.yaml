apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof7342a88-cd68-4162-8523-98d35bc10648.fullname" . }}
  labels:
    {{- include "go-echof7342a88-cd68-4162-8523-98d35bc10648.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
