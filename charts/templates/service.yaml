apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8ae09eec-dd3d-40e9-a8da-3f964b6ef7d0.fullname" . }}
  labels:
    {{- include "go-echo8ae09eec-dd3d-40e9-a8da-3f964b6ef7d0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8ae09eec-dd3d-40e9-a8da-3f964b6ef7d0.selectorLabels" . | nindent 6 }}
