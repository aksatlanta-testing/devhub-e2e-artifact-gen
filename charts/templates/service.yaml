apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3f194cb4-fb09-43f3-85ce-541758266940.fullname" . }}
  labels:
    {{- include "go-echo3f194cb4-fb09-43f3-85ce-541758266940.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3f194cb4-fb09-43f3-85ce-541758266940.selectorLabels" . | nindent 6 }}
