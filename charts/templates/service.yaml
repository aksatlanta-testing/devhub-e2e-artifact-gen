apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe43044d7-1152-489e-a132-fb5c7cde6aa9.fullname" . }}
  labels:
    {{- include "go-echoe43044d7-1152-489e-a132-fb5c7cde6aa9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe43044d7-1152-489e-a132-fb5c7cde6aa9.selectorLabels" . | nindent 6 }}
