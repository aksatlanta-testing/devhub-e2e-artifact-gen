apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob99c468b-6bf2-43b2-8122-c885bb64ae3a.fullname" . }}
  labels:
    {{- include "go-echob99c468b-6bf2-43b2-8122-c885bb64ae3a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob99c468b-6bf2-43b2-8122-c885bb64ae3a.selectorLabels" . | nindent 6 }}
