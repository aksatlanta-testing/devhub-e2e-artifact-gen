apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo94d86eef-873a-4253-aba0-238c89547ce3.fullname" . }}
  labels:
    {{- include "go-echo94d86eef-873a-4253-aba0-238c89547ce3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo94d86eef-873a-4253-aba0-238c89547ce3.selectorLabels" . | nindent 6 }}
