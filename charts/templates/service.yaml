apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0f541d0a-44bc-408a-8628-6101d4ba0128.fullname" . }}
  labels:
    {{- include "go-echo0f541d0a-44bc-408a-8628-6101d4ba0128.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0f541d0a-44bc-408a-8628-6101d4ba0128.selectorLabels" . | nindent 6 }}
