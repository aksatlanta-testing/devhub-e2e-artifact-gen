apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc3e8c35f-8002-49c1-9b8d-c3f659b57112.fullname" . }}
  labels:
    {{- include "go-echoc3e8c35f-8002-49c1-9b8d-c3f659b57112.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc3e8c35f-8002-49c1-9b8d-c3f659b57112.selectorLabels" . | nindent 6 }}
