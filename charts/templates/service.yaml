apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo45a0ec28-4e3b-4eb3-9179-8fa102071fc0.fullname" . }}
  labels:
    {{- include "go-echo45a0ec28-4e3b-4eb3-9179-8fa102071fc0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo45a0ec28-4e3b-4eb3-9179-8fa102071fc0.selectorLabels" . | nindent 6 }}
