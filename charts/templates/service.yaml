apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo64cdbff1-2473-4ee2-b2b9-d1afed00017d.fullname" . }}
  labels:
    {{- include "go-echo64cdbff1-2473-4ee2-b2b9-d1afed00017d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo64cdbff1-2473-4ee2-b2b9-d1afed00017d.selectorLabels" . | nindent 6 }}
