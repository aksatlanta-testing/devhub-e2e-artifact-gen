apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocedfa02a-994e-4836-8952-24d1aaa7aed2.fullname" . }}
  labels:
    {{- include "go-echocedfa02a-994e-4836-8952-24d1aaa7aed2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocedfa02a-994e-4836-8952-24d1aaa7aed2.selectorLabels" . | nindent 6 }}
