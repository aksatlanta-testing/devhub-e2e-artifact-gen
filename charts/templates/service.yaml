apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo540687b1-687f-4bd5-9f34-9918b1e7c7a9.fullname" . }}
  labels:
    {{- include "go-echo540687b1-687f-4bd5-9f34-9918b1e7c7a9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo540687b1-687f-4bd5-9f34-9918b1e7c7a9.selectorLabels" . | nindent 6 }}
