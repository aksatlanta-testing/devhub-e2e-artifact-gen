apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7a3755c7-3f68-499b-90a9-5411ba43dab4.fullname" . }}
  labels:
    {{- include "go-echo7a3755c7-3f68-499b-90a9-5411ba43dab4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7a3755c7-3f68-499b-90a9-5411ba43dab4.selectorLabels" . | nindent 6 }}
