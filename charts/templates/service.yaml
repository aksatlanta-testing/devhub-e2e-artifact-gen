apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7b54c6bf-8e59-4b48-8fe7-122f0b9206f0.fullname" . }}
  labels:
    {{- include "go-echo7b54c6bf-8e59-4b48-8fe7-122f0b9206f0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7b54c6bf-8e59-4b48-8fe7-122f0b9206f0.selectorLabels" . | nindent 6 }}
