apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe5dbc505-9f88-4651-b546-3e7d70e6f320.fullname" . }}
  labels:
    {{- include "go-echoe5dbc505-9f88-4651-b546-3e7d70e6f320.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe5dbc505-9f88-4651-b546-3e7d70e6f320.selectorLabels" . | nindent 6 }}
