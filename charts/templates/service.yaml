apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8f33eb18-6f82-45ee-a02f-7c315da7b2b5.fullname" . }}
  labels:
    {{- include "go-echo8f33eb18-6f82-45ee-a02f-7c315da7b2b5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8f33eb18-6f82-45ee-a02f-7c315da7b2b5.selectorLabels" . | nindent 6 }}
