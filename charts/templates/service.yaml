apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe5cf17e5-8c28-453b-bccc-910c56ffac09.fullname" . }}
  labels:
    {{- include "go-echoe5cf17e5-8c28-453b-bccc-910c56ffac09.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe5cf17e5-8c28-453b-bccc-910c56ffac09.selectorLabels" . | nindent 6 }}
