apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod123d145-d940-4a55-933b-42e9568f538d.fullname" . }}
  labels:
    {{- include "go-echod123d145-d940-4a55-933b-42e9568f538d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod123d145-d940-4a55-933b-42e9568f538d.selectorLabels" . | nindent 6 }}
