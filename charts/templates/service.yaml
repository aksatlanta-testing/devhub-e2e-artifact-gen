apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0dcd6ec5-e2fd-40dd-b9d7-08dcc4429054.fullname" . }}
  labels:
    {{- include "go-echo0dcd6ec5-e2fd-40dd-b9d7-08dcc4429054.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0dcd6ec5-e2fd-40dd-b9d7-08dcc4429054.selectorLabels" . | nindent 6 }}
