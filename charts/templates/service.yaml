apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof8d1657a-e641-4e99-9cce-25d7cc7fbe29.fullname" . }}
  labels:
    {{- include "go-echof8d1657a-e641-4e99-9cce-25d7cc7fbe29.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof8d1657a-e641-4e99-9cce-25d7cc7fbe29.selectorLabels" . | nindent 6 }}
