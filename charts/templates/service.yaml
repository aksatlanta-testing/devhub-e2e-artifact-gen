apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5dfd0a7e-f105-4f67-a032-aee59ad23b01.fullname" . }}
  labels:
    {{- include "go-echo5dfd0a7e-f105-4f67-a032-aee59ad23b01.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5dfd0a7e-f105-4f67-a032-aee59ad23b01.selectorLabels" . | nindent 6 }}
