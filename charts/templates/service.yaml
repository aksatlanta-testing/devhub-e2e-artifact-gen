apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2d4a570b-1d8f-46c9-a79f-c58bf372faf8.fullname" . }}
  labels:
    {{- include "go-echo2d4a570b-1d8f-46c9-a79f-c58bf372faf8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2d4a570b-1d8f-46c9-a79f-c58bf372faf8.selectorLabels" . | nindent 6 }}
