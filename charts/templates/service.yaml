apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1b4a8258-b007-4281-82e6-bedf876bc6bf.fullname" . }}
  labels:
    {{- include "go-echo1b4a8258-b007-4281-82e6-bedf876bc6bf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1b4a8258-b007-4281-82e6-bedf876bc6bf.selectorLabels" . | nindent 6 }}
