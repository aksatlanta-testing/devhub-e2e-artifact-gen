apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo510734d5-6cef-4c67-9d9a-a02e51888114.fullname" . }}
  labels:
    {{- include "go-echo510734d5-6cef-4c67-9d9a-a02e51888114.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo510734d5-6cef-4c67-9d9a-a02e51888114.selectorLabels" . | nindent 6 }}
