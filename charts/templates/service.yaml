apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4748fe8b-812a-486e-a1c6-b209a10a0435.fullname" . }}
  labels:
    {{- include "go-echo4748fe8b-812a-486e-a1c6-b209a10a0435.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4748fe8b-812a-486e-a1c6-b209a10a0435.selectorLabels" . | nindent 6 }}
