apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4eee1aa0-eda0-44e6-92dc-4b74ddb8d366.fullname" . }}
  labels:
    {{- include "go-echo4eee1aa0-eda0-44e6-92dc-4b74ddb8d366.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4eee1aa0-eda0-44e6-92dc-4b74ddb8d366.selectorLabels" . | nindent 6 }}
