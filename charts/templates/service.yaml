apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe5e190a2-0e5e-4f44-89b2-8a9f8b431f4d.fullname" . }}
  labels:
    {{- include "go-echoe5e190a2-0e5e-4f44-89b2-8a9f8b431f4d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe5e190a2-0e5e-4f44-89b2-8a9f8b431f4d.selectorLabels" . | nindent 6 }}
