apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4f41345b-9d2f-4947-a12a-6be019c2277a.fullname" . }}
  labels:
    {{- include "go-echo4f41345b-9d2f-4947-a12a-6be019c2277a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4f41345b-9d2f-4947-a12a-6be019c2277a.selectorLabels" . | nindent 6 }}
