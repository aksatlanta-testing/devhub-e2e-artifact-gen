apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo477da3cc-dccb-4645-bc43-54ab8dcb1878.fullname" . }}
  labels:
    {{- include "go-echo477da3cc-dccb-4645-bc43-54ab8dcb1878.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo477da3cc-dccb-4645-bc43-54ab8dcb1878.selectorLabels" . | nindent 6 }}
