apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo462961e5-424d-490b-9a4d-39c0b5ac01a5.fullname" . }}
  labels:
    {{- include "go-echo462961e5-424d-490b-9a4d-39c0b5ac01a5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo462961e5-424d-490b-9a4d-39c0b5ac01a5.selectorLabels" . | nindent 6 }}
