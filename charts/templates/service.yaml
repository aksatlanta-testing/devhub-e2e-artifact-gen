apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo345fc999-030b-4cd9-9d95-bc0fea5852e8.fullname" . }}
  labels:
    {{- include "go-echo345fc999-030b-4cd9-9d95-bc0fea5852e8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo345fc999-030b-4cd9-9d95-bc0fea5852e8.selectorLabels" . | nindent 6 }}
