apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoabf887fa-659a-4ed9-a287-fe4937246cc4.fullname" . }}
  labels:
    {{- include "go-echoabf887fa-659a-4ed9-a287-fe4937246cc4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoabf887fa-659a-4ed9-a287-fe4937246cc4.selectorLabels" . | nindent 6 }}
