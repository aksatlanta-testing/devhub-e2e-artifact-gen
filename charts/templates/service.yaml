apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7de9359b-f007-413a-b544-139c4a7b6910.fullname" . }}
  labels:
    {{- include "go-echo7de9359b-f007-413a-b544-139c4a7b6910.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7de9359b-f007-413a-b544-139c4a7b6910.selectorLabels" . | nindent 6 }}
