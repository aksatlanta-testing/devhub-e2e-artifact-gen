apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo14998181-f713-49c8-af79-07f90e281ed2.fullname" . }}
  labels:
    {{- include "go-echo14998181-f713-49c8-af79-07f90e281ed2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo14998181-f713-49c8-af79-07f90e281ed2.selectorLabels" . | nindent 6 }}
