apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo07596aa0-9127-4e79-ab4a-5edfc3a89380.fullname" . }}
  labels:
    {{- include "go-echo07596aa0-9127-4e79-ab4a-5edfc3a89380.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo07596aa0-9127-4e79-ab4a-5edfc3a89380.selectorLabels" . | nindent 6 }}
