apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo886f7cf6-28b8-4054-a2af-a32b144dbd77.fullname" . }}
  labels:
    {{- include "go-echo886f7cf6-28b8-4054-a2af-a32b144dbd77.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo886f7cf6-28b8-4054-a2af-a32b144dbd77.selectorLabels" . | nindent 6 }}
