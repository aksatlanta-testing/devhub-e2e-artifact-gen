apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo702e2214-07d1-42a5-b22d-ca15ef4f0e68.fullname" . }}
  labels:
    {{- include "go-echo702e2214-07d1-42a5-b22d-ca15ef4f0e68.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo702e2214-07d1-42a5-b22d-ca15ef4f0e68.selectorLabels" . | nindent 6 }}
