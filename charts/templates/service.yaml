apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo32c2d4ca-2027-4d96-bd51-5f762c1e667f.fullname" . }}
  labels:
    {{- include "go-echo32c2d4ca-2027-4d96-bd51-5f762c1e667f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo32c2d4ca-2027-4d96-bd51-5f762c1e667f.selectorLabels" . | nindent 6 }}
