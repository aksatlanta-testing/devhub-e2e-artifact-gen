apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1ed58fb2-3e0a-4a96-af10-21abeccaeb20.fullname" . }}
  labels:
    {{- include "go-echo1ed58fb2-3e0a-4a96-af10-21abeccaeb20.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1ed58fb2-3e0a-4a96-af10-21abeccaeb20.selectorLabels" . | nindent 6 }}
