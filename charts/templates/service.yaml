apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo72d6b314-f720-4cf3-a954-6ed05cda6284.fullname" . }}
  labels:
    {{- include "go-echo72d6b314-f720-4cf3-a954-6ed05cda6284.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo72d6b314-f720-4cf3-a954-6ed05cda6284.selectorLabels" . | nindent 6 }}
