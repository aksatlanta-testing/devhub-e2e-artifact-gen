apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof1df01b5-2ace-43d1-82c8-f9106d6d7a9f.fullname" . }}
  labels:
    {{- include "go-echof1df01b5-2ace-43d1-82c8-f9106d6d7a9f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof1df01b5-2ace-43d1-82c8-f9106d6d7a9f.selectorLabels" . | nindent 6 }}
