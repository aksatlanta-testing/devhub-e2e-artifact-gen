apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo691cc8bd-809a-4131-98fb-abcb1467cd28.fullname" . }}
  labels:
    {{- include "go-echo691cc8bd-809a-4131-98fb-abcb1467cd28.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo691cc8bd-809a-4131-98fb-abcb1467cd28.selectorLabels" . | nindent 6 }}
