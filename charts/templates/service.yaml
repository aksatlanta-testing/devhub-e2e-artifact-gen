apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofc1a9624-41a3-4dfe-82e9-df2e0b50d5d9.fullname" . }}
  labels:
    {{- include "go-echofc1a9624-41a3-4dfe-82e9-df2e0b50d5d9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofc1a9624-41a3-4dfe-82e9-df2e0b50d5d9.selectorLabels" . | nindent 6 }}
