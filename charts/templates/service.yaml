apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5038e5c8-9cc6-4d4a-ab27-14bfabe61bda.fullname" . }}
  labels:
    {{- include "go-echo5038e5c8-9cc6-4d4a-ab27-14bfabe61bda.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5038e5c8-9cc6-4d4a-ab27-14bfabe61bda.selectorLabels" . | nindent 6 }}
