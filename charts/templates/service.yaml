apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3c254dcc-ba4b-4ba1-857b-efe5c62df8a9.fullname" . }}
  labels:
    {{- include "go-echo3c254dcc-ba4b-4ba1-857b-efe5c62df8a9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3c254dcc-ba4b-4ba1-857b-efe5c62df8a9.selectorLabels" . | nindent 6 }}
