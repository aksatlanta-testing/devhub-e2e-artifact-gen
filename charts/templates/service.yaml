apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0c2c6fe6-a174-4b20-abf4-62adce03dde1.fullname" . }}
  labels:
    {{- include "go-echo0c2c6fe6-a174-4b20-abf4-62adce03dde1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0c2c6fe6-a174-4b20-abf4-62adce03dde1.selectorLabels" . | nindent 6 }}
