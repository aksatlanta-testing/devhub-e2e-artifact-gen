apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0115fbc3-7690-4e0a-bf8b-ccf5ee4d705b.fullname" . }}
  labels:
    {{- include "go-echo0115fbc3-7690-4e0a-bf8b-ccf5ee4d705b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0115fbc3-7690-4e0a-bf8b-ccf5ee4d705b.selectorLabels" . | nindent 6 }}
