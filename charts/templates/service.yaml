apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9b7c9a03-f26f-4b5d-a374-44b1164738e2.fullname" . }}
  labels:
    {{- include "go-echo9b7c9a03-f26f-4b5d-a374-44b1164738e2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9b7c9a03-f26f-4b5d-a374-44b1164738e2.selectorLabels" . | nindent 6 }}
