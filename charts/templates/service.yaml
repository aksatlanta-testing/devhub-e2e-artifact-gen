apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodc220067-0db2-4b25-8d9b-b09643e23879.fullname" . }}
  labels:
    {{- include "go-echodc220067-0db2-4b25-8d9b-b09643e23879.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodc220067-0db2-4b25-8d9b-b09643e23879.selectorLabels" . | nindent 6 }}
