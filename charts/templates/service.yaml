apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo49fa1323-eaeb-4a81-ade6-5d101a904425.fullname" . }}
  labels:
    {{- include "go-echo49fa1323-eaeb-4a81-ade6-5d101a904425.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo49fa1323-eaeb-4a81-ade6-5d101a904425.selectorLabels" . | nindent 6 }}
