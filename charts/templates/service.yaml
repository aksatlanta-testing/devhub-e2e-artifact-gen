apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo91b64fb5-5dc6-4645-a34e-9e8588d2cfbf.fullname" . }}
  labels:
    {{- include "go-echo91b64fb5-5dc6-4645-a34e-9e8588d2cfbf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo91b64fb5-5dc6-4645-a34e-9e8588d2cfbf.selectorLabels" . | nindent 6 }}
