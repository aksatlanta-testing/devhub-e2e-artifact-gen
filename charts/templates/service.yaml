apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo93338edc-eb3b-407f-958e-40d986475c72.fullname" . }}
  labels:
    {{- include "go-echo93338edc-eb3b-407f-958e-40d986475c72.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo93338edc-eb3b-407f-958e-40d986475c72.selectorLabels" . | nindent 6 }}
