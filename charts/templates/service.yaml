apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodb6e74e8-16b4-4a90-b3ff-c23537c0e727.fullname" . }}
  labels:
    {{- include "go-echodb6e74e8-16b4-4a90-b3ff-c23537c0e727.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodb6e74e8-16b4-4a90-b3ff-c23537c0e727.selectorLabels" . | nindent 6 }}
