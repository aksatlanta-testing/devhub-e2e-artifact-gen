apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaf8fe7a4-4af6-4975-b8c5-216aa6139c8f.fullname" . }}
  labels:
    {{- include "go-echoaf8fe7a4-4af6-4975-b8c5-216aa6139c8f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaf8fe7a4-4af6-4975-b8c5-216aa6139c8f.selectorLabels" . | nindent 6 }}
