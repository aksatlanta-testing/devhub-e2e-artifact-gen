apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo49d4c7dc-bdad-452e-86da-376c14a6109b.fullname" . }}
  labels:
    {{- include "go-echo49d4c7dc-bdad-452e-86da-376c14a6109b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo49d4c7dc-bdad-452e-86da-376c14a6109b.selectorLabels" . | nindent 6 }}
