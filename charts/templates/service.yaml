apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1cd3e20f-9eed-4e5d-8271-e54be80f028c.fullname" . }}
  labels:
    {{- include "go-echo1cd3e20f-9eed-4e5d-8271-e54be80f028c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1cd3e20f-9eed-4e5d-8271-e54be80f028c.selectorLabels" . | nindent 6 }}
