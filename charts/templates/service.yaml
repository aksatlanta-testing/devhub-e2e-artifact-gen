apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo836a8a6c-f3d7-4537-a39f-03090ce3f790.fullname" . }}
  labels:
    {{- include "go-echo836a8a6c-f3d7-4537-a39f-03090ce3f790.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo836a8a6c-f3d7-4537-a39f-03090ce3f790.selectorLabels" . | nindent 6 }}
