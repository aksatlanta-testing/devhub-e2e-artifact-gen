apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoce7f26d9-970f-43c1-a30d-55f84a7bcea5.fullname" . }}
  labels:
    {{- include "go-echoce7f26d9-970f-43c1-a30d-55f84a7bcea5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoce7f26d9-970f-43c1-a30d-55f84a7bcea5.selectorLabels" . | nindent 6 }}
