apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaa89c014-475c-4409-8e06-98639d48902f.fullname" . }}
  labels:
    {{- include "go-echoaa89c014-475c-4409-8e06-98639d48902f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaa89c014-475c-4409-8e06-98639d48902f.selectorLabels" . | nindent 6 }}
