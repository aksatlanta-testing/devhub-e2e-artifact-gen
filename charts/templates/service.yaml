apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc5ec997c-89e0-4153-8d76-60c00d1ce8a6.fullname" . }}
  labels:
    {{- include "go-echoc5ec997c-89e0-4153-8d76-60c00d1ce8a6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc5ec997c-89e0-4153-8d76-60c00d1ce8a6.selectorLabels" . | nindent 6 }}
