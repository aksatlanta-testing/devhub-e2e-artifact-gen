apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo48fa7c58-0a75-48a2-9722-0ce82630a6b1.fullname" . }}
  labels:
    {{- include "go-echo48fa7c58-0a75-48a2-9722-0ce82630a6b1.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo48fa7c58-0a75-48a2-9722-0ce82630a6b1.selectorLabels" . | nindent 6 }}
