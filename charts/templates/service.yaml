apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo78ec397b-018c-430b-8e76-6ccc69753d94.fullname" . }}
  labels:
    {{- include "go-echo78ec397b-018c-430b-8e76-6ccc69753d94.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo78ec397b-018c-430b-8e76-6ccc69753d94.selectorLabels" . | nindent 6 }}
