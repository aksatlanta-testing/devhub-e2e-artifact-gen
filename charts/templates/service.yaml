apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4eb09c0c-4bbd-4729-866f-03463d425fb8.fullname" . }}
  labels:
    {{- include "go-echo4eb09c0c-4bbd-4729-866f-03463d425fb8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4eb09c0c-4bbd-4729-866f-03463d425fb8.selectorLabels" . | nindent 6 }}
