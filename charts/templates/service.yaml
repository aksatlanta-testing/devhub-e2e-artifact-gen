apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6a54bb8e-8de3-4bd9-b84c-3441f8cc3110.fullname" . }}
  labels:
    {{- include "go-echo6a54bb8e-8de3-4bd9-b84c-3441f8cc3110.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6a54bb8e-8de3-4bd9-b84c-3441f8cc3110.selectorLabels" . | nindent 6 }}
