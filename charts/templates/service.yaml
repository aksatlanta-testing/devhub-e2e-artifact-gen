apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4ce00e12-ee51-463c-a194-b5db9bcf7ba5.fullname" . }}
  labels:
    {{- include "go-echo4ce00e12-ee51-463c-a194-b5db9bcf7ba5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4ce00e12-ee51-463c-a194-b5db9bcf7ba5.selectorLabels" . | nindent 6 }}
