apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoec9b27fd-5c96-44fc-a4cb-1e28b173afa7.fullname" . }}
  labels:
    {{- include "go-echoec9b27fd-5c96-44fc-a4cb-1e28b173afa7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoec9b27fd-5c96-44fc-a4cb-1e28b173afa7.selectorLabels" . | nindent 6 }}
