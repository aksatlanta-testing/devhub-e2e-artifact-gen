apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc5067bcc-cb3c-4e8f-8e81-8076fdd78efa.fullname" . }}
  labels:
    {{- include "go-echoc5067bcc-cb3c-4e8f-8e81-8076fdd78efa.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc5067bcc-cb3c-4e8f-8e81-8076fdd78efa.selectorLabels" . | nindent 6 }}
