apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6394a7c6-9f12-412f-8cb9-82d44b587425.fullname" . }}
  labels:
    {{- include "go-echo6394a7c6-9f12-412f-8cb9-82d44b587425.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6394a7c6-9f12-412f-8cb9-82d44b587425.selectorLabels" . | nindent 6 }}
