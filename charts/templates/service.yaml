apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobecbd9f1-1552-422b-8fff-84da6dd4e357.fullname" . }}
  labels:
    {{- include "go-echobecbd9f1-1552-422b-8fff-84da6dd4e357.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobecbd9f1-1552-422b-8fff-84da6dd4e357.selectorLabels" . | nindent 6 }}
