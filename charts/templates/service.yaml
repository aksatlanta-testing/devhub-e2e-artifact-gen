apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa50c23e4-3a6b-4021-80bf-10c85f744349.fullname" . }}
  labels:
    {{- include "go-echoa50c23e4-3a6b-4021-80bf-10c85f744349.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa50c23e4-3a6b-4021-80bf-10c85f744349.selectorLabels" . | nindent 6 }}
