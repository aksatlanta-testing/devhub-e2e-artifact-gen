apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8ddd58ae-2956-4845-bc11-41d65c3c7752.fullname" . }}
  labels:
    {{- include "go-echo8ddd58ae-2956-4845-bc11-41d65c3c7752.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8ddd58ae-2956-4845-bc11-41d65c3c7752.selectorLabels" . | nindent 6 }}
