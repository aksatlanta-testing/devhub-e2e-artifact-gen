apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo28bf9d18-070a-47d1-8419-01228f5d7e8a.fullname" . }}
  labels:
    {{- include "go-echo28bf9d18-070a-47d1-8419-01228f5d7e8a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo28bf9d18-070a-47d1-8419-01228f5d7e8a.selectorLabels" . | nindent 6 }}
