apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4cc0f6d1-a678-4ddf-9a94-6599ca49af52.fullname" . }}
  labels:
    {{- include "go-echo4cc0f6d1-a678-4ddf-9a94-6599ca49af52.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4cc0f6d1-a678-4ddf-9a94-6599ca49af52.selectorLabels" . | nindent 6 }}
