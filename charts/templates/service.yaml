apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9ed422bd-922e-4a69-87d7-abd7fe769c5e.fullname" . }}
  labels:
    {{- include "go-echo9ed422bd-922e-4a69-87d7-abd7fe769c5e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9ed422bd-922e-4a69-87d7-abd7fe769c5e.selectorLabels" . | nindent 6 }}
