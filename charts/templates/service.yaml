apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocded5096-e3fe-4bd9-abc1-afdcb74c5e47.fullname" . }}
  labels:
    {{- include "go-echocded5096-e3fe-4bd9-abc1-afdcb74c5e47.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocded5096-e3fe-4bd9-abc1-afdcb74c5e47.selectorLabels" . | nindent 6 }}
