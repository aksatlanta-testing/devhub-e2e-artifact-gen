apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1a5333cd-dae7-470f-98de-8c92b0f52eb2.fullname" . }}
  labels:
    {{- include "go-echo1a5333cd-dae7-470f-98de-8c92b0f52eb2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1a5333cd-dae7-470f-98de-8c92b0f52eb2.selectorLabels" . | nindent 6 }}
