apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo33783002-d44a-4af1-9f0e-6284f10037ea.fullname" . }}
  labels:
    {{- include "go-echo33783002-d44a-4af1-9f0e-6284f10037ea.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo33783002-d44a-4af1-9f0e-6284f10037ea.selectorLabels" . | nindent 6 }}
