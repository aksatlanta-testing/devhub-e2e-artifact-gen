apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2b2676bd-a22f-4267-b54b-2c7ca42377b3.fullname" . }}
  labels:
    {{- include "go-echo2b2676bd-a22f-4267-b54b-2c7ca42377b3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2b2676bd-a22f-4267-b54b-2c7ca42377b3.selectorLabels" . | nindent 6 }}
