apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2d5f1631-3f16-414d-bb9c-5ca77dbaed90.fullname" . }}
  labels:
    {{- include "go-echo2d5f1631-3f16-414d-bb9c-5ca77dbaed90.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2d5f1631-3f16-414d-bb9c-5ca77dbaed90.selectorLabels" . | nindent 6 }}
