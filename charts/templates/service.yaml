apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob4f54c7a-f9f1-4c70-aaaa-443fff89908d.fullname" . }}
  labels:
    {{- include "go-echob4f54c7a-f9f1-4c70-aaaa-443fff89908d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob4f54c7a-f9f1-4c70-aaaa-443fff89908d.selectorLabels" . | nindent 6 }}
