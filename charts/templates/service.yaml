apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo99977d76-f2be-4bbe-a82c-9f014c799533.fullname" . }}
  labels:
    {{- include "go-echo99977d76-f2be-4bbe-a82c-9f014c799533.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo99977d76-f2be-4bbe-a82c-9f014c799533.selectorLabels" . | nindent 6 }}
