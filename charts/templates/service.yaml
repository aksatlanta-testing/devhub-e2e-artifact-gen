apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo74e055bb-0ed4-4ffd-8cca-c808c203048c.fullname" . }}
  labels:
    {{- include "go-echo74e055bb-0ed4-4ffd-8cca-c808c203048c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo74e055bb-0ed4-4ffd-8cca-c808c203048c.selectorLabels" . | nindent 6 }}
