apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo55bd17cc-e1a0-4a6d-9b24-0066d24c7c97.fullname" . }}
  labels:
    {{- include "go-echo55bd17cc-e1a0-4a6d-9b24-0066d24c7c97.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo55bd17cc-e1a0-4a6d-9b24-0066d24c7c97.selectorLabels" . | nindent 6 }}
