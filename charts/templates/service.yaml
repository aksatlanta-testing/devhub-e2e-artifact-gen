apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9d04cc44-a0c5-4f49-b33b-b1ad5bc512f6.fullname" . }}
  labels:
    {{- include "go-echo9d04cc44-a0c5-4f49-b33b-b1ad5bc512f6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9d04cc44-a0c5-4f49-b33b-b1ad5bc512f6.selectorLabels" . | nindent 6 }}
