apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo35be1452-73a4-4b36-99df-a676039d0ba8.fullname" . }}
  labels:
    {{- include "go-echo35be1452-73a4-4b36-99df-a676039d0ba8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo35be1452-73a4-4b36-99df-a676039d0ba8.selectorLabels" . | nindent 6 }}
