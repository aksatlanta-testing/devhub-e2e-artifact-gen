apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod1480de3-109a-4888-a79b-9839a7dce1a5.fullname" . }}
  labels:
    {{- include "go-echod1480de3-109a-4888-a79b-9839a7dce1a5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod1480de3-109a-4888-a79b-9839a7dce1a5.selectorLabels" . | nindent 6 }}
