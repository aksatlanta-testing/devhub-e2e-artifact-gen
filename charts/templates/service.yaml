apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe8944b0c-a072-40dc-8b0c-41341babbcce.fullname" . }}
  labels:
    {{- include "go-echoe8944b0c-a072-40dc-8b0c-41341babbcce.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe8944b0c-a072-40dc-8b0c-41341babbcce.selectorLabels" . | nindent 6 }}
