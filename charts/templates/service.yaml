apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3689c624-0eef-42b8-80d0-375375dfe5ad.fullname" . }}
  labels:
    {{- include "go-echo3689c624-0eef-42b8-80d0-375375dfe5ad.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3689c624-0eef-42b8-80d0-375375dfe5ad.selectorLabels" . | nindent 6 }}
