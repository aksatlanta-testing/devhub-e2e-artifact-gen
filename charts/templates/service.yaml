apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3b419448-98d1-4692-94c3-863655c968b1.fullname" . }}
  labels:
    {{- include "go-echo3b419448-98d1-4692-94c3-863655c968b1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3b419448-98d1-4692-94c3-863655c968b1.selectorLabels" . | nindent 6 }}
