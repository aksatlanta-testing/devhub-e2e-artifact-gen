apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoafeed777-d7a3-45ce-bbe5-80a8077ae1fa.fullname" . }}
  labels:
    {{- include "go-echoafeed777-d7a3-45ce-bbe5-80a8077ae1fa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoafeed777-d7a3-45ce-bbe5-80a8077ae1fa.selectorLabels" . | nindent 6 }}
