apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8ea4d677-b9ed-4d9c-aff7-0d2b5db57ea0.fullname" . }}
  labels:
    {{- include "go-echo8ea4d677-b9ed-4d9c-aff7-0d2b5db57ea0.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8ea4d677-b9ed-4d9c-aff7-0d2b5db57ea0.selectorLabels" . | nindent 6 }}
