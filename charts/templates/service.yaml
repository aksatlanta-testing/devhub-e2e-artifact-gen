apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6ecbaa6c-55a0-4f2e-a5ef-b5efca1820b6.fullname" . }}
  labels:
    {{- include "go-echo6ecbaa6c-55a0-4f2e-a5ef-b5efca1820b6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6ecbaa6c-55a0-4f2e-a5ef-b5efca1820b6.selectorLabels" . | nindent 6 }}
