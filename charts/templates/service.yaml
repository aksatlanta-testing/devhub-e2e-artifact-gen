apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4aceb5a8-440c-4d1b-929b-348d11b5054d.fullname" . }}
  labels:
    {{- include "go-echo4aceb5a8-440c-4d1b-929b-348d11b5054d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4aceb5a8-440c-4d1b-929b-348d11b5054d.selectorLabels" . | nindent 6 }}
