apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6fcd8673-e6d0-4c41-9daf-ac013dd5828d.fullname" . }}
  labels:
    {{- include "go-echo6fcd8673-e6d0-4c41-9daf-ac013dd5828d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6fcd8673-e6d0-4c41-9daf-ac013dd5828d.selectorLabels" . | nindent 6 }}
