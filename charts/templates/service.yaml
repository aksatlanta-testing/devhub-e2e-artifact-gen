apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobf5f2bc3-9f09-47d9-aa46-d17e82e38217.fullname" . }}
  labels:
    {{- include "go-echobf5f2bc3-9f09-47d9-aa46-d17e82e38217.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobf5f2bc3-9f09-47d9-aa46-d17e82e38217.selectorLabels" . | nindent 6 }}
