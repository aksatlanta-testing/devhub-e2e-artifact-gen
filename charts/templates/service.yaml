apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo57c7c08b-a8c8-41c5-9fa9-fb384f7d0b53.fullname" . }}
  labels:
    {{- include "go-echo57c7c08b-a8c8-41c5-9fa9-fb384f7d0b53.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo57c7c08b-a8c8-41c5-9fa9-fb384f7d0b53.selectorLabels" . | nindent 6 }}
