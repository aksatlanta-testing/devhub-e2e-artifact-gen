apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo19dbfa2d-40c7-4710-adff-4f4d1d119558.fullname" . }}
  labels:
    {{- include "go-echo19dbfa2d-40c7-4710-adff-4f4d1d119558.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo19dbfa2d-40c7-4710-adff-4f4d1d119558.selectorLabels" . | nindent 6 }}
