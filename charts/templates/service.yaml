apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8920556c-3347-45fa-a192-12635457ac50.fullname" . }}
  labels:
    {{- include "go-echo8920556c-3347-45fa-a192-12635457ac50.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8920556c-3347-45fa-a192-12635457ac50.selectorLabels" . | nindent 6 }}
