apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof5bba027-43c0-4076-b080-c4e0d2c31233.fullname" . }}
  labels:
    {{- include "go-echof5bba027-43c0-4076-b080-c4e0d2c31233.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof5bba027-43c0-4076-b080-c4e0d2c31233.selectorLabels" . | nindent 6 }}
