apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo180efdbc-3036-4151-99da-df2d640a509d.fullname" . }}
  labels:
    {{- include "go-echo180efdbc-3036-4151-99da-df2d640a509d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo180efdbc-3036-4151-99da-df2d640a509d.selectorLabels" . | nindent 6 }}
