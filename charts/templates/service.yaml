apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo13077fb5-c046-4136-a5cf-2d0aaca6319c.fullname" . }}
  labels:
    {{- include "go-echo13077fb5-c046-4136-a5cf-2d0aaca6319c.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo13077fb5-c046-4136-a5cf-2d0aaca6319c.selectorLabels" . | nindent 6 }}
