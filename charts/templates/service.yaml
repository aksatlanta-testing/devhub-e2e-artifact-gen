apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2659d68c-babb-4a1f-8d4a-e991b81bbbd6.fullname" . }}
  labels:
    {{- include "go-echo2659d68c-babb-4a1f-8d4a-e991b81bbbd6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2659d68c-babb-4a1f-8d4a-e991b81bbbd6.selectorLabels" . | nindent 6 }}
