apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3e36e517-e59f-4f87-86de-11df7fd1d83a.fullname" . }}
  labels:
    {{- include "go-echo3e36e517-e59f-4f87-86de-11df7fd1d83a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3e36e517-e59f-4f87-86de-11df7fd1d83a.selectorLabels" . | nindent 6 }}
