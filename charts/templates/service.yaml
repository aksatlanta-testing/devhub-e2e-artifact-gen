apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo794e9256-43e5-4a35-8c6b-c35290f72204.fullname" . }}
  labels:
    {{- include "go-echo794e9256-43e5-4a35-8c6b-c35290f72204.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo794e9256-43e5-4a35-8c6b-c35290f72204.selectorLabels" . | nindent 6 }}
