apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe6b40bb3-a889-464a-a491-7bb026aca6ee.fullname" . }}
  labels:
    {{- include "go-echoe6b40bb3-a889-464a-a491-7bb026aca6ee.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe6b40bb3-a889-464a-a491-7bb026aca6ee.selectorLabels" . | nindent 6 }}
