apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9068556d-3739-40a1-a19c-274475c08578.fullname" . }}
  labels:
    {{- include "go-echo9068556d-3739-40a1-a19c-274475c08578.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9068556d-3739-40a1-a19c-274475c08578.selectorLabels" . | nindent 6 }}
