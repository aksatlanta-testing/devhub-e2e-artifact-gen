apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodf82a59e-ece5-4d16-8660-64da9377d310.fullname" . }}
  labels:
    {{- include "go-echodf82a59e-ece5-4d16-8660-64da9377d310.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodf82a59e-ece5-4d16-8660-64da9377d310.selectorLabels" . | nindent 6 }}
