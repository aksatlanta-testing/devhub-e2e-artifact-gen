apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7b94f5ac-1151-4d57-8eff-6e93536f1616.fullname" . }}
  labels:
    {{- include "go-echo7b94f5ac-1151-4d57-8eff-6e93536f1616.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7b94f5ac-1151-4d57-8eff-6e93536f1616.selectorLabels" . | nindent 6 }}
