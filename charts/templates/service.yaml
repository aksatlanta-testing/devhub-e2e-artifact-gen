apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo61fa84f3-b80c-44be-8b96-54cf3aff89ef.fullname" . }}
  labels:
    {{- include "go-echo61fa84f3-b80c-44be-8b96-54cf3aff89ef.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo61fa84f3-b80c-44be-8b96-54cf3aff89ef.selectorLabels" . | nindent 6 }}
