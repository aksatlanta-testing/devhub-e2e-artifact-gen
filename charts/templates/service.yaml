apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5bd52785-a4b0-4c05-9800-c2b1ef55e864.fullname" . }}
  labels:
    {{- include "go-echo5bd52785-a4b0-4c05-9800-c2b1ef55e864.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5bd52785-a4b0-4c05-9800-c2b1ef55e864.selectorLabels" . | nindent 6 }}
