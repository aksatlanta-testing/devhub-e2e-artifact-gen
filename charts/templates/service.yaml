apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoac3ebbb2-ec79-406d-9fb6-4da5db91e81e.fullname" . }}
  labels:
    {{- include "go-echoac3ebbb2-ec79-406d-9fb6-4da5db91e81e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoac3ebbb2-ec79-406d-9fb6-4da5db91e81e.selectorLabels" . | nindent 6 }}
