apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo581cf8d8-e673-467d-9677-8848e5b8758c.fullname" . }}
  labels:
    {{- include "go-echo581cf8d8-e673-467d-9677-8848e5b8758c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo581cf8d8-e673-467d-9677-8848e5b8758c.selectorLabels" . | nindent 6 }}
