apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5331a22a-5371-42f0-a281-0448c8cd762a.fullname" . }}
  labels:
    {{- include "go-echo5331a22a-5371-42f0-a281-0448c8cd762a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5331a22a-5371-42f0-a281-0448c8cd762a.selectorLabels" . | nindent 6 }}
