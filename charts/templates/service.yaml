apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo61f174be-0580-468b-a577-9b79639ad00c.fullname" . }}
  labels:
    {{- include "go-echo61f174be-0580-468b-a577-9b79639ad00c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo61f174be-0580-468b-a577-9b79639ad00c.selectorLabels" . | nindent 6 }}
