apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2b4e34cb-7be5-42c9-9697-03104675ac98.fullname" . }}
  labels:
    {{- include "go-echo2b4e34cb-7be5-42c9-9697-03104675ac98.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2b4e34cb-7be5-42c9-9697-03104675ac98.selectorLabels" . | nindent 6 }}
