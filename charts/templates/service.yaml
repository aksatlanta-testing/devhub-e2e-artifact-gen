apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa8e6365d-613e-42d7-a50b-cbeec66954b4.fullname" . }}
  labels:
    {{- include "go-echoa8e6365d-613e-42d7-a50b-cbeec66954b4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa8e6365d-613e-42d7-a50b-cbeec66954b4.selectorLabels" . | nindent 6 }}
