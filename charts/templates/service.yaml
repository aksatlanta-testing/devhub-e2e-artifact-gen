apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofaa4c1e3-4c97-428c-809e-dffdc1cdb0d1.fullname" . }}
  labels:
    {{- include "go-echofaa4c1e3-4c97-428c-809e-dffdc1cdb0d1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofaa4c1e3-4c97-428c-809e-dffdc1cdb0d1.selectorLabels" . | nindent 6 }}
