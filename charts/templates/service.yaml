apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8cd224dd-aff7-45ea-ac22-966a1a0963dc.fullname" . }}
  labels:
    {{- include "go-echo8cd224dd-aff7-45ea-ac22-966a1a0963dc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8cd224dd-aff7-45ea-ac22-966a1a0963dc.selectorLabels" . | nindent 6 }}
