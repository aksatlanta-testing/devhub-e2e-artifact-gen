apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo70a73b64-9ec3-480a-bcb5-c7e558980019.fullname" . }}
  labels:
    {{- include "go-echo70a73b64-9ec3-480a-bcb5-c7e558980019.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo70a73b64-9ec3-480a-bcb5-c7e558980019.selectorLabels" . | nindent 6 }}
