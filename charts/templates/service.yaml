apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod393607c-8044-4f13-bd6d-b45abdc25f7f.fullname" . }}
  labels:
    {{- include "go-echod393607c-8044-4f13-bd6d-b45abdc25f7f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod393607c-8044-4f13-bd6d-b45abdc25f7f.selectorLabels" . | nindent 6 }}
