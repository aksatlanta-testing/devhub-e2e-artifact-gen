apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa9e5ba18-eed3-4af7-a83f-fe1f1bb76dba.fullname" . }}
  labels:
    {{- include "go-echoa9e5ba18-eed3-4af7-a83f-fe1f1bb76dba.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa9e5ba18-eed3-4af7-a83f-fe1f1bb76dba.selectorLabels" . | nindent 6 }}
