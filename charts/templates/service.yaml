apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe295fbec-cc3c-4d63-8aa3-62202bbc41c2.fullname" . }}
  labels:
    {{- include "go-echoe295fbec-cc3c-4d63-8aa3-62202bbc41c2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe295fbec-cc3c-4d63-8aa3-62202bbc41c2.selectorLabels" . | nindent 6 }}
