apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo868d5b4f-2bef-4cee-8f35-5d8c9375cf4c.fullname" . }}
  labels:
    {{- include "go-echo868d5b4f-2bef-4cee-8f35-5d8c9375cf4c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo868d5b4f-2bef-4cee-8f35-5d8c9375cf4c.selectorLabels" . | nindent 6 }}
