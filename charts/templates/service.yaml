apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob711966a-c74d-4031-917d-522831460fd3.fullname" . }}
  labels:
    {{- include "go-echob711966a-c74d-4031-917d-522831460fd3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob711966a-c74d-4031-917d-522831460fd3.selectorLabels" . | nindent 6 }}
