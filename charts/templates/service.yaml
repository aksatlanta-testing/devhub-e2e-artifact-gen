apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1349cf92-5f4d-4c0b-8f56-8d948a2c1aa7.fullname" . }}
  labels:
    {{- include "go-echo1349cf92-5f4d-4c0b-8f56-8d948a2c1aa7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1349cf92-5f4d-4c0b-8f56-8d948a2c1aa7.selectorLabels" . | nindent 6 }}
