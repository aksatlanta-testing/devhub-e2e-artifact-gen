apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6ba95f0c-e448-49a8-b042-a209876f2305.fullname" . }}
  labels:
    {{- include "go-echo6ba95f0c-e448-49a8-b042-a209876f2305.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6ba95f0c-e448-49a8-b042-a209876f2305.selectorLabels" . | nindent 6 }}
