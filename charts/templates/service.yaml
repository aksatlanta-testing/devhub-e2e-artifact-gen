apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2b11c23c-89d3-4eed-afc7-448e9585ddd5.fullname" . }}
  labels:
    {{- include "go-echo2b11c23c-89d3-4eed-afc7-448e9585ddd5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2b11c23c-89d3-4eed-afc7-448e9585ddd5.selectorLabels" . | nindent 6 }}
