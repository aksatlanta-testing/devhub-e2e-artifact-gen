apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0a691185-7cba-448f-af39-a715c50ba669.fullname" . }}
  labels:
    {{- include "go-echo0a691185-7cba-448f-af39-a715c50ba669.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0a691185-7cba-448f-af39-a715c50ba669.selectorLabels" . | nindent 6 }}
