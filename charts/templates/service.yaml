apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob5f10c18-0d85-4a95-99cc-ebf765a1bf77.fullname" . }}
  labels:
    {{- include "go-echob5f10c18-0d85-4a95-99cc-ebf765a1bf77.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob5f10c18-0d85-4a95-99cc-ebf765a1bf77.selectorLabels" . | nindent 6 }}
