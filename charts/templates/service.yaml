apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo460a954b-dcd5-494b-98a3-90f6b7729fd1.fullname" . }}
  labels:
    {{- include "go-echo460a954b-dcd5-494b-98a3-90f6b7729fd1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo460a954b-dcd5-494b-98a3-90f6b7729fd1.selectorLabels" . | nindent 6 }}
