apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob2e21a05-435e-4e5b-8a00-cc623d92b65e.fullname" . }}
  labels:
    {{- include "go-echob2e21a05-435e-4e5b-8a00-cc623d92b65e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob2e21a05-435e-4e5b-8a00-cc623d92b65e.selectorLabels" . | nindent 6 }}
