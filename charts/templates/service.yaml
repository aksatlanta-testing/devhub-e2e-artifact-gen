apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo001f625f-0610-41a3-8087-6b0df06ba37b.fullname" . }}
  labels:
    {{- include "go-echo001f625f-0610-41a3-8087-6b0df06ba37b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo001f625f-0610-41a3-8087-6b0df06ba37b.selectorLabels" . | nindent 6 }}
