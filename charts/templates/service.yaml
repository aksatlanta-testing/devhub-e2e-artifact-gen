apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo49d7e8d8-a103-4df4-8c8f-27dd45117e28.fullname" . }}
  labels:
    {{- include "go-echo49d7e8d8-a103-4df4-8c8f-27dd45117e28.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo49d7e8d8-a103-4df4-8c8f-27dd45117e28.selectorLabels" . | nindent 6 }}
