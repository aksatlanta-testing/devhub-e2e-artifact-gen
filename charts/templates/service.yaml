apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0f1be6e4-b480-44f6-8da7-23cb6b345716.fullname" . }}
  labels:
    {{- include "go-echo0f1be6e4-b480-44f6-8da7-23cb6b345716.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0f1be6e4-b480-44f6-8da7-23cb6b345716.selectorLabels" . | nindent 6 }}
