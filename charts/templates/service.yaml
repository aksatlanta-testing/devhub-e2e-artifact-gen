apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe76ed59e-1b49-4c78-a6a4-3c9490bf6091.fullname" . }}
  labels:
    {{- include "go-echoe76ed59e-1b49-4c78-a6a4-3c9490bf6091.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe76ed59e-1b49-4c78-a6a4-3c9490bf6091.selectorLabels" . | nindent 6 }}
