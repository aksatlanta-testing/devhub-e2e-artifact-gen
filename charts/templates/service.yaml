apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof9135720-4cc7-4e55-b78e-9d22ec9912e6.fullname" . }}
  labels:
    {{- include "go-echof9135720-4cc7-4e55-b78e-9d22ec9912e6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof9135720-4cc7-4e55-b78e-9d22ec9912e6.selectorLabels" . | nindent 6 }}
