apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobf217e97-7540-4de1-b339-c08c599b6b69.fullname" . }}
  labels:
    {{- include "go-echobf217e97-7540-4de1-b339-c08c599b6b69.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobf217e97-7540-4de1-b339-c08c599b6b69.selectorLabels" . | nindent 6 }}
