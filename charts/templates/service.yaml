apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3bb208c2-0aae-4f3f-a283-180e4702b055.fullname" . }}
  labels:
    {{- include "go-echo3bb208c2-0aae-4f3f-a283-180e4702b055.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3bb208c2-0aae-4f3f-a283-180e4702b055.selectorLabels" . | nindent 6 }}
