apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3d060f2b-9cbf-4c35-ba10-d6f25914ec80.fullname" . }}
  labels:
    {{- include "go-echo3d060f2b-9cbf-4c35-ba10-d6f25914ec80.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3d060f2b-9cbf-4c35-ba10-d6f25914ec80.selectorLabels" . | nindent 6 }}
