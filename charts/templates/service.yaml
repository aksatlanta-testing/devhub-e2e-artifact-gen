apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo80325aaa-723c-45aa-95e6-2a98973e3fe5.fullname" . }}
  labels:
    {{- include "go-echo80325aaa-723c-45aa-95e6-2a98973e3fe5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo80325aaa-723c-45aa-95e6-2a98973e3fe5.selectorLabels" . | nindent 6 }}
