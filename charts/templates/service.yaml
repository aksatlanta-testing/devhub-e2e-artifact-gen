apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo189b85a3-b190-4f39-8eee-9b875c161464.fullname" . }}
  labels:
    {{- include "go-echo189b85a3-b190-4f39-8eee-9b875c161464.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo189b85a3-b190-4f39-8eee-9b875c161464.selectorLabels" . | nindent 6 }}
