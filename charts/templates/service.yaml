apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc9c3da49-7d42-4c41-a4a0-db70601085c1.fullname" . }}
  labels:
    {{- include "go-echoc9c3da49-7d42-4c41-a4a0-db70601085c1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc9c3da49-7d42-4c41-a4a0-db70601085c1.selectorLabels" . | nindent 6 }}
