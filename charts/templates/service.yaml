apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0499a120-ef4e-44fa-ab95-99fb47589714.fullname" . }}
  labels:
    {{- include "go-echo0499a120-ef4e-44fa-ab95-99fb47589714.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0499a120-ef4e-44fa-ab95-99fb47589714.selectorLabels" . | nindent 6 }}
