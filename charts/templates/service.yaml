apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoab0eb030-61d8-4d92-b28d-90b5ddf6b060.fullname" . }}
  labels:
    {{- include "go-echoab0eb030-61d8-4d92-b28d-90b5ddf6b060.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoab0eb030-61d8-4d92-b28d-90b5ddf6b060.selectorLabels" . | nindent 6 }}
