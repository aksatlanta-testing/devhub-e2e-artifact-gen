apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6be3c4b0-e6c8-49ed-a67e-910a2e12c4ff.fullname" . }}
  labels:
    {{- include "go-echo6be3c4b0-e6c8-49ed-a67e-910a2e12c4ff.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6be3c4b0-e6c8-49ed-a67e-910a2e12c4ff.selectorLabels" . | nindent 6 }}
