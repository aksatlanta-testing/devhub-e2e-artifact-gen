apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe8f586e1-3c0b-47ad-9f69-ba888d1216a9.fullname" . }}
  labels:
    {{- include "go-echoe8f586e1-3c0b-47ad-9f69-ba888d1216a9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe8f586e1-3c0b-47ad-9f69-ba888d1216a9.selectorLabels" . | nindent 6 }}
