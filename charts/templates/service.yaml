apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo88d9099b-d00b-4856-92aa-83c6a6816511.fullname" . }}
  labels:
    {{- include "go-echo88d9099b-d00b-4856-92aa-83c6a6816511.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo88d9099b-d00b-4856-92aa-83c6a6816511.selectorLabels" . | nindent 6 }}
