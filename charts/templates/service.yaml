apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo77f5bc8a-2f09-45d0-bc31-379617f85556.fullname" . }}
  labels:
    {{- include "go-echo77f5bc8a-2f09-45d0-bc31-379617f85556.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo77f5bc8a-2f09-45d0-bc31-379617f85556.selectorLabels" . | nindent 6 }}
