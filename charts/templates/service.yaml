apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoad173383-747d-49ab-920d-3c4ed6915b21.fullname" . }}
  labels:
    {{- include "go-echoad173383-747d-49ab-920d-3c4ed6915b21.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoad173383-747d-49ab-920d-3c4ed6915b21.selectorLabels" . | nindent 6 }}
