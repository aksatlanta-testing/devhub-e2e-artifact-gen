apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo28179563-496d-49d6-8fe9-679e63c204bf.fullname" . }}
  labels:
    {{- include "go-echo28179563-496d-49d6-8fe9-679e63c204bf.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo28179563-496d-49d6-8fe9-679e63c204bf.selectorLabels" . | nindent 6 }}
