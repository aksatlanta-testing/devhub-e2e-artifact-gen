apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo70c03452-702c-4402-8448-32eddfeeccb5.fullname" . }}
  labels:
    {{- include "go-echo70c03452-702c-4402-8448-32eddfeeccb5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo70c03452-702c-4402-8448-32eddfeeccb5.selectorLabels" . | nindent 6 }}
