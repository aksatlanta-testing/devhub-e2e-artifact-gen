apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo01464f38-0082-447c-9590-827248a102fb.fullname" . }}
  labels:
    {{- include "go-echo01464f38-0082-447c-9590-827248a102fb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo01464f38-0082-447c-9590-827248a102fb.selectorLabels" . | nindent 6 }}
