apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1741693c-4eb7-491f-9e0c-22980e60ab05.fullname" . }}
  labels:
    {{- include "go-echo1741693c-4eb7-491f-9e0c-22980e60ab05.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1741693c-4eb7-491f-9e0c-22980e60ab05.selectorLabels" . | nindent 6 }}
