apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa5afb2c4-a124-4fb0-a462-790ce14967f4.fullname" . }}
  labels:
    {{- include "go-echoa5afb2c4-a124-4fb0-a462-790ce14967f4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa5afb2c4-a124-4fb0-a462-790ce14967f4.selectorLabels" . | nindent 6 }}
