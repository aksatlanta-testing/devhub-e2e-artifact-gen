apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe1683ea3-da00-4c02-a2a1-e9e6f0cf5b7f.fullname" . }}
  labels:
    {{- include "go-echoe1683ea3-da00-4c02-a2a1-e9e6f0cf5b7f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe1683ea3-da00-4c02-a2a1-e9e6f0cf5b7f.selectorLabels" . | nindent 6 }}
