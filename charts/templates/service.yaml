apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4e2a2ee0-117d-4b38-b8f8-b1823a279e61.fullname" . }}
  labels:
    {{- include "go-echo4e2a2ee0-117d-4b38-b8f8-b1823a279e61.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4e2a2ee0-117d-4b38-b8f8-b1823a279e61.selectorLabels" . | nindent 6 }}
