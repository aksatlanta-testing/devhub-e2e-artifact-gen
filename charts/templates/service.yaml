apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod8f0079f-b150-4902-bae9-94b2333a7171.fullname" . }}
  labels:
    {{- include "go-echod8f0079f-b150-4902-bae9-94b2333a7171.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod8f0079f-b150-4902-bae9-94b2333a7171.selectorLabels" . | nindent 6 }}
