apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa022475a-3005-4ab8-8f4d-0142f34f0879.fullname" . }}
  labels:
    {{- include "go-echoa022475a-3005-4ab8-8f4d-0142f34f0879.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa022475a-3005-4ab8-8f4d-0142f34f0879.selectorLabels" . | nindent 6 }}
