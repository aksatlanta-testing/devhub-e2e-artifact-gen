apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo67ba220b-1b80-4c78-94fa-44fd57d01a67.fullname" . }}
  labels:
    {{- include "go-echo67ba220b-1b80-4c78-94fa-44fd57d01a67.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo67ba220b-1b80-4c78-94fa-44fd57d01a67.selectorLabels" . | nindent 6 }}
