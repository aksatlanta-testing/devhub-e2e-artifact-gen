apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9b2386f1-658b-4f67-b118-30eaf93d82f4.fullname" . }}
  labels:
    {{- include "go-echo9b2386f1-658b-4f67-b118-30eaf93d82f4.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9b2386f1-658b-4f67-b118-30eaf93d82f4.selectorLabels" . | nindent 6 }}
