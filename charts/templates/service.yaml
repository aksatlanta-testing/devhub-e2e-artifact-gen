apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe198d86e-6dcf-4038-85ca-370d5c71b2a7.fullname" . }}
  labels:
    {{- include "go-echoe198d86e-6dcf-4038-85ca-370d5c71b2a7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe198d86e-6dcf-4038-85ca-370d5c71b2a7.selectorLabels" . | nindent 6 }}
