apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe698fd69-e232-4afc-a396-aefef967199a.fullname" . }}
  labels:
    {{- include "go-echoe698fd69-e232-4afc-a396-aefef967199a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe698fd69-e232-4afc-a396-aefef967199a.selectorLabels" . | nindent 6 }}
