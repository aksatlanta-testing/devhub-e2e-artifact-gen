apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7ec44e3e-2809-4b55-8d1e-83af161911f0.fullname" . }}
  labels:
    {{- include "go-echo7ec44e3e-2809-4b55-8d1e-83af161911f0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7ec44e3e-2809-4b55-8d1e-83af161911f0.selectorLabels" . | nindent 6 }}
