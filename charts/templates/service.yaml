apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob1c19628-ffff-42fd-a1f3-0ec7711f58f4.fullname" . }}
  labels:
    {{- include "go-echob1c19628-ffff-42fd-a1f3-0ec7711f58f4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob1c19628-ffff-42fd-a1f3-0ec7711f58f4.selectorLabels" . | nindent 6 }}
