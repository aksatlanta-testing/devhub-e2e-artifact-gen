apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc5657094-b134-468f-916d-25f9611a668e.fullname" . }}
  labels:
    {{- include "go-echoc5657094-b134-468f-916d-25f9611a668e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc5657094-b134-468f-916d-25f9611a668e.selectorLabels" . | nindent 6 }}
