apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9f424f3d-77c1-4826-8314-b0d8993ba185.fullname" . }}
  labels:
    {{- include "go-echo9f424f3d-77c1-4826-8314-b0d8993ba185.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9f424f3d-77c1-4826-8314-b0d8993ba185.selectorLabels" . | nindent 6 }}
