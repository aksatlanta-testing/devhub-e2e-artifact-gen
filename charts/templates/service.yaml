apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2b2c54a9-8076-4727-b415-a75b2e61274a.fullname" . }}
  labels:
    {{- include "go-echo2b2c54a9-8076-4727-b415-a75b2e61274a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2b2c54a9-8076-4727-b415-a75b2e61274a.selectorLabels" . | nindent 6 }}
