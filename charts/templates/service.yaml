apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo63738019-6d70-40fd-8301-a1feb61f5ec0.fullname" . }}
  labels:
    {{- include "go-echo63738019-6d70-40fd-8301-a1feb61f5ec0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo63738019-6d70-40fd-8301-a1feb61f5ec0.selectorLabels" . | nindent 6 }}
