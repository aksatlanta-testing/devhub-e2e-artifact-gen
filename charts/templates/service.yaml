apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo24bcf046-598a-4646-949b-8bd53caa8ff3.fullname" . }}
  labels:
    {{- include "go-echo24bcf046-598a-4646-949b-8bd53caa8ff3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo24bcf046-598a-4646-949b-8bd53caa8ff3.selectorLabels" . | nindent 6 }}
