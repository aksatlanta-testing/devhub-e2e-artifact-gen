apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0c4526ee-faac-408d-a970-83690da24e59.fullname" . }}
  labels:
    {{- include "go-echo0c4526ee-faac-408d-a970-83690da24e59.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0c4526ee-faac-408d-a970-83690da24e59.selectorLabels" . | nindent 6 }}
