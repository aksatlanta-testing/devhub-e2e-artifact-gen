apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe925cf65-85a0-4264-a88f-f0bd39d48424.fullname" . }}
  labels:
    {{- include "go-echoe925cf65-85a0-4264-a88f-f0bd39d48424.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe925cf65-85a0-4264-a88f-f0bd39d48424.selectorLabels" . | nindent 6 }}
