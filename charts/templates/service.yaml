apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo36e2a2e6-e53c-4010-b838-4ff1a6900d9f.fullname" . }}
  labels:
    {{- include "go-echo36e2a2e6-e53c-4010-b838-4ff1a6900d9f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo36e2a2e6-e53c-4010-b838-4ff1a6900d9f.selectorLabels" . | nindent 6 }}
