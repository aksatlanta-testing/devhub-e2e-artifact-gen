apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoec78f6b3-3a61-43eb-b07e-46e07d3c6d5a.fullname" . }}
  labels:
    {{- include "go-echoec78f6b3-3a61-43eb-b07e-46e07d3c6d5a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoec78f6b3-3a61-43eb-b07e-46e07d3c6d5a.selectorLabels" . | nindent 6 }}
