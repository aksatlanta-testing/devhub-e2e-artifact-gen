apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8aaf1f83-1673-430d-b1db-bb88b93a9e7b.fullname" . }}
  labels:
    {{- include "go-echo8aaf1f83-1673-430d-b1db-bb88b93a9e7b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8aaf1f83-1673-430d-b1db-bb88b93a9e7b.selectorLabels" . | nindent 6 }}
