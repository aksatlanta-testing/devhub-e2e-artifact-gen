apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6b19c1de-397a-4c47-8721-3a762a453e08.fullname" . }}
  labels:
    {{- include "go-echo6b19c1de-397a-4c47-8721-3a762a453e08.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6b19c1de-397a-4c47-8721-3a762a453e08.selectorLabels" . | nindent 6 }}
