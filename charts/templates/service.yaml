apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3db84b45-83e0-4fba-b477-1d8e959bb995.fullname" . }}
  labels:
    {{- include "go-echo3db84b45-83e0-4fba-b477-1d8e959bb995.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3db84b45-83e0-4fba-b477-1d8e959bb995.selectorLabels" . | nindent 6 }}
