apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof2d238f5-0353-447f-8a7b-df3406846216.fullname" . }}
  labels:
    {{- include "go-echof2d238f5-0353-447f-8a7b-df3406846216.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof2d238f5-0353-447f-8a7b-df3406846216.selectorLabels" . | nindent 6 }}
