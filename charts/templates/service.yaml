apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2ace6bc8-d83e-4b68-a1a0-f1914b79e911.fullname" . }}
  labels:
    {{- include "go-echo2ace6bc8-d83e-4b68-a1a0-f1914b79e911.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2ace6bc8-d83e-4b68-a1a0-f1914b79e911.selectorLabels" . | nindent 6 }}
