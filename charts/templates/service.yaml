apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob73ad27d-8aa0-4d8a-ba70-e552f89b6d6d.fullname" . }}
  labels:
    {{- include "go-echob73ad27d-8aa0-4d8a-ba70-e552f89b6d6d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob73ad27d-8aa0-4d8a-ba70-e552f89b6d6d.selectorLabels" . | nindent 6 }}
