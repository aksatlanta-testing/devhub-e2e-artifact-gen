apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6d2ce643-c499-4a28-9959-5e3153541a66.fullname" . }}
  labels:
    {{- include "go-echo6d2ce643-c499-4a28-9959-5e3153541a66.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6d2ce643-c499-4a28-9959-5e3153541a66.selectorLabels" . | nindent 6 }}
