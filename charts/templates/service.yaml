apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3044737b-ae4c-4796-91e0-09cc20f0e617.fullname" . }}
  labels:
    {{- include "go-echo3044737b-ae4c-4796-91e0-09cc20f0e617.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3044737b-ae4c-4796-91e0-09cc20f0e617.selectorLabels" . | nindent 6 }}
