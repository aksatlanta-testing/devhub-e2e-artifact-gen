apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5093a60f-e475-4ee8-9ec3-df8c9b336447.fullname" . }}
  labels:
    {{- include "go-echo5093a60f-e475-4ee8-9ec3-df8c9b336447.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5093a60f-e475-4ee8-9ec3-df8c9b336447.selectorLabels" . | nindent 6 }}
