apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8c9d8804-d87b-4670-b53b-8ee1caa95830.fullname" . }}
  labels:
    {{- include "go-echo8c9d8804-d87b-4670-b53b-8ee1caa95830.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8c9d8804-d87b-4670-b53b-8ee1caa95830.selectorLabels" . | nindent 6 }}
