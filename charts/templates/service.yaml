apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7d29c145-e81a-45e6-af92-db274583f64c.fullname" . }}
  labels:
    {{- include "go-echo7d29c145-e81a-45e6-af92-db274583f64c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7d29c145-e81a-45e6-af92-db274583f64c.selectorLabels" . | nindent 6 }}
