apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo433b801c-9211-4cbf-80f1-bbc3e2a36950.fullname" . }}
  labels:
    {{- include "go-echo433b801c-9211-4cbf-80f1-bbc3e2a36950.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo433b801c-9211-4cbf-80f1-bbc3e2a36950.selectorLabels" . | nindent 6 }}
