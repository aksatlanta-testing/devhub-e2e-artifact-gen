apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo754eed83-8b77-4fdf-a55a-ec14b7243be4.fullname" . }}
  labels:
    {{- include "go-echo754eed83-8b77-4fdf-a55a-ec14b7243be4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo754eed83-8b77-4fdf-a55a-ec14b7243be4.selectorLabels" . | nindent 6 }}
