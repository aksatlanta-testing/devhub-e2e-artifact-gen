apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6e731f39-a178-4f0f-a10d-6052bfa09554.fullname" . }}
  labels:
    {{- include "go-echo6e731f39-a178-4f0f-a10d-6052bfa09554.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6e731f39-a178-4f0f-a10d-6052bfa09554.selectorLabels" . | nindent 6 }}
