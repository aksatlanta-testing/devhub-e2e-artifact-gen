apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7b298750-8f5e-442c-aca7-1dc5685de914.fullname" . }}
  labels:
    {{- include "go-echo7b298750-8f5e-442c-aca7-1dc5685de914.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7b298750-8f5e-442c-aca7-1dc5685de914.selectorLabels" . | nindent 6 }}
