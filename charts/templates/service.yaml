apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo64bd5033-3857-4717-ba97-49af79473bdc.fullname" . }}
  labels:
    {{- include "go-echo64bd5033-3857-4717-ba97-49af79473bdc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo64bd5033-3857-4717-ba97-49af79473bdc.selectorLabels" . | nindent 6 }}
