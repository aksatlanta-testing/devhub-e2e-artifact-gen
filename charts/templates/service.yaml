apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa67a55c8-a3c8-46df-b6e5-32351ca5d040.fullname" . }}
  labels:
    {{- include "go-echoa67a55c8-a3c8-46df-b6e5-32351ca5d040.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa67a55c8-a3c8-46df-b6e5-32351ca5d040.selectorLabels" . | nindent 6 }}
