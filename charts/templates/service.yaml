apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo68f5cc23-32cf-44a1-9d05-0f64608287cd.fullname" . }}
  labels:
    {{- include "go-echo68f5cc23-32cf-44a1-9d05-0f64608287cd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo68f5cc23-32cf-44a1-9d05-0f64608287cd.selectorLabels" . | nindent 6 }}
