apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe1126059-44f6-4ce8-99c7-19f7bebc3dbd.fullname" . }}
  labels:
    {{- include "go-echoe1126059-44f6-4ce8-99c7-19f7bebc3dbd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe1126059-44f6-4ce8-99c7-19f7bebc3dbd.selectorLabels" . | nindent 6 }}
