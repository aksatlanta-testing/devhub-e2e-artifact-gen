apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0ca32154-dc81-42db-8ad9-2cfb08813dda.fullname" . }}
  labels:
    {{- include "go-echo0ca32154-dc81-42db-8ad9-2cfb08813dda.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0ca32154-dc81-42db-8ad9-2cfb08813dda.selectorLabels" . | nindent 6 }}
