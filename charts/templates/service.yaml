apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3d1c9df0-6d40-4116-8d22-f889168ea3fc.fullname" . }}
  labels:
    {{- include "go-echo3d1c9df0-6d40-4116-8d22-f889168ea3fc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3d1c9df0-6d40-4116-8d22-f889168ea3fc.selectorLabels" . | nindent 6 }}
