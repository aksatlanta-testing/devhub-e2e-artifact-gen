apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4883608b-80ec-40bb-aec4-90a94df5700a.fullname" . }}
  labels:
    {{- include "go-echo4883608b-80ec-40bb-aec4-90a94df5700a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4883608b-80ec-40bb-aec4-90a94df5700a.selectorLabels" . | nindent 6 }}
