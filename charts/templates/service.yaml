apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4814da4f-d97a-4233-979e-395b56eec0b8.fullname" . }}
  labels:
    {{- include "go-echo4814da4f-d97a-4233-979e-395b56eec0b8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4814da4f-d97a-4233-979e-395b56eec0b8.selectorLabels" . | nindent 6 }}
