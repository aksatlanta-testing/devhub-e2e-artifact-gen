apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoac6f147b-9b5b-4855-b0ba-9cf954f4909b.fullname" . }}
  labels:
    {{- include "go-echoac6f147b-9b5b-4855-b0ba-9cf954f4909b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoac6f147b-9b5b-4855-b0ba-9cf954f4909b.selectorLabels" . | nindent 6 }}
