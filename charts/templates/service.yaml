apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo68c956a3-635a-42aa-a951-a3ba929a2ad3.fullname" . }}
  labels:
    {{- include "go-echo68c956a3-635a-42aa-a951-a3ba929a2ad3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo68c956a3-635a-42aa-a951-a3ba929a2ad3.selectorLabels" . | nindent 6 }}
