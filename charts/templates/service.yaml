apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod882fda1-8a28-4a06-9f9b-8be2e9762ea4.fullname" . }}
  labels:
    {{- include "go-echod882fda1-8a28-4a06-9f9b-8be2e9762ea4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod882fda1-8a28-4a06-9f9b-8be2e9762ea4.selectorLabels" . | nindent 6 }}
