apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob832ae73-b003-4161-a58e-a317dda8f42f.fullname" . }}
  labels:
    {{- include "go-echob832ae73-b003-4161-a58e-a317dda8f42f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob832ae73-b003-4161-a58e-a317dda8f42f.selectorLabels" . | nindent 6 }}
