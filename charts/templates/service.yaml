apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo00c72e7a-f301-42a8-b04c-1744e828ac78.fullname" . }}
  labels:
    {{- include "go-echo00c72e7a-f301-42a8-b04c-1744e828ac78.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo00c72e7a-f301-42a8-b04c-1744e828ac78.selectorLabels" . | nindent 6 }}
