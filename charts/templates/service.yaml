apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa3ea6fef-96eb-47ef-a392-4134a671cd44.fullname" . }}
  labels:
    {{- include "go-echoa3ea6fef-96eb-47ef-a392-4134a671cd44.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa3ea6fef-96eb-47ef-a392-4134a671cd44.selectorLabels" . | nindent 6 }}
