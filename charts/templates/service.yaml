apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof61dc425-be1c-4e43-b012-3bfa5e219af8.fullname" . }}
  labels:
    {{- include "go-echof61dc425-be1c-4e43-b012-3bfa5e219af8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof61dc425-be1c-4e43-b012-3bfa5e219af8.selectorLabels" . | nindent 6 }}
