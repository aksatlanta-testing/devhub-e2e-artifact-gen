apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo64cffbdf-5698-4229-bcf7-7c6664f1642d.fullname" . }}
  labels:
    {{- include "go-echo64cffbdf-5698-4229-bcf7-7c6664f1642d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo64cffbdf-5698-4229-bcf7-7c6664f1642d.selectorLabels" . | nindent 6 }}
