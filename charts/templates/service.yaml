apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echode96e3b4-8208-4f8b-9b8c-52ab5603ca76.fullname" . }}
  labels:
    {{- include "go-echode96e3b4-8208-4f8b-9b8c-52ab5603ca76.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echode96e3b4-8208-4f8b-9b8c-52ab5603ca76.selectorLabels" . | nindent 6 }}
