apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo689e96b4-4a5d-4432-bc70-8e54a37df66f.fullname" . }}
  labels:
    {{- include "go-echo689e96b4-4a5d-4432-bc70-8e54a37df66f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo689e96b4-4a5d-4432-bc70-8e54a37df66f.selectorLabels" . | nindent 6 }}
