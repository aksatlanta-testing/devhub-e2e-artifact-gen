apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6efe9738-2ca1-488f-b2e2-c1f1745e0098.fullname" . }}
  labels:
    {{- include "go-echo6efe9738-2ca1-488f-b2e2-c1f1745e0098.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6efe9738-2ca1-488f-b2e2-c1f1745e0098.selectorLabels" . | nindent 6 }}
