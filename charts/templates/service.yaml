apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo578ade79-1511-4b7b-bf22-f2645417fd91.fullname" . }}
  labels:
    {{- include "go-echo578ade79-1511-4b7b-bf22-f2645417fd91.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo578ade79-1511-4b7b-bf22-f2645417fd91.selectorLabels" . | nindent 6 }}
