apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8a623cf4-90c9-4576-8009-83a32aecd9fa.fullname" . }}
  labels:
    {{- include "go-echo8a623cf4-90c9-4576-8009-83a32aecd9fa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8a623cf4-90c9-4576-8009-83a32aecd9fa.selectorLabels" . | nindent 6 }}
