apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5f9c2c81-d8a5-4fb8-9644-2edfce8093de.fullname" . }}
  labels:
    {{- include "go-echo5f9c2c81-d8a5-4fb8-9644-2edfce8093de.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5f9c2c81-d8a5-4fb8-9644-2edfce8093de.selectorLabels" . | nindent 6 }}
