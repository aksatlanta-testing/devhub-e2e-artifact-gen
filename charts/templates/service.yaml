apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob6699063-21c8-4b27-9cfb-5530ddfb7226.fullname" . }}
  labels:
    {{- include "go-echob6699063-21c8-4b27-9cfb-5530ddfb7226.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob6699063-21c8-4b27-9cfb-5530ddfb7226.selectorLabels" . | nindent 6 }}
