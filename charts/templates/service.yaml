apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo43efb75b-13f3-450f-b803-ad15e9486b38.fullname" . }}
  labels:
    {{- include "go-echo43efb75b-13f3-450f-b803-ad15e9486b38.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo43efb75b-13f3-450f-b803-ad15e9486b38.selectorLabels" . | nindent 6 }}
