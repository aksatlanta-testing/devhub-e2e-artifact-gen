apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo20803cd3-6a1a-4288-bd78-af0e33aa1cf6.fullname" . }}
  labels:
    {{- include "go-echo20803cd3-6a1a-4288-bd78-af0e33aa1cf6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo20803cd3-6a1a-4288-bd78-af0e33aa1cf6.selectorLabels" . | nindent 6 }}
