apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3378a0a4-c985-4aaa-9682-e4659c561274.fullname" . }}
  labels:
    {{- include "go-echo3378a0a4-c985-4aaa-9682-e4659c561274.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3378a0a4-c985-4aaa-9682-e4659c561274.selectorLabels" . | nindent 6 }}
