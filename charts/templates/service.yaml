apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe00b01fb-2e64-4fe3-a628-e9be582dbf03.fullname" . }}
  labels:
    {{- include "go-echoe00b01fb-2e64-4fe3-a628-e9be582dbf03.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe00b01fb-2e64-4fe3-a628-e9be582dbf03.selectorLabels" . | nindent 6 }}
