apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodb201916-cc41-4a3a-a592-899361046226.fullname" . }}
  labels:
    {{- include "go-echodb201916-cc41-4a3a-a592-899361046226.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodb201916-cc41-4a3a-a592-899361046226.selectorLabels" . | nindent 6 }}
