apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa065a9d2-6a4d-4c58-be63-e1f65696573e.fullname" . }}
  labels:
    {{- include "go-echoa065a9d2-6a4d-4c58-be63-e1f65696573e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa065a9d2-6a4d-4c58-be63-e1f65696573e.selectorLabels" . | nindent 6 }}
