apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2d2896eb-0d5a-44b6-aa1d-b11f3e1cafd7.fullname" . }}
  labels:
    {{- include "go-echo2d2896eb-0d5a-44b6-aa1d-b11f3e1cafd7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2d2896eb-0d5a-44b6-aa1d-b11f3e1cafd7.selectorLabels" . | nindent 6 }}
