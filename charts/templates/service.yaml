apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo196726ba-8cec-46ef-93f2-7d3ef29a113d.fullname" . }}
  labels:
    {{- include "go-echo196726ba-8cec-46ef-93f2-7d3ef29a113d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo196726ba-8cec-46ef-93f2-7d3ef29a113d.selectorLabels" . | nindent 6 }}
