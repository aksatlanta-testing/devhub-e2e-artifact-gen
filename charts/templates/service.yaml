apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8dbb4e5b-3e32-44ff-a0c8-9c594401520e.fullname" . }}
  labels:
    {{- include "go-echo8dbb4e5b-3e32-44ff-a0c8-9c594401520e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8dbb4e5b-3e32-44ff-a0c8-9c594401520e.selectorLabels" . | nindent 6 }}
