apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc2ba5be9-7770-4be5-9ce7-6f9371421fc3.fullname" . }}
  labels:
    {{- include "go-echoc2ba5be9-7770-4be5-9ce7-6f9371421fc3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc2ba5be9-7770-4be5-9ce7-6f9371421fc3.selectorLabels" . | nindent 6 }}
