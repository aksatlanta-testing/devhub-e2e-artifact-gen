apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo24587314-12ec-46ab-b6dd-005d569f3159.fullname" . }}
  labels:
    {{- include "go-echo24587314-12ec-46ab-b6dd-005d569f3159.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo24587314-12ec-46ab-b6dd-005d569f3159.selectorLabels" . | nindent 6 }}
