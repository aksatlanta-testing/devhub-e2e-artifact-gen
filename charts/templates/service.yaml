apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof91230d6-deda-4795-9e3c-ac85d8e3019e.fullname" . }}
  labels:
    {{- include "go-echof91230d6-deda-4795-9e3c-ac85d8e3019e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof91230d6-deda-4795-9e3c-ac85d8e3019e.selectorLabels" . | nindent 6 }}
