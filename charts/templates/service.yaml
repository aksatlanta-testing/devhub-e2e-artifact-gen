apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodf7d432b-3b7a-4d0c-bb27-6d89db4ccf43.fullname" . }}
  labels:
    {{- include "go-echodf7d432b-3b7a-4d0c-bb27-6d89db4ccf43.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodf7d432b-3b7a-4d0c-bb27-6d89db4ccf43.selectorLabels" . | nindent 6 }}
