apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob5e6e5c9-d3b9-4618-a3bd-c380ae2cb0e1.fullname" . }}
  labels:
    {{- include "go-echob5e6e5c9-d3b9-4618-a3bd-c380ae2cb0e1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob5e6e5c9-d3b9-4618-a3bd-c380ae2cb0e1.selectorLabels" . | nindent 6 }}
