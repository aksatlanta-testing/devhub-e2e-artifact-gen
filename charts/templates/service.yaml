apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob3c539dd-ba7b-4a0a-97cf-6c7aff02e372.fullname" . }}
  labels:
    {{- include "go-echob3c539dd-ba7b-4a0a-97cf-6c7aff02e372.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob3c539dd-ba7b-4a0a-97cf-6c7aff02e372.selectorLabels" . | nindent 6 }}
