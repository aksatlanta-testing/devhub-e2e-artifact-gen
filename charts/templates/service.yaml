apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe47a72e1-be05-47a4-b23f-1c8ed3524db6.fullname" . }}
  labels:
    {{- include "go-echoe47a72e1-be05-47a4-b23f-1c8ed3524db6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe47a72e1-be05-47a4-b23f-1c8ed3524db6.selectorLabels" . | nindent 6 }}
