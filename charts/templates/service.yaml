apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod91cab70-5e2d-472b-a5cb-6f4f6956b381.fullname" . }}
  labels:
    {{- include "go-echod91cab70-5e2d-472b-a5cb-6f4f6956b381.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod91cab70-5e2d-472b-a5cb-6f4f6956b381.selectorLabels" . | nindent 6 }}
