apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo67e9407d-00b2-400b-bbb6-18d298434638.fullname" . }}
  labels:
    {{- include "go-echo67e9407d-00b2-400b-bbb6-18d298434638.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo67e9407d-00b2-400b-bbb6-18d298434638.selectorLabels" . | nindent 6 }}
