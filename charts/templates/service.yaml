apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo60a6bdfb-a005-42f5-999d-610b8202656b.fullname" . }}
  labels:
    {{- include "go-echo60a6bdfb-a005-42f5-999d-610b8202656b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo60a6bdfb-a005-42f5-999d-610b8202656b.selectorLabels" . | nindent 6 }}
