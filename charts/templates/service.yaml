apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo37b7aea0-7552-43fb-9626-8e52a6149b78.fullname" . }}
  labels:
    {{- include "go-echo37b7aea0-7552-43fb-9626-8e52a6149b78.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo37b7aea0-7552-43fb-9626-8e52a6149b78.selectorLabels" . | nindent 6 }}
