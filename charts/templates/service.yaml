apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3af6b8f0-7184-44c0-b4f4-c4c61fa9828e.fullname" . }}
  labels:
    {{- include "go-echo3af6b8f0-7184-44c0-b4f4-c4c61fa9828e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3af6b8f0-7184-44c0-b4f4-c4c61fa9828e.selectorLabels" . | nindent 6 }}
