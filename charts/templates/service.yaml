apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo59e4523c-e2c6-4668-babb-e76b3b4d70e9.fullname" . }}
  labels:
    {{- include "go-echo59e4523c-e2c6-4668-babb-e76b3b4d70e9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo59e4523c-e2c6-4668-babb-e76b3b4d70e9.selectorLabels" . | nindent 6 }}
