apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7c2a36b2-aebe-4a24-ab52-1b170477f8f5.fullname" . }}
  labels:
    {{- include "go-echo7c2a36b2-aebe-4a24-ab52-1b170477f8f5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7c2a36b2-aebe-4a24-ab52-1b170477f8f5.selectorLabels" . | nindent 6 }}
