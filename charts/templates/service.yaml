apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo53a13728-1d3b-4110-8a7e-3088ef6909d8.fullname" . }}
  labels:
    {{- include "go-echo53a13728-1d3b-4110-8a7e-3088ef6909d8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo53a13728-1d3b-4110-8a7e-3088ef6909d8.selectorLabels" . | nindent 6 }}
