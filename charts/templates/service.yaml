apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo791043e8-f200-4d8f-aba6-dca0f8248c53.fullname" . }}
  labels:
    {{- include "go-echo791043e8-f200-4d8f-aba6-dca0f8248c53.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo791043e8-f200-4d8f-aba6-dca0f8248c53.selectorLabels" . | nindent 6 }}
