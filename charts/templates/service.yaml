apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo29a64c07-79ef-4697-a067-7a8199308638.fullname" . }}
  labels:
    {{- include "go-echo29a64c07-79ef-4697-a067-7a8199308638.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo29a64c07-79ef-4697-a067-7a8199308638.selectorLabels" . | nindent 6 }}
