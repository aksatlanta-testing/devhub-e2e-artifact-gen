apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1f713dfa-bedc-4742-ae58-e4f86e30cab9.fullname" . }}
  labels:
    {{- include "go-echo1f713dfa-bedc-4742-ae58-e4f86e30cab9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1f713dfa-bedc-4742-ae58-e4f86e30cab9.selectorLabels" . | nindent 6 }}
