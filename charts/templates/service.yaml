apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9e8d610c-baf3-4303-88ea-84b1cabf8280.fullname" . }}
  labels:
    {{- include "go-echo9e8d610c-baf3-4303-88ea-84b1cabf8280.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9e8d610c-baf3-4303-88ea-84b1cabf8280.selectorLabels" . | nindent 6 }}
