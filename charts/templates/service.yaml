apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod99e2fe7-de37-474e-bb36-0e6536f85ff0.fullname" . }}
  labels:
    {{- include "go-echod99e2fe7-de37-474e-bb36-0e6536f85ff0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod99e2fe7-de37-474e-bb36-0e6536f85ff0.selectorLabels" . | nindent 6 }}
