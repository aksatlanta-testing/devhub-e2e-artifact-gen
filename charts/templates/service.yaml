apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof8896944-06be-4497-b1d4-4b0f64c74704.fullname" . }}
  labels:
    {{- include "go-echof8896944-06be-4497-b1d4-4b0f64c74704.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof8896944-06be-4497-b1d4-4b0f64c74704.selectorLabels" . | nindent 6 }}
