apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo52099c78-3879-4db8-bb1b-69ba38e0c89d.fullname" . }}
  labels:
    {{- include "go-echo52099c78-3879-4db8-bb1b-69ba38e0c89d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo52099c78-3879-4db8-bb1b-69ba38e0c89d.selectorLabels" . | nindent 6 }}
