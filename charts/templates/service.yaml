apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo558bfe1b-3b1a-4325-acb0-099f3359a6ed.fullname" . }}
  labels:
    {{- include "go-echo558bfe1b-3b1a-4325-acb0-099f3359a6ed.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo558bfe1b-3b1a-4325-acb0-099f3359a6ed.selectorLabels" . | nindent 6 }}
