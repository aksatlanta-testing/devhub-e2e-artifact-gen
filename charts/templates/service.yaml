apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo20aacdc2-f8e9-4dc4-b592-b912bba09867.fullname" . }}
  labels:
    {{- include "go-echo20aacdc2-f8e9-4dc4-b592-b912bba09867.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo20aacdc2-f8e9-4dc4-b592-b912bba09867.selectorLabels" . | nindent 6 }}
