apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo51bd6984-e1e3-4cdc-96d4-906a01dde937.fullname" . }}
  labels:
    {{- include "go-echo51bd6984-e1e3-4cdc-96d4-906a01dde937.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo51bd6984-e1e3-4cdc-96d4-906a01dde937.selectorLabels" . | nindent 6 }}
