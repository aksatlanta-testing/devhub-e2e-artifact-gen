apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6d65662b-ee95-4f8b-a849-b3036bb0c3c3.fullname" . }}
  labels:
    {{- include "go-echo6d65662b-ee95-4f8b-a849-b3036bb0c3c3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6d65662b-ee95-4f8b-a849-b3036bb0c3c3.selectorLabels" . | nindent 6 }}
