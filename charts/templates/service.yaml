apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8b0a51c0-5d26-4e32-bd02-74e971445e24.fullname" . }}
  labels:
    {{- include "go-echo8b0a51c0-5d26-4e32-bd02-74e971445e24.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8b0a51c0-5d26-4e32-bd02-74e971445e24.selectorLabels" . | nindent 6 }}
