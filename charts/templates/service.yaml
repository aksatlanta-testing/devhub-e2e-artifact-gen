apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocc4cbede-6356-4480-ac08-9da6ab4f1111.fullname" . }}
  labels:
    {{- include "go-echocc4cbede-6356-4480-ac08-9da6ab4f1111.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocc4cbede-6356-4480-ac08-9da6ab4f1111.selectorLabels" . | nindent 6 }}
