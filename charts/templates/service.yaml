apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa945328c-ca02-4930-bee4-6d96990bfbb7.fullname" . }}
  labels:
    {{- include "go-echoa945328c-ca02-4930-bee4-6d96990bfbb7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa945328c-ca02-4930-bee4-6d96990bfbb7.selectorLabels" . | nindent 6 }}
