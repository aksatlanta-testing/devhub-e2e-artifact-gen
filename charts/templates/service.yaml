apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo67616e66-8368-4014-ad48-cd8a2f804c87.fullname" . }}
  labels:
    {{- include "go-echo67616e66-8368-4014-ad48-cd8a2f804c87.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo67616e66-8368-4014-ad48-cd8a2f804c87.selectorLabels" . | nindent 6 }}
