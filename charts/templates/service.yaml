apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo170dbf1e-674e-4725-8bc5-74a974e1bf1b.fullname" . }}
  labels:
    {{- include "go-echo170dbf1e-674e-4725-8bc5-74a974e1bf1b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo170dbf1e-674e-4725-8bc5-74a974e1bf1b.selectorLabels" . | nindent 6 }}
