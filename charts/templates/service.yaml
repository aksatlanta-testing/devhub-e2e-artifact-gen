apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc7d70a18-21bf-486a-9871-d7a3ca1374dc.fullname" . }}
  labels:
    {{- include "go-echoc7d70a18-21bf-486a-9871-d7a3ca1374dc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc7d70a18-21bf-486a-9871-d7a3ca1374dc.selectorLabels" . | nindent 6 }}
