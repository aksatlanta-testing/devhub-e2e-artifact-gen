apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6cb06e9e-a5ac-4fde-bf4d-0d5c42be6197.fullname" . }}
  labels:
    {{- include "go-echo6cb06e9e-a5ac-4fde-bf4d-0d5c42be6197.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6cb06e9e-a5ac-4fde-bf4d-0d5c42be6197.selectorLabels" . | nindent 6 }}
