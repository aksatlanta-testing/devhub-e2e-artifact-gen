apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof8a201bb-f95d-4519-a1d9-b6f3fe781291.fullname" . }}
  labels:
    {{- include "go-echof8a201bb-f95d-4519-a1d9-b6f3fe781291.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof8a201bb-f95d-4519-a1d9-b6f3fe781291.selectorLabels" . | nindent 6 }}
