apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2b0488f1-74da-4eaa-847e-e494fd36f66b.fullname" . }}
  labels:
    {{- include "go-echo2b0488f1-74da-4eaa-847e-e494fd36f66b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2b0488f1-74da-4eaa-847e-e494fd36f66b.selectorLabels" . | nindent 6 }}
