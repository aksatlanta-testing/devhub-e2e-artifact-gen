apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo58401c43-369f-44cb-9fc3-a893e69af566.fullname" . }}
  labels:
    {{- include "go-echo58401c43-369f-44cb-9fc3-a893e69af566.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo58401c43-369f-44cb-9fc3-a893e69af566.selectorLabels" . | nindent 6 }}
