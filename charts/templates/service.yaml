apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5ae85f51-b173-43d4-a0e1-17239a9c0fd7.fullname" . }}
  labels:
    {{- include "go-echo5ae85f51-b173-43d4-a0e1-17239a9c0fd7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5ae85f51-b173-43d4-a0e1-17239a9c0fd7.selectorLabels" . | nindent 6 }}
