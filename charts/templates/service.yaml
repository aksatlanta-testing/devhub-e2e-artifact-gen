apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9f3d6c17-2691-4f1d-b006-923b2780a185.fullname" . }}
  labels:
    {{- include "go-echo9f3d6c17-2691-4f1d-b006-923b2780a185.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9f3d6c17-2691-4f1d-b006-923b2780a185.selectorLabels" . | nindent 6 }}
