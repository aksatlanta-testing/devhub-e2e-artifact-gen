apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo68ad0ddf-c0e9-41e3-b681-750637d051e1.fullname" . }}
  labels:
    {{- include "go-echo68ad0ddf-c0e9-41e3-b681-750637d051e1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo68ad0ddf-c0e9-41e3-b681-750637d051e1.selectorLabels" . | nindent 6 }}
