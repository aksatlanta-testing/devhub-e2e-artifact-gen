apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9464dd12-7e2c-4fb5-8d5f-4e0d7d78c3e8.fullname" . }}
  labels:
    {{- include "go-echo9464dd12-7e2c-4fb5-8d5f-4e0d7d78c3e8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9464dd12-7e2c-4fb5-8d5f-4e0d7d78c3e8.selectorLabels" . | nindent 6 }}
