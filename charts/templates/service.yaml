apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof6f8b4b6-4030-4b3b-823c-39fddcf72b67.fullname" . }}
  labels:
    {{- include "go-echof6f8b4b6-4030-4b3b-823c-39fddcf72b67.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof6f8b4b6-4030-4b3b-823c-39fddcf72b67.selectorLabels" . | nindent 6 }}
