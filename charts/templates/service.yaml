apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo639a67ed-267c-4282-ab08-95d4946efa04.fullname" . }}
  labels:
    {{- include "go-echo639a67ed-267c-4282-ab08-95d4946efa04.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo639a67ed-267c-4282-ab08-95d4946efa04.selectorLabels" . | nindent 6 }}
