apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7bd620ee-f736-4567-9b30-8669e7ab1f46.fullname" . }}
  labels:
    {{- include "go-echo7bd620ee-f736-4567-9b30-8669e7ab1f46.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7bd620ee-f736-4567-9b30-8669e7ab1f46.selectorLabels" . | nindent 6 }}
