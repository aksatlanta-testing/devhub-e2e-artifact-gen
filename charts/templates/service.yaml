apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0fc822a9-72a2-4667-b4b6-d70e485e19b8.fullname" . }}
  labels:
    {{- include "go-echo0fc822a9-72a2-4667-b4b6-d70e485e19b8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0fc822a9-72a2-4667-b4b6-d70e485e19b8.selectorLabels" . | nindent 6 }}
