apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo422cc995-0094-4daf-b56f-f8930cd24409.fullname" . }}
  labels:
    {{- include "go-echo422cc995-0094-4daf-b56f-f8930cd24409.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo422cc995-0094-4daf-b56f-f8930cd24409.selectorLabels" . | nindent 6 }}
