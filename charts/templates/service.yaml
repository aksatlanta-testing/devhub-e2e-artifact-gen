apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoff633474-759b-4643-9b10-b47b8e05f016.fullname" . }}
  labels:
    {{- include "go-echoff633474-759b-4643-9b10-b47b8e05f016.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoff633474-759b-4643-9b10-b47b8e05f016.selectorLabels" . | nindent 6 }}
