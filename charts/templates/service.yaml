apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa27a0b2c-3941-49f2-a663-676cc247142d.fullname" . }}
  labels:
    {{- include "go-echoa27a0b2c-3941-49f2-a663-676cc247142d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa27a0b2c-3941-49f2-a663-676cc247142d.selectorLabels" . | nindent 6 }}
