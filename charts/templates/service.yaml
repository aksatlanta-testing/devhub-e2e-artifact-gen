apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0803a159-1b90-4b3e-9fc3-64edfb60df19.fullname" . }}
  labels:
    {{- include "go-echo0803a159-1b90-4b3e-9fc3-64edfb60df19.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0803a159-1b90-4b3e-9fc3-64edfb60df19.selectorLabels" . | nindent 6 }}
