apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa990f51a-042e-4667-a52c-ca6d03ae28ae.fullname" . }}
  labels:
    {{- include "go-echoa990f51a-042e-4667-a52c-ca6d03ae28ae.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa990f51a-042e-4667-a52c-ca6d03ae28ae.selectorLabels" . | nindent 6 }}
