apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8aae3e42-1d47-4352-8155-656b8f59190c.fullname" . }}
  labels:
    {{- include "go-echo8aae3e42-1d47-4352-8155-656b8f59190c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8aae3e42-1d47-4352-8155-656b8f59190c.selectorLabels" . | nindent 6 }}
