apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod1ba79b5-2cdc-499a-8e5e-b11a804e7077.fullname" . }}
  labels:
    {{- include "go-echod1ba79b5-2cdc-499a-8e5e-b11a804e7077.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod1ba79b5-2cdc-499a-8e5e-b11a804e7077.selectorLabels" . | nindent 6 }}
