apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo30866c3c-eb61-41d9-967c-3abb894af4ee.fullname" . }}
  labels:
    {{- include "go-echo30866c3c-eb61-41d9-967c-3abb894af4ee.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo30866c3c-eb61-41d9-967c-3abb894af4ee.selectorLabels" . | nindent 6 }}
