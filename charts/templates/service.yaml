apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo23d9e541-cb0e-4619-a3d9-5cf0956f778c.fullname" . }}
  labels:
    {{- include "go-echo23d9e541-cb0e-4619-a3d9-5cf0956f778c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo23d9e541-cb0e-4619-a3d9-5cf0956f778c.selectorLabels" . | nindent 6 }}
