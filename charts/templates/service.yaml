apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof8ae7e42-39a6-4de5-8b09-4892be211a68.fullname" . }}
  labels:
    {{- include "go-echof8ae7e42-39a6-4de5-8b09-4892be211a68.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof8ae7e42-39a6-4de5-8b09-4892be211a68.selectorLabels" . | nindent 6 }}
