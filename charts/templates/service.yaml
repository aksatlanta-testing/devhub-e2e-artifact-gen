apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo65b5a9e5-a1e0-4571-8662-429d25f3006b.fullname" . }}
  labels:
    {{- include "go-echo65b5a9e5-a1e0-4571-8662-429d25f3006b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo65b5a9e5-a1e0-4571-8662-429d25f3006b.selectorLabels" . | nindent 6 }}
