apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodc5f082a-b214-46e2-9005-83eb2c8771a9.fullname" . }}
  labels:
    {{- include "go-echodc5f082a-b214-46e2-9005-83eb2c8771a9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodc5f082a-b214-46e2-9005-83eb2c8771a9.selectorLabels" . | nindent 6 }}
