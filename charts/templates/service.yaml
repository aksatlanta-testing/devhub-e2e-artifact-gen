apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo257b749b-278f-4e43-b408-482c95764cce.fullname" . }}
  labels:
    {{- include "go-echo257b749b-278f-4e43-b408-482c95764cce.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo257b749b-278f-4e43-b408-482c95764cce.selectorLabels" . | nindent 6 }}
