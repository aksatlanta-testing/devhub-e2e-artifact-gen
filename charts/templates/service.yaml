apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof2a862bd-3da1-4c31-8b0e-7d92b730c260.fullname" . }}
  labels:
    {{- include "go-echof2a862bd-3da1-4c31-8b0e-7d92b730c260.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof2a862bd-3da1-4c31-8b0e-7d92b730c260.selectorLabels" . | nindent 6 }}
