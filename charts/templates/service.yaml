apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc01e20fe-5701-474f-858a-17aaf5db941f.fullname" . }}
  labels:
    {{- include "go-echoc01e20fe-5701-474f-858a-17aaf5db941f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc01e20fe-5701-474f-858a-17aaf5db941f.selectorLabels" . | nindent 6 }}
