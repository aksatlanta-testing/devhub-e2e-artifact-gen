apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo87f8b0cd-2e7b-450f-a848-8f0f09aa40d4.fullname" . }}
  labels:
    {{- include "go-echo87f8b0cd-2e7b-450f-a848-8f0f09aa40d4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo87f8b0cd-2e7b-450f-a848-8f0f09aa40d4.selectorLabels" . | nindent 6 }}
