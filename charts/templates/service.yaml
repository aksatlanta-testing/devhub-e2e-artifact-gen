apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo36a8f21d-b560-4250-9138-0f5233eccdb5.fullname" . }}
  labels:
    {{- include "go-echo36a8f21d-b560-4250-9138-0f5233eccdb5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo36a8f21d-b560-4250-9138-0f5233eccdb5.selectorLabels" . | nindent 6 }}
