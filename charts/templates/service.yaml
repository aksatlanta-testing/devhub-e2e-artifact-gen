apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0857f0ce-2eba-4a14-8f6d-a9c2903b842e.fullname" . }}
  labels:
    {{- include "go-echo0857f0ce-2eba-4a14-8f6d-a9c2903b842e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0857f0ce-2eba-4a14-8f6d-a9c2903b842e.selectorLabels" . | nindent 6 }}
