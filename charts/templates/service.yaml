apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3e3b4d6d-5f41-4725-88d4-6e6b42b52a63.fullname" . }}
  labels:
    {{- include "go-echo3e3b4d6d-5f41-4725-88d4-6e6b42b52a63.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3e3b4d6d-5f41-4725-88d4-6e6b42b52a63.selectorLabels" . | nindent 6 }}
