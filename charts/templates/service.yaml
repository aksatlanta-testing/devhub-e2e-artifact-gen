apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6a17b56c-1fa2-4453-bd9e-fac1a71be60c.fullname" . }}
  labels:
    {{- include "go-echo6a17b56c-1fa2-4453-bd9e-fac1a71be60c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6a17b56c-1fa2-4453-bd9e-fac1a71be60c.selectorLabels" . | nindent 6 }}
