apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo089bbf32-dc8e-488c-96df-ccae1c03abf2.fullname" . }}
  labels:
    {{- include "go-echo089bbf32-dc8e-488c-96df-ccae1c03abf2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo089bbf32-dc8e-488c-96df-ccae1c03abf2.selectorLabels" . | nindent 6 }}
