apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaf41e69c-f25b-42d4-b731-16878a252f52.fullname" . }}
  labels:
    {{- include "go-echoaf41e69c-f25b-42d4-b731-16878a252f52.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaf41e69c-f25b-42d4-b731-16878a252f52.selectorLabels" . | nindent 6 }}
