apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9b86ca1b-ffda-4520-ad07-b2bdd3029bb9.fullname" . }}
  labels:
    {{- include "go-echo9b86ca1b-ffda-4520-ad07-b2bdd3029bb9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9b86ca1b-ffda-4520-ad07-b2bdd3029bb9.selectorLabels" . | nindent 6 }}
