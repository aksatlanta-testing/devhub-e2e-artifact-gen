apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0bcf2891-6984-412d-bd08-c1b20a06a643.fullname" . }}
  labels:
    {{- include "go-echo0bcf2891-6984-412d-bd08-c1b20a06a643.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0bcf2891-6984-412d-bd08-c1b20a06a643.selectorLabels" . | nindent 6 }}
