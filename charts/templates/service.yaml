apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob43a6d24-d99d-40a9-b5c3-53f56b44b2a6.fullname" . }}
  labels:
    {{- include "go-echob43a6d24-d99d-40a9-b5c3-53f56b44b2a6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob43a6d24-d99d-40a9-b5c3-53f56b44b2a6.selectorLabels" . | nindent 6 }}
