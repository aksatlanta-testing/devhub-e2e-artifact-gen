apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocf6cc3ff-9359-4513-b3c3-c57c03f01afd.fullname" . }}
  labels:
    {{- include "go-echocf6cc3ff-9359-4513-b3c3-c57c03f01afd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocf6cc3ff-9359-4513-b3c3-c57c03f01afd.selectorLabels" . | nindent 6 }}
