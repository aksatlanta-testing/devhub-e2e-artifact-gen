apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe3b8437f-832f-426f-be09-ed4b6fc5f37e.fullname" . }}
  labels:
    {{- include "go-echoe3b8437f-832f-426f-be09-ed4b6fc5f37e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe3b8437f-832f-426f-be09-ed4b6fc5f37e.selectorLabels" . | nindent 6 }}
