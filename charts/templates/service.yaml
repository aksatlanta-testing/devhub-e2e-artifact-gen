apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo05fef114-c7ac-40b2-ad61-753c4ffc1e13.fullname" . }}
  labels:
    {{- include "go-echo05fef114-c7ac-40b2-ad61-753c4ffc1e13.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo05fef114-c7ac-40b2-ad61-753c4ffc1e13.selectorLabels" . | nindent 6 }}
