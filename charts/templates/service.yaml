apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoac1b595c-fe4e-4f0b-8c31-60759d31108e.fullname" . }}
  labels:
    {{- include "go-echoac1b595c-fe4e-4f0b-8c31-60759d31108e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoac1b595c-fe4e-4f0b-8c31-60759d31108e.selectorLabels" . | nindent 6 }}
