apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofaf3fc9e-df41-4487-92c3-4e5d8b6c63f0.fullname" . }}
  labels:
    {{- include "go-echofaf3fc9e-df41-4487-92c3-4e5d8b6c63f0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofaf3fc9e-df41-4487-92c3-4e5d8b6c63f0.selectorLabels" . | nindent 6 }}
