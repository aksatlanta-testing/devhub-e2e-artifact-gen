apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3c65f130-b21a-4c56-9a0a-d3e94cf2ca5a.fullname" . }}
  labels:
    {{- include "go-echo3c65f130-b21a-4c56-9a0a-d3e94cf2ca5a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3c65f130-b21a-4c56-9a0a-d3e94cf2ca5a.selectorLabels" . | nindent 6 }}
