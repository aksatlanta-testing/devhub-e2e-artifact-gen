apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo35cac16b-2ad9-44fa-b815-419b00c5ae4b.fullname" . }}
  labels:
    {{- include "go-echo35cac16b-2ad9-44fa-b815-419b00c5ae4b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo35cac16b-2ad9-44fa-b815-419b00c5ae4b.selectorLabels" . | nindent 6 }}
