apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe1784e39-98f5-4547-accd-e7d564cb4af7.fullname" . }}
  labels:
    {{- include "go-echoe1784e39-98f5-4547-accd-e7d564cb4af7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe1784e39-98f5-4547-accd-e7d564cb4af7.selectorLabels" . | nindent 6 }}
