apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod4220aef-79a7-4706-a916-94efa2813eca.fullname" . }}
  labels:
    {{- include "go-echod4220aef-79a7-4706-a916-94efa2813eca.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod4220aef-79a7-4706-a916-94efa2813eca.selectorLabels" . | nindent 6 }}
