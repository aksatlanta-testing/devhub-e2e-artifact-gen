apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3e06622a-7dcd-4d5f-a556-057f38a373a5.fullname" . }}
  labels:
    {{- include "go-echo3e06622a-7dcd-4d5f-a556-057f38a373a5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3e06622a-7dcd-4d5f-a556-057f38a373a5.selectorLabels" . | nindent 6 }}
