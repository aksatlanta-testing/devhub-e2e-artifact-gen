apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5440fd79-28ca-4968-b1ea-a54971a6edd1.fullname" . }}
  labels:
    {{- include "go-echo5440fd79-28ca-4968-b1ea-a54971a6edd1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5440fd79-28ca-4968-b1ea-a54971a6edd1.selectorLabels" . | nindent 6 }}
