apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoecb1937e-6bff-4a1f-b2fd-d617d6750b80.fullname" . }}
  labels:
    {{- include "go-echoecb1937e-6bff-4a1f-b2fd-d617d6750b80.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoecb1937e-6bff-4a1f-b2fd-d617d6750b80.selectorLabels" . | nindent 6 }}
