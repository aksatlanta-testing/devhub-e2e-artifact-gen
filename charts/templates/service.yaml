apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob007e528-a5e2-4340-b1f3-6f9ac1806c16.fullname" . }}
  labels:
    {{- include "go-echob007e528-a5e2-4340-b1f3-6f9ac1806c16.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob007e528-a5e2-4340-b1f3-6f9ac1806c16.selectorLabels" . | nindent 6 }}
