apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo024a9d38-043f-432c-8d1d-bfe2c7a14119.fullname" . }}
  labels:
    {{- include "go-echo024a9d38-043f-432c-8d1d-bfe2c7a14119.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo024a9d38-043f-432c-8d1d-bfe2c7a14119.selectorLabels" . | nindent 6 }}
