apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3cad0dea-82a6-480f-a6d5-e58f6127063e.fullname" . }}
  labels:
    {{- include "go-echo3cad0dea-82a6-480f-a6d5-e58f6127063e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3cad0dea-82a6-480f-a6d5-e58f6127063e.selectorLabels" . | nindent 6 }}
