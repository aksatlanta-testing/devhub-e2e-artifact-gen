apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo05fa9998-d91a-4f41-aa34-bf125d23e325.fullname" . }}
  labels:
    {{- include "go-echo05fa9998-d91a-4f41-aa34-bf125d23e325.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo05fa9998-d91a-4f41-aa34-bf125d23e325.selectorLabels" . | nindent 6 }}
