apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1a99a666-14c7-434c-90c2-2bed35d8421f.fullname" . }}
  labels:
    {{- include "go-echo1a99a666-14c7-434c-90c2-2bed35d8421f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1a99a666-14c7-434c-90c2-2bed35d8421f.selectorLabels" . | nindent 6 }}
