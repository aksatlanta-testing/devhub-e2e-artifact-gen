apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe7c568f7-6343-4b67-9207-b75b95cdbcc2.fullname" . }}
  labels:
    {{- include "go-echoe7c568f7-6343-4b67-9207-b75b95cdbcc2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe7c568f7-6343-4b67-9207-b75b95cdbcc2.selectorLabels" . | nindent 6 }}
