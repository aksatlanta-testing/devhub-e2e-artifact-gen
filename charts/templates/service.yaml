apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc93264c0-ef3a-463d-9e3f-e360832fae8d.fullname" . }}
  labels:
    {{- include "go-echoc93264c0-ef3a-463d-9e3f-e360832fae8d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc93264c0-ef3a-463d-9e3f-e360832fae8d.selectorLabels" . | nindent 6 }}
