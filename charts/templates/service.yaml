apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob19b2812-e0cb-442d-b500-8af46511ca28.fullname" . }}
  labels:
    {{- include "go-echob19b2812-e0cb-442d-b500-8af46511ca28.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob19b2812-e0cb-442d-b500-8af46511ca28.selectorLabels" . | nindent 6 }}
