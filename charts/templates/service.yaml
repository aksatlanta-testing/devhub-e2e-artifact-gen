apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo99ac2372-6e76-4e8d-a132-91bf60dcf49d.fullname" . }}
  labels:
    {{- include "go-echo99ac2372-6e76-4e8d-a132-91bf60dcf49d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo99ac2372-6e76-4e8d-a132-91bf60dcf49d.selectorLabels" . | nindent 6 }}
