apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6a36f976-62aa-4967-8711-92103221e87d.fullname" . }}
  labels:
    {{- include "go-echo6a36f976-62aa-4967-8711-92103221e87d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6a36f976-62aa-4967-8711-92103221e87d.selectorLabels" . | nindent 6 }}
