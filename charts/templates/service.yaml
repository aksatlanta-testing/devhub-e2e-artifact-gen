apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc62db650-4e68-48a5-84a0-dc8f4db404ca.fullname" . }}
  labels:
    {{- include "go-echoc62db650-4e68-48a5-84a0-dc8f4db404ca.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc62db650-4e68-48a5-84a0-dc8f4db404ca.selectorLabels" . | nindent 6 }}
