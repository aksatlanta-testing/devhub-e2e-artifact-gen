apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodf9b657a-e5d8-468b-8356-b137e8b2e108.fullname" . }}
  labels:
    {{- include "go-echodf9b657a-e5d8-468b-8356-b137e8b2e108.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodf9b657a-e5d8-468b-8356-b137e8b2e108.selectorLabels" . | nindent 6 }}
