apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo35817df6-1167-480c-82f8-57e499d5916d.fullname" . }}
  labels:
    {{- include "go-echo35817df6-1167-480c-82f8-57e499d5916d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo35817df6-1167-480c-82f8-57e499d5916d.selectorLabels" . | nindent 6 }}
