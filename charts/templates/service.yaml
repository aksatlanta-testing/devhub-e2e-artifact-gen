apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo269990ee-645d-4a91-9c3e-e3bf6d64054e.fullname" . }}
  labels:
    {{- include "go-echo269990ee-645d-4a91-9c3e-e3bf6d64054e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo269990ee-645d-4a91-9c3e-e3bf6d64054e.selectorLabels" . | nindent 6 }}
