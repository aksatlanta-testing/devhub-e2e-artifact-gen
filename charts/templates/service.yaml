apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa4958a21-0e57-4431-b6a5-419db3cedafb.fullname" . }}
  labels:
    {{- include "go-echoa4958a21-0e57-4431-b6a5-419db3cedafb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa4958a21-0e57-4431-b6a5-419db3cedafb.selectorLabels" . | nindent 6 }}
