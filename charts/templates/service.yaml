apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo558bd6f9-8166-4d02-8611-cf200d60a822.fullname" . }}
  labels:
    {{- include "go-echo558bd6f9-8166-4d02-8611-cf200d60a822.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo558bd6f9-8166-4d02-8611-cf200d60a822.selectorLabels" . | nindent 6 }}
