apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo96700a59-e432-48db-8c9e-750bb558a393.fullname" . }}
  labels:
    {{- include "go-echo96700a59-e432-48db-8c9e-750bb558a393.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo96700a59-e432-48db-8c9e-750bb558a393.selectorLabels" . | nindent 6 }}
