apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocf297584-1b90-4e4c-9c4c-5a75067281cf.fullname" . }}
  labels:
    {{- include "go-echocf297584-1b90-4e4c-9c4c-5a75067281cf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocf297584-1b90-4e4c-9c4c-5a75067281cf.selectorLabels" . | nindent 6 }}
