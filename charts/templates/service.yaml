apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob1deed80-47d6-42e1-aff8-d5c68c3e2e1f.fullname" . }}
  labels:
    {{- include "go-echob1deed80-47d6-42e1-aff8-d5c68c3e2e1f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob1deed80-47d6-42e1-aff8-d5c68c3e2e1f.selectorLabels" . | nindent 6 }}
