apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod41ccba8-acbb-4154-a004-a48df0d8ff0a.fullname" . }}
  labels:
    {{- include "go-echod41ccba8-acbb-4154-a004-a48df0d8ff0a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod41ccba8-acbb-4154-a004-a48df0d8ff0a.selectorLabels" . | nindent 6 }}
