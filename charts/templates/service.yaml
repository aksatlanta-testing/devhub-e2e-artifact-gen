apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocbfa2b7e-6e46-43b9-b059-ac10d3acf589.fullname" . }}
  labels:
    {{- include "go-echocbfa2b7e-6e46-43b9-b059-ac10d3acf589.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocbfa2b7e-6e46-43b9-b059-ac10d3acf589.selectorLabels" . | nindent 6 }}
