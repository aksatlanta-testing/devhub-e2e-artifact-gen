apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7c486d04-04fd-49a8-9594-613a66b6ddac.fullname" . }}
  labels:
    {{- include "go-echo7c486d04-04fd-49a8-9594-613a66b6ddac.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7c486d04-04fd-49a8-9594-613a66b6ddac.selectorLabels" . | nindent 6 }}
