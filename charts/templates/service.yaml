apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob02f5749-d529-4161-b5fb-28dc6a35293a.fullname" . }}
  labels:
    {{- include "go-echob02f5749-d529-4161-b5fb-28dc6a35293a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob02f5749-d529-4161-b5fb-28dc6a35293a.selectorLabels" . | nindent 6 }}
