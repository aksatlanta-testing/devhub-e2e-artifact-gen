apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo06a35782-9e88-46bb-b993-4b9df4fc577d.fullname" . }}
  labels:
    {{- include "go-echo06a35782-9e88-46bb-b993-4b9df4fc577d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo06a35782-9e88-46bb-b993-4b9df4fc577d.selectorLabels" . | nindent 6 }}
