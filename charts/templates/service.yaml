apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1f5a48db-2193-413b-a01f-4152b4f23eeb.fullname" . }}
  labels:
    {{- include "go-echo1f5a48db-2193-413b-a01f-4152b4f23eeb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1f5a48db-2193-413b-a01f-4152b4f23eeb.selectorLabels" . | nindent 6 }}
