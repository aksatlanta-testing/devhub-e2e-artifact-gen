apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa64c8e1f-2e57-41b2-9c18-b55cc9fc88f3.fullname" . }}
  labels:
    {{- include "go-echoa64c8e1f-2e57-41b2-9c18-b55cc9fc88f3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa64c8e1f-2e57-41b2-9c18-b55cc9fc88f3.selectorLabels" . | nindent 6 }}
