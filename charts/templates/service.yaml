apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo17e87e7b-d081-41f8-b921-bc21b168c2c5.fullname" . }}
  labels:
    {{- include "go-echo17e87e7b-d081-41f8-b921-bc21b168c2c5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo17e87e7b-d081-41f8-b921-bc21b168c2c5.selectorLabels" . | nindent 6 }}
