apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof0562431-7446-494c-a6f6-febbdc6dcc20.fullname" . }}
  labels:
    {{- include "go-echof0562431-7446-494c-a6f6-febbdc6dcc20.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof0562431-7446-494c-a6f6-febbdc6dcc20.selectorLabels" . | nindent 6 }}
