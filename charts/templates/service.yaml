apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo119577f2-715c-45f7-a396-c5a23bfd4795.fullname" . }}
  labels:
    {{- include "go-echo119577f2-715c-45f7-a396-c5a23bfd4795.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo119577f2-715c-45f7-a396-c5a23bfd4795.selectorLabels" . | nindent 6 }}
