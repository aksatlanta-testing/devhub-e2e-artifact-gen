apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob42bc339-4b40-4726-a744-69d6c22aa677.fullname" . }}
  labels:
    {{- include "go-echob42bc339-4b40-4726-a744-69d6c22aa677.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob42bc339-4b40-4726-a744-69d6c22aa677.selectorLabels" . | nindent 6 }}
