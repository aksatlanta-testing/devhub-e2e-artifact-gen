apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5abc985b-7dc6-45f3-a9e1-68951e4c39d7.fullname" . }}
  labels:
    {{- include "go-echo5abc985b-7dc6-45f3-a9e1-68951e4c39d7.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5abc985b-7dc6-45f3-a9e1-68951e4c39d7.selectorLabels" . | nindent 6 }}
