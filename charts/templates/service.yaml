apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofc851c97-bb3f-49a3-9c1a-a25d2e815095.fullname" . }}
  labels:
    {{- include "go-echofc851c97-bb3f-49a3-9c1a-a25d2e815095.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofc851c97-bb3f-49a3-9c1a-a25d2e815095.selectorLabels" . | nindent 6 }}
