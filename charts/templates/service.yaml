apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof7e43323-1a01-40ce-8293-9c33a76513b9.fullname" . }}
  labels:
    {{- include "go-echof7e43323-1a01-40ce-8293-9c33a76513b9.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof7e43323-1a01-40ce-8293-9c33a76513b9.selectorLabels" . | nindent 6 }}
