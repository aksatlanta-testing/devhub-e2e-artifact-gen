apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoda30c3ba-e8e9-40ee-bf30-75becbc6a355.fullname" . }}
  labels:
    {{- include "go-echoda30c3ba-e8e9-40ee-bf30-75becbc6a355.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoda30c3ba-e8e9-40ee-bf30-75becbc6a355.selectorLabels" . | nindent 6 }}
