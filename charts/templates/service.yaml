apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1e4840a6-8e05-40df-86e2-ba5426836993.fullname" . }}
  labels:
    {{- include "go-echo1e4840a6-8e05-40df-86e2-ba5426836993.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1e4840a6-8e05-40df-86e2-ba5426836993.selectorLabels" . | nindent 6 }}
