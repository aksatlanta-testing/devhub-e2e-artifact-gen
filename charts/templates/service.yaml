apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8b6c9283-1e2f-4759-b027-0e2c82b14cdd.fullname" . }}
  labels:
    {{- include "go-echo8b6c9283-1e2f-4759-b027-0e2c82b14cdd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8b6c9283-1e2f-4759-b027-0e2c82b14cdd.selectorLabels" . | nindent 6 }}
