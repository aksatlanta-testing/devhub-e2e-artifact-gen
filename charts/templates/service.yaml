apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocab19dbc-f85e-4459-8075-a730fd9da2f0.fullname" . }}
  labels:
    {{- include "go-echocab19dbc-f85e-4459-8075-a730fd9da2f0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocab19dbc-f85e-4459-8075-a730fd9da2f0.selectorLabels" . | nindent 6 }}
