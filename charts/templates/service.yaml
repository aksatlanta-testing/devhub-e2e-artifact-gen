apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7f9534e4-4070-48c8-8806-565007868a74.fullname" . }}
  labels:
    {{- include "go-echo7f9534e4-4070-48c8-8806-565007868a74.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
