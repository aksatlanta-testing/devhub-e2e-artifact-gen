apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo99040236-c0e1-450a-9a9a-dcbd16903b17.fullname" . }}
  labels:
    {{- include "go-echo99040236-c0e1-450a-9a9a-dcbd16903b17.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo99040236-c0e1-450a-9a9a-dcbd16903b17.selectorLabels" . | nindent 6 }}
