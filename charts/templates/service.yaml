apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobc7576fa-61f5-4ab9-8c16-d6e9188ecee4.fullname" . }}
  labels:
    {{- include "go-echobc7576fa-61f5-4ab9-8c16-d6e9188ecee4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobc7576fa-61f5-4ab9-8c16-d6e9188ecee4.selectorLabels" . | nindent 6 }}
