apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo91cb4511-da32-4cac-b32a-ec86be1472fd.fullname" . }}
  labels:
    {{- include "go-echo91cb4511-da32-4cac-b32a-ec86be1472fd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo91cb4511-da32-4cac-b32a-ec86be1472fd.selectorLabels" . | nindent 6 }}
