apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo310e4476-cca3-455b-bf54-6685e1ac4e1c.fullname" . }}
  labels:
    {{- include "go-echo310e4476-cca3-455b-bf54-6685e1ac4e1c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo310e4476-cca3-455b-bf54-6685e1ac4e1c.selectorLabels" . | nindent 6 }}
