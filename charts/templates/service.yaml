apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo79aa3064-9a40-4b93-bf5c-d0401999fa2c.fullname" . }}
  labels:
    {{- include "go-echo79aa3064-9a40-4b93-bf5c-d0401999fa2c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo79aa3064-9a40-4b93-bf5c-d0401999fa2c.selectorLabels" . | nindent 6 }}
