apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodd918db1-c3ad-4476-9f45-8e5928cd53f8.fullname" . }}
  labels:
    {{- include "go-echodd918db1-c3ad-4476-9f45-8e5928cd53f8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodd918db1-c3ad-4476-9f45-8e5928cd53f8.selectorLabels" . | nindent 6 }}
