apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodcac7e1c-851f-4c3d-8b2d-a33d677e06a1.fullname" . }}
  labels:
    {{- include "go-echodcac7e1c-851f-4c3d-8b2d-a33d677e06a1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodcac7e1c-851f-4c3d-8b2d-a33d677e06a1.selectorLabels" . | nindent 6 }}
