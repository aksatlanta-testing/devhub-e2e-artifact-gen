apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc3503ef7-b014-4a99-a74d-1b5d00e04087.fullname" . }}
  labels:
    {{- include "go-echoc3503ef7-b014-4a99-a74d-1b5d00e04087.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc3503ef7-b014-4a99-a74d-1b5d00e04087.selectorLabels" . | nindent 6 }}
