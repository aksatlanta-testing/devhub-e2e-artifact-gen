apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodd3f59c5-ca72-41a4-af3e-5ef929e3bf33.fullname" . }}
  labels:
    {{- include "go-echodd3f59c5-ca72-41a4-af3e-5ef929e3bf33.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodd3f59c5-ca72-41a4-af3e-5ef929e3bf33.selectorLabels" . | nindent 6 }}
