apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6285b7fd-3570-460b-bc92-8644378d3650.fullname" . }}
  labels:
    {{- include "go-echo6285b7fd-3570-460b-bc92-8644378d3650.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6285b7fd-3570-460b-bc92-8644378d3650.selectorLabels" . | nindent 6 }}
