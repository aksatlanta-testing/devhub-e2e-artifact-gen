apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob4263a36-ff37-4e3e-b080-2db73cb2cd11.fullname" . }}
  labels:
    {{- include "go-echob4263a36-ff37-4e3e-b080-2db73cb2cd11.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob4263a36-ff37-4e3e-b080-2db73cb2cd11.selectorLabels" . | nindent 6 }}
