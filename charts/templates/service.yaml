apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo118dfc66-d041-4080-9ee1-b29b02a9e58c.fullname" . }}
  labels:
    {{- include "go-echo118dfc66-d041-4080-9ee1-b29b02a9e58c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo118dfc66-d041-4080-9ee1-b29b02a9e58c.selectorLabels" . | nindent 6 }}
