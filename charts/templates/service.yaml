apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8b44b106-1499-4a57-ba20-65afbfd5956c.fullname" . }}
  labels:
    {{- include "go-echo8b44b106-1499-4a57-ba20-65afbfd5956c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8b44b106-1499-4a57-ba20-65afbfd5956c.selectorLabels" . | nindent 6 }}
