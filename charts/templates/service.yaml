apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo322c1627-045b-452d-92b3-2c527e766e28.fullname" . }}
  labels:
    {{- include "go-echo322c1627-045b-452d-92b3-2c527e766e28.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo322c1627-045b-452d-92b3-2c527e766e28.selectorLabels" . | nindent 6 }}
