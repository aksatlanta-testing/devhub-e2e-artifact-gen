apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo08995ba5-1463-485a-ab2e-33300ea64f56.fullname" . }}
  labels:
    {{- include "go-echo08995ba5-1463-485a-ab2e-33300ea64f56.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo08995ba5-1463-485a-ab2e-33300ea64f56.selectorLabels" . | nindent 6 }}
