apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa35956f6-575d-407a-afcd-846eb1c4e71e.fullname" . }}
  labels:
    {{- include "go-echoa35956f6-575d-407a-afcd-846eb1c4e71e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa35956f6-575d-407a-afcd-846eb1c4e71e.selectorLabels" . | nindent 6 }}
