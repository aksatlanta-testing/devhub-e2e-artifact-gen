apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2c693ac8-43bc-416f-8607-4ef69ff58093.fullname" . }}
  labels:
    {{- include "go-echo2c693ac8-43bc-416f-8607-4ef69ff58093.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2c693ac8-43bc-416f-8607-4ef69ff58093.selectorLabels" . | nindent 6 }}
