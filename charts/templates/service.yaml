apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof133abe5-f073-4a72-952b-e6d77c0c2157.fullname" . }}
  labels:
    {{- include "go-echof133abe5-f073-4a72-952b-e6d77c0c2157.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof133abe5-f073-4a72-952b-e6d77c0c2157.selectorLabels" . | nindent 6 }}
