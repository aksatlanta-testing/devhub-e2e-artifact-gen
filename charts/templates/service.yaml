apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo97b6a54a-8a55-48b8-95f2-1538bd655544.fullname" . }}
  labels:
    {{- include "go-echo97b6a54a-8a55-48b8-95f2-1538bd655544.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo97b6a54a-8a55-48b8-95f2-1538bd655544.selectorLabels" . | nindent 6 }}
