apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc938505c-ccf8-4610-a2b8-36a9324a2873.fullname" . }}
  labels:
    {{- include "go-echoc938505c-ccf8-4610-a2b8-36a9324a2873.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc938505c-ccf8-4610-a2b8-36a9324a2873.selectorLabels" . | nindent 6 }}
