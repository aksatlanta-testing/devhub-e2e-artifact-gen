apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc19303de-5599-4936-8d85-ba39427aba34.fullname" . }}
  labels:
    {{- include "go-echoc19303de-5599-4936-8d85-ba39427aba34.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc19303de-5599-4936-8d85-ba39427aba34.selectorLabels" . | nindent 6 }}
