apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo51b1b80f-1fb5-4e8e-b0ad-e8c84e54a5f8.fullname" . }}
  labels:
    {{- include "go-echo51b1b80f-1fb5-4e8e-b0ad-e8c84e54a5f8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo51b1b80f-1fb5-4e8e-b0ad-e8c84e54a5f8.selectorLabels" . | nindent 6 }}
