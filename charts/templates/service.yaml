apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5008e96a-bfa8-46b9-84b3-f8fccbd93356.fullname" . }}
  labels:
    {{- include "go-echo5008e96a-bfa8-46b9-84b3-f8fccbd93356.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5008e96a-bfa8-46b9-84b3-f8fccbd93356.selectorLabels" . | nindent 6 }}
