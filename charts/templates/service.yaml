apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo020d634b-fa18-4260-b851-be0bd00693fa.fullname" . }}
  labels:
    {{- include "go-echo020d634b-fa18-4260-b851-be0bd00693fa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo020d634b-fa18-4260-b851-be0bd00693fa.selectorLabels" . | nindent 6 }}
