apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo842c5734-80b8-4c91-ae7b-c354899d2948.fullname" . }}
  labels:
    {{- include "go-echo842c5734-80b8-4c91-ae7b-c354899d2948.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo842c5734-80b8-4c91-ae7b-c354899d2948.selectorLabels" . | nindent 6 }}
