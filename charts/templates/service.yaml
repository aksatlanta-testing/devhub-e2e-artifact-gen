apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3d886529-0cd6-4ef9-abc6-e130912382bb.fullname" . }}
  labels:
    {{- include "go-echo3d886529-0cd6-4ef9-abc6-e130912382bb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3d886529-0cd6-4ef9-abc6-e130912382bb.selectorLabels" . | nindent 6 }}
