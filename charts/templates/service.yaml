apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6fb6fa1d-f1c8-43d9-8aa9-27196766982f.fullname" . }}
  labels:
    {{- include "go-echo6fb6fa1d-f1c8-43d9-8aa9-27196766982f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6fb6fa1d-f1c8-43d9-8aa9-27196766982f.selectorLabels" . | nindent 6 }}
