apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoced0fb2d-fb4b-4ed3-9125-e79f4371997a.fullname" . }}
  labels:
    {{- include "go-echoced0fb2d-fb4b-4ed3-9125-e79f4371997a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoced0fb2d-fb4b-4ed3-9125-e79f4371997a.selectorLabels" . | nindent 6 }}
