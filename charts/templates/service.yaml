apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo92f5db56-6559-4da3-ad31-c324b9bf9ce1.fullname" . }}
  labels:
    {{- include "go-echo92f5db56-6559-4da3-ad31-c324b9bf9ce1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo92f5db56-6559-4da3-ad31-c324b9bf9ce1.selectorLabels" . | nindent 6 }}
