apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8658742d-b2fe-41ea-8ff1-4e36665d3a88.fullname" . }}
  labels:
    {{- include "go-echo8658742d-b2fe-41ea-8ff1-4e36665d3a88.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8658742d-b2fe-41ea-8ff1-4e36665d3a88.selectorLabels" . | nindent 6 }}
