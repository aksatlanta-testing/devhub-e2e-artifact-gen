apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2eca0d46-73f3-481d-bc19-29419262e7f4.fullname" . }}
  labels:
    {{- include "go-echo2eca0d46-73f3-481d-bc19-29419262e7f4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2eca0d46-73f3-481d-bc19-29419262e7f4.selectorLabels" . | nindent 6 }}
