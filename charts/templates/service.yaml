apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo79f2d4f0-c7ce-44f3-abd7-a13e4df64a95.fullname" . }}
  labels:
    {{- include "go-echo79f2d4f0-c7ce-44f3-abd7-a13e4df64a95.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo79f2d4f0-c7ce-44f3-abd7-a13e4df64a95.selectorLabels" . | nindent 6 }}
