apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofe2e7bfd-ee02-4c06-b182-1e3cc46d6d46.fullname" . }}
  labels:
    {{- include "go-echofe2e7bfd-ee02-4c06-b182-1e3cc46d6d46.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofe2e7bfd-ee02-4c06-b182-1e3cc46d6d46.selectorLabels" . | nindent 6 }}
