apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa36b955a-5c1d-4cac-9425-5ef599270493.fullname" . }}
  labels:
    {{- include "go-echoa36b955a-5c1d-4cac-9425-5ef599270493.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa36b955a-5c1d-4cac-9425-5ef599270493.selectorLabels" . | nindent 6 }}
