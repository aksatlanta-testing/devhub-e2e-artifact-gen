apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc2666964-0010-44a2-9f10-ca15f5059430.fullname" . }}
  labels:
    {{- include "go-echoc2666964-0010-44a2-9f10-ca15f5059430.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc2666964-0010-44a2-9f10-ca15f5059430.selectorLabels" . | nindent 6 }}
