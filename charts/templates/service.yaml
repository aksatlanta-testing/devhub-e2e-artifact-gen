apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9ea9c46b-e6b0-41cf-9709-a726457ad172.fullname" . }}
  labels:
    {{- include "go-echo9ea9c46b-e6b0-41cf-9709-a726457ad172.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9ea9c46b-e6b0-41cf-9709-a726457ad172.selectorLabels" . | nindent 6 }}
