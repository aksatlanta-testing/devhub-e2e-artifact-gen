apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3c3ca206-f97f-4ee7-bcf6-bab01b562194.fullname" . }}
  labels:
    {{- include "go-echo3c3ca206-f97f-4ee7-bcf6-bab01b562194.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3c3ca206-f97f-4ee7-bcf6-bab01b562194.selectorLabels" . | nindent 6 }}
