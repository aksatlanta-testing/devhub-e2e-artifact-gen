apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0d95cc7d-65b3-483f-9de7-bcc5d7be7abf.fullname" . }}
  labels:
    {{- include "go-echo0d95cc7d-65b3-483f-9de7-bcc5d7be7abf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0d95cc7d-65b3-483f-9de7-bcc5d7be7abf.selectorLabels" . | nindent 6 }}
