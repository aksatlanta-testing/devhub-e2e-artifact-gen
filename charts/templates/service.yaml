apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8073a52c-c21e-4d1c-b309-93cf4f97fa93.fullname" . }}
  labels:
    {{- include "go-echo8073a52c-c21e-4d1c-b309-93cf4f97fa93.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8073a52c-c21e-4d1c-b309-93cf4f97fa93.selectorLabels" . | nindent 6 }}
