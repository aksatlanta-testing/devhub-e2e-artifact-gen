apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5ce9dfe6-f385-42db-8ae0-7956b56cf565.fullname" . }}
  labels:
    {{- include "go-echo5ce9dfe6-f385-42db-8ae0-7956b56cf565.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5ce9dfe6-f385-42db-8ae0-7956b56cf565.selectorLabels" . | nindent 6 }}
