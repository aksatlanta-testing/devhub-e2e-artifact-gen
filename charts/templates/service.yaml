apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobf6e640a-d243-44b6-a8b8-d64756bef5cb.fullname" . }}
  labels:
    {{- include "go-echobf6e640a-d243-44b6-a8b8-d64756bef5cb.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobf6e640a-d243-44b6-a8b8-d64756bef5cb.selectorLabels" . | nindent 6 }}
