apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6b64fe70-e716-4bc9-8e53-c4df1db88676.fullname" . }}
  labels:
    {{- include "go-echo6b64fe70-e716-4bc9-8e53-c4df1db88676.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6b64fe70-e716-4bc9-8e53-c4df1db88676.selectorLabels" . | nindent 6 }}
