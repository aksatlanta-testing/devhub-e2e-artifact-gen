apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo314b9857-3116-4baf-bdb4-839e98907b15.fullname" . }}
  labels:
    {{- include "go-echo314b9857-3116-4baf-bdb4-839e98907b15.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo314b9857-3116-4baf-bdb4-839e98907b15.selectorLabels" . | nindent 6 }}
