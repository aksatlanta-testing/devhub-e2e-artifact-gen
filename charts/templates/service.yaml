apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo24e28325-fc2a-42d1-9715-297106b9b874.fullname" . }}
  labels:
    {{- include "go-echo24e28325-fc2a-42d1-9715-297106b9b874.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo24e28325-fc2a-42d1-9715-297106b9b874.selectorLabels" . | nindent 6 }}
