apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1b1a5765-c536-4e40-9fe8-ca7fdf83fc03.fullname" . }}
  labels:
    {{- include "go-echo1b1a5765-c536-4e40-9fe8-ca7fdf83fc03.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1b1a5765-c536-4e40-9fe8-ca7fdf83fc03.selectorLabels" . | nindent 6 }}
