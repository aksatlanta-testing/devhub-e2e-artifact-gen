apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo77f84823-23b0-4d4c-9dca-8b44cff97100.fullname" . }}
  labels:
    {{- include "go-echo77f84823-23b0-4d4c-9dca-8b44cff97100.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo77f84823-23b0-4d4c-9dca-8b44cff97100.selectorLabels" . | nindent 6 }}
