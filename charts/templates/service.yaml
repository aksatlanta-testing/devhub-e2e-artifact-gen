apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob0e636a2-d53c-4899-b546-b2e3d3ab5d6b.fullname" . }}
  labels:
    {{- include "go-echob0e636a2-d53c-4899-b546-b2e3d3ab5d6b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob0e636a2-d53c-4899-b546-b2e3d3ab5d6b.selectorLabels" . | nindent 6 }}
