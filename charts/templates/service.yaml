apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof05acb5d-8e36-4865-885d-e372202e7fb8.fullname" . }}
  labels:
    {{- include "go-echof05acb5d-8e36-4865-885d-e372202e7fb8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof05acb5d-8e36-4865-885d-e372202e7fb8.selectorLabels" . | nindent 6 }}
