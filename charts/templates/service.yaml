apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7abe6dcb-b88d-482b-82cb-4348cea44a17.fullname" . }}
  labels:
    {{- include "go-echo7abe6dcb-b88d-482b-82cb-4348cea44a17.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7abe6dcb-b88d-482b-82cb-4348cea44a17.selectorLabels" . | nindent 6 }}
