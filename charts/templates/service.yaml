apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0d5927ce-af70-4b20-9a5a-5dc554cbc5a4.fullname" . }}
  labels:
    {{- include "go-echo0d5927ce-af70-4b20-9a5a-5dc554cbc5a4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0d5927ce-af70-4b20-9a5a-5dc554cbc5a4.selectorLabels" . | nindent 6 }}
