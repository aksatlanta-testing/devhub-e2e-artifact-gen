apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa2601be7-47d5-4179-96c0-f065a62f0fd5.fullname" . }}
  labels:
    {{- include "go-echoa2601be7-47d5-4179-96c0-f065a62f0fd5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa2601be7-47d5-4179-96c0-f065a62f0fd5.selectorLabels" . | nindent 6 }}
