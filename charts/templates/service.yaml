apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocbdff05b-61cc-46f6-b933-ee45381d19dd.fullname" . }}
  labels:
    {{- include "go-echocbdff05b-61cc-46f6-b933-ee45381d19dd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocbdff05b-61cc-46f6-b933-ee45381d19dd.selectorLabels" . | nindent 6 }}
