apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo83285d01-3879-44ff-aa57-0526ab71a0b4.fullname" . }}
  labels:
    {{- include "go-echo83285d01-3879-44ff-aa57-0526ab71a0b4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo83285d01-3879-44ff-aa57-0526ab71a0b4.selectorLabels" . | nindent 6 }}
