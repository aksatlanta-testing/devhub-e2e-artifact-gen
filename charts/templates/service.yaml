apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoefd9ae2a-e024-4ffe-b9c7-f40118dd7df4.fullname" . }}
  labels:
    {{- include "go-echoefd9ae2a-e024-4ffe-b9c7-f40118dd7df4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoefd9ae2a-e024-4ffe-b9c7-f40118dd7df4.selectorLabels" . | nindent 6 }}
