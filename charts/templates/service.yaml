apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo83791400-e64f-4e41-aa5f-4bdbec348fda.fullname" . }}
  labels:
    {{- include "go-echo83791400-e64f-4e41-aa5f-4bdbec348fda.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo83791400-e64f-4e41-aa5f-4bdbec348fda.selectorLabels" . | nindent 6 }}
