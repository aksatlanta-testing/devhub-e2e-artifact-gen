apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4b86cc62-0168-4dfa-918f-bb198448110a.fullname" . }}
  labels:
    {{- include "go-echo4b86cc62-0168-4dfa-918f-bb198448110a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
