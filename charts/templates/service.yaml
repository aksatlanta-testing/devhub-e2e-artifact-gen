apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobbb563e6-3497-4af0-912a-d1f1521ffe0a.fullname" . }}
  labels:
    {{- include "go-echobbb563e6-3497-4af0-912a-d1f1521ffe0a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobbb563e6-3497-4af0-912a-d1f1521ffe0a.selectorLabels" . | nindent 6 }}
