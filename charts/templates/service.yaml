apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe86ef8da-ef66-40cc-a8e6-5b99d190b00b.fullname" . }}
  labels:
    {{- include "go-echoe86ef8da-ef66-40cc-a8e6-5b99d190b00b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe86ef8da-ef66-40cc-a8e6-5b99d190b00b.selectorLabels" . | nindent 6 }}
