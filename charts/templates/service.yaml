apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8ebbdbd9-2d55-4abf-9ad8-b4fae5e902d5.fullname" . }}
  labels:
    {{- include "go-echo8ebbdbd9-2d55-4abf-9ad8-b4fae5e902d5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8ebbdbd9-2d55-4abf-9ad8-b4fae5e902d5.selectorLabels" . | nindent 6 }}
