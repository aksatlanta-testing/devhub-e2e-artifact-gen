apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe40a1236-eb8a-4793-90f1-fb9d55d6ba54.fullname" . }}
  labels:
    {{- include "go-echoe40a1236-eb8a-4793-90f1-fb9d55d6ba54.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe40a1236-eb8a-4793-90f1-fb9d55d6ba54.selectorLabels" . | nindent 6 }}
