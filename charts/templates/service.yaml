apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo21833caf-8aad-4b2e-b20f-b11565b55b2d.fullname" . }}
  labels:
    {{- include "go-echo21833caf-8aad-4b2e-b20f-b11565b55b2d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo21833caf-8aad-4b2e-b20f-b11565b55b2d.selectorLabels" . | nindent 6 }}
