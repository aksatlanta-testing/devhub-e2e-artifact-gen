apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof1409c8b-e8e4-4f80-996a-3849e7087a00.fullname" . }}
  labels:
    {{- include "go-echof1409c8b-e8e4-4f80-996a-3849e7087a00.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof1409c8b-e8e4-4f80-996a-3849e7087a00.selectorLabels" . | nindent 6 }}
