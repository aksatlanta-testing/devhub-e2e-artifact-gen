apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo29782d2c-f0d4-4685-9710-e7df2f703da9.fullname" . }}
  labels:
    {{- include "go-echo29782d2c-f0d4-4685-9710-e7df2f703da9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo29782d2c-f0d4-4685-9710-e7df2f703da9.selectorLabels" . | nindent 6 }}
