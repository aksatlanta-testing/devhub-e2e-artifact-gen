apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0ff37e91-5e6d-4585-b58b-c5d2d654c4cf.fullname" . }}
  labels:
    {{- include "go-echo0ff37e91-5e6d-4585-b58b-c5d2d654c4cf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0ff37e91-5e6d-4585-b58b-c5d2d654c4cf.selectorLabels" . | nindent 6 }}
