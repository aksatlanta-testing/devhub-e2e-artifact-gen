apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4fb67cd1-6a06-42c1-a7a7-3b422d8782f1.fullname" . }}
  labels:
    {{- include "go-echo4fb67cd1-6a06-42c1-a7a7-3b422d8782f1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4fb67cd1-6a06-42c1-a7a7-3b422d8782f1.selectorLabels" . | nindent 6 }}
