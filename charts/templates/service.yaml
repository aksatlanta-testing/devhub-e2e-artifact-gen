apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2cff9604-99ad-452a-91b5-49234fcd0da4.fullname" . }}
  labels:
    {{- include "go-echo2cff9604-99ad-452a-91b5-49234fcd0da4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2cff9604-99ad-452a-91b5-49234fcd0da4.selectorLabels" . | nindent 6 }}
