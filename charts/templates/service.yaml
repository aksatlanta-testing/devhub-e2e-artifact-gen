apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo77745825-5b89-4d8f-b7de-840d8de196a3.fullname" . }}
  labels:
    {{- include "go-echo77745825-5b89-4d8f-b7de-840d8de196a3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo77745825-5b89-4d8f-b7de-840d8de196a3.selectorLabels" . | nindent 6 }}
