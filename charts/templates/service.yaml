apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo497232f1-1bd7-4c0c-b22d-69f2a7a3891a.fullname" . }}
  labels:
    {{- include "go-echo497232f1-1bd7-4c0c-b22d-69f2a7a3891a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: devhub
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo497232f1-1bd7-4c0c-b22d-69f2a7a3891a.selectorLabels" . | nindent 4 }}
