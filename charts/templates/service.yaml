apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo301b665f-7304-4cb6-b2d1-e985fc69a619.fullname" . }}
  labels:
    {{- include "go-echo301b665f-7304-4cb6-b2d1-e985fc69a619.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo301b665f-7304-4cb6-b2d1-e985fc69a619.selectorLabels" . | nindent 6 }}
