apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9b4f014f-6e8a-4b65-8c43-87ea1a5026b4.fullname" . }}
  labels:
    {{- include "go-echo9b4f014f-6e8a-4b65-8c43-87ea1a5026b4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9b4f014f-6e8a-4b65-8c43-87ea1a5026b4.selectorLabels" . | nindent 6 }}
