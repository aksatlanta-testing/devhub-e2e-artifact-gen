apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod7484196-d6e5-4bdc-a7b7-0039c9cb79c6.fullname" . }}
  labels:
    {{- include "go-echod7484196-d6e5-4bdc-a7b7-0039c9cb79c6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod7484196-d6e5-4bdc-a7b7-0039c9cb79c6.selectorLabels" . | nindent 6 }}
