apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoff058fdf-cabb-4b5f-831c-c06013f35b26.fullname" . }}
  labels:
    {{- include "go-echoff058fdf-cabb-4b5f-831c-c06013f35b26.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoff058fdf-cabb-4b5f-831c-c06013f35b26.selectorLabels" . | nindent 6 }}
