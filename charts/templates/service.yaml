apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod2a8eb5e-a922-4703-93c0-adb5fe72aa42.fullname" . }}
  labels:
    {{- include "go-echod2a8eb5e-a922-4703-93c0-adb5fe72aa42.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod2a8eb5e-a922-4703-93c0-adb5fe72aa42.selectorLabels" . | nindent 6 }}
