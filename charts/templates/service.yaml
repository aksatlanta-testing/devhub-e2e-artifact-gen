apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo665d4ff6-72d4-4e45-9112-f219aa8b7b97.fullname" . }}
  labels:
    {{- include "go-echo665d4ff6-72d4-4e45-9112-f219aa8b7b97.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo665d4ff6-72d4-4e45-9112-f219aa8b7b97.selectorLabels" . | nindent 6 }}
