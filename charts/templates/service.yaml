apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo079594d8-b35c-4f8e-9440-dfd2bb1d9832.fullname" . }}
  labels:
    {{- include "go-echo079594d8-b35c-4f8e-9440-dfd2bb1d9832.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo079594d8-b35c-4f8e-9440-dfd2bb1d9832.selectorLabels" . | nindent 6 }}
