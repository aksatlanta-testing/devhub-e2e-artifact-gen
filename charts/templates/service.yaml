apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4333b778-1cf7-4466-b5a2-5a290d1e7112.fullname" . }}
  labels:
    {{- include "go-echo4333b778-1cf7-4466-b5a2-5a290d1e7112.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4333b778-1cf7-4466-b5a2-5a290d1e7112.selectorLabels" . | nindent 6 }}
