apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe41f52b5-5603-442d-a996-d8c3e7522744.fullname" . }}
  labels:
    {{- include "go-echoe41f52b5-5603-442d-a996-d8c3e7522744.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe41f52b5-5603-442d-a996-d8c3e7522744.selectorLabels" . | nindent 6 }}
