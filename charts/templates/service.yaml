apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof92719ec-4441-40af-a583-a63e1e59d683.fullname" . }}
  labels:
    {{- include "go-echof92719ec-4441-40af-a583-a63e1e59d683.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof92719ec-4441-40af-a583-a63e1e59d683.selectorLabels" . | nindent 6 }}
