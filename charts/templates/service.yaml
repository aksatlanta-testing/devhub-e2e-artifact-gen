apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo78c9740d-c45e-4ade-b8b9-c97202f83357.fullname" . }}
  labels:
    {{- include "go-echo78c9740d-c45e-4ade-b8b9-c97202f83357.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo78c9740d-c45e-4ade-b8b9-c97202f83357.selectorLabels" . | nindent 6 }}
