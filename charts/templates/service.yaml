apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo250d9663-f685-48f4-a00b-2ccb5cdc5977.fullname" . }}
  labels:
    {{- include "go-echo250d9663-f685-48f4-a00b-2ccb5cdc5977.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo250d9663-f685-48f4-a00b-2ccb5cdc5977.selectorLabels" . | nindent 6 }}
