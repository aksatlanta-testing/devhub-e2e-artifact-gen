apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8c997b31-f316-40a3-bda1-8717df4787fc.fullname" . }}
  labels:
    {{- include "go-echo8c997b31-f316-40a3-bda1-8717df4787fc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8c997b31-f316-40a3-bda1-8717df4787fc.selectorLabels" . | nindent 6 }}
