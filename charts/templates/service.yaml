apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2029a82c-f75d-479b-9026-f6ee2346f47b.fullname" . }}
  labels:
    {{- include "go-echo2029a82c-f75d-479b-9026-f6ee2346f47b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2029a82c-f75d-479b-9026-f6ee2346f47b.selectorLabels" . | nindent 6 }}
