apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc5d8c692-440a-4d1f-8ed3-fe9b6274244a.fullname" . }}
  labels:
    {{- include "go-echoc5d8c692-440a-4d1f-8ed3-fe9b6274244a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc5d8c692-440a-4d1f-8ed3-fe9b6274244a.selectorLabels" . | nindent 6 }}
