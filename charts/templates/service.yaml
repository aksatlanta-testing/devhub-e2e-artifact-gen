apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1e6cce65-ead1-4792-8c64-273297c0ba69.fullname" . }}
  labels:
    {{- include "go-echo1e6cce65-ead1-4792-8c64-273297c0ba69.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1e6cce65-ead1-4792-8c64-273297c0ba69.selectorLabels" . | nindent 6 }}
