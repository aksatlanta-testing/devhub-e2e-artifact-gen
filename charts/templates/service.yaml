apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc1c41dca-ed94-4823-b792-9d0da04d6faf.fullname" . }}
  labels:
    {{- include "go-echoc1c41dca-ed94-4823-b792-9d0da04d6faf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc1c41dca-ed94-4823-b792-9d0da04d6faf.selectorLabels" . | nindent 6 }}
