apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo21165ea2-229a-49d7-84ef-b63e078c34b2.fullname" . }}
  labels:
    {{- include "go-echo21165ea2-229a-49d7-84ef-b63e078c34b2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo21165ea2-229a-49d7-84ef-b63e078c34b2.selectorLabels" . | nindent 6 }}
