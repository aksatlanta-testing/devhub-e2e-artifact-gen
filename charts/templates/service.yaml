apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3b9d7873-10f3-49ba-b553-0a0fdf2e52ee.fullname" . }}
  labels:
    {{- include "go-echo3b9d7873-10f3-49ba-b553-0a0fdf2e52ee.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3b9d7873-10f3-49ba-b553-0a0fdf2e52ee.selectorLabels" . | nindent 6 }}
