apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof68f90ef-f5b4-4f0a-b742-a69e61875730.fullname" . }}
  labels:
    {{- include "go-echof68f90ef-f5b4-4f0a-b742-a69e61875730.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof68f90ef-f5b4-4f0a-b742-a69e61875730.selectorLabels" . | nindent 6 }}
