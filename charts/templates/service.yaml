apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo051a6fe8-ef7a-483e-bec7-3b78b64605ca.fullname" . }}
  labels:
    {{- include "go-echo051a6fe8-ef7a-483e-bec7-3b78b64605ca.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo051a6fe8-ef7a-483e-bec7-3b78b64605ca.selectorLabels" . | nindent 6 }}
