apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe8acd75c-2fa5-4675-9486-4309fd0fa712.fullname" . }}
  labels:
    {{- include "go-echoe8acd75c-2fa5-4675-9486-4309fd0fa712.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe8acd75c-2fa5-4675-9486-4309fd0fa712.selectorLabels" . | nindent 6 }}
