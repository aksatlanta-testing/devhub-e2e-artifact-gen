apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2b0ea80b-0319-44e8-9488-a875c733f2fa.fullname" . }}
  labels:
    {{- include "go-echo2b0ea80b-0319-44e8-9488-a875c733f2fa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2b0ea80b-0319-44e8-9488-a875c733f2fa.selectorLabels" . | nindent 6 }}
