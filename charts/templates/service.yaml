apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9c129a51-e37d-4d9f-a9ef-f621275e85e2.fullname" . }}
  labels:
    {{- include "go-echo9c129a51-e37d-4d9f-a9ef-f621275e85e2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9c129a51-e37d-4d9f-a9ef-f621275e85e2.selectorLabels" . | nindent 6 }}
