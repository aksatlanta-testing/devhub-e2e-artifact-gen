apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobb5a0019-ee06-4bcd-a154-1f2a2a5bb97e.fullname" . }}
  labels:
    {{- include "go-echobb5a0019-ee06-4bcd-a154-1f2a2a5bb97e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobb5a0019-ee06-4bcd-a154-1f2a2a5bb97e.selectorLabels" . | nindent 6 }}
