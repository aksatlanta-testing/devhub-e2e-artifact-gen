apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc48d7ec0-7ff6-438f-955d-6828aff9a4e1.fullname" . }}
  labels:
    {{- include "go-echoc48d7ec0-7ff6-438f-955d-6828aff9a4e1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc48d7ec0-7ff6-438f-955d-6828aff9a4e1.selectorLabels" . | nindent 6 }}
