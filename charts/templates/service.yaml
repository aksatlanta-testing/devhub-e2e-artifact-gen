apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo34e52e1e-d741-4bb5-ab0b-9d76a785437c.fullname" . }}
  labels:
    {{- include "go-echo34e52e1e-d741-4bb5-ab0b-9d76a785437c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo34e52e1e-d741-4bb5-ab0b-9d76a785437c.selectorLabels" . | nindent 6 }}
