apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo85e7119b-2154-4b01-b1ca-21d21b4675be.fullname" . }}
  labels:
    {{- include "go-echo85e7119b-2154-4b01-b1ca-21d21b4675be.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo85e7119b-2154-4b01-b1ca-21d21b4675be.selectorLabels" . | nindent 6 }}
