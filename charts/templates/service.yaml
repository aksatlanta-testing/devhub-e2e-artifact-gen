apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6e5d546a-90ac-4049-acda-711acec66a2b.fullname" . }}
  labels:
    {{- include "go-echo6e5d546a-90ac-4049-acda-711acec66a2b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6e5d546a-90ac-4049-acda-711acec66a2b.selectorLabels" . | nindent 6 }}
