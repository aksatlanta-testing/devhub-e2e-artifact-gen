apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo308bb468-c4b2-4abc-90d7-43ce316a30ec.fullname" . }}
  labels:
    {{- include "go-echo308bb468-c4b2-4abc-90d7-43ce316a30ec.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo308bb468-c4b2-4abc-90d7-43ce316a30ec.selectorLabels" . | nindent 6 }}
