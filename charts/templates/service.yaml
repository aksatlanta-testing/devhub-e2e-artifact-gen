apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob2666613-7c5e-4b37-82a9-e062c6cbce99.fullname" . }}
  labels:
    {{- include "go-echob2666613-7c5e-4b37-82a9-e062c6cbce99.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob2666613-7c5e-4b37-82a9-e062c6cbce99.selectorLabels" . | nindent 6 }}
