apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo026e448e-a6f4-4bc8-9fbb-026ce2a2ba3c.fullname" . }}
  labels:
    {{- include "go-echo026e448e-a6f4-4bc8-9fbb-026ce2a2ba3c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo026e448e-a6f4-4bc8-9fbb-026ce2a2ba3c.selectorLabels" . | nindent 6 }}
