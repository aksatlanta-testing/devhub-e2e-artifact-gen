apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8da86f71-7ae1-4d7d-b7eb-3b29c80f04de.fullname" . }}
  labels:
    {{- include "go-echo8da86f71-7ae1-4d7d-b7eb-3b29c80f04de.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8da86f71-7ae1-4d7d-b7eb-3b29c80f04de.selectorLabels" . | nindent 6 }}
