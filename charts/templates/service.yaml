apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofe7bae6b-5c82-4d60-9b21-3f7c85966723.fullname" . }}
  labels:
    {{- include "go-echofe7bae6b-5c82-4d60-9b21-3f7c85966723.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofe7bae6b-5c82-4d60-9b21-3f7c85966723.selectorLabels" . | nindent 6 }}
