apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodd13c3bd-466f-4a80-a9dc-703cb77ed291.fullname" . }}
  labels:
    {{- include "go-echodd13c3bd-466f-4a80-a9dc-703cb77ed291.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodd13c3bd-466f-4a80-a9dc-703cb77ed291.selectorLabels" . | nindent 6 }}
