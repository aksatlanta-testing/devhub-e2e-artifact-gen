apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0993cdcd-ee9b-4a37-9e76-ee1daf1e7b13.fullname" . }}
  labels:
    {{- include "go-echo0993cdcd-ee9b-4a37-9e76-ee1daf1e7b13.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0993cdcd-ee9b-4a37-9e76-ee1daf1e7b13.selectorLabels" . | nindent 6 }}
