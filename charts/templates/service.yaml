apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7c36cef1-fa1f-4808-990e-b98754c57ff5.fullname" . }}
  labels:
    {{- include "go-echo7c36cef1-fa1f-4808-990e-b98754c57ff5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7c36cef1-fa1f-4808-990e-b98754c57ff5.selectorLabels" . | nindent 6 }}
