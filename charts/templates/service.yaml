apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe57dc1d5-5995-42e2-8f68-1d1dbbbfa707.fullname" . }}
  labels:
    {{- include "go-echoe57dc1d5-5995-42e2-8f68-1d1dbbbfa707.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe57dc1d5-5995-42e2-8f68-1d1dbbbfa707.selectorLabels" . | nindent 6 }}
