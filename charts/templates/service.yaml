apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3f80b939-851d-442d-9490-f7b5bb03971c.fullname" . }}
  labels:
    {{- include "go-echo3f80b939-851d-442d-9490-f7b5bb03971c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3f80b939-851d-442d-9490-f7b5bb03971c.selectorLabels" . | nindent 6 }}
