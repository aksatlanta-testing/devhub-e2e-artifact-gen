apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod7686e3e-496d-4100-be53-0e5320fa0670.fullname" . }}
  labels:
    {{- include "go-echod7686e3e-496d-4100-be53-0e5320fa0670.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod7686e3e-496d-4100-be53-0e5320fa0670.selectorLabels" . | nindent 6 }}
