apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo55acfdd8-d0fa-485a-bc28-715a9b1bc32c.fullname" . }}
  labels:
    {{- include "go-echo55acfdd8-d0fa-485a-bc28-715a9b1bc32c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo55acfdd8-d0fa-485a-bc28-715a9b1bc32c.selectorLabels" . | nindent 6 }}
