apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1dd4dbc2-ff39-46c9-9d3b-69d25371feb9.fullname" . }}
  labels:
    {{- include "go-echo1dd4dbc2-ff39-46c9-9d3b-69d25371feb9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1dd4dbc2-ff39-46c9-9d3b-69d25371feb9.selectorLabels" . | nindent 6 }}
