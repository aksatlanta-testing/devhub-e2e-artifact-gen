apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobec4240e-a9ec-4fbc-8ac2-75609f960d33.fullname" . }}
  labels:
    {{- include "go-echobec4240e-a9ec-4fbc-8ac2-75609f960d33.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobec4240e-a9ec-4fbc-8ac2-75609f960d33.selectorLabels" . | nindent 6 }}
