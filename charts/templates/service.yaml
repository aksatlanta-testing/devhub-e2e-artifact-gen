apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo54bc223a-5d5a-4680-b2ce-a7b43015251f.fullname" . }}
  labels:
    {{- include "go-echo54bc223a-5d5a-4680-b2ce-a7b43015251f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo54bc223a-5d5a-4680-b2ce-a7b43015251f.selectorLabels" . | nindent 6 }}
