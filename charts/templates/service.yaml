apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofa79a340-d33d-43e8-87e2-18f3414b282b.fullname" . }}
  labels:
    {{- include "go-echofa79a340-d33d-43e8-87e2-18f3414b282b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofa79a340-d33d-43e8-87e2-18f3414b282b.selectorLabels" . | nindent 6 }}
