apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc00e890f-1e05-424b-b709-fe75da040266.fullname" . }}
  labels:
    {{- include "go-echoc00e890f-1e05-424b-b709-fe75da040266.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc00e890f-1e05-424b-b709-fe75da040266.selectorLabels" . | nindent 6 }}
