apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod332610d-2771-429d-ae1c-01a82de19eca.fullname" . }}
  labels:
    {{- include "go-echod332610d-2771-429d-ae1c-01a82de19eca.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod332610d-2771-429d-ae1c-01a82de19eca.selectorLabels" . | nindent 6 }}
