apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7acb1fdb-278d-4c8e-89d1-461f861fdc23.fullname" . }}
  labels:
    {{- include "go-echo7acb1fdb-278d-4c8e-89d1-461f861fdc23.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7acb1fdb-278d-4c8e-89d1-461f861fdc23.selectorLabels" . | nindent 6 }}
