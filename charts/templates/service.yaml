apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0293e4b9-da16-4125-8626-8b69c50ac719.fullname" . }}
  labels:
    {{- include "go-echo0293e4b9-da16-4125-8626-8b69c50ac719.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0293e4b9-da16-4125-8626-8b69c50ac719.selectorLabels" . | nindent 6 }}
