apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3c34debb-dbed-446b-a508-0e48f17ecb6d.fullname" . }}
  labels:
    {{- include "go-echo3c34debb-dbed-446b-a508-0e48f17ecb6d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3c34debb-dbed-446b-a508-0e48f17ecb6d.selectorLabels" . | nindent 6 }}
