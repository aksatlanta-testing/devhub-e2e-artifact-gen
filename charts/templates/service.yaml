apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4ee71304-8d41-4555-a610-78bfb3b912de.fullname" . }}
  labels:
    {{- include "go-echo4ee71304-8d41-4555-a610-78bfb3b912de.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4ee71304-8d41-4555-a610-78bfb3b912de.selectorLabels" . | nindent 6 }}
