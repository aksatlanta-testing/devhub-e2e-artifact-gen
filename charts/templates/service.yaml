apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof5414ca2-c4c3-45e7-9217-ce0f71c504ee.fullname" . }}
  labels:
    {{- include "go-echof5414ca2-c4c3-45e7-9217-ce0f71c504ee.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof5414ca2-c4c3-45e7-9217-ce0f71c504ee.selectorLabels" . | nindent 6 }}
