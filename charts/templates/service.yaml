apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc43782a2-1c3e-48f7-a67d-8a56255ceed1.fullname" . }}
  labels:
    {{- include "go-echoc43782a2-1c3e-48f7-a67d-8a56255ceed1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc43782a2-1c3e-48f7-a67d-8a56255ceed1.selectorLabels" . | nindent 6 }}
