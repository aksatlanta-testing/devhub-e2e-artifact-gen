apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo65f05b8e-87dc-409e-90c4-d87170b39c8d.fullname" . }}
  labels:
    {{- include "go-echo65f05b8e-87dc-409e-90c4-d87170b39c8d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo65f05b8e-87dc-409e-90c4-d87170b39c8d.selectorLabels" . | nindent 6 }}
