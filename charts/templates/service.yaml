apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofb12209c-8fdd-407a-8915-f28439c36780.fullname" . }}
  labels:
    {{- include "go-echofb12209c-8fdd-407a-8915-f28439c36780.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofb12209c-8fdd-407a-8915-f28439c36780.selectorLabels" . | nindent 6 }}
