apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1eeff330-9ebe-48b3-ab95-af0bb021202e.fullname" . }}
  labels:
    {{- include "go-echo1eeff330-9ebe-48b3-ab95-af0bb021202e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1eeff330-9ebe-48b3-ab95-af0bb021202e.selectorLabels" . | nindent 6 }}
