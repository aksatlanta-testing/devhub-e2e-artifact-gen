apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoab99aef1-74d2-4344-af36-ae006106bc20.fullname" . }}
  labels:
    {{- include "go-echoab99aef1-74d2-4344-af36-ae006106bc20.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoab99aef1-74d2-4344-af36-ae006106bc20.selectorLabels" . | nindent 6 }}
