apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa355b4e9-8eee-439c-8775-b4e2399809dc.fullname" . }}
  labels:
    {{- include "go-echoa355b4e9-8eee-439c-8775-b4e2399809dc.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa355b4e9-8eee-439c-8775-b4e2399809dc.selectorLabels" . | nindent 6 }}
