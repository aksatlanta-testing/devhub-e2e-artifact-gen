apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9d372c09-1dd6-4f30-9b6a-b12955cd8f60.fullname" . }}
  labels:
    {{- include "go-echo9d372c09-1dd6-4f30-9b6a-b12955cd8f60.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9d372c09-1dd6-4f30-9b6a-b12955cd8f60.selectorLabels" . | nindent 6 }}
