apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc71bfb79-d61a-4d3b-9ab2-dd84f82a806e.fullname" . }}
  labels:
    {{- include "go-echoc71bfb79-d61a-4d3b-9ab2-dd84f82a806e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc71bfb79-d61a-4d3b-9ab2-dd84f82a806e.selectorLabels" . | nindent 6 }}
