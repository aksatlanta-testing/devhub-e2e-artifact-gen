apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof16dff15-8154-4b4f-b0f4-e3032ae97e9e.fullname" . }}
  labels:
    {{- include "go-echof16dff15-8154-4b4f-b0f4-e3032ae97e9e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof16dff15-8154-4b4f-b0f4-e3032ae97e9e.selectorLabels" . | nindent 6 }}
