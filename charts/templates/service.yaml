apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa5aa9846-decf-4531-93cd-7ee7fdc3d317.fullname" . }}
  labels:
    {{- include "go-echoa5aa9846-decf-4531-93cd-7ee7fdc3d317.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa5aa9846-decf-4531-93cd-7ee7fdc3d317.selectorLabels" . | nindent 6 }}
