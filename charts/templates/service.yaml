apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoae482315-9d5b-4ea8-b3a4-a1cc5acd2068.fullname" . }}
  labels:
    {{- include "go-echoae482315-9d5b-4ea8-b3a4-a1cc5acd2068.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoae482315-9d5b-4ea8-b3a4-a1cc5acd2068.selectorLabels" . | nindent 6 }}
