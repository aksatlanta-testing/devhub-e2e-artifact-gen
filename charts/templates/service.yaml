apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3581063b-b387-4927-ba3e-d2dc5d0e5eb5.fullname" . }}
  labels:
    {{- include "go-echo3581063b-b387-4927-ba3e-d2dc5d0e5eb5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3581063b-b387-4927-ba3e-d2dc5d0e5eb5.selectorLabels" . | nindent 6 }}
