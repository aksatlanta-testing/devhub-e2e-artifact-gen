apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2aa08f45-7cf8-4466-a41c-fec13cba4fe6.fullname" . }}
  labels:
    {{- include "go-echo2aa08f45-7cf8-4466-a41c-fec13cba4fe6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2aa08f45-7cf8-4466-a41c-fec13cba4fe6.selectorLabels" . | nindent 6 }}
