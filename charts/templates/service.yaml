apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3d15b6d0-c9ed-4b73-9ea4-bbe05d5c37ba.fullname" . }}
  labels:
    {{- include "go-echo3d15b6d0-c9ed-4b73-9ea4-bbe05d5c37ba.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3d15b6d0-c9ed-4b73-9ea4-bbe05d5c37ba.selectorLabels" . | nindent 6 }}
