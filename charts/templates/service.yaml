apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo32b98584-bf25-4e82-a59a-f8c701b6da72.fullname" . }}
  labels:
    {{- include "go-echo32b98584-bf25-4e82-a59a-f8c701b6da72.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo32b98584-bf25-4e82-a59a-f8c701b6da72.selectorLabels" . | nindent 6 }}
