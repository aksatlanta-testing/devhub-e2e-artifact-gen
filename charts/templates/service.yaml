apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc6b7e319-acc5-4819-a4e5-f2addad9add2.fullname" . }}
  labels:
    {{- include "go-echoc6b7e319-acc5-4819-a4e5-f2addad9add2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc6b7e319-acc5-4819-a4e5-f2addad9add2.selectorLabels" . | nindent 6 }}
