apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo65473539-f030-445a-869c-df55423d7915.fullname" . }}
  labels:
    {{- include "go-echo65473539-f030-445a-869c-df55423d7915.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo65473539-f030-445a-869c-df55423d7915.selectorLabels" . | nindent 6 }}
