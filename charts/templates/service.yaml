apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0a268462-ee95-48e1-b9b2-0e7abdb4f307.fullname" . }}
  labels:
    {{- include "go-echo0a268462-ee95-48e1-b9b2-0e7abdb4f307.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0a268462-ee95-48e1-b9b2-0e7abdb4f307.selectorLabels" . | nindent 6 }}
