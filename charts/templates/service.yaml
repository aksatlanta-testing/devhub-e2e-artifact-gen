apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof2646187-ecc5-4b7c-8486-e7fc68a27ff2.fullname" . }}
  labels:
    {{- include "go-echof2646187-ecc5-4b7c-8486-e7fc68a27ff2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof2646187-ecc5-4b7c-8486-e7fc68a27ff2.selectorLabels" . | nindent 6 }}
