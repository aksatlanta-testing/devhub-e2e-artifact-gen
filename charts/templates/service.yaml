apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo030de728-1e37-447a-b97a-52a985a44339.fullname" . }}
  labels:
    {{- include "go-echo030de728-1e37-447a-b97a-52a985a44339.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo030de728-1e37-447a-b97a-52a985a44339.selectorLabels" . | nindent 6 }}
