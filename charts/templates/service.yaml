apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob2812188-661e-4958-9326-84474caffed4.fullname" . }}
  labels:
    {{- include "go-echob2812188-661e-4958-9326-84474caffed4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob2812188-661e-4958-9326-84474caffed4.selectorLabels" . | nindent 6 }}
