apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9914053f-4b43-4ce0-8186-222e8366bd3f.fullname" . }}
  labels:
    {{- include "go-echo9914053f-4b43-4ce0-8186-222e8366bd3f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9914053f-4b43-4ce0-8186-222e8366bd3f.selectorLabels" . | nindent 6 }}
