apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoed1d9d66-f4a1-41c0-a095-6c519dc078d8.fullname" . }}
  labels:
    {{- include "go-echoed1d9d66-f4a1-41c0-a095-6c519dc078d8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoed1d9d66-f4a1-41c0-a095-6c519dc078d8.selectorLabels" . | nindent 6 }}
