apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocc5c09bd-e241-43c1-85a7-79797a616fc9.fullname" . }}
  labels:
    {{- include "go-echocc5c09bd-e241-43c1-85a7-79797a616fc9.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocc5c09bd-e241-43c1-85a7-79797a616fc9.selectorLabels" . | nindent 6 }}
