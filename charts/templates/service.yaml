apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo54d882b9-0f1f-4460-a14c-e61b38ac59d6.fullname" . }}
  labels:
    {{- include "go-echo54d882b9-0f1f-4460-a14c-e61b38ac59d6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo54d882b9-0f1f-4460-a14c-e61b38ac59d6.selectorLabels" . | nindent 6 }}
