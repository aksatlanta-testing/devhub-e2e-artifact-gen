apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9d303c1f-f819-4625-bd77-6920d4eb7c6e.fullname" . }}
  labels:
    {{- include "go-echo9d303c1f-f819-4625-bd77-6920d4eb7c6e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9d303c1f-f819-4625-bd77-6920d4eb7c6e.selectorLabels" . | nindent 6 }}
