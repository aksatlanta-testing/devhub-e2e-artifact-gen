apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7b981044-4675-408e-b75d-3327299d0fc7.fullname" . }}
  labels:
    {{- include "go-echo7b981044-4675-408e-b75d-3327299d0fc7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
