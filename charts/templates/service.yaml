apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo20d5d4a0-ebba-4b09-93fc-97c8862a724d.fullname" . }}
  labels:
    {{- include "go-echo20d5d4a0-ebba-4b09-93fc-97c8862a724d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo20d5d4a0-ebba-4b09-93fc-97c8862a724d.selectorLabels" . | nindent 6 }}
