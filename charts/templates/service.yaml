apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3a5e5246-8bcc-4fef-a7a9-4a86c94ce570.fullname" . }}
  labels:
    {{- include "go-echo3a5e5246-8bcc-4fef-a7a9-4a86c94ce570.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3a5e5246-8bcc-4fef-a7a9-4a86c94ce570.selectorLabels" . | nindent 6 }}
