apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0bd4ab1c-3825-458e-89a8-d642ef754ba3.fullname" . }}
  labels:
    {{- include "go-echo0bd4ab1c-3825-458e-89a8-d642ef754ba3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0bd4ab1c-3825-458e-89a8-d642ef754ba3.selectorLabels" . | nindent 6 }}
