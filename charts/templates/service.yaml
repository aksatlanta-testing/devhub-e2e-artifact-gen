apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8d990cfa-2d2a-416b-bba4-894d205d6625.fullname" . }}
  labels:
    {{- include "go-echo8d990cfa-2d2a-416b-bba4-894d205d6625.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8d990cfa-2d2a-416b-bba4-894d205d6625.selectorLabels" . | nindent 6 }}
