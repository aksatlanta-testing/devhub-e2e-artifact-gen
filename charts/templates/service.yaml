apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo721da2d6-88af-4912-99b2-11dfa5e49ca9.fullname" . }}
  labels:
    {{- include "go-echo721da2d6-88af-4912-99b2-11dfa5e49ca9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo721da2d6-88af-4912-99b2-11dfa5e49ca9.selectorLabels" . | nindent 6 }}
