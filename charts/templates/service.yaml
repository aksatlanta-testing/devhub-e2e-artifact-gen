apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo82d769a6-d60c-486d-95e6-7539c3c9dd31.fullname" . }}
  labels:
    {{- include "go-echo82d769a6-d60c-486d-95e6-7539c3c9dd31.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo82d769a6-d60c-486d-95e6-7539c3c9dd31.selectorLabels" . | nindent 6 }}
