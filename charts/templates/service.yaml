apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa56ce85a-936c-481a-89db-ecaac5662829.fullname" . }}
  labels:
    {{- include "go-echoa56ce85a-936c-481a-89db-ecaac5662829.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa56ce85a-936c-481a-89db-ecaac5662829.selectorLabels" . | nindent 6 }}
