apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9ed7e077-72df-45d2-9f19-78fc04bfda26.fullname" . }}
  labels:
    {{- include "go-echo9ed7e077-72df-45d2-9f19-78fc04bfda26.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9ed7e077-72df-45d2-9f19-78fc04bfda26.selectorLabels" . | nindent 6 }}
