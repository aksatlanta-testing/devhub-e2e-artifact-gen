apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0070d270-d5d8-476d-89ab-3bfd71b896fa.fullname" . }}
  labels:
    {{- include "go-echo0070d270-d5d8-476d-89ab-3bfd71b896fa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0070d270-d5d8-476d-89ab-3bfd71b896fa.selectorLabels" . | nindent 6 }}
