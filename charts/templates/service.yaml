apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo368475bd-bc99-4f71-99cd-b1d970df3621.fullname" . }}
  labels:
    {{- include "go-echo368475bd-bc99-4f71-99cd-b1d970df3621.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo368475bd-bc99-4f71-99cd-b1d970df3621.selectorLabels" . | nindent 6 }}
