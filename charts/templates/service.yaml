apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1d2748d4-3d89-4a46-80c8-5e3460879d1d.fullname" . }}
  labels:
    {{- include "go-echo1d2748d4-3d89-4a46-80c8-5e3460879d1d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1d2748d4-3d89-4a46-80c8-5e3460879d1d.selectorLabels" . | nindent 6 }}
