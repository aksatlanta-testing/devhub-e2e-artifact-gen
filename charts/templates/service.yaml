apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo37c6f67b-6db3-4a00-9d66-84b2d35dc22d.fullname" . }}
  labels:
    {{- include "go-echo37c6f67b-6db3-4a00-9d66-84b2d35dc22d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo37c6f67b-6db3-4a00-9d66-84b2d35dc22d.selectorLabels" . | nindent 6 }}
