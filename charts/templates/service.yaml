apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod38074c1-3522-43d8-860f-edf30ab31aa3.fullname" . }}
  labels:
    {{- include "go-echod38074c1-3522-43d8-860f-edf30ab31aa3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod38074c1-3522-43d8-860f-edf30ab31aa3.selectorLabels" . | nindent 6 }}
