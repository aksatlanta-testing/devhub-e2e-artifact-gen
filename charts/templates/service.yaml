apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo42af3e3d-f337-491e-b02a-694d4d78e29d.fullname" . }}
  labels:
    {{- include "go-echo42af3e3d-f337-491e-b02a-694d4d78e29d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo42af3e3d-f337-491e-b02a-694d4d78e29d.selectorLabels" . | nindent 6 }}
