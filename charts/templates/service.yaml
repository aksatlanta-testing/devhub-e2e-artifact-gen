apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4170227c-8cd1-41e7-aadf-d7cfb8419c09.fullname" . }}
  labels:
    {{- include "go-echo4170227c-8cd1-41e7-aadf-d7cfb8419c09.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4170227c-8cd1-41e7-aadf-d7cfb8419c09.selectorLabels" . | nindent 6 }}
