apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo01fef2fe-ac0b-450c-9a21-4d19614c5bec.fullname" . }}
  labels:
    {{- include "go-echo01fef2fe-ac0b-450c-9a21-4d19614c5bec.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo01fef2fe-ac0b-450c-9a21-4d19614c5bec.selectorLabels" . | nindent 6 }}
