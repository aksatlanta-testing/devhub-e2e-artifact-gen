apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoef777388-849c-40b3-bf4a-fdb481732413.fullname" . }}
  labels:
    {{- include "go-echoef777388-849c-40b3-bf4a-fdb481732413.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoef777388-849c-40b3-bf4a-fdb481732413.selectorLabels" . | nindent 6 }}
