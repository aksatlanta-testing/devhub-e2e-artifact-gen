apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobf19f6d3-47e6-48b1-b381-3ccdaeaae2e3.fullname" . }}
  labels:
    {{- include "go-echobf19f6d3-47e6-48b1-b381-3ccdaeaae2e3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobf19f6d3-47e6-48b1-b381-3ccdaeaae2e3.selectorLabels" . | nindent 6 }}
