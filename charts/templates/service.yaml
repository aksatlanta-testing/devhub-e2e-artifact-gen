apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7b61bb82-72a5-4c6c-8ef1-457400373653.fullname" . }}
  labels:
    {{- include "go-echo7b61bb82-72a5-4c6c-8ef1-457400373653.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7b61bb82-72a5-4c6c-8ef1-457400373653.selectorLabels" . | nindent 6 }}
