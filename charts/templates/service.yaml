apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoee3e0974-5ae2-4983-b140-f8068cb0beec.fullname" . }}
  labels:
    {{- include "go-echoee3e0974-5ae2-4983-b140-f8068cb0beec.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoee3e0974-5ae2-4983-b140-f8068cb0beec.selectorLabels" . | nindent 6 }}
