apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobe6b5233-96c7-4406-a841-1e1f86051633.fullname" . }}
  labels:
    {{- include "go-echobe6b5233-96c7-4406-a841-1e1f86051633.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobe6b5233-96c7-4406-a841-1e1f86051633.selectorLabels" . | nindent 6 }}
