apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo10aac349-2d75-4059-bf37-561be9a4a2aa.fullname" . }}
  labels:
    {{- include "go-echo10aac349-2d75-4059-bf37-561be9a4a2aa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo10aac349-2d75-4059-bf37-561be9a4a2aa.selectorLabels" . | nindent 6 }}
