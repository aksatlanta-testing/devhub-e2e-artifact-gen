apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo55e1af3b-1bbb-40f3-b948-33c3fb13cc91.fullname" . }}
  labels:
    {{- include "go-echo55e1af3b-1bbb-40f3-b948-33c3fb13cc91.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo55e1af3b-1bbb-40f3-b948-33c3fb13cc91.selectorLabels" . | nindent 6 }}
