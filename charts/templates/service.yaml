apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo08246699-1c9e-4f8f-aa82-d8d156e3d378.fullname" . }}
  labels:
    {{- include "go-echo08246699-1c9e-4f8f-aa82-d8d156e3d378.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo08246699-1c9e-4f8f-aa82-d8d156e3d378.selectorLabels" . | nindent 6 }}
