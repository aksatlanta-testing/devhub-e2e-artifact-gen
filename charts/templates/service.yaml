apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob8770a58-fede-4d85-9778-54ce22b23588.fullname" . }}
  labels:
    {{- include "go-echob8770a58-fede-4d85-9778-54ce22b23588.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob8770a58-fede-4d85-9778-54ce22b23588.selectorLabels" . | nindent 6 }}
