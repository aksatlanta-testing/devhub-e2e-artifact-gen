apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo428f8b52-32ad-44e6-967a-d17725a29b54.fullname" . }}
  labels:
    {{- include "go-echo428f8b52-32ad-44e6-967a-d17725a29b54.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo428f8b52-32ad-44e6-967a-d17725a29b54.selectorLabels" . | nindent 6 }}
