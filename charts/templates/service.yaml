apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocfbccf39-48cd-453f-bb65-6fa43b598903.fullname" . }}
  labels:
    {{- include "go-echocfbccf39-48cd-453f-bb65-6fa43b598903.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocfbccf39-48cd-453f-bb65-6fa43b598903.selectorLabels" . | nindent 6 }}
