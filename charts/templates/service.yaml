apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7545a841-12f2-4aa1-8a0d-7a602a3697ac.fullname" . }}
  labels:
    {{- include "go-echo7545a841-12f2-4aa1-8a0d-7a602a3697ac.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7545a841-12f2-4aa1-8a0d-7a602a3697ac.selectorLabels" . | nindent 6 }}
