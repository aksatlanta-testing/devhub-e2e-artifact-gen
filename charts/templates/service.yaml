apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaf643ab5-8997-4c7c-8a8d-e1d00e22e589.fullname" . }}
  labels:
    {{- include "go-echoaf643ab5-8997-4c7c-8a8d-e1d00e22e589.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaf643ab5-8997-4c7c-8a8d-e1d00e22e589.selectorLabels" . | nindent 6 }}
