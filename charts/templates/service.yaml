apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6d04fa83-63c4-4bc1-bf38-7f1da492dc4b.fullname" . }}
  labels:
    {{- include "go-echo6d04fa83-63c4-4bc1-bf38-7f1da492dc4b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6d04fa83-63c4-4bc1-bf38-7f1da492dc4b.selectorLabels" . | nindent 6 }}
