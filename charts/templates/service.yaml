apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0d65f9a1-229e-4574-ad8f-fbc890fa6188.fullname" . }}
  labels:
    {{- include "go-echo0d65f9a1-229e-4574-ad8f-fbc890fa6188.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0d65f9a1-229e-4574-ad8f-fbc890fa6188.selectorLabels" . | nindent 6 }}
