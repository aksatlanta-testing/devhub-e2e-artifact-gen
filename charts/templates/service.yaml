apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe82b74fd-490c-4954-a2ff-ce34b10145c9.fullname" . }}
  labels:
    {{- include "go-echoe82b74fd-490c-4954-a2ff-ce34b10145c9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe82b74fd-490c-4954-a2ff-ce34b10145c9.selectorLabels" . | nindent 6 }}
