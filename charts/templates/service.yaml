apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4f1073ee-91a4-45db-a557-ab066c8e2e0b.fullname" . }}
  labels:
    {{- include "go-echo4f1073ee-91a4-45db-a557-ab066c8e2e0b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4f1073ee-91a4-45db-a557-ab066c8e2e0b.selectorLabels" . | nindent 6 }}
