apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe8db44b0-9e34-4ef4-9077-9e3aac545a80.fullname" . }}
  labels:
    {{- include "go-echoe8db44b0-9e34-4ef4-9077-9e3aac545a80.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe8db44b0-9e34-4ef4-9077-9e3aac545a80.selectorLabels" . | nindent 6 }}
