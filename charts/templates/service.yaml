apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo18945aa6-49cf-4244-ae6c-d4374f33103e.fullname" . }}
  labels:
    {{- include "go-echo18945aa6-49cf-4244-ae6c-d4374f33103e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo18945aa6-49cf-4244-ae6c-d4374f33103e.selectorLabels" . | nindent 6 }}
