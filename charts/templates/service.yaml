apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof5c683a2-4cc5-406a-8fd4-a63ef683d6ad.fullname" . }}
  labels:
    {{- include "go-echof5c683a2-4cc5-406a-8fd4-a63ef683d6ad.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof5c683a2-4cc5-406a-8fd4-a63ef683d6ad.selectorLabels" . | nindent 6 }}
