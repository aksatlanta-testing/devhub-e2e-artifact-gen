apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo64206ea0-8c77-4f2a-8fad-0034cc708393.fullname" . }}
  labels:
    {{- include "go-echo64206ea0-8c77-4f2a-8fad-0034cc708393.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo64206ea0-8c77-4f2a-8fad-0034cc708393.selectorLabels" . | nindent 6 }}
