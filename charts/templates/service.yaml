apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo973d4196-4aaf-4ef2-a876-943b7cbc4e45.fullname" . }}
  labels:
    {{- include "go-echo973d4196-4aaf-4ef2-a876-943b7cbc4e45.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo973d4196-4aaf-4ef2-a876-943b7cbc4e45.selectorLabels" . | nindent 6 }}
