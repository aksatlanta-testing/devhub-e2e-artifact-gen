apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofa920ec9-a2d4-41fb-a0c7-688340b595c7.fullname" . }}
  labels:
    {{- include "go-echofa920ec9-a2d4-41fb-a0c7-688340b595c7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofa920ec9-a2d4-41fb-a0c7-688340b595c7.selectorLabels" . | nindent 6 }}
