apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob47b6fb1-ac0e-42a3-aa15-f82853470891.fullname" . }}
  labels:
    {{- include "go-echob47b6fb1-ac0e-42a3-aa15-f82853470891.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob47b6fb1-ac0e-42a3-aa15-f82853470891.selectorLabels" . | nindent 6 }}
