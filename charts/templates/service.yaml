apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo26aabc9f-9b56-4c15-9494-d2189e07683d.fullname" . }}
  labels:
    {{- include "go-echo26aabc9f-9b56-4c15-9494-d2189e07683d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo26aabc9f-9b56-4c15-9494-d2189e07683d.selectorLabels" . | nindent 6 }}
