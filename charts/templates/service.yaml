apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo741042a6-8691-4a12-9fe2-58bb5fcd2620.fullname" . }}
  labels:
    {{- include "go-echo741042a6-8691-4a12-9fe2-58bb5fcd2620.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo741042a6-8691-4a12-9fe2-58bb5fcd2620.selectorLabels" . | nindent 6 }}
