apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobee8bcbf-d054-4bb0-b15f-5767f3185522.fullname" . }}
  labels:
    {{- include "go-echobee8bcbf-d054-4bb0-b15f-5767f3185522.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobee8bcbf-d054-4bb0-b15f-5767f3185522.selectorLabels" . | nindent 6 }}
