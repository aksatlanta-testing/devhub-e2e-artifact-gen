apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo32b8a5df-c584-40b0-95e6-3579d39a95d3.fullname" . }}
  labels:
    {{- include "go-echo32b8a5df-c584-40b0-95e6-3579d39a95d3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo32b8a5df-c584-40b0-95e6-3579d39a95d3.selectorLabels" . | nindent 6 }}
