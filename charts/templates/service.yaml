apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod45bf925-de0f-48a5-9bbc-29a1b20def8e.fullname" . }}
  labels:
    {{- include "go-echod45bf925-de0f-48a5-9bbc-29a1b20def8e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod45bf925-de0f-48a5-9bbc-29a1b20def8e.selectorLabels" . | nindent 6 }}
