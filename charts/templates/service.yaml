apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe62bb4b3-7bbb-425a-8fa9-608df10cf5d1.fullname" . }}
  labels:
    {{- include "go-echoe62bb4b3-7bbb-425a-8fa9-608df10cf5d1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe62bb4b3-7bbb-425a-8fa9-608df10cf5d1.selectorLabels" . | nindent 6 }}
