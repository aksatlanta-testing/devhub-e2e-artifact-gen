apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof78225a8-885b-4ea6-b848-3adec2116a0f.fullname" . }}
  labels:
    {{- include "go-echof78225a8-885b-4ea6-b848-3adec2116a0f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof78225a8-885b-4ea6-b848-3adec2116a0f.selectorLabels" . | nindent 6 }}
