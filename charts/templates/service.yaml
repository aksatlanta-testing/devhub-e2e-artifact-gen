apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof15a4d81-f3fa-4925-8bed-38573dd68636.fullname" . }}
  labels:
    {{- include "go-echof15a4d81-f3fa-4925-8bed-38573dd68636.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof15a4d81-f3fa-4925-8bed-38573dd68636.selectorLabels" . | nindent 6 }}
