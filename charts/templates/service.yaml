apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0bee5020-4785-4235-9516-541834d6de2b.fullname" . }}
  labels:
    {{- include "go-echo0bee5020-4785-4235-9516-541834d6de2b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0bee5020-4785-4235-9516-541834d6de2b.selectorLabels" . | nindent 6 }}
