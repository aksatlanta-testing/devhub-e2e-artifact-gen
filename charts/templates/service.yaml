apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc4a571ec-92c2-4b7b-8389-684f70e08115.fullname" . }}
  labels:
    {{- include "go-echoc4a571ec-92c2-4b7b-8389-684f70e08115.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc4a571ec-92c2-4b7b-8389-684f70e08115.selectorLabels" . | nindent 6 }}
