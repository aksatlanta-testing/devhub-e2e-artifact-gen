apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4ffcf479-8066-477a-a13b-d8b47712c506.fullname" . }}
  labels:
    {{- include "go-echo4ffcf479-8066-477a-a13b-d8b47712c506.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
