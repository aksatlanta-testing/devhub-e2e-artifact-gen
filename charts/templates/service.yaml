apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3928c699-5ace-4402-9fa1-f7f04268118a.fullname" . }}
  labels:
    {{- include "go-echo3928c699-5ace-4402-9fa1-f7f04268118a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3928c699-5ace-4402-9fa1-f7f04268118a.selectorLabels" . | nindent 6 }}
