apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof5e722a1-c8a7-48f7-b7f3-e71532f42c60.fullname" . }}
  labels:
    {{- include "go-echof5e722a1-c8a7-48f7-b7f3-e71532f42c60.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof5e722a1-c8a7-48f7-b7f3-e71532f42c60.selectorLabels" . | nindent 6 }}
