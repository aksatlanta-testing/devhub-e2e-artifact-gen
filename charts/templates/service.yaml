apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobe5b6462-5084-4cf8-8df2-24076accdf91.fullname" . }}
  labels:
    {{- include "go-echobe5b6462-5084-4cf8-8df2-24076accdf91.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobe5b6462-5084-4cf8-8df2-24076accdf91.selectorLabels" . | nindent 6 }}
