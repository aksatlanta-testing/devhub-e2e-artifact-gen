apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2053b18e-25d6-4c8b-8ee2-2a6b6cc76331.fullname" . }}
  labels:
    {{- include "go-echo2053b18e-25d6-4c8b-8ee2-2a6b6cc76331.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2053b18e-25d6-4c8b-8ee2-2a6b6cc76331.selectorLabels" . | nindent 6 }}
