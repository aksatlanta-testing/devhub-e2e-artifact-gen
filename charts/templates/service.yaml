apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0f23ce2a-feba-42ce-89e1-5df6813c4995.fullname" . }}
  labels:
    {{- include "go-echo0f23ce2a-feba-42ce-89e1-5df6813c4995.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0f23ce2a-feba-42ce-89e1-5df6813c4995.selectorLabels" . | nindent 6 }}
