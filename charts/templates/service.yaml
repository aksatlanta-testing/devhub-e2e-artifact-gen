apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo18fbe2b8-d57d-4711-a1d0-5b52e629195c.fullname" . }}
  labels:
    {{- include "go-echo18fbe2b8-d57d-4711-a1d0-5b52e629195c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo18fbe2b8-d57d-4711-a1d0-5b52e629195c.selectorLabels" . | nindent 6 }}
