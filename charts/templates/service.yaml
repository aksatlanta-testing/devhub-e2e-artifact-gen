apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod1a55fea-47b1-4a10-a5a2-339a7095e049.fullname" . }}
  labels:
    {{- include "go-echod1a55fea-47b1-4a10-a5a2-339a7095e049.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod1a55fea-47b1-4a10-a5a2-339a7095e049.selectorLabels" . | nindent 6 }}
