apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7d07c5b9-5ccd-4384-9845-8b3bcb887328.fullname" . }}
  labels:
    {{- include "go-echo7d07c5b9-5ccd-4384-9845-8b3bcb887328.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7d07c5b9-5ccd-4384-9845-8b3bcb887328.selectorLabels" . | nindent 6 }}
