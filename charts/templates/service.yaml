apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe3033753-fda1-464b-a6a4-8d6bda156815.fullname" . }}
  labels:
    {{- include "go-echoe3033753-fda1-464b-a6a4-8d6bda156815.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe3033753-fda1-464b-a6a4-8d6bda156815.selectorLabels" . | nindent 6 }}
