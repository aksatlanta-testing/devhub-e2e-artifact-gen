apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoce2a78f3-0ff2-43d6-94a8-3c39f9e6e7c7.fullname" . }}
  labels:
    {{- include "go-echoce2a78f3-0ff2-43d6-94a8-3c39f9e6e7c7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoce2a78f3-0ff2-43d6-94a8-3c39f9e6e7c7.selectorLabels" . | nindent 6 }}
