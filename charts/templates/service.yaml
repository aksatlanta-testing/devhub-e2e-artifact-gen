apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo701fdfd2-12bd-43a6-b4ed-0de67b361f50.fullname" . }}
  labels:
    {{- include "go-echo701fdfd2-12bd-43a6-b4ed-0de67b361f50.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo701fdfd2-12bd-43a6-b4ed-0de67b361f50.selectorLabels" . | nindent 6 }}
