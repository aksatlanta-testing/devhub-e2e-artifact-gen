apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3129297e-06f7-432d-b601-a4504be8d624.fullname" . }}
  labels:
    {{- include "go-echo3129297e-06f7-432d-b601-a4504be8d624.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3129297e-06f7-432d-b601-a4504be8d624.selectorLabels" . | nindent 6 }}
