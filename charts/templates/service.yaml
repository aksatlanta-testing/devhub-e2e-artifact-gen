apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1fd9c2c8-6d3a-450c-b221-2d1431a6e575.fullname" . }}
  labels:
    {{- include "go-echo1fd9c2c8-6d3a-450c-b221-2d1431a6e575.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1fd9c2c8-6d3a-450c-b221-2d1431a6e575.selectorLabels" . | nindent 6 }}
