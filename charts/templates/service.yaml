apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1e81d0cd-ac09-411c-a6af-f5de5f9c1e36.fullname" . }}
  labels:
    {{- include "go-echo1e81d0cd-ac09-411c-a6af-f5de5f9c1e36.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1e81d0cd-ac09-411c-a6af-f5de5f9c1e36.selectorLabels" . | nindent 6 }}
