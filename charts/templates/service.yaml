apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo364356cd-c317-4370-acac-2d6a37dd229d.fullname" . }}
  labels:
    {{- include "go-echo364356cd-c317-4370-acac-2d6a37dd229d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo364356cd-c317-4370-acac-2d6a37dd229d.selectorLabels" . | nindent 6 }}
