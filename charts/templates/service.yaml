apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1b11451f-f49a-47dc-b909-ff0a95d43bbb.fullname" . }}
  labels:
    {{- include "go-echo1b11451f-f49a-47dc-b909-ff0a95d43bbb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1b11451f-f49a-47dc-b909-ff0a95d43bbb.selectorLabels" . | nindent 6 }}
