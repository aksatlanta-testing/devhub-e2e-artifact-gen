apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo93696bf8-f22c-42c6-b050-cd0b556f690d.fullname" . }}
  labels:
    {{- include "go-echo93696bf8-f22c-42c6-b050-cd0b556f690d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo93696bf8-f22c-42c6-b050-cd0b556f690d.selectorLabels" . | nindent 6 }}
