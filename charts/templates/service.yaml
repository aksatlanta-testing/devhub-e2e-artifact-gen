apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo67545e61-7686-49c2-9e74-16c1699b0e71.fullname" . }}
  labels:
    {{- include "go-echo67545e61-7686-49c2-9e74-16c1699b0e71.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo67545e61-7686-49c2-9e74-16c1699b0e71.selectorLabels" . | nindent 6 }}
