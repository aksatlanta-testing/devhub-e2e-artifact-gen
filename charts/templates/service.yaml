apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocf81ec4a-dffd-4540-bb92-d6247ce7bf32.fullname" . }}
  labels:
    {{- include "go-echocf81ec4a-dffd-4540-bb92-d6247ce7bf32.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocf81ec4a-dffd-4540-bb92-d6247ce7bf32.selectorLabels" . | nindent 6 }}
