apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2abcc5ed-7991-4ea3-9041-3d5582a6d009.fullname" . }}
  labels:
    {{- include "go-echo2abcc5ed-7991-4ea3-9041-3d5582a6d009.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2abcc5ed-7991-4ea3-9041-3d5582a6d009.selectorLabels" . | nindent 6 }}
