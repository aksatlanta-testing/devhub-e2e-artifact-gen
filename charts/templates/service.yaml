apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc7748ece-f30e-44e5-8d84-5bbb19773b23.fullname" . }}
  labels:
    {{- include "go-echoc7748ece-f30e-44e5-8d84-5bbb19773b23.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc7748ece-f30e-44e5-8d84-5bbb19773b23.selectorLabels" . | nindent 6 }}
