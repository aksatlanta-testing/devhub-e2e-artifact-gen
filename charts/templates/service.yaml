apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo71a3d5db-b5a4-48a1-b3c5-bbd4acdd207d.fullname" . }}
  labels:
    {{- include "go-echo71a3d5db-b5a4-48a1-b3c5-bbd4acdd207d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo71a3d5db-b5a4-48a1-b3c5-bbd4acdd207d.selectorLabels" . | nindent 6 }}
