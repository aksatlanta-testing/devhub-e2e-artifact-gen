apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo197183a5-df9c-4eb1-b3ca-c427601c8b96.fullname" . }}
  labels:
    {{- include "go-echo197183a5-df9c-4eb1-b3ca-c427601c8b96.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo197183a5-df9c-4eb1-b3ca-c427601c8b96.selectorLabels" . | nindent 6 }}
