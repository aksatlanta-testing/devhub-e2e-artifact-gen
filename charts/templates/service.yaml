apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8e08a8ff-8739-489f-bf51-7a83802242ef.fullname" . }}
  labels:
    {{- include "go-echo8e08a8ff-8739-489f-bf51-7a83802242ef.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8e08a8ff-8739-489f-bf51-7a83802242ef.selectorLabels" . | nindent 6 }}
