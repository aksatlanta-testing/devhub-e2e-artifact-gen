apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7f480b4f-f53d-4527-a967-70649a828a60.fullname" . }}
  labels:
    {{- include "go-echo7f480b4f-f53d-4527-a967-70649a828a60.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7f480b4f-f53d-4527-a967-70649a828a60.selectorLabels" . | nindent 6 }}
