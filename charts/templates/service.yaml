apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo767c2efe-8e2d-4671-a304-387cdec822dc.fullname" . }}
  labels:
    {{- include "go-echo767c2efe-8e2d-4671-a304-387cdec822dc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo767c2efe-8e2d-4671-a304-387cdec822dc.selectorLabels" . | nindent 6 }}
