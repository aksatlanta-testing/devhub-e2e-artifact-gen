apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6036e172-321d-4080-bae3-e18dfa24c66a.fullname" . }}
  labels:
    {{- include "go-echo6036e172-321d-4080-bae3-e18dfa24c66a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6036e172-321d-4080-bae3-e18dfa24c66a.selectorLabels" . | nindent 6 }}
