apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa4e94a80-b0ae-4685-8a50-f7072c3ee4bb.fullname" . }}
  labels:
    {{- include "go-echoa4e94a80-b0ae-4685-8a50-f7072c3ee4bb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa4e94a80-b0ae-4685-8a50-f7072c3ee4bb.selectorLabels" . | nindent 6 }}
