apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa4593966-6593-4b1d-89c4-d053c285646e.fullname" . }}
  labels:
    {{- include "go-echoa4593966-6593-4b1d-89c4-d053c285646e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa4593966-6593-4b1d-89c4-d053c285646e.selectorLabels" . | nindent 6 }}
