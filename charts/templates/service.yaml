apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo03f9ce9f-c18a-4e6d-937f-3e231864c926.fullname" . }}
  labels:
    {{- include "go-echo03f9ce9f-c18a-4e6d-937f-3e231864c926.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo03f9ce9f-c18a-4e6d-937f-3e231864c926.selectorLabels" . | nindent 6 }}
