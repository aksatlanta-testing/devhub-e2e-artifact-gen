apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo758e6e39-2f63-41fe-a773-83a0f1015a8c.fullname" . }}
  labels:
    {{- include "go-echo758e6e39-2f63-41fe-a773-83a0f1015a8c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo758e6e39-2f63-41fe-a773-83a0f1015a8c.selectorLabels" . | nindent 6 }}
