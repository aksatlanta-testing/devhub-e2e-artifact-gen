apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1230de71-c2e9-4d49-ae6a-d4cb6092dbd2.fullname" . }}
  labels:
    {{- include "go-echo1230de71-c2e9-4d49-ae6a-d4cb6092dbd2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1230de71-c2e9-4d49-ae6a-d4cb6092dbd2.selectorLabels" . | nindent 6 }}
