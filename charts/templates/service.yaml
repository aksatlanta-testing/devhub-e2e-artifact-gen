apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1ffce955-0a3a-4f3c-b887-1087e221d27d.fullname" . }}
  labels:
    {{- include "go-echo1ffce955-0a3a-4f3c-b887-1087e221d27d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1ffce955-0a3a-4f3c-b887-1087e221d27d.selectorLabels" . | nindent 6 }}
