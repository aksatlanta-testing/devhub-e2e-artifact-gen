apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob3cd5638-68eb-4fbd-a595-a0ea84339ea8.fullname" . }}
  labels:
    {{- include "go-echob3cd5638-68eb-4fbd-a595-a0ea84339ea8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob3cd5638-68eb-4fbd-a595-a0ea84339ea8.selectorLabels" . | nindent 6 }}
