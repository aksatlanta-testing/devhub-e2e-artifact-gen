apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo52c210d1-be21-4c09-9bfe-3c947ee30e4c.fullname" . }}
  labels:
    {{- include "go-echo52c210d1-be21-4c09-9bfe-3c947ee30e4c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo52c210d1-be21-4c09-9bfe-3c947ee30e4c.selectorLabels" . | nindent 6 }}
