apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2ea8bb35-e319-4f1a-b8ef-0c98cd0f5458.fullname" . }}
  labels:
    {{- include "go-echo2ea8bb35-e319-4f1a-b8ef-0c98cd0f5458.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2ea8bb35-e319-4f1a-b8ef-0c98cd0f5458.selectorLabels" . | nindent 6 }}
