apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo63218eb8-a7fa-4cb4-9ba5-b6e9c315e32c.fullname" . }}
  labels:
    {{- include "go-echo63218eb8-a7fa-4cb4-9ba5-b6e9c315e32c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo63218eb8-a7fa-4cb4-9ba5-b6e9c315e32c.selectorLabels" . | nindent 6 }}
