apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6aed22d2-ac73-4f72-abc9-64dd700855ad.fullname" . }}
  labels:
    {{- include "go-echo6aed22d2-ac73-4f72-abc9-64dd700855ad.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6aed22d2-ac73-4f72-abc9-64dd700855ad.selectorLabels" . | nindent 6 }}
