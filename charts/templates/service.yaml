apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6a89733a-40ab-48a7-926d-8d68b0528d7f.fullname" . }}
  labels:
    {{- include "go-echo6a89733a-40ab-48a7-926d-8d68b0528d7f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6a89733a-40ab-48a7-926d-8d68b0528d7f.selectorLabels" . | nindent 6 }}
