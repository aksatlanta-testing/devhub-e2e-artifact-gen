apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob8d839b5-2077-4004-9fc0-56566065748b.fullname" . }}
  labels:
    {{- include "go-echob8d839b5-2077-4004-9fc0-56566065748b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob8d839b5-2077-4004-9fc0-56566065748b.selectorLabels" . | nindent 6 }}
