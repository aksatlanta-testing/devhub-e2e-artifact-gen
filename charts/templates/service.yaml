apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo69afdf13-d4bc-4f68-8849-93f14ec7b564.fullname" . }}
  labels:
    {{- include "go-echo69afdf13-d4bc-4f68-8849-93f14ec7b564.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo69afdf13-d4bc-4f68-8849-93f14ec7b564.selectorLabels" . | nindent 6 }}
