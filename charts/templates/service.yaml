apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo45a83122-494e-4733-88c9-a9eca65520ed.fullname" . }}
  labels:
    {{- include "go-echo45a83122-494e-4733-88c9-a9eca65520ed.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo45a83122-494e-4733-88c9-a9eca65520ed.selectorLabels" . | nindent 6 }}
