apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0df799c1-2ad7-41ee-aa72-63fa4acdac09.fullname" . }}
  labels:
    {{- include "go-echo0df799c1-2ad7-41ee-aa72-63fa4acdac09.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0df799c1-2ad7-41ee-aa72-63fa4acdac09.selectorLabels" . | nindent 6 }}
