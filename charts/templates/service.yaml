apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo46823f48-e3c6-4550-9322-e78f00e48f2f.fullname" . }}
  labels:
    {{- include "go-echo46823f48-e3c6-4550-9322-e78f00e48f2f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo46823f48-e3c6-4550-9322-e78f00e48f2f.selectorLabels" . | nindent 6 }}
