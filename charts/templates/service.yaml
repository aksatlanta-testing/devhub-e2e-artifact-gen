apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodfdcc56d-8b67-4ef2-b6e4-4de0ad475002.fullname" . }}
  labels:
    {{- include "go-echodfdcc56d-8b67-4ef2-b6e4-4de0ad475002.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodfdcc56d-8b67-4ef2-b6e4-4de0ad475002.selectorLabels" . | nindent 6 }}
