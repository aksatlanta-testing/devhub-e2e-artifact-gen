apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo11824942-a079-4f9e-8f4a-48e825f88536.fullname" . }}
  labels:
    {{- include "go-echo11824942-a079-4f9e-8f4a-48e825f88536.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo11824942-a079-4f9e-8f4a-48e825f88536.selectorLabels" . | nindent 6 }}
