apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo075fe567-4e55-4cf6-97bf-18fa87176287.fullname" . }}
  labels:
    {{- include "go-echo075fe567-4e55-4cf6-97bf-18fa87176287.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo075fe567-4e55-4cf6-97bf-18fa87176287.selectorLabels" . | nindent 6 }}
