apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4d377bf0-31ed-4116-8666-84477f6fca12.fullname" . }}
  labels:
    {{- include "go-echo4d377bf0-31ed-4116-8666-84477f6fca12.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4d377bf0-31ed-4116-8666-84477f6fca12.selectorLabels" . | nindent 6 }}
