apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo19326293-8258-44cb-ad16-d1d9379928a2.fullname" . }}
  labels:
    {{- include "go-echo19326293-8258-44cb-ad16-d1d9379928a2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo19326293-8258-44cb-ad16-d1d9379928a2.selectorLabels" . | nindent 6 }}
