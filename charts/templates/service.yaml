apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo31cc91fa-5b17-4b76-bebb-c3d37c3ca4d5.fullname" . }}
  labels:
    {{- include "go-echo31cc91fa-5b17-4b76-bebb-c3d37c3ca4d5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo31cc91fa-5b17-4b76-bebb-c3d37c3ca4d5.selectorLabels" . | nindent 6 }}
