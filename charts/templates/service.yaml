apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaa6e479b-9cde-466a-a3ae-8bb28a8b2985.fullname" . }}
  labels:
    {{- include "go-echoaa6e479b-9cde-466a-a3ae-8bb28a8b2985.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaa6e479b-9cde-466a-a3ae-8bb28a8b2985.selectorLabels" . | nindent 6 }}
