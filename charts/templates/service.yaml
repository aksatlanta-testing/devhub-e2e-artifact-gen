apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod700e27e-bd46-48f7-a58a-548c74704a2c.fullname" . }}
  labels:
    {{- include "go-echod700e27e-bd46-48f7-a58a-548c74704a2c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod700e27e-bd46-48f7-a58a-548c74704a2c.selectorLabels" . | nindent 6 }}
