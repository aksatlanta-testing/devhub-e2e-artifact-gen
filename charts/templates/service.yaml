apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo31c6f027-7112-4ae0-a335-1d0af7286c34.fullname" . }}
  labels:
    {{- include "go-echo31c6f027-7112-4ae0-a335-1d0af7286c34.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo31c6f027-7112-4ae0-a335-1d0af7286c34.selectorLabels" . | nindent 6 }}
