apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7e8c397d-6d6b-4617-95e2-84d30659089c.fullname" . }}
  labels:
    {{- include "go-echo7e8c397d-6d6b-4617-95e2-84d30659089c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7e8c397d-6d6b-4617-95e2-84d30659089c.selectorLabels" . | nindent 6 }}
