apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo42032895-d9ec-4858-bc99-c6c8558dc0dc.fullname" . }}
  labels:
    {{- include "go-echo42032895-d9ec-4858-bc99-c6c8558dc0dc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo42032895-d9ec-4858-bc99-c6c8558dc0dc.selectorLabels" . | nindent 6 }}
