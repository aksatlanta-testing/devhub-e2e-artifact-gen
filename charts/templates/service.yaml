apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1993ed8f-75c8-4928-9fa2-75212d7dc54e.fullname" . }}
  labels:
    {{- include "go-echo1993ed8f-75c8-4928-9fa2-75212d7dc54e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1993ed8f-75c8-4928-9fa2-75212d7dc54e.selectorLabels" . | nindent 6 }}
