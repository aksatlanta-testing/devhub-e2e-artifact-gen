apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob76bed61-2911-4bad-8156-24b8a491090b.fullname" . }}
  labels:
    {{- include "go-echob76bed61-2911-4bad-8156-24b8a491090b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob76bed61-2911-4bad-8156-24b8a491090b.selectorLabels" . | nindent 6 }}
