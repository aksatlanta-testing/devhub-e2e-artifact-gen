apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo836ae174-1d6f-4cfa-a4d6-4103ef7eb309.fullname" . }}
  labels:
    {{- include "go-echo836ae174-1d6f-4cfa-a4d6-4103ef7eb309.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo836ae174-1d6f-4cfa-a4d6-4103ef7eb309.selectorLabels" . | nindent 6 }}
