apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo742ec826-ecbc-4700-bd2f-5e915df3d6ff.fullname" . }}
  labels:
    {{- include "go-echo742ec826-ecbc-4700-bd2f-5e915df3d6ff.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo742ec826-ecbc-4700-bd2f-5e915df3d6ff.selectorLabels" . | nindent 6 }}
