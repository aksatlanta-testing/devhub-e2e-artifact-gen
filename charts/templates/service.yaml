apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodafc29e8-aa3a-423c-987a-b5deeca49172.fullname" . }}
  labels:
    {{- include "go-echodafc29e8-aa3a-423c-987a-b5deeca49172.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodafc29e8-aa3a-423c-987a-b5deeca49172.selectorLabels" . | nindent 6 }}
