apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo26a2ff51-3705-4f62-a692-482596a4d043.fullname" . }}
  labels:
    {{- include "go-echo26a2ff51-3705-4f62-a692-482596a4d043.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo26a2ff51-3705-4f62-a692-482596a4d043.selectorLabels" . | nindent 6 }}
