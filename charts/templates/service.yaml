apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoec65c023-b502-4a63-8851-76baad793db1.fullname" . }}
  labels:
    {{- include "go-echoec65c023-b502-4a63-8851-76baad793db1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoec65c023-b502-4a63-8851-76baad793db1.selectorLabels" . | nindent 6 }}
