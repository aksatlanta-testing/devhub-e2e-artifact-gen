apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc34f751b-fe4b-40aa-8ba5-b3598b29bde0.fullname" . }}
  labels:
    {{- include "go-echoc34f751b-fe4b-40aa-8ba5-b3598b29bde0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc34f751b-fe4b-40aa-8ba5-b3598b29bde0.selectorLabels" . | nindent 6 }}
