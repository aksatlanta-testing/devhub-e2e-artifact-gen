apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7f4e7a58-8933-409a-8dee-14accf3d5757.fullname" . }}
  labels:
    {{- include "go-echo7f4e7a58-8933-409a-8dee-14accf3d5757.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7f4e7a58-8933-409a-8dee-14accf3d5757.selectorLabels" . | nindent 6 }}
