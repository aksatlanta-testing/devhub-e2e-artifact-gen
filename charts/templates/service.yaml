apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo29a4cf0e-81ae-46a2-8b72-164f04c96df6.fullname" . }}
  labels:
    {{- include "go-echo29a4cf0e-81ae-46a2-8b72-164f04c96df6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo29a4cf0e-81ae-46a2-8b72-164f04c96df6.selectorLabels" . | nindent 6 }}
