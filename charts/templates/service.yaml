apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo00d9f6c2-99b7-4db3-b1ce-761d4b7b82cb.fullname" . }}
  labels:
    {{- include "go-echo00d9f6c2-99b7-4db3-b1ce-761d4b7b82cb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo00d9f6c2-99b7-4db3-b1ce-761d4b7b82cb.selectorLabels" . | nindent 6 }}
