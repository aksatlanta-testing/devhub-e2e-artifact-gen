apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo448186ef-59ac-4c20-acef-b85287b11db3.fullname" . }}
  labels:
    {{- include "go-echo448186ef-59ac-4c20-acef-b85287b11db3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo448186ef-59ac-4c20-acef-b85287b11db3.selectorLabels" . | nindent 6 }}
