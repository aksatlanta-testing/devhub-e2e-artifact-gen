apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1321eab9-4c56-4be0-9e41-76cdbd895814.fullname" . }}
  labels:
    {{- include "go-echo1321eab9-4c56-4be0-9e41-76cdbd895814.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1321eab9-4c56-4be0-9e41-76cdbd895814.selectorLabels" . | nindent 6 }}
