apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7ad470e5-0d42-44eb-b735-fe0533aaaf1d.fullname" . }}
  labels:
    {{- include "go-echo7ad470e5-0d42-44eb-b735-fe0533aaaf1d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7ad470e5-0d42-44eb-b735-fe0533aaaf1d.selectorLabels" . | nindent 6 }}
