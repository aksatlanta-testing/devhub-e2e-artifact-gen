apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo60d1edba-7372-4078-a577-0334d3552f1b.fullname" . }}
  labels:
    {{- include "go-echo60d1edba-7372-4078-a577-0334d3552f1b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo60d1edba-7372-4078-a577-0334d3552f1b.selectorLabels" . | nindent 6 }}
