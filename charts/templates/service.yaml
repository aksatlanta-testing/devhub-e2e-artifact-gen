apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofc0b8aac-a6cb-447d-8dbb-e3f4d844a1aa.fullname" . }}
  labels:
    {{- include "go-echofc0b8aac-a6cb-447d-8dbb-e3f4d844a1aa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofc0b8aac-a6cb-447d-8dbb-e3f4d844a1aa.selectorLabels" . | nindent 6 }}
