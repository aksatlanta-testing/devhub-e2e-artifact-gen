apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo23f3c60a-12df-48a0-bbf0-074c4eb5b921.fullname" . }}
  labels:
    {{- include "go-echo23f3c60a-12df-48a0-bbf0-074c4eb5b921.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo23f3c60a-12df-48a0-bbf0-074c4eb5b921.selectorLabels" . | nindent 6 }}
