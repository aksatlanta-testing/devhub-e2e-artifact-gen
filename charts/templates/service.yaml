apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo949dd972-f698-4b8a-a0f3-607a770c28ba.fullname" . }}
  labels:
    {{- include "go-echo949dd972-f698-4b8a-a0f3-607a770c28ba.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo949dd972-f698-4b8a-a0f3-607a770c28ba.selectorLabels" . | nindent 6 }}
