apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5edfbd35-663f-4e40-b21c-afdbb2efd00b.fullname" . }}
  labels:
    {{- include "go-echo5edfbd35-663f-4e40-b21c-afdbb2efd00b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5edfbd35-663f-4e40-b21c-afdbb2efd00b.selectorLabels" . | nindent 6 }}
