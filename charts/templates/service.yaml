apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocfa8b01c-0634-4bee-aaf3-4f5a2718b6ac.fullname" . }}
  labels:
    {{- include "go-echocfa8b01c-0634-4bee-aaf3-4f5a2718b6ac.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocfa8b01c-0634-4bee-aaf3-4f5a2718b6ac.selectorLabels" . | nindent 6 }}
