apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobbe49ad9-a4ae-4c08-843e-f873d6c2186b.fullname" . }}
  labels:
    {{- include "go-echobbe49ad9-a4ae-4c08-843e-f873d6c2186b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobbe49ad9-a4ae-4c08-843e-f873d6c2186b.selectorLabels" . | nindent 6 }}
