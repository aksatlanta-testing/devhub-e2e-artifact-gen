apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa1039f3a-edc0-4898-bc8b-b6cb254cda46.fullname" . }}
  labels:
    {{- include "go-echoa1039f3a-edc0-4898-bc8b-b6cb254cda46.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa1039f3a-edc0-4898-bc8b-b6cb254cda46.selectorLabels" . | nindent 6 }}
