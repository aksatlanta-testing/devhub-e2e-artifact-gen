apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo101adb6e-c0f6-4e6d-b48b-e901dd88c10e.fullname" . }}
  labels:
    {{- include "go-echo101adb6e-c0f6-4e6d-b48b-e901dd88c10e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo101adb6e-c0f6-4e6d-b48b-e901dd88c10e.selectorLabels" . | nindent 6 }}
