apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobfee5245-18f7-4c70-b245-bdbd83c26b75.fullname" . }}
  labels:
    {{- include "go-echobfee5245-18f7-4c70-b245-bdbd83c26b75.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobfee5245-18f7-4c70-b245-bdbd83c26b75.selectorLabels" . | nindent 6 }}
