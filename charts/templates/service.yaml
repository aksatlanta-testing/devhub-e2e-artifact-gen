apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1bb7666f-f9e8-4e3b-8338-065064ab50db.fullname" . }}
  labels:
    {{- include "go-echo1bb7666f-f9e8-4e3b-8338-065064ab50db.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1bb7666f-f9e8-4e3b-8338-065064ab50db.selectorLabels" . | nindent 6 }}
