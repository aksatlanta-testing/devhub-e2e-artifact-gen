apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobb015dee-f615-4725-aba0-a97d3d4b3109.fullname" . }}
  labels:
    {{- include "go-echobb015dee-f615-4725-aba0-a97d3d4b3109.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobb015dee-f615-4725-aba0-a97d3d4b3109.selectorLabels" . | nindent 6 }}
