apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod3b88f2e-bd2e-4293-a3a8-198efc37caf4.fullname" . }}
  labels:
    {{- include "go-echod3b88f2e-bd2e-4293-a3a8-198efc37caf4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod3b88f2e-bd2e-4293-a3a8-198efc37caf4.selectorLabels" . | nindent 6 }}
