apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo00bf1cfe-5c23-4a50-a178-7b6a32dbbbd1.fullname" . }}
  labels:
    {{- include "go-echo00bf1cfe-5c23-4a50-a178-7b6a32dbbbd1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo00bf1cfe-5c23-4a50-a178-7b6a32dbbbd1.selectorLabels" . | nindent 6 }}
