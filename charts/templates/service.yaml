apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo39fa7948-da64-45c8-b305-8714c682ea8e.fullname" . }}
  labels:
    {{- include "go-echo39fa7948-da64-45c8-b305-8714c682ea8e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo39fa7948-da64-45c8-b305-8714c682ea8e.selectorLabels" . | nindent 6 }}
