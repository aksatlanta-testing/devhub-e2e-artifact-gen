apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6f8b5f0c-36ee-49cc-ada7-ca6c09f9b755.fullname" . }}
  labels:
    {{- include "go-echo6f8b5f0c-36ee-49cc-ada7-ca6c09f9b755.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6f8b5f0c-36ee-49cc-ada7-ca6c09f9b755.selectorLabels" . | nindent 6 }}
