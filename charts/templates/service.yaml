apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo94b01453-d660-4bde-90a6-a0b913855737.fullname" . }}
  labels:
    {{- include "go-echo94b01453-d660-4bde-90a6-a0b913855737.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo94b01453-d660-4bde-90a6-a0b913855737.selectorLabels" . | nindent 6 }}
