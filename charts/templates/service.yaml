apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoad96b221-4468-495b-80f6-f5e7f094d94b.fullname" . }}
  labels:
    {{- include "go-echoad96b221-4468-495b-80f6-f5e7f094d94b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoad96b221-4468-495b-80f6-f5e7f094d94b.selectorLabels" . | nindent 6 }}
