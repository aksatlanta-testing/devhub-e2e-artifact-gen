apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo629a333a-8b42-4c0d-ac6b-2be2626dd5c0.fullname" . }}
  labels:
    {{- include "go-echo629a333a-8b42-4c0d-ac6b-2be2626dd5c0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo629a333a-8b42-4c0d-ac6b-2be2626dd5c0.selectorLabels" . | nindent 6 }}
