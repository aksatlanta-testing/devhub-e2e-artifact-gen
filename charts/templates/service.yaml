apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2f67194f-4f55-418b-ab57-5dfa33db36a4.fullname" . }}
  labels:
    {{- include "go-echo2f67194f-4f55-418b-ab57-5dfa33db36a4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2f67194f-4f55-418b-ab57-5dfa33db36a4.selectorLabels" . | nindent 6 }}
