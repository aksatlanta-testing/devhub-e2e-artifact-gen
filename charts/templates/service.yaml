apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof0400961-83c7-405c-a8bb-96d31c428f83.fullname" . }}
  labels:
    {{- include "go-echof0400961-83c7-405c-a8bb-96d31c428f83.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof0400961-83c7-405c-a8bb-96d31c428f83.selectorLabels" . | nindent 6 }}
