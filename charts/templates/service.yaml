apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof1458931-8f31-4209-a083-6d43977b102a.fullname" . }}
  labels:
    {{- include "go-echof1458931-8f31-4209-a083-6d43977b102a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof1458931-8f31-4209-a083-6d43977b102a.selectorLabels" . | nindent 6 }}
