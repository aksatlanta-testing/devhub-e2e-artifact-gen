apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6ea3af65-8f5b-4451-9b8d-1fc85b599a07.fullname" . }}
  labels:
    {{- include "go-echo6ea3af65-8f5b-4451-9b8d-1fc85b599a07.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6ea3af65-8f5b-4451-9b8d-1fc85b599a07.selectorLabels" . | nindent 6 }}
