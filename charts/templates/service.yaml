apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0d7d3cd6-9e72-4c2e-9b4e-8a54709f60a9.fullname" . }}
  labels:
    {{- include "go-echo0d7d3cd6-9e72-4c2e-9b4e-8a54709f60a9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0d7d3cd6-9e72-4c2e-9b4e-8a54709f60a9.selectorLabels" . | nindent 6 }}
