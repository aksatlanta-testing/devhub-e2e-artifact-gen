apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod48ac44a-578d-4212-b7fa-179dbe88aad8.fullname" . }}
  labels:
    {{- include "go-echod48ac44a-578d-4212-b7fa-179dbe88aad8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod48ac44a-578d-4212-b7fa-179dbe88aad8.selectorLabels" . | nindent 6 }}
