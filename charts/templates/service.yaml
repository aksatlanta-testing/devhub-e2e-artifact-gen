apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe437e169-6388-485f-be92-bc69233a60f8.fullname" . }}
  labels:
    {{- include "go-echoe437e169-6388-485f-be92-bc69233a60f8.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe437e169-6388-485f-be92-bc69233a60f8.selectorLabels" . | nindent 6 }}
