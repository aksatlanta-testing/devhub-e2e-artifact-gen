apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod756f1c0-b317-427d-8a09-1cb7e1c54f9e.fullname" . }}
  labels:
    {{- include "go-echod756f1c0-b317-427d-8a09-1cb7e1c54f9e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod756f1c0-b317-427d-8a09-1cb7e1c54f9e.selectorLabels" . | nindent 6 }}
