apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo86d98cf8-0ea4-49fd-b50b-f3f6eedae538.fullname" . }}
  labels:
    {{- include "go-echo86d98cf8-0ea4-49fd-b50b-f3f6eedae538.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo86d98cf8-0ea4-49fd-b50b-f3f6eedae538.selectorLabels" . | nindent 6 }}
