apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobf219fd7-c70f-4b88-aaf2-b43f8d5fae8c.fullname" . }}
  labels:
    {{- include "go-echobf219fd7-c70f-4b88-aaf2-b43f8d5fae8c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobf219fd7-c70f-4b88-aaf2-b43f8d5fae8c.selectorLabels" . | nindent 6 }}
