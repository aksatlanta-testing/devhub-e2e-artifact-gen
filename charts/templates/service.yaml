apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo36460be2-8585-4f60-9492-8e04ad1fc629.fullname" . }}
  labels:
    {{- include "go-echo36460be2-8585-4f60-9492-8e04ad1fc629.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo36460be2-8585-4f60-9492-8e04ad1fc629.selectorLabels" . | nindent 6 }}
