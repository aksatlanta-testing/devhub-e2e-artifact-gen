apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocee41617-264c-447c-8a57-0ce5c7d5c16f.fullname" . }}
  labels:
    {{- include "go-echocee41617-264c-447c-8a57-0ce5c7d5c16f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocee41617-264c-447c-8a57-0ce5c7d5c16f.selectorLabels" . | nindent 6 }}
