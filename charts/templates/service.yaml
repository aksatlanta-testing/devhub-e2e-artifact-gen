apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1f6d9c5a-ff57-4651-aa51-e1bd9c7b476d.fullname" . }}
  labels:
    {{- include "go-echo1f6d9c5a-ff57-4651-aa51-e1bd9c7b476d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1f6d9c5a-ff57-4651-aa51-e1bd9c7b476d.selectorLabels" . | nindent 6 }}
