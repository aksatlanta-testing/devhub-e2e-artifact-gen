apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof0a7f5f2-5a9c-4b03-bc7d-88a97c2259c6.fullname" . }}
  labels:
    {{- include "go-echof0a7f5f2-5a9c-4b03-bc7d-88a97c2259c6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof0a7f5f2-5a9c-4b03-bc7d-88a97c2259c6.selectorLabels" . | nindent 6 }}
