apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9072b4a9-3a09-4361-b2ff-7d040bdd9ab5.fullname" . }}
  labels:
    {{- include "go-echo9072b4a9-3a09-4361-b2ff-7d040bdd9ab5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9072b4a9-3a09-4361-b2ff-7d040bdd9ab5.selectorLabels" . | nindent 6 }}
