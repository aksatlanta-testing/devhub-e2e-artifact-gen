apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo17f9e9bb-5938-4e65-a344-f507a7c5c3d4.fullname" . }}
  labels:
    {{- include "go-echo17f9e9bb-5938-4e65-a344-f507a7c5c3d4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo17f9e9bb-5938-4e65-a344-f507a7c5c3d4.selectorLabels" . | nindent 6 }}
