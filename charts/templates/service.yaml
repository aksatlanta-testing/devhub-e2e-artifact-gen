apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo420ce6b2-70da-474e-a547-6da1f3e3a050.fullname" . }}
  labels:
    {{- include "go-echo420ce6b2-70da-474e-a547-6da1f3e3a050.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo420ce6b2-70da-474e-a547-6da1f3e3a050.selectorLabels" . | nindent 6 }}
