apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo36d47efb-bac9-42f5-a893-087d2e4b1d32.fullname" . }}
  labels:
    {{- include "go-echo36d47efb-bac9-42f5-a893-087d2e4b1d32.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo36d47efb-bac9-42f5-a893-087d2e4b1d32.selectorLabels" . | nindent 6 }}
