apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo284b6e5d-aa05-458f-a6ee-38694a0e1bec.fullname" . }}
  labels:
    {{- include "go-echo284b6e5d-aa05-458f-a6ee-38694a0e1bec.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo284b6e5d-aa05-458f-a6ee-38694a0e1bec.selectorLabels" . | nindent 6 }}
