apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9928d8aa-6349-4dd7-8936-e61b25be05d5.fullname" . }}
  labels:
    {{- include "go-echo9928d8aa-6349-4dd7-8936-e61b25be05d5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9928d8aa-6349-4dd7-8936-e61b25be05d5.selectorLabels" . | nindent 6 }}
