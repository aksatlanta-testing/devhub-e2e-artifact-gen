apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob2e4841e-edba-464e-8eb7-2eeb66671620.fullname" . }}
  labels:
    {{- include "go-echob2e4841e-edba-464e-8eb7-2eeb66671620.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob2e4841e-edba-464e-8eb7-2eeb66671620.selectorLabels" . | nindent 6 }}
