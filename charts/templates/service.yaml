apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7a5e57e5-31de-45dd-9a4d-d90f23a2cb5b.fullname" . }}
  labels:
    {{- include "go-echo7a5e57e5-31de-45dd-9a4d-d90f23a2cb5b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7a5e57e5-31de-45dd-9a4d-d90f23a2cb5b.selectorLabels" . | nindent 6 }}
