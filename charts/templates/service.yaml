apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoda5e2469-347d-482d-9960-f4a31614eec8.fullname" . }}
  labels:
    {{- include "go-echoda5e2469-347d-482d-9960-f4a31614eec8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoda5e2469-347d-482d-9960-f4a31614eec8.selectorLabels" . | nindent 6 }}
