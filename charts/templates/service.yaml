apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocd38002b-e0a1-42a2-9090-cda94752a433.fullname" . }}
  labels:
    {{- include "go-echocd38002b-e0a1-42a2-9090-cda94752a433.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocd38002b-e0a1-42a2-9090-cda94752a433.selectorLabels" . | nindent 6 }}
