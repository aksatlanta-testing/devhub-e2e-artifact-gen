apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6b371638-2fb0-4820-872d-f72f51d5cccd.fullname" . }}
  labels:
    {{- include "go-echo6b371638-2fb0-4820-872d-f72f51d5cccd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6b371638-2fb0-4820-872d-f72f51d5cccd.selectorLabels" . | nindent 6 }}
