apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo00f47a4e-5723-42f2-a2d1-64a073ff0b7b.fullname" . }}
  labels:
    {{- include "go-echo00f47a4e-5723-42f2-a2d1-64a073ff0b7b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo00f47a4e-5723-42f2-a2d1-64a073ff0b7b.selectorLabels" . | nindent 6 }}
