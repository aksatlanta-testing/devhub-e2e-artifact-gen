apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodd40b707-e0b4-4e1a-86fa-dc9ade74be47.fullname" . }}
  labels:
    {{- include "go-echodd40b707-e0b4-4e1a-86fa-dc9ade74be47.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodd40b707-e0b4-4e1a-86fa-dc9ade74be47.selectorLabels" . | nindent 6 }}
