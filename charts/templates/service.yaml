apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5d5c19c4-f0a4-4bf7-b89f-f54b2227019b.fullname" . }}
  labels:
    {{- include "go-echo5d5c19c4-f0a4-4bf7-b89f-f54b2227019b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5d5c19c4-f0a4-4bf7-b89f-f54b2227019b.selectorLabels" . | nindent 6 }}
