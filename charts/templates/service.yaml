apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo66c29731-c7f7-4cf5-8716-8eb27500624c.fullname" . }}
  labels:
    {{- include "go-echo66c29731-c7f7-4cf5-8716-8eb27500624c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo66c29731-c7f7-4cf5-8716-8eb27500624c.selectorLabels" . | nindent 6 }}
