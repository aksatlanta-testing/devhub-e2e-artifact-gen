apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe28d3719-7ba6-4f34-b838-7063326da22d.fullname" . }}
  labels:
    {{- include "go-echoe28d3719-7ba6-4f34-b838-7063326da22d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe28d3719-7ba6-4f34-b838-7063326da22d.selectorLabels" . | nindent 6 }}
