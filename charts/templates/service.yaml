apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob7227c90-e888-4945-812e-b41d8da0cd0d.fullname" . }}
  labels:
    {{- include "go-echob7227c90-e888-4945-812e-b41d8da0cd0d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob7227c90-e888-4945-812e-b41d8da0cd0d.selectorLabels" . | nindent 6 }}
