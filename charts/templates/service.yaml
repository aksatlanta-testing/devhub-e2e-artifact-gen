apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2c0d0ec0-36f4-436a-a549-c4890c60dafa.fullname" . }}
  labels:
    {{- include "go-echo2c0d0ec0-36f4-436a-a549-c4890c60dafa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2c0d0ec0-36f4-436a-a549-c4890c60dafa.selectorLabels" . | nindent 6 }}
