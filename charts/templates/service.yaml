apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo28cfee12-fec9-4d62-83e1-c62bdd32ec75.fullname" . }}
  labels:
    {{- include "go-echo28cfee12-fec9-4d62-83e1-c62bdd32ec75.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo28cfee12-fec9-4d62-83e1-c62bdd32ec75.selectorLabels" . | nindent 6 }}
