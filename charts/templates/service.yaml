apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8cb865aa-c2a9-4dd3-ae0b-1dad94a3f029.fullname" . }}
  labels:
    {{- include "go-echo8cb865aa-c2a9-4dd3-ae0b-1dad94a3f029.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8cb865aa-c2a9-4dd3-ae0b-1dad94a3f029.selectorLabels" . | nindent 6 }}
