apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5affd6ad-df1f-4f6c-b589-ac0520d22bd6.fullname" . }}
  labels:
    {{- include "go-echo5affd6ad-df1f-4f6c-b589-ac0520d22bd6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5affd6ad-df1f-4f6c-b589-ac0520d22bd6.selectorLabels" . | nindent 6 }}
