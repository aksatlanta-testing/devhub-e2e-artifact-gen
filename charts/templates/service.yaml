apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9dbb2176-9c9c-41af-85ed-0ee2875a9bc5.fullname" . }}
  labels:
    {{- include "go-echo9dbb2176-9c9c-41af-85ed-0ee2875a9bc5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9dbb2176-9c9c-41af-85ed-0ee2875a9bc5.selectorLabels" . | nindent 6 }}
