apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7f483208-2361-4f3d-a118-7d22b5f3743e.fullname" . }}
  labels:
    {{- include "go-echo7f483208-2361-4f3d-a118-7d22b5f3743e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7f483208-2361-4f3d-a118-7d22b5f3743e.selectorLabels" . | nindent 6 }}
