apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo507178db-5578-4a9c-95cc-12d4270ba538.fullname" . }}
  labels:
    {{- include "go-echo507178db-5578-4a9c-95cc-12d4270ba538.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo507178db-5578-4a9c-95cc-12d4270ba538.selectorLabels" . | nindent 6 }}
