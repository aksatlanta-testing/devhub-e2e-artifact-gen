apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobbf54aa3-bbd6-460a-b5be-c3de3ff2ef98.fullname" . }}
  labels:
    {{- include "go-echobbf54aa3-bbd6-460a-b5be-c3de3ff2ef98.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobbf54aa3-bbd6-460a-b5be-c3de3ff2ef98.selectorLabels" . | nindent 6 }}
