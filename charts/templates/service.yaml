apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof353bf36-7af4-4389-8804-0b6cde8ce97e.fullname" . }}
  labels:
    {{- include "go-echof353bf36-7af4-4389-8804-0b6cde8ce97e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof353bf36-7af4-4389-8804-0b6cde8ce97e.selectorLabels" . | nindent 6 }}
