apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0e4e31e0-4651-42ca-bd14-0a728691050c.fullname" . }}
  labels:
    {{- include "go-echo0e4e31e0-4651-42ca-bd14-0a728691050c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0e4e31e0-4651-42ca-bd14-0a728691050c.selectorLabels" . | nindent 6 }}
