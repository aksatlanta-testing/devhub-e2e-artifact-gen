apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof9322d8d-0beb-474e-8520-f3b4b1b45ec7.fullname" . }}
  labels:
    {{- include "go-echof9322d8d-0beb-474e-8520-f3b4b1b45ec7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof9322d8d-0beb-474e-8520-f3b4b1b45ec7.selectorLabels" . | nindent 6 }}
