apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof155a0b3-5af1-4b11-a2a0-51e6ced3d790.fullname" . }}
  labels:
    {{- include "go-echof155a0b3-5af1-4b11-a2a0-51e6ced3d790.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof155a0b3-5af1-4b11-a2a0-51e6ced3d790.selectorLabels" . | nindent 6 }}
