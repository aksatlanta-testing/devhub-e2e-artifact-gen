apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo68740414-a46a-4701-821a-9466b036be1d.fullname" . }}
  labels:
    {{- include "go-echo68740414-a46a-4701-821a-9466b036be1d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo68740414-a46a-4701-821a-9466b036be1d.selectorLabels" . | nindent 6 }}
