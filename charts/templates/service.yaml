apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8f376889-1d13-4f0b-a886-2a59a9041ba5.fullname" . }}
  labels:
    {{- include "go-echo8f376889-1d13-4f0b-a886-2a59a9041ba5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8f376889-1d13-4f0b-a886-2a59a9041ba5.selectorLabels" . | nindent 6 }}
