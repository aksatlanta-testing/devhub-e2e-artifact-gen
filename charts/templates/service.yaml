apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc482f254-ae2d-44fe-bdbe-f3b4e923a912.fullname" . }}
  labels:
    {{- include "go-echoc482f254-ae2d-44fe-bdbe-f3b4e923a912.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc482f254-ae2d-44fe-bdbe-f3b4e923a912.selectorLabels" . | nindent 6 }}
