apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob567c521-f45a-4b1f-a0fd-609c9587a0e9.fullname" . }}
  labels:
    {{- include "go-echob567c521-f45a-4b1f-a0fd-609c9587a0e9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob567c521-f45a-4b1f-a0fd-609c9587a0e9.selectorLabels" . | nindent 6 }}
