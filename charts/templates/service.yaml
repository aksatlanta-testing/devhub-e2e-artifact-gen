apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa8baa2f4-ee6f-4f12-9e44-3950e3954d65.fullname" . }}
  labels:
    {{- include "go-echoa8baa2f4-ee6f-4f12-9e44-3950e3954d65.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa8baa2f4-ee6f-4f12-9e44-3950e3954d65.selectorLabels" . | nindent 6 }}
