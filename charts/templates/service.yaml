apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo286f4075-d8fb-40e8-a476-2ae9fbb780d3.fullname" . }}
  labels:
    {{- include "go-echo286f4075-d8fb-40e8-a476-2ae9fbb780d3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo286f4075-d8fb-40e8-a476-2ae9fbb780d3.selectorLabels" . | nindent 6 }}
