apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoae88dcb9-25ea-4190-a55f-2979f3b18041.fullname" . }}
  labels:
    {{- include "go-echoae88dcb9-25ea-4190-a55f-2979f3b18041.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoae88dcb9-25ea-4190-a55f-2979f3b18041.selectorLabels" . | nindent 6 }}
