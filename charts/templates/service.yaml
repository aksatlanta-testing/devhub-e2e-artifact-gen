apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6da48bb5-7058-4e25-aa02-fc540661e4f8.fullname" . }}
  labels:
    {{- include "go-echo6da48bb5-7058-4e25-aa02-fc540661e4f8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6da48bb5-7058-4e25-aa02-fc540661e4f8.selectorLabels" . | nindent 6 }}
