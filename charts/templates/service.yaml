apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe2e2025a-8b8f-4a78-92ec-a4f811ac90af.fullname" . }}
  labels:
    {{- include "go-echoe2e2025a-8b8f-4a78-92ec-a4f811ac90af.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe2e2025a-8b8f-4a78-92ec-a4f811ac90af.selectorLabels" . | nindent 6 }}
