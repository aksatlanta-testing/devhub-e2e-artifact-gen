apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo37890f88-e127-4166-85bc-2443aff3aab7.fullname" . }}
  labels:
    {{- include "go-echo37890f88-e127-4166-85bc-2443aff3aab7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo37890f88-e127-4166-85bc-2443aff3aab7.selectorLabels" . | nindent 6 }}
