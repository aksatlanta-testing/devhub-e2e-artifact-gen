apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc98d5437-1616-4ffa-ae3f-60ff334ab720.fullname" . }}
  labels:
    {{- include "go-echoc98d5437-1616-4ffa-ae3f-60ff334ab720.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc98d5437-1616-4ffa-ae3f-60ff334ab720.selectorLabels" . | nindent 6 }}
