apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2f26c28f-cd9f-4019-ac82-641a6e1a8a1a.fullname" . }}
  labels:
    {{- include "go-echo2f26c28f-cd9f-4019-ac82-641a6e1a8a1a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2f26c28f-cd9f-4019-ac82-641a6e1a8a1a.selectorLabels" . | nindent 6 }}
