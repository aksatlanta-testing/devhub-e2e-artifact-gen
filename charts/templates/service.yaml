apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc64cf816-da6d-4e34-b0c9-af55fe4b2534.fullname" . }}
  labels:
    {{- include "go-echoc64cf816-da6d-4e34-b0c9-af55fe4b2534.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc64cf816-da6d-4e34-b0c9-af55fe4b2534.selectorLabels" . | nindent 6 }}
