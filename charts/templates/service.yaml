apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3ab7d00c-1f29-40f7-8e7b-43fdbc28d40c.fullname" . }}
  labels:
    {{- include "go-echo3ab7d00c-1f29-40f7-8e7b-43fdbc28d40c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3ab7d00c-1f29-40f7-8e7b-43fdbc28d40c.selectorLabels" . | nindent 6 }}
