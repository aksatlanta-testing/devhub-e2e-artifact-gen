apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe84ff869-b17c-4c75-9bf7-a865cb69f791.fullname" . }}
  labels:
    {{- include "go-echoe84ff869-b17c-4c75-9bf7-a865cb69f791.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe84ff869-b17c-4c75-9bf7-a865cb69f791.selectorLabels" . | nindent 6 }}
