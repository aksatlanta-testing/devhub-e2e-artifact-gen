apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2d771ab2-829e-4fec-b85d-6cba28815dce.fullname" . }}
  labels:
    {{- include "go-echo2d771ab2-829e-4fec-b85d-6cba28815dce.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2d771ab2-829e-4fec-b85d-6cba28815dce.selectorLabels" . | nindent 6 }}
