apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodde78dbb-12b6-41bf-842c-e5424958ecf4.fullname" . }}
  labels:
    {{- include "go-echodde78dbb-12b6-41bf-842c-e5424958ecf4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodde78dbb-12b6-41bf-842c-e5424958ecf4.selectorLabels" . | nindent 6 }}
