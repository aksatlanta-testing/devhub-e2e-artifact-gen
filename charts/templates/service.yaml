apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0a3eefff-f4bc-4209-a084-8d375dc6e4ce.fullname" . }}
  labels:
    {{- include "go-echo0a3eefff-f4bc-4209-a084-8d375dc6e4ce.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0a3eefff-f4bc-4209-a084-8d375dc6e4ce.selectorLabels" . | nindent 6 }}
