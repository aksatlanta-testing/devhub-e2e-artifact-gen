apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0afb2223-8e93-4a29-ba04-4369027903a0.fullname" . }}
  labels:
    {{- include "go-echo0afb2223-8e93-4a29-ba04-4369027903a0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0afb2223-8e93-4a29-ba04-4369027903a0.selectorLabels" . | nindent 6 }}
