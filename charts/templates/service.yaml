apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4101fde9-6b2c-4d01-a626-f9dcf08b7f69.fullname" . }}
  labels:
    {{- include "go-echo4101fde9-6b2c-4d01-a626-f9dcf08b7f69.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4101fde9-6b2c-4d01-a626-f9dcf08b7f69.selectorLabels" . | nindent 6 }}
