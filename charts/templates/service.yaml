apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8f8a4378-9397-4894-92db-07a2e1d0d750.fullname" . }}
  labels:
    {{- include "go-echo8f8a4378-9397-4894-92db-07a2e1d0d750.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8f8a4378-9397-4894-92db-07a2e1d0d750.selectorLabels" . | nindent 6 }}
