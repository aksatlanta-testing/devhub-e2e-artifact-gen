apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo68d3e746-1053-4e90-8aac-2c22b0342bda.fullname" . }}
  labels:
    {{- include "go-echo68d3e746-1053-4e90-8aac-2c22b0342bda.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo68d3e746-1053-4e90-8aac-2c22b0342bda.selectorLabels" . | nindent 6 }}
