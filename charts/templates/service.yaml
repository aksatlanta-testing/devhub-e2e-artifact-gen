apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo251d38cc-3cbe-4471-a53a-b48f2a5800aa.fullname" . }}
  labels:
    {{- include "go-echo251d38cc-3cbe-4471-a53a-b48f2a5800aa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo251d38cc-3cbe-4471-a53a-b48f2a5800aa.selectorLabels" . | nindent 6 }}
