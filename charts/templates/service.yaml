apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0cf89a2a-197e-46dc-bb74-470e5c1d0e2f.fullname" . }}
  labels:
    {{- include "go-echo0cf89a2a-197e-46dc-bb74-470e5c1d0e2f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0cf89a2a-197e-46dc-bb74-470e5c1d0e2f.selectorLabels" . | nindent 6 }}
