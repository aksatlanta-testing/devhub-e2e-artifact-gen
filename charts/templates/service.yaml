apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4742fd04-900e-4276-9a8c-502b2e58700e.fullname" . }}
  labels:
    {{- include "go-echo4742fd04-900e-4276-9a8c-502b2e58700e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4742fd04-900e-4276-9a8c-502b2e58700e.selectorLabels" . | nindent 6 }}
