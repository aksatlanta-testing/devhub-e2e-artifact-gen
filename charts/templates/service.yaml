apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob229f445-7a32-4f11-9a28-53a83b9f9a70.fullname" . }}
  labels:
    {{- include "go-echob229f445-7a32-4f11-9a28-53a83b9f9a70.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob229f445-7a32-4f11-9a28-53a83b9f9a70.selectorLabels" . | nindent 6 }}
