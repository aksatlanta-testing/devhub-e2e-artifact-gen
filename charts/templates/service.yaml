apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc7b9145a-5dd7-4e4f-9daf-4e719b9c9178.fullname" . }}
  labels:
    {{- include "go-echoc7b9145a-5dd7-4e4f-9daf-4e719b9c9178.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc7b9145a-5dd7-4e4f-9daf-4e719b9c9178.selectorLabels" . | nindent 6 }}
