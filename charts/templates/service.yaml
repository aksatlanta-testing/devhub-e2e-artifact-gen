apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5ea51a6d-78c8-4090-9655-396f1f74eb3f.fullname" . }}
  labels:
    {{- include "go-echo5ea51a6d-78c8-4090-9655-396f1f74eb3f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5ea51a6d-78c8-4090-9655-396f1f74eb3f.selectorLabels" . | nindent 6 }}
