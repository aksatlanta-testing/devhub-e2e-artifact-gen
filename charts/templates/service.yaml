apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobc0bc1c8-247d-4670-b2f5-c34cafbc8f23.fullname" . }}
  labels:
    {{- include "go-echobc0bc1c8-247d-4670-b2f5-c34cafbc8f23.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobc0bc1c8-247d-4670-b2f5-c34cafbc8f23.selectorLabels" . | nindent 6 }}
