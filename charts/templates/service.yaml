apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5d2798b0-c635-4517-a4a3-5aadc3753d05.fullname" . }}
  labels:
    {{- include "go-echo5d2798b0-c635-4517-a4a3-5aadc3753d05.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5d2798b0-c635-4517-a4a3-5aadc3753d05.selectorLabels" . | nindent 6 }}
