apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodd9edfc1-cfe8-4b57-a75d-6008dc2f38f5.fullname" . }}
  labels:
    {{- include "go-echodd9edfc1-cfe8-4b57-a75d-6008dc2f38f5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodd9edfc1-cfe8-4b57-a75d-6008dc2f38f5.selectorLabels" . | nindent 6 }}
