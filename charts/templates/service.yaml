apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo43acdb69-955f-4a19-a17f-9f3beb35faa0.fullname" . }}
  labels:
    {{- include "go-echo43acdb69-955f-4a19-a17f-9f3beb35faa0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo43acdb69-955f-4a19-a17f-9f3beb35faa0.selectorLabels" . | nindent 6 }}
