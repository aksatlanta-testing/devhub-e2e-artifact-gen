apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof7841cbd-260e-465d-9d19-ff00190ffb10.fullname" . }}
  labels:
    {{- include "go-echof7841cbd-260e-465d-9d19-ff00190ffb10.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof7841cbd-260e-465d-9d19-ff00190ffb10.selectorLabels" . | nindent 6 }}
