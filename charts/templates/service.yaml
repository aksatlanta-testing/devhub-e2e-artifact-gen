apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9252f60f-286c-403e-a716-5fce32f74488.fullname" . }}
  labels:
    {{- include "go-echo9252f60f-286c-403e-a716-5fce32f74488.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9252f60f-286c-403e-a716-5fce32f74488.selectorLabels" . | nindent 6 }}
