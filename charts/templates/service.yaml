apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5c217495-46ac-4e56-8251-4e78a2bd9dbd.fullname" . }}
  labels:
    {{- include "go-echo5c217495-46ac-4e56-8251-4e78a2bd9dbd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5c217495-46ac-4e56-8251-4e78a2bd9dbd.selectorLabels" . | nindent 6 }}
