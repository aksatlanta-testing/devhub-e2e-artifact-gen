apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo70b57e8a-83f7-470d-a1b3-31b5a3322fe7.fullname" . }}
  labels:
    {{- include "go-echo70b57e8a-83f7-470d-a1b3-31b5a3322fe7.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo70b57e8a-83f7-470d-a1b3-31b5a3322fe7.selectorLabels" . | nindent 6 }}
