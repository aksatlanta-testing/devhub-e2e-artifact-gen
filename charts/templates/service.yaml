apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoca2e8537-216b-4f8a-8c2a-a74ec556dca0.fullname" . }}
  labels:
    {{- include "go-echoca2e8537-216b-4f8a-8c2a-a74ec556dca0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoca2e8537-216b-4f8a-8c2a-a74ec556dca0.selectorLabels" . | nindent 6 }}
