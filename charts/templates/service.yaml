apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9f8a0a28-b198-4954-971f-8e624920a736.fullname" . }}
  labels:
    {{- include "go-echo9f8a0a28-b198-4954-971f-8e624920a736.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9f8a0a28-b198-4954-971f-8e624920a736.selectorLabels" . | nindent 6 }}
