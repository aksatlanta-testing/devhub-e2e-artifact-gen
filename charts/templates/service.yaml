apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobef7f669-81cd-4bad-8fc0-9898f9d652cf.fullname" . }}
  labels:
    {{- include "go-echobef7f669-81cd-4bad-8fc0-9898f9d652cf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobef7f669-81cd-4bad-8fc0-9898f9d652cf.selectorLabels" . | nindent 6 }}
