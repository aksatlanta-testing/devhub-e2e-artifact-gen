apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo167e5a90-6d01-459f-8cdf-6c97bced3997.fullname" . }}
  labels:
    {{- include "go-echo167e5a90-6d01-459f-8cdf-6c97bced3997.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo167e5a90-6d01-459f-8cdf-6c97bced3997.selectorLabels" . | nindent 6 }}
