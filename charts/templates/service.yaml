apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob4499324-e232-4719-8c7d-955e248cf8b4.fullname" . }}
  labels:
    {{- include "go-echob4499324-e232-4719-8c7d-955e248cf8b4.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob4499324-e232-4719-8c7d-955e248cf8b4.selectorLabels" . | nindent 6 }}
