apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2042ecba-d6b3-492e-893a-b6b28a95c4c4.fullname" . }}
  labels:
    {{- include "go-echo2042ecba-d6b3-492e-893a-b6b28a95c4c4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2042ecba-d6b3-492e-893a-b6b28a95c4c4.selectorLabels" . | nindent 6 }}
