apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo371e477a-a596-4e5a-a5ef-93c53aec4c60.fullname" . }}
  labels:
    {{- include "go-echo371e477a-a596-4e5a-a5ef-93c53aec4c60.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo371e477a-a596-4e5a-a5ef-93c53aec4c60.selectorLabels" . | nindent 6 }}
