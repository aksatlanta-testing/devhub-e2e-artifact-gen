apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa1ffcd0a-6ec7-4273-afce-61dbb8565dfd.fullname" . }}
  labels:
    {{- include "go-echoa1ffcd0a-6ec7-4273-afce-61dbb8565dfd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa1ffcd0a-6ec7-4273-afce-61dbb8565dfd.selectorLabels" . | nindent 6 }}
