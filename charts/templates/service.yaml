apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofea68de1-135d-49f8-8445-e614f0682d64.fullname" . }}
  labels:
    {{- include "go-echofea68de1-135d-49f8-8445-e614f0682d64.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofea68de1-135d-49f8-8445-e614f0682d64.selectorLabels" . | nindent 6 }}
