apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0fe9f197-29d2-4c68-9090-ce279d7dcec3.fullname" . }}
  labels:
    {{- include "go-echo0fe9f197-29d2-4c68-9090-ce279d7dcec3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0fe9f197-29d2-4c68-9090-ce279d7dcec3.selectorLabels" . | nindent 6 }}
