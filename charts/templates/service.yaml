apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo45ee5152-6b28-482f-a973-eff09e2feb7b.fullname" . }}
  labels:
    {{- include "go-echo45ee5152-6b28-482f-a973-eff09e2feb7b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo45ee5152-6b28-482f-a973-eff09e2feb7b.selectorLabels" . | nindent 6 }}
