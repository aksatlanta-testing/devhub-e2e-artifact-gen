apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoedcbeb1a-6972-4ad7-9d21-4c8bd96823b9.fullname" . }}
  labels:
    {{- include "go-echoedcbeb1a-6972-4ad7-9d21-4c8bd96823b9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoedcbeb1a-6972-4ad7-9d21-4c8bd96823b9.selectorLabels" . | nindent 6 }}
