apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe8aad645-7754-45b6-aea1-789358e30552.fullname" . }}
  labels:
    {{- include "go-echoe8aad645-7754-45b6-aea1-789358e30552.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe8aad645-7754-45b6-aea1-789358e30552.selectorLabels" . | nindent 6 }}
