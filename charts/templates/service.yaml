apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo59e1815d-49cf-4982-9423-b6aa9acce938.fullname" . }}
  labels:
    {{- include "go-echo59e1815d-49cf-4982-9423-b6aa9acce938.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo59e1815d-49cf-4982-9423-b6aa9acce938.selectorLabels" . | nindent 6 }}
