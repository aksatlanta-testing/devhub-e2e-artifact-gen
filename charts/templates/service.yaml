apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo90b3a31f-8e12-4027-a65c-5f51c34a0527.fullname" . }}
  labels:
    {{- include "go-echo90b3a31f-8e12-4027-a65c-5f51c34a0527.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo90b3a31f-8e12-4027-a65c-5f51c34a0527.selectorLabels" . | nindent 6 }}
