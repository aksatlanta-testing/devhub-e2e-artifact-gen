apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5891aac4-7b45-46ed-8a31-5ca882f486d1.fullname" . }}
  labels:
    {{- include "go-echo5891aac4-7b45-46ed-8a31-5ca882f486d1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5891aac4-7b45-46ed-8a31-5ca882f486d1.selectorLabels" . | nindent 6 }}
