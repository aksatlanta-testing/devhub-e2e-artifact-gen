apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8c46e0f8-343b-44a3-ac86-6c45d9283f19.fullname" . }}
  labels:
    {{- include "go-echo8c46e0f8-343b-44a3-ac86-6c45d9283f19.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8c46e0f8-343b-44a3-ac86-6c45d9283f19.selectorLabels" . | nindent 6 }}
