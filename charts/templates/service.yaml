apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7a691a41-939f-4086-82fa-e57e7046ff81.fullname" . }}
  labels:
    {{- include "go-echo7a691a41-939f-4086-82fa-e57e7046ff81.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7a691a41-939f-4086-82fa-e57e7046ff81.selectorLabels" . | nindent 6 }}
