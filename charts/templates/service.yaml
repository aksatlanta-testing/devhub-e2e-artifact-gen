apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0dbe0cd8-6edd-4254-b8c3-d30816802bf4.fullname" . }}
  labels:
    {{- include "go-echo0dbe0cd8-6edd-4254-b8c3-d30816802bf4.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0dbe0cd8-6edd-4254-b8c3-d30816802bf4.selectorLabels" . | nindent 6 }}
