apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo34dd90d3-7d17-4890-8d0a-f93281b62719.fullname" . }}
  labels:
    {{- include "go-echo34dd90d3-7d17-4890-8d0a-f93281b62719.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo34dd90d3-7d17-4890-8d0a-f93281b62719.selectorLabels" . | nindent 6 }}
