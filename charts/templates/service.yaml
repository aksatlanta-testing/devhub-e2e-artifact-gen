apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo479dfe4e-3ac7-48b6-bec6-865ea010953c.fullname" . }}
  labels:
    {{- include "go-echo479dfe4e-3ac7-48b6-bec6-865ea010953c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo479dfe4e-3ac7-48b6-bec6-865ea010953c.selectorLabels" . | nindent 6 }}
