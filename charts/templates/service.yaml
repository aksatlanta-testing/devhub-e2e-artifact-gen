apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod7660da5-0318-40fc-b890-1c5096a88367.fullname" . }}
  labels:
    {{- include "go-echod7660da5-0318-40fc-b890-1c5096a88367.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod7660da5-0318-40fc-b890-1c5096a88367.selectorLabels" . | nindent 6 }}
