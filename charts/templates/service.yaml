apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo92ebf8c6-5ea5-4cd7-8868-f3268d7bb18f.fullname" . }}
  labels:
    {{- include "go-echo92ebf8c6-5ea5-4cd7-8868-f3268d7bb18f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo92ebf8c6-5ea5-4cd7-8868-f3268d7bb18f.selectorLabels" . | nindent 6 }}
