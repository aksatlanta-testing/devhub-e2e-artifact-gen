apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof1b363e3-77ef-4655-ba01-ba770090c33e.fullname" . }}
  labels:
    {{- include "go-echof1b363e3-77ef-4655-ba01-ba770090c33e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof1b363e3-77ef-4655-ba01-ba770090c33e.selectorLabels" . | nindent 6 }}
