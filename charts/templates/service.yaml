apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa769e623-d1f3-44fb-8e9f-6554a6e309a9.fullname" . }}
  labels:
    {{- include "go-echoa769e623-d1f3-44fb-8e9f-6554a6e309a9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa769e623-d1f3-44fb-8e9f-6554a6e309a9.selectorLabels" . | nindent 6 }}
