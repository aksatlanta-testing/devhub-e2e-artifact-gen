apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1672f310-bf77-411b-a621-650bb9454591.fullname" . }}
  labels:
    {{- include "go-echo1672f310-bf77-411b-a621-650bb9454591.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1672f310-bf77-411b-a621-650bb9454591.selectorLabels" . | nindent 6 }}
