apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod240f953-a9e1-408a-9673-d433f54d2b8a.fullname" . }}
  labels:
    {{- include "go-echod240f953-a9e1-408a-9673-d433f54d2b8a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod240f953-a9e1-408a-9673-d433f54d2b8a.selectorLabels" . | nindent 6 }}
