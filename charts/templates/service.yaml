apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod7b5da22-0e7f-4aaa-94c5-fc133166232e.fullname" . }}
  labels:
    {{- include "go-echod7b5da22-0e7f-4aaa-94c5-fc133166232e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod7b5da22-0e7f-4aaa-94c5-fc133166232e.selectorLabels" . | nindent 6 }}
