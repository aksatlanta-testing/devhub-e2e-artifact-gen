apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo23a228af-4ec3-4600-ad14-45fed1a6a66b.fullname" . }}
  labels:
    {{- include "go-echo23a228af-4ec3-4600-ad14-45fed1a6a66b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo23a228af-4ec3-4600-ad14-45fed1a6a66b.selectorLabels" . | nindent 6 }}
