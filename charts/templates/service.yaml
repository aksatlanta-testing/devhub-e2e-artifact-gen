apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoec018876-3b5d-4042-8655-5267099f667e.fullname" . }}
  labels:
    {{- include "go-echoec018876-3b5d-4042-8655-5267099f667e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoec018876-3b5d-4042-8655-5267099f667e.selectorLabels" . | nindent 6 }}
