apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo97dc6493-2733-4d84-a6ad-913ef51ad224.fullname" . }}
  labels:
    {{- include "go-echo97dc6493-2733-4d84-a6ad-913ef51ad224.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo97dc6493-2733-4d84-a6ad-913ef51ad224.selectorLabels" . | nindent 6 }}
