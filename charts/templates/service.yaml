apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof97daca9-f48c-4a70-a7a8-db5ee5a1561e.fullname" . }}
  labels:
    {{- include "go-echof97daca9-f48c-4a70-a7a8-db5ee5a1561e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof97daca9-f48c-4a70-a7a8-db5ee5a1561e.selectorLabels" . | nindent 6 }}
