apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob9764115-4610-464d-bb15-451588e222c4.fullname" . }}
  labels:
    {{- include "go-echob9764115-4610-464d-bb15-451588e222c4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob9764115-4610-464d-bb15-451588e222c4.selectorLabels" . | nindent 6 }}
