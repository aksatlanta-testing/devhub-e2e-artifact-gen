apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob0f72eab-6089-40af-a7af-e6d07a4351d1.fullname" . }}
  labels:
    {{- include "go-echob0f72eab-6089-40af-a7af-e6d07a4351d1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob0f72eab-6089-40af-a7af-e6d07a4351d1.selectorLabels" . | nindent 6 }}
