apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo817565e3-1f27-454d-b7d2-698a391c9288.fullname" . }}
  labels:
    {{- include "go-echo817565e3-1f27-454d-b7d2-698a391c9288.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo817565e3-1f27-454d-b7d2-698a391c9288.selectorLabels" . | nindent 6 }}
