apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof455f1e7-40c1-4ac3-9431-5b9a73a42d48.fullname" . }}
  labels:
    {{- include "go-echof455f1e7-40c1-4ac3-9431-5b9a73a42d48.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof455f1e7-40c1-4ac3-9431-5b9a73a42d48.selectorLabels" . | nindent 6 }}
