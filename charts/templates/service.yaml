apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobbd5c749-234d-4361-bc1d-b2ac5652c8a1.fullname" . }}
  labels:
    {{- include "go-echobbd5c749-234d-4361-bc1d-b2ac5652c8a1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobbd5c749-234d-4361-bc1d-b2ac5652c8a1.selectorLabels" . | nindent 6 }}
