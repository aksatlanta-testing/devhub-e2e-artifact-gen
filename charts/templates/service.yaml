apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodebfc90e-2bab-433b-b913-8f0947e22889.fullname" . }}
  labels:
    {{- include "go-echodebfc90e-2bab-433b-b913-8f0947e22889.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodebfc90e-2bab-433b-b913-8f0947e22889.selectorLabels" . | nindent 6 }}
