apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1d57b9f0-aa4e-4d6c-9c9e-00f5a5b52032.fullname" . }}
  labels:
    {{- include "go-echo1d57b9f0-aa4e-4d6c-9c9e-00f5a5b52032.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1d57b9f0-aa4e-4d6c-9c9e-00f5a5b52032.selectorLabels" . | nindent 6 }}
