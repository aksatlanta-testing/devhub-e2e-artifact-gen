apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa6d39fd8-f0bd-4cbd-86be-89dcb3bf71c7.fullname" . }}
  labels:
    {{- include "go-echoa6d39fd8-f0bd-4cbd-86be-89dcb3bf71c7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa6d39fd8-f0bd-4cbd-86be-89dcb3bf71c7.selectorLabels" . | nindent 6 }}
