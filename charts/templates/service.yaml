apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2161b7ea-0bf7-4cac-b456-91dab3e35498.fullname" . }}
  labels:
    {{- include "go-echo2161b7ea-0bf7-4cac-b456-91dab3e35498.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2161b7ea-0bf7-4cac-b456-91dab3e35498.selectorLabels" . | nindent 6 }}
