apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobe513188-726b-4411-9998-d3cb90ed2dec.fullname" . }}
  labels:
    {{- include "go-echobe513188-726b-4411-9998-d3cb90ed2dec.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobe513188-726b-4411-9998-d3cb90ed2dec.selectorLabels" . | nindent 6 }}
