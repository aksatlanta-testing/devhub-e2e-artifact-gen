apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa0ef71d0-95c3-4ad3-8544-1d8cca0f5462.fullname" . }}
  labels:
    {{- include "go-echoa0ef71d0-95c3-4ad3-8544-1d8cca0f5462.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa0ef71d0-95c3-4ad3-8544-1d8cca0f5462.selectorLabels" . | nindent 6 }}
