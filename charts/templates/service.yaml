apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3642de1c-bea7-4639-98f4-3169a51300a0.fullname" . }}
  labels:
    {{- include "go-echo3642de1c-bea7-4639-98f4-3169a51300a0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3642de1c-bea7-4639-98f4-3169a51300a0.selectorLabels" . | nindent 6 }}
