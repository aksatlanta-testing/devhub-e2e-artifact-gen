apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5e8e012b-5005-4c98-bbfc-9b895ad76cc8.fullname" . }}
  labels:
    {{- include "go-echo5e8e012b-5005-4c98-bbfc-9b895ad76cc8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5e8e012b-5005-4c98-bbfc-9b895ad76cc8.selectorLabels" . | nindent 6 }}
