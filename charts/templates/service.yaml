apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo66a9f95e-2300-48fd-b947-d78ebf3d89b6.fullname" . }}
  labels:
    {{- include "go-echo66a9f95e-2300-48fd-b947-d78ebf3d89b6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo66a9f95e-2300-48fd-b947-d78ebf3d89b6.selectorLabels" . | nindent 6 }}
