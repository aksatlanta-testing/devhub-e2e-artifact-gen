apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo23f6cee0-728e-4940-9c77-cda5f1f81f56.fullname" . }}
  labels:
    {{- include "go-echo23f6cee0-728e-4940-9c77-cda5f1f81f56.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo23f6cee0-728e-4940-9c77-cda5f1f81f56.selectorLabels" . | nindent 6 }}
