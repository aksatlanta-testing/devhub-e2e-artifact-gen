apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocfa8e1bc-c912-40ea-8175-8e97e77da481.fullname" . }}
  labels:
    {{- include "go-echocfa8e1bc-c912-40ea-8175-8e97e77da481.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocfa8e1bc-c912-40ea-8175-8e97e77da481.selectorLabels" . | nindent 6 }}
