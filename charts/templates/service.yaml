apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoac559a81-acb1-45cc-9a71-ce51541c931a.fullname" . }}
  labels:
    {{- include "go-echoac559a81-acb1-45cc-9a71-ce51541c931a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoac559a81-acb1-45cc-9a71-ce51541c931a.selectorLabels" . | nindent 6 }}
