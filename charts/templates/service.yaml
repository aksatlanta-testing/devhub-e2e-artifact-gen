apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1ab5630e-3a09-4adb-8531-32b472843ec4.fullname" . }}
  labels:
    {{- include "go-echo1ab5630e-3a09-4adb-8531-32b472843ec4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1ab5630e-3a09-4adb-8531-32b472843ec4.selectorLabels" . | nindent 6 }}
