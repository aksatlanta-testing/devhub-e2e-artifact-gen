apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocf3cba86-c22b-40dc-8b3f-18c6f26c1107.fullname" . }}
  labels:
    {{- include "go-echocf3cba86-c22b-40dc-8b3f-18c6f26c1107.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocf3cba86-c22b-40dc-8b3f-18c6f26c1107.selectorLabels" . | nindent 6 }}
