apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo923e1104-df54-4844-80b2-bc42ff59985e.fullname" . }}
  labels:
    {{- include "go-echo923e1104-df54-4844-80b2-bc42ff59985e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo923e1104-df54-4844-80b2-bc42ff59985e.selectorLabels" . | nindent 6 }}
