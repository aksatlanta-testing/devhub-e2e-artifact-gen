apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe51bad02-7937-4d9c-9805-1fdcc936c471.fullname" . }}
  labels:
    {{- include "go-echoe51bad02-7937-4d9c-9805-1fdcc936c471.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe51bad02-7937-4d9c-9805-1fdcc936c471.selectorLabels" . | nindent 6 }}
