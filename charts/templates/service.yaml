apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo192efdd3-ace3-4fb9-a517-de2ac401282f.fullname" . }}
  labels:
    {{- include "go-echo192efdd3-ace3-4fb9-a517-de2ac401282f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo192efdd3-ace3-4fb9-a517-de2ac401282f.selectorLabels" . | nindent 6 }}
