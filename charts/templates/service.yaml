apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo021cb11d-ca9d-4f66-a8b6-3bbc8690d9ba.fullname" . }}
  labels:
    {{- include "go-echo021cb11d-ca9d-4f66-a8b6-3bbc8690d9ba.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo021cb11d-ca9d-4f66-a8b6-3bbc8690d9ba.selectorLabels" . | nindent 6 }}
