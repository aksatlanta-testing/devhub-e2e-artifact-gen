apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo542801ff-649d-4706-a697-48600681b12c.fullname" . }}
  labels:
    {{- include "go-echo542801ff-649d-4706-a697-48600681b12c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo542801ff-649d-4706-a697-48600681b12c.selectorLabels" . | nindent 6 }}
