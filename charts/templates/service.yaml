apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3abb4007-1597-4a02-bf7f-ce5942a4a7dd.fullname" . }}
  labels:
    {{- include "go-echo3abb4007-1597-4a02-bf7f-ce5942a4a7dd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3abb4007-1597-4a02-bf7f-ce5942a4a7dd.selectorLabels" . | nindent 6 }}
