apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoecf48ca3-11da-442a-9599-6fea933ce473.fullname" . }}
  labels:
    {{- include "go-echoecf48ca3-11da-442a-9599-6fea933ce473.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoecf48ca3-11da-442a-9599-6fea933ce473.selectorLabels" . | nindent 6 }}
