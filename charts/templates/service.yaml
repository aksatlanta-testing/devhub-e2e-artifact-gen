apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5727fc25-fa05-4c1f-b8cb-23a21d3524db.fullname" . }}
  labels:
    {{- include "go-echo5727fc25-fa05-4c1f-b8cb-23a21d3524db.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5727fc25-fa05-4c1f-b8cb-23a21d3524db.selectorLabels" . | nindent 6 }}
