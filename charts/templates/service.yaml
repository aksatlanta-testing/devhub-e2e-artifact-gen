apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo57142e93-fddf-4532-84cf-6cb7f6dd13cf.fullname" . }}
  labels:
    {{- include "go-echo57142e93-fddf-4532-84cf-6cb7f6dd13cf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo57142e93-fddf-4532-84cf-6cb7f6dd13cf.selectorLabels" . | nindent 6 }}
