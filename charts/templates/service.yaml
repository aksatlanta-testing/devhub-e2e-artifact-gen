apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof97dc71e-4fb3-4fcd-a067-e760a103a6b5.fullname" . }}
  labels:
    {{- include "go-echof97dc71e-4fb3-4fcd-a067-e760a103a6b5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof97dc71e-4fb3-4fcd-a067-e760a103a6b5.selectorLabels" . | nindent 6 }}
