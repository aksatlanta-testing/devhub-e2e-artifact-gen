apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo17722888-b4e7-4e94-9d3a-3c330ce73d26.fullname" . }}
  labels:
    {{- include "go-echo17722888-b4e7-4e94-9d3a-3c330ce73d26.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo17722888-b4e7-4e94-9d3a-3c330ce73d26.selectorLabels" . | nindent 6 }}
