apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo51414c95-7f9e-4cfa-8fa5-55ce908216dc.fullname" . }}
  labels:
    {{- include "go-echo51414c95-7f9e-4cfa-8fa5-55ce908216dc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo51414c95-7f9e-4cfa-8fa5-55ce908216dc.selectorLabels" . | nindent 6 }}
