apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo38fb983c-9239-4673-bede-5fb225b5aace.fullname" . }}
  labels:
    {{- include "go-echo38fb983c-9239-4673-bede-5fb225b5aace.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo38fb983c-9239-4673-bede-5fb225b5aace.selectorLabels" . | nindent 6 }}
