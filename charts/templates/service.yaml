apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe8e8db85-45a7-41f4-ad5b-d170b23641cc.fullname" . }}
  labels:
    {{- include "go-echoe8e8db85-45a7-41f4-ad5b-d170b23641cc.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe8e8db85-45a7-41f4-ad5b-d170b23641cc.selectorLabels" . | nindent 6 }}
