apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob1755b07-0b63-4130-a49a-1fa755933e76.fullname" . }}
  labels:
    {{- include "go-echob1755b07-0b63-4130-a49a-1fa755933e76.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob1755b07-0b63-4130-a49a-1fa755933e76.selectorLabels" . | nindent 6 }}
