apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2fb535a0-3084-4301-8fa5-b7ab67568f28.fullname" . }}
  labels:
    {{- include "go-echo2fb535a0-3084-4301-8fa5-b7ab67568f28.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2fb535a0-3084-4301-8fa5-b7ab67568f28.selectorLabels" . | nindent 6 }}
