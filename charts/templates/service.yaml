apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8c10f6d8-0e35-4be4-bf75-72ae32370efb.fullname" . }}
  labels:
    {{- include "go-echo8c10f6d8-0e35-4be4-bf75-72ae32370efb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8c10f6d8-0e35-4be4-bf75-72ae32370efb.selectorLabels" . | nindent 6 }}
