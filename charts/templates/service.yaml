apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof203cfa8-b25e-4e1f-a9dc-5229eb35ea83.fullname" . }}
  labels:
    {{- include "go-echof203cfa8-b25e-4e1f-a9dc-5229eb35ea83.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof203cfa8-b25e-4e1f-a9dc-5229eb35ea83.selectorLabels" . | nindent 6 }}
