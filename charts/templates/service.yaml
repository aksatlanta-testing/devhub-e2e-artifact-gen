apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo916e6754-1233-4543-a8ba-d49309998f99.fullname" . }}
  labels:
    {{- include "go-echo916e6754-1233-4543-a8ba-d49309998f99.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo916e6754-1233-4543-a8ba-d49309998f99.selectorLabels" . | nindent 6 }}
