apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1bdd01fb-b767-44c1-bae0-6948b5280432.fullname" . }}
  labels:
    {{- include "go-echo1bdd01fb-b767-44c1-bae0-6948b5280432.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1bdd01fb-b767-44c1-bae0-6948b5280432.selectorLabels" . | nindent 6 }}
