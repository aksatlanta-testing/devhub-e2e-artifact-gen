apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobcfb9c98-19ca-4c94-ba5b-41e052955b53.fullname" . }}
  labels:
    {{- include "go-echobcfb9c98-19ca-4c94-ba5b-41e052955b53.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobcfb9c98-19ca-4c94-ba5b-41e052955b53.selectorLabels" . | nindent 6 }}
