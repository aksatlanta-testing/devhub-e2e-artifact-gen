apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa68daf52-75d4-49ec-95ab-400c0247042e.fullname" . }}
  labels:
    {{- include "go-echoa68daf52-75d4-49ec-95ab-400c0247042e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa68daf52-75d4-49ec-95ab-400c0247042e.selectorLabels" . | nindent 6 }}
