apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc2caad89-0590-4e1c-bed6-ef38fda3c863.fullname" . }}
  labels:
    {{- include "go-echoc2caad89-0590-4e1c-bed6-ef38fda3c863.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc2caad89-0590-4e1c-bed6-ef38fda3c863.selectorLabels" . | nindent 6 }}
