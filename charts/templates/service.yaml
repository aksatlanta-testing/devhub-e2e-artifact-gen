apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8fe6ca75-fc93-44b9-a454-ff3d3f42065c.fullname" . }}
  labels:
    {{- include "go-echo8fe6ca75-fc93-44b9-a454-ff3d3f42065c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8fe6ca75-fc93-44b9-a454-ff3d3f42065c.selectorLabels" . | nindent 6 }}
