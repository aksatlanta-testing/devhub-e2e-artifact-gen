apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo09d946b1-9e0a-45d0-baf9-494d3458bb49.fullname" . }}
  labels:
    {{- include "go-echo09d946b1-9e0a-45d0-baf9-494d3458bb49.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo09d946b1-9e0a-45d0-baf9-494d3458bb49.selectorLabels" . | nindent 6 }}
