apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo07cd98d7-fd52-439b-9604-d41002db8b7d.fullname" . }}
  labels:
    {{- include "go-echo07cd98d7-fd52-439b-9604-d41002db8b7d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo07cd98d7-fd52-439b-9604-d41002db8b7d.selectorLabels" . | nindent 6 }}
