apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5a3c15c8-2a40-43a5-bbe7-ae17933311af.fullname" . }}
  labels:
    {{- include "go-echo5a3c15c8-2a40-43a5-bbe7-ae17933311af.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5a3c15c8-2a40-43a5-bbe7-ae17933311af.selectorLabels" . | nindent 6 }}
