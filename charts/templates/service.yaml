apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo63d2c019-7797-4bca-8e6f-07e275729063.fullname" . }}
  labels:
    {{- include "go-echo63d2c019-7797-4bca-8e6f-07e275729063.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo63d2c019-7797-4bca-8e6f-07e275729063.selectorLabels" . | nindent 6 }}
