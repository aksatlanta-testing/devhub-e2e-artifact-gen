apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo515e5d38-0376-4b9e-a67b-57f0e90f29d4.fullname" . }}
  labels:
    {{- include "go-echo515e5d38-0376-4b9e-a67b-57f0e90f29d4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo515e5d38-0376-4b9e-a67b-57f0e90f29d4.selectorLabels" . | nindent 6 }}
