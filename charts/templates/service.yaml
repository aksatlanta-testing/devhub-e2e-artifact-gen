apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo03047a62-a75c-435b-bf5c-dea290e0b173.fullname" . }}
  labels:
    {{- include "go-echo03047a62-a75c-435b-bf5c-dea290e0b173.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo03047a62-a75c-435b-bf5c-dea290e0b173.selectorLabels" . | nindent 6 }}
