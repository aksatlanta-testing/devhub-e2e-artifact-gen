apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo759b6b35-ed24-42eb-b937-c5fbb4fa45e0.fullname" . }}
  labels:
    {{- include "go-echo759b6b35-ed24-42eb-b937-c5fbb4fa45e0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo759b6b35-ed24-42eb-b937-c5fbb4fa45e0.selectorLabels" . | nindent 6 }}
