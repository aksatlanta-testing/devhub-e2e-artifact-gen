apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echode70d760-718c-4285-a012-23b7f8242d9e.fullname" . }}
  labels:
    {{- include "go-echode70d760-718c-4285-a012-23b7f8242d9e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echode70d760-718c-4285-a012-23b7f8242d9e.selectorLabels" . | nindent 6 }}
