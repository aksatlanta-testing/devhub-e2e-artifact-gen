apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7f21652c-62cd-4ead-bc05-e1c9ad119beb.fullname" . }}
  labels:
    {{- include "go-echo7f21652c-62cd-4ead-bc05-e1c9ad119beb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7f21652c-62cd-4ead-bc05-e1c9ad119beb.selectorLabels" . | nindent 6 }}
