apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoac55a6a9-df68-4e4b-b23c-c7b9efb6247c.fullname" . }}
  labels:
    {{- include "go-echoac55a6a9-df68-4e4b-b23c-c7b9efb6247c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoac55a6a9-df68-4e4b-b23c-c7b9efb6247c.selectorLabels" . | nindent 6 }}
