apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobef93ea5-5afa-4b6c-abf2-800da52b8022.fullname" . }}
  labels:
    {{- include "go-echobef93ea5-5afa-4b6c-abf2-800da52b8022.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobef93ea5-5afa-4b6c-abf2-800da52b8022.selectorLabels" . | nindent 6 }}
