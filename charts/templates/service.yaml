apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo307980af-234c-42d8-9c8f-262a8b3b4a47.fullname" . }}
  labels:
    {{- include "go-echo307980af-234c-42d8-9c8f-262a8b3b4a47.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo307980af-234c-42d8-9c8f-262a8b3b4a47.selectorLabels" . | nindent 6 }}
