apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6d4531e1-3a86-4a83-a521-088e04638c54.fullname" . }}
  labels:
    {{- include "go-echo6d4531e1-3a86-4a83-a521-088e04638c54.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6d4531e1-3a86-4a83-a521-088e04638c54.selectorLabels" . | nindent 6 }}
