apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoad9dd7ac-c122-4dc4-8e31-4e31f1f116a4.fullname" . }}
  labels:
    {{- include "go-echoad9dd7ac-c122-4dc4-8e31-4e31f1f116a4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoad9dd7ac-c122-4dc4-8e31-4e31f1f116a4.selectorLabels" . | nindent 6 }}
