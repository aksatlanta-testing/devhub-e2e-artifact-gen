apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0cc228d2-67c2-42b2-b132-e0650ccb9c18.fullname" . }}
  labels:
    {{- include "go-echo0cc228d2-67c2-42b2-b132-e0650ccb9c18.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0cc228d2-67c2-42b2-b132-e0650ccb9c18.selectorLabels" . | nindent 6 }}
