apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo38e9b27c-d14a-48df-bbf6-100f8e727f42.fullname" . }}
  labels:
    {{- include "go-echo38e9b27c-d14a-48df-bbf6-100f8e727f42.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo38e9b27c-d14a-48df-bbf6-100f8e727f42.selectorLabels" . | nindent 6 }}
