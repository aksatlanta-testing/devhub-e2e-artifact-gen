apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc6247e08-58fe-4660-9eab-dec8a5d9ae52.fullname" . }}
  labels:
    {{- include "go-echoc6247e08-58fe-4660-9eab-dec8a5d9ae52.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc6247e08-58fe-4660-9eab-dec8a5d9ae52.selectorLabels" . | nindent 6 }}
