apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob1bb12b9-38ba-4c06-a288-ea46c906984b.fullname" . }}
  labels:
    {{- include "go-echob1bb12b9-38ba-4c06-a288-ea46c906984b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob1bb12b9-38ba-4c06-a288-ea46c906984b.selectorLabels" . | nindent 6 }}
