apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo14ec3440-f2b2-4df1-9869-d98ef231cee6.fullname" . }}
  labels:
    {{- include "go-echo14ec3440-f2b2-4df1-9869-d98ef231cee6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo14ec3440-f2b2-4df1-9869-d98ef231cee6.selectorLabels" . | nindent 6 }}
