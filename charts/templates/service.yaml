apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2fcab3aa-fb91-43aa-bd5e-e9a53ed233be.fullname" . }}
  labels:
    {{- include "go-echo2fcab3aa-fb91-43aa-bd5e-e9a53ed233be.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2fcab3aa-fb91-43aa-bd5e-e9a53ed233be.selectorLabels" . | nindent 6 }}
