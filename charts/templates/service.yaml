apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe576c0d4-ffe6-4237-bde7-15f6d4e75c5d.fullname" . }}
  labels:
    {{- include "go-echoe576c0d4-ffe6-4237-bde7-15f6d4e75c5d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe576c0d4-ffe6-4237-bde7-15f6d4e75c5d.selectorLabels" . | nindent 6 }}
