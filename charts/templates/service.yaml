apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo60c3851d-ba58-4368-8e51-7109f741417d.fullname" . }}
  labels:
    {{- include "go-echo60c3851d-ba58-4368-8e51-7109f741417d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo60c3851d-ba58-4368-8e51-7109f741417d.selectorLabels" . | nindent 6 }}
