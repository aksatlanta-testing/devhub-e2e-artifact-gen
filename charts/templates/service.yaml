apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc11a6910-3fdf-4ce9-8bc8-f57a1db6407d.fullname" . }}
  labels:
    {{- include "go-echoc11a6910-3fdf-4ce9-8bc8-f57a1db6407d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc11a6910-3fdf-4ce9-8bc8-f57a1db6407d.selectorLabels" . | nindent 6 }}
