apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2d720c5a-5239-476f-877c-8e9cdf947bce.fullname" . }}
  labels:
    {{- include "go-echo2d720c5a-5239-476f-877c-8e9cdf947bce.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2d720c5a-5239-476f-877c-8e9cdf947bce.selectorLabels" . | nindent 6 }}
