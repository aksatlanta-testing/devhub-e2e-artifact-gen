apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoffbf73b2-7e7f-4e8b-a155-9c03ccd99ffe.fullname" . }}
  labels:
    {{- include "go-echoffbf73b2-7e7f-4e8b-a155-9c03ccd99ffe.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoffbf73b2-7e7f-4e8b-a155-9c03ccd99ffe.selectorLabels" . | nindent 6 }}
