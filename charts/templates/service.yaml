apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7c210622-4219-4918-af0e-81f360db7389.fullname" . }}
  labels:
    {{- include "go-echo7c210622-4219-4918-af0e-81f360db7389.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7c210622-4219-4918-af0e-81f360db7389.selectorLabels" . | nindent 6 }}
