apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo304266d8-3899-4384-b98c-5cc4d6649fc0.fullname" . }}
  labels:
    {{- include "go-echo304266d8-3899-4384-b98c-5cc4d6649fc0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo304266d8-3899-4384-b98c-5cc4d6649fc0.selectorLabels" . | nindent 6 }}
