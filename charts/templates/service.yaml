apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo03322444-116f-4764-8c2d-55223e8fa93f.fullname" . }}
  labels:
    {{- include "go-echo03322444-116f-4764-8c2d-55223e8fa93f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo03322444-116f-4764-8c2d-55223e8fa93f.selectorLabels" . | nindent 6 }}
