apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa3a8092e-e933-4c0e-a538-0383485f21d1.fullname" . }}
  labels:
    {{- include "go-echoa3a8092e-e933-4c0e-a538-0383485f21d1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa3a8092e-e933-4c0e-a538-0383485f21d1.selectorLabels" . | nindent 6 }}
