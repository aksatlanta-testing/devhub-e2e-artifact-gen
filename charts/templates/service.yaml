apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo979a2243-1180-4935-9993-0a610344edf8.fullname" . }}
  labels:
    {{- include "go-echo979a2243-1180-4935-9993-0a610344edf8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo979a2243-1180-4935-9993-0a610344edf8.selectorLabels" . | nindent 6 }}
