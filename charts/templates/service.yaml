apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo57386b02-4d18-40d1-869c-fd6c80027d90.fullname" . }}
  labels:
    {{- include "go-echo57386b02-4d18-40d1-869c-fd6c80027d90.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo57386b02-4d18-40d1-869c-fd6c80027d90.selectorLabels" . | nindent 6 }}
