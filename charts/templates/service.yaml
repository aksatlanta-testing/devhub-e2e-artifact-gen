apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1bb1dc11-6b1e-4087-a9a4-e219944c6db8.fullname" . }}
  labels:
    {{- include "go-echo1bb1dc11-6b1e-4087-a9a4-e219944c6db8.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1bb1dc11-6b1e-4087-a9a4-e219944c6db8.selectorLabels" . | nindent 6 }}
