apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo04fc9b0c-94ff-4b13-8504-36e144a9c623.fullname" . }}
  labels:
    {{- include "go-echo04fc9b0c-94ff-4b13-8504-36e144a9c623.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo04fc9b0c-94ff-4b13-8504-36e144a9c623.selectorLabels" . | nindent 6 }}
