apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0f3cf292-ec63-42f9-b453-a14c874c89ad.fullname" . }}
  labels:
    {{- include "go-echo0f3cf292-ec63-42f9-b453-a14c874c89ad.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0f3cf292-ec63-42f9-b453-a14c874c89ad.selectorLabels" . | nindent 6 }}
