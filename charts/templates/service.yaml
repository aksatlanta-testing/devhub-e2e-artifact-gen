apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo945e1fff-6482-47e1-8cd3-a6b4565f9795.fullname" . }}
  labels:
    {{- include "go-echo945e1fff-6482-47e1-8cd3-a6b4565f9795.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo945e1fff-6482-47e1-8cd3-a6b4565f9795.selectorLabels" . | nindent 6 }}
