apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoadbabf38-a8d6-4b07-bf01-59fc134cb978.fullname" . }}
  labels:
    {{- include "go-echoadbabf38-a8d6-4b07-bf01-59fc134cb978.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoadbabf38-a8d6-4b07-bf01-59fc134cb978.selectorLabels" . | nindent 6 }}
