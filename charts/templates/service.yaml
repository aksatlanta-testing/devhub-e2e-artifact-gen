apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1c7d3cf6-a1a1-4f37-bce4-a164ac305376.fullname" . }}
  labels:
    {{- include "go-echo1c7d3cf6-a1a1-4f37-bce4-a164ac305376.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1c7d3cf6-a1a1-4f37-bce4-a164ac305376.selectorLabels" . | nindent 6 }}
