apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe6ab9912-1bb0-43bb-a70f-17066ca51158.fullname" . }}
  labels:
    {{- include "go-echoe6ab9912-1bb0-43bb-a70f-17066ca51158.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe6ab9912-1bb0-43bb-a70f-17066ca51158.selectorLabels" . | nindent 6 }}
