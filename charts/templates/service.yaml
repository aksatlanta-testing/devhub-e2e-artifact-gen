apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe249f66d-02eb-4a9f-a138-0e85a07cf6d6.fullname" . }}
  labels:
    {{- include "go-echoe249f66d-02eb-4a9f-a138-0e85a07cf6d6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe249f66d-02eb-4a9f-a138-0e85a07cf6d6.selectorLabels" . | nindent 6 }}
