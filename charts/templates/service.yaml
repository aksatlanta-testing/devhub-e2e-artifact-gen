apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo00ae0242-8bda-4802-8335-14677c5c5b79.fullname" . }}
  labels:
    {{- include "go-echo00ae0242-8bda-4802-8335-14677c5c5b79.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo00ae0242-8bda-4802-8335-14677c5c5b79.selectorLabels" . | nindent 6 }}
