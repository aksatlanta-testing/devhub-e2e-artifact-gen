apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa5bb2ebd-717c-4df1-943b-3f5b101fed8a.fullname" . }}
  labels:
    {{- include "go-echoa5bb2ebd-717c-4df1-943b-3f5b101fed8a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa5bb2ebd-717c-4df1-943b-3f5b101fed8a.selectorLabels" . | nindent 6 }}
