apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7b104f5e-2228-461f-9cd3-0a026031348e.fullname" . }}
  labels:
    {{- include "go-echo7b104f5e-2228-461f-9cd3-0a026031348e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7b104f5e-2228-461f-9cd3-0a026031348e.selectorLabels" . | nindent 6 }}
