apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo95ae54b1-78b8-497f-b23b-628d6f3a539d.fullname" . }}
  labels:
    {{- include "go-echo95ae54b1-78b8-497f-b23b-628d6f3a539d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo95ae54b1-78b8-497f-b23b-628d6f3a539d.selectorLabels" . | nindent 6 }}
