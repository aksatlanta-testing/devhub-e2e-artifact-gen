apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3ea5d1df-2f31-4779-8ddf-77ea69e548ce.fullname" . }}
  labels:
    {{- include "go-echo3ea5d1df-2f31-4779-8ddf-77ea69e548ce.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3ea5d1df-2f31-4779-8ddf-77ea69e548ce.selectorLabels" . | nindent 6 }}
