apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo08ae8867-68b2-4822-b34d-80626d97b25c.fullname" . }}
  labels:
    {{- include "go-echo08ae8867-68b2-4822-b34d-80626d97b25c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo08ae8867-68b2-4822-b34d-80626d97b25c.selectorLabels" . | nindent 6 }}
