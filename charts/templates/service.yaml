apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoea38669c-3cf3-409c-becc-6a846e3b1f13.fullname" . }}
  labels:
    {{- include "go-echoea38669c-3cf3-409c-becc-6a846e3b1f13.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoea38669c-3cf3-409c-becc-6a846e3b1f13.selectorLabels" . | nindent 6 }}
