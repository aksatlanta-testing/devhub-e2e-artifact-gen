apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo75cf8920-a2cd-47cf-a7d1-23f55d12f05f.fullname" . }}
  labels:
    {{- include "go-echo75cf8920-a2cd-47cf-a7d1-23f55d12f05f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo75cf8920-a2cd-47cf-a7d1-23f55d12f05f.selectorLabels" . | nindent 6 }}
