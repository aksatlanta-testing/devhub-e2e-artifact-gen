apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo49cf2480-6a08-42ed-9b07-fd469ef57941.fullname" . }}
  labels:
    {{- include "go-echo49cf2480-6a08-42ed-9b07-fd469ef57941.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo49cf2480-6a08-42ed-9b07-fd469ef57941.selectorLabels" . | nindent 6 }}
