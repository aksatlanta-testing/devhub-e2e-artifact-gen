apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9d410c6b-23ca-4b6e-b3ec-8f0ea9db8420.fullname" . }}
  labels:
    {{- include "go-echo9d410c6b-23ca-4b6e-b3ec-8f0ea9db8420.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9d410c6b-23ca-4b6e-b3ec-8f0ea9db8420.selectorLabels" . | nindent 6 }}
