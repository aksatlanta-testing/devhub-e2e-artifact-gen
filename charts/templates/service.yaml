apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo58a835bd-ec9a-4d33-a0cf-b806398bb097.fullname" . }}
  labels:
    {{- include "go-echo58a835bd-ec9a-4d33-a0cf-b806398bb097.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo58a835bd-ec9a-4d33-a0cf-b806398bb097.selectorLabels" . | nindent 6 }}
