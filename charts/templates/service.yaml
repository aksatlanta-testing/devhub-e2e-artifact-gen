apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3741b36f-5d88-4a60-8763-faa6c22b588e.fullname" . }}
  labels:
    {{- include "go-echo3741b36f-5d88-4a60-8763-faa6c22b588e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3741b36f-5d88-4a60-8763-faa6c22b588e.selectorLabels" . | nindent 6 }}
