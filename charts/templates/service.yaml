apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo33e39f41-cf32-4fa5-aabf-b01ee27d817e.fullname" . }}
  labels:
    {{- include "go-echo33e39f41-cf32-4fa5-aabf-b01ee27d817e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo33e39f41-cf32-4fa5-aabf-b01ee27d817e.selectorLabels" . | nindent 6 }}
