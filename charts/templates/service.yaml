apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe67db9d9-dc58-4dc1-bf68-f5251afe3d72.fullname" . }}
  labels:
    {{- include "go-echoe67db9d9-dc58-4dc1-bf68-f5251afe3d72.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe67db9d9-dc58-4dc1-bf68-f5251afe3d72.selectorLabels" . | nindent 6 }}
