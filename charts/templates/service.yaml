apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6ba9fe74-02ea-4598-8bef-31548130c755.fullname" . }}
  labels:
    {{- include "go-echo6ba9fe74-02ea-4598-8bef-31548130c755.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6ba9fe74-02ea-4598-8bef-31548130c755.selectorLabels" . | nindent 6 }}
