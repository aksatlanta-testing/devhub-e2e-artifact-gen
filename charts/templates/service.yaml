apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo08d6c53f-d334-45e8-b13b-403ab9e58452.fullname" . }}
  labels:
    {{- include "go-echo08d6c53f-d334-45e8-b13b-403ab9e58452.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo08d6c53f-d334-45e8-b13b-403ab9e58452.selectorLabels" . | nindent 6 }}
