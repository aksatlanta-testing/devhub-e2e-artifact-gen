apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodfec7353-73fb-4d08-a32f-cfa58451b5e1.fullname" . }}
  labels:
    {{- include "go-echodfec7353-73fb-4d08-a32f-cfa58451b5e1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodfec7353-73fb-4d08-a32f-cfa58451b5e1.selectorLabels" . | nindent 6 }}
