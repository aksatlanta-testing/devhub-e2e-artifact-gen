apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe84c801a-0576-4f6f-83af-a01b28bb7f69.fullname" . }}
  labels:
    {{- include "go-echoe84c801a-0576-4f6f-83af-a01b28bb7f69.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe84c801a-0576-4f6f-83af-a01b28bb7f69.selectorLabels" . | nindent 6 }}
