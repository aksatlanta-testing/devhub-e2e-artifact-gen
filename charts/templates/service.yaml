apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8f035e66-b8c9-4e5a-9ebd-0865085753c5.fullname" . }}
  labels:
    {{- include "go-echo8f035e66-b8c9-4e5a-9ebd-0865085753c5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8f035e66-b8c9-4e5a-9ebd-0865085753c5.selectorLabels" . | nindent 6 }}
