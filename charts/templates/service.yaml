apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7052d221-b9c4-43e4-a7e4-a21a30ad2fc0.fullname" . }}
  labels:
    {{- include "go-echo7052d221-b9c4-43e4-a7e4-a21a30ad2fc0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7052d221-b9c4-43e4-a7e4-a21a30ad2fc0.selectorLabels" . | nindent 6 }}
