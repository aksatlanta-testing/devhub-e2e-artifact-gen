apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo81a98fa0-521e-463e-a700-95c660fbcb26.fullname" . }}
  labels:
    {{- include "go-echo81a98fa0-521e-463e-a700-95c660fbcb26.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo81a98fa0-521e-463e-a700-95c660fbcb26.selectorLabels" . | nindent 6 }}
