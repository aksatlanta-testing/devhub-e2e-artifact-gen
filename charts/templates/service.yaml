apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo50cd8f2b-6081-4335-b99a-82a2ebb16ce9.fullname" . }}
  labels:
    {{- include "go-echo50cd8f2b-6081-4335-b99a-82a2ebb16ce9.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo50cd8f2b-6081-4335-b99a-82a2ebb16ce9.selectorLabels" . | nindent 6 }}
