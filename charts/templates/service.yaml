apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc1dc8dac-9b11-41dc-8805-adb73342d22b.fullname" . }}
  labels:
    {{- include "go-echoc1dc8dac-9b11-41dc-8805-adb73342d22b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc1dc8dac-9b11-41dc-8805-adb73342d22b.selectorLabels" . | nindent 6 }}
