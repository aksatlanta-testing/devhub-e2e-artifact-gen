apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2f8f7013-728e-4122-9c54-8713b19d0aa0.fullname" . }}
  labels:
    {{- include "go-echo2f8f7013-728e-4122-9c54-8713b19d0aa0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2f8f7013-728e-4122-9c54-8713b19d0aa0.selectorLabels" . | nindent 6 }}
