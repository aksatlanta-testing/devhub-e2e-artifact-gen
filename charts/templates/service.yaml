apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4f5c8adc-169c-4ee4-9096-1d4d943e7f5a.fullname" . }}
  labels:
    {{- include "go-echo4f5c8adc-169c-4ee4-9096-1d4d943e7f5a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4f5c8adc-169c-4ee4-9096-1d4d943e7f5a.selectorLabels" . | nindent 6 }}
