apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7be908b3-2137-4896-965d-cae8554137d1.fullname" . }}
  labels:
    {{- include "go-echo7be908b3-2137-4896-965d-cae8554137d1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7be908b3-2137-4896-965d-cae8554137d1.selectorLabels" . | nindent 6 }}
