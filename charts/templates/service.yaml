apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobcada585-e7f3-4efa-9ca3-53dbeac616cf.fullname" . }}
  labels:
    {{- include "go-echobcada585-e7f3-4efa-9ca3-53dbeac616cf.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobcada585-e7f3-4efa-9ca3-53dbeac616cf.selectorLabels" . | nindent 6 }}
