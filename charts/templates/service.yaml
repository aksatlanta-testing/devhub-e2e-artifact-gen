apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe7f24ae7-76e0-4c92-a6da-f6ba5a976734.fullname" . }}
  labels:
    {{- include "go-echoe7f24ae7-76e0-4c92-a6da-f6ba5a976734.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe7f24ae7-76e0-4c92-a6da-f6ba5a976734.selectorLabels" . | nindent 6 }}
