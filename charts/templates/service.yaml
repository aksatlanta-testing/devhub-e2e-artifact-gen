apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc8d2945f-cfe5-4bc9-967b-f86900679732.fullname" . }}
  labels:
    {{- include "go-echoc8d2945f-cfe5-4bc9-967b-f86900679732.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc8d2945f-cfe5-4bc9-967b-f86900679732.selectorLabels" . | nindent 6 }}
