apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa6f07749-e213-477f-9d9c-76899e3f1869.fullname" . }}
  labels:
    {{- include "go-echoa6f07749-e213-477f-9d9c-76899e3f1869.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa6f07749-e213-477f-9d9c-76899e3f1869.selectorLabels" . | nindent 6 }}
