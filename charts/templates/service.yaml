apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2a1c2e6f-5307-4105-9868-a389c8d46759.fullname" . }}
  labels:
    {{- include "go-echo2a1c2e6f-5307-4105-9868-a389c8d46759.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2a1c2e6f-5307-4105-9868-a389c8d46759.selectorLabels" . | nindent 6 }}
