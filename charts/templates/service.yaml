apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo09abbc22-7be8-4dd5-b662-1c7813b41020.fullname" . }}
  labels:
    {{- include "go-echo09abbc22-7be8-4dd5-b662-1c7813b41020.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo09abbc22-7be8-4dd5-b662-1c7813b41020.selectorLabels" . | nindent 6 }}
