apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo529f6d50-f455-490f-b7a9-d9cd34aaff74.fullname" . }}
  labels:
    {{- include "go-echo529f6d50-f455-490f-b7a9-d9cd34aaff74.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo529f6d50-f455-490f-b7a9-d9cd34aaff74.selectorLabels" . | nindent 6 }}
