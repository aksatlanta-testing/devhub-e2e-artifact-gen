apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodb561fbf-35d3-4919-b9c8-5ae8b15fd0a5.fullname" . }}
  labels:
    {{- include "go-echodb561fbf-35d3-4919-b9c8-5ae8b15fd0a5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodb561fbf-35d3-4919-b9c8-5ae8b15fd0a5.selectorLabels" . | nindent 6 }}
