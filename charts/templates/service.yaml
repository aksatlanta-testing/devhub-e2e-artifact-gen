apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocf740797-b4ec-432f-b6e5-1e9c807bc55e.fullname" . }}
  labels:
    {{- include "go-echocf740797-b4ec-432f-b6e5-1e9c807bc55e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocf740797-b4ec-432f-b6e5-1e9c807bc55e.selectorLabels" . | nindent 6 }}
