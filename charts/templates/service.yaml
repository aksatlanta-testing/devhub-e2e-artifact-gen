apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo81cdec30-0bd5-40c0-a75c-11409966f3f0.fullname" . }}
  labels:
    {{- include "go-echo81cdec30-0bd5-40c0-a75c-11409966f3f0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo81cdec30-0bd5-40c0-a75c-11409966f3f0.selectorLabels" . | nindent 6 }}
