apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod5908cad-72eb-4a15-8e60-435c6840e316.fullname" . }}
  labels:
    {{- include "go-echod5908cad-72eb-4a15-8e60-435c6840e316.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod5908cad-72eb-4a15-8e60-435c6840e316.selectorLabels" . | nindent 6 }}
