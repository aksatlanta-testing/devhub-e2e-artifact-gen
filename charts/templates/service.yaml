apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa2161081-d972-4a5d-8e2f-79eed1fffdce.fullname" . }}
  labels:
    {{- include "go-echoa2161081-d972-4a5d-8e2f-79eed1fffdce.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa2161081-d972-4a5d-8e2f-79eed1fffdce.selectorLabels" . | nindent 6 }}
