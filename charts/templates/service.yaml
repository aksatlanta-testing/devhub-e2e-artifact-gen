apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9ff82404-4370-48da-b22d-0991f785c22c.fullname" . }}
  labels:
    {{- include "go-echo9ff82404-4370-48da-b22d-0991f785c22c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9ff82404-4370-48da-b22d-0991f785c22c.selectorLabels" . | nindent 6 }}
