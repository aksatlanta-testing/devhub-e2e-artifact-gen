apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo239c93cb-fbc7-46e3-863b-066d1c8d5b5b.fullname" . }}
  labels:
    {{- include "go-echo239c93cb-fbc7-46e3-863b-066d1c8d5b5b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo239c93cb-fbc7-46e3-863b-066d1c8d5b5b.selectorLabels" . | nindent 6 }}
