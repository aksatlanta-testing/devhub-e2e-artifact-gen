apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9d77d6d9-dd19-45de-9beb-01d87cac0b4c.fullname" . }}
  labels:
    {{- include "go-echo9d77d6d9-dd19-45de-9beb-01d87cac0b4c.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9d77d6d9-dd19-45de-9beb-01d87cac0b4c.selectorLabels" . | nindent 6 }}
