apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocd3c7530-d474-4d5f-889d-ae6f5c53960c.fullname" . }}
  labels:
    {{- include "go-echocd3c7530-d474-4d5f-889d-ae6f5c53960c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocd3c7530-d474-4d5f-889d-ae6f5c53960c.selectorLabels" . | nindent 6 }}
