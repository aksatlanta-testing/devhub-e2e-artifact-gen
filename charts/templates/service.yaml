apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2a1db9a4-4d26-4600-9387-f9feb9423ef3.fullname" . }}
  labels:
    {{- include "go-echo2a1db9a4-4d26-4600-9387-f9feb9423ef3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2a1db9a4-4d26-4600-9387-f9feb9423ef3.selectorLabels" . | nindent 6 }}
