apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0bde157a-a90f-4689-8060-c8bc2bc06868.fullname" . }}
  labels:
    {{- include "go-echo0bde157a-a90f-4689-8060-c8bc2bc06868.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0bde157a-a90f-4689-8060-c8bc2bc06868.selectorLabels" . | nindent 6 }}
