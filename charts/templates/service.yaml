apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofaa5b15c-75bb-453d-aef2-102bb1bcc437.fullname" . }}
  labels:
    {{- include "go-echofaa5b15c-75bb-453d-aef2-102bb1bcc437.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofaa5b15c-75bb-453d-aef2-102bb1bcc437.selectorLabels" . | nindent 6 }}
