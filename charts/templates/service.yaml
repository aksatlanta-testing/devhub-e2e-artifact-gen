apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3fb83ad5-de59-4d99-899e-cd42bd9d89b9.fullname" . }}
  labels:
    {{- include "go-echo3fb83ad5-de59-4d99-899e-cd42bd9d89b9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3fb83ad5-de59-4d99-899e-cd42bd9d89b9.selectorLabels" . | nindent 6 }}
