apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob8034ead-5175-43db-9dcd-98175078e781.fullname" . }}
  labels:
    {{- include "go-echob8034ead-5175-43db-9dcd-98175078e781.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob8034ead-5175-43db-9dcd-98175078e781.selectorLabels" . | nindent 6 }}
