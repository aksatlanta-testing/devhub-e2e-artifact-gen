apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod1c40b73-da00-4640-abf9-f57b98d0ff90.fullname" . }}
  labels:
    {{- include "go-echod1c40b73-da00-4640-abf9-f57b98d0ff90.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod1c40b73-da00-4640-abf9-f57b98d0ff90.selectorLabels" . | nindent 6 }}
