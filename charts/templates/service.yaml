apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo97f4f6f0-d0f1-4286-ba76-ea0e708dd8cd.fullname" . }}
  labels:
    {{- include "go-echo97f4f6f0-d0f1-4286-ba76-ea0e708dd8cd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo97f4f6f0-d0f1-4286-ba76-ea0e708dd8cd.selectorLabels" . | nindent 6 }}
