apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofd5a9a9f-e2b3-430a-bd9e-caa06f47cf8c.fullname" . }}
  labels:
    {{- include "go-echofd5a9a9f-e2b3-430a-bd9e-caa06f47cf8c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofd5a9a9f-e2b3-430a-bd9e-caa06f47cf8c.selectorLabels" . | nindent 6 }}
