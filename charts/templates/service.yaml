apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo18d5e3b2-9c66-4cb7-9d7d-108f5c55124f.fullname" . }}
  labels:
    {{- include "go-echo18d5e3b2-9c66-4cb7-9d7d-108f5c55124f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo18d5e3b2-9c66-4cb7-9d7d-108f5c55124f.selectorLabels" . | nindent 6 }}
