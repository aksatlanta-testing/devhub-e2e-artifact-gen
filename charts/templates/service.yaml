apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo688464f4-07f3-4773-9aa4-ac21e2092c3b.fullname" . }}
  labels:
    {{- include "go-echo688464f4-07f3-4773-9aa4-ac21e2092c3b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo688464f4-07f3-4773-9aa4-ac21e2092c3b.selectorLabels" . | nindent 6 }}
