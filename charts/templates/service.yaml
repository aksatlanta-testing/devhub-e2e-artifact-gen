apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7a74b66a-19b0-4102-9a13-578579984837.fullname" . }}
  labels:
    {{- include "go-echo7a74b66a-19b0-4102-9a13-578579984837.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7a74b66a-19b0-4102-9a13-578579984837.selectorLabels" . | nindent 6 }}
