apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo816c5e00-5218-42b8-9edf-36ddde49993f.fullname" . }}
  labels:
    {{- include "go-echo816c5e00-5218-42b8-9edf-36ddde49993f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo816c5e00-5218-42b8-9edf-36ddde49993f.selectorLabels" . | nindent 6 }}
