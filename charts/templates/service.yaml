apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc9273873-9ee0-4395-a518-ec4d8b221a91.fullname" . }}
  labels:
    {{- include "go-echoc9273873-9ee0-4395-a518-ec4d8b221a91.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc9273873-9ee0-4395-a518-ec4d8b221a91.selectorLabels" . | nindent 6 }}
