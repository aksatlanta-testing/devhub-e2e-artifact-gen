apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo993b5ff5-36dd-47ec-9e1d-8d85ebfee53d.fullname" . }}
  labels:
    {{- include "go-echo993b5ff5-36dd-47ec-9e1d-8d85ebfee53d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo993b5ff5-36dd-47ec-9e1d-8d85ebfee53d.selectorLabels" . | nindent 6 }}
