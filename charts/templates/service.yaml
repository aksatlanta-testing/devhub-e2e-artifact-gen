apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo66d2f7e2-a833-49cd-941c-2d40d4b9e5e8.fullname" . }}
  labels:
    {{- include "go-echo66d2f7e2-a833-49cd-941c-2d40d4b9e5e8.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo66d2f7e2-a833-49cd-941c-2d40d4b9e5e8.selectorLabels" . | nindent 6 }}
