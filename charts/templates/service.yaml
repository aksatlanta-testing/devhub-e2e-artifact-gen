apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaac20a68-fddf-45f3-9133-094247fa7560.fullname" . }}
  labels:
    {{- include "go-echoaac20a68-fddf-45f3-9133-094247fa7560.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaac20a68-fddf-45f3-9133-094247fa7560.selectorLabels" . | nindent 6 }}
