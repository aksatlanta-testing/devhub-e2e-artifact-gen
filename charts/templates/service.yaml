apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo900aa5cd-ed47-4af6-a217-5e8e312357db.fullname" . }}
  labels:
    {{- include "go-echo900aa5cd-ed47-4af6-a217-5e8e312357db.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo900aa5cd-ed47-4af6-a217-5e8e312357db.selectorLabels" . | nindent 6 }}
