apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob4b59484-0a37-4eee-9865-6c3b76a03c18.fullname" . }}
  labels:
    {{- include "go-echob4b59484-0a37-4eee-9865-6c3b76a03c18.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob4b59484-0a37-4eee-9865-6c3b76a03c18.selectorLabels" . | nindent 6 }}
