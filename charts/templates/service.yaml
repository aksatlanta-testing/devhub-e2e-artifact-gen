apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo907da249-91c4-4376-82ba-6f291207fe97.fullname" . }}
  labels:
    {{- include "go-echo907da249-91c4-4376-82ba-6f291207fe97.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo907da249-91c4-4376-82ba-6f291207fe97.selectorLabels" . | nindent 6 }}
