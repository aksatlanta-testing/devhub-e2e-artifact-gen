apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9a2dda69-2bf3-4d5b-9c1b-76aef74bf85e.fullname" . }}
  labels:
    {{- include "go-echo9a2dda69-2bf3-4d5b-9c1b-76aef74bf85e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9a2dda69-2bf3-4d5b-9c1b-76aef74bf85e.selectorLabels" . | nindent 6 }}
