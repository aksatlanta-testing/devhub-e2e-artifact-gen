apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6c773553-69a9-4b05-9e2e-0e42b5f49d49.fullname" . }}
  labels:
    {{- include "go-echo6c773553-69a9-4b05-9e2e-0e42b5f49d49.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6c773553-69a9-4b05-9e2e-0e42b5f49d49.selectorLabels" . | nindent 6 }}
