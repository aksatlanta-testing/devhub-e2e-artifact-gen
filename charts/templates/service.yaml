apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7eece172-6d64-4b7c-86ef-1d331a924236.fullname" . }}
  labels:
    {{- include "go-echo7eece172-6d64-4b7c-86ef-1d331a924236.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7eece172-6d64-4b7c-86ef-1d331a924236.selectorLabels" . | nindent 6 }}
