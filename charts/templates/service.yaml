apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo286890d4-a099-4a3c-8e08-88d9cffcde08.fullname" . }}
  labels:
    {{- include "go-echo286890d4-a099-4a3c-8e08-88d9cffcde08.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo286890d4-a099-4a3c-8e08-88d9cffcde08.selectorLabels" . | nindent 6 }}
