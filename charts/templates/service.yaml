apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobb23fcba-59d5-403c-8d02-08a840b214dc.fullname" . }}
  labels:
    {{- include "go-echobb23fcba-59d5-403c-8d02-08a840b214dc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobb23fcba-59d5-403c-8d02-08a840b214dc.selectorLabels" . | nindent 6 }}
