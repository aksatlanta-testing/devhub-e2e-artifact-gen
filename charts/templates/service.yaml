apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoba048d0a-f5ce-4ffb-a1e4-72dd65ae0912.fullname" . }}
  labels:
    {{- include "go-echoba048d0a-f5ce-4ffb-a1e4-72dd65ae0912.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoba048d0a-f5ce-4ffb-a1e4-72dd65ae0912.selectorLabels" . | nindent 6 }}
