apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2ad2d452-5976-4aae-a32e-ee0ae51be31f.fullname" . }}
  labels:
    {{- include "go-echo2ad2d452-5976-4aae-a32e-ee0ae51be31f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2ad2d452-5976-4aae-a32e-ee0ae51be31f.selectorLabels" . | nindent 6 }}
