apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo344968d0-6d0e-4f81-8df4-1bb917a67e9e.fullname" . }}
  labels:
    {{- include "go-echo344968d0-6d0e-4f81-8df4-1bb917a67e9e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo344968d0-6d0e-4f81-8df4-1bb917a67e9e.selectorLabels" . | nindent 6 }}
