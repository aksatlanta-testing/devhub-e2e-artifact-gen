apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo58934c94-67ab-4744-97ef-7137fa29a537.fullname" . }}
  labels:
    {{- include "go-echo58934c94-67ab-4744-97ef-7137fa29a537.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo58934c94-67ab-4744-97ef-7137fa29a537.selectorLabels" . | nindent 6 }}
