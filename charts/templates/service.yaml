apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6ebeb90f-5eb3-4b7c-ab90-77531995e360.fullname" . }}
  labels:
    {{- include "go-echo6ebeb90f-5eb3-4b7c-ab90-77531995e360.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6ebeb90f-5eb3-4b7c-ab90-77531995e360.selectorLabels" . | nindent 6 }}
