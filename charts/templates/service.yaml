apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3afa0132-dbd3-46b2-894c-88371e0edc2f.fullname" . }}
  labels:
    {{- include "go-echo3afa0132-dbd3-46b2-894c-88371e0edc2f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3afa0132-dbd3-46b2-894c-88371e0edc2f.selectorLabels" . | nindent 6 }}
