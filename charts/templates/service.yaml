apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo91666329-cd42-45ff-8f78-de0a74cd5c5b.fullname" . }}
  labels:
    {{- include "go-echo91666329-cd42-45ff-8f78-de0a74cd5c5b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
