apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc5bd0d3e-f7b9-4edb-ae6d-b0f4d327f672.fullname" . }}
  labels:
    {{- include "go-echoc5bd0d3e-f7b9-4edb-ae6d-b0f4d327f672.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc5bd0d3e-f7b9-4edb-ae6d-b0f4d327f672.selectorLabels" . | nindent 6 }}
