apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodf7af8f5-790f-4ed6-a9f9-11dc36fe9407.fullname" . }}
  labels:
    {{- include "go-echodf7af8f5-790f-4ed6-a9f9-11dc36fe9407.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodf7af8f5-790f-4ed6-a9f9-11dc36fe9407.selectorLabels" . | nindent 6 }}
