apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6e6877c9-4aee-400d-b72c-50c82a5584b3.fullname" . }}
  labels:
    {{- include "go-echo6e6877c9-4aee-400d-b72c-50c82a5584b3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6e6877c9-4aee-400d-b72c-50c82a5584b3.selectorLabels" . | nindent 6 }}
