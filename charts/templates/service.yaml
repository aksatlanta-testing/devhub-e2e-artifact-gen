apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo52547475-b3f1-4b6c-887a-842f1d5b9894.fullname" . }}
  labels:
    {{- include "go-echo52547475-b3f1-4b6c-887a-842f1d5b9894.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo52547475-b3f1-4b6c-887a-842f1d5b9894.selectorLabels" . | nindent 6 }}
