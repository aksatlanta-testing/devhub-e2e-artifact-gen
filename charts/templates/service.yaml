apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe48b85cd-b48d-47ac-b824-99401b885e7f.fullname" . }}
  labels:
    {{- include "go-echoe48b85cd-b48d-47ac-b824-99401b885e7f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe48b85cd-b48d-47ac-b824-99401b885e7f.selectorLabels" . | nindent 6 }}
