apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6be22e32-e8b1-465b-a261-999948ea2120.fullname" . }}
  labels:
    {{- include "go-echo6be22e32-e8b1-465b-a261-999948ea2120.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6be22e32-e8b1-465b-a261-999948ea2120.selectorLabels" . | nindent 6 }}
