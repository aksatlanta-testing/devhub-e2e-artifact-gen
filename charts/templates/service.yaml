apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1026ab8e-ee16-4a47-ac3d-f53e6fb5b2ea.fullname" . }}
  labels:
    {{- include "go-echo1026ab8e-ee16-4a47-ac3d-f53e6fb5b2ea.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1026ab8e-ee16-4a47-ac3d-f53e6fb5b2ea.selectorLabels" . | nindent 6 }}
