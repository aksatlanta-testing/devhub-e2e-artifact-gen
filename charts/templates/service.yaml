apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo96ec4a38-f813-4676-a278-bd27e81d1e9f.fullname" . }}
  labels:
    {{- include "go-echo96ec4a38-f813-4676-a278-bd27e81d1e9f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo96ec4a38-f813-4676-a278-bd27e81d1e9f.selectorLabels" . | nindent 6 }}
