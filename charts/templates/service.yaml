apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo29b763bd-65ee-4e06-addf-70643a330778.fullname" . }}
  labels:
    {{- include "go-echo29b763bd-65ee-4e06-addf-70643a330778.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo29b763bd-65ee-4e06-addf-70643a330778.selectorLabels" . | nindent 6 }}
