apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo92ef3e03-d1de-45f4-b37f-ee218958837a.fullname" . }}
  labels:
    {{- include "go-echo92ef3e03-d1de-45f4-b37f-ee218958837a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo92ef3e03-d1de-45f4-b37f-ee218958837a.selectorLabels" . | nindent 6 }}
