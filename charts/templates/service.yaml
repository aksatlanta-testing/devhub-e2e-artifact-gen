apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1e6a95f5-fdd0-44b4-aff9-9150186c8968.fullname" . }}
  labels:
    {{- include "go-echo1e6a95f5-fdd0-44b4-aff9-9150186c8968.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1e6a95f5-fdd0-44b4-aff9-9150186c8968.selectorLabels" . | nindent 6 }}
