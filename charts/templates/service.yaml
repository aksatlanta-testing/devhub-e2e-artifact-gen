apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8a0be744-744b-4228-bb30-44decbe7e90b.fullname" . }}
  labels:
    {{- include "go-echo8a0be744-744b-4228-bb30-44decbe7e90b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8a0be744-744b-4228-bb30-44decbe7e90b.selectorLabels" . | nindent 6 }}
