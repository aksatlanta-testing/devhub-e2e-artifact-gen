apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodb57dc13-daaa-4253-8568-fc92e7415d9c.fullname" . }}
  labels:
    {{- include "go-echodb57dc13-daaa-4253-8568-fc92e7415d9c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodb57dc13-daaa-4253-8568-fc92e7415d9c.selectorLabels" . | nindent 6 }}
