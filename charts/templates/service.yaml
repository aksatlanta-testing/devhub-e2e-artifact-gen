apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5c25fd9d-dc2b-467a-b5f7-d8b8b66a0928.fullname" . }}
  labels:
    {{- include "go-echo5c25fd9d-dc2b-467a-b5f7-d8b8b66a0928.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5c25fd9d-dc2b-467a-b5f7-d8b8b66a0928.selectorLabels" . | nindent 6 }}
