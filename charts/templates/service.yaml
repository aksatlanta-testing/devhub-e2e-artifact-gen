apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6e5a1db2-c576-4dd3-9748-685f386f7f04.fullname" . }}
  labels:
    {{- include "go-echo6e5a1db2-c576-4dd3-9748-685f386f7f04.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6e5a1db2-c576-4dd3-9748-685f386f7f04.selectorLabels" . | nindent 6 }}
