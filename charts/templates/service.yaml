apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo38646f52-b055-4f14-99af-ae43d822ea71.fullname" . }}
  labels:
    {{- include "go-echo38646f52-b055-4f14-99af-ae43d822ea71.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo38646f52-b055-4f14-99af-ae43d822ea71.selectorLabels" . | nindent 6 }}
