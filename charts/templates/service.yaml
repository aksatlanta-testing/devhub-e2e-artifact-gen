apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo75f14fbe-bf69-4482-bf89-481d935e8acc.fullname" . }}
  labels:
    {{- include "go-echo75f14fbe-bf69-4482-bf89-481d935e8acc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo75f14fbe-bf69-4482-bf89-481d935e8acc.selectorLabels" . | nindent 6 }}
