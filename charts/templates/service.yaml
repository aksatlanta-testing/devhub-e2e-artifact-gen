apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo40021f2a-1be6-4481-941d-41be834f20c7.fullname" . }}
  labels:
    {{- include "go-echo40021f2a-1be6-4481-941d-41be834f20c7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo40021f2a-1be6-4481-941d-41be834f20c7.selectorLabels" . | nindent 6 }}
