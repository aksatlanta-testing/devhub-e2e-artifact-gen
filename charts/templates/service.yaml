apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5dfbd1e1-8400-430d-bd2e-7ede9721a843.fullname" . }}
  labels:
    {{- include "go-echo5dfbd1e1-8400-430d-bd2e-7ede9721a843.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5dfbd1e1-8400-430d-bd2e-7ede9721a843.selectorLabels" . | nindent 6 }}
