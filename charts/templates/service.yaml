apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo90e200d3-7c3a-4145-8daf-d3d9b50c95ad.fullname" . }}
  labels:
    {{- include "go-echo90e200d3-7c3a-4145-8daf-d3d9b50c95ad.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo90e200d3-7c3a-4145-8daf-d3d9b50c95ad.selectorLabels" . | nindent 6 }}
