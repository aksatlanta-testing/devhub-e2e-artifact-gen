apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3256bd47-e994-4b87-a43d-eba7f5d258f1.fullname" . }}
  labels:
    {{- include "go-echo3256bd47-e994-4b87-a43d-eba7f5d258f1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3256bd47-e994-4b87-a43d-eba7f5d258f1.selectorLabels" . | nindent 6 }}
