apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4132ef88-32fc-4211-bce2-12c83102cd01.fullname" . }}
  labels:
    {{- include "go-echo4132ef88-32fc-4211-bce2-12c83102cd01.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4132ef88-32fc-4211-bce2-12c83102cd01.selectorLabels" . | nindent 6 }}
