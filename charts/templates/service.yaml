apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoed752cea-872c-48cf-9a47-d1ba88eed6d9.fullname" . }}
  labels:
    {{- include "go-echoed752cea-872c-48cf-9a47-d1ba88eed6d9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoed752cea-872c-48cf-9a47-d1ba88eed6d9.selectorLabels" . | nindent 6 }}
