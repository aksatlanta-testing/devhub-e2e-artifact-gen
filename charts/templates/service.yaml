apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo22ab39d9-8915-4e2f-88f5-952cb0606a69.fullname" . }}
  labels:
    {{- include "go-echo22ab39d9-8915-4e2f-88f5-952cb0606a69.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo22ab39d9-8915-4e2f-88f5-952cb0606a69.selectorLabels" . | nindent 6 }}
