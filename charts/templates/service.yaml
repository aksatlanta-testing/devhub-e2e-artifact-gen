apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe8baee5c-7ec9-4d22-8a7c-6f841e17c2af.fullname" . }}
  labels:
    {{- include "go-echoe8baee5c-7ec9-4d22-8a7c-6f841e17c2af.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe8baee5c-7ec9-4d22-8a7c-6f841e17c2af.selectorLabels" . | nindent 6 }}
