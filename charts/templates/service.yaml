apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo08abe297-9fb7-443b-ad08-eeb0e562e801.fullname" . }}
  labels:
    {{- include "go-echo08abe297-9fb7-443b-ad08-eeb0e562e801.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo08abe297-9fb7-443b-ad08-eeb0e562e801.selectorLabels" . | nindent 6 }}
