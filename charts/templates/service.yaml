apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodc370ffa-65f6-45ba-ae8c-7cc2deabe4f9.fullname" . }}
  labels:
    {{- include "go-echodc370ffa-65f6-45ba-ae8c-7cc2deabe4f9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodc370ffa-65f6-45ba-ae8c-7cc2deabe4f9.selectorLabels" . | nindent 6 }}
