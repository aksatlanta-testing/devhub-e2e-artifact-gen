apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo77dce794-1577-4bfa-8b12-756e316255b5.fullname" . }}
  labels:
    {{- include "go-echo77dce794-1577-4bfa-8b12-756e316255b5.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo77dce794-1577-4bfa-8b12-756e316255b5.selectorLabels" . | nindent 6 }}
