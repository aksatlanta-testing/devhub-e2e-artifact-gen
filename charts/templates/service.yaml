apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo41a66375-1670-4e1f-91a4-7a6abd29d67d.fullname" . }}
  labels:
    {{- include "go-echo41a66375-1670-4e1f-91a4-7a6abd29d67d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo41a66375-1670-4e1f-91a4-7a6abd29d67d.selectorLabels" . | nindent 6 }}
