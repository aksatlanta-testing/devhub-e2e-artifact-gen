apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2610f0f2-5730-456c-8a58-7c337ffdeaa6.fullname" . }}
  labels:
    {{- include "go-echo2610f0f2-5730-456c-8a58-7c337ffdeaa6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2610f0f2-5730-456c-8a58-7c337ffdeaa6.selectorLabels" . | nindent 6 }}
