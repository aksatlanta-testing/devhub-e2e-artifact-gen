apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof1e190eb-a68a-4a94-a3ad-34aff83e910f.fullname" . }}
  labels:
    {{- include "go-echof1e190eb-a68a-4a94-a3ad-34aff83e910f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof1e190eb-a68a-4a94-a3ad-34aff83e910f.selectorLabels" . | nindent 6 }}
