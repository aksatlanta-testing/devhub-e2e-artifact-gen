apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo37ad45b6-2022-43a7-8704-8b96d2d15372.fullname" . }}
  labels:
    {{- include "go-echo37ad45b6-2022-43a7-8704-8b96d2d15372.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo37ad45b6-2022-43a7-8704-8b96d2d15372.selectorLabels" . | nindent 6 }}
