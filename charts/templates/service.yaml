apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6b17a8eb-a365-4cb9-8378-f6e11d89a953.fullname" . }}
  labels:
    {{- include "go-echo6b17a8eb-a365-4cb9-8378-f6e11d89a953.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6b17a8eb-a365-4cb9-8378-f6e11d89a953.selectorLabels" . | nindent 6 }}
