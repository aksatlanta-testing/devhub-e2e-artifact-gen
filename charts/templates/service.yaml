apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo14540d4b-5daa-4fe1-b5e7-cb6ed8749849.fullname" . }}
  labels:
    {{- include "go-echo14540d4b-5daa-4fe1-b5e7-cb6ed8749849.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo14540d4b-5daa-4fe1-b5e7-cb6ed8749849.selectorLabels" . | nindent 6 }}
