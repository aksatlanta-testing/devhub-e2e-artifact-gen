apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0a3fe3e7-3b73-4179-a2ed-b7eb7085dc99.fullname" . }}
  labels:
    {{- include "go-echo0a3fe3e7-3b73-4179-a2ed-b7eb7085dc99.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0a3fe3e7-3b73-4179-a2ed-b7eb7085dc99.selectorLabels" . | nindent 6 }}
