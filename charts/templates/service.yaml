apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo260f6098-0d10-4a2b-b22d-1c46451784a0.fullname" . }}
  labels:
    {{- include "go-echo260f6098-0d10-4a2b-b22d-1c46451784a0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo260f6098-0d10-4a2b-b22d-1c46451784a0.selectorLabels" . | nindent 6 }}
