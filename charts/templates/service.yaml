apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo06be4cdc-c624-4eff-8d73-4628a0ac6c40.fullname" . }}
  labels:
    {{- include "go-echo06be4cdc-c624-4eff-8d73-4628a0ac6c40.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo06be4cdc-c624-4eff-8d73-4628a0ac6c40.selectorLabels" . | nindent 6 }}
