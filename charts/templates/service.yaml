apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo99ca3d47-17af-467c-b072-ed655e3d79fa.fullname" . }}
  labels:
    {{- include "go-echo99ca3d47-17af-467c-b072-ed655e3d79fa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo99ca3d47-17af-467c-b072-ed655e3d79fa.selectorLabels" . | nindent 6 }}
