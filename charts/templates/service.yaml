apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoafd8d6a1-cfce-4823-a66b-360bd7613892.fullname" . }}
  labels:
    {{- include "go-echoafd8d6a1-cfce-4823-a66b-360bd7613892.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoafd8d6a1-cfce-4823-a66b-360bd7613892.selectorLabels" . | nindent 6 }}
