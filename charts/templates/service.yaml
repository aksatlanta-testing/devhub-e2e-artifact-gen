apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo53b5ecc2-104e-43f7-9c8d-45b7a3402bb9.fullname" . }}
  labels:
    {{- include "go-echo53b5ecc2-104e-43f7-9c8d-45b7a3402bb9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo53b5ecc2-104e-43f7-9c8d-45b7a3402bb9.selectorLabels" . | nindent 6 }}
