apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo358bc607-619f-466b-92aa-a95eb95b42b6.fullname" . }}
  labels:
    {{- include "go-echo358bc607-619f-466b-92aa-a95eb95b42b6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo358bc607-619f-466b-92aa-a95eb95b42b6.selectorLabels" . | nindent 6 }}
