apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe96797b1-5149-4f28-a9b2-cd1b5b205fa9.fullname" . }}
  labels:
    {{- include "go-echoe96797b1-5149-4f28-a9b2-cd1b5b205fa9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe96797b1-5149-4f28-a9b2-cd1b5b205fa9.selectorLabels" . | nindent 6 }}
