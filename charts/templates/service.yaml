apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4849f88c-e360-4b94-bbbf-e2f9bb26f479.fullname" . }}
  labels:
    {{- include "go-echo4849f88c-e360-4b94-bbbf-e2f9bb26f479.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4849f88c-e360-4b94-bbbf-e2f9bb26f479.selectorLabels" . | nindent 6 }}
