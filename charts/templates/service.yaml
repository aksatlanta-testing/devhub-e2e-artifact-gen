apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo696378da-3b85-4d0e-b9ed-e90cce25df96.fullname" . }}
  labels:
    {{- include "go-echo696378da-3b85-4d0e-b9ed-e90cce25df96.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo696378da-3b85-4d0e-b9ed-e90cce25df96.selectorLabels" . | nindent 6 }}
