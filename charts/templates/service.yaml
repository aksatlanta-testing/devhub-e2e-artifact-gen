apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5bcaeb76-7bd7-4103-82cd-faab6e523400.fullname" . }}
  labels:
    {{- include "go-echo5bcaeb76-7bd7-4103-82cd-faab6e523400.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5bcaeb76-7bd7-4103-82cd-faab6e523400.selectorLabels" . | nindent 6 }}
