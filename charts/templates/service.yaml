apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo12b4723b-afcc-4d5f-9180-b18ac3430112.fullname" . }}
  labels:
    {{- include "go-echo12b4723b-afcc-4d5f-9180-b18ac3430112.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo12b4723b-afcc-4d5f-9180-b18ac3430112.selectorLabels" . | nindent 6 }}
