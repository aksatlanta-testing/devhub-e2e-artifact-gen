apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo99d7f8ce-059c-4a4b-bd13-cefef26c20a2.fullname" . }}
  labels:
    {{- include "go-echo99d7f8ce-059c-4a4b-bd13-cefef26c20a2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo99d7f8ce-059c-4a4b-bd13-cefef26c20a2.selectorLabels" . | nindent 6 }}
