apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoce5f51dc-6a9a-4c76-aeef-be741016441c.fullname" . }}
  labels:
    {{- include "go-echoce5f51dc-6a9a-4c76-aeef-be741016441c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoce5f51dc-6a9a-4c76-aeef-be741016441c.selectorLabels" . | nindent 6 }}
