apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof63a42d3-ab7d-4f70-a152-0f028f0cb6eb.fullname" . }}
  labels:
    {{- include "go-echof63a42d3-ab7d-4f70-a152-0f028f0cb6eb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof63a42d3-ab7d-4f70-a152-0f028f0cb6eb.selectorLabels" . | nindent 6 }}
