apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo037bd405-c81e-40fa-801d-34c4a40affde.fullname" . }}
  labels:
    {{- include "go-echo037bd405-c81e-40fa-801d-34c4a40affde.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo037bd405-c81e-40fa-801d-34c4a40affde.selectorLabels" . | nindent 6 }}
