apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoca8583cd-412d-49e9-b853-0f25d5a36173.fullname" . }}
  labels:
    {{- include "go-echoca8583cd-412d-49e9-b853-0f25d5a36173.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoca8583cd-412d-49e9-b853-0f25d5a36173.selectorLabels" . | nindent 6 }}
