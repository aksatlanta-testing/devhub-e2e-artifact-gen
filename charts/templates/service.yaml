apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo02a39102-8293-441e-856a-d819f3687307.fullname" . }}
  labels:
    {{- include "go-echo02a39102-8293-441e-856a-d819f3687307.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo02a39102-8293-441e-856a-d819f3687307.selectorLabels" . | nindent 6 }}
