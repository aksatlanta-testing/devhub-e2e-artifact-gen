apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo10d0099b-fd29-4ad6-bfdd-f452ecca87f2.fullname" . }}
  labels:
    {{- include "go-echo10d0099b-fd29-4ad6-bfdd-f452ecca87f2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo10d0099b-fd29-4ad6-bfdd-f452ecca87f2.selectorLabels" . | nindent 6 }}
