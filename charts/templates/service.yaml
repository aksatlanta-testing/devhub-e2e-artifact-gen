apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3ec51839-5014-42dc-9421-05827c87cee5.fullname" . }}
  labels:
    {{- include "go-echo3ec51839-5014-42dc-9421-05827c87cee5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3ec51839-5014-42dc-9421-05827c87cee5.selectorLabels" . | nindent 6 }}
