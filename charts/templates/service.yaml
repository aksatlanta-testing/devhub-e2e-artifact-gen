apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod0ca53b2-df6d-420d-886f-124b4ae8f7be.fullname" . }}
  labels:
    {{- include "go-echod0ca53b2-df6d-420d-886f-124b4ae8f7be.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod0ca53b2-df6d-420d-886f-124b4ae8f7be.selectorLabels" . | nindent 6 }}
