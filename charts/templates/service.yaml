apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa138187e-e1ef-41aa-8009-5d5ea042c090.fullname" . }}
  labels:
    {{- include "go-echoa138187e-e1ef-41aa-8009-5d5ea042c090.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa138187e-e1ef-41aa-8009-5d5ea042c090.selectorLabels" . | nindent 6 }}
