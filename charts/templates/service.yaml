apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo92a4d9f5-e5eb-448e-96c5-465667ceb580.fullname" . }}
  labels:
    {{- include "go-echo92a4d9f5-e5eb-448e-96c5-465667ceb580.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo92a4d9f5-e5eb-448e-96c5-465667ceb580.selectorLabels" . | nindent 6 }}
