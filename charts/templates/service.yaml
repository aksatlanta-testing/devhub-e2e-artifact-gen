apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7bc0725f-1c8c-4807-9523-1fef56215071.fullname" . }}
  labels:
    {{- include "go-echo7bc0725f-1c8c-4807-9523-1fef56215071.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7bc0725f-1c8c-4807-9523-1fef56215071.selectorLabels" . | nindent 6 }}
