apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo20fb516b-5bf7-41d3-969f-dc611d3edf3d.fullname" . }}
  labels:
    {{- include "go-echo20fb516b-5bf7-41d3-969f-dc611d3edf3d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo20fb516b-5bf7-41d3-969f-dc611d3edf3d.selectorLabels" . | nindent 6 }}
