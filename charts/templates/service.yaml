apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8e92b941-4664-4ccd-9b7c-83611a775d28.fullname" . }}
  labels:
    {{- include "go-echo8e92b941-4664-4ccd-9b7c-83611a775d28.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8e92b941-4664-4ccd-9b7c-83611a775d28.selectorLabels" . | nindent 6 }}
