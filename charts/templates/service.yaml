apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa4a876de-67a5-441e-9ee8-0ba9af92683f.fullname" . }}
  labels:
    {{- include "go-echoa4a876de-67a5-441e-9ee8-0ba9af92683f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa4a876de-67a5-441e-9ee8-0ba9af92683f.selectorLabels" . | nindent 6 }}
