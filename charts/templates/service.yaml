apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9ed15bae-4473-4839-82ac-c1357e359ea4.fullname" . }}
  labels:
    {{- include "go-echo9ed15bae-4473-4839-82ac-c1357e359ea4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9ed15bae-4473-4839-82ac-c1357e359ea4.selectorLabels" . | nindent 6 }}
