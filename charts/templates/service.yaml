apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoef3302eb-f828-4d6d-a2d6-04499359e6d3.fullname" . }}
  labels:
    {{- include "go-echoef3302eb-f828-4d6d-a2d6-04499359e6d3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoef3302eb-f828-4d6d-a2d6-04499359e6d3.selectorLabels" . | nindent 6 }}
