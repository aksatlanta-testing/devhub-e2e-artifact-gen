apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo70efc9ed-07ea-4f99-9230-5c70484d0c72.fullname" . }}
  labels:
    {{- include "go-echo70efc9ed-07ea-4f99-9230-5c70484d0c72.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo70efc9ed-07ea-4f99-9230-5c70484d0c72.selectorLabels" . | nindent 6 }}
