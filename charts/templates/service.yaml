apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0d61bc16-7209-459a-a126-4fd22bcbd19b.fullname" . }}
  labels:
    {{- include "go-echo0d61bc16-7209-459a-a126-4fd22bcbd19b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0d61bc16-7209-459a-a126-4fd22bcbd19b.selectorLabels" . | nindent 6 }}
