apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9a7867e6-d248-43fc-a5b7-cf1ce9a5a2b0.fullname" . }}
  labels:
    {{- include "go-echo9a7867e6-d248-43fc-a5b7-cf1ce9a5a2b0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9a7867e6-d248-43fc-a5b7-cf1ce9a5a2b0.selectorLabels" . | nindent 6 }}
