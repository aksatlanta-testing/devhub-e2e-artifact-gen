apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9a4e39bd-a13d-41d6-b6ef-64874c72f908.fullname" . }}
  labels:
    {{- include "go-echo9a4e39bd-a13d-41d6-b6ef-64874c72f908.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9a4e39bd-a13d-41d6-b6ef-64874c72f908.selectorLabels" . | nindent 6 }}
