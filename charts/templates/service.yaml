apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe5420699-1dd9-4097-aa0d-7a9768f3f6c2.fullname" . }}
  labels:
    {{- include "go-echoe5420699-1dd9-4097-aa0d-7a9768f3f6c2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe5420699-1dd9-4097-aa0d-7a9768f3f6c2.selectorLabels" . | nindent 6 }}
