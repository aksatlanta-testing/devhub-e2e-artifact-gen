apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1b4e4a26-eb88-464e-9d80-4065225d640a.fullname" . }}
  labels:
    {{- include "go-echo1b4e4a26-eb88-464e-9d80-4065225d640a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1b4e4a26-eb88-464e-9d80-4065225d640a.selectorLabels" . | nindent 6 }}
