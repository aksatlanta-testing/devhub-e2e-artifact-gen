apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3862c19e-7a89-4ed7-b6ad-9a312d3d8886.fullname" . }}
  labels:
    {{- include "go-echo3862c19e-7a89-4ed7-b6ad-9a312d3d8886.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3862c19e-7a89-4ed7-b6ad-9a312d3d8886.selectorLabels" . | nindent 6 }}
