apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa5e8cfe6-8323-4925-ad0a-1d2d20c8ebdd.fullname" . }}
  labels:
    {{- include "go-echoa5e8cfe6-8323-4925-ad0a-1d2d20c8ebdd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa5e8cfe6-8323-4925-ad0a-1d2d20c8ebdd.selectorLabels" . | nindent 6 }}
