apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoafa6eae2-d674-4b09-88b9-ac05e7f8fa23.fullname" . }}
  labels:
    {{- include "go-echoafa6eae2-d674-4b09-88b9-ac05e7f8fa23.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoafa6eae2-d674-4b09-88b9-ac05e7f8fa23.selectorLabels" . | nindent 6 }}
