apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo05c40436-7529-403f-af7e-4e96daa97e24.fullname" . }}
  labels:
    {{- include "go-echo05c40436-7529-403f-af7e-4e96daa97e24.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo05c40436-7529-403f-af7e-4e96daa97e24.selectorLabels" . | nindent 6 }}
