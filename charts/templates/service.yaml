apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo016ddcf4-8e37-4448-97ca-bce222658dc2.fullname" . }}
  labels:
    {{- include "go-echo016ddcf4-8e37-4448-97ca-bce222658dc2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo016ddcf4-8e37-4448-97ca-bce222658dc2.selectorLabels" . | nindent 6 }}
