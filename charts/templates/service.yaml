apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo66c648c6-18e0-4cc3-8548-e51b909d32a1.fullname" . }}
  labels:
    {{- include "go-echo66c648c6-18e0-4cc3-8548-e51b909d32a1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo66c648c6-18e0-4cc3-8548-e51b909d32a1.selectorLabels" . | nindent 6 }}
