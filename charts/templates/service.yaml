apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo98572878-946f-4549-bc9d-2d8d320ba836.fullname" . }}
  labels:
    {{- include "go-echo98572878-946f-4549-bc9d-2d8d320ba836.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo98572878-946f-4549-bc9d-2d8d320ba836.selectorLabels" . | nindent 6 }}
