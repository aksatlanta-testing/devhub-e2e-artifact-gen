apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo41cd51f0-3c67-4a4e-badf-ef011d100bc0.fullname" . }}
  labels:
    {{- include "go-echo41cd51f0-3c67-4a4e-badf-ef011d100bc0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo41cd51f0-3c67-4a4e-badf-ef011d100bc0.selectorLabels" . | nindent 6 }}
