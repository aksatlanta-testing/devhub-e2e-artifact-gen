apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob9db561f-88d7-46f0-a4de-c236e9743f78.fullname" . }}
  labels:
    {{- include "go-echob9db561f-88d7-46f0-a4de-c236e9743f78.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob9db561f-88d7-46f0-a4de-c236e9743f78.selectorLabels" . | nindent 6 }}
