apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo113b81c2-de27-4d51-bd6b-fbd533420335.fullname" . }}
  labels:
    {{- include "go-echo113b81c2-de27-4d51-bd6b-fbd533420335.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo113b81c2-de27-4d51-bd6b-fbd533420335.selectorLabels" . | nindent 6 }}
