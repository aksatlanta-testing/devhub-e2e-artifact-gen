apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoefdc0708-665e-47e4-91f7-347a1b04921a.fullname" . }}
  labels:
    {{- include "go-echoefdc0708-665e-47e4-91f7-347a1b04921a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoefdc0708-665e-47e4-91f7-347a1b04921a.selectorLabels" . | nindent 6 }}
