apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo915bc42e-3156-4548-aa5b-64a0693aeb0b.fullname" . }}
  labels:
    {{- include "go-echo915bc42e-3156-4548-aa5b-64a0693aeb0b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo915bc42e-3156-4548-aa5b-64a0693aeb0b.selectorLabels" . | nindent 6 }}
