apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2d15bce2-f18f-4bb1-ba88-c89acb0563f4.fullname" . }}
  labels:
    {{- include "go-echo2d15bce2-f18f-4bb1-ba88-c89acb0563f4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2d15bce2-f18f-4bb1-ba88-c89acb0563f4.selectorLabels" . | nindent 6 }}
