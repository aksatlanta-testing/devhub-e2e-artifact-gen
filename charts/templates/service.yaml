apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo39167c6b-8a3b-449a-83fc-e381f048adbb.fullname" . }}
  labels:
    {{- include "go-echo39167c6b-8a3b-449a-83fc-e381f048adbb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo39167c6b-8a3b-449a-83fc-e381f048adbb.selectorLabels" . | nindent 6 }}
