apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof71f7baf-ca09-4268-8ab3-337c74d60f6a.fullname" . }}
  labels:
    {{- include "go-echof71f7baf-ca09-4268-8ab3-337c74d60f6a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof71f7baf-ca09-4268-8ab3-337c74d60f6a.selectorLabels" . | nindent 6 }}
