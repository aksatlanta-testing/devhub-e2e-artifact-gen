apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa3703f18-1b7c-4739-82ab-701f605e8263.fullname" . }}
  labels:
    {{- include "go-echoa3703f18-1b7c-4739-82ab-701f605e8263.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa3703f18-1b7c-4739-82ab-701f605e8263.selectorLabels" . | nindent 6 }}
