apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod9f571b8-6c67-48d0-861c-46188da31f17.fullname" . }}
  labels:
    {{- include "go-echod9f571b8-6c67-48d0-861c-46188da31f17.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
