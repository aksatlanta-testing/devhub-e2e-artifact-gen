apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9c9b1432-d0cc-4722-b22d-b605ebc0e6de.fullname" . }}
  labels:
    {{- include "go-echo9c9b1432-d0cc-4722-b22d-b605ebc0e6de.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9c9b1432-d0cc-4722-b22d-b605ebc0e6de.selectorLabels" . | nindent 6 }}
