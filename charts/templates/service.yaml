apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo24a9a666-a2b4-4b71-b88f-c24102c0ecef.fullname" . }}
  labels:
    {{- include "go-echo24a9a666-a2b4-4b71-b88f-c24102c0ecef.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo24a9a666-a2b4-4b71-b88f-c24102c0ecef.selectorLabels" . | nindent 6 }}
