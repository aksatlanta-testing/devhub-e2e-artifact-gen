apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa172f27c-ad0b-4338-b8ce-cab769994a6c.fullname" . }}
  labels:
    {{- include "go-echoa172f27c-ad0b-4338-b8ce-cab769994a6c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa172f27c-ad0b-4338-b8ce-cab769994a6c.selectorLabels" . | nindent 6 }}
