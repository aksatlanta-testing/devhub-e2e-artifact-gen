apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe499999c-a1a3-4f01-a7cc-4e2c75c923fa.fullname" . }}
  labels:
    {{- include "go-echoe499999c-a1a3-4f01-a7cc-4e2c75c923fa.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe499999c-a1a3-4f01-a7cc-4e2c75c923fa.selectorLabels" . | nindent 6 }}
