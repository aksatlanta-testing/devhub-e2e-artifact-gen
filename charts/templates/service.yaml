apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2db8e1dc-2ae0-4c0b-a649-27ca92dda118.fullname" . }}
  labels:
    {{- include "go-echo2db8e1dc-2ae0-4c0b-a649-27ca92dda118.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2db8e1dc-2ae0-4c0b-a649-27ca92dda118.selectorLabels" . | nindent 6 }}
