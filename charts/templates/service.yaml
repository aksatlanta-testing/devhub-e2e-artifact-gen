apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo360ea4c5-cdb2-44ba-9a65-41cd487cd042.fullname" . }}
  labels:
    {{- include "go-echo360ea4c5-cdb2-44ba-9a65-41cd487cd042.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo360ea4c5-cdb2-44ba-9a65-41cd487cd042.selectorLabels" . | nindent 6 }}
