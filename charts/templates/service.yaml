apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob6b059a5-2818-46fd-b5fe-ae8f4b5ca09a.fullname" . }}
  labels:
    {{- include "go-echob6b059a5-2818-46fd-b5fe-ae8f4b5ca09a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob6b059a5-2818-46fd-b5fe-ae8f4b5ca09a.selectorLabels" . | nindent 6 }}
