apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo02283740-127d-493f-8e09-7ce290a7d073.fullname" . }}
  labels:
    {{- include "go-echo02283740-127d-493f-8e09-7ce290a7d073.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo02283740-127d-493f-8e09-7ce290a7d073.selectorLabels" . | nindent 6 }}
