apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo187f293a-3406-400b-b01d-da2f9a46b78e.fullname" . }}
  labels:
    {{- include "go-echo187f293a-3406-400b-b01d-da2f9a46b78e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo187f293a-3406-400b-b01d-da2f9a46b78e.selectorLabels" . | nindent 6 }}
