apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo026c1d08-6433-49b2-bb35-b310f6c832ff.fullname" . }}
  labels:
    {{- include "go-echo026c1d08-6433-49b2-bb35-b310f6c832ff.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo026c1d08-6433-49b2-bb35-b310f6c832ff.selectorLabels" . | nindent 6 }}
