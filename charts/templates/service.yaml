apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8fbca471-e10a-4875-af77-0c0392a28529.fullname" . }}
  labels:
    {{- include "go-echo8fbca471-e10a-4875-af77-0c0392a28529.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8fbca471-e10a-4875-af77-0c0392a28529.selectorLabels" . | nindent 6 }}
