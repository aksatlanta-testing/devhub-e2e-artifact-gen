apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodc5cb75e-701c-458e-86fd-ee48c474ab5c.fullname" . }}
  labels:
    {{- include "go-echodc5cb75e-701c-458e-86fd-ee48c474ab5c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodc5cb75e-701c-458e-86fd-ee48c474ab5c.selectorLabels" . | nindent 6 }}
