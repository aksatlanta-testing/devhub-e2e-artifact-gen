apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobc7eb03a-e05a-42cb-b560-839e1e6736c5.fullname" . }}
  labels:
    {{- include "go-echobc7eb03a-e05a-42cb-b560-839e1e6736c5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobc7eb03a-e05a-42cb-b560-839e1e6736c5.selectorLabels" . | nindent 6 }}
