apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo10026003-e328-4fab-b111-3ad5b8845293.fullname" . }}
  labels:
    {{- include "go-echo10026003-e328-4fab-b111-3ad5b8845293.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo10026003-e328-4fab-b111-3ad5b8845293.selectorLabels" . | nindent 6 }}
