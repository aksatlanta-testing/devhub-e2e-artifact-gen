apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob206084e-aba0-4642-b598-3dfaffde8818.fullname" . }}
  labels:
    {{- include "go-echob206084e-aba0-4642-b598-3dfaffde8818.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob206084e-aba0-4642-b598-3dfaffde8818.selectorLabels" . | nindent 6 }}
