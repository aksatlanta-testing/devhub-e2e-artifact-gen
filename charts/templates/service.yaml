apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1f3034fe-49f8-4ead-b4ef-29639c346304.fullname" . }}
  labels:
    {{- include "go-echo1f3034fe-49f8-4ead-b4ef-29639c346304.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1f3034fe-49f8-4ead-b4ef-29639c346304.selectorLabels" . | nindent 6 }}
