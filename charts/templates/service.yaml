apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2d923ce1-b43c-42e6-8563-9242ddc3112c.fullname" . }}
  labels:
    {{- include "go-echo2d923ce1-b43c-42e6-8563-9242ddc3112c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2d923ce1-b43c-42e6-8563-9242ddc3112c.selectorLabels" . | nindent 6 }}
