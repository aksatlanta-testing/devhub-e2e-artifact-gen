apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5dcd2df0-55fb-4ade-8090-0973fbe8aef0.fullname" . }}
  labels:
    {{- include "go-echo5dcd2df0-55fb-4ade-8090-0973fbe8aef0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5dcd2df0-55fb-4ade-8090-0973fbe8aef0.selectorLabels" . | nindent 6 }}
