apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0de2a601-0444-4aa5-bb15-fe310f02bcc7.fullname" . }}
  labels:
    {{- include "go-echo0de2a601-0444-4aa5-bb15-fe310f02bcc7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0de2a601-0444-4aa5-bb15-fe310f02bcc7.selectorLabels" . | nindent 6 }}
