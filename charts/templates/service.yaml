apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo262ef579-52e1-4153-afb2-b4af1a9c50dd.fullname" . }}
  labels:
    {{- include "go-echo262ef579-52e1-4153-afb2-b4af1a9c50dd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo262ef579-52e1-4153-afb2-b4af1a9c50dd.selectorLabels" . | nindent 6 }}
