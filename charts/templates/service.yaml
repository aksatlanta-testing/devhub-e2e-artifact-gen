apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo498f3837-57af-490d-928b-22b28cbb0f5e.fullname" . }}
  labels:
    {{- include "go-echo498f3837-57af-490d-928b-22b28cbb0f5e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo498f3837-57af-490d-928b-22b28cbb0f5e.selectorLabels" . | nindent 6 }}
