apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa9515db0-2f78-4a94-beee-3e0d0e253326.fullname" . }}
  labels:
    {{- include "go-echoa9515db0-2f78-4a94-beee-3e0d0e253326.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa9515db0-2f78-4a94-beee-3e0d0e253326.selectorLabels" . | nindent 6 }}
