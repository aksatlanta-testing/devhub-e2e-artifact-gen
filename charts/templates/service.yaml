apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo08e48cf0-15b3-4739-8d76-8aee49845d9b.fullname" . }}
  labels:
    {{- include "go-echo08e48cf0-15b3-4739-8d76-8aee49845d9b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo08e48cf0-15b3-4739-8d76-8aee49845d9b.selectorLabels" . | nindent 6 }}
