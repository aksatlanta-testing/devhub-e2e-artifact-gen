apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobd87ef16-a05f-4792-aa63-95b0eafcca63.fullname" . }}
  labels:
    {{- include "go-echobd87ef16-a05f-4792-aa63-95b0eafcca63.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobd87ef16-a05f-4792-aa63-95b0eafcca63.selectorLabels" . | nindent 6 }}
