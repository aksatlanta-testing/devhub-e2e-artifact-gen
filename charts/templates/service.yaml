apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo43e291f6-f23f-424e-9d6a-522a5d8fa6d6.fullname" . }}
  labels:
    {{- include "go-echo43e291f6-f23f-424e-9d6a-522a5d8fa6d6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo43e291f6-f23f-424e-9d6a-522a5d8fa6d6.selectorLabels" . | nindent 6 }}
