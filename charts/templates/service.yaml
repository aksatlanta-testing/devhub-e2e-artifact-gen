apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc97f69f4-17ad-4ee9-bbff-bcb8bcb953ae.fullname" . }}
  labels:
    {{- include "go-echoc97f69f4-17ad-4ee9-bbff-bcb8bcb953ae.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc97f69f4-17ad-4ee9-bbff-bcb8bcb953ae.selectorLabels" . | nindent 6 }}
