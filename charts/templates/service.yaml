apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof0cba73a-e1c5-459c-927e-9fdb4b443b6f.fullname" . }}
  labels:
    {{- include "go-echof0cba73a-e1c5-459c-927e-9fdb4b443b6f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof0cba73a-e1c5-459c-927e-9fdb4b443b6f.selectorLabels" . | nindent 6 }}
