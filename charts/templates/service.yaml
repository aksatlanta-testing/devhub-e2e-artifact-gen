apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo28be13e3-79a9-4e22-8779-d5e977f2818b.fullname" . }}
  labels:
    {{- include "go-echo28be13e3-79a9-4e22-8779-d5e977f2818b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo28be13e3-79a9-4e22-8779-d5e977f2818b.selectorLabels" . | nindent 6 }}
