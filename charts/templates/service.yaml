apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe434616e-7c3d-401c-b9b2-ab9f3f3b6223.fullname" . }}
  labels:
    {{- include "go-echoe434616e-7c3d-401c-b9b2-ab9f3f3b6223.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe434616e-7c3d-401c-b9b2-ab9f3f3b6223.selectorLabels" . | nindent 6 }}
