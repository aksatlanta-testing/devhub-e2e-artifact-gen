apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8ab14e1a-f0c6-4227-b0a1-80cf398a25c2.fullname" . }}
  labels:
    {{- include "go-echo8ab14e1a-f0c6-4227-b0a1-80cf398a25c2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8ab14e1a-f0c6-4227-b0a1-80cf398a25c2.selectorLabels" . | nindent 6 }}
