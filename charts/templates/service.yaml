apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7708b1a4-21e1-4fd1-a51b-6da2d41b85f4.fullname" . }}
  labels:
    {{- include "go-echo7708b1a4-21e1-4fd1-a51b-6da2d41b85f4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7708b1a4-21e1-4fd1-a51b-6da2d41b85f4.selectorLabels" . | nindent 6 }}
