apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8fb3ac53-2d08-49ae-8eb5-5d65af725f0e.fullname" . }}
  labels:
    {{- include "go-echo8fb3ac53-2d08-49ae-8eb5-5d65af725f0e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8fb3ac53-2d08-49ae-8eb5-5d65af725f0e.selectorLabels" . | nindent 6 }}
