apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodde47ef6-2a09-41be-a4a0-52c058487764.fullname" . }}
  labels:
    {{- include "go-echodde47ef6-2a09-41be-a4a0-52c058487764.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodde47ef6-2a09-41be-a4a0-52c058487764.selectorLabels" . | nindent 6 }}
