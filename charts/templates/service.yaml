apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofc370cfe-4e0e-46f7-899e-da531b4307b4.fullname" . }}
  labels:
    {{- include "go-echofc370cfe-4e0e-46f7-899e-da531b4307b4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofc370cfe-4e0e-46f7-899e-da531b4307b4.selectorLabels" . | nindent 6 }}
