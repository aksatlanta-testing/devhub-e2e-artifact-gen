apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo82f45ef6-3035-4d8a-be9c-e132b24535c8.fullname" . }}
  labels:
    {{- include "go-echo82f45ef6-3035-4d8a-be9c-e132b24535c8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo82f45ef6-3035-4d8a-be9c-e132b24535c8.selectorLabels" . | nindent 6 }}
