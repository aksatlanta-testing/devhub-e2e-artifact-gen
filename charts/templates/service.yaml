apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof2d503e7-9e9c-4df2-9911-95f3d85fa861.fullname" . }}
  labels:
    {{- include "go-echof2d503e7-9e9c-4df2-9911-95f3d85fa861.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof2d503e7-9e9c-4df2-9911-95f3d85fa861.selectorLabels" . | nindent 6 }}
