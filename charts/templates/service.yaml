apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo588c65da-01cb-451d-a14f-893c1d14ab5f.fullname" . }}
  labels:
    {{- include "go-echo588c65da-01cb-451d-a14f-893c1d14ab5f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo588c65da-01cb-451d-a14f-893c1d14ab5f.selectorLabels" . | nindent 6 }}
