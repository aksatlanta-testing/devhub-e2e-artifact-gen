apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo65da1578-b21a-44c3-bb54-4db53fe5991a.fullname" . }}
  labels:
    {{- include "go-echo65da1578-b21a-44c3-bb54-4db53fe5991a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo65da1578-b21a-44c3-bb54-4db53fe5991a.selectorLabels" . | nindent 6 }}
