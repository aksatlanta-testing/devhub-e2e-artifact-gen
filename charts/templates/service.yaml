apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6c308f35-6950-4887-813d-fd030b151d38.fullname" . }}
  labels:
    {{- include "go-echo6c308f35-6950-4887-813d-fd030b151d38.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6c308f35-6950-4887-813d-fd030b151d38.selectorLabels" . | nindent 6 }}
