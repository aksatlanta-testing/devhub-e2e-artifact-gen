apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4f2ba5a5-e791-431e-b918-f93db049da7a.fullname" . }}
  labels:
    {{- include "go-echo4f2ba5a5-e791-431e-b918-f93db049da7a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4f2ba5a5-e791-431e-b918-f93db049da7a.selectorLabels" . | nindent 6 }}
