apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa0105b23-17e1-4c8f-9c67-b614ae38eeea.fullname" . }}
  labels:
    {{- include "go-echoa0105b23-17e1-4c8f-9c67-b614ae38eeea.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: devhub
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa0105b23-17e1-4c8f-9c67-b614ae38eeea.selectorLabels" . | nindent 4 }}
