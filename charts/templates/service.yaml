apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof547bccc-b6c1-460e-aeb4-151abc8f4bd5.fullname" . }}
  labels:
    {{- include "go-echof547bccc-b6c1-460e-aeb4-151abc8f4bd5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof547bccc-b6c1-460e-aeb4-151abc8f4bd5.selectorLabels" . | nindent 6 }}
