apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo19d86660-ea3d-44ff-9fe3-02d520e333c5.fullname" . }}
  labels:
    {{- include "go-echo19d86660-ea3d-44ff-9fe3-02d520e333c5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo19d86660-ea3d-44ff-9fe3-02d520e333c5.selectorLabels" . | nindent 6 }}
