apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9eb43e2e-9c55-484d-857c-3acc2e1bbb79.fullname" . }}
  labels:
    {{- include "go-echo9eb43e2e-9c55-484d-857c-3acc2e1bbb79.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9eb43e2e-9c55-484d-857c-3acc2e1bbb79.selectorLabels" . | nindent 6 }}
