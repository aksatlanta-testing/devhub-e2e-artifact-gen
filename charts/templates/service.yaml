apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2c54e663-8737-4ada-9761-c955d132e517.fullname" . }}
  labels:
    {{- include "go-echo2c54e663-8737-4ada-9761-c955d132e517.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2c54e663-8737-4ada-9761-c955d132e517.selectorLabels" . | nindent 6 }}
