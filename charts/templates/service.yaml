apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9f5342b3-02c5-403c-8817-8559aa58d149.fullname" . }}
  labels:
    {{- include "go-echo9f5342b3-02c5-403c-8817-8559aa58d149.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9f5342b3-02c5-403c-8817-8559aa58d149.selectorLabels" . | nindent 6 }}
