apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod60fd7b3-7573-41a7-956a-f73baf438182.fullname" . }}
  labels:
    {{- include "go-echod60fd7b3-7573-41a7-956a-f73baf438182.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod60fd7b3-7573-41a7-956a-f73baf438182.selectorLabels" . | nindent 6 }}
