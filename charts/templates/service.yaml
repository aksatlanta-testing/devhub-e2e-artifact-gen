apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe81a509d-de31-4d31-8a63-b3334c1f6e35.fullname" . }}
  labels:
    {{- include "go-echoe81a509d-de31-4d31-8a63-b3334c1f6e35.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe81a509d-de31-4d31-8a63-b3334c1f6e35.selectorLabels" . | nindent 6 }}
