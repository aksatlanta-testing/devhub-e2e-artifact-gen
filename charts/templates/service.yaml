apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo24153056-c2c2-4937-90a1-206ab12e5cd9.fullname" . }}
  labels:
    {{- include "go-echo24153056-c2c2-4937-90a1-206ab12e5cd9.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo24153056-c2c2-4937-90a1-206ab12e5cd9.selectorLabels" . | nindent 6 }}
