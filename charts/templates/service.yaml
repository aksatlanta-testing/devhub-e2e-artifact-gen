apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6917d87f-8fad-4c73-a356-80d1742b25a1.fullname" . }}
  labels:
    {{- include "go-echo6917d87f-8fad-4c73-a356-80d1742b25a1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6917d87f-8fad-4c73-a356-80d1742b25a1.selectorLabels" . | nindent 6 }}
