apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof1d20a23-4078-4dc7-aaa5-8025872885f2.fullname" . }}
  labels:
    {{- include "go-echof1d20a23-4078-4dc7-aaa5-8025872885f2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof1d20a23-4078-4dc7-aaa5-8025872885f2.selectorLabels" . | nindent 6 }}
