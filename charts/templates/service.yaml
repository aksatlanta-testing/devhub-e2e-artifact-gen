apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo94420be2-3282-4663-a60b-b2c32d619b16.fullname" . }}
  labels:
    {{- include "go-echo94420be2-3282-4663-a60b-b2c32d619b16.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo94420be2-3282-4663-a60b-b2c32d619b16.selectorLabels" . | nindent 6 }}
