apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocdf07fdd-56d5-4b50-b6e9-28329a89ab1a.fullname" . }}
  labels:
    {{- include "go-echocdf07fdd-56d5-4b50-b6e9-28329a89ab1a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocdf07fdd-56d5-4b50-b6e9-28329a89ab1a.selectorLabels" . | nindent 6 }}
