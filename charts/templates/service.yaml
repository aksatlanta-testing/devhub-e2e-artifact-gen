apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe5959f21-dfb0-4edd-bb8b-84f2d83084ff.fullname" . }}
  labels:
    {{- include "go-echoe5959f21-dfb0-4edd-bb8b-84f2d83084ff.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe5959f21-dfb0-4edd-bb8b-84f2d83084ff.selectorLabels" . | nindent 6 }}
