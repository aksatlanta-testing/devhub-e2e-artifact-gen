apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo04d58cc0-9347-4e88-87ad-043daaa97546.fullname" . }}
  labels:
    {{- include "go-echo04d58cc0-9347-4e88-87ad-043daaa97546.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo04d58cc0-9347-4e88-87ad-043daaa97546.selectorLabels" . | nindent 6 }}
