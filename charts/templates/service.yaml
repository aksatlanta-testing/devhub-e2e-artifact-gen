apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2de98497-41c2-43e3-aeed-0afbe98e9fd6.fullname" . }}
  labels:
    {{- include "go-echo2de98497-41c2-43e3-aeed-0afbe98e9fd6.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2de98497-41c2-43e3-aeed-0afbe98e9fd6.selectorLabels" . | nindent 6 }}
