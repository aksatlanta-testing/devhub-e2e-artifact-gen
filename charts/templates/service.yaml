apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofce9415e-8440-4acd-a56d-844afe2c7036.fullname" . }}
  labels:
    {{- include "go-echofce9415e-8440-4acd-a56d-844afe2c7036.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofce9415e-8440-4acd-a56d-844afe2c7036.selectorLabels" . | nindent 6 }}
