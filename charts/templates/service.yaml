apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0ae96668-e578-4619-9a16-fe2d34f9530e.fullname" . }}
  labels:
    {{- include "go-echo0ae96668-e578-4619-9a16-fe2d34f9530e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0ae96668-e578-4619-9a16-fe2d34f9530e.selectorLabels" . | nindent 6 }}
