apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8c265352-48cc-46d7-9cbb-d768e618a72a.fullname" . }}
  labels:
    {{- include "go-echo8c265352-48cc-46d7-9cbb-d768e618a72a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8c265352-48cc-46d7-9cbb-d768e618a72a.selectorLabels" . | nindent 6 }}
