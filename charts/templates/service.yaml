apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo60434ee3-bf7f-4d46-939b-ac3d2738fdd8.fullname" . }}
  labels:
    {{- include "go-echo60434ee3-bf7f-4d46-939b-ac3d2738fdd8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo60434ee3-bf7f-4d46-939b-ac3d2738fdd8.selectorLabels" . | nindent 6 }}
