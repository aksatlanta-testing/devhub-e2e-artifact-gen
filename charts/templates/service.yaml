apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo418ad360-2737-4d40-97cb-0778fbff8794.fullname" . }}
  labels:
    {{- include "go-echo418ad360-2737-4d40-97cb-0778fbff8794.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo418ad360-2737-4d40-97cb-0778fbff8794.selectorLabels" . | nindent 6 }}
