apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo06ba28a4-6cc9-47c5-b73f-77e031aebbf5.fullname" . }}
  labels:
    {{- include "go-echo06ba28a4-6cc9-47c5-b73f-77e031aebbf5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo06ba28a4-6cc9-47c5-b73f-77e031aebbf5.selectorLabels" . | nindent 6 }}
