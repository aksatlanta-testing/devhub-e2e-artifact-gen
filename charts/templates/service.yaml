apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo746c9b7a-7371-4242-a528-67998cfb9285.fullname" . }}
  labels:
    {{- include "go-echo746c9b7a-7371-4242-a528-67998cfb9285.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo746c9b7a-7371-4242-a528-67998cfb9285.selectorLabels" . | nindent 6 }}
