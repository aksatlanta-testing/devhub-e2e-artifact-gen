apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo31488285-a286-40f2-80e4-ab4662d84464.fullname" . }}
  labels:
    {{- include "go-echo31488285-a286-40f2-80e4-ab4662d84464.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo31488285-a286-40f2-80e4-ab4662d84464.selectorLabels" . | nindent 6 }}
