apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo66651526-5626-4ec8-9309-5087c411ab77.fullname" . }}
  labels:
    {{- include "go-echo66651526-5626-4ec8-9309-5087c411ab77.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo66651526-5626-4ec8-9309-5087c411ab77.selectorLabels" . | nindent 6 }}
