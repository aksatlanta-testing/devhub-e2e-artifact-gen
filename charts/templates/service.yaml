apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof21300ec-e19a-4094-b0df-22759c7fc93c.fullname" . }}
  labels:
    {{- include "go-echof21300ec-e19a-4094-b0df-22759c7fc93c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof21300ec-e19a-4094-b0df-22759c7fc93c.selectorLabels" . | nindent 6 }}
