apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodd7c36a5-e0e0-43dc-9cc6-960eb061062d.fullname" . }}
  labels:
    {{- include "go-echodd7c36a5-e0e0-43dc-9cc6-960eb061062d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodd7c36a5-e0e0-43dc-9cc6-960eb061062d.selectorLabels" . | nindent 6 }}
