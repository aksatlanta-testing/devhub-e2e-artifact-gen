apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe601e825-6f2c-49d1-b1b2-6e527c7194a9.fullname" . }}
  labels:
    {{- include "go-echoe601e825-6f2c-49d1-b1b2-6e527c7194a9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe601e825-6f2c-49d1-b1b2-6e527c7194a9.selectorLabels" . | nindent 6 }}
