apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoac0bea8e-a7da-436a-885b-5b76ab6693c1.fullname" . }}
  labels:
    {{- include "go-echoac0bea8e-a7da-436a-885b-5b76ab6693c1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoac0bea8e-a7da-436a-885b-5b76ab6693c1.selectorLabels" . | nindent 6 }}
