apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo95e6cb43-890d-467e-ad4b-f85184dcea07.fullname" . }}
  labels:
    {{- include "go-echo95e6cb43-890d-467e-ad4b-f85184dcea07.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo95e6cb43-890d-467e-ad4b-f85184dcea07.selectorLabels" . | nindent 6 }}
