apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa31e7e57-17a1-45ce-8a39-63b88339e99e.fullname" . }}
  labels:
    {{- include "go-echoa31e7e57-17a1-45ce-8a39-63b88339e99e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa31e7e57-17a1-45ce-8a39-63b88339e99e.selectorLabels" . | nindent 6 }}
