apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa88faa03-b8e9-4c76-956d-7194814a676f.fullname" . }}
  labels:
    {{- include "go-echoa88faa03-b8e9-4c76-956d-7194814a676f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa88faa03-b8e9-4c76-956d-7194814a676f.selectorLabels" . | nindent 6 }}
