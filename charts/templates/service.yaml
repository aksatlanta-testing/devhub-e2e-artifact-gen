apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo89e7d72f-ed3b-4376-a8a8-0d5144dce168.fullname" . }}
  labels:
    {{- include "go-echo89e7d72f-ed3b-4376-a8a8-0d5144dce168.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo89e7d72f-ed3b-4376-a8a8-0d5144dce168.selectorLabels" . | nindent 6 }}
