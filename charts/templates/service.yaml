apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo34facf44-67bd-4da7-9771-9079f80ee462.fullname" . }}
  labels:
    {{- include "go-echo34facf44-67bd-4da7-9771-9079f80ee462.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo34facf44-67bd-4da7-9771-9079f80ee462.selectorLabels" . | nindent 6 }}
