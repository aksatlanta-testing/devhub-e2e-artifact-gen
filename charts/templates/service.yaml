apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1b725ef4-639d-41c3-81a7-b2fce435d259.fullname" . }}
  labels:
    {{- include "go-echo1b725ef4-639d-41c3-81a7-b2fce435d259.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1b725ef4-639d-41c3-81a7-b2fce435d259.selectorLabels" . | nindent 6 }}
