apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4e8b9580-b76e-420f-9f5e-83bed10f0e5b.fullname" . }}
  labels:
    {{- include "go-echo4e8b9580-b76e-420f-9f5e-83bed10f0e5b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4e8b9580-b76e-420f-9f5e-83bed10f0e5b.selectorLabels" . | nindent 6 }}
