apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5dc9e6e6-8a25-4cf4-84a8-abf399a9cddc.fullname" . }}
  labels:
    {{- include "go-echo5dc9e6e6-8a25-4cf4-84a8-abf399a9cddc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5dc9e6e6-8a25-4cf4-84a8-abf399a9cddc.selectorLabels" . | nindent 6 }}
