apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoebf05d2c-a47f-4010-af0c-b99840e229ad.fullname" . }}
  labels:
    {{- include "go-echoebf05d2c-a47f-4010-af0c-b99840e229ad.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoebf05d2c-a47f-4010-af0c-b99840e229ad.selectorLabels" . | nindent 6 }}
