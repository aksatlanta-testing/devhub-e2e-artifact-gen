apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0a318aee-0a8c-49d0-9369-3a194d47cd4d.fullname" . }}
  labels:
    {{- include "go-echo0a318aee-0a8c-49d0-9369-3a194d47cd4d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0a318aee-0a8c-49d0-9369-3a194d47cd4d.selectorLabels" . | nindent 6 }}
