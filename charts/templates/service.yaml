apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6f03aa3a-24f5-44cd-83b2-381e1112d6bd.fullname" . }}
  labels:
    {{- include "go-echo6f03aa3a-24f5-44cd-83b2-381e1112d6bd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6f03aa3a-24f5-44cd-83b2-381e1112d6bd.selectorLabels" . | nindent 6 }}
