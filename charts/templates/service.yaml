apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7ff133df-a883-4a3b-86fd-194ba87595d4.fullname" . }}
  labels:
    {{- include "go-echo7ff133df-a883-4a3b-86fd-194ba87595d4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7ff133df-a883-4a3b-86fd-194ba87595d4.selectorLabels" . | nindent 6 }}
