apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe32d27ad-04df-4706-93e9-aa4c3d59cbf8.fullname" . }}
  labels:
    {{- include "go-echoe32d27ad-04df-4706-93e9-aa4c3d59cbf8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe32d27ad-04df-4706-93e9-aa4c3d59cbf8.selectorLabels" . | nindent 6 }}
