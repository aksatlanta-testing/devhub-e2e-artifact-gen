apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe671abf4-ec12-4487-b0f1-2765c09915d3.fullname" . }}
  labels:
    {{- include "go-echoe671abf4-ec12-4487-b0f1-2765c09915d3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe671abf4-ec12-4487-b0f1-2765c09915d3.selectorLabels" . | nindent 6 }}
