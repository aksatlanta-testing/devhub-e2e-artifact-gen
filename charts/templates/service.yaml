apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo24bf35eb-a403-4816-9e65-912e4adc502f.fullname" . }}
  labels:
    {{- include "go-echo24bf35eb-a403-4816-9e65-912e4adc502f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo24bf35eb-a403-4816-9e65-912e4adc502f.selectorLabels" . | nindent 6 }}
