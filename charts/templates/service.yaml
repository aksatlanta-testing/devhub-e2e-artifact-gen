apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof4c530c7-f328-4400-8671-9b439df33c0d.fullname" . }}
  labels:
    {{- include "go-echof4c530c7-f328-4400-8671-9b439df33c0d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof4c530c7-f328-4400-8671-9b439df33c0d.selectorLabels" . | nindent 6 }}
