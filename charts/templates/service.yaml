apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod74b6df8-4960-47cc-976d-1ce85271f453.fullname" . }}
  labels:
    {{- include "go-echod74b6df8-4960-47cc-976d-1ce85271f453.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod74b6df8-4960-47cc-976d-1ce85271f453.selectorLabels" . | nindent 6 }}
