apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob93197ea-8a5a-4755-bebe-6dcd1c00e02f.fullname" . }}
  labels:
    {{- include "go-echob93197ea-8a5a-4755-bebe-6dcd1c00e02f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob93197ea-8a5a-4755-bebe-6dcd1c00e02f.selectorLabels" . | nindent 6 }}
