apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaa70b31a-f3d0-443e-854d-d61d6817ef2b.fullname" . }}
  labels:
    {{- include "go-echoaa70b31a-f3d0-443e-854d-d61d6817ef2b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaa70b31a-f3d0-443e-854d-d61d6817ef2b.selectorLabels" . | nindent 6 }}
