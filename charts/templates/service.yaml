apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo21cd3631-bed3-4e65-ad9e-9db9a7e07946.fullname" . }}
  labels:
    {{- include "go-echo21cd3631-bed3-4e65-ad9e-9db9a7e07946.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo21cd3631-bed3-4e65-ad9e-9db9a7e07946.selectorLabels" . | nindent 6 }}
