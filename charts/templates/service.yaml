apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3afea87a-d457-4017-a2d8-da8e6f8a64b1.fullname" . }}
  labels:
    {{- include "go-echo3afea87a-d457-4017-a2d8-da8e6f8a64b1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3afea87a-d457-4017-a2d8-da8e6f8a64b1.selectorLabels" . | nindent 6 }}
