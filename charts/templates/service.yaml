apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoccc9a97a-816a-4f3b-b3a2-2ee01923dae7.fullname" . }}
  labels:
    {{- include "go-echoccc9a97a-816a-4f3b-b3a2-2ee01923dae7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoccc9a97a-816a-4f3b-b3a2-2ee01923dae7.selectorLabels" . | nindent 6 }}
