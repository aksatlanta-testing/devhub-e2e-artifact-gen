apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoca6788d2-c037-41ba-9d12-9fc2dc0b5709.fullname" . }}
  labels:
    {{- include "go-echoca6788d2-c037-41ba-9d12-9fc2dc0b5709.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoca6788d2-c037-41ba-9d12-9fc2dc0b5709.selectorLabels" . | nindent 6 }}
