apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo249a13b4-aff3-48f5-b394-d00f0c808b43.fullname" . }}
  labels:
    {{- include "go-echo249a13b4-aff3-48f5-b394-d00f0c808b43.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo249a13b4-aff3-48f5-b394-d00f0c808b43.selectorLabels" . | nindent 6 }}
