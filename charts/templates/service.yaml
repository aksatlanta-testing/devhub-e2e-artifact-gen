apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9ad9a4bd-4458-490f-9cfd-8c2226376824.fullname" . }}
  labels:
    {{- include "go-echo9ad9a4bd-4458-490f-9cfd-8c2226376824.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9ad9a4bd-4458-490f-9cfd-8c2226376824.selectorLabels" . | nindent 6 }}
