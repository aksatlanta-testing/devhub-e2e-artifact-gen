apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobb1c9563-9eb3-4f2d-b74d-70ce2d008125.fullname" . }}
  labels:
    {{- include "go-echobb1c9563-9eb3-4f2d-b74d-70ce2d008125.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobb1c9563-9eb3-4f2d-b74d-70ce2d008125.selectorLabels" . | nindent 6 }}
