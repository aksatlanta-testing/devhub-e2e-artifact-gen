apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe0579371-497c-4778-85ed-f94964fda783.fullname" . }}
  labels:
    {{- include "go-echoe0579371-497c-4778-85ed-f94964fda783.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe0579371-497c-4778-85ed-f94964fda783.selectorLabels" . | nindent 6 }}
