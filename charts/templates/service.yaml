apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo264f9a71-056b-43d2-a9d9-97c97648bfb8.fullname" . }}
  labels:
    {{- include "go-echo264f9a71-056b-43d2-a9d9-97c97648bfb8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo264f9a71-056b-43d2-a9d9-97c97648bfb8.selectorLabels" . | nindent 6 }}
