apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo79e53c5e-1669-413e-ba61-5b89e25a39bb.fullname" . }}
  labels:
    {{- include "go-echo79e53c5e-1669-413e-ba61-5b89e25a39bb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo79e53c5e-1669-413e-ba61-5b89e25a39bb.selectorLabels" . | nindent 6 }}
