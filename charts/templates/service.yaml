apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2b48b34d-034e-48b4-9ed8-70b6a9b8493b.fullname" . }}
  labels:
    {{- include "go-echo2b48b34d-034e-48b4-9ed8-70b6a9b8493b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2b48b34d-034e-48b4-9ed8-70b6a9b8493b.selectorLabels" . | nindent 6 }}
