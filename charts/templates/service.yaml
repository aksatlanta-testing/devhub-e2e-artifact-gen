apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4951a5e8-4398-40f3-b5aa-ca5a397e9a41.fullname" . }}
  labels:
    {{- include "go-echo4951a5e8-4398-40f3-b5aa-ca5a397e9a41.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4951a5e8-4398-40f3-b5aa-ca5a397e9a41.selectorLabels" . | nindent 6 }}
