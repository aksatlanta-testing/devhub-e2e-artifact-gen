apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobe8dfcaa-b53b-4a7e-9151-2d79d772311a.fullname" . }}
  labels:
    {{- include "go-echobe8dfcaa-b53b-4a7e-9151-2d79d772311a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobe8dfcaa-b53b-4a7e-9151-2d79d772311a.selectorLabels" . | nindent 6 }}
