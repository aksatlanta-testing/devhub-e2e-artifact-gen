apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8edf9a20-da8f-4caf-8d53-e6e31f4ba03c.fullname" . }}
  labels:
    {{- include "go-echo8edf9a20-da8f-4caf-8d53-e6e31f4ba03c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8edf9a20-da8f-4caf-8d53-e6e31f4ba03c.selectorLabels" . | nindent 6 }}
