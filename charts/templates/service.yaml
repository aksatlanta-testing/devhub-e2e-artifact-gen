apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0a1a9de5-9793-4fa5-bae6-3e8e925a70e1.fullname" . }}
  labels:
    {{- include "go-echo0a1a9de5-9793-4fa5-bae6-3e8e925a70e1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0a1a9de5-9793-4fa5-bae6-3e8e925a70e1.selectorLabels" . | nindent 6 }}
