apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8736d74b-e11a-40a2-a19b-844779f318bc.fullname" . }}
  labels:
    {{- include "go-echo8736d74b-e11a-40a2-a19b-844779f318bc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8736d74b-e11a-40a2-a19b-844779f318bc.selectorLabels" . | nindent 6 }}
