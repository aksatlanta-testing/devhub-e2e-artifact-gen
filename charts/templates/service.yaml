apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo02acb1d3-f0e8-4d00-87f2-5625414b9589.fullname" . }}
  labels:
    {{- include "go-echo02acb1d3-f0e8-4d00-87f2-5625414b9589.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo02acb1d3-f0e8-4d00-87f2-5625414b9589.selectorLabels" . | nindent 6 }}
