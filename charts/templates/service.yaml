apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9958cf60-d904-48c6-8e1f-8b066c0dad0c.fullname" . }}
  labels:
    {{- include "go-echo9958cf60-d904-48c6-8e1f-8b066c0dad0c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9958cf60-d904-48c6-8e1f-8b066c0dad0c.selectorLabels" . | nindent 6 }}
