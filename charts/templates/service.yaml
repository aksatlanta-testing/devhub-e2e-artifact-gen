apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo848f8237-39c5-4145-957e-d9c7a0b2c6ec.fullname" . }}
  labels:
    {{- include "go-echo848f8237-39c5-4145-957e-d9c7a0b2c6ec.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo848f8237-39c5-4145-957e-d9c7a0b2c6ec.selectorLabels" . | nindent 6 }}
