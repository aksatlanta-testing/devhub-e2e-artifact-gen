apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3e861a5a-a140-431b-8a08-52d0d0aa052e.fullname" . }}
  labels:
    {{- include "go-echo3e861a5a-a140-431b-8a08-52d0d0aa052e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3e861a5a-a140-431b-8a08-52d0d0aa052e.selectorLabels" . | nindent 6 }}
