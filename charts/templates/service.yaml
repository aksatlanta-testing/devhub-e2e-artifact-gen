apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3b808e21-fc38-476e-868a-2e7edb83298b.fullname" . }}
  labels:
    {{- include "go-echo3b808e21-fc38-476e-868a-2e7edb83298b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3b808e21-fc38-476e-868a-2e7edb83298b.selectorLabels" . | nindent 6 }}
