apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1d06f11f-fb51-4cab-b361-cbf5de85b1a8.fullname" . }}
  labels:
    {{- include "go-echo1d06f11f-fb51-4cab-b361-cbf5de85b1a8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1d06f11f-fb51-4cab-b361-cbf5de85b1a8.selectorLabels" . | nindent 6 }}
