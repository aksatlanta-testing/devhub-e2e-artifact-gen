apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoba9f6018-edaa-4e0b-b566-7e96f163eb01.fullname" . }}
  labels:
    {{- include "go-echoba9f6018-edaa-4e0b-b566-7e96f163eb01.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoba9f6018-edaa-4e0b-b566-7e96f163eb01.selectorLabels" . | nindent 6 }}
