apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo763b73c6-6c1e-41cb-9e3c-e8eaea0a3b6a.fullname" . }}
  labels:
    {{- include "go-echo763b73c6-6c1e-41cb-9e3c-e8eaea0a3b6a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo763b73c6-6c1e-41cb-9e3c-e8eaea0a3b6a.selectorLabels" . | nindent 6 }}
