apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaae1d3bb-04f8-44ba-a4d1-821c4869bf7f.fullname" . }}
  labels:
    {{- include "go-echoaae1d3bb-04f8-44ba-a4d1-821c4869bf7f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaae1d3bb-04f8-44ba-a4d1-821c4869bf7f.selectorLabels" . | nindent 6 }}
