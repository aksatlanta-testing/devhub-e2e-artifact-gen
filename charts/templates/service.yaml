apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodae3fdf8-58ec-400d-80c3-a8a63d93cdc2.fullname" . }}
  labels:
    {{- include "go-echodae3fdf8-58ec-400d-80c3-a8a63d93cdc2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodae3fdf8-58ec-400d-80c3-a8a63d93cdc2.selectorLabels" . | nindent 6 }}
