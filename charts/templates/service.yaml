apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo503040e3-ed4b-4639-a77e-250a067ee6fd.fullname" . }}
  labels:
    {{- include "go-echo503040e3-ed4b-4639-a77e-250a067ee6fd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo503040e3-ed4b-4639-a77e-250a067ee6fd.selectorLabels" . | nindent 6 }}
