apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofc797104-8a76-4219-93b9-48ae273feb5e.fullname" . }}
  labels:
    {{- include "go-echofc797104-8a76-4219-93b9-48ae273feb5e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofc797104-8a76-4219-93b9-48ae273feb5e.selectorLabels" . | nindent 6 }}
