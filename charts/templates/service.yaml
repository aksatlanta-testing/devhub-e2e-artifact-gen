apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo88198ca6-fa33-43a4-a98f-0cd101d34eda.fullname" . }}
  labels:
    {{- include "go-echo88198ca6-fa33-43a4-a98f-0cd101d34eda.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo88198ca6-fa33-43a4-a98f-0cd101d34eda.selectorLabels" . | nindent 6 }}
