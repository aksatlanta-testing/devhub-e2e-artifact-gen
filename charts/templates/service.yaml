apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7e263236-df05-4091-8e81-7859895a0439.fullname" . }}
  labels:
    {{- include "go-echo7e263236-df05-4091-8e81-7859895a0439.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
