apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1ececd12-91a9-4ab8-81ec-09a8788890fd.fullname" . }}
  labels:
    {{- include "go-echo1ececd12-91a9-4ab8-81ec-09a8788890fd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1ececd12-91a9-4ab8-81ec-09a8788890fd.selectorLabels" . | nindent 6 }}
