apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc27badf6-0f78-4dc0-86ee-57b5c2dce049.fullname" . }}
  labels:
    {{- include "go-echoc27badf6-0f78-4dc0-86ee-57b5c2dce049.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc27badf6-0f78-4dc0-86ee-57b5c2dce049.selectorLabels" . | nindent 6 }}
