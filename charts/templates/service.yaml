apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod9481798-addc-428c-acb5-152abd708af7.fullname" . }}
  labels:
    {{- include "go-echod9481798-addc-428c-acb5-152abd708af7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod9481798-addc-428c-acb5-152abd708af7.selectorLabels" . | nindent 6 }}
