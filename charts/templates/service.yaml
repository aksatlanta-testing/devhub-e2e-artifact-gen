apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo192387cf-35a5-4e77-b7b5-a8f3c8ea172b.fullname" . }}
  labels:
    {{- include "go-echo192387cf-35a5-4e77-b7b5-a8f3c8ea172b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo192387cf-35a5-4e77-b7b5-a8f3c8ea172b.selectorLabels" . | nindent 6 }}
