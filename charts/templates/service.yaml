apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo398a2ff1-3a1c-4af0-ab36-dc2a4fae931b.fullname" . }}
  labels:
    {{- include "go-echo398a2ff1-3a1c-4af0-ab36-dc2a4fae931b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo398a2ff1-3a1c-4af0-ab36-dc2a4fae931b.selectorLabels" . | nindent 6 }}
