apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7abb16d2-c7da-4a40-8a22-a5c835d969fb.fullname" . }}
  labels:
    {{- include "go-echo7abb16d2-c7da-4a40-8a22-a5c835d969fb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7abb16d2-c7da-4a40-8a22-a5c835d969fb.selectorLabels" . | nindent 6 }}
