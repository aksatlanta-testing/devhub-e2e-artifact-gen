apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9e41e4a1-da46-4279-a075-9c328727f308.fullname" . }}
  labels:
    {{- include "go-echo9e41e4a1-da46-4279-a075-9c328727f308.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9e41e4a1-da46-4279-a075-9c328727f308.selectorLabels" . | nindent 6 }}
