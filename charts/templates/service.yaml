apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7456f3d4-9fe6-445a-890f-919a7f712f7d.fullname" . }}
  labels:
    {{- include "go-echo7456f3d4-9fe6-445a-890f-919a7f712f7d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7456f3d4-9fe6-445a-890f-919a7f712f7d.selectorLabels" . | nindent 6 }}
