apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo82253dd2-77d4-4ab2-adaf-0e06d1b482bf.fullname" . }}
  labels:
    {{- include "go-echo82253dd2-77d4-4ab2-adaf-0e06d1b482bf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo82253dd2-77d4-4ab2-adaf-0e06d1b482bf.selectorLabels" . | nindent 6 }}
