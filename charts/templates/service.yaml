apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe719bcc0-a578-4bd5-9e8c-b7c2725134fe.fullname" . }}
  labels:
    {{- include "go-echoe719bcc0-a578-4bd5-9e8c-b7c2725134fe.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe719bcc0-a578-4bd5-9e8c-b7c2725134fe.selectorLabels" . | nindent 6 }}
