apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoda6e8ea3-75f1-47e4-a015-64a00d6c55a9.fullname" . }}
  labels:
    {{- include "go-echoda6e8ea3-75f1-47e4-a015-64a00d6c55a9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoda6e8ea3-75f1-47e4-a015-64a00d6c55a9.selectorLabels" . | nindent 6 }}
