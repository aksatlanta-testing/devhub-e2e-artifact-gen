apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echode2d7dbb-69a4-4e13-aaf4-801b944b61a8.fullname" . }}
  labels:
    {{- include "go-echode2d7dbb-69a4-4e13-aaf4-801b944b61a8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echode2d7dbb-69a4-4e13-aaf4-801b944b61a8.selectorLabels" . | nindent 6 }}
