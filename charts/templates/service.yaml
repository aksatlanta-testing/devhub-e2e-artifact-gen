apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0edf3323-51f8-4cd6-a59e-eac595c06cbe.fullname" . }}
  labels:
    {{- include "go-echo0edf3323-51f8-4cd6-a59e-eac595c06cbe.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0edf3323-51f8-4cd6-a59e-eac595c06cbe.selectorLabels" . | nindent 6 }}
