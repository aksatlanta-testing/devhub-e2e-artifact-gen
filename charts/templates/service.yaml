apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo18d2f619-e084-478f-8b71-456ec6467f20.fullname" . }}
  labels:
    {{- include "go-echo18d2f619-e084-478f-8b71-456ec6467f20.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo18d2f619-e084-478f-8b71-456ec6467f20.selectorLabels" . | nindent 6 }}
