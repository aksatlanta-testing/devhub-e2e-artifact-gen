apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echode474e2a-8824-4d4d-8161-be270b82c687.fullname" . }}
  labels:
    {{- include "go-echode474e2a-8824-4d4d-8161-be270b82c687.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echode474e2a-8824-4d4d-8161-be270b82c687.selectorLabels" . | nindent 6 }}
