apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1e32e597-48ad-45b1-8e87-3c7cdf1aa5c3.fullname" . }}
  labels:
    {{- include "go-echo1e32e597-48ad-45b1-8e87-3c7cdf1aa5c3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1e32e597-48ad-45b1-8e87-3c7cdf1aa5c3.selectorLabels" . | nindent 6 }}
