apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodf267d13-1060-42ec-b57e-720ebc042847.fullname" . }}
  labels:
    {{- include "go-echodf267d13-1060-42ec-b57e-720ebc042847.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodf267d13-1060-42ec-b57e-720ebc042847.selectorLabels" . | nindent 6 }}
