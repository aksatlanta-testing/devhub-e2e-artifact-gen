apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoebd93f49-777f-4d0e-8dd9-93bd164e1468.fullname" . }}
  labels:
    {{- include "go-echoebd93f49-777f-4d0e-8dd9-93bd164e1468.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoebd93f49-777f-4d0e-8dd9-93bd164e1468.selectorLabels" . | nindent 6 }}
