apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobfd3cff3-c8b7-4a12-9d00-1963f8af3bc9.fullname" . }}
  labels:
    {{- include "go-echobfd3cff3-c8b7-4a12-9d00-1963f8af3bc9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobfd3cff3-c8b7-4a12-9d00-1963f8af3bc9.selectorLabels" . | nindent 6 }}
