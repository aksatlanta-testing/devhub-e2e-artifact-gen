apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoae19356e-cde9-4231-add3-7cffe82f383d.fullname" . }}
  labels:
    {{- include "go-echoae19356e-cde9-4231-add3-7cffe82f383d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoae19356e-cde9-4231-add3-7cffe82f383d.selectorLabels" . | nindent 6 }}
