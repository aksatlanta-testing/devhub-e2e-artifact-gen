apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod3d4c934-5ae7-4e08-bdbb-f0b54b082d44.fullname" . }}
  labels:
    {{- include "go-echod3d4c934-5ae7-4e08-bdbb-f0b54b082d44.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod3d4c934-5ae7-4e08-bdbb-f0b54b082d44.selectorLabels" . | nindent 6 }}
