apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6f0a2ef5-bab8-4232-baca-99d85f7b9749.fullname" . }}
  labels:
    {{- include "go-echo6f0a2ef5-bab8-4232-baca-99d85f7b9749.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6f0a2ef5-bab8-4232-baca-99d85f7b9749.selectorLabels" . | nindent 6 }}
