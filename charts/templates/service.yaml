apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6f8598c5-6919-4f0e-9eff-b5df00694214.fullname" . }}
  labels:
    {{- include "go-echo6f8598c5-6919-4f0e-9eff-b5df00694214.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6f8598c5-6919-4f0e-9eff-b5df00694214.selectorLabels" . | nindent 6 }}
