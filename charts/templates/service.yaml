apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7e4747de-3082-4cd4-869d-43bbab4bcdb0.fullname" . }}
  labels:
    {{- include "go-echo7e4747de-3082-4cd4-869d-43bbab4bcdb0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7e4747de-3082-4cd4-869d-43bbab4bcdb0.selectorLabels" . | nindent 6 }}
