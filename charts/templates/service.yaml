apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoffc1782d-2dcc-4ae2-af2a-db44338fc377.fullname" . }}
  labels:
    {{- include "go-echoffc1782d-2dcc-4ae2-af2a-db44338fc377.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoffc1782d-2dcc-4ae2-af2a-db44338fc377.selectorLabels" . | nindent 6 }}
