apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5cdb0162-ae14-4f2f-925b-78b3fb62c9e8.fullname" . }}
  labels:
    {{- include "go-echo5cdb0162-ae14-4f2f-925b-78b3fb62c9e8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5cdb0162-ae14-4f2f-925b-78b3fb62c9e8.selectorLabels" . | nindent 6 }}
