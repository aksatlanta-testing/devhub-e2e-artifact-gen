apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo41a586a0-6cf1-4ced-9a3d-d57fc9f77c70.fullname" . }}
  labels:
    {{- include "go-echo41a586a0-6cf1-4ced-9a3d-d57fc9f77c70.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo41a586a0-6cf1-4ced-9a3d-d57fc9f77c70.selectorLabels" . | nindent 6 }}
