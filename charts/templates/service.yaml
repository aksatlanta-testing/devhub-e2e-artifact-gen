apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocb08e538-4010-4a0c-9fac-e34a8539404b.fullname" . }}
  labels:
    {{- include "go-echocb08e538-4010-4a0c-9fac-e34a8539404b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocb08e538-4010-4a0c-9fac-e34a8539404b.selectorLabels" . | nindent 6 }}
