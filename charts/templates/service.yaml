apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2abf628b-6ac0-4e23-aa3c-c837034d490b.fullname" . }}
  labels:
    {{- include "go-echo2abf628b-6ac0-4e23-aa3c-c837034d490b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2abf628b-6ac0-4e23-aa3c-c837034d490b.selectorLabels" . | nindent 6 }}
