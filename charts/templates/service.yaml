apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo15c51dbb-5bc1-4855-b3fd-8d3d6b17f65d.fullname" . }}
  labels:
    {{- include "go-echo15c51dbb-5bc1-4855-b3fd-8d3d6b17f65d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo15c51dbb-5bc1-4855-b3fd-8d3d6b17f65d.selectorLabels" . | nindent 6 }}
