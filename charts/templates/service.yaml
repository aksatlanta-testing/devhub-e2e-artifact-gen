apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3b7b540a-3afb-44c7-91b2-1150ee7d6565.fullname" . }}
  labels:
    {{- include "go-echo3b7b540a-3afb-44c7-91b2-1150ee7d6565.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3b7b540a-3afb-44c7-91b2-1150ee7d6565.selectorLabels" . | nindent 6 }}
