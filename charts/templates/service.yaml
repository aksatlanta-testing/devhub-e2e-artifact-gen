apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe195f2cd-4fbf-41d1-a2c0-a85deca11eb6.fullname" . }}
  labels:
    {{- include "go-echoe195f2cd-4fbf-41d1-a2c0-a85deca11eb6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe195f2cd-4fbf-41d1-a2c0-a85deca11eb6.selectorLabels" . | nindent 6 }}
