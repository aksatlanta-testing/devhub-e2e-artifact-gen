apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3929bf3f-1a7d-48fb-ad93-77c1ee119f40.fullname" . }}
  labels:
    {{- include "go-echo3929bf3f-1a7d-48fb-ad93-77c1ee119f40.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3929bf3f-1a7d-48fb-ad93-77c1ee119f40.selectorLabels" . | nindent 6 }}
