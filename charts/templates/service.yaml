apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3999af79-d27c-4fc6-8790-5c87bac21c4b.fullname" . }}
  labels:
    {{- include "go-echo3999af79-d27c-4fc6-8790-5c87bac21c4b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3999af79-d27c-4fc6-8790-5c87bac21c4b.selectorLabels" . | nindent 6 }}
