apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo26deac37-1329-4dc8-9c69-9bfc474433af.fullname" . }}
  labels:
    {{- include "go-echo26deac37-1329-4dc8-9c69-9bfc474433af.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo26deac37-1329-4dc8-9c69-9bfc474433af.selectorLabels" . | nindent 6 }}
