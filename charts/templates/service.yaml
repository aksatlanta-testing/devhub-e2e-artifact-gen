apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocca50b32-ca07-4759-852d-17d061af1677.fullname" . }}
  labels:
    {{- include "go-echocca50b32-ca07-4759-852d-17d061af1677.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocca50b32-ca07-4759-852d-17d061af1677.selectorLabels" . | nindent 6 }}
