apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod4c932ba-ca11-4f4a-8243-c9e4f2deee67.fullname" . }}
  labels:
    {{- include "go-echod4c932ba-ca11-4f4a-8243-c9e4f2deee67.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod4c932ba-ca11-4f4a-8243-c9e4f2deee67.selectorLabels" . | nindent 6 }}
