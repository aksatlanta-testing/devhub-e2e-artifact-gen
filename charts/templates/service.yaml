apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5ecb6717-804f-46dc-b08d-fed0df7136bc.fullname" . }}
  labels:
    {{- include "go-echo5ecb6717-804f-46dc-b08d-fed0df7136bc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5ecb6717-804f-46dc-b08d-fed0df7136bc.selectorLabels" . | nindent 6 }}
