apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3798c4de-32f4-44e0-92c8-65dc6478e3e4.fullname" . }}
  labels:
    {{- include "go-echo3798c4de-32f4-44e0-92c8-65dc6478e3e4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3798c4de-32f4-44e0-92c8-65dc6478e3e4.selectorLabels" . | nindent 6 }}
