apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8115609c-a950-4a28-b5b2-1bbe89c90461.fullname" . }}
  labels:
    {{- include "go-echo8115609c-a950-4a28-b5b2-1bbe89c90461.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8115609c-a950-4a28-b5b2-1bbe89c90461.selectorLabels" . | nindent 6 }}
