apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo27e04e5e-adab-4514-864e-15f6366594cb.fullname" . }}
  labels:
    {{- include "go-echo27e04e5e-adab-4514-864e-15f6366594cb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo27e04e5e-adab-4514-864e-15f6366594cb.selectorLabels" . | nindent 6 }}
