apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo06576d41-a44e-42db-bffb-506f1ce2bf1f.fullname" . }}
  labels:
    {{- include "go-echo06576d41-a44e-42db-bffb-506f1ce2bf1f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo06576d41-a44e-42db-bffb-506f1ce2bf1f.selectorLabels" . | nindent 6 }}
