apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo994e2555-9b20-4719-9136-4818be02181a.fullname" . }}
  labels:
    {{- include "go-echo994e2555-9b20-4719-9136-4818be02181a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo994e2555-9b20-4719-9136-4818be02181a.selectorLabels" . | nindent 6 }}
