apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobdaae44c-5de1-4da5-85b6-7eb75c9e94c7.fullname" . }}
  labels:
    {{- include "go-echobdaae44c-5de1-4da5-85b6-7eb75c9e94c7.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobdaae44c-5de1-4da5-85b6-7eb75c9e94c7.selectorLabels" . | nindent 6 }}
