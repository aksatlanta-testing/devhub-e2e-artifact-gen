apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof0690747-b2e7-4b9a-951f-664eb253e080.fullname" . }}
  labels:
    {{- include "go-echof0690747-b2e7-4b9a-951f-664eb253e080.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof0690747-b2e7-4b9a-951f-664eb253e080.selectorLabels" . | nindent 6 }}
