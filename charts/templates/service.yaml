apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof000455f-7a98-4f2e-af19-22f1f94de6d2.fullname" . }}
  labels:
    {{- include "go-echof000455f-7a98-4f2e-af19-22f1f94de6d2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof000455f-7a98-4f2e-af19-22f1f94de6d2.selectorLabels" . | nindent 6 }}
