apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5caa543c-c2fd-410c-86fd-0e3891d9e6ee.fullname" . }}
  labels:
    {{- include "go-echo5caa543c-c2fd-410c-86fd-0e3891d9e6ee.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5caa543c-c2fd-410c-86fd-0e3891d9e6ee.selectorLabels" . | nindent 6 }}
