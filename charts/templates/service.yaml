apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofa42ca03-8173-4d6d-bbf9-0ec6aed804b0.fullname" . }}
  labels:
    {{- include "go-echofa42ca03-8173-4d6d-bbf9-0ec6aed804b0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofa42ca03-8173-4d6d-bbf9-0ec6aed804b0.selectorLabels" . | nindent 6 }}
