apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2f165481-4d24-420a-878a-e1ffae7de484.fullname" . }}
  labels:
    {{- include "go-echo2f165481-4d24-420a-878a-e1ffae7de484.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2f165481-4d24-420a-878a-e1ffae7de484.selectorLabels" . | nindent 6 }}
