apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8d3d0457-42c6-4f2c-8219-efaa4735b64d.fullname" . }}
  labels:
    {{- include "go-echo8d3d0457-42c6-4f2c-8219-efaa4735b64d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8d3d0457-42c6-4f2c-8219-efaa4735b64d.selectorLabels" . | nindent 6 }}
