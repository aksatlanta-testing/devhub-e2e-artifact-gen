apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo40397adc-0c6c-4699-bc11-6354f00c7206.fullname" . }}
  labels:
    {{- include "go-echo40397adc-0c6c-4699-bc11-6354f00c7206.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo40397adc-0c6c-4699-bc11-6354f00c7206.selectorLabels" . | nindent 6 }}
