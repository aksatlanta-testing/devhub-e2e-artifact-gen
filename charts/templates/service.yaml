apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo248b517b-7fc8-47fb-8540-2fbce52dcf57.fullname" . }}
  labels:
    {{- include "go-echo248b517b-7fc8-47fb-8540-2fbce52dcf57.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo248b517b-7fc8-47fb-8540-2fbce52dcf57.selectorLabels" . | nindent 6 }}
