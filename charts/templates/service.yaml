apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod4c51798-ce26-46e9-83c0-95c1f9936eb9.fullname" . }}
  labels:
    {{- include "go-echod4c51798-ce26-46e9-83c0-95c1f9936eb9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod4c51798-ce26-46e9-83c0-95c1f9936eb9.selectorLabels" . | nindent 6 }}
