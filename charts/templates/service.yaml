apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoce92ed9b-4e82-4fb7-9d87-ea9f17949bda.fullname" . }}
  labels:
    {{- include "go-echoce92ed9b-4e82-4fb7-9d87-ea9f17949bda.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoce92ed9b-4e82-4fb7-9d87-ea9f17949bda.selectorLabels" . | nindent 6 }}
