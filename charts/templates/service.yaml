apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoabdad4ee-6def-408b-b0a2-e02260a22b16.fullname" . }}
  labels:
    {{- include "go-echoabdad4ee-6def-408b-b0a2-e02260a22b16.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoabdad4ee-6def-408b-b0a2-e02260a22b16.selectorLabels" . | nindent 6 }}
