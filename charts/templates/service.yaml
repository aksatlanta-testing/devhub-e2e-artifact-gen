apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc4c4dd3b-6f7d-492c-b0b3-1c77c7240219.fullname" . }}
  labels:
    {{- include "go-echoc4c4dd3b-6f7d-492c-b0b3-1c77c7240219.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc4c4dd3b-6f7d-492c-b0b3-1c77c7240219.selectorLabels" . | nindent 6 }}
