apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo66c984f1-dd08-4a89-ba69-1a62e5a540f8.fullname" . }}
  labels:
    {{- include "go-echo66c984f1-dd08-4a89-ba69-1a62e5a540f8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo66c984f1-dd08-4a89-ba69-1a62e5a540f8.selectorLabels" . | nindent 6 }}
