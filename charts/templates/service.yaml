apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1a350e9e-7d00-43be-b445-4fc7d4ae92f1.fullname" . }}
  labels:
    {{- include "go-echo1a350e9e-7d00-43be-b445-4fc7d4ae92f1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1a350e9e-7d00-43be-b445-4fc7d4ae92f1.selectorLabels" . | nindent 6 }}
