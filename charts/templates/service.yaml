apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo56c01963-fdd6-4e97-b90b-717b2e8ac40d.fullname" . }}
  labels:
    {{- include "go-echo56c01963-fdd6-4e97-b90b-717b2e8ac40d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo56c01963-fdd6-4e97-b90b-717b2e8ac40d.selectorLabels" . | nindent 6 }}
