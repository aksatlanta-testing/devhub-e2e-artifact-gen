apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc766fe6f-bc28-424f-be3b-2bf10982839e.fullname" . }}
  labels:
    {{- include "go-echoc766fe6f-bc28-424f-be3b-2bf10982839e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc766fe6f-bc28-424f-be3b-2bf10982839e.selectorLabels" . | nindent 6 }}
