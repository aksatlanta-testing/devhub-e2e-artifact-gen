apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo77498c34-b1ba-4ea4-9eae-9f5741961a38.fullname" . }}
  labels:
    {{- include "go-echo77498c34-b1ba-4ea4-9eae-9f5741961a38.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo77498c34-b1ba-4ea4-9eae-9f5741961a38.selectorLabels" . | nindent 6 }}
