apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo688d9bf8-cc1b-4f02-b472-3a31caab5611.fullname" . }}
  labels:
    {{- include "go-echo688d9bf8-cc1b-4f02-b472-3a31caab5611.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo688d9bf8-cc1b-4f02-b472-3a31caab5611.selectorLabels" . | nindent 6 }}
