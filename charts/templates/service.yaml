apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo55a42db1-bd8e-47ec-8b4a-18711d9d0826.fullname" . }}
  labels:
    {{- include "go-echo55a42db1-bd8e-47ec-8b4a-18711d9d0826.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo55a42db1-bd8e-47ec-8b4a-18711d9d0826.selectorLabels" . | nindent 6 }}
