apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo860c96bd-c507-42c8-b905-a17f1e84bcef.fullname" . }}
  labels:
    {{- include "go-echo860c96bd-c507-42c8-b905-a17f1e84bcef.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo860c96bd-c507-42c8-b905-a17f1e84bcef.selectorLabels" . | nindent 6 }}
