apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe6f75e38-60ce-49a0-b2e4-a32acaee7697.fullname" . }}
  labels:
    {{- include "go-echoe6f75e38-60ce-49a0-b2e4-a32acaee7697.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe6f75e38-60ce-49a0-b2e4-a32acaee7697.selectorLabels" . | nindent 6 }}
