apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe5d95e0b-e01f-455e-be7d-96d51241e553.fullname" . }}
  labels:
    {{- include "go-echoe5d95e0b-e01f-455e-be7d-96d51241e553.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe5d95e0b-e01f-455e-be7d-96d51241e553.selectorLabels" . | nindent 6 }}
