apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofe426629-471b-48b8-b3eb-89c6f75a2133.fullname" . }}
  labels:
    {{- include "go-echofe426629-471b-48b8-b3eb-89c6f75a2133.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofe426629-471b-48b8-b3eb-89c6f75a2133.selectorLabels" . | nindent 6 }}
