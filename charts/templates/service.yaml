apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4310ffcc-fd37-4123-8755-a8b024e80330.fullname" . }}
  labels:
    {{- include "go-echo4310ffcc-fd37-4123-8755-a8b024e80330.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4310ffcc-fd37-4123-8755-a8b024e80330.selectorLabels" . | nindent 6 }}
