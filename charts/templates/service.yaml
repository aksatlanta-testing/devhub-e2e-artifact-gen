apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo28fd0cad-d2de-4dd9-9910-dd4bd59eefd8.fullname" . }}
  labels:
    {{- include "go-echo28fd0cad-d2de-4dd9-9910-dd4bd59eefd8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo28fd0cad-d2de-4dd9-9910-dd4bd59eefd8.selectorLabels" . | nindent 6 }}
