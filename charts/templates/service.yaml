apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2e35da3a-4a8b-4c08-9603-21aa1c674176.fullname" . }}
  labels:
    {{- include "go-echo2e35da3a-4a8b-4c08-9603-21aa1c674176.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2e35da3a-4a8b-4c08-9603-21aa1c674176.selectorLabels" . | nindent 6 }}
