apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo005d1fe8-c4ff-436a-acae-0dfd83ed182e.fullname" . }}
  labels:
    {{- include "go-echo005d1fe8-c4ff-436a-acae-0dfd83ed182e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo005d1fe8-c4ff-436a-acae-0dfd83ed182e.selectorLabels" . | nindent 6 }}
