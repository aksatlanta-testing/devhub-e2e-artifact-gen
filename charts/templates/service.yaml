apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod6829677-0154-4f7b-aae6-76a4f3352ca5.fullname" . }}
  labels:
    {{- include "go-echod6829677-0154-4f7b-aae6-76a4f3352ca5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod6829677-0154-4f7b-aae6-76a4f3352ca5.selectorLabels" . | nindent 6 }}
