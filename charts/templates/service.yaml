apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof51e8cfb-4ae1-49e9-bbf4-cbcd23696de3.fullname" . }}
  labels:
    {{- include "go-echof51e8cfb-4ae1-49e9-bbf4-cbcd23696de3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof51e8cfb-4ae1-49e9-bbf4-cbcd23696de3.selectorLabels" . | nindent 6 }}
