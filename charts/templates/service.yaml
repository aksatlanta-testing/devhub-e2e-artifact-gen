apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof03fa98e-085f-4488-a712-0c4e9778687c.fullname" . }}
  labels:
    {{- include "go-echof03fa98e-085f-4488-a712-0c4e9778687c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof03fa98e-085f-4488-a712-0c4e9778687c.selectorLabels" . | nindent 6 }}
