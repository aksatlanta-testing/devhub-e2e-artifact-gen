apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo994b35cc-da2e-4217-b6a1-d09aa9ca1999.fullname" . }}
  labels:
    {{- include "go-echo994b35cc-da2e-4217-b6a1-d09aa9ca1999.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo994b35cc-da2e-4217-b6a1-d09aa9ca1999.selectorLabels" . | nindent 6 }}
