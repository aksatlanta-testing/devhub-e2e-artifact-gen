apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo295a187b-2efa-43ac-baa7-cf68dccfa599.fullname" . }}
  labels:
    {{- include "go-echo295a187b-2efa-43ac-baa7-cf68dccfa599.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo295a187b-2efa-43ac-baa7-cf68dccfa599.selectorLabels" . | nindent 6 }}
