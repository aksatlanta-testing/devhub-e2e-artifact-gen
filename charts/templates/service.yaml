apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofa2eb0e1-1026-4728-8f81-8b077784673b.fullname" . }}
  labels:
    {{- include "go-echofa2eb0e1-1026-4728-8f81-8b077784673b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofa2eb0e1-1026-4728-8f81-8b077784673b.selectorLabels" . | nindent 6 }}
