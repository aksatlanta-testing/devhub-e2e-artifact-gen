apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0362fd69-4cc0-43f5-b76e-7909305a256c.fullname" . }}
  labels:
    {{- include "go-echo0362fd69-4cc0-43f5-b76e-7909305a256c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0362fd69-4cc0-43f5-b76e-7909305a256c.selectorLabels" . | nindent 6 }}
