apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1b7269ad-1cf3-47b5-9299-0d9d3c7219ff.fullname" . }}
  labels:
    {{- include "go-echo1b7269ad-1cf3-47b5-9299-0d9d3c7219ff.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1b7269ad-1cf3-47b5-9299-0d9d3c7219ff.selectorLabels" . | nindent 6 }}
