apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo344295dc-831d-4a6e-9075-d828c1deb131.fullname" . }}
  labels:
    {{- include "go-echo344295dc-831d-4a6e-9075-d828c1deb131.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo344295dc-831d-4a6e-9075-d828c1deb131.selectorLabels" . | nindent 6 }}
