apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo58a7dcb2-e3cf-43cd-827d-5ccea6fbec64.fullname" . }}
  labels:
    {{- include "go-echo58a7dcb2-e3cf-43cd-827d-5ccea6fbec64.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo58a7dcb2-e3cf-43cd-827d-5ccea6fbec64.selectorLabels" . | nindent 6 }}
