apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo47c5bdf9-7a86-461b-b9c7-ffbc9208a762.fullname" . }}
  labels:
    {{- include "go-echo47c5bdf9-7a86-461b-b9c7-ffbc9208a762.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo47c5bdf9-7a86-461b-b9c7-ffbc9208a762.selectorLabels" . | nindent 6 }}
