apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7b996f2e-7742-4543-bbc4-f7eef71cdb77.fullname" . }}
  labels:
    {{- include "go-echo7b996f2e-7742-4543-bbc4-f7eef71cdb77.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7b996f2e-7742-4543-bbc4-f7eef71cdb77.selectorLabels" . | nindent 6 }}
