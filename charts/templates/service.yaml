apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4abd3cac-e043-4921-b11b-fa605106589a.fullname" . }}
  labels:
    {{- include "go-echo4abd3cac-e043-4921-b11b-fa605106589a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4abd3cac-e043-4921-b11b-fa605106589a.selectorLabels" . | nindent 6 }}
