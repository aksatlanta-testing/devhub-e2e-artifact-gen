apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9becbbc0-2bce-4ac8-860d-0027c6376478.fullname" . }}
  labels:
    {{- include "go-echo9becbbc0-2bce-4ac8-860d-0027c6376478.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9becbbc0-2bce-4ac8-860d-0027c6376478.selectorLabels" . | nindent 6 }}
