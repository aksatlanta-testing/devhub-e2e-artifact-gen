apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9e8e7ff2-3bec-430c-9332-90b168d43a2e.fullname" . }}
  labels:
    {{- include "go-echo9e8e7ff2-3bec-430c-9332-90b168d43a2e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9e8e7ff2-3bec-430c-9332-90b168d43a2e.selectorLabels" . | nindent 6 }}
