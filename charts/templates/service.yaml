apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoafbe9fd1-a36f-4c3f-9371-7541060a85d1.fullname" . }}
  labels:
    {{- include "go-echoafbe9fd1-a36f-4c3f-9371-7541060a85d1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoafbe9fd1-a36f-4c3f-9371-7541060a85d1.selectorLabels" . | nindent 6 }}
