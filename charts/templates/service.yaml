apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob306734e-ad5a-48e3-90c3-dea61fdf15e7.fullname" . }}
  labels:
    {{- include "go-echob306734e-ad5a-48e3-90c3-dea61fdf15e7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob306734e-ad5a-48e3-90c3-dea61fdf15e7.selectorLabels" . | nindent 6 }}
