apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4c6df250-d0a8-4083-8ef0-d3efb8a451d1.fullname" . }}
  labels:
    {{- include "go-echo4c6df250-d0a8-4083-8ef0-d3efb8a451d1.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4c6df250-d0a8-4083-8ef0-d3efb8a451d1.selectorLabels" . | nindent 6 }}
