apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo120303d6-c466-49ee-802f-0150c2a6ed52.fullname" . }}
  labels:
    {{- include "go-echo120303d6-c466-49ee-802f-0150c2a6ed52.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo120303d6-c466-49ee-802f-0150c2a6ed52.selectorLabels" . | nindent 6 }}
