apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo46a63a29-5ded-4393-8efb-f42cd5b1453c.fullname" . }}
  labels:
    {{- include "go-echo46a63a29-5ded-4393-8efb-f42cd5b1453c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo46a63a29-5ded-4393-8efb-f42cd5b1453c.selectorLabels" . | nindent 6 }}
