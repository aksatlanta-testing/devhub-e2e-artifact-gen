apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3c225d11-7093-4c90-865c-b9c2c37e638e.fullname" . }}
  labels:
    {{- include "go-echo3c225d11-7093-4c90-865c-b9c2c37e638e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3c225d11-7093-4c90-865c-b9c2c37e638e.selectorLabels" . | nindent 6 }}
