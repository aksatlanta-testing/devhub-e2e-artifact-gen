apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaf2bae30-e360-428c-aa57-1814ea953bb6.fullname" . }}
  labels:
    {{- include "go-echoaf2bae30-e360-428c-aa57-1814ea953bb6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaf2bae30-e360-428c-aa57-1814ea953bb6.selectorLabels" . | nindent 6 }}
