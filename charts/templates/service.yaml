apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo63044f5d-2c7c-4928-acc7-1ad8e85922bd.fullname" . }}
  labels:
    {{- include "go-echo63044f5d-2c7c-4928-acc7-1ad8e85922bd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo63044f5d-2c7c-4928-acc7-1ad8e85922bd.selectorLabels" . | nindent 6 }}
