apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo46f36a07-0208-43d0-a54a-9728eb3ae301.fullname" . }}
  labels:
    {{- include "go-echo46f36a07-0208-43d0-a54a-9728eb3ae301.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo46f36a07-0208-43d0-a54a-9728eb3ae301.selectorLabels" . | nindent 6 }}
