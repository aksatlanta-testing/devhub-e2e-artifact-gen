apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo351223e4-0499-4573-818e-a0bdff32a3e1.fullname" . }}
  labels:
    {{- include "go-echo351223e4-0499-4573-818e-a0bdff32a3e1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo351223e4-0499-4573-818e-a0bdff32a3e1.selectorLabels" . | nindent 6 }}
