apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo719d6016-8b00-4677-b2e7-b7f6d15c47ce.fullname" . }}
  labels:
    {{- include "go-echo719d6016-8b00-4677-b2e7-b7f6d15c47ce.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo719d6016-8b00-4677-b2e7-b7f6d15c47ce.selectorLabels" . | nindent 6 }}
