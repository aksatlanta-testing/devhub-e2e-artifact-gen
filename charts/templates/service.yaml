apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6ebfbe81-0c91-402d-b490-93de7dd3adf8.fullname" . }}
  labels:
    {{- include "go-echo6ebfbe81-0c91-402d-b490-93de7dd3adf8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6ebfbe81-0c91-402d-b490-93de7dd3adf8.selectorLabels" . | nindent 6 }}
