apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo582dd13b-7c89-46f6-99dc-365096441505.fullname" . }}
  labels:
    {{- include "go-echo582dd13b-7c89-46f6-99dc-365096441505.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo582dd13b-7c89-46f6-99dc-365096441505.selectorLabels" . | nindent 6 }}
