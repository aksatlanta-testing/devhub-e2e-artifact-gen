apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa2aaeebc-ed7c-4961-a9c1-c7928dfa8065.fullname" . }}
  labels:
    {{- include "go-echoa2aaeebc-ed7c-4961-a9c1-c7928dfa8065.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa2aaeebc-ed7c-4961-a9c1-c7928dfa8065.selectorLabels" . | nindent 6 }}
