apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4a544269-a6ac-4108-bf4f-a51d55b8ecf4.fullname" . }}
  labels:
    {{- include "go-echo4a544269-a6ac-4108-bf4f-a51d55b8ecf4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4a544269-a6ac-4108-bf4f-a51d55b8ecf4.selectorLabels" . | nindent 6 }}
