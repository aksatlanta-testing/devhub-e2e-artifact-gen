apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo41e571e8-6155-4680-844c-c1e0baf9cabc.fullname" . }}
  labels:
    {{- include "go-echo41e571e8-6155-4680-844c-c1e0baf9cabc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo41e571e8-6155-4680-844c-c1e0baf9cabc.selectorLabels" . | nindent 6 }}
