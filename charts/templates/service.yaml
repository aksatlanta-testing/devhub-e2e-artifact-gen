apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo11c96591-c175-4e36-89fa-5ab5a21cb3ba.fullname" . }}
  labels:
    {{- include "go-echo11c96591-c175-4e36-89fa-5ab5a21cb3ba.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo11c96591-c175-4e36-89fa-5ab5a21cb3ba.selectorLabels" . | nindent 6 }}
