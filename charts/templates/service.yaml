apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo337f3949-4a6f-4c80-9faa-ddbeee63eb95.fullname" . }}
  labels:
    {{- include "go-echo337f3949-4a6f-4c80-9faa-ddbeee63eb95.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo337f3949-4a6f-4c80-9faa-ddbeee63eb95.selectorLabels" . | nindent 6 }}
