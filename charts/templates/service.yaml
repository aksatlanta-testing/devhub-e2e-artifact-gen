apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo17921542-a1fc-4ce3-a11b-8528097ddc80.fullname" . }}
  labels:
    {{- include "go-echo17921542-a1fc-4ce3-a11b-8528097ddc80.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo17921542-a1fc-4ce3-a11b-8528097ddc80.selectorLabels" . | nindent 6 }}
