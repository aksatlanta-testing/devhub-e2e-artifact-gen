apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoef081059-3a9c-48b2-bfcd-3e0b00545123.fullname" . }}
  labels:
    {{- include "go-echoef081059-3a9c-48b2-bfcd-3e0b00545123.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoef081059-3a9c-48b2-bfcd-3e0b00545123.selectorLabels" . | nindent 6 }}
