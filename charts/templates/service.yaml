apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa3a267a3-9ac6-456a-b3c0-35a63697b3ee.fullname" . }}
  labels:
    {{- include "go-echoa3a267a3-9ac6-456a-b3c0-35a63697b3ee.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa3a267a3-9ac6-456a-b3c0-35a63697b3ee.selectorLabels" . | nindent 6 }}
