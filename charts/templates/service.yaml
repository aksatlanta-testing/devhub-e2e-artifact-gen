apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoff9ea9d9-c82d-4f80-8efc-33569f8b6fd7.fullname" . }}
  labels:
    {{- include "go-echoff9ea9d9-c82d-4f80-8efc-33569f8b6fd7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoff9ea9d9-c82d-4f80-8efc-33569f8b6fd7.selectorLabels" . | nindent 6 }}
