apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo83c65827-2b05-4ef1-976f-0892b1703334.fullname" . }}
  labels:
    {{- include "go-echo83c65827-2b05-4ef1-976f-0892b1703334.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo83c65827-2b05-4ef1-976f-0892b1703334.selectorLabels" . | nindent 6 }}
