apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9330d10e-b8d6-46ef-b348-15dbc1e38464.fullname" . }}
  labels:
    {{- include "go-echo9330d10e-b8d6-46ef-b348-15dbc1e38464.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9330d10e-b8d6-46ef-b348-15dbc1e38464.selectorLabels" . | nindent 6 }}
