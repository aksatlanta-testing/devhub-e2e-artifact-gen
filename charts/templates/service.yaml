apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4e1dab27-cf86-4c66-96e3-03f39b197ed8.fullname" . }}
  labels:
    {{- include "go-echo4e1dab27-cf86-4c66-96e3-03f39b197ed8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4e1dab27-cf86-4c66-96e3-03f39b197ed8.selectorLabels" . | nindent 6 }}
