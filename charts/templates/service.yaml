apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof36f727d-0853-4a9e-82ea-3c862c3ef772.fullname" . }}
  labels:
    {{- include "go-echof36f727d-0853-4a9e-82ea-3c862c3ef772.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof36f727d-0853-4a9e-82ea-3c862c3ef772.selectorLabels" . | nindent 6 }}
