apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8f01fa44-5763-4bfb-a15f-68a6e3378b4f.fullname" . }}
  labels:
    {{- include "go-echo8f01fa44-5763-4bfb-a15f-68a6e3378b4f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8f01fa44-5763-4bfb-a15f-68a6e3378b4f.selectorLabels" . | nindent 6 }}
