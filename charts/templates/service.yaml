apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo48b91ff6-d3a7-4af8-94c8-038fcfc807a1.fullname" . }}
  labels:
    {{- include "go-echo48b91ff6-d3a7-4af8-94c8-038fcfc807a1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo48b91ff6-d3a7-4af8-94c8-038fcfc807a1.selectorLabels" . | nindent 6 }}
