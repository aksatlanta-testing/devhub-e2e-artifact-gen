apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6ee3a975-c964-4d3a-ad66-3d4b6e1b18a0.fullname" . }}
  labels:
    {{- include "go-echo6ee3a975-c964-4d3a-ad66-3d4b6e1b18a0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6ee3a975-c964-4d3a-ad66-3d4b6e1b18a0.selectorLabels" . | nindent 6 }}
