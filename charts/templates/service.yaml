apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe8cbc514-6ee2-49ed-8c4f-a1400f8c028f.fullname" . }}
  labels:
    {{- include "go-echoe8cbc514-6ee2-49ed-8c4f-a1400f8c028f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe8cbc514-6ee2-49ed-8c4f-a1400f8c028f.selectorLabels" . | nindent 6 }}
