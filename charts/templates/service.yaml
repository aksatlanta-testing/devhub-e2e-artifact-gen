apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobb0142ee-9ff6-4498-8747-658fc181f4fe.fullname" . }}
  labels:
    {{- include "go-echobb0142ee-9ff6-4498-8747-658fc181f4fe.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobb0142ee-9ff6-4498-8747-658fc181f4fe.selectorLabels" . | nindent 6 }}
