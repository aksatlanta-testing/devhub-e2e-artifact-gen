apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7e7203ac-13b4-4dcf-84cd-f6240733f9af.fullname" . }}
  labels:
    {{- include "go-echo7e7203ac-13b4-4dcf-84cd-f6240733f9af.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7e7203ac-13b4-4dcf-84cd-f6240733f9af.selectorLabels" . | nindent 6 }}
