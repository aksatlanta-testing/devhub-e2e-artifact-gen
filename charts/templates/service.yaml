apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3b0f9a20-ee16-4065-a998-03e4393c4ae3.fullname" . }}
  labels:
    {{- include "go-echo3b0f9a20-ee16-4065-a998-03e4393c4ae3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3b0f9a20-ee16-4065-a998-03e4393c4ae3.selectorLabels" . | nindent 6 }}
