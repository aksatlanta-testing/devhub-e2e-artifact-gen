apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa44b2816-6ce4-454c-9618-5efc84a0160a.fullname" . }}
  labels:
    {{- include "go-echoa44b2816-6ce4-454c-9618-5efc84a0160a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa44b2816-6ce4-454c-9618-5efc84a0160a.selectorLabels" . | nindent 6 }}
