apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo41d5a2cc-c26f-4b3d-9ae8-ac593f21daf8.fullname" . }}
  labels:
    {{- include "go-echo41d5a2cc-c26f-4b3d-9ae8-ac593f21daf8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo41d5a2cc-c26f-4b3d-9ae8-ac593f21daf8.selectorLabels" . | nindent 6 }}
