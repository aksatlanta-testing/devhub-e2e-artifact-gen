apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob41b80d5-273a-4d16-9b77-ab236f9f1cb3.fullname" . }}
  labels:
    {{- include "go-echob41b80d5-273a-4d16-9b77-ab236f9f1cb3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob41b80d5-273a-4d16-9b77-ab236f9f1cb3.selectorLabels" . | nindent 6 }}
