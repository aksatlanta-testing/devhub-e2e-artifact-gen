apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo65404ccd-47d8-45e7-97e7-8f709870a284.fullname" . }}
  labels:
    {{- include "go-echo65404ccd-47d8-45e7-97e7-8f709870a284.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo65404ccd-47d8-45e7-97e7-8f709870a284.selectorLabels" . | nindent 6 }}
