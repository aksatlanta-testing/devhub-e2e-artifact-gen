apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc23ef751-8c9a-409f-ac51-43300613e844.fullname" . }}
  labels:
    {{- include "go-echoc23ef751-8c9a-409f-ac51-43300613e844.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc23ef751-8c9a-409f-ac51-43300613e844.selectorLabels" . | nindent 6 }}
