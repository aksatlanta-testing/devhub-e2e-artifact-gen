apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2146cba7-15ef-4c96-84e7-554943a1d996.fullname" . }}
  labels:
    {{- include "go-echo2146cba7-15ef-4c96-84e7-554943a1d996.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2146cba7-15ef-4c96-84e7-554943a1d996.selectorLabels" . | nindent 6 }}
