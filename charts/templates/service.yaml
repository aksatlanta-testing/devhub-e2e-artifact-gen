apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa520bc0f-c500-4b32-8c01-1e75986b411d.fullname" . }}
  labels:
    {{- include "go-echoa520bc0f-c500-4b32-8c01-1e75986b411d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa520bc0f-c500-4b32-8c01-1e75986b411d.selectorLabels" . | nindent 6 }}
