apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo80a09b37-6efa-4c4e-8262-4b9910cc2f39.fullname" . }}
  labels:
    {{- include "go-echo80a09b37-6efa-4c4e-8262-4b9910cc2f39.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo80a09b37-6efa-4c4e-8262-4b9910cc2f39.selectorLabels" . | nindent 6 }}
