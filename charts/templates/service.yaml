apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc3cd366a-38e7-42d1-b153-e313eed1c771.fullname" . }}
  labels:
    {{- include "go-echoc3cd366a-38e7-42d1-b153-e313eed1c771.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc3cd366a-38e7-42d1-b153-e313eed1c771.selectorLabels" . | nindent 6 }}
