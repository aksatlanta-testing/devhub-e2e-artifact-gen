apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofaf9515d-e649-41f0-b9f9-f881b7152dc6.fullname" . }}
  labels:
    {{- include "go-echofaf9515d-e649-41f0-b9f9-f881b7152dc6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofaf9515d-e649-41f0-b9f9-f881b7152dc6.selectorLabels" . | nindent 6 }}
