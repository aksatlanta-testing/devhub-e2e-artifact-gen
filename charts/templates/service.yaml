apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoeb8327da-86c7-4f79-b56a-1dd387312cb3.fullname" . }}
  labels:
    {{- include "go-echoeb8327da-86c7-4f79-b56a-1dd387312cb3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoeb8327da-86c7-4f79-b56a-1dd387312cb3.selectorLabels" . | nindent 6 }}
