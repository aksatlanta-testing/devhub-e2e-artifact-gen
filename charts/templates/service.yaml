apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1aa14150-f81a-421c-9946-9b40bc00ab48.fullname" . }}
  labels:
    {{- include "go-echo1aa14150-f81a-421c-9946-9b40bc00ab48.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1aa14150-f81a-421c-9946-9b40bc00ab48.selectorLabels" . | nindent 6 }}
