apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodcca4785-481f-4672-9f57-0a1569385717.fullname" . }}
  labels:
    {{- include "go-echodcca4785-481f-4672-9f57-0a1569385717.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodcca4785-481f-4672-9f57-0a1569385717.selectorLabels" . | nindent 6 }}
