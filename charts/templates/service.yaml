apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo788735b9-5a88-4b8d-b7db-6c765a30aa2b.fullname" . }}
  labels:
    {{- include "go-echo788735b9-5a88-4b8d-b7db-6c765a30aa2b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo788735b9-5a88-4b8d-b7db-6c765a30aa2b.selectorLabels" . | nindent 6 }}
