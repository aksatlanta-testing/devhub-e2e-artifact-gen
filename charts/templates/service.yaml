apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo08f99e9c-d755-4599-8eef-0fa1e18ce8aa.fullname" . }}
  labels:
    {{- include "go-echo08f99e9c-d755-4599-8eef-0fa1e18ce8aa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo08f99e9c-d755-4599-8eef-0fa1e18ce8aa.selectorLabels" . | nindent 6 }}
