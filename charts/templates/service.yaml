apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo171118ea-6bf5-46c1-864e-b2ac69240007.fullname" . }}
  labels:
    {{- include "go-echo171118ea-6bf5-46c1-864e-b2ac69240007.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo171118ea-6bf5-46c1-864e-b2ac69240007.selectorLabels" . | nindent 6 }}
