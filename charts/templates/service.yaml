apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa5b70a82-a2ee-4107-b03e-4a00cd541363.fullname" . }}
  labels:
    {{- include "go-echoa5b70a82-a2ee-4107-b03e-4a00cd541363.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa5b70a82-a2ee-4107-b03e-4a00cd541363.selectorLabels" . | nindent 6 }}
