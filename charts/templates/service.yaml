apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod686ba10-4eb8-4cd7-b574-7e63e84ed7a8.fullname" . }}
  labels:
    {{- include "go-echod686ba10-4eb8-4cd7-b574-7e63e84ed7a8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod686ba10-4eb8-4cd7-b574-7e63e84ed7a8.selectorLabels" . | nindent 6 }}
