apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo95ee0e07-0a6b-43ab-bb7e-ae1a558ac525.fullname" . }}
  labels:
    {{- include "go-echo95ee0e07-0a6b-43ab-bb7e-ae1a558ac525.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo95ee0e07-0a6b-43ab-bb7e-ae1a558ac525.selectorLabels" . | nindent 6 }}
