apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo62fd46d2-3876-42b4-ab88-a293930519d6.fullname" . }}
  labels:
    {{- include "go-echo62fd46d2-3876-42b4-ab88-a293930519d6.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo62fd46d2-3876-42b4-ab88-a293930519d6.selectorLabels" . | nindent 6 }}
