apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob9f41ad3-d6df-4ed6-ab3e-2d09c57524c1.fullname" . }}
  labels:
    {{- include "go-echob9f41ad3-d6df-4ed6-ab3e-2d09c57524c1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob9f41ad3-d6df-4ed6-ab3e-2d09c57524c1.selectorLabels" . | nindent 6 }}
