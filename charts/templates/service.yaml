apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5180276c-0b74-4625-8f63-3674de36363e.fullname" . }}
  labels:
    {{- include "go-echo5180276c-0b74-4625-8f63-3674de36363e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
