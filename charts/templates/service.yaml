apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8cd06f35-b12d-41bb-80d7-6134eb7ecf26.fullname" . }}
  labels:
    {{- include "go-echo8cd06f35-b12d-41bb-80d7-6134eb7ecf26.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8cd06f35-b12d-41bb-80d7-6134eb7ecf26.selectorLabels" . | nindent 6 }}
