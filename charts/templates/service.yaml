apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8cf676a1-9708-4736-bda6-7d14ba716e7c.fullname" . }}
  labels:
    {{- include "go-echo8cf676a1-9708-4736-bda6-7d14ba716e7c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8cf676a1-9708-4736-bda6-7d14ba716e7c.selectorLabels" . | nindent 6 }}
