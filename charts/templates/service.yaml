apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo57c84f4a-c0ae-4414-8170-bfb2aea8530f.fullname" . }}
  labels:
    {{- include "go-echo57c84f4a-c0ae-4414-8170-bfb2aea8530f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo57c84f4a-c0ae-4414-8170-bfb2aea8530f.selectorLabels" . | nindent 6 }}
