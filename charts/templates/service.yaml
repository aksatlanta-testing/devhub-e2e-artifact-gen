apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo25d78e45-c10c-4f16-9a15-bd1e02e5f4e0.fullname" . }}
  labels:
    {{- include "go-echo25d78e45-c10c-4f16-9a15-bd1e02e5f4e0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo25d78e45-c10c-4f16-9a15-bd1e02e5f4e0.selectorLabels" . | nindent 6 }}
