apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0c1d5090-f571-47da-b553-a0aab3f60d39.fullname" . }}
  labels:
    {{- include "go-echo0c1d5090-f571-47da-b553-a0aab3f60d39.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0c1d5090-f571-47da-b553-a0aab3f60d39.selectorLabels" . | nindent 6 }}
