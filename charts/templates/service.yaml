apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0229b80d-a005-4ce2-ba97-45910a37d7f2.fullname" . }}
  labels:
    {{- include "go-echo0229b80d-a005-4ce2-ba97-45910a37d7f2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0229b80d-a005-4ce2-ba97-45910a37d7f2.selectorLabels" . | nindent 6 }}
