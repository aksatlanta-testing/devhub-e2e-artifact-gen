apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc5469da8-84da-43bd-bfd0-f75acb8901cc.fullname" . }}
  labels:
    {{- include "go-echoc5469da8-84da-43bd-bfd0-f75acb8901cc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc5469da8-84da-43bd-bfd0-f75acb8901cc.selectorLabels" . | nindent 6 }}
