apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo74c0903c-cdbb-4f8b-9689-a0a7f0d074f4.fullname" . }}
  labels:
    {{- include "go-echo74c0903c-cdbb-4f8b-9689-a0a7f0d074f4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo74c0903c-cdbb-4f8b-9689-a0a7f0d074f4.selectorLabels" . | nindent 6 }}
