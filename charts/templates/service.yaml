apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3788016c-e9de-4c48-a0f6-57e98cc90468.fullname" . }}
  labels:
    {{- include "go-echo3788016c-e9de-4c48-a0f6-57e98cc90468.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3788016c-e9de-4c48-a0f6-57e98cc90468.selectorLabels" . | nindent 6 }}
