apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod20c9aaa-1486-4fd8-91dc-7cc220e6d9ca.fullname" . }}
  labels:
    {{- include "go-echod20c9aaa-1486-4fd8-91dc-7cc220e6d9ca.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod20c9aaa-1486-4fd8-91dc-7cc220e6d9ca.selectorLabels" . | nindent 6 }}
