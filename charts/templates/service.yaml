apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof6456583-8835-4eba-87de-133031fa2d92.fullname" . }}
  labels:
    {{- include "go-echof6456583-8835-4eba-87de-133031fa2d92.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof6456583-8835-4eba-87de-133031fa2d92.selectorLabels" . | nindent 6 }}
