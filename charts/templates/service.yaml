apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo88b4071d-7797-4566-996d-e8ca7814b21c.fullname" . }}
  labels:
    {{- include "go-echo88b4071d-7797-4566-996d-e8ca7814b21c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo88b4071d-7797-4566-996d-e8ca7814b21c.selectorLabels" . | nindent 6 }}
