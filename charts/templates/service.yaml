apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo65de4b21-2041-41dc-9d67-6332a07977d2.fullname" . }}
  labels:
    {{- include "go-echo65de4b21-2041-41dc-9d67-6332a07977d2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo65de4b21-2041-41dc-9d67-6332a07977d2.selectorLabels" . | nindent 6 }}
