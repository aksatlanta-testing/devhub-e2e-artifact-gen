apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe8099a72-00f7-438b-a98b-0c106a4db09d.fullname" . }}
  labels:
    {{- include "go-echoe8099a72-00f7-438b-a98b-0c106a4db09d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe8099a72-00f7-438b-a98b-0c106a4db09d.selectorLabels" . | nindent 6 }}
