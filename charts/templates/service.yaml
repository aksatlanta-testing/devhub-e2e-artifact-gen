apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8f136231-079b-424c-ba39-9b16c94fe444.fullname" . }}
  labels:
    {{- include "go-echo8f136231-079b-424c-ba39-9b16c94fe444.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8f136231-079b-424c-ba39-9b16c94fe444.selectorLabels" . | nindent 6 }}
