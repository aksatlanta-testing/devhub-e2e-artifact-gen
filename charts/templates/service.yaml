apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echode871b9a-dd57-4ad5-8fa8-53e4fef20b97.fullname" . }}
  labels:
    {{- include "go-echode871b9a-dd57-4ad5-8fa8-53e4fef20b97.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echode871b9a-dd57-4ad5-8fa8-53e4fef20b97.selectorLabels" . | nindent 6 }}
