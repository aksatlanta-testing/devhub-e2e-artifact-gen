apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo58b53913-f67f-4d84-b0dc-6a997e3f1b5c.fullname" . }}
  labels:
    {{- include "go-echo58b53913-f67f-4d84-b0dc-6a997e3f1b5c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo58b53913-f67f-4d84-b0dc-6a997e3f1b5c.selectorLabels" . | nindent 6 }}
