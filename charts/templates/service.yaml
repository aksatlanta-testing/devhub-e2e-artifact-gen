apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof5b0be05-d6e8-4a8d-9329-430a00dbcbca.fullname" . }}
  labels:
    {{- include "go-echof5b0be05-d6e8-4a8d-9329-430a00dbcbca.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof5b0be05-d6e8-4a8d-9329-430a00dbcbca.selectorLabels" . | nindent 6 }}
