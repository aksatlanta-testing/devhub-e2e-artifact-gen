apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe09078e5-580d-4f33-81cd-8656e76b5ec2.fullname" . }}
  labels:
    {{- include "go-echoe09078e5-580d-4f33-81cd-8656e76b5ec2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe09078e5-580d-4f33-81cd-8656e76b5ec2.selectorLabels" . | nindent 6 }}
