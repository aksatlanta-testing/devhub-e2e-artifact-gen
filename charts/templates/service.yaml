apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5a25747c-ea70-40e9-b7e3-982030deaa3b.fullname" . }}
  labels:
    {{- include "go-echo5a25747c-ea70-40e9-b7e3-982030deaa3b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5a25747c-ea70-40e9-b7e3-982030deaa3b.selectorLabels" . | nindent 6 }}
