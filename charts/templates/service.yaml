apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobf7a346b-7256-443d-8362-d6165febb90c.fullname" . }}
  labels:
    {{- include "go-echobf7a346b-7256-443d-8362-d6165febb90c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobf7a346b-7256-443d-8362-d6165febb90c.selectorLabels" . | nindent 6 }}
