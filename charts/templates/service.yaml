apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4b38786d-3b98-4786-b08e-0dc7fd92eaf8.fullname" . }}
  labels:
    {{- include "go-echo4b38786d-3b98-4786-b08e-0dc7fd92eaf8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4b38786d-3b98-4786-b08e-0dc7fd92eaf8.selectorLabels" . | nindent 6 }}
