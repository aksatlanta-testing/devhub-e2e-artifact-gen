apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo40f9136b-e5f3-4166-b052-5d23f41b9bb9.fullname" . }}
  labels:
    {{- include "go-echo40f9136b-e5f3-4166-b052-5d23f41b9bb9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo40f9136b-e5f3-4166-b052-5d23f41b9bb9.selectorLabels" . | nindent 6 }}
