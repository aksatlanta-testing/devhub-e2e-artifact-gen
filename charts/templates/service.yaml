apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo32f0d4fe-865a-4918-9924-13554451c742.fullname" . }}
  labels:
    {{- include "go-echo32f0d4fe-865a-4918-9924-13554451c742.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo32f0d4fe-865a-4918-9924-13554451c742.selectorLabels" . | nindent 6 }}
