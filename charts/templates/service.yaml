apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof2ec4bd1-38cf-44fc-bce9-4817a6afa036.fullname" . }}
  labels:
    {{- include "go-echof2ec4bd1-38cf-44fc-bce9-4817a6afa036.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof2ec4bd1-38cf-44fc-bce9-4817a6afa036.selectorLabels" . | nindent 6 }}
