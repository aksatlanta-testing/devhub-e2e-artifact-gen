apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodc57c16c-85bb-447d-b635-74fd619ae83a.fullname" . }}
  labels:
    {{- include "go-echodc57c16c-85bb-447d-b635-74fd619ae83a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodc57c16c-85bb-447d-b635-74fd619ae83a.selectorLabels" . | nindent 6 }}
