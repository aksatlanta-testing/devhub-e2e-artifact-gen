apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2a98a41d-3d13-4b1c-9af7-741263516fec.fullname" . }}
  labels:
    {{- include "go-echo2a98a41d-3d13-4b1c-9af7-741263516fec.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2a98a41d-3d13-4b1c-9af7-741263516fec.selectorLabels" . | nindent 6 }}
