apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocff27663-14ac-4e9a-be53-57970ddade21.fullname" . }}
  labels:
    {{- include "go-echocff27663-14ac-4e9a-be53-57970ddade21.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocff27663-14ac-4e9a-be53-57970ddade21.selectorLabels" . | nindent 6 }}
