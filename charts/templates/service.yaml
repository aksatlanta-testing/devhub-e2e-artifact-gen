apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo12bb49be-5d01-4022-80ad-c6751d0a1b82.fullname" . }}
  labels:
    {{- include "go-echo12bb49be-5d01-4022-80ad-c6751d0a1b82.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo12bb49be-5d01-4022-80ad-c6751d0a1b82.selectorLabels" . | nindent 6 }}
