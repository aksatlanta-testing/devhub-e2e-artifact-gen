apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo82359ad1-37d1-4e43-b944-c57ff77de068.fullname" . }}
  labels:
    {{- include "go-echo82359ad1-37d1-4e43-b944-c57ff77de068.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo82359ad1-37d1-4e43-b944-c57ff77de068.selectorLabels" . | nindent 6 }}
