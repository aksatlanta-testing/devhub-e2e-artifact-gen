apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodca4918b-ac83-434a-a9c9-1d09593d4246.fullname" . }}
  labels:
    {{- include "go-echodca4918b-ac83-434a-a9c9-1d09593d4246.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodca4918b-ac83-434a-a9c9-1d09593d4246.selectorLabels" . | nindent 6 }}
