apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaed4f3fb-039c-4373-8be4-a233361dd372.fullname" . }}
  labels:
    {{- include "go-echoaed4f3fb-039c-4373-8be4-a233361dd372.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaed4f3fb-039c-4373-8be4-a233361dd372.selectorLabels" . | nindent 6 }}
