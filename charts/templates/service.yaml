apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo17cc6a54-23e2-4758-8b91-4d0ab181254c.fullname" . }}
  labels:
    {{- include "go-echo17cc6a54-23e2-4758-8b91-4d0ab181254c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo17cc6a54-23e2-4758-8b91-4d0ab181254c.selectorLabels" . | nindent 6 }}
