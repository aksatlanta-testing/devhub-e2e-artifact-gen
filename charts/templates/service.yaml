apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo572dc6c3-81c9-40e6-b090-473d7641d364.fullname" . }}
  labels:
    {{- include "go-echo572dc6c3-81c9-40e6-b090-473d7641d364.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo572dc6c3-81c9-40e6-b090-473d7641d364.selectorLabels" . | nindent 6 }}
