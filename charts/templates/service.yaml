apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1a72b7a1-d0b4-4b45-aad8-2e1bfd700cb8.fullname" . }}
  labels:
    {{- include "go-echo1a72b7a1-d0b4-4b45-aad8-2e1bfd700cb8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1a72b7a1-d0b4-4b45-aad8-2e1bfd700cb8.selectorLabels" . | nindent 6 }}
