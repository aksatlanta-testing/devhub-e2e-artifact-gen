apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo71c39561-2b70-42b8-8ccc-816bf968a557.fullname" . }}
  labels:
    {{- include "go-echo71c39561-2b70-42b8-8ccc-816bf968a557.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo71c39561-2b70-42b8-8ccc-816bf968a557.selectorLabels" . | nindent 6 }}
