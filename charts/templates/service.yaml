apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod12060d6-7a9c-4839-b458-1209a1dd64df.fullname" . }}
  labels:
    {{- include "go-echod12060d6-7a9c-4839-b458-1209a1dd64df.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod12060d6-7a9c-4839-b458-1209a1dd64df.selectorLabels" . | nindent 6 }}
