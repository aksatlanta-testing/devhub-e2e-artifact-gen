apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe5443881-4e0d-4111-bad9-995b9dbe23a2.fullname" . }}
  labels:
    {{- include "go-echoe5443881-4e0d-4111-bad9-995b9dbe23a2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe5443881-4e0d-4111-bad9-995b9dbe23a2.selectorLabels" . | nindent 6 }}
