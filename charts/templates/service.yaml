apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0194c255-b576-45db-ae0a-c0562e4ec7db.fullname" . }}
  labels:
    {{- include "go-echo0194c255-b576-45db-ae0a-c0562e4ec7db.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0194c255-b576-45db-ae0a-c0562e4ec7db.selectorLabels" . | nindent 6 }}
