apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2e1dfe0e-ec4b-4c7b-bb87-2a425132ada7.fullname" . }}
  labels:
    {{- include "go-echo2e1dfe0e-ec4b-4c7b-bb87-2a425132ada7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2e1dfe0e-ec4b-4c7b-bb87-2a425132ada7.selectorLabels" . | nindent 6 }}
