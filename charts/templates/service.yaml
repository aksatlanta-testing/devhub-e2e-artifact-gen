apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoea4b9c7c-7cf2-4c29-bc4f-42c03b587503.fullname" . }}
  labels:
    {{- include "go-echoea4b9c7c-7cf2-4c29-bc4f-42c03b587503.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoea4b9c7c-7cf2-4c29-bc4f-42c03b587503.selectorLabels" . | nindent 6 }}
