apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4f5fdc3b-258f-4694-83fc-1d7255b74ad5.fullname" . }}
  labels:
    {{- include "go-echo4f5fdc3b-258f-4694-83fc-1d7255b74ad5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4f5fdc3b-258f-4694-83fc-1d7255b74ad5.selectorLabels" . | nindent 6 }}
