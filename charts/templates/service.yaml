apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo48443ab6-8cbb-4df5-9ae5-3ee7d9240834.fullname" . }}
  labels:
    {{- include "go-echo48443ab6-8cbb-4df5-9ae5-3ee7d9240834.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo48443ab6-8cbb-4df5-9ae5-3ee7d9240834.selectorLabels" . | nindent 6 }}
