apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo41573252-b7e1-4550-b663-9d677e9c281c.fullname" . }}
  labels:
    {{- include "go-echo41573252-b7e1-4550-b663-9d677e9c281c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo41573252-b7e1-4550-b663-9d677e9c281c.selectorLabels" . | nindent 6 }}
