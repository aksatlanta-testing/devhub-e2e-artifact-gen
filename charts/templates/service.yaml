apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe3918a6c-a421-4ae1-912c-c301123cf2c0.fullname" . }}
  labels:
    {{- include "go-echoe3918a6c-a421-4ae1-912c-c301123cf2c0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe3918a6c-a421-4ae1-912c-c301123cf2c0.selectorLabels" . | nindent 6 }}
