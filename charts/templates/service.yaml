apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo438c955f-1b95-45ba-8424-614f7b4cfc1b.fullname" . }}
  labels:
    {{- include "go-echo438c955f-1b95-45ba-8424-614f7b4cfc1b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo438c955f-1b95-45ba-8424-614f7b4cfc1b.selectorLabels" . | nindent 6 }}
