apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodb650fc5-d1c4-43ce-9355-fc5fb7af98c1.fullname" . }}
  labels:
    {{- include "go-echodb650fc5-d1c4-43ce-9355-fc5fb7af98c1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodb650fc5-d1c4-43ce-9355-fc5fb7af98c1.selectorLabels" . | nindent 6 }}
