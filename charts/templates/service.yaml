apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof51ce97a-e620-4bff-b3fa-98bc452a9e30.fullname" . }}
  labels:
    {{- include "go-echof51ce97a-e620-4bff-b3fa-98bc452a9e30.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof51ce97a-e620-4bff-b3fa-98bc452a9e30.selectorLabels" . | nindent 6 }}
