apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo30e5e2d9-2bb9-47eb-905c-09443ad341f9.fullname" . }}
  labels:
    {{- include "go-echo30e5e2d9-2bb9-47eb-905c-09443ad341f9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo30e5e2d9-2bb9-47eb-905c-09443ad341f9.selectorLabels" . | nindent 6 }}
