apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo73af011f-f9b9-48dc-8cf3-9d8d308f2804.fullname" . }}
  labels:
    {{- include "go-echo73af011f-f9b9-48dc-8cf3-9d8d308f2804.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo73af011f-f9b9-48dc-8cf3-9d8d308f2804.selectorLabels" . | nindent 6 }}
