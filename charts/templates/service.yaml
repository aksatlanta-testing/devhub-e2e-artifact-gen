apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo72f933a6-c0b1-49c1-be39-4f2f7b6af673.fullname" . }}
  labels:
    {{- include "go-echo72f933a6-c0b1-49c1-be39-4f2f7b6af673.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo72f933a6-c0b1-49c1-be39-4f2f7b6af673.selectorLabels" . | nindent 6 }}
