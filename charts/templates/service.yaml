apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo962f08e9-30ac-455a-a911-e9a7309622ab.fullname" . }}
  labels:
    {{- include "go-echo962f08e9-30ac-455a-a911-e9a7309622ab.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo962f08e9-30ac-455a-a911-e9a7309622ab.selectorLabels" . | nindent 6 }}
