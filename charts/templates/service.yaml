apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe5bdb406-97dd-4def-8119-78080c4c47b8.fullname" . }}
  labels:
    {{- include "go-echoe5bdb406-97dd-4def-8119-78080c4c47b8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe5bdb406-97dd-4def-8119-78080c4c47b8.selectorLabels" . | nindent 6 }}
