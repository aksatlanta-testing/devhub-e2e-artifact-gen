apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0f2a13d1-1643-439c-a0c9-8f2deef9fe84.fullname" . }}
  labels:
    {{- include "go-echo0f2a13d1-1643-439c-a0c9-8f2deef9fe84.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0f2a13d1-1643-439c-a0c9-8f2deef9fe84.selectorLabels" . | nindent 6 }}
