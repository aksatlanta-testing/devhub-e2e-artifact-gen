apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0a8d9d99-c146-47f4-b978-1634ebaf5981.fullname" . }}
  labels:
    {{- include "go-echo0a8d9d99-c146-47f4-b978-1634ebaf5981.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0a8d9d99-c146-47f4-b978-1634ebaf5981.selectorLabels" . | nindent 6 }}
