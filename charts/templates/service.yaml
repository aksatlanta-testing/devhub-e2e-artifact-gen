apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof6d20921-1e80-43a6-a382-074e8813acfb.fullname" . }}
  labels:
    {{- include "go-echof6d20921-1e80-43a6-a382-074e8813acfb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof6d20921-1e80-43a6-a382-074e8813acfb.selectorLabels" . | nindent 6 }}
