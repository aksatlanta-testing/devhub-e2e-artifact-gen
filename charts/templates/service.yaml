apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3f7bb020-1819-4102-ae41-a52e53a9b69e.fullname" . }}
  labels:
    {{- include "go-echo3f7bb020-1819-4102-ae41-a52e53a9b69e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3f7bb020-1819-4102-ae41-a52e53a9b69e.selectorLabels" . | nindent 6 }}
