apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9b5e8a77-4c57-4b43-9967-339d6241d7b8.fullname" . }}
  labels:
    {{- include "go-echo9b5e8a77-4c57-4b43-9967-339d6241d7b8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9b5e8a77-4c57-4b43-9967-339d6241d7b8.selectorLabels" . | nindent 6 }}
