apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4c502cf1-dae3-4a5d-a36c-8b7fe1398407.fullname" . }}
  labels:
    {{- include "go-echo4c502cf1-dae3-4a5d-a36c-8b7fe1398407.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4c502cf1-dae3-4a5d-a36c-8b7fe1398407.selectorLabels" . | nindent 6 }}
