apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7a67be1c-6641-40b4-9ff3-4f7c30c11530.fullname" . }}
  labels:
    {{- include "go-echo7a67be1c-6641-40b4-9ff3-4f7c30c11530.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7a67be1c-6641-40b4-9ff3-4f7c30c11530.selectorLabels" . | nindent 6 }}
