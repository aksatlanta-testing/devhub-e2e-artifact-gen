apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob197e4ec-bacf-484f-be67-358fa071ea1f.fullname" . }}
  labels:
    {{- include "go-echob197e4ec-bacf-484f-be67-358fa071ea1f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob197e4ec-bacf-484f-be67-358fa071ea1f.selectorLabels" . | nindent 6 }}
