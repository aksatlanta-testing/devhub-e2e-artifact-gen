apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod197950c-2b60-42d1-8336-90ad2640e0c6.fullname" . }}
  labels:
    {{- include "go-echod197950c-2b60-42d1-8336-90ad2640e0c6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod197950c-2b60-42d1-8336-90ad2640e0c6.selectorLabels" . | nindent 6 }}
