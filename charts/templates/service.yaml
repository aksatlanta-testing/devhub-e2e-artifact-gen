apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoba4f5f57-f879-4f6f-9e7c-e9d14d658b8d.fullname" . }}
  labels:
    {{- include "go-echoba4f5f57-f879-4f6f-9e7c-e9d14d658b8d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoba4f5f57-f879-4f6f-9e7c-e9d14d658b8d.selectorLabels" . | nindent 6 }}
