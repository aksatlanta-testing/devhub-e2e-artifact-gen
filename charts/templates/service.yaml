apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo688833bf-3712-491c-87eb-7d4a23971d27.fullname" . }}
  labels:
    {{- include "go-echo688833bf-3712-491c-87eb-7d4a23971d27.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo688833bf-3712-491c-87eb-7d4a23971d27.selectorLabels" . | nindent 6 }}
