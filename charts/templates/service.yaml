apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocb00d513-2ea3-4349-a907-4ae7b419faab.fullname" . }}
  labels:
    {{- include "go-echocb00d513-2ea3-4349-a907-4ae7b419faab.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocb00d513-2ea3-4349-a907-4ae7b419faab.selectorLabels" . | nindent 6 }}
