apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo35891938-24ba-4a01-9d3e-fea37b66fd2b.fullname" . }}
  labels:
    {{- include "go-echo35891938-24ba-4a01-9d3e-fea37b66fd2b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo35891938-24ba-4a01-9d3e-fea37b66fd2b.selectorLabels" . | nindent 6 }}
