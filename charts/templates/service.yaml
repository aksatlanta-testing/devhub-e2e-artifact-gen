apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocbe36253-28e2-4f93-a2ca-a2211e7de254.fullname" . }}
  labels:
    {{- include "go-echocbe36253-28e2-4f93-a2ca-a2211e7de254.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocbe36253-28e2-4f93-a2ca-a2211e7de254.selectorLabels" . | nindent 6 }}
