apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocd7cd0ce-d419-4acc-922d-0508d0341ba5.fullname" . }}
  labels:
    {{- include "go-echocd7cd0ce-d419-4acc-922d-0508d0341ba5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocd7cd0ce-d419-4acc-922d-0508d0341ba5.selectorLabels" . | nindent 6 }}
