apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob8309afc-811b-4231-bac7-c5e0600c4d70.fullname" . }}
  labels:
    {{- include "go-echob8309afc-811b-4231-bac7-c5e0600c4d70.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob8309afc-811b-4231-bac7-c5e0600c4d70.selectorLabels" . | nindent 6 }}
