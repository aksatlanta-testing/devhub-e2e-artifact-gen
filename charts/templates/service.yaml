apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2f969d30-8deb-412f-b367-1d5f42b319b9.fullname" . }}
  labels:
    {{- include "go-echo2f969d30-8deb-412f-b367-1d5f42b319b9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2f969d30-8deb-412f-b367-1d5f42b319b9.selectorLabels" . | nindent 6 }}
