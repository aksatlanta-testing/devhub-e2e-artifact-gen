apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0135d8c9-271a-4479-b60e-e812d45d19c7.fullname" . }}
  labels:
    {{- include "go-echo0135d8c9-271a-4479-b60e-e812d45d19c7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0135d8c9-271a-4479-b60e-e812d45d19c7.selectorLabels" . | nindent 6 }}
