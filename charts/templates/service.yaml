apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoef5159c7-bd65-4c20-aa27-49eb4c6b6dd9.fullname" . }}
  labels:
    {{- include "go-echoef5159c7-bd65-4c20-aa27-49eb4c6b6dd9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoef5159c7-bd65-4c20-aa27-49eb4c6b6dd9.selectorLabels" . | nindent 6 }}
