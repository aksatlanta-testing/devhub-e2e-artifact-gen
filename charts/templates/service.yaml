apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobe73962c-216e-4242-a54d-30232761e1cd.fullname" . }}
  labels:
    {{- include "go-echobe73962c-216e-4242-a54d-30232761e1cd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobe73962c-216e-4242-a54d-30232761e1cd.selectorLabels" . | nindent 6 }}
