apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa3f4dca2-45ab-467e-9b46-fe30b28cd692.fullname" . }}
  labels:
    {{- include "go-echoa3f4dca2-45ab-467e-9b46-fe30b28cd692.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa3f4dca2-45ab-467e-9b46-fe30b28cd692.selectorLabels" . | nindent 6 }}
