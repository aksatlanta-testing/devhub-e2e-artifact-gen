apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3950dfee-5b3d-498d-ad35-1d7bf435a1d9.fullname" . }}
  labels:
    {{- include "go-echo3950dfee-5b3d-498d-ad35-1d7bf435a1d9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3950dfee-5b3d-498d-ad35-1d7bf435a1d9.selectorLabels" . | nindent 6 }}
