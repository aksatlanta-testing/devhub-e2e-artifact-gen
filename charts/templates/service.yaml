apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo07f21ace-9c92-45cb-b80a-ea7cf40d2626.fullname" . }}
  labels:
    {{- include "go-echo07f21ace-9c92-45cb-b80a-ea7cf40d2626.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo07f21ace-9c92-45cb-b80a-ea7cf40d2626.selectorLabels" . | nindent 6 }}
