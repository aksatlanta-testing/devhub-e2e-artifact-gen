apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc7eb80c8-defc-4040-89c6-6ad42fd5ee7f.fullname" . }}
  labels:
    {{- include "go-echoc7eb80c8-defc-4040-89c6-6ad42fd5ee7f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc7eb80c8-defc-4040-89c6-6ad42fd5ee7f.selectorLabels" . | nindent 6 }}
