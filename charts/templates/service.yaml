apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoedc0542e-2563-4e8f-9360-0ddb9c891a84.fullname" . }}
  labels:
    {{- include "go-echoedc0542e-2563-4e8f-9360-0ddb9c891a84.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoedc0542e-2563-4e8f-9360-0ddb9c891a84.selectorLabels" . | nindent 6 }}
