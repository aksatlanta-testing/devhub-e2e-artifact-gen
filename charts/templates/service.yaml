apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo33deb054-5483-4b1a-b8fc-0b2077e4fb7c.fullname" . }}
  labels:
    {{- include "go-echo33deb054-5483-4b1a-b8fc-0b2077e4fb7c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo33deb054-5483-4b1a-b8fc-0b2077e4fb7c.selectorLabels" . | nindent 6 }}
