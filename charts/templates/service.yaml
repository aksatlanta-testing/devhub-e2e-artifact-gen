apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe0746106-715c-4c15-9498-5adce04ea6e0.fullname" . }}
  labels:
    {{- include "go-echoe0746106-715c-4c15-9498-5adce04ea6e0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe0746106-715c-4c15-9498-5adce04ea6e0.selectorLabels" . | nindent 6 }}
