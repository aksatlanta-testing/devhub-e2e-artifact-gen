apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod902ff4e-12fb-43d3-b36c-b04a58db43a8.fullname" . }}
  labels:
    {{- include "go-echod902ff4e-12fb-43d3-b36c-b04a58db43a8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod902ff4e-12fb-43d3-b36c-b04a58db43a8.selectorLabels" . | nindent 6 }}
