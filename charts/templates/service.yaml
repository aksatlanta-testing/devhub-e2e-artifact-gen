apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob3de9106-0f40-4a75-804c-37949da45238.fullname" . }}
  labels:
    {{- include "go-echob3de9106-0f40-4a75-804c-37949da45238.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob3de9106-0f40-4a75-804c-37949da45238.selectorLabels" . | nindent 6 }}
