apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo35cd4ab5-8980-4baa-ac05-c02ddbeeaa86.fullname" . }}
  labels:
    {{- include "go-echo35cd4ab5-8980-4baa-ac05-c02ddbeeaa86.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo35cd4ab5-8980-4baa-ac05-c02ddbeeaa86.selectorLabels" . | nindent 6 }}
