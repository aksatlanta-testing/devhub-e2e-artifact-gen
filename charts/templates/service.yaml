apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaf4ccace-a234-4f79-adaa-1903459022ab.fullname" . }}
  labels:
    {{- include "go-echoaf4ccace-a234-4f79-adaa-1903459022ab.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaf4ccace-a234-4f79-adaa-1903459022ab.selectorLabels" . | nindent 6 }}
