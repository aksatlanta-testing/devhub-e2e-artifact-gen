apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof740d027-19a8-4644-b54e-edf66564f411.fullname" . }}
  labels:
    {{- include "go-echof740d027-19a8-4644-b54e-edf66564f411.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof740d027-19a8-4644-b54e-edf66564f411.selectorLabels" . | nindent 6 }}
