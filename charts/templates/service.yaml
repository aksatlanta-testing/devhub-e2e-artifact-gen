apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo102eb00f-287a-4c12-8436-606f29556488.fullname" . }}
  labels:
    {{- include "go-echo102eb00f-287a-4c12-8436-606f29556488.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo102eb00f-287a-4c12-8436-606f29556488.selectorLabels" . | nindent 6 }}
