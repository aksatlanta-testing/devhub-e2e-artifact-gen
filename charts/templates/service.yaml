apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaf65bf16-6b58-4cfd-bc4c-fe77820d75f4.fullname" . }}
  labels:
    {{- include "go-echoaf65bf16-6b58-4cfd-bc4c-fe77820d75f4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaf65bf16-6b58-4cfd-bc4c-fe77820d75f4.selectorLabels" . | nindent 6 }}
