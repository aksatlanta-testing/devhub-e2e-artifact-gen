apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo47660293-724c-449b-95eb-0d1319ce20d1.fullname" . }}
  labels:
    {{- include "go-echo47660293-724c-449b-95eb-0d1319ce20d1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo47660293-724c-449b-95eb-0d1319ce20d1.selectorLabels" . | nindent 6 }}
