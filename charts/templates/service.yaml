apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo70eee300-4bcb-4e55-8b79-f6180db318d7.fullname" . }}
  labels:
    {{- include "go-echo70eee300-4bcb-4e55-8b79-f6180db318d7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo70eee300-4bcb-4e55-8b79-f6180db318d7.selectorLabels" . | nindent 6 }}
