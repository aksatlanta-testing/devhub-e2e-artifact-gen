apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc45c6eab-22cd-40cc-a0fa-2a1d67c036c2.fullname" . }}
  labels:
    {{- include "go-echoc45c6eab-22cd-40cc-a0fa-2a1d67c036c2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc45c6eab-22cd-40cc-a0fa-2a1d67c036c2.selectorLabels" . | nindent 6 }}
