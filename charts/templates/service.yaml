apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofe9b3cab-da27-496c-89b0-e094b7ebd29a.fullname" . }}
  labels:
    {{- include "go-echofe9b3cab-da27-496c-89b0-e094b7ebd29a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofe9b3cab-da27-496c-89b0-e094b7ebd29a.selectorLabels" . | nindent 6 }}
