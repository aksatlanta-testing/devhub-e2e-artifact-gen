apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo63ea40cf-7254-4e6c-a8ae-f4ea6eb8efbd.fullname" . }}
  labels:
    {{- include "go-echo63ea40cf-7254-4e6c-a8ae-f4ea6eb8efbd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo63ea40cf-7254-4e6c-a8ae-f4ea6eb8efbd.selectorLabels" . | nindent 6 }}
