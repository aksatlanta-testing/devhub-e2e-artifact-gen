apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc2562579-a681-498c-9ffe-c58e95e6b117.fullname" . }}
  labels:
    {{- include "go-echoc2562579-a681-498c-9ffe-c58e95e6b117.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc2562579-a681-498c-9ffe-c58e95e6b117.selectorLabels" . | nindent 6 }}
