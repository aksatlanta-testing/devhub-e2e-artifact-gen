apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo42f69ee3-6025-4c4f-86e7-13dc61700779.fullname" . }}
  labels:
    {{- include "go-echo42f69ee3-6025-4c4f-86e7-13dc61700779.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo42f69ee3-6025-4c4f-86e7-13dc61700779.selectorLabels" . | nindent 6 }}
