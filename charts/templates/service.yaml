apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo58e030d2-6f25-4cf9-94db-edd4373e463f.fullname" . }}
  labels:
    {{- include "go-echo58e030d2-6f25-4cf9-94db-edd4373e463f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo58e030d2-6f25-4cf9-94db-edd4373e463f.selectorLabels" . | nindent 6 }}
