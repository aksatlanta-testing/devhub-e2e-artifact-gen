apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6a712453-dfc5-47c7-b2a1-3d3ed49fbc4e.fullname" . }}
  labels:
    {{- include "go-echo6a712453-dfc5-47c7-b2a1-3d3ed49fbc4e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6a712453-dfc5-47c7-b2a1-3d3ed49fbc4e.selectorLabels" . | nindent 6 }}
