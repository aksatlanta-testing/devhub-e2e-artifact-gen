apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofb59e168-ae90-4f69-b86d-ef9dbe66e5c9.fullname" . }}
  labels:
    {{- include "go-echofb59e168-ae90-4f69-b86d-ef9dbe66e5c9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofb59e168-ae90-4f69-b86d-ef9dbe66e5c9.selectorLabels" . | nindent 6 }}
