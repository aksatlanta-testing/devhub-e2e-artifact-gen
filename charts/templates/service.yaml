apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1a784888-146c-43cc-9edb-b669d27a70b2.fullname" . }}
  labels:
    {{- include "go-echo1a784888-146c-43cc-9edb-b669d27a70b2.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1a784888-146c-43cc-9edb-b669d27a70b2.selectorLabels" . | nindent 6 }}
