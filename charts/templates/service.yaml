apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo39972bbe-fa70-4678-95da-45d1ecbdbd37.fullname" . }}
  labels:
    {{- include "go-echo39972bbe-fa70-4678-95da-45d1ecbdbd37.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo39972bbe-fa70-4678-95da-45d1ecbdbd37.selectorLabels" . | nindent 6 }}
