apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1b6377cd-0263-49ea-a8f7-4c6a67baab47.fullname" . }}
  labels:
    {{- include "go-echo1b6377cd-0263-49ea-a8f7-4c6a67baab47.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1b6377cd-0263-49ea-a8f7-4c6a67baab47.selectorLabels" . | nindent 6 }}
