apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo420b25c8-da55-4854-b751-55127dedbb23.fullname" . }}
  labels:
    {{- include "go-echo420b25c8-da55-4854-b751-55127dedbb23.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo420b25c8-da55-4854-b751-55127dedbb23.selectorLabels" . | nindent 6 }}
