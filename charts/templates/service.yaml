apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo90b22e08-efc0-4fe2-9b9f-383fb7a90a81.fullname" . }}
  labels:
    {{- include "go-echo90b22e08-efc0-4fe2-9b9f-383fb7a90a81.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo90b22e08-efc0-4fe2-9b9f-383fb7a90a81.selectorLabels" . | nindent 6 }}
