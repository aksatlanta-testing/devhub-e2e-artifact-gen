apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8a36e315-110c-4f97-ae51-fc857b94d4e7.fullname" . }}
  labels:
    {{- include "go-echo8a36e315-110c-4f97-ae51-fc857b94d4e7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8a36e315-110c-4f97-ae51-fc857b94d4e7.selectorLabels" . | nindent 6 }}
