apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo28284e5d-ca65-4ec9-a812-64f5f19da6e7.fullname" . }}
  labels:
    {{- include "go-echo28284e5d-ca65-4ec9-a812-64f5f19da6e7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo28284e5d-ca65-4ec9-a812-64f5f19da6e7.selectorLabels" . | nindent 6 }}
