apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa7f7ecfd-5574-4041-b186-f056c383cba4.fullname" . }}
  labels:
    {{- include "go-echoa7f7ecfd-5574-4041-b186-f056c383cba4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa7f7ecfd-5574-4041-b186-f056c383cba4.selectorLabels" . | nindent 6 }}
