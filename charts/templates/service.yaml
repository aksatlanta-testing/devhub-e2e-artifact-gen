apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob736fd2a-cefe-4b5e-b6fa-5372dac5c2ad.fullname" . }}
  labels:
    {{- include "go-echob736fd2a-cefe-4b5e-b6fa-5372dac5c2ad.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob736fd2a-cefe-4b5e-b6fa-5372dac5c2ad.selectorLabels" . | nindent 6 }}
