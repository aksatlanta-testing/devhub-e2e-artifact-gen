apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobf4784a3-9a50-462e-9157-4732cd91a254.fullname" . }}
  labels:
    {{- include "go-echobf4784a3-9a50-462e-9157-4732cd91a254.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobf4784a3-9a50-462e-9157-4732cd91a254.selectorLabels" . | nindent 6 }}
