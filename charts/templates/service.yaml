apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo384d4407-6a22-4f4e-bb7f-6003eb8e43a3.fullname" . }}
  labels:
    {{- include "go-echo384d4407-6a22-4f4e-bb7f-6003eb8e43a3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo384d4407-6a22-4f4e-bb7f-6003eb8e43a3.selectorLabels" . | nindent 6 }}
