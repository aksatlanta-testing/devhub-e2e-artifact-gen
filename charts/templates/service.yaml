apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6cfdfd73-f2a4-4928-bff6-f037d764e66e.fullname" . }}
  labels:
    {{- include "go-echo6cfdfd73-f2a4-4928-bff6-f037d764e66e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6cfdfd73-f2a4-4928-bff6-f037d764e66e.selectorLabels" . | nindent 6 }}
