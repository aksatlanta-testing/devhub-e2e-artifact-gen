apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0d55b6e1-2fae-46f1-a6af-1061bbafea7f.fullname" . }}
  labels:
    {{- include "go-echo0d55b6e1-2fae-46f1-a6af-1061bbafea7f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0d55b6e1-2fae-46f1-a6af-1061bbafea7f.selectorLabels" . | nindent 6 }}
