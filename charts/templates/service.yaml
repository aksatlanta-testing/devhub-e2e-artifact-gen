apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoec5e4a52-6afd-4ebd-9150-8cd443905261.fullname" . }}
  labels:
    {{- include "go-echoec5e4a52-6afd-4ebd-9150-8cd443905261.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoec5e4a52-6afd-4ebd-9150-8cd443905261.selectorLabels" . | nindent 6 }}
