apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1ee2f2e0-2ec4-4026-a409-f6a80a5e5005.fullname" . }}
  labels:
    {{- include "go-echo1ee2f2e0-2ec4-4026-a409-f6a80a5e5005.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1ee2f2e0-2ec4-4026-a409-f6a80a5e5005.selectorLabels" . | nindent 6 }}
