apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo73834270-baac-4692-aa5a-dac741e9a515.fullname" . }}
  labels:
    {{- include "go-echo73834270-baac-4692-aa5a-dac741e9a515.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo73834270-baac-4692-aa5a-dac741e9a515.selectorLabels" . | nindent 6 }}
