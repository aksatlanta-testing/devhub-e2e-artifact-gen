apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo86974515-872c-4b36-bc1c-4009c5245407.fullname" . }}
  labels:
    {{- include "go-echo86974515-872c-4b36-bc1c-4009c5245407.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo86974515-872c-4b36-bc1c-4009c5245407.selectorLabels" . | nindent 6 }}
