apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7205c136-3d31-44b8-9349-f4601bf6740e.fullname" . }}
  labels:
    {{- include "go-echo7205c136-3d31-44b8-9349-f4601bf6740e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7205c136-3d31-44b8-9349-f4601bf6740e.selectorLabels" . | nindent 6 }}
