apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9a41e1bb-1198-4491-acab-7cf8f99e2e5f.fullname" . }}
  labels:
    {{- include "go-echo9a41e1bb-1198-4491-acab-7cf8f99e2e5f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9a41e1bb-1198-4491-acab-7cf8f99e2e5f.selectorLabels" . | nindent 6 }}
