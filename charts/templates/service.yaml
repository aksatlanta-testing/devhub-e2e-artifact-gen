apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4144911f-c41f-4fcb-865b-72922f5465be.fullname" . }}
  labels:
    {{- include "go-echo4144911f-c41f-4fcb-865b-72922f5465be.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4144911f-c41f-4fcb-865b-72922f5465be.selectorLabels" . | nindent 6 }}
