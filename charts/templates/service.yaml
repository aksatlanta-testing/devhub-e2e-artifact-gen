apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4676b4ce-9a91-4baa-8a97-2ce7e7b49d28.fullname" . }}
  labels:
    {{- include "go-echo4676b4ce-9a91-4baa-8a97-2ce7e7b49d28.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4676b4ce-9a91-4baa-8a97-2ce7e7b49d28.selectorLabels" . | nindent 6 }}
