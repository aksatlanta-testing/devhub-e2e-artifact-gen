apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo71abeefb-39eb-43a5-8aa2-efa3763a8e3a.fullname" . }}
  labels:
    {{- include "go-echo71abeefb-39eb-43a5-8aa2-efa3763a8e3a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo71abeefb-39eb-43a5-8aa2-efa3763a8e3a.selectorLabels" . | nindent 6 }}
