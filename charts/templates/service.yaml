apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7602b376-05a5-4064-98ef-e9bb93168694.fullname" . }}
  labels:
    {{- include "go-echo7602b376-05a5-4064-98ef-e9bb93168694.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7602b376-05a5-4064-98ef-e9bb93168694.selectorLabels" . | nindent 6 }}
