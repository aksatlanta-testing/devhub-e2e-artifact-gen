apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobc0c3ef3-a4b4-4a3f-81f1-5c090b42684a.fullname" . }}
  labels:
    {{- include "go-echobc0c3ef3-a4b4-4a3f-81f1-5c090b42684a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobc0c3ef3-a4b4-4a3f-81f1-5c090b42684a.selectorLabels" . | nindent 6 }}
