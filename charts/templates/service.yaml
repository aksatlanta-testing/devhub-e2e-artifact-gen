apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoff263475-0fd6-4b3b-ba98-3af6dec266ad.fullname" . }}
  labels:
    {{- include "go-echoff263475-0fd6-4b3b-ba98-3af6dec266ad.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoff263475-0fd6-4b3b-ba98-3af6dec266ad.selectorLabels" . | nindent 6 }}
