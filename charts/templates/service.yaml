apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo59ef7c6a-ea7f-44ea-85d8-133b1fef39ab.fullname" . }}
  labels:
    {{- include "go-echo59ef7c6a-ea7f-44ea-85d8-133b1fef39ab.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo59ef7c6a-ea7f-44ea-85d8-133b1fef39ab.selectorLabels" . | nindent 6 }}
