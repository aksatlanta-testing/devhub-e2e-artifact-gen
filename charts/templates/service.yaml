apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodfd0ed62-9a21-4b6a-bfd3-c566ff982da6.fullname" . }}
  labels:
    {{- include "go-echodfd0ed62-9a21-4b6a-bfd3-c566ff982da6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodfd0ed62-9a21-4b6a-bfd3-c566ff982da6.selectorLabels" . | nindent 6 }}
