apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4aba2393-a4de-4cc3-bd80-57c8d9f1d4ef.fullname" . }}
  labels:
    {{- include "go-echo4aba2393-a4de-4cc3-bd80-57c8d9f1d4ef.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4aba2393-a4de-4cc3-bd80-57c8d9f1d4ef.selectorLabels" . | nindent 6 }}
