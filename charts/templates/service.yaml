apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo92a87cf4-851a-4162-a99f-5b725045772c.fullname" . }}
  labels:
    {{- include "go-echo92a87cf4-851a-4162-a99f-5b725045772c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo92a87cf4-851a-4162-a99f-5b725045772c.selectorLabels" . | nindent 6 }}
