apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob4f0bd92-d09f-46cf-8631-11f02363082a.fullname" . }}
  labels:
    {{- include "go-echob4f0bd92-d09f-46cf-8631-11f02363082a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob4f0bd92-d09f-46cf-8631-11f02363082a.selectorLabels" . | nindent 6 }}
