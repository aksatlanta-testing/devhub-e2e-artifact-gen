apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo51eae3fb-bfc5-47da-8ca7-4a6a03ebe594.fullname" . }}
  labels:
    {{- include "go-echo51eae3fb-bfc5-47da-8ca7-4a6a03ebe594.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo51eae3fb-bfc5-47da-8ca7-4a6a03ebe594.selectorLabels" . | nindent 6 }}
