apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoafd34f41-f87d-4bc8-807e-0a20bced47ac.fullname" . }}
  labels:
    {{- include "go-echoafd34f41-f87d-4bc8-807e-0a20bced47ac.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoafd34f41-f87d-4bc8-807e-0a20bced47ac.selectorLabels" . | nindent 6 }}
