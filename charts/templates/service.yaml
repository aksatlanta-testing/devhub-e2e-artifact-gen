apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo416bebf3-ae45-48aa-a90d-bb3cc2c06583.fullname" . }}
  labels:
    {{- include "go-echo416bebf3-ae45-48aa-a90d-bb3cc2c06583.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo416bebf3-ae45-48aa-a90d-bb3cc2c06583.selectorLabels" . | nindent 6 }}
