apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoef7ad74e-60cb-4653-bbc9-dc8c213edd8f.fullname" . }}
  labels:
    {{- include "go-echoef7ad74e-60cb-4653-bbc9-dc8c213edd8f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoef7ad74e-60cb-4653-bbc9-dc8c213edd8f.selectorLabels" . | nindent 6 }}
