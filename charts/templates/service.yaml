apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6cc0e640-65de-4920-9f1d-5fd223ffb052.fullname" . }}
  labels:
    {{- include "go-echo6cc0e640-65de-4920-9f1d-5fd223ffb052.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6cc0e640-65de-4920-9f1d-5fd223ffb052.selectorLabels" . | nindent 6 }}
