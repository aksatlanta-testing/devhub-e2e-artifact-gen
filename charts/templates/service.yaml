apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo103939d0-b641-49df-9ea3-e2eba650d117.fullname" . }}
  labels:
    {{- include "go-echo103939d0-b641-49df-9ea3-e2eba650d117.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo103939d0-b641-49df-9ea3-e2eba650d117.selectorLabels" . | nindent 6 }}
