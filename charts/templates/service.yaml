apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0df13a91-bfd3-4171-bbfb-95d11f320541.fullname" . }}
  labels:
    {{- include "go-echo0df13a91-bfd3-4171-bbfb-95d11f320541.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0df13a91-bfd3-4171-bbfb-95d11f320541.selectorLabels" . | nindent 6 }}
