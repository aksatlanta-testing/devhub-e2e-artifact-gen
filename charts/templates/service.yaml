apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa2fe9739-2507-451a-8d8a-08aeb40f4d47.fullname" . }}
  labels:
    {{- include "go-echoa2fe9739-2507-451a-8d8a-08aeb40f4d47.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa2fe9739-2507-451a-8d8a-08aeb40f4d47.selectorLabels" . | nindent 6 }}
