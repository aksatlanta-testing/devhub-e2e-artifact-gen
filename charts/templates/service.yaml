apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5c8f8ca2-695b-45d9-b21a-67f0d48f4963.fullname" . }}
  labels:
    {{- include "go-echo5c8f8ca2-695b-45d9-b21a-67f0d48f4963.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5c8f8ca2-695b-45d9-b21a-67f0d48f4963.selectorLabels" . | nindent 6 }}
