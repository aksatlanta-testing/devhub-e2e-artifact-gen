apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo703a0c11-b971-447c-a6bc-1167e1c9cb13.fullname" . }}
  labels:
    {{- include "go-echo703a0c11-b971-447c-a6bc-1167e1c9cb13.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo703a0c11-b971-447c-a6bc-1167e1c9cb13.selectorLabels" . | nindent 6 }}
