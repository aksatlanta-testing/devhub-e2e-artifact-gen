apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8f83934c-a8ac-446f-a9b9-f82a7745e4a1.fullname" . }}
  labels:
    {{- include "go-echo8f83934c-a8ac-446f-a9b9-f82a7745e4a1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8f83934c-a8ac-446f-a9b9-f82a7745e4a1.selectorLabels" . | nindent 6 }}
