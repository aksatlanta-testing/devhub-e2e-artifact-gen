apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoff073056-6d79-4f05-b962-8839097f2f32.fullname" . }}
  labels:
    {{- include "go-echoff073056-6d79-4f05-b962-8839097f2f32.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoff073056-6d79-4f05-b962-8839097f2f32.selectorLabels" . | nindent 6 }}
