apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2083f284-f561-4c3b-b215-f9bc7acccf67.fullname" . }}
  labels:
    {{- include "go-echo2083f284-f561-4c3b-b215-f9bc7acccf67.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2083f284-f561-4c3b-b215-f9bc7acccf67.selectorLabels" . | nindent 6 }}
