apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo78620de2-096f-42e1-a3f7-b97e3ce2d204.fullname" . }}
  labels:
    {{- include "go-echo78620de2-096f-42e1-a3f7-b97e3ce2d204.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo78620de2-096f-42e1-a3f7-b97e3ce2d204.selectorLabels" . | nindent 6 }}
