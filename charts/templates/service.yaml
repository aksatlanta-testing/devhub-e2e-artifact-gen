apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob5526ff5-0d82-48bc-8e27-6c7b5fd3b7e6.fullname" . }}
  labels:
    {{- include "go-echob5526ff5-0d82-48bc-8e27-6c7b5fd3b7e6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob5526ff5-0d82-48bc-8e27-6c7b5fd3b7e6.selectorLabels" . | nindent 6 }}
