apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoafe626fc-40e5-4adb-b35e-c4d0407efd5e.fullname" . }}
  labels:
    {{- include "go-echoafe626fc-40e5-4adb-b35e-c4d0407efd5e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoafe626fc-40e5-4adb-b35e-c4d0407efd5e.selectorLabels" . | nindent 6 }}
