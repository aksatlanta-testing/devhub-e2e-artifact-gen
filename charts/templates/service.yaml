apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9d5b5a58-dc33-440d-81e0-71fdf6d666ca.fullname" . }}
  labels:
    {{- include "go-echo9d5b5a58-dc33-440d-81e0-71fdf6d666ca.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9d5b5a58-dc33-440d-81e0-71fdf6d666ca.selectorLabels" . | nindent 6 }}
