apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo67d971ea-195c-4447-a653-4ca033d4643d.fullname" . }}
  labels:
    {{- include "go-echo67d971ea-195c-4447-a653-4ca033d4643d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo67d971ea-195c-4447-a653-4ca033d4643d.selectorLabels" . | nindent 6 }}
