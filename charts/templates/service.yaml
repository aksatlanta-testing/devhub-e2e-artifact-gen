apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof57f2d33-3720-4baa-94e9-8fad044e3c95.fullname" . }}
  labels:
    {{- include "go-echof57f2d33-3720-4baa-94e9-8fad044e3c95.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof57f2d33-3720-4baa-94e9-8fad044e3c95.selectorLabels" . | nindent 6 }}
