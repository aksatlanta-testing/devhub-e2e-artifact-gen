apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5607d941-4d1e-461a-b1d8-d6e6ec243708.fullname" . }}
  labels:
    {{- include "go-echo5607d941-4d1e-461a-b1d8-d6e6ec243708.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5607d941-4d1e-461a-b1d8-d6e6ec243708.selectorLabels" . | nindent 6 }}
