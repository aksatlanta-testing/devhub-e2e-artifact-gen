apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo83f4323c-b937-4b32-b5bd-b625ad57a6b4.fullname" . }}
  labels:
    {{- include "go-echo83f4323c-b937-4b32-b5bd-b625ad57a6b4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo83f4323c-b937-4b32-b5bd-b625ad57a6b4.selectorLabels" . | nindent 6 }}
