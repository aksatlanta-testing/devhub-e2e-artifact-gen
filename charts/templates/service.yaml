apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5772c555-44e9-4b34-ae8b-83cd545c3a36.fullname" . }}
  labels:
    {{- include "go-echo5772c555-44e9-4b34-ae8b-83cd545c3a36.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: devhub
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5772c555-44e9-4b34-ae8b-83cd545c3a36.selectorLabels" . | nindent 4 }}
