apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo12433466-41c0-48b3-ae86-3db7b21cffca.fullname" . }}
  labels:
    {{- include "go-echo12433466-41c0-48b3-ae86-3db7b21cffca.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo12433466-41c0-48b3-ae86-3db7b21cffca.selectorLabels" . | nindent 6 }}
