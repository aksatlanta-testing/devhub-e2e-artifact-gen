apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9be83b5d-03d6-4850-afd1-81ed4ea9fa20.fullname" . }}
  labels:
    {{- include "go-echo9be83b5d-03d6-4850-afd1-81ed4ea9fa20.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9be83b5d-03d6-4850-afd1-81ed4ea9fa20.selectorLabels" . | nindent 6 }}
