apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5ec79e76-ec27-4c7c-a314-7ef2eb7fdfe4.fullname" . }}
  labels:
    {{- include "go-echo5ec79e76-ec27-4c7c-a314-7ef2eb7fdfe4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5ec79e76-ec27-4c7c-a314-7ef2eb7fdfe4.selectorLabels" . | nindent 6 }}
