apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo83af0db8-480d-4a84-8456-11927bcda350.fullname" . }}
  labels:
    {{- include "go-echo83af0db8-480d-4a84-8456-11927bcda350.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo83af0db8-480d-4a84-8456-11927bcda350.selectorLabels" . | nindent 6 }}
