apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2f4ddef8-49da-4236-bd81-2b90f69d139b.fullname" . }}
  labels:
    {{- include "go-echo2f4ddef8-49da-4236-bd81-2b90f69d139b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2f4ddef8-49da-4236-bd81-2b90f69d139b.selectorLabels" . | nindent 6 }}
