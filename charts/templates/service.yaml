apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe90dfb2e-8ea5-40e8-ba70-570f48c08a18.fullname" . }}
  labels:
    {{- include "go-echoe90dfb2e-8ea5-40e8-ba70-570f48c08a18.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe90dfb2e-8ea5-40e8-ba70-570f48c08a18.selectorLabels" . | nindent 6 }}
