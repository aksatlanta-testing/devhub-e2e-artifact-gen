apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo00f035e6-0250-4b58-8311-de2c6830acd9.fullname" . }}
  labels:
    {{- include "go-echo00f035e6-0250-4b58-8311-de2c6830acd9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo00f035e6-0250-4b58-8311-de2c6830acd9.selectorLabels" . | nindent 6 }}
