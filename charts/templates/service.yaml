apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo17098fd5-8aef-4e27-b9b4-371fc71d2e9d.fullname" . }}
  labels:
    {{- include "go-echo17098fd5-8aef-4e27-b9b4-371fc71d2e9d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo17098fd5-8aef-4e27-b9b4-371fc71d2e9d.selectorLabels" . | nindent 6 }}
