apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9be97853-9df2-4046-a693-3dbdbab734d6.fullname" . }}
  labels:
    {{- include "go-echo9be97853-9df2-4046-a693-3dbdbab734d6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9be97853-9df2-4046-a693-3dbdbab734d6.selectorLabels" . | nindent 6 }}
