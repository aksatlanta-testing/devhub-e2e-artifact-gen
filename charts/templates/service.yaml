apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoffd0d97b-f9b9-4f12-bfb7-eea48ed8b073.fullname" . }}
  labels:
    {{- include "go-echoffd0d97b-f9b9-4f12-bfb7-eea48ed8b073.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoffd0d97b-f9b9-4f12-bfb7-eea48ed8b073.selectorLabels" . | nindent 6 }}
