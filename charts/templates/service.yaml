apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod067a754-935d-474e-8a10-2d4b074954f5.fullname" . }}
  labels:
    {{- include "go-echod067a754-935d-474e-8a10-2d4b074954f5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod067a754-935d-474e-8a10-2d4b074954f5.selectorLabels" . | nindent 6 }}
