apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc6fb1eff-6d8e-4bb3-90db-ca279d66be6a.fullname" . }}
  labels:
    {{- include "go-echoc6fb1eff-6d8e-4bb3-90db-ca279d66be6a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc6fb1eff-6d8e-4bb3-90db-ca279d66be6a.selectorLabels" . | nindent 6 }}
