apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6bda109e-81ba-4bbd-b7bc-399f4ec4fc32.fullname" . }}
  labels:
    {{- include "go-echo6bda109e-81ba-4bbd-b7bc-399f4ec4fc32.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6bda109e-81ba-4bbd-b7bc-399f4ec4fc32.selectorLabels" . | nindent 6 }}
