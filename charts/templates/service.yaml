apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9f2de87e-615d-479d-92b5-97f8a8948256.fullname" . }}
  labels:
    {{- include "go-echo9f2de87e-615d-479d-92b5-97f8a8948256.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
