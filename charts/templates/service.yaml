apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoef05491d-79c5-4ebd-829b-192535764e5b.fullname" . }}
  labels:
    {{- include "go-echoef05491d-79c5-4ebd-829b-192535764e5b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoef05491d-79c5-4ebd-829b-192535764e5b.selectorLabels" . | nindent 6 }}
