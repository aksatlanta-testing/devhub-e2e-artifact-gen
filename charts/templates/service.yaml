apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo15a4eccf-9fe9-4c14-8f67-aae96d6d8ea4.fullname" . }}
  labels:
    {{- include "go-echo15a4eccf-9fe9-4c14-8f67-aae96d6d8ea4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo15a4eccf-9fe9-4c14-8f67-aae96d6d8ea4.selectorLabels" . | nindent 6 }}
