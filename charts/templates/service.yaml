apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3a4dcca4-c118-4a38-95aa-9aea9308a617.fullname" . }}
  labels:
    {{- include "go-echo3a4dcca4-c118-4a38-95aa-9aea9308a617.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3a4dcca4-c118-4a38-95aa-9aea9308a617.selectorLabels" . | nindent 6 }}
