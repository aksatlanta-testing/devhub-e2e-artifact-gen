apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo559a5a5e-db5f-405e-86da-7fc70d74cb15.fullname" . }}
  labels:
    {{- include "go-echo559a5a5e-db5f-405e-86da-7fc70d74cb15.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo559a5a5e-db5f-405e-86da-7fc70d74cb15.selectorLabels" . | nindent 6 }}
