apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3e7a44fc-1562-4e6a-a521-51bbc588b62d.fullname" . }}
  labels:
    {{- include "go-echo3e7a44fc-1562-4e6a-a521-51bbc588b62d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3e7a44fc-1562-4e6a-a521-51bbc588b62d.selectorLabels" . | nindent 6 }}
