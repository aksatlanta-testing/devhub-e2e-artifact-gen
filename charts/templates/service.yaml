apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo515a24b0-5749-4e81-8a3b-5b6170c05759.fullname" . }}
  labels:
    {{- include "go-echo515a24b0-5749-4e81-8a3b-5b6170c05759.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo515a24b0-5749-4e81-8a3b-5b6170c05759.selectorLabels" . | nindent 6 }}
