apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoca99402c-9aa7-4eb6-8429-d1efca8f3007.fullname" . }}
  labels:
    {{- include "go-echoca99402c-9aa7-4eb6-8429-d1efca8f3007.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoca99402c-9aa7-4eb6-8429-d1efca8f3007.selectorLabels" . | nindent 6 }}
