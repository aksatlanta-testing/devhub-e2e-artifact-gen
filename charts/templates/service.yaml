apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8aee401e-16a5-4f07-8656-4ce23de4a77e.fullname" . }}
  labels:
    {{- include "go-echo8aee401e-16a5-4f07-8656-4ce23de4a77e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8aee401e-16a5-4f07-8656-4ce23de4a77e.selectorLabels" . | nindent 6 }}
