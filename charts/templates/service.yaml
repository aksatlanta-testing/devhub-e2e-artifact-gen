apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8dbe4548-3260-4804-9257-25bac8bc5a33.fullname" . }}
  labels:
    {{- include "go-echo8dbe4548-3260-4804-9257-25bac8bc5a33.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8dbe4548-3260-4804-9257-25bac8bc5a33.selectorLabels" . | nindent 6 }}
