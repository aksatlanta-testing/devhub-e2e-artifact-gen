apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo44bf5a3c-d6ba-4968-bdfc-b7a3143135db.fullname" . }}
  labels:
    {{- include "go-echo44bf5a3c-d6ba-4968-bdfc-b7a3143135db.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo44bf5a3c-d6ba-4968-bdfc-b7a3143135db.selectorLabels" . | nindent 6 }}
