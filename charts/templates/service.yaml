apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoff5b0749-8cb8-4784-b3c6-8fd08563846b.fullname" . }}
  labels:
    {{- include "go-echoff5b0749-8cb8-4784-b3c6-8fd08563846b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoff5b0749-8cb8-4784-b3c6-8fd08563846b.selectorLabels" . | nindent 6 }}
