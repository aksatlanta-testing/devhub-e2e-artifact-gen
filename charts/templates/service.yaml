apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3e67be45-0de8-4c25-98fc-13ce250cfcc4.fullname" . }}
  labels:
    {{- include "go-echo3e67be45-0de8-4c25-98fc-13ce250cfcc4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3e67be45-0de8-4c25-98fc-13ce250cfcc4.selectorLabels" . | nindent 6 }}
