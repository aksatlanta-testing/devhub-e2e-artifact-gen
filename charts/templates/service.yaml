apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc30f0803-0237-448c-9457-6f0c7d70e83b.fullname" . }}
  labels:
    {{- include "go-echoc30f0803-0237-448c-9457-6f0c7d70e83b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc30f0803-0237-448c-9457-6f0c7d70e83b.selectorLabels" . | nindent 6 }}
