apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa72b1c28-a729-4c9a-8161-cacd41537cfe.fullname" . }}
  labels:
    {{- include "go-echoa72b1c28-a729-4c9a-8161-cacd41537cfe.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa72b1c28-a729-4c9a-8161-cacd41537cfe.selectorLabels" . | nindent 6 }}
