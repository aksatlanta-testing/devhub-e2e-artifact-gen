apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8740217f-d929-48bc-b7e3-2d46eb11c9b3.fullname" . }}
  labels:
    {{- include "go-echo8740217f-d929-48bc-b7e3-2d46eb11c9b3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8740217f-d929-48bc-b7e3-2d46eb11c9b3.selectorLabels" . | nindent 6 }}
