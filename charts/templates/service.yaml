apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo31e661b5-d6b1-4f61-b243-2f330a323a5c.fullname" . }}
  labels:
    {{- include "go-echo31e661b5-d6b1-4f61-b243-2f330a323a5c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo31e661b5-d6b1-4f61-b243-2f330a323a5c.selectorLabels" . | nindent 6 }}
