apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo65decd27-2943-452a-b76d-5f94a7fb1797.fullname" . }}
  labels:
    {{- include "go-echo65decd27-2943-452a-b76d-5f94a7fb1797.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo65decd27-2943-452a-b76d-5f94a7fb1797.selectorLabels" . | nindent 6 }}
