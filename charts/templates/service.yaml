apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8d53d0d8-cc84-444b-8ce3-8a72edafcd85.fullname" . }}
  labels:
    {{- include "go-echo8d53d0d8-cc84-444b-8ce3-8a72edafcd85.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8d53d0d8-cc84-444b-8ce3-8a72edafcd85.selectorLabels" . | nindent 6 }}
