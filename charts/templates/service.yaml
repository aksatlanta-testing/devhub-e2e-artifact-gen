apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4430c860-bd45-4e18-a60b-908df7cfce3a.fullname" . }}
  labels:
    {{- include "go-echo4430c860-bd45-4e18-a60b-908df7cfce3a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4430c860-bd45-4e18-a60b-908df7cfce3a.selectorLabels" . | nindent 6 }}
