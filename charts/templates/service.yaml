apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob4542fbe-fa2f-48c2-8202-73b6719af10e.fullname" . }}
  labels:
    {{- include "go-echob4542fbe-fa2f-48c2-8202-73b6719af10e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob4542fbe-fa2f-48c2-8202-73b6719af10e.selectorLabels" . | nindent 6 }}
