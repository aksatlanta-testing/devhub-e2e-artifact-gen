apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo594cce46-410c-4822-a0a5-19e596cd662c.fullname" . }}
  labels:
    {{- include "go-echo594cce46-410c-4822-a0a5-19e596cd662c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo594cce46-410c-4822-a0a5-19e596cd662c.selectorLabels" . | nindent 6 }}
