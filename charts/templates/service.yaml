apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8a869c97-fd3b-46b7-94b6-be9f5e361204.fullname" . }}
  labels:
    {{- include "go-echo8a869c97-fd3b-46b7-94b6-be9f5e361204.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8a869c97-fd3b-46b7-94b6-be9f5e361204.selectorLabels" . | nindent 6 }}
