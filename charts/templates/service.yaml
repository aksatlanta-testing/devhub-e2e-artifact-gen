apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9b4ebdef-23b5-4c95-8c28-05b0f213d07c.fullname" . }}
  labels:
    {{- include "go-echo9b4ebdef-23b5-4c95-8c28-05b0f213d07c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9b4ebdef-23b5-4c95-8c28-05b0f213d07c.selectorLabels" . | nindent 6 }}
