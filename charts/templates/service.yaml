apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0895c1df-1b4a-4ea8-84b5-d032545d6185.fullname" . }}
  labels:
    {{- include "go-echo0895c1df-1b4a-4ea8-84b5-d032545d6185.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0895c1df-1b4a-4ea8-84b5-d032545d6185.selectorLabels" . | nindent 6 }}
