apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9d879419-c4e2-4a11-b47c-d2c18553a5da.fullname" . }}
  labels:
    {{- include "go-echo9d879419-c4e2-4a11-b47c-d2c18553a5da.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9d879419-c4e2-4a11-b47c-d2c18553a5da.selectorLabels" . | nindent 6 }}
