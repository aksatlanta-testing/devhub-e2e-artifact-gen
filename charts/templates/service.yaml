apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6781a97c-f76b-412c-9160-72bd14a4a22d.fullname" . }}
  labels:
    {{- include "go-echo6781a97c-f76b-412c-9160-72bd14a4a22d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6781a97c-f76b-412c-9160-72bd14a4a22d.selectorLabels" . | nindent 6 }}
