apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3dbe38c7-96a0-4c6b-ba33-a54022d7406f.fullname" . }}
  labels:
    {{- include "go-echo3dbe38c7-96a0-4c6b-ba33-a54022d7406f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3dbe38c7-96a0-4c6b-ba33-a54022d7406f.selectorLabels" . | nindent 6 }}
