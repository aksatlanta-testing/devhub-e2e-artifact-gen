apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod18d218e-6a4e-4f08-b501-54fc9b062b89.fullname" . }}
  labels:
    {{- include "go-echod18d218e-6a4e-4f08-b501-54fc9b062b89.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod18d218e-6a4e-4f08-b501-54fc9b062b89.selectorLabels" . | nindent 6 }}
