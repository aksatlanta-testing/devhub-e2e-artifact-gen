apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1ada6da4-2e14-486b-ace2-247b45e6b622.fullname" . }}
  labels:
    {{- include "go-echo1ada6da4-2e14-486b-ace2-247b45e6b622.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1ada6da4-2e14-486b-ace2-247b45e6b622.selectorLabels" . | nindent 6 }}
