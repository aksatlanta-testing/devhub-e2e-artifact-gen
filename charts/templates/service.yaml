apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0db723ff-75ff-4d59-8f98-493cbc080b49.fullname" . }}
  labels:
    {{- include "go-echo0db723ff-75ff-4d59-8f98-493cbc080b49.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0db723ff-75ff-4d59-8f98-493cbc080b49.selectorLabels" . | nindent 6 }}
