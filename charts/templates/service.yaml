apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo167c0ec4-b75d-4bf3-90a4-0d904007fe5a.fullname" . }}
  labels:
    {{- include "go-echo167c0ec4-b75d-4bf3-90a4-0d904007fe5a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo167c0ec4-b75d-4bf3-90a4-0d904007fe5a.selectorLabels" . | nindent 6 }}
