apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe25ded7a-9884-4423-8c99-1cc19ae9c134.fullname" . }}
  labels:
    {{- include "go-echoe25ded7a-9884-4423-8c99-1cc19ae9c134.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe25ded7a-9884-4423-8c99-1cc19ae9c134.selectorLabels" . | nindent 6 }}
