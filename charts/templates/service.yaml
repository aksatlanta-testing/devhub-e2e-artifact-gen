apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo43c7ea87-3877-4744-a886-07e895c17f1a.fullname" . }}
  labels:
    {{- include "go-echo43c7ea87-3877-4744-a886-07e895c17f1a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo43c7ea87-3877-4744-a886-07e895c17f1a.selectorLabels" . | nindent 6 }}
