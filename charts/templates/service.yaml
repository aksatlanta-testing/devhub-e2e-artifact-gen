apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6074ca1a-8f9c-4d1f-bd33-3a3470667c6e.fullname" . }}
  labels:
    {{- include "go-echo6074ca1a-8f9c-4d1f-bd33-3a3470667c6e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6074ca1a-8f9c-4d1f-bd33-3a3470667c6e.selectorLabels" . | nindent 6 }}
