apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4a8325e8-d33c-435f-936d-67fde881a106.fullname" . }}
  labels:
    {{- include "go-echo4a8325e8-d33c-435f-936d-67fde881a106.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4a8325e8-d33c-435f-936d-67fde881a106.selectorLabels" . | nindent 6 }}
