apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo88d9b7e6-1007-4816-84f2-4a6b4232a9ce.fullname" . }}
  labels:
    {{- include "go-echo88d9b7e6-1007-4816-84f2-4a6b4232a9ce.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo88d9b7e6-1007-4816-84f2-4a6b4232a9ce.selectorLabels" . | nindent 6 }}
