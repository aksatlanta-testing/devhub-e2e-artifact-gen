apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe94207d6-9fbf-4481-933a-e3e9406cf755.fullname" . }}
  labels:
    {{- include "go-echoe94207d6-9fbf-4481-933a-e3e9406cf755.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe94207d6-9fbf-4481-933a-e3e9406cf755.selectorLabels" . | nindent 6 }}
