apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4db15cbf-d174-4326-a3de-3d955527382a.fullname" . }}
  labels:
    {{- include "go-echo4db15cbf-d174-4326-a3de-3d955527382a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4db15cbf-d174-4326-a3de-3d955527382a.selectorLabels" . | nindent 6 }}
