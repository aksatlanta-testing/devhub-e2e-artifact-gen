apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6459ea38-c2f7-4287-81f9-a4e09a9c5284.fullname" . }}
  labels:
    {{- include "go-echo6459ea38-c2f7-4287-81f9-a4e09a9c5284.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6459ea38-c2f7-4287-81f9-a4e09a9c5284.selectorLabels" . | nindent 6 }}
