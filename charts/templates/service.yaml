apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo72cfda59-3d85-4a8b-9ce5-b84c0d3ec770.fullname" . }}
  labels:
    {{- include "go-echo72cfda59-3d85-4a8b-9ce5-b84c0d3ec770.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo72cfda59-3d85-4a8b-9ce5-b84c0d3ec770.selectorLabels" . | nindent 6 }}
