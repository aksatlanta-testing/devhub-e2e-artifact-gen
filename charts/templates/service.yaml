apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe216e80b-767d-4db9-ab46-36ce960c7126.fullname" . }}
  labels:
    {{- include "go-echoe216e80b-767d-4db9-ab46-36ce960c7126.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe216e80b-767d-4db9-ab46-36ce960c7126.selectorLabels" . | nindent 6 }}
