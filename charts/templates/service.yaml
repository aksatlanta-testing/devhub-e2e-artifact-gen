apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7acbf9a1-6e33-4e3c-907e-bb4a69bff546.fullname" . }}
  labels:
    {{- include "go-echo7acbf9a1-6e33-4e3c-907e-bb4a69bff546.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7acbf9a1-6e33-4e3c-907e-bb4a69bff546.selectorLabels" . | nindent 6 }}
