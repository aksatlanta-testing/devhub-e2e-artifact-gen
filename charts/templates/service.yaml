apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod2d95e1a-abf4-474a-bb44-f840b620651a.fullname" . }}
  labels:
    {{- include "go-echod2d95e1a-abf4-474a-bb44-f840b620651a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod2d95e1a-abf4-474a-bb44-f840b620651a.selectorLabels" . | nindent 6 }}
