apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoda2de93a-0807-4b48-a364-7306ab4df7b8.fullname" . }}
  labels:
    {{- include "go-echoda2de93a-0807-4b48-a364-7306ab4df7b8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoda2de93a-0807-4b48-a364-7306ab4df7b8.selectorLabels" . | nindent 6 }}
