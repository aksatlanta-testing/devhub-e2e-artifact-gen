apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo145fa8be-a0fb-49ca-b469-8ec056283b45.fullname" . }}
  labels:
    {{- include "go-echo145fa8be-a0fb-49ca-b469-8ec056283b45.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo145fa8be-a0fb-49ca-b469-8ec056283b45.selectorLabels" . | nindent 6 }}
