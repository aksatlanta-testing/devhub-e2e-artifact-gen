apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod3ed54a4-fcbf-4707-bdc4-0a4b08a48a78.fullname" . }}
  labels:
    {{- include "go-echod3ed54a4-fcbf-4707-bdc4-0a4b08a48a78.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod3ed54a4-fcbf-4707-bdc4-0a4b08a48a78.selectorLabels" . | nindent 6 }}
