apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0ae258f2-032e-4c80-a907-0f5222372461.fullname" . }}
  labels:
    {{- include "go-echo0ae258f2-032e-4c80-a907-0f5222372461.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0ae258f2-032e-4c80-a907-0f5222372461.selectorLabels" . | nindent 6 }}
