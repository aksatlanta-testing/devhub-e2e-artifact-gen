apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5d4ecac6-e991-412f-867f-f8799c8c6f0f.fullname" . }}
  labels:
    {{- include "go-echo5d4ecac6-e991-412f-867f-f8799c8c6f0f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5d4ecac6-e991-412f-867f-f8799c8c6f0f.selectorLabels" . | nindent 6 }}
