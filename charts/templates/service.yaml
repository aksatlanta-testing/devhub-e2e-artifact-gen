apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofc6bf6e0-5865-4515-a0f2-fb6c55de6cdf.fullname" . }}
  labels:
    {{- include "go-echofc6bf6e0-5865-4515-a0f2-fb6c55de6cdf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofc6bf6e0-5865-4515-a0f2-fb6c55de6cdf.selectorLabels" . | nindent 6 }}
