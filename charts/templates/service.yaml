apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo14122ccd-9133-4d69-b387-e877576f9fff.fullname" . }}
  labels:
    {{- include "go-echo14122ccd-9133-4d69-b387-e877576f9fff.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo14122ccd-9133-4d69-b387-e877576f9fff.selectorLabels" . | nindent 6 }}
