apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo55f5b130-63bf-4735-8325-35252549b10a.fullname" . }}
  labels:
    {{- include "go-echo55f5b130-63bf-4735-8325-35252549b10a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo55f5b130-63bf-4735-8325-35252549b10a.selectorLabels" . | nindent 6 }}
