apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo175c2e7e-a64c-4d90-be5d-2a891e724046.fullname" . }}
  labels:
    {{- include "go-echo175c2e7e-a64c-4d90-be5d-2a891e724046.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo175c2e7e-a64c-4d90-be5d-2a891e724046.selectorLabels" . | nindent 6 }}
