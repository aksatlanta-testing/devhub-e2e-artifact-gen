apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod48088c7-9200-4387-9807-061e89c8fe53.fullname" . }}
  labels:
    {{- include "go-echod48088c7-9200-4387-9807-061e89c8fe53.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod48088c7-9200-4387-9807-061e89c8fe53.selectorLabels" . | nindent 6 }}
