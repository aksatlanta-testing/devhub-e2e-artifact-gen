apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob3b171b4-67dc-4688-a69f-0a67ba5e3a64.fullname" . }}
  labels:
    {{- include "go-echob3b171b4-67dc-4688-a69f-0a67ba5e3a64.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob3b171b4-67dc-4688-a69f-0a67ba5e3a64.selectorLabels" . | nindent 6 }}
