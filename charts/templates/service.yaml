apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1b1d98c6-e11d-47ea-acf3-04c9fa37767a.fullname" . }}
  labels:
    {{- include "go-echo1b1d98c6-e11d-47ea-acf3-04c9fa37767a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1b1d98c6-e11d-47ea-acf3-04c9fa37767a.selectorLabels" . | nindent 6 }}
