apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoccefa651-98a5-427a-9dff-588691d7d2fd.fullname" . }}
  labels:
    {{- include "go-echoccefa651-98a5-427a-9dff-588691d7d2fd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoccefa651-98a5-427a-9dff-588691d7d2fd.selectorLabels" . | nindent 6 }}
