apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4982fca8-38c6-4156-ab1c-d65307753ea6.fullname" . }}
  labels:
    {{- include "go-echo4982fca8-38c6-4156-ab1c-d65307753ea6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4982fca8-38c6-4156-ab1c-d65307753ea6.selectorLabels" . | nindent 6 }}
