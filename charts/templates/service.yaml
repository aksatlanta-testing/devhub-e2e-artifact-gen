apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo23348bf5-6878-42a3-8b32-00049a6b7a95.fullname" . }}
  labels:
    {{- include "go-echo23348bf5-6878-42a3-8b32-00049a6b7a95.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo23348bf5-6878-42a3-8b32-00049a6b7a95.selectorLabels" . | nindent 6 }}
