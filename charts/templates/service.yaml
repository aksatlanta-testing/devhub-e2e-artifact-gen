apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5545444d-decd-46e8-9618-31496677aa2b.fullname" . }}
  labels:
    {{- include "go-echo5545444d-decd-46e8-9618-31496677aa2b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5545444d-decd-46e8-9618-31496677aa2b.selectorLabels" . | nindent 6 }}
