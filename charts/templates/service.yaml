apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo27c96be9-89ed-482d-a539-8e387531b2a7.fullname" . }}
  labels:
    {{- include "go-echo27c96be9-89ed-482d-a539-8e387531b2a7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo27c96be9-89ed-482d-a539-8e387531b2a7.selectorLabels" . | nindent 6 }}
