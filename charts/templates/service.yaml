apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5a32b987-4c62-4251-96ea-48c851b98dae.fullname" . }}
  labels:
    {{- include "go-echo5a32b987-4c62-4251-96ea-48c851b98dae.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5a32b987-4c62-4251-96ea-48c851b98dae.selectorLabels" . | nindent 6 }}
