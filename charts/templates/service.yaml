apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3173f231-2382-4b5b-86d1-2458ca631c5b.fullname" . }}
  labels:
    {{- include "go-echo3173f231-2382-4b5b-86d1-2458ca631c5b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3173f231-2382-4b5b-86d1-2458ca631c5b.selectorLabels" . | nindent 6 }}
