apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo12e49853-e9a1-49a0-82a4-c272a3b41523.fullname" . }}
  labels:
    {{- include "go-echo12e49853-e9a1-49a0-82a4-c272a3b41523.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo12e49853-e9a1-49a0-82a4-c272a3b41523.selectorLabels" . | nindent 6 }}
