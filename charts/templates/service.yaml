apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod713284c-7760-41b6-8dfc-50a36d21b759.fullname" . }}
  labels:
    {{- include "go-echod713284c-7760-41b6-8dfc-50a36d21b759.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod713284c-7760-41b6-8dfc-50a36d21b759.selectorLabels" . | nindent 6 }}
