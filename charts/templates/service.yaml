apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe867eefe-3df9-4874-a46a-a8f107caf79f.fullname" . }}
  labels:
    {{- include "go-echoe867eefe-3df9-4874-a46a-a8f107caf79f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe867eefe-3df9-4874-a46a-a8f107caf79f.selectorLabels" . | nindent 6 }}
