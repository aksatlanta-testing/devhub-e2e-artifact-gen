apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo55f5dbf8-9ba6-4ae3-9938-1b518113cdaa.fullname" . }}
  labels:
    {{- include "go-echo55f5dbf8-9ba6-4ae3-9938-1b518113cdaa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo55f5dbf8-9ba6-4ae3-9938-1b518113cdaa.selectorLabels" . | nindent 6 }}
