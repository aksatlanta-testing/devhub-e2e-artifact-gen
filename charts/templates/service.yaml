apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo70185700-a5c8-4d10-ba2b-d0886bb2d777.fullname" . }}
  labels:
    {{- include "go-echo70185700-a5c8-4d10-ba2b-d0886bb2d777.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo70185700-a5c8-4d10-ba2b-d0886bb2d777.selectorLabels" . | nindent 6 }}
