apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9a49964e-62e0-40a3-a356-0068782a2d8a.fullname" . }}
  labels:
    {{- include "go-echo9a49964e-62e0-40a3-a356-0068782a2d8a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9a49964e-62e0-40a3-a356-0068782a2d8a.selectorLabels" . | nindent 6 }}
