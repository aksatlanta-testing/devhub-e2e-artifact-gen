apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0da6a572-b251-4468-a67d-c1e80a1696c9.fullname" . }}
  labels:
    {{- include "go-echo0da6a572-b251-4468-a67d-c1e80a1696c9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0da6a572-b251-4468-a67d-c1e80a1696c9.selectorLabels" . | nindent 6 }}
