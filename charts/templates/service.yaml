apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo95cb74d5-31cc-46f8-9f31-21a7b129d44e.fullname" . }}
  labels:
    {{- include "go-echo95cb74d5-31cc-46f8-9f31-21a7b129d44e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo95cb74d5-31cc-46f8-9f31-21a7b129d44e.selectorLabels" . | nindent 6 }}
