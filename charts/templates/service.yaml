apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo69a8a2db-c17d-4bdd-bbe1-cde8a2ba9b6c.fullname" . }}
  labels:
    {{- include "go-echo69a8a2db-c17d-4bdd-bbe1-cde8a2ba9b6c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo69a8a2db-c17d-4bdd-bbe1-cde8a2ba9b6c.selectorLabels" . | nindent 6 }}
