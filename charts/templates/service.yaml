apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod259d345-2944-4163-b2ff-44d720c1b887.fullname" . }}
  labels:
    {{- include "go-echod259d345-2944-4163-b2ff-44d720c1b887.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod259d345-2944-4163-b2ff-44d720c1b887.selectorLabels" . | nindent 6 }}
