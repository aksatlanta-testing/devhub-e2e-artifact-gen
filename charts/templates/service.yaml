apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo300061a6-9bbc-439e-aba9-e4a3615dfb6a.fullname" . }}
  labels:
    {{- include "go-echo300061a6-9bbc-439e-aba9-e4a3615dfb6a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo300061a6-9bbc-439e-aba9-e4a3615dfb6a.selectorLabels" . | nindent 6 }}
