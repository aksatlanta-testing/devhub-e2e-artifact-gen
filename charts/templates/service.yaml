apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6f8ab5e6-1192-40d8-93f7-2ebe70efbb68.fullname" . }}
  labels:
    {{- include "go-echo6f8ab5e6-1192-40d8-93f7-2ebe70efbb68.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6f8ab5e6-1192-40d8-93f7-2ebe70efbb68.selectorLabels" . | nindent 6 }}
