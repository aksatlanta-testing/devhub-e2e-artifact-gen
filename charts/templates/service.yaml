apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo250b4e51-0e7d-4f01-95de-c794eefb8002.fullname" . }}
  labels:
    {{- include "go-echo250b4e51-0e7d-4f01-95de-c794eefb8002.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo250b4e51-0e7d-4f01-95de-c794eefb8002.selectorLabels" . | nindent 6 }}
