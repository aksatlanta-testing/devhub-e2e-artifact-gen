apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe0ae9bef-2149-4b8c-afd8-7deff0644dae.fullname" . }}
  labels:
    {{- include "go-echoe0ae9bef-2149-4b8c-afd8-7deff0644dae.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe0ae9bef-2149-4b8c-afd8-7deff0644dae.selectorLabels" . | nindent 6 }}
