apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9f18e040-7dd7-4be5-8cea-9d1662362c58.fullname" . }}
  labels:
    {{- include "go-echo9f18e040-7dd7-4be5-8cea-9d1662362c58.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9f18e040-7dd7-4be5-8cea-9d1662362c58.selectorLabels" . | nindent 6 }}
