apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoacc59e72-f942-486a-984d-37ed1d1d603e.fullname" . }}
  labels:
    {{- include "go-echoacc59e72-f942-486a-984d-37ed1d1d603e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoacc59e72-f942-486a-984d-37ed1d1d603e.selectorLabels" . | nindent 6 }}
