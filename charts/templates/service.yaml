apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo681bbcdd-9d63-4a38-8b45-4b7853546148.fullname" . }}
  labels:
    {{- include "go-echo681bbcdd-9d63-4a38-8b45-4b7853546148.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo681bbcdd-9d63-4a38-8b45-4b7853546148.selectorLabels" . | nindent 6 }}
