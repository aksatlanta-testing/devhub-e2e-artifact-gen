apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2076e6f5-198c-4203-81a1-6973f8c32342.fullname" . }}
  labels:
    {{- include "go-echo2076e6f5-198c-4203-81a1-6973f8c32342.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2076e6f5-198c-4203-81a1-6973f8c32342.selectorLabels" . | nindent 6 }}
