apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo779af6d4-768b-4497-836d-1bd4bd1fd8ca.fullname" . }}
  labels:
    {{- include "go-echo779af6d4-768b-4497-836d-1bd4bd1fd8ca.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo779af6d4-768b-4497-836d-1bd4bd1fd8ca.selectorLabels" . | nindent 6 }}
