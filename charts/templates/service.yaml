apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8454d838-c1cc-447e-b63a-6e594b01f43f.fullname" . }}
  labels:
    {{- include "go-echo8454d838-c1cc-447e-b63a-6e594b01f43f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8454d838-c1cc-447e-b63a-6e594b01f43f.selectorLabels" . | nindent 6 }}
