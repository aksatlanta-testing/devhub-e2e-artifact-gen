apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7621e577-5540-453a-82e7-a66ae1a0fd18.fullname" . }}
  labels:
    {{- include "go-echo7621e577-5540-453a-82e7-a66ae1a0fd18.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7621e577-5540-453a-82e7-a66ae1a0fd18.selectorLabels" . | nindent 6 }}
