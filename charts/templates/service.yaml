apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5ae33c1a-0654-4a50-abf3-8dffffa49b2d.fullname" . }}
  labels:
    {{- include "go-echo5ae33c1a-0654-4a50-abf3-8dffffa49b2d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5ae33c1a-0654-4a50-abf3-8dffffa49b2d.selectorLabels" . | nindent 6 }}
