apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof7b0f79a-3322-4477-9593-71c8791814e7.fullname" . }}
  labels:
    {{- include "go-echof7b0f79a-3322-4477-9593-71c8791814e7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof7b0f79a-3322-4477-9593-71c8791814e7.selectorLabels" . | nindent 6 }}
