apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobffe05e2-715d-4393-a5a7-56efa3bf8cc5.fullname" . }}
  labels:
    {{- include "go-echobffe05e2-715d-4393-a5a7-56efa3bf8cc5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobffe05e2-715d-4393-a5a7-56efa3bf8cc5.selectorLabels" . | nindent 6 }}
