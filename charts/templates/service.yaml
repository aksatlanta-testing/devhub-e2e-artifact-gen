apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe5ce28fc-3b11-420e-8675-b4272aca9955.fullname" . }}
  labels:
    {{- include "go-echoe5ce28fc-3b11-420e-8675-b4272aca9955.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe5ce28fc-3b11-420e-8675-b4272aca9955.selectorLabels" . | nindent 6 }}
