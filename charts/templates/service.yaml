apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo826faa78-2410-4e57-9865-bc3eee7f8b28.fullname" . }}
  labels:
    {{- include "go-echo826faa78-2410-4e57-9865-bc3eee7f8b28.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo826faa78-2410-4e57-9865-bc3eee7f8b28.selectorLabels" . | nindent 6 }}
