apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7e7b8e24-9f58-4932-8476-a9c91a081e88.fullname" . }}
  labels:
    {{- include "go-echo7e7b8e24-9f58-4932-8476-a9c91a081e88.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7e7b8e24-9f58-4932-8476-a9c91a081e88.selectorLabels" . | nindent 6 }}
