apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo96917fe3-23fb-41e3-9323-c17b4ac4ea3c.fullname" . }}
  labels:
    {{- include "go-echo96917fe3-23fb-41e3-9323-c17b4ac4ea3c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo96917fe3-23fb-41e3-9323-c17b4ac4ea3c.selectorLabels" . | nindent 6 }}
