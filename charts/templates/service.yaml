apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo41180fb7-680b-4751-849a-93b6331a224c.fullname" . }}
  labels:
    {{- include "go-echo41180fb7-680b-4751-849a-93b6331a224c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo41180fb7-680b-4751-849a-93b6331a224c.selectorLabels" . | nindent 6 }}
