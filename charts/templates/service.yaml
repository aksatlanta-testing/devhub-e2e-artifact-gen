apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo72f3ab7c-28eb-45fc-9002-0ff29566d127.fullname" . }}
  labels:
    {{- include "go-echo72f3ab7c-28eb-45fc-9002-0ff29566d127.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo72f3ab7c-28eb-45fc-9002-0ff29566d127.selectorLabels" . | nindent 6 }}
