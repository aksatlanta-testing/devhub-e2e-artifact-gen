apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo279afe84-a84c-405f-b55f-a5d532b834b4.fullname" . }}
  labels:
    {{- include "go-echo279afe84-a84c-405f-b55f-a5d532b834b4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo279afe84-a84c-405f-b55f-a5d532b834b4.selectorLabels" . | nindent 6 }}
