apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo45e58f7e-fd9f-4753-a3fd-92f1b81b9b70.fullname" . }}
  labels:
    {{- include "go-echo45e58f7e-fd9f-4753-a3fd-92f1b81b9b70.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo45e58f7e-fd9f-4753-a3fd-92f1b81b9b70.selectorLabels" . | nindent 6 }}
