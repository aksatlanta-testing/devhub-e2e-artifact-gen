apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8d0256dd-b826-4357-9e05-f05394ee2603.fullname" . }}
  labels:
    {{- include "go-echo8d0256dd-b826-4357-9e05-f05394ee2603.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8d0256dd-b826-4357-9e05-f05394ee2603.selectorLabels" . | nindent 6 }}
