apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6268c4f4-5497-44a0-9ba7-6d2337d89b78.fullname" . }}
  labels:
    {{- include "go-echo6268c4f4-5497-44a0-9ba7-6d2337d89b78.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6268c4f4-5497-44a0-9ba7-6d2337d89b78.selectorLabels" . | nindent 6 }}
