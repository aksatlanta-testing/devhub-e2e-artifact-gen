apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3368ee32-1990-4cc1-bc6e-ab6647c7afac.fullname" . }}
  labels:
    {{- include "go-echo3368ee32-1990-4cc1-bc6e-ab6647c7afac.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3368ee32-1990-4cc1-bc6e-ab6647c7afac.selectorLabels" . | nindent 6 }}
