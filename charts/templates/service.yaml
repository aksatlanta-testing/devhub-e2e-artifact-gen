apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo60b9b396-eb25-402e-935f-c7c2b372cc84.fullname" . }}
  labels:
    {{- include "go-echo60b9b396-eb25-402e-935f-c7c2b372cc84.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo60b9b396-eb25-402e-935f-c7c2b372cc84.selectorLabels" . | nindent 6 }}
