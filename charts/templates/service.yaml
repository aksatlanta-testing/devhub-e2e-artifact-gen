apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3893289a-61a7-41a7-8832-6267f4e7b94c.fullname" . }}
  labels:
    {{- include "go-echo3893289a-61a7-41a7-8832-6267f4e7b94c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3893289a-61a7-41a7-8832-6267f4e7b94c.selectorLabels" . | nindent 6 }}
