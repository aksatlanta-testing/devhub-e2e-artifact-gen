apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofbf73c05-2dca-4787-89fa-896a594d662c.fullname" . }}
  labels:
    {{- include "go-echofbf73c05-2dca-4787-89fa-896a594d662c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofbf73c05-2dca-4787-89fa-896a594d662c.selectorLabels" . | nindent 6 }}
