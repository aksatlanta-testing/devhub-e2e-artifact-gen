apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo28395153-7590-4a62-90da-04c463f7e31b.fullname" . }}
  labels:
    {{- include "go-echo28395153-7590-4a62-90da-04c463f7e31b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo28395153-7590-4a62-90da-04c463f7e31b.selectorLabels" . | nindent 6 }}
