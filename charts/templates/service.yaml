apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3017022f-af43-47e9-a5f3-99de4bbb131a.fullname" . }}
  labels:
    {{- include "go-echo3017022f-af43-47e9-a5f3-99de4bbb131a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3017022f-af43-47e9-a5f3-99de4bbb131a.selectorLabels" . | nindent 6 }}
