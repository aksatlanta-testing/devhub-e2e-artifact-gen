apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa6b22e31-4a02-477f-87cc-e5f054eebb48.fullname" . }}
  labels:
    {{- include "go-echoa6b22e31-4a02-477f-87cc-e5f054eebb48.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa6b22e31-4a02-477f-87cc-e5f054eebb48.selectorLabels" . | nindent 6 }}
