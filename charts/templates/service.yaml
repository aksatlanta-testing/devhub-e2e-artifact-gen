apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodaffd139-687e-4547-b523-cce4a37a82cc.fullname" . }}
  labels:
    {{- include "go-echodaffd139-687e-4547-b523-cce4a37a82cc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodaffd139-687e-4547-b523-cce4a37a82cc.selectorLabels" . | nindent 6 }}
