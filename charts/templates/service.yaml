apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9c4f5e8a-5c9e-4203-aa62-87657f00e56b.fullname" . }}
  labels:
    {{- include "go-echo9c4f5e8a-5c9e-4203-aa62-87657f00e56b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9c4f5e8a-5c9e-4203-aa62-87657f00e56b.selectorLabels" . | nindent 6 }}
