apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3fa130d3-4b5f-46d5-b104-7fb7b24acc65.fullname" . }}
  labels:
    {{- include "go-echo3fa130d3-4b5f-46d5-b104-7fb7b24acc65.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3fa130d3-4b5f-46d5-b104-7fb7b24acc65.selectorLabels" . | nindent 6 }}
