apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod08832e6-5a64-4279-ac04-58086cfb5b7a.fullname" . }}
  labels:
    {{- include "go-echod08832e6-5a64-4279-ac04-58086cfb5b7a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod08832e6-5a64-4279-ac04-58086cfb5b7a.selectorLabels" . | nindent 6 }}
