apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2b483506-299f-4b4c-851d-9fa0284a1b58.fullname" . }}
  labels:
    {{- include "go-echo2b483506-299f-4b4c-851d-9fa0284a1b58.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2b483506-299f-4b4c-851d-9fa0284a1b58.selectorLabels" . | nindent 6 }}
