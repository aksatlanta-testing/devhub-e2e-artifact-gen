apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3cb3c717-2d32-43b1-bdc5-8a7b6201f2f3.fullname" . }}
  labels:
    {{- include "go-echo3cb3c717-2d32-43b1-bdc5-8a7b6201f2f3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3cb3c717-2d32-43b1-bdc5-8a7b6201f2f3.selectorLabels" . | nindent 6 }}
