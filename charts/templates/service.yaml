apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4c919fd1-7861-470b-b9ed-326c6a9c4f7f.fullname" . }}
  labels:
    {{- include "go-echo4c919fd1-7861-470b-b9ed-326c6a9c4f7f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4c919fd1-7861-470b-b9ed-326c6a9c4f7f.selectorLabels" . | nindent 6 }}
