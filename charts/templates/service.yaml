apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5ec91923-40a4-4ac0-8c59-204b134d4819.fullname" . }}
  labels:
    {{- include "go-echo5ec91923-40a4-4ac0-8c59-204b134d4819.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5ec91923-40a4-4ac0-8c59-204b134d4819.selectorLabels" . | nindent 6 }}
