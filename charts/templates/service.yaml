apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo39086209-2e24-4c4b-b157-ee820780145c.fullname" . }}
  labels:
    {{- include "go-echo39086209-2e24-4c4b-b157-ee820780145c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo39086209-2e24-4c4b-b157-ee820780145c.selectorLabels" . | nindent 6 }}
