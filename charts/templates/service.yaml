apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo48970959-6bc5-4f15-87fd-6c6a6a133136.fullname" . }}
  labels:
    {{- include "go-echo48970959-6bc5-4f15-87fd-6c6a6a133136.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo48970959-6bc5-4f15-87fd-6c6a6a133136.selectorLabels" . | nindent 6 }}
