apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo69436d14-e0b7-486a-b41e-53551a19cedb.fullname" . }}
  labels:
    {{- include "go-echo69436d14-e0b7-486a-b41e-53551a19cedb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo69436d14-e0b7-486a-b41e-53551a19cedb.selectorLabels" . | nindent 6 }}
