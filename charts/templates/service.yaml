apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobe86cde8-40c2-4bdc-9b62-f8b0b9817545.fullname" . }}
  labels:
    {{- include "go-echobe86cde8-40c2-4bdc-9b62-f8b0b9817545.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobe86cde8-40c2-4bdc-9b62-f8b0b9817545.selectorLabels" . | nindent 6 }}
