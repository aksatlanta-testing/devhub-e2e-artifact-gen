apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo83c13293-f13d-4264-b36c-bd5a48eb7cf8.fullname" . }}
  labels:
    {{- include "go-echo83c13293-f13d-4264-b36c-bd5a48eb7cf8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo83c13293-f13d-4264-b36c-bd5a48eb7cf8.selectorLabels" . | nindent 6 }}
