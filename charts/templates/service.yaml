apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe66f891b-c2fa-4880-881f-6b2d13628f5f.fullname" . }}
  labels:
    {{- include "go-echoe66f891b-c2fa-4880-881f-6b2d13628f5f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe66f891b-c2fa-4880-881f-6b2d13628f5f.selectorLabels" . | nindent 6 }}
