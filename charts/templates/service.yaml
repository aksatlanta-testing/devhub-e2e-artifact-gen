apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodf0cdf4a-e4ca-449d-8789-50be3190957e.fullname" . }}
  labels:
    {{- include "go-echodf0cdf4a-e4ca-449d-8789-50be3190957e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodf0cdf4a-e4ca-449d-8789-50be3190957e.selectorLabels" . | nindent 6 }}
