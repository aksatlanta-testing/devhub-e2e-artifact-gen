apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo59cda42d-1f60-493f-a839-d7f0a86ea62e.fullname" . }}
  labels:
    {{- include "go-echo59cda42d-1f60-493f-a839-d7f0a86ea62e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo59cda42d-1f60-493f-a839-d7f0a86ea62e.selectorLabels" . | nindent 6 }}
