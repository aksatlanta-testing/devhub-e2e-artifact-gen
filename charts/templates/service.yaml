apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof47f8675-ee88-4a1d-a350-a1573fb1afe1.fullname" . }}
  labels:
    {{- include "go-echof47f8675-ee88-4a1d-a350-a1573fb1afe1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof47f8675-ee88-4a1d-a350-a1573fb1afe1.selectorLabels" . | nindent 6 }}
