apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo09d757d3-355e-48ce-aa9a-f565fd14910f.fullname" . }}
  labels:
    {{- include "go-echo09d757d3-355e-48ce-aa9a-f565fd14910f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo09d757d3-355e-48ce-aa9a-f565fd14910f.selectorLabels" . | nindent 6 }}
