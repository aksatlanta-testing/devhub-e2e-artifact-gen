apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5e81ae96-90ba-455f-88fc-9cd5114f9fd4.fullname" . }}
  labels:
    {{- include "go-echo5e81ae96-90ba-455f-88fc-9cd5114f9fd4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5e81ae96-90ba-455f-88fc-9cd5114f9fd4.selectorLabels" . | nindent 6 }}
