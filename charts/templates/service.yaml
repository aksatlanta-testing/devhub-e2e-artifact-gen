apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofffba83e-a23c-42bd-b1ca-fba9563bd43d.fullname" . }}
  labels:
    {{- include "go-echofffba83e-a23c-42bd-b1ca-fba9563bd43d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofffba83e-a23c-42bd-b1ca-fba9563bd43d.selectorLabels" . | nindent 6 }}
