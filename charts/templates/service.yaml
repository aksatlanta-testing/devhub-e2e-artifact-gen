apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodc4cdfdc-430a-419d-b41c-9f76fb37091e.fullname" . }}
  labels:
    {{- include "go-echodc4cdfdc-430a-419d-b41c-9f76fb37091e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodc4cdfdc-430a-419d-b41c-9f76fb37091e.selectorLabels" . | nindent 6 }}
