apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe44d7a17-4edd-46a8-87e3-af888ee5fe79.fullname" . }}
  labels:
    {{- include "go-echoe44d7a17-4edd-46a8-87e3-af888ee5fe79.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe44d7a17-4edd-46a8-87e3-af888ee5fe79.selectorLabels" . | nindent 6 }}
