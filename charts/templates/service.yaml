apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo060e6173-b5a9-4f5c-9dfe-dfcd3f695902.fullname" . }}
  labels:
    {{- include "go-echo060e6173-b5a9-4f5c-9dfe-dfcd3f695902.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo060e6173-b5a9-4f5c-9dfe-dfcd3f695902.selectorLabels" . | nindent 6 }}
