apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc2a3f6c4-f5ef-4030-b7e2-d1f9c540b38c.fullname" . }}
  labels:
    {{- include "go-echoc2a3f6c4-f5ef-4030-b7e2-d1f9c540b38c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc2a3f6c4-f5ef-4030-b7e2-d1f9c540b38c.selectorLabels" . | nindent 6 }}
