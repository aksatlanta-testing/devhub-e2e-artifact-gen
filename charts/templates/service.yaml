apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo08be78b4-0941-4f03-b9fa-598d9ac2f0b5.fullname" . }}
  labels:
    {{- include "go-echo08be78b4-0941-4f03-b9fa-598d9ac2f0b5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo08be78b4-0941-4f03-b9fa-598d9ac2f0b5.selectorLabels" . | nindent 6 }}
