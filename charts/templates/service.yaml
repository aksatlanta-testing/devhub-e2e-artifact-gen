apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo586e2908-7a76-4339-8d14-ab776130bd8d.fullname" . }}
  labels:
    {{- include "go-echo586e2908-7a76-4339-8d14-ab776130bd8d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo586e2908-7a76-4339-8d14-ab776130bd8d.selectorLabels" . | nindent 6 }}
