apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof64dd42d-fc93-428d-80fe-bbaaf8b8e7a8.fullname" . }}
  labels:
    {{- include "go-echof64dd42d-fc93-428d-80fe-bbaaf8b8e7a8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof64dd42d-fc93-428d-80fe-bbaaf8b8e7a8.selectorLabels" . | nindent 6 }}
