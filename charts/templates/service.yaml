apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3bcc2670-6c1d-4ada-98eb-7412ee780e89.fullname" . }}
  labels:
    {{- include "go-echo3bcc2670-6c1d-4ada-98eb-7412ee780e89.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3bcc2670-6c1d-4ada-98eb-7412ee780e89.selectorLabels" . | nindent 6 }}
