apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod86ce3f4-9df1-46e9-b72a-7b9f80916127.fullname" . }}
  labels:
    {{- include "go-echod86ce3f4-9df1-46e9-b72a-7b9f80916127.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod86ce3f4-9df1-46e9-b72a-7b9f80916127.selectorLabels" . | nindent 6 }}
