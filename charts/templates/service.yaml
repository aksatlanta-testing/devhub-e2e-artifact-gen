apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod9a1c116-68da-447e-9451-81ef5fa13b55.fullname" . }}
  labels:
    {{- include "go-echod9a1c116-68da-447e-9451-81ef5fa13b55.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod9a1c116-68da-447e-9451-81ef5fa13b55.selectorLabels" . | nindent 6 }}
