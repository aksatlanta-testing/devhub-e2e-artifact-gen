apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo83c5f19a-ca5c-436f-863a-a001f7c9cf6e.fullname" . }}
  labels:
    {{- include "go-echo83c5f19a-ca5c-436f-863a-a001f7c9cf6e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo83c5f19a-ca5c-436f-863a-a001f7c9cf6e.selectorLabels" . | nindent 6 }}
