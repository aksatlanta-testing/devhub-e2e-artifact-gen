apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo312b8268-6b2e-43da-bc4a-ba1f6548da60.fullname" . }}
  labels:
    {{- include "go-echo312b8268-6b2e-43da-bc4a-ba1f6548da60.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo312b8268-6b2e-43da-bc4a-ba1f6548da60.selectorLabels" . | nindent 6 }}
