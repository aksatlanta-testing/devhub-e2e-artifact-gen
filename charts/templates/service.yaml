apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6550c92f-1954-4346-b392-bcabb95b9771.fullname" . }}
  labels:
    {{- include "go-echo6550c92f-1954-4346-b392-bcabb95b9771.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6550c92f-1954-4346-b392-bcabb95b9771.selectorLabels" . | nindent 6 }}
