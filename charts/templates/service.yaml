apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5f2cd3ab-365c-4908-8095-3375d58a9dc5.fullname" . }}
  labels:
    {{- include "go-echo5f2cd3ab-365c-4908-8095-3375d58a9dc5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5f2cd3ab-365c-4908-8095-3375d58a9dc5.selectorLabels" . | nindent 6 }}
