apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa8b1abf3-96df-4a5e-a91a-bd71fb1de181.fullname" . }}
  labels:
    {{- include "go-echoa8b1abf3-96df-4a5e-a91a-bd71fb1de181.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa8b1abf3-96df-4a5e-a91a-bd71fb1de181.selectorLabels" . | nindent 6 }}
