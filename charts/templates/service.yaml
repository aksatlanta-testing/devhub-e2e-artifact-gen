apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5ec4ead3-cb71-4aa0-93de-c0457d12e128.fullname" . }}
  labels:
    {{- include "go-echo5ec4ead3-cb71-4aa0-93de-c0457d12e128.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5ec4ead3-cb71-4aa0-93de-c0457d12e128.selectorLabels" . | nindent 6 }}
