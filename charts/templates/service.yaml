apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0f38c430-fc6d-495a-bf1d-e18411700fe6.fullname" . }}
  labels:
    {{- include "go-echo0f38c430-fc6d-495a-bf1d-e18411700fe6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0f38c430-fc6d-495a-bf1d-e18411700fe6.selectorLabels" . | nindent 6 }}
