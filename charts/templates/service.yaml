apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3970128e-f0c3-4d7e-a3c6-4813d4d3cf81.fullname" . }}
  labels:
    {{- include "go-echo3970128e-f0c3-4d7e-a3c6-4813d4d3cf81.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3970128e-f0c3-4d7e-a3c6-4813d4d3cf81.selectorLabels" . | nindent 6 }}
