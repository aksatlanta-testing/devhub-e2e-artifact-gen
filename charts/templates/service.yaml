apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6728db79-1313-418d-9682-2014750d0900.fullname" . }}
  labels:
    {{- include "go-echo6728db79-1313-418d-9682-2014750d0900.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6728db79-1313-418d-9682-2014750d0900.selectorLabels" . | nindent 6 }}
