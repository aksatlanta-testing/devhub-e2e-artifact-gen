apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8b36af2d-c3b0-4c38-b96c-e57907ef56ee.fullname" . }}
  labels:
    {{- include "go-echo8b36af2d-c3b0-4c38-b96c-e57907ef56ee.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8b36af2d-c3b0-4c38-b96c-e57907ef56ee.selectorLabels" . | nindent 6 }}
