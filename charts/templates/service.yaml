apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6cb3f327-00c2-4495-a3b6-67a031d1e6c2.fullname" . }}
  labels:
    {{- include "go-echo6cb3f327-00c2-4495-a3b6-67a031d1e6c2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6cb3f327-00c2-4495-a3b6-67a031d1e6c2.selectorLabels" . | nindent 6 }}
