apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoec4ffd7b-e6de-4c08-929f-cf7211bf2afe.fullname" . }}
  labels:
    {{- include "go-echoec4ffd7b-e6de-4c08-929f-cf7211bf2afe.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoec4ffd7b-e6de-4c08-929f-cf7211bf2afe.selectorLabels" . | nindent 6 }}
