apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo50b91b78-8c90-4474-8dab-e5e026b421b5.fullname" . }}
  labels:
    {{- include "go-echo50b91b78-8c90-4474-8dab-e5e026b421b5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo50b91b78-8c90-4474-8dab-e5e026b421b5.selectorLabels" . | nindent 6 }}
