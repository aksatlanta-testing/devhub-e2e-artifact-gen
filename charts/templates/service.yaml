apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo63a00e87-148d-48f7-8f3f-a0204ce72ec0.fullname" . }}
  labels:
    {{- include "go-echo63a00e87-148d-48f7-8f3f-a0204ce72ec0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo63a00e87-148d-48f7-8f3f-a0204ce72ec0.selectorLabels" . | nindent 6 }}
