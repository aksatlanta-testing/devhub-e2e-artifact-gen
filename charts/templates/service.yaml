apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod0237271-c678-42d5-86e0-c1a2ec946e57.fullname" . }}
  labels:
    {{- include "go-echod0237271-c678-42d5-86e0-c1a2ec946e57.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod0237271-c678-42d5-86e0-c1a2ec946e57.selectorLabels" . | nindent 6 }}
