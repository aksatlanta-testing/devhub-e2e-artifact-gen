apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2f0aa302-1e01-4ffd-92a0-e41b2c90806e.fullname" . }}
  labels:
    {{- include "go-echo2f0aa302-1e01-4ffd-92a0-e41b2c90806e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2f0aa302-1e01-4ffd-92a0-e41b2c90806e.selectorLabels" . | nindent 6 }}
