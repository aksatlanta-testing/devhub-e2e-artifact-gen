apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo24eaf562-6261-4e62-90f8-be3ba7fe2fd4.fullname" . }}
  labels:
    {{- include "go-echo24eaf562-6261-4e62-90f8-be3ba7fe2fd4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo24eaf562-6261-4e62-90f8-be3ba7fe2fd4.selectorLabels" . | nindent 6 }}
