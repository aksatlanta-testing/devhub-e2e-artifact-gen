apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc1ad0ac1-47b7-4b0a-a168-bbc3fc425722.fullname" . }}
  labels:
    {{- include "go-echoc1ad0ac1-47b7-4b0a-a168-bbc3fc425722.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc1ad0ac1-47b7-4b0a-a168-bbc3fc425722.selectorLabels" . | nindent 6 }}
