apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8b68a6f0-add9-4746-9fe2-3591c482c969.fullname" . }}
  labels:
    {{- include "go-echo8b68a6f0-add9-4746-9fe2-3591c482c969.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8b68a6f0-add9-4746-9fe2-3591c482c969.selectorLabels" . | nindent 6 }}
