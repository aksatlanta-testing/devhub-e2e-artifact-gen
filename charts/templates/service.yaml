apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa1756b92-9506-44d6-b069-6a9841d6faa3.fullname" . }}
  labels:
    {{- include "go-echoa1756b92-9506-44d6-b069-6a9841d6faa3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa1756b92-9506-44d6-b069-6a9841d6faa3.selectorLabels" . | nindent 6 }}
