apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo30747294-365a-4840-a292-f1a3d8420bc4.fullname" . }}
  labels:
    {{- include "go-echo30747294-365a-4840-a292-f1a3d8420bc4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo30747294-365a-4840-a292-f1a3d8420bc4.selectorLabels" . | nindent 6 }}
