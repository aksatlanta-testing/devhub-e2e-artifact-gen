apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo06e4d6dd-420f-40c0-8061-250ed234533d.fullname" . }}
  labels:
    {{- include "go-echo06e4d6dd-420f-40c0-8061-250ed234533d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo06e4d6dd-420f-40c0-8061-250ed234533d.selectorLabels" . | nindent 6 }}
