apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc5058791-b4f2-4ec4-9cdc-79a625011099.fullname" . }}
  labels:
    {{- include "go-echoc5058791-b4f2-4ec4-9cdc-79a625011099.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc5058791-b4f2-4ec4-9cdc-79a625011099.selectorLabels" . | nindent 6 }}
