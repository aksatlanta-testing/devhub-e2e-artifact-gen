apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo65997f78-6b47-4633-98d7-52557a0f4469.fullname" . }}
  labels:
    {{- include "go-echo65997f78-6b47-4633-98d7-52557a0f4469.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo65997f78-6b47-4633-98d7-52557a0f4469.selectorLabels" . | nindent 6 }}
