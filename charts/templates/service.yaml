apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo33b40a08-f0a8-4c45-8bbd-25171b64b4dd.fullname" . }}
  labels:
    {{- include "go-echo33b40a08-f0a8-4c45-8bbd-25171b64b4dd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo33b40a08-f0a8-4c45-8bbd-25171b64b4dd.selectorLabels" . | nindent 6 }}
