apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo737c27df-dfe6-4ee9-ba7c-a41769f2b42c.fullname" . }}
  labels:
    {{- include "go-echo737c27df-dfe6-4ee9-ba7c-a41769f2b42c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo737c27df-dfe6-4ee9-ba7c-a41769f2b42c.selectorLabels" . | nindent 6 }}
