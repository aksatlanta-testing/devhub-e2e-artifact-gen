apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoca9ec296-3bf0-4c12-bbc2-e9c6e35c4f36.fullname" . }}
  labels:
    {{- include "go-echoca9ec296-3bf0-4c12-bbc2-e9c6e35c4f36.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoca9ec296-3bf0-4c12-bbc2-e9c6e35c4f36.selectorLabels" . | nindent 6 }}
