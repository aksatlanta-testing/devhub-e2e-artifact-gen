apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc2779b06-3697-4ee6-966c-fc71fc804b67.fullname" . }}
  labels:
    {{- include "go-echoc2779b06-3697-4ee6-966c-fc71fc804b67.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc2779b06-3697-4ee6-966c-fc71fc804b67.selectorLabels" . | nindent 6 }}
