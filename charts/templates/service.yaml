apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7b184bde-af97-4454-b861-cad93ad9b374.fullname" . }}
  labels:
    {{- include "go-echo7b184bde-af97-4454-b861-cad93ad9b374.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7b184bde-af97-4454-b861-cad93ad9b374.selectorLabels" . | nindent 6 }}
