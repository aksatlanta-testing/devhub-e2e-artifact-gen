apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6e4fdf1c-f619-499a-9d39-83d70ac700e9.fullname" . }}
  labels:
    {{- include "go-echo6e4fdf1c-f619-499a-9d39-83d70ac700e9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6e4fdf1c-f619-499a-9d39-83d70ac700e9.selectorLabels" . | nindent 6 }}
