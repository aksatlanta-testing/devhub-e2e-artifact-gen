apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0aa4c72a-986b-4ea7-b6f0-a2ffff93f711.fullname" . }}
  labels:
    {{- include "go-echo0aa4c72a-986b-4ea7-b6f0-a2ffff93f711.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0aa4c72a-986b-4ea7-b6f0-a2ffff93f711.selectorLabels" . | nindent 6 }}
