apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0dd564bd-04e6-485a-8f92-ee1a7159666e.fullname" . }}
  labels:
    {{- include "go-echo0dd564bd-04e6-485a-8f92-ee1a7159666e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0dd564bd-04e6-485a-8f92-ee1a7159666e.selectorLabels" . | nindent 6 }}
