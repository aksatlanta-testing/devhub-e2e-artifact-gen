apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof2a47f5c-b3ae-427a-9101-dfbe4c817758.fullname" . }}
  labels:
    {{- include "go-echof2a47f5c-b3ae-427a-9101-dfbe4c817758.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof2a47f5c-b3ae-427a-9101-dfbe4c817758.selectorLabels" . | nindent 6 }}
