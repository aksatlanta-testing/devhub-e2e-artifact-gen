apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobe200d9e-6000-4279-a0e4-37629ce3f46a.fullname" . }}
  labels:
    {{- include "go-echobe200d9e-6000-4279-a0e4-37629ce3f46a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobe200d9e-6000-4279-a0e4-37629ce3f46a.selectorLabels" . | nindent 6 }}
