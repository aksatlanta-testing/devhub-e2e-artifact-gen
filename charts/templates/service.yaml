apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7f33cd35-d2dd-4377-a4fc-db1e2254e8e1.fullname" . }}
  labels:
    {{- include "go-echo7f33cd35-d2dd-4377-a4fc-db1e2254e8e1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7f33cd35-d2dd-4377-a4fc-db1e2254e8e1.selectorLabels" . | nindent 6 }}
