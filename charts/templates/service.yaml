apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoba5fc737-27a4-4f10-952b-e86797d908d7.fullname" . }}
  labels:
    {{- include "go-echoba5fc737-27a4-4f10-952b-e86797d908d7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoba5fc737-27a4-4f10-952b-e86797d908d7.selectorLabels" . | nindent 6 }}
