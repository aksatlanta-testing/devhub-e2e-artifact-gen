apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocdc6f363-7706-46c8-9999-8ebfe2339ba5.fullname" . }}
  labels:
    {{- include "go-echocdc6f363-7706-46c8-9999-8ebfe2339ba5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocdc6f363-7706-46c8-9999-8ebfe2339ba5.selectorLabels" . | nindent 6 }}
