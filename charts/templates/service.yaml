apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo46577ca1-be6e-4a16-a020-d068e31b7fcb.fullname" . }}
  labels:
    {{- include "go-echo46577ca1-be6e-4a16-a020-d068e31b7fcb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo46577ca1-be6e-4a16-a020-d068e31b7fcb.selectorLabels" . | nindent 6 }}
