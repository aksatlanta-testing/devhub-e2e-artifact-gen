apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoeb435b50-18d3-4770-bb7e-1d2d72deb3fd.fullname" . }}
  labels:
    {{- include "go-echoeb435b50-18d3-4770-bb7e-1d2d72deb3fd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoeb435b50-18d3-4770-bb7e-1d2d72deb3fd.selectorLabels" . | nindent 6 }}
