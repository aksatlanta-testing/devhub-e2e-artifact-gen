apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob6ed755b-61cb-425e-bb7f-efa43c843710.fullname" . }}
  labels:
    {{- include "go-echob6ed755b-61cb-425e-bb7f-efa43c843710.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob6ed755b-61cb-425e-bb7f-efa43c843710.selectorLabels" . | nindent 6 }}
