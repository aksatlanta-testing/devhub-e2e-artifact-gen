apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe8ef42a4-1b48-4d2f-a086-f070013afb23.fullname" . }}
  labels:
    {{- include "go-echoe8ef42a4-1b48-4d2f-a086-f070013afb23.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe8ef42a4-1b48-4d2f-a086-f070013afb23.selectorLabels" . | nindent 6 }}
