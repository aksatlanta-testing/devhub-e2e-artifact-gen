apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1b258429-437b-40c7-b093-12f0269d3e90.fullname" . }}
  labels:
    {{- include "go-echo1b258429-437b-40c7-b093-12f0269d3e90.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1b258429-437b-40c7-b093-12f0269d3e90.selectorLabels" . | nindent 6 }}
