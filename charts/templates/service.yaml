apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7ec06aaa-56d2-493c-9b3a-a3a43539cce8.fullname" . }}
  labels:
    {{- include "go-echo7ec06aaa-56d2-493c-9b3a-a3a43539cce8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7ec06aaa-56d2-493c-9b3a-a3a43539cce8.selectorLabels" . | nindent 6 }}
