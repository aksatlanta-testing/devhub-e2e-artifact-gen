apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo39c2a9aa-af83-4f89-9f42-e6c349c413ca.fullname" . }}
  labels:
    {{- include "go-echo39c2a9aa-af83-4f89-9f42-e6c349c413ca.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo39c2a9aa-af83-4f89-9f42-e6c349c413ca.selectorLabels" . | nindent 6 }}
