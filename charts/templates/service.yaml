apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodc5988af-8811-4857-99d0-cd6719f54af3.fullname" . }}
  labels:
    {{- include "go-echodc5988af-8811-4857-99d0-cd6719f54af3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodc5988af-8811-4857-99d0-cd6719f54af3.selectorLabels" . | nindent 6 }}
