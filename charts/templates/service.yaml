apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1e8dddf8-98b0-4c66-bc15-eb939ae90688.fullname" . }}
  labels:
    {{- include "go-echo1e8dddf8-98b0-4c66-bc15-eb939ae90688.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1e8dddf8-98b0-4c66-bc15-eb939ae90688.selectorLabels" . | nindent 6 }}
