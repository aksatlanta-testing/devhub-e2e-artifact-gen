apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5526c5e4-8329-4105-b6ce-fd6a59ca3ff6.fullname" . }}
  labels:
    {{- include "go-echo5526c5e4-8329-4105-b6ce-fd6a59ca3ff6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5526c5e4-8329-4105-b6ce-fd6a59ca3ff6.selectorLabels" . | nindent 6 }}
