apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo069eefc3-b055-4e1b-a069-2106c906f55c.fullname" . }}
  labels:
    {{- include "go-echo069eefc3-b055-4e1b-a069-2106c906f55c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo069eefc3-b055-4e1b-a069-2106c906f55c.selectorLabels" . | nindent 6 }}
