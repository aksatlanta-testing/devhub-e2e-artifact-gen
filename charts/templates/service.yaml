apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo29b40db3-20e2-4ea1-99f6-52a0edd71c84.fullname" . }}
  labels:
    {{- include "go-echo29b40db3-20e2-4ea1-99f6-52a0edd71c84.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo29b40db3-20e2-4ea1-99f6-52a0edd71c84.selectorLabels" . | nindent 6 }}
