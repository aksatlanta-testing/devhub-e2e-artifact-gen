apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod246e97b-d14a-4cf8-b932-7e262538c144.fullname" . }}
  labels:
    {{- include "go-echod246e97b-d14a-4cf8-b932-7e262538c144.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod246e97b-d14a-4cf8-b932-7e262538c144.selectorLabels" . | nindent 6 }}
