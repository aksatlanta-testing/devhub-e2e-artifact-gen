apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocc4fc3f2-b1b8-4c28-8b33-c1180375dc63.fullname" . }}
  labels:
    {{- include "go-echocc4fc3f2-b1b8-4c28-8b33-c1180375dc63.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocc4fc3f2-b1b8-4c28-8b33-c1180375dc63.selectorLabels" . | nindent 6 }}
