apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo301d952e-50a8-4e52-a79d-2d2f53fbc547.fullname" . }}
  labels:
    {{- include "go-echo301d952e-50a8-4e52-a79d-2d2f53fbc547.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo301d952e-50a8-4e52-a79d-2d2f53fbc547.selectorLabels" . | nindent 6 }}
