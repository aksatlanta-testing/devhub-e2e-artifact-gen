apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo221c0100-5509-49f4-bc82-b365ec258506.fullname" . }}
  labels:
    {{- include "go-echo221c0100-5509-49f4-bc82-b365ec258506.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo221c0100-5509-49f4-bc82-b365ec258506.selectorLabels" . | nindent 6 }}
