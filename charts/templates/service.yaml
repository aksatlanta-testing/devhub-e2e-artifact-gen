apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo101ba314-e436-4d18-b818-2d5cb51cc1c4.fullname" . }}
  labels:
    {{- include "go-echo101ba314-e436-4d18-b818-2d5cb51cc1c4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo101ba314-e436-4d18-b818-2d5cb51cc1c4.selectorLabels" . | nindent 6 }}
