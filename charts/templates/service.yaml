apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo33d39d56-3a9a-43ad-b227-cd933f06fe67.fullname" . }}
  labels:
    {{- include "go-echo33d39d56-3a9a-43ad-b227-cd933f06fe67.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo33d39d56-3a9a-43ad-b227-cd933f06fe67.selectorLabels" . | nindent 6 }}
