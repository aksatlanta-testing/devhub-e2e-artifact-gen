apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof311aae7-2610-4093-9876-3beb4d72443e.fullname" . }}
  labels:
    {{- include "go-echof311aae7-2610-4093-9876-3beb4d72443e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof311aae7-2610-4093-9876-3beb4d72443e.selectorLabels" . | nindent 6 }}
