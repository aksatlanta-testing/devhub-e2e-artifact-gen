apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocadc3f52-0df6-4c81-8073-6e1e06ccb04e.fullname" . }}
  labels:
    {{- include "go-echocadc3f52-0df6-4c81-8073-6e1e06ccb04e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocadc3f52-0df6-4c81-8073-6e1e06ccb04e.selectorLabels" . | nindent 6 }}
