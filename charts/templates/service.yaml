apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9d344e50-6c26-4c75-a629-2b700673a660.fullname" . }}
  labels:
    {{- include "go-echo9d344e50-6c26-4c75-a629-2b700673a660.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9d344e50-6c26-4c75-a629-2b700673a660.selectorLabels" . | nindent 6 }}
