apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc659646a-2897-4807-8013-c97a937d6026.fullname" . }}
  labels:
    {{- include "go-echoc659646a-2897-4807-8013-c97a937d6026.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc659646a-2897-4807-8013-c97a937d6026.selectorLabels" . | nindent 6 }}
