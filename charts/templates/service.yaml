apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofe0ae2fd-72c2-4788-b16f-1c34660d4d94.fullname" . }}
  labels:
    {{- include "go-echofe0ae2fd-72c2-4788-b16f-1c34660d4d94.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofe0ae2fd-72c2-4788-b16f-1c34660d4d94.selectorLabels" . | nindent 6 }}
