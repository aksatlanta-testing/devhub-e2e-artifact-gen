apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoebfd3bc3-761b-4817-95c5-6c19803fb597.fullname" . }}
  labels:
    {{- include "go-echoebfd3bc3-761b-4817-95c5-6c19803fb597.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoebfd3bc3-761b-4817-95c5-6c19803fb597.selectorLabels" . | nindent 6 }}
