apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo83a21dae-1265-4327-aa54-321e4ccf5f38.fullname" . }}
  labels:
    {{- include "go-echo83a21dae-1265-4327-aa54-321e4ccf5f38.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo83a21dae-1265-4327-aa54-321e4ccf5f38.selectorLabels" . | nindent 6 }}
