apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo459cf596-e89c-4c40-82eb-e7f6823f2146.fullname" . }}
  labels:
    {{- include "go-echo459cf596-e89c-4c40-82eb-e7f6823f2146.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo459cf596-e89c-4c40-82eb-e7f6823f2146.selectorLabels" . | nindent 6 }}
