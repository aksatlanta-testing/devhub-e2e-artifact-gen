apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa4bab792-f3db-4351-a3da-b2c6acf0584c.fullname" . }}
  labels:
    {{- include "go-echoa4bab792-f3db-4351-a3da-b2c6acf0584c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa4bab792-f3db-4351-a3da-b2c6acf0584c.selectorLabels" . | nindent 6 }}
