apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo688865b4-52ea-433d-a763-aed8f59abcab.fullname" . }}
  labels:
    {{- include "go-echo688865b4-52ea-433d-a763-aed8f59abcab.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo688865b4-52ea-433d-a763-aed8f59abcab.selectorLabels" . | nindent 6 }}
