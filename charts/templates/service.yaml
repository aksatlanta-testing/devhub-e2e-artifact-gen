apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo25bbb818-9ba3-4dda-aea5-b9613771769d.fullname" . }}
  labels:
    {{- include "go-echo25bbb818-9ba3-4dda-aea5-b9613771769d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo25bbb818-9ba3-4dda-aea5-b9613771769d.selectorLabels" . | nindent 6 }}
