apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6cb525fc-7a12-45ee-8b7b-ddb2b7c73e9c.fullname" . }}
  labels:
    {{- include "go-echo6cb525fc-7a12-45ee-8b7b-ddb2b7c73e9c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6cb525fc-7a12-45ee-8b7b-ddb2b7c73e9c.selectorLabels" . | nindent 6 }}
