apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0d7e8a75-9c08-441a-8917-43ae8a00146f.fullname" . }}
  labels:
    {{- include "go-echo0d7e8a75-9c08-441a-8917-43ae8a00146f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0d7e8a75-9c08-441a-8917-43ae8a00146f.selectorLabels" . | nindent 6 }}
