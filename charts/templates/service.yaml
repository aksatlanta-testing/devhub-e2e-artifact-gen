apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6192348e-643a-40c1-815f-b6dec3c6f15f.fullname" . }}
  labels:
    {{- include "go-echo6192348e-643a-40c1-815f-b6dec3c6f15f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6192348e-643a-40c1-815f-b6dec3c6f15f.selectorLabels" . | nindent 6 }}
