apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo90cf2330-dcd6-4cc2-9a8b-93731853491c.fullname" . }}
  labels:
    {{- include "go-echo90cf2330-dcd6-4cc2-9a8b-93731853491c.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo90cf2330-dcd6-4cc2-9a8b-93731853491c.selectorLabels" . | nindent 6 }}
