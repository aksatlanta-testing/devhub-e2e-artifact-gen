apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2ba22be3-9a49-4f3d-9e0e-8189a62a4802.fullname" . }}
  labels:
    {{- include "go-echo2ba22be3-9a49-4f3d-9e0e-8189a62a4802.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2ba22be3-9a49-4f3d-9e0e-8189a62a4802.selectorLabels" . | nindent 6 }}
