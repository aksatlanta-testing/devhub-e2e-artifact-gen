apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo64e5a7d8-7c0c-454a-aca5-d601b389b17b.fullname" . }}
  labels:
    {{- include "go-echo64e5a7d8-7c0c-454a-aca5-d601b389b17b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo64e5a7d8-7c0c-454a-aca5-d601b389b17b.selectorLabels" . | nindent 6 }}
