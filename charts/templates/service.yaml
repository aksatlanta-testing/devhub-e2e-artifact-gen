apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9cf92bd0-c618-4c94-8a42-43160ec9badb.fullname" . }}
  labels:
    {{- include "go-echo9cf92bd0-c618-4c94-8a42-43160ec9badb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9cf92bd0-c618-4c94-8a42-43160ec9badb.selectorLabels" . | nindent 6 }}
