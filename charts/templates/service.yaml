apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof0e87908-d51a-4fa7-9d8c-b747cbb55c9a.fullname" . }}
  labels:
    {{- include "go-echof0e87908-d51a-4fa7-9d8c-b747cbb55c9a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof0e87908-d51a-4fa7-9d8c-b747cbb55c9a.selectorLabels" . | nindent 6 }}
