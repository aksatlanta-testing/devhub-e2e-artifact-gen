apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo289bb172-2e11-4f31-96d5-9274fa0c0083.fullname" . }}
  labels:
    {{- include "go-echo289bb172-2e11-4f31-96d5-9274fa0c0083.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo289bb172-2e11-4f31-96d5-9274fa0c0083.selectorLabels" . | nindent 6 }}
