apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo086d56a8-7d8b-4044-844b-d1abc1c6694e.fullname" . }}
  labels:
    {{- include "go-echo086d56a8-7d8b-4044-844b-d1abc1c6694e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo086d56a8-7d8b-4044-844b-d1abc1c6694e.selectorLabels" . | nindent 6 }}
