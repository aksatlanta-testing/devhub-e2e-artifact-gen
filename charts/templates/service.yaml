apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo85cfe58a-1492-4c5d-a8da-f7603d20703a.fullname" . }}
  labels:
    {{- include "go-echo85cfe58a-1492-4c5d-a8da-f7603d20703a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo85cfe58a-1492-4c5d-a8da-f7603d20703a.selectorLabels" . | nindent 6 }}
