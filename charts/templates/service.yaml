apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofd235885-f37c-43d5-89d7-b82276a1eecb.fullname" . }}
  labels:
    {{- include "go-echofd235885-f37c-43d5-89d7-b82276a1eecb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofd235885-f37c-43d5-89d7-b82276a1eecb.selectorLabels" . | nindent 6 }}
