apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob9a8b9e8-a9f5-43ae-96fc-2c2f45c9269d.fullname" . }}
  labels:
    {{- include "go-echob9a8b9e8-a9f5-43ae-96fc-2c2f45c9269d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob9a8b9e8-a9f5-43ae-96fc-2c2f45c9269d.selectorLabels" . | nindent 6 }}
