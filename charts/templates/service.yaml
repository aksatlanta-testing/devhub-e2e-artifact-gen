apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo934ebbee-0983-4f30-929b-c721182fd947.fullname" . }}
  labels:
    {{- include "go-echo934ebbee-0983-4f30-929b-c721182fd947.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo934ebbee-0983-4f30-929b-c721182fd947.selectorLabels" . | nindent 6 }}
