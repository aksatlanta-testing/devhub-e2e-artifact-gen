apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocf0094f5-1229-4534-8120-eefb2276b411.fullname" . }}
  labels:
    {{- include "go-echocf0094f5-1229-4534-8120-eefb2276b411.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocf0094f5-1229-4534-8120-eefb2276b411.selectorLabels" . | nindent 6 }}
