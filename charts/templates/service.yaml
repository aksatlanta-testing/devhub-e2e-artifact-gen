apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo900ff8c8-335f-4321-bc6f-584c6a3801d8.fullname" . }}
  labels:
    {{- include "go-echo900ff8c8-335f-4321-bc6f-584c6a3801d8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo900ff8c8-335f-4321-bc6f-584c6a3801d8.selectorLabels" . | nindent 6 }}
