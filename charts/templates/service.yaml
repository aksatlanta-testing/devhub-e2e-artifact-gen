apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo187a9fff-5f5e-42ff-8dba-ddc26147745d.fullname" . }}
  labels:
    {{- include "go-echo187a9fff-5f5e-42ff-8dba-ddc26147745d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo187a9fff-5f5e-42ff-8dba-ddc26147745d.selectorLabels" . | nindent 6 }}
