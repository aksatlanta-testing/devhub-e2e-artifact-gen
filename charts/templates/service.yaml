apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo21fabf41-d4c3-4a16-8f50-b1afe0c0af94.fullname" . }}
  labels:
    {{- include "go-echo21fabf41-d4c3-4a16-8f50-b1afe0c0af94.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo21fabf41-d4c3-4a16-8f50-b1afe0c0af94.selectorLabels" . | nindent 6 }}
