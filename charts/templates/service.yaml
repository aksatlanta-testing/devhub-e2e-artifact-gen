apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo26445e22-07ab-4faf-b81c-e96b604400b1.fullname" . }}
  labels:
    {{- include "go-echo26445e22-07ab-4faf-b81c-e96b604400b1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo26445e22-07ab-4faf-b81c-e96b604400b1.selectorLabels" . | nindent 6 }}
