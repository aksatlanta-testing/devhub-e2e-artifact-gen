apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobdfc4f8d-8fe9-4f8f-a1ed-43e19af37853.fullname" . }}
  labels:
    {{- include "go-echobdfc4f8d-8fe9-4f8f-a1ed-43e19af37853.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobdfc4f8d-8fe9-4f8f-a1ed-43e19af37853.selectorLabels" . | nindent 6 }}
