apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa08107ac-f689-43df-86b5-6b56380a97ed.fullname" . }}
  labels:
    {{- include "go-echoa08107ac-f689-43df-86b5-6b56380a97ed.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa08107ac-f689-43df-86b5-6b56380a97ed.selectorLabels" . | nindent 6 }}
