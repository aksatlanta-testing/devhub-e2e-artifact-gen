apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa33dfda6-56db-49f4-b48d-fff58a6405b4.fullname" . }}
  labels:
    {{- include "go-echoa33dfda6-56db-49f4-b48d-fff58a6405b4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa33dfda6-56db-49f4-b48d-fff58a6405b4.selectorLabels" . | nindent 6 }}
