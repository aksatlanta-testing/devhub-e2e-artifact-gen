apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo87715299-cb3f-425f-8770-5d6842ab2f21.fullname" . }}
  labels:
    {{- include "go-echo87715299-cb3f-425f-8770-5d6842ab2f21.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo87715299-cb3f-425f-8770-5d6842ab2f21.selectorLabels" . | nindent 6 }}
