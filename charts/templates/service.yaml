apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo50bcb0c6-f8d4-4f30-b785-c101048e552b.fullname" . }}
  labels:
    {{- include "go-echo50bcb0c6-f8d4-4f30-b785-c101048e552b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo50bcb0c6-f8d4-4f30-b785-c101048e552b.selectorLabels" . | nindent 6 }}
