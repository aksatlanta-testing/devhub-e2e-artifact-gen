apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoed617f42-1e0b-4466-8d02-d75e65278489.fullname" . }}
  labels:
    {{- include "go-echoed617f42-1e0b-4466-8d02-d75e65278489.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoed617f42-1e0b-4466-8d02-d75e65278489.selectorLabels" . | nindent 6 }}
