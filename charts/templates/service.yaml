apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo41f0e8f8-bb81-4819-97fc-bbabe1ae8886.fullname" . }}
  labels:
    {{- include "go-echo41f0e8f8-bb81-4819-97fc-bbabe1ae8886.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo41f0e8f8-bb81-4819-97fc-bbabe1ae8886.selectorLabels" . | nindent 6 }}
