apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2179f3c9-0df4-4c29-84af-ac4d04abe4fa.fullname" . }}
  labels:
    {{- include "go-echo2179f3c9-0df4-4c29-84af-ac4d04abe4fa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2179f3c9-0df4-4c29-84af-ac4d04abe4fa.selectorLabels" . | nindent 6 }}
