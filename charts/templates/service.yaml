apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob8482292-438b-4b4c-b286-215815e53575.fullname" . }}
  labels:
    {{- include "go-echob8482292-438b-4b4c-b286-215815e53575.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob8482292-438b-4b4c-b286-215815e53575.selectorLabels" . | nindent 6 }}
