apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo18dc8a14-6ef2-48a0-8171-6d70c72205e9.fullname" . }}
  labels:
    {{- include "go-echo18dc8a14-6ef2-48a0-8171-6d70c72205e9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo18dc8a14-6ef2-48a0-8171-6d70c72205e9.selectorLabels" . | nindent 6 }}
