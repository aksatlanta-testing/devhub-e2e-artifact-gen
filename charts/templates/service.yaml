apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobc85a88d-564f-4fdf-8efb-ae4501e6dd51.fullname" . }}
  labels:
    {{- include "go-echobc85a88d-564f-4fdf-8efb-ae4501e6dd51.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobc85a88d-564f-4fdf-8efb-ae4501e6dd51.selectorLabels" . | nindent 6 }}
