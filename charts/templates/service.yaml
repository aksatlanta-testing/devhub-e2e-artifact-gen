apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo26b9a7b1-c2d9-43c6-880b-b762328631e9.fullname" . }}
  labels:
    {{- include "go-echo26b9a7b1-c2d9-43c6-880b-b762328631e9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo26b9a7b1-c2d9-43c6-880b-b762328631e9.selectorLabels" . | nindent 6 }}
