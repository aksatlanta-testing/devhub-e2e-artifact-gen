apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7870a3e1-b619-4309-b866-2c0e07a4608a.fullname" . }}
  labels:
    {{- include "go-echo7870a3e1-b619-4309-b866-2c0e07a4608a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7870a3e1-b619-4309-b866-2c0e07a4608a.selectorLabels" . | nindent 6 }}
