apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa14a9f36-0596-407d-a0cd-54a1a18a748a.fullname" . }}
  labels:
    {{- include "go-echoa14a9f36-0596-407d-a0cd-54a1a18a748a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa14a9f36-0596-407d-a0cd-54a1a18a748a.selectorLabels" . | nindent 6 }}
