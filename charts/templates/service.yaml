apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofebccc3a-b299-4683-b8c1-d417dd8f2d8b.fullname" . }}
  labels:
    {{- include "go-echofebccc3a-b299-4683-b8c1-d417dd8f2d8b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofebccc3a-b299-4683-b8c1-d417dd8f2d8b.selectorLabels" . | nindent 6 }}
