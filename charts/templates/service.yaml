apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa4522572-eaf6-45ae-99fd-9cf709770198.fullname" . }}
  labels:
    {{- include "go-echoa4522572-eaf6-45ae-99fd-9cf709770198.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa4522572-eaf6-45ae-99fd-9cf709770198.selectorLabels" . | nindent 6 }}
