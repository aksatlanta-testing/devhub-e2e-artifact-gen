apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo219dc714-0539-4bed-9247-3bfacc3a7c34.fullname" . }}
  labels:
    {{- include "go-echo219dc714-0539-4bed-9247-3bfacc3a7c34.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo219dc714-0539-4bed-9247-3bfacc3a7c34.selectorLabels" . | nindent 6 }}
