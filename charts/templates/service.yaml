apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoee93be4c-7bbe-4767-a068-4af58ab45688.fullname" . }}
  labels:
    {{- include "go-echoee93be4c-7bbe-4767-a068-4af58ab45688.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoee93be4c-7bbe-4767-a068-4af58ab45688.selectorLabels" . | nindent 6 }}
