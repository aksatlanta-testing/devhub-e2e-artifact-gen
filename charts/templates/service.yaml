apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0fe4f672-ee0e-48fc-a299-caa294877b64.fullname" . }}
  labels:
    {{- include "go-echo0fe4f672-ee0e-48fc-a299-caa294877b64.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0fe4f672-ee0e-48fc-a299-caa294877b64.selectorLabels" . | nindent 6 }}
