apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2d4faad2-ac1e-48ee-b751-6eb1d218b609.fullname" . }}
  labels:
    {{- include "go-echo2d4faad2-ac1e-48ee-b751-6eb1d218b609.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2d4faad2-ac1e-48ee-b751-6eb1d218b609.selectorLabels" . | nindent 6 }}
