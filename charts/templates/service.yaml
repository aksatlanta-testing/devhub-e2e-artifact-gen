apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod31422dc-dc4d-4254-b0bb-d01113248ff0.fullname" . }}
  labels:
    {{- include "go-echod31422dc-dc4d-4254-b0bb-d01113248ff0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod31422dc-dc4d-4254-b0bb-d01113248ff0.selectorLabels" . | nindent 6 }}
