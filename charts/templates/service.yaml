apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo293fda57-58c0-4d20-9d75-74349a0c6e6c.fullname" . }}
  labels:
    {{- include "go-echo293fda57-58c0-4d20-9d75-74349a0c6e6c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo293fda57-58c0-4d20-9d75-74349a0c6e6c.selectorLabels" . | nindent 6 }}
