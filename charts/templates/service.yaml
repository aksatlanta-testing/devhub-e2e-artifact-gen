apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8c66fb07-7202-4fcb-813b-49604e2059fc.fullname" . }}
  labels:
    {{- include "go-echo8c66fb07-7202-4fcb-813b-49604e2059fc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8c66fb07-7202-4fcb-813b-49604e2059fc.selectorLabels" . | nindent 6 }}
