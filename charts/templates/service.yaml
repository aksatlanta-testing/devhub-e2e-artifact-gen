apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6b1d02f7-15d0-4ee1-8cb6-977766c2d73d.fullname" . }}
  labels:
    {{- include "go-echo6b1d02f7-15d0-4ee1-8cb6-977766c2d73d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6b1d02f7-15d0-4ee1-8cb6-977766c2d73d.selectorLabels" . | nindent 6 }}
