apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc868f6a5-11d2-4e43-8bd3-f604171f12cb.fullname" . }}
  labels:
    {{- include "go-echoc868f6a5-11d2-4e43-8bd3-f604171f12cb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc868f6a5-11d2-4e43-8bd3-f604171f12cb.selectorLabels" . | nindent 6 }}
