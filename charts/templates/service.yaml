apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5baf2757-67cc-44c9-846a-7fe10bdf1bc0.fullname" . }}
  labels:
    {{- include "go-echo5baf2757-67cc-44c9-846a-7fe10bdf1bc0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5baf2757-67cc-44c9-846a-7fe10bdf1bc0.selectorLabels" . | nindent 6 }}
