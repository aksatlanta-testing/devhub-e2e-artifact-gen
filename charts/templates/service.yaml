apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8b59994f-a91f-4a72-8d25-050293f2c468.fullname" . }}
  labels:
    {{- include "go-echo8b59994f-a91f-4a72-8d25-050293f2c468.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8b59994f-a91f-4a72-8d25-050293f2c468.selectorLabels" . | nindent 6 }}
