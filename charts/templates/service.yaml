apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo165b6681-8a03-47b3-9d8d-790e953b81f7.fullname" . }}
  labels:
    {{- include "go-echo165b6681-8a03-47b3-9d8d-790e953b81f7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo165b6681-8a03-47b3-9d8d-790e953b81f7.selectorLabels" . | nindent 6 }}
