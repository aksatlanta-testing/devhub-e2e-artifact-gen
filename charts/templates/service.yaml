apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo75c6c98a-0300-47c6-a937-648a19389cf5.fullname" . }}
  labels:
    {{- include "go-echo75c6c98a-0300-47c6-a937-648a19389cf5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo75c6c98a-0300-47c6-a937-648a19389cf5.selectorLabels" . | nindent 6 }}
