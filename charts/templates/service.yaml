apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5fa8f939-936a-48e9-9112-cbecf7636988.fullname" . }}
  labels:
    {{- include "go-echo5fa8f939-936a-48e9-9112-cbecf7636988.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5fa8f939-936a-48e9-9112-cbecf7636988.selectorLabels" . | nindent 6 }}
