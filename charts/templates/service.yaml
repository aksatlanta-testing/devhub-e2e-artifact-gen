apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo24d0b52a-9345-47e2-9750-23052a33e01c.fullname" . }}
  labels:
    {{- include "go-echo24d0b52a-9345-47e2-9750-23052a33e01c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo24d0b52a-9345-47e2-9750-23052a33e01c.selectorLabels" . | nindent 6 }}
