apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4eeb3563-bdee-4b99-a8d1-7bc6b2bc9100.fullname" . }}
  labels:
    {{- include "go-echo4eeb3563-bdee-4b99-a8d1-7bc6b2bc9100.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4eeb3563-bdee-4b99-a8d1-7bc6b2bc9100.selectorLabels" . | nindent 6 }}
