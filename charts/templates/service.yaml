apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1290d19f-e045-420e-8630-35d084f8e4cd.fullname" . }}
  labels:
    {{- include "go-echo1290d19f-e045-420e-8630-35d084f8e4cd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1290d19f-e045-420e-8630-35d084f8e4cd.selectorLabels" . | nindent 6 }}
