apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo54b627c0-90cc-498a-a56a-68004356c158.fullname" . }}
  labels:
    {{- include "go-echo54b627c0-90cc-498a-a56a-68004356c158.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo54b627c0-90cc-498a-a56a-68004356c158.selectorLabels" . | nindent 6 }}
