apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6957872c-542d-4883-9044-eb9ab8c727e0.fullname" . }}
  labels:
    {{- include "go-echo6957872c-542d-4883-9044-eb9ab8c727e0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6957872c-542d-4883-9044-eb9ab8c727e0.selectorLabels" . | nindent 6 }}
