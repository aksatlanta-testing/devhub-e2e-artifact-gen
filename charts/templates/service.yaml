apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1b19501f-677c-4753-a9a4-d65b7f87e37b.fullname" . }}
  labels:
    {{- include "go-echo1b19501f-677c-4753-a9a4-d65b7f87e37b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1b19501f-677c-4753-a9a4-d65b7f87e37b.selectorLabels" . | nindent 6 }}
