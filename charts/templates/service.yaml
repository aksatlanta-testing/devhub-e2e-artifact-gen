apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo48a6df77-ca93-4129-bde4-8302aedcedc4.fullname" . }}
  labels:
    {{- include "go-echo48a6df77-ca93-4129-bde4-8302aedcedc4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo48a6df77-ca93-4129-bde4-8302aedcedc4.selectorLabels" . | nindent 6 }}
