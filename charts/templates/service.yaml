apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7173a9d3-9153-4865-b7b8-b009c5d6ac3d.fullname" . }}
  labels:
    {{- include "go-echo7173a9d3-9153-4865-b7b8-b009c5d6ac3d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
