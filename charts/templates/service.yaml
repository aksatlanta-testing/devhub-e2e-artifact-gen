apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodd563f5d-d5ae-4fa7-a9b2-1cdf0c322b0d.fullname" . }}
  labels:
    {{- include "go-echodd563f5d-d5ae-4fa7-a9b2-1cdf0c322b0d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodd563f5d-d5ae-4fa7-a9b2-1cdf0c322b0d.selectorLabels" . | nindent 6 }}
