apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof635c437-dd23-4a83-9d55-c783a2a2e728.fullname" . }}
  labels:
    {{- include "go-echof635c437-dd23-4a83-9d55-c783a2a2e728.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof635c437-dd23-4a83-9d55-c783a2a2e728.selectorLabels" . | nindent 6 }}
