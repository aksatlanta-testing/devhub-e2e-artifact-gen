apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2c6df932-e960-4815-a573-d89e63d777d8.fullname" . }}
  labels:
    {{- include "go-echo2c6df932-e960-4815-a573-d89e63d777d8.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2c6df932-e960-4815-a573-d89e63d777d8.selectorLabels" . | nindent 6 }}
