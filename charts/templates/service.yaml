apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo89ea84c0-1980-4581-8035-b071d2aa5bca.fullname" . }}
  labels:
    {{- include "go-echo89ea84c0-1980-4581-8035-b071d2aa5bca.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo89ea84c0-1980-4581-8035-b071d2aa5bca.selectorLabels" . | nindent 6 }}
