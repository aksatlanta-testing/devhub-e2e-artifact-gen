apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo922fb54e-1fc3-41d5-be35-58878b743d0b.fullname" . }}
  labels:
    {{- include "go-echo922fb54e-1fc3-41d5-be35-58878b743d0b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo922fb54e-1fc3-41d5-be35-58878b743d0b.selectorLabels" . | nindent 6 }}
