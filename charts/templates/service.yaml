apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoce060579-0c78-494f-bb7a-0f7ec751fa2a.fullname" . }}
  labels:
    {{- include "go-echoce060579-0c78-494f-bb7a-0f7ec751fa2a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoce060579-0c78-494f-bb7a-0f7ec751fa2a.selectorLabels" . | nindent 6 }}
