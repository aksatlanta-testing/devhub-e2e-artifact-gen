apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo49368136-343b-4652-9586-8e5c3a44fc8b.fullname" . }}
  labels:
    {{- include "go-echo49368136-343b-4652-9586-8e5c3a44fc8b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo49368136-343b-4652-9586-8e5c3a44fc8b.selectorLabels" . | nindent 6 }}
