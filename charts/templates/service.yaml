apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo77642b12-682a-4821-b05b-c3fe966f3e34.fullname" . }}
  labels:
    {{- include "go-echo77642b12-682a-4821-b05b-c3fe966f3e34.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo77642b12-682a-4821-b05b-c3fe966f3e34.selectorLabels" . | nindent 6 }}
