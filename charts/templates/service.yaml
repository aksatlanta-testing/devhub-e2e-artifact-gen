apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob6883b19-bec5-45ec-8c48-7da6de2d9304.fullname" . }}
  labels:
    {{- include "go-echob6883b19-bec5-45ec-8c48-7da6de2d9304.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob6883b19-bec5-45ec-8c48-7da6de2d9304.selectorLabels" . | nindent 6 }}
