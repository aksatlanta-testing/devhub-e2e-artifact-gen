apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe510dcfb-fbcd-40a9-bcc8-149cdb1bc367.fullname" . }}
  labels:
    {{- include "go-echoe510dcfb-fbcd-40a9-bcc8-149cdb1bc367.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe510dcfb-fbcd-40a9-bcc8-149cdb1bc367.selectorLabels" . | nindent 6 }}
