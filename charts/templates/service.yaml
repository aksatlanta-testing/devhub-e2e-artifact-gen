apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7974a782-e4e8-4cf0-b667-898c5697abea.fullname" . }}
  labels:
    {{- include "go-echo7974a782-e4e8-4cf0-b667-898c5697abea.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7974a782-e4e8-4cf0-b667-898c5697abea.selectorLabels" . | nindent 6 }}
