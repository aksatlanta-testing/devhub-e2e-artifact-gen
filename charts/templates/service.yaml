apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa927d332-0852-411c-b597-96a6292764fc.fullname" . }}
  labels:
    {{- include "go-echoa927d332-0852-411c-b597-96a6292764fc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa927d332-0852-411c-b597-96a6292764fc.selectorLabels" . | nindent 6 }}
