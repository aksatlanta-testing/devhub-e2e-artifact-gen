apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2fdf5090-5e23-4450-a073-c7aadabd193a.fullname" . }}
  labels:
    {{- include "go-echo2fdf5090-5e23-4450-a073-c7aadabd193a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2fdf5090-5e23-4450-a073-c7aadabd193a.selectorLabels" . | nindent 6 }}
