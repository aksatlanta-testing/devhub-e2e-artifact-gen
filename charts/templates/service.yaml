apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo779ba60a-638f-42b4-96c8-4bf8489b3a0e.fullname" . }}
  labels:
    {{- include "go-echo779ba60a-638f-42b4-96c8-4bf8489b3a0e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo779ba60a-638f-42b4-96c8-4bf8489b3a0e.selectorLabels" . | nindent 6 }}
