apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo50c86a8c-39d5-4024-8340-220e3bac82ff.fullname" . }}
  labels:
    {{- include "go-echo50c86a8c-39d5-4024-8340-220e3bac82ff.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo50c86a8c-39d5-4024-8340-220e3bac82ff.selectorLabels" . | nindent 6 }}
