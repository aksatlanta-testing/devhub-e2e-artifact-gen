apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa3f53cd9-1071-482a-a9d6-76bccf60f566.fullname" . }}
  labels:
    {{- include "go-echoa3f53cd9-1071-482a-a9d6-76bccf60f566.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa3f53cd9-1071-482a-a9d6-76bccf60f566.selectorLabels" . | nindent 6 }}
