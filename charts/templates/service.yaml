apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6f471c6b-b2ef-45e7-a0a4-1c35fdc774dd.fullname" . }}
  labels:
    {{- include "go-echo6f471c6b-b2ef-45e7-a0a4-1c35fdc774dd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6f471c6b-b2ef-45e7-a0a4-1c35fdc774dd.selectorLabels" . | nindent 6 }}
