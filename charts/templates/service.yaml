apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa3f3e024-3e9f-4d08-a31a-0f98918b9156.fullname" . }}
  labels:
    {{- include "go-echoa3f3e024-3e9f-4d08-a31a-0f98918b9156.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa3f3e024-3e9f-4d08-a31a-0f98918b9156.selectorLabels" . | nindent 6 }}
