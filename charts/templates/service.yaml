apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9649806c-53b9-47f5-8e11-48236ebcce62.fullname" . }}
  labels:
    {{- include "go-echo9649806c-53b9-47f5-8e11-48236ebcce62.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9649806c-53b9-47f5-8e11-48236ebcce62.selectorLabels" . | nindent 6 }}
