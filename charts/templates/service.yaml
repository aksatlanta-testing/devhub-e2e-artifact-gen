apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8fde7b66-895c-48fe-8e7d-4e7ef4c83351.fullname" . }}
  labels:
    {{- include "go-echo8fde7b66-895c-48fe-8e7d-4e7ef4c83351.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8fde7b66-895c-48fe-8e7d-4e7ef4c83351.selectorLabels" . | nindent 6 }}
