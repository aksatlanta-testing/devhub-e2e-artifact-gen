apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0d5980b3-e65c-48f3-b8b5-3b299bed9c48.fullname" . }}
  labels:
    {{- include "go-echo0d5980b3-e65c-48f3-b8b5-3b299bed9c48.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0d5980b3-e65c-48f3-b8b5-3b299bed9c48.selectorLabels" . | nindent 6 }}
