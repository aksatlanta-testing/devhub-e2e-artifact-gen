apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4c58a00f-dd14-4cc3-8924-0c432c75a42f.fullname" . }}
  labels:
    {{- include "go-echo4c58a00f-dd14-4cc3-8924-0c432c75a42f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4c58a00f-dd14-4cc3-8924-0c432c75a42f.selectorLabels" . | nindent 6 }}
