apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob7b0a108-6b25-48fb-a040-06325bfe4d4b.fullname" . }}
  labels:
    {{- include "go-echob7b0a108-6b25-48fb-a040-06325bfe4d4b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob7b0a108-6b25-48fb-a040-06325bfe4d4b.selectorLabels" . | nindent 6 }}
