apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoeebb01a7-041f-4077-8b75-a531b2993221.fullname" . }}
  labels:
    {{- include "go-echoeebb01a7-041f-4077-8b75-a531b2993221.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoeebb01a7-041f-4077-8b75-a531b2993221.selectorLabels" . | nindent 6 }}
