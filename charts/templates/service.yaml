apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3bb9ee7f-c9a7-4ecf-bfba-085b373d68fe.fullname" . }}
  labels:
    {{- include "go-echo3bb9ee7f-c9a7-4ecf-bfba-085b373d68fe.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3bb9ee7f-c9a7-4ecf-bfba-085b373d68fe.selectorLabels" . | nindent 6 }}
