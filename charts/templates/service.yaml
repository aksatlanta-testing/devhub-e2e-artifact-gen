apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5fc7baf1-b9a9-42c0-8f8f-2ef7f6398dc0.fullname" . }}
  labels:
    {{- include "go-echo5fc7baf1-b9a9-42c0-8f8f-2ef7f6398dc0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5fc7baf1-b9a9-42c0-8f8f-2ef7f6398dc0.selectorLabels" . | nindent 6 }}
