apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9c719cf8-ed68-4c05-b3db-cc29f974983f.fullname" . }}
  labels:
    {{- include "go-echo9c719cf8-ed68-4c05-b3db-cc29f974983f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9c719cf8-ed68-4c05-b3db-cc29f974983f.selectorLabels" . | nindent 6 }}
