apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo449c9663-4dbe-4f09-a789-86b219d63508.fullname" . }}
  labels:
    {{- include "go-echo449c9663-4dbe-4f09-a789-86b219d63508.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo449c9663-4dbe-4f09-a789-86b219d63508.selectorLabels" . | nindent 6 }}
