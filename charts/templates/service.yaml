apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe60ae637-4cb7-44d6-8767-70588b93bf78.fullname" . }}
  labels:
    {{- include "go-echoe60ae637-4cb7-44d6-8767-70588b93bf78.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe60ae637-4cb7-44d6-8767-70588b93bf78.selectorLabels" . | nindent 6 }}
