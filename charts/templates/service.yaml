apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo39a32f64-72fc-4162-919a-65e8a7c9b314.fullname" . }}
  labels:
    {{- include "go-echo39a32f64-72fc-4162-919a-65e8a7c9b314.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo39a32f64-72fc-4162-919a-65e8a7c9b314.selectorLabels" . | nindent 6 }}
