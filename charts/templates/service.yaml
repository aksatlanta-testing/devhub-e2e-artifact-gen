apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo31940bac-d5f5-4ebc-a6cb-cceed0a377d4.fullname" . }}
  labels:
    {{- include "go-echo31940bac-d5f5-4ebc-a6cb-cceed0a377d4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo31940bac-d5f5-4ebc-a6cb-cceed0a377d4.selectorLabels" . | nindent 6 }}
