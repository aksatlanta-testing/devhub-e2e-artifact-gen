apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4a695c62-edf5-47a6-b793-697c4ac83377.fullname" . }}
  labels:
    {{- include "go-echo4a695c62-edf5-47a6-b793-697c4ac83377.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4a695c62-edf5-47a6-b793-697c4ac83377.selectorLabels" . | nindent 6 }}
