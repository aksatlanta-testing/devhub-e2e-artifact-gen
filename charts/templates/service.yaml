apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe9109f0e-7616-4366-9b3a-184f29fbee45.fullname" . }}
  labels:
    {{- include "go-echoe9109f0e-7616-4366-9b3a-184f29fbee45.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe9109f0e-7616-4366-9b3a-184f29fbee45.selectorLabels" . | nindent 6 }}
