apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo895bdb7d-dd6d-41a1-946e-028ce5d03acb.fullname" . }}
  labels:
    {{- include "go-echo895bdb7d-dd6d-41a1-946e-028ce5d03acb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo895bdb7d-dd6d-41a1-946e-028ce5d03acb.selectorLabels" . | nindent 6 }}
