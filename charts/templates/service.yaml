apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobe1c0f1a-ae69-4223-863a-c71d079d003c.fullname" . }}
  labels:
    {{- include "go-echobe1c0f1a-ae69-4223-863a-c71d079d003c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobe1c0f1a-ae69-4223-863a-c71d079d003c.selectorLabels" . | nindent 6 }}
