apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc2b33608-8118-4e28-bb8f-e375f8a5e103.fullname" . }}
  labels:
    {{- include "go-echoc2b33608-8118-4e28-bb8f-e375f8a5e103.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc2b33608-8118-4e28-bb8f-e375f8a5e103.selectorLabels" . | nindent 6 }}
