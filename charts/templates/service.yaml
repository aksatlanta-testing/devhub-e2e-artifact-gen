apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc869574e-b59e-415c-b265-d0a9a0e5f529.fullname" . }}
  labels:
    {{- include "go-echoc869574e-b59e-415c-b265-d0a9a0e5f529.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc869574e-b59e-415c-b265-d0a9a0e5f529.selectorLabels" . | nindent 6 }}
