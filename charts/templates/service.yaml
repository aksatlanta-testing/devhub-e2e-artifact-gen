apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3a73e41d-b98a-417e-a0d2-a86d5408531b.fullname" . }}
  labels:
    {{- include "go-echo3a73e41d-b98a-417e-a0d2-a86d5408531b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3a73e41d-b98a-417e-a0d2-a86d5408531b.selectorLabels" . | nindent 6 }}
