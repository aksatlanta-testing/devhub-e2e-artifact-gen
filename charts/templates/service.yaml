apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo95172196-b726-410b-8ba9-a5bce4c2cce1.fullname" . }}
  labels:
    {{- include "go-echo95172196-b726-410b-8ba9-a5bce4c2cce1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo95172196-b726-410b-8ba9-a5bce4c2cce1.selectorLabels" . | nindent 6 }}
