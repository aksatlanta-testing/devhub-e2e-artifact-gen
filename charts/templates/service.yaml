apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5c42e10f-0c9e-4005-8b1b-879fe6fd29b8.fullname" . }}
  labels:
    {{- include "go-echo5c42e10f-0c9e-4005-8b1b-879fe6fd29b8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5c42e10f-0c9e-4005-8b1b-879fe6fd29b8.selectorLabels" . | nindent 6 }}
