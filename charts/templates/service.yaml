apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob49b7e63-d2c2-4b22-b645-d95db7e17bd9.fullname" . }}
  labels:
    {{- include "go-echob49b7e63-d2c2-4b22-b645-d95db7e17bd9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob49b7e63-d2c2-4b22-b645-d95db7e17bd9.selectorLabels" . | nindent 6 }}
