apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1924b04a-21a7-4e54-8b87-8e3020b70109.fullname" . }}
  labels:
    {{- include "go-echo1924b04a-21a7-4e54-8b87-8e3020b70109.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1924b04a-21a7-4e54-8b87-8e3020b70109.selectorLabels" . | nindent 6 }}
