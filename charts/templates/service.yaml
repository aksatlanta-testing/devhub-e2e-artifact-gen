apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod32a1bb4-1b07-4a4f-8fc7-64d1fce399f8.fullname" . }}
  labels:
    {{- include "go-echod32a1bb4-1b07-4a4f-8fc7-64d1fce399f8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod32a1bb4-1b07-4a4f-8fc7-64d1fce399f8.selectorLabels" . | nindent 6 }}
