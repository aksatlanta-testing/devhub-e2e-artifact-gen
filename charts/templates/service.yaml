apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7acfb7cc-8826-433e-bf1d-683a3d9a71d1.fullname" . }}
  labels:
    {{- include "go-echo7acfb7cc-8826-433e-bf1d-683a3d9a71d1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7acfb7cc-8826-433e-bf1d-683a3d9a71d1.selectorLabels" . | nindent 6 }}
