apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo63b3dc89-b633-4898-ba9d-ebd353c52d21.fullname" . }}
  labels:
    {{- include "go-echo63b3dc89-b633-4898-ba9d-ebd353c52d21.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo63b3dc89-b633-4898-ba9d-ebd353c52d21.selectorLabels" . | nindent 6 }}
