apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6cc8e647-38ec-4dcb-90f6-b7a2b55b78fd.fullname" . }}
  labels:
    {{- include "go-echo6cc8e647-38ec-4dcb-90f6-b7a2b55b78fd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6cc8e647-38ec-4dcb-90f6-b7a2b55b78fd.selectorLabels" . | nindent 6 }}
