apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoad445297-6a0f-417b-9d80-26dbb0e6c017.fullname" . }}
  labels:
    {{- include "go-echoad445297-6a0f-417b-9d80-26dbb0e6c017.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoad445297-6a0f-417b-9d80-26dbb0e6c017.selectorLabels" . | nindent 6 }}
