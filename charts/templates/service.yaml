apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1bc352ac-bdc6-4dff-952c-8565538c6616.fullname" . }}
  labels:
    {{- include "go-echo1bc352ac-bdc6-4dff-952c-8565538c6616.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1bc352ac-bdc6-4dff-952c-8565538c6616.selectorLabels" . | nindent 6 }}
