apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo536b64c6-4cc1-430e-9cca-9724a2611e39.fullname" . }}
  labels:
    {{- include "go-echo536b64c6-4cc1-430e-9cca-9724a2611e39.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo536b64c6-4cc1-430e-9cca-9724a2611e39.selectorLabels" . | nindent 6 }}
