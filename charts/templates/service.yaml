apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo40550396-4edd-423a-b480-0e738f896f80.fullname" . }}
  labels:
    {{- include "go-echo40550396-4edd-423a-b480-0e738f896f80.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo40550396-4edd-423a-b480-0e738f896f80.selectorLabels" . | nindent 6 }}
