apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodedf4de9-73b8-4c62-9bf1-1725b624b72d.fullname" . }}
  labels:
    {{- include "go-echodedf4de9-73b8-4c62-9bf1-1725b624b72d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodedf4de9-73b8-4c62-9bf1-1725b624b72d.selectorLabels" . | nindent 6 }}
