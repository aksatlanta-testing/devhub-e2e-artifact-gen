apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa36456ec-36b5-4195-85c9-8bb6587e3000.fullname" . }}
  labels:
    {{- include "go-echoa36456ec-36b5-4195-85c9-8bb6587e3000.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa36456ec-36b5-4195-85c9-8bb6587e3000.selectorLabels" . | nindent 6 }}
