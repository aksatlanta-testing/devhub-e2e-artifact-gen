apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo344e23de-75e2-4c9f-a149-37d828793df9.fullname" . }}
  labels:
    {{- include "go-echo344e23de-75e2-4c9f-a149-37d828793df9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo344e23de-75e2-4c9f-a149-37d828793df9.selectorLabels" . | nindent 6 }}
