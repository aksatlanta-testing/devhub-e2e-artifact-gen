apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobd00d1ee-3d36-46a2-bf9e-bf5d94665f45.fullname" . }}
  labels:
    {{- include "go-echobd00d1ee-3d36-46a2-bf9e-bf5d94665f45.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobd00d1ee-3d36-46a2-bf9e-bf5d94665f45.selectorLabels" . | nindent 6 }}
