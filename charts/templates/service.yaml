apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc34a4bdc-dba2-447a-a770-bddddd8cb9bf.fullname" . }}
  labels:
    {{- include "go-echoc34a4bdc-dba2-447a-a770-bddddd8cb9bf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc34a4bdc-dba2-447a-a770-bddddd8cb9bf.selectorLabels" . | nindent 6 }}
