apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5e2057fd-40df-42d7-acab-319d28104253.fullname" . }}
  labels:
    {{- include "go-echo5e2057fd-40df-42d7-acab-319d28104253.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5e2057fd-40df-42d7-acab-319d28104253.selectorLabels" . | nindent 6 }}
