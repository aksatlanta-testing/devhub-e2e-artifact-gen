apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8514d0cb-360b-4915-861b-0f8f0dc52094.fullname" . }}
  labels:
    {{- include "go-echo8514d0cb-360b-4915-861b-0f8f0dc52094.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8514d0cb-360b-4915-861b-0f8f0dc52094.selectorLabels" . | nindent 6 }}
