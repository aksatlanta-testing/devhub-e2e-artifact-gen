apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo75ebad7a-d250-4675-ad07-025dd2c25bd8.fullname" . }}
  labels:
    {{- include "go-echo75ebad7a-d250-4675-ad07-025dd2c25bd8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo75ebad7a-d250-4675-ad07-025dd2c25bd8.selectorLabels" . | nindent 6 }}
