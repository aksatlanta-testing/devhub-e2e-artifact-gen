apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodfd71935-8d18-43b7-ab01-c113e93e5a03.fullname" . }}
  labels:
    {{- include "go-echodfd71935-8d18-43b7-ab01-c113e93e5a03.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodfd71935-8d18-43b7-ab01-c113e93e5a03.selectorLabels" . | nindent 6 }}
