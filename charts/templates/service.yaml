apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2ad53318-6be7-482e-9446-3a786b7f2122.fullname" . }}
  labels:
    {{- include "go-echo2ad53318-6be7-482e-9446-3a786b7f2122.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2ad53318-6be7-482e-9446-3a786b7f2122.selectorLabels" . | nindent 6 }}
