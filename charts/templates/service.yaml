apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo54ca9ab5-6b06-4f1d-a8d9-16e37b156e98.fullname" . }}
  labels:
    {{- include "go-echo54ca9ab5-6b06-4f1d-a8d9-16e37b156e98.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo54ca9ab5-6b06-4f1d-a8d9-16e37b156e98.selectorLabels" . | nindent 6 }}
