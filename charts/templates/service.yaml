apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo30b8edce-aa29-440b-ba87-f39b0ec8e838.fullname" . }}
  labels:
    {{- include "go-echo30b8edce-aa29-440b-ba87-f39b0ec8e838.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo30b8edce-aa29-440b-ba87-f39b0ec8e838.selectorLabels" . | nindent 6 }}
