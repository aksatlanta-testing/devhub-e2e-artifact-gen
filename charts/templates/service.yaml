apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7ec765e4-47da-4f66-b37e-a0f3cf6818e2.fullname" . }}
  labels:
    {{- include "go-echo7ec765e4-47da-4f66-b37e-a0f3cf6818e2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7ec765e4-47da-4f66-b37e-a0f3cf6818e2.selectorLabels" . | nindent 6 }}
