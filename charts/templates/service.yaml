apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8f560afd-6fd1-4c1d-9889-a5fd53b7f973.fullname" . }}
  labels:
    {{- include "go-echo8f560afd-6fd1-4c1d-9889-a5fd53b7f973.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8f560afd-6fd1-4c1d-9889-a5fd53b7f973.selectorLabels" . | nindent 6 }}
