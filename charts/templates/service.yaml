apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo52fbcc67-4dcd-4a90-af4f-a9be611a7378.fullname" . }}
  labels:
    {{- include "go-echo52fbcc67-4dcd-4a90-af4f-a9be611a7378.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo52fbcc67-4dcd-4a90-af4f-a9be611a7378.selectorLabels" . | nindent 6 }}
