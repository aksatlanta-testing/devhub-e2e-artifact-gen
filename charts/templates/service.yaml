apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo80819ebd-4c12-468f-afd3-87bb71488ceb.fullname" . }}
  labels:
    {{- include "go-echo80819ebd-4c12-468f-afd3-87bb71488ceb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo80819ebd-4c12-468f-afd3-87bb71488ceb.selectorLabels" . | nindent 6 }}
