apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1abe3da1-6e44-4d7c-b125-195e58ceebf4.fullname" . }}
  labels:
    {{- include "go-echo1abe3da1-6e44-4d7c-b125-195e58ceebf4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1abe3da1-6e44-4d7c-b125-195e58ceebf4.selectorLabels" . | nindent 6 }}
