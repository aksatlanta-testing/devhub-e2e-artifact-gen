apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe687e434-442d-421c-a9d9-f8748f6f400f.fullname" . }}
  labels:
    {{- include "go-echoe687e434-442d-421c-a9d9-f8748f6f400f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe687e434-442d-421c-a9d9-f8748f6f400f.selectorLabels" . | nindent 6 }}
