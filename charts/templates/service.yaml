apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo86e653bb-9b34-4986-b85d-f8e7abf4ba16.fullname" . }}
  labels:
    {{- include "go-echo86e653bb-9b34-4986-b85d-f8e7abf4ba16.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo86e653bb-9b34-4986-b85d-f8e7abf4ba16.selectorLabels" . | nindent 6 }}
