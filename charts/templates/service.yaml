apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof76a2c3a-338d-4245-a7df-19c116f3f5af.fullname" . }}
  labels:
    {{- include "go-echof76a2c3a-338d-4245-a7df-19c116f3f5af.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof76a2c3a-338d-4245-a7df-19c116f3f5af.selectorLabels" . | nindent 6 }}
