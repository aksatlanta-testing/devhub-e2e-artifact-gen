apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof38b448d-77ad-475e-8024-786e49e719c6.fullname" . }}
  labels:
    {{- include "go-echof38b448d-77ad-475e-8024-786e49e719c6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof38b448d-77ad-475e-8024-786e49e719c6.selectorLabels" . | nindent 6 }}
