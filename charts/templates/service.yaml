apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof8fdb309-8fc4-4a4c-b134-d4bcff22fc3e.fullname" . }}
  labels:
    {{- include "go-echof8fdb309-8fc4-4a4c-b134-d4bcff22fc3e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof8fdb309-8fc4-4a4c-b134-d4bcff22fc3e.selectorLabels" . | nindent 6 }}
