apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod9968c57-c928-4690-bfdb-6b242606cacb.fullname" . }}
  labels:
    {{- include "go-echod9968c57-c928-4690-bfdb-6b242606cacb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod9968c57-c928-4690-bfdb-6b242606cacb.selectorLabels" . | nindent 6 }}
