apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof814b846-4b63-4b10-bb01-da3a0aae888e.fullname" . }}
  labels:
    {{- include "go-echof814b846-4b63-4b10-bb01-da3a0aae888e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof814b846-4b63-4b10-bb01-da3a0aae888e.selectorLabels" . | nindent 6 }}
