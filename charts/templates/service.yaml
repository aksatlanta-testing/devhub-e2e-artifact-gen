apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo61c3cefc-3505-476b-8ff0-277964572b7e.fullname" . }}
  labels:
    {{- include "go-echo61c3cefc-3505-476b-8ff0-277964572b7e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo61c3cefc-3505-476b-8ff0-277964572b7e.selectorLabels" . | nindent 6 }}
