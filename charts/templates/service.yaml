apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7df16d5d-c065-4c54-9d66-b1324e2edd32.fullname" . }}
  labels:
    {{- include "go-echo7df16d5d-c065-4c54-9d66-b1324e2edd32.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7df16d5d-c065-4c54-9d66-b1324e2edd32.selectorLabels" . | nindent 6 }}
