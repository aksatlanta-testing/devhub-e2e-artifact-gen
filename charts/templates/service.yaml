apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2360c9a1-980a-489e-ae4b-5dd59a76f570.fullname" . }}
  labels:
    {{- include "go-echo2360c9a1-980a-489e-ae4b-5dd59a76f570.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2360c9a1-980a-489e-ae4b-5dd59a76f570.selectorLabels" . | nindent 6 }}
