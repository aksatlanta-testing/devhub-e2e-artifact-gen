apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7f618ac7-6442-417f-9208-6e76582ef469.fullname" . }}
  labels:
    {{- include "go-echo7f618ac7-6442-417f-9208-6e76582ef469.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7f618ac7-6442-417f-9208-6e76582ef469.selectorLabels" . | nindent 6 }}
