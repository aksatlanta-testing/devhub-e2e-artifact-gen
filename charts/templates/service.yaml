apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo138dfd5d-3eba-4878-8c8a-c81539830c08.fullname" . }}
  labels:
    {{- include "go-echo138dfd5d-3eba-4878-8c8a-c81539830c08.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo138dfd5d-3eba-4878-8c8a-c81539830c08.selectorLabels" . | nindent 6 }}
