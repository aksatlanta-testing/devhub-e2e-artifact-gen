apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoea543d58-eb15-49e4-8e35-584f8d9469e8.fullname" . }}
  labels:
    {{- include "go-echoea543d58-eb15-49e4-8e35-584f8d9469e8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoea543d58-eb15-49e4-8e35-584f8d9469e8.selectorLabels" . | nindent 6 }}
