apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5b7ca54a-df1e-4959-b820-5efcc52787c1.fullname" . }}
  labels:
    {{- include "go-echo5b7ca54a-df1e-4959-b820-5efcc52787c1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5b7ca54a-df1e-4959-b820-5efcc52787c1.selectorLabels" . | nindent 6 }}
