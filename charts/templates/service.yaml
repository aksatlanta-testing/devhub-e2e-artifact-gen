apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3fd8c9cb-26fe-4b6b-add3-b1543c29c7f5.fullname" . }}
  labels:
    {{- include "go-echo3fd8c9cb-26fe-4b6b-add3-b1543c29c7f5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3fd8c9cb-26fe-4b6b-add3-b1543c29c7f5.selectorLabels" . | nindent 6 }}
