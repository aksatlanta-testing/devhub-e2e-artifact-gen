apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoba32c00e-7c36-40b0-9605-f5ca7b400633.fullname" . }}
  labels:
    {{- include "go-echoba32c00e-7c36-40b0-9605-f5ca7b400633.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoba32c00e-7c36-40b0-9605-f5ca7b400633.selectorLabels" . | nindent 6 }}
