apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo59aebf9c-4bf0-4b8d-91a2-27009f305804.fullname" . }}
  labels:
    {{- include "go-echo59aebf9c-4bf0-4b8d-91a2-27009f305804.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo59aebf9c-4bf0-4b8d-91a2-27009f305804.selectorLabels" . | nindent 6 }}
