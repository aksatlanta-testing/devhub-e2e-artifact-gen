apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofd0a318c-dbbf-4453-95d8-e88b0ab8725c.fullname" . }}
  labels:
    {{- include "go-echofd0a318c-dbbf-4453-95d8-e88b0ab8725c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofd0a318c-dbbf-4453-95d8-e88b0ab8725c.selectorLabels" . | nindent 6 }}
