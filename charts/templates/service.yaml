apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobed60ea2-b6ac-40f2-9424-27b075549623.fullname" . }}
  labels:
    {{- include "go-echobed60ea2-b6ac-40f2-9424-27b075549623.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobed60ea2-b6ac-40f2-9424-27b075549623.selectorLabels" . | nindent 6 }}
