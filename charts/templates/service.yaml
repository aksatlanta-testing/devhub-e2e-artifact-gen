apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa368da5a-25b7-4e21-bd1b-e4f2126d5a26.fullname" . }}
  labels:
    {{- include "go-echoa368da5a-25b7-4e21-bd1b-e4f2126d5a26.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa368da5a-25b7-4e21-bd1b-e4f2126d5a26.selectorLabels" . | nindent 6 }}
