apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoee055c21-df52-4897-9a11-f779b60777de.fullname" . }}
  labels:
    {{- include "go-echoee055c21-df52-4897-9a11-f779b60777de.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoee055c21-df52-4897-9a11-f779b60777de.selectorLabels" . | nindent 6 }}
