apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa3fbb6e4-49de-448e-a522-40bd510c34f7.fullname" . }}
  labels:
    {{- include "go-echoa3fbb6e4-49de-448e-a522-40bd510c34f7.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa3fbb6e4-49de-448e-a522-40bd510c34f7.selectorLabels" . | nindent 6 }}
