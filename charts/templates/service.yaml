apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoece2b34e-b05f-47b2-8bac-ca4ac5eb9448.fullname" . }}
  labels:
    {{- include "go-echoece2b34e-b05f-47b2-8bac-ca4ac5eb9448.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoece2b34e-b05f-47b2-8bac-ca4ac5eb9448.selectorLabels" . | nindent 6 }}
