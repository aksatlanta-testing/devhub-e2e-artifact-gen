apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1a0c213d-b68f-4c88-ba55-4634b53f44a9.fullname" . }}
  labels:
    {{- include "go-echo1a0c213d-b68f-4c88-ba55-4634b53f44a9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1a0c213d-b68f-4c88-ba55-4634b53f44a9.selectorLabels" . | nindent 6 }}
