apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo01ef7675-37b2-480a-af4d-b7cd71007668.fullname" . }}
  labels:
    {{- include "go-echo01ef7675-37b2-480a-af4d-b7cd71007668.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo01ef7675-37b2-480a-af4d-b7cd71007668.selectorLabels" . | nindent 6 }}
