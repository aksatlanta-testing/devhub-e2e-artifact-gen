apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo37935d34-8291-4367-a109-b951e261a955.fullname" . }}
  labels:
    {{- include "go-echo37935d34-8291-4367-a109-b951e261a955.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo37935d34-8291-4367-a109-b951e261a955.selectorLabels" . | nindent 6 }}
