apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc50360d9-31f4-4370-9e8e-1b1afc9f287a.fullname" . }}
  labels:
    {{- include "go-echoc50360d9-31f4-4370-9e8e-1b1afc9f287a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc50360d9-31f4-4370-9e8e-1b1afc9f287a.selectorLabels" . | nindent 6 }}
