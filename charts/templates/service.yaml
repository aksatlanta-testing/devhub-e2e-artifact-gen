apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo15b35a15-5046-4ece-bb67-bb4f095d00ae.fullname" . }}
  labels:
    {{- include "go-echo15b35a15-5046-4ece-bb67-bb4f095d00ae.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo15b35a15-5046-4ece-bb67-bb4f095d00ae.selectorLabels" . | nindent 6 }}
