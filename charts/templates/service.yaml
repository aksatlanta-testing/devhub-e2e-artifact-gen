apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8c7d4b22-b8e3-4673-9548-8b87d22ea51a.fullname" . }}
  labels:
    {{- include "go-echo8c7d4b22-b8e3-4673-9548-8b87d22ea51a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8c7d4b22-b8e3-4673-9548-8b87d22ea51a.selectorLabels" . | nindent 6 }}
