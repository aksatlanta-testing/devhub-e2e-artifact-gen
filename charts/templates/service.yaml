apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoca85d1cf-e6b6-474c-a5a3-94eb66c3364f.fullname" . }}
  labels:
    {{- include "go-echoca85d1cf-e6b6-474c-a5a3-94eb66c3364f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoca85d1cf-e6b6-474c-a5a3-94eb66c3364f.selectorLabels" . | nindent 6 }}
