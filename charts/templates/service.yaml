apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod924a372-e48d-4073-ab5a-eabd4dc2129a.fullname" . }}
  labels:
    {{- include "go-echod924a372-e48d-4073-ab5a-eabd4dc2129a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod924a372-e48d-4073-ab5a-eabd4dc2129a.selectorLabels" . | nindent 6 }}
