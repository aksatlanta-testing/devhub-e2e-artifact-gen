apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofb9839e7-fe87-41ce-917c-7083451cc724.fullname" . }}
  labels:
    {{- include "go-echofb9839e7-fe87-41ce-917c-7083451cc724.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofb9839e7-fe87-41ce-917c-7083451cc724.selectorLabels" . | nindent 6 }}
