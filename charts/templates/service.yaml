apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo837cfbf7-e785-4291-ad35-d25e2bcb683f.fullname" . }}
  labels:
    {{- include "go-echo837cfbf7-e785-4291-ad35-d25e2bcb683f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo837cfbf7-e785-4291-ad35-d25e2bcb683f.selectorLabels" . | nindent 6 }}
