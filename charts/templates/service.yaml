apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo563b941d-f86a-4d7d-ae8d-360b5f897352.fullname" . }}
  labels:
    {{- include "go-echo563b941d-f86a-4d7d-ae8d-360b5f897352.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo563b941d-f86a-4d7d-ae8d-360b5f897352.selectorLabels" . | nindent 6 }}
