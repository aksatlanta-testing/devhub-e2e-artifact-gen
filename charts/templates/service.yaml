apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod1e96ec4-d57e-411e-a040-935f33fc136f.fullname" . }}
  labels:
    {{- include "go-echod1e96ec4-d57e-411e-a040-935f33fc136f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod1e96ec4-d57e-411e-a040-935f33fc136f.selectorLabels" . | nindent 6 }}
