apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4bfbde28-2fb3-4459-9fb5-ba8e5e79c53f.fullname" . }}
  labels:
    {{- include "go-echo4bfbde28-2fb3-4459-9fb5-ba8e5e79c53f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4bfbde28-2fb3-4459-9fb5-ba8e5e79c53f.selectorLabels" . | nindent 6 }}
