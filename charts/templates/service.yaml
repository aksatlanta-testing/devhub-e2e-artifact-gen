apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc1962f54-ba2b-4d59-ab86-2a9723b6eb09.fullname" . }}
  labels:
    {{- include "go-echoc1962f54-ba2b-4d59-ab86-2a9723b6eb09.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc1962f54-ba2b-4d59-ab86-2a9723b6eb09.selectorLabels" . | nindent 6 }}
