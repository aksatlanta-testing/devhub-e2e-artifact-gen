apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo06812598-f97d-456d-8a90-6010f830b307.fullname" . }}
  labels:
    {{- include "go-echo06812598-f97d-456d-8a90-6010f830b307.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo06812598-f97d-456d-8a90-6010f830b307.selectorLabels" . | nindent 6 }}
