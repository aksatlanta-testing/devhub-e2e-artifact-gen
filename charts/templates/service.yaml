apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo95dbb477-4fff-49a4-b12e-8f199082f881.fullname" . }}
  labels:
    {{- include "go-echo95dbb477-4fff-49a4-b12e-8f199082f881.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo95dbb477-4fff-49a4-b12e-8f199082f881.selectorLabels" . | nindent 6 }}
