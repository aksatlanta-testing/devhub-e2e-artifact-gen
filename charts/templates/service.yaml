apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo81986ed8-6bfe-4b3f-a01d-9f6f753a23e4.fullname" . }}
  labels:
    {{- include "go-echo81986ed8-6bfe-4b3f-a01d-9f6f753a23e4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo81986ed8-6bfe-4b3f-a01d-9f6f753a23e4.selectorLabels" . | nindent 6 }}
