apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo33c61ad3-0547-4b1f-a16b-8a317d0b291b.fullname" . }}
  labels:
    {{- include "go-echo33c61ad3-0547-4b1f-a16b-8a317d0b291b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo33c61ad3-0547-4b1f-a16b-8a317d0b291b.selectorLabels" . | nindent 6 }}
