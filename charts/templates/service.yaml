apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3b333c19-11ab-48f5-9864-89b32ab93843.fullname" . }}
  labels:
    {{- include "go-echo3b333c19-11ab-48f5-9864-89b32ab93843.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3b333c19-11ab-48f5-9864-89b32ab93843.selectorLabels" . | nindent 6 }}
