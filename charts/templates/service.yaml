apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0159d123-c6e2-4eb0-9fa0-7aef64f1bf17.fullname" . }}
  labels:
    {{- include "go-echo0159d123-c6e2-4eb0-9fa0-7aef64f1bf17.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0159d123-c6e2-4eb0-9fa0-7aef64f1bf17.selectorLabels" . | nindent 6 }}
