apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7b6b5f15-4d93-49ca-8aff-c1f1b7f85915.fullname" . }}
  labels:
    {{- include "go-echo7b6b5f15-4d93-49ca-8aff-c1f1b7f85915.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7b6b5f15-4d93-49ca-8aff-c1f1b7f85915.selectorLabels" . | nindent 6 }}
