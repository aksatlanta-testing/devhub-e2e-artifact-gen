apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8cb7fb93-5df6-4300-99c1-e14d50712858.fullname" . }}
  labels:
    {{- include "go-echo8cb7fb93-5df6-4300-99c1-e14d50712858.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8cb7fb93-5df6-4300-99c1-e14d50712858.selectorLabels" . | nindent 6 }}
