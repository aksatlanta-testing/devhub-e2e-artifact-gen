apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2eca2e97-c93d-4071-8adb-780aa1b22a3e.fullname" . }}
  labels:
    {{- include "go-echo2eca2e97-c93d-4071-8adb-780aa1b22a3e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2eca2e97-c93d-4071-8adb-780aa1b22a3e.selectorLabels" . | nindent 6 }}
