apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo79504bd0-cf0b-44d4-bc21-41e3cb5a5028.fullname" . }}
  labels:
    {{- include "go-echo79504bd0-cf0b-44d4-bc21-41e3cb5a5028.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo79504bd0-cf0b-44d4-bc21-41e3cb5a5028.selectorLabels" . | nindent 6 }}
