apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo62769a36-a270-4d08-a7fc-d0ddd9e0ed19.fullname" . }}
  labels:
    {{- include "go-echo62769a36-a270-4d08-a7fc-d0ddd9e0ed19.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo62769a36-a270-4d08-a7fc-d0ddd9e0ed19.selectorLabels" . | nindent 6 }}
