apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6a1d36e7-b648-43bf-9f73-64c24044af88.fullname" . }}
  labels:
    {{- include "go-echo6a1d36e7-b648-43bf-9f73-64c24044af88.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6a1d36e7-b648-43bf-9f73-64c24044af88.selectorLabels" . | nindent 6 }}
