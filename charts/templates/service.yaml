apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5917d4de-6ede-49ee-8e64-5287b32152c2.fullname" . }}
  labels:
    {{- include "go-echo5917d4de-6ede-49ee-8e64-5287b32152c2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5917d4de-6ede-49ee-8e64-5287b32152c2.selectorLabels" . | nindent 6 }}
