apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof107e59b-0a21-45fd-9fd7-62d5d6a09641.fullname" . }}
  labels:
    {{- include "go-echof107e59b-0a21-45fd-9fd7-62d5d6a09641.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof107e59b-0a21-45fd-9fd7-62d5d6a09641.selectorLabels" . | nindent 6 }}
