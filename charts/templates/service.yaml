apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo77fbf439-c22e-4744-af77-d63f05c9265c.fullname" . }}
  labels:
    {{- include "go-echo77fbf439-c22e-4744-af77-d63f05c9265c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo77fbf439-c22e-4744-af77-d63f05c9265c.selectorLabels" . | nindent 6 }}
