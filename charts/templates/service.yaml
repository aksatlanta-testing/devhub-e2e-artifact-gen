apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa039f65f-4dc3-411a-adfb-10b2c8939815.fullname" . }}
  labels:
    {{- include "go-echoa039f65f-4dc3-411a-adfb-10b2c8939815.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa039f65f-4dc3-411a-adfb-10b2c8939815.selectorLabels" . | nindent 6 }}
