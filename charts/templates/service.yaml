apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9b4e78c6-a720-4df5-b991-5587a229fef9.fullname" . }}
  labels:
    {{- include "go-echo9b4e78c6-a720-4df5-b991-5587a229fef9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9b4e78c6-a720-4df5-b991-5587a229fef9.selectorLabels" . | nindent 6 }}
