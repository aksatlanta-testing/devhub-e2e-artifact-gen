apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofef54758-b355-4707-aeaa-07b8d640088e.fullname" . }}
  labels:
    {{- include "go-echofef54758-b355-4707-aeaa-07b8d640088e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofef54758-b355-4707-aeaa-07b8d640088e.selectorLabels" . | nindent 6 }}
