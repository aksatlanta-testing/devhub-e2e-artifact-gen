apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocd4cb4bc-7ee4-4e71-b872-3b61549508f0.fullname" . }}
  labels:
    {{- include "go-echocd4cb4bc-7ee4-4e71-b872-3b61549508f0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocd4cb4bc-7ee4-4e71-b872-3b61549508f0.selectorLabels" . | nindent 6 }}
