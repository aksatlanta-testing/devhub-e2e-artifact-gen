apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo34a9ec73-c0db-409b-8571-1e0d117536df.fullname" . }}
  labels:
    {{- include "go-echo34a9ec73-c0db-409b-8571-1e0d117536df.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo34a9ec73-c0db-409b-8571-1e0d117536df.selectorLabels" . | nindent 6 }}
