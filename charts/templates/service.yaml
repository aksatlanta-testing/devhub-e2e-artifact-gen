apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod5f9cfed-225e-4579-88b2-5a99208181be.fullname" . }}
  labels:
    {{- include "go-echod5f9cfed-225e-4579-88b2-5a99208181be.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod5f9cfed-225e-4579-88b2-5a99208181be.selectorLabels" . | nindent 6 }}
