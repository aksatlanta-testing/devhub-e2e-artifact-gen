apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0a76fdc1-93a8-4d18-a6c4-794f1340fc72.fullname" . }}
  labels:
    {{- include "go-echo0a76fdc1-93a8-4d18-a6c4-794f1340fc72.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0a76fdc1-93a8-4d18-a6c4-794f1340fc72.selectorLabels" . | nindent 6 }}
