apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod6f2ce3e-21af-40d3-9d1a-38cfc2e6ad25.fullname" . }}
  labels:
    {{- include "go-echod6f2ce3e-21af-40d3-9d1a-38cfc2e6ad25.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod6f2ce3e-21af-40d3-9d1a-38cfc2e6ad25.selectorLabels" . | nindent 6 }}
