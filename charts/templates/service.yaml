apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4fe623f6-4e9b-4fdb-ae93-c602032f7fe5.fullname" . }}
  labels:
    {{- include "go-echo4fe623f6-4e9b-4fdb-ae93-c602032f7fe5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4fe623f6-4e9b-4fdb-ae93-c602032f7fe5.selectorLabels" . | nindent 6 }}
