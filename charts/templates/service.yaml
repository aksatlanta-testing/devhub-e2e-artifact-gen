apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4259b5c3-586f-4a68-8db4-66348a471f65.fullname" . }}
  labels:
    {{- include "go-echo4259b5c3-586f-4a68-8db4-66348a471f65.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4259b5c3-586f-4a68-8db4-66348a471f65.selectorLabels" . | nindent 6 }}
