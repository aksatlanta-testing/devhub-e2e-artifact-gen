apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa80a315a-a354-4dff-84c3-41bbb5bb4f84.fullname" . }}
  labels:
    {{- include "go-echoa80a315a-a354-4dff-84c3-41bbb5bb4f84.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa80a315a-a354-4dff-84c3-41bbb5bb4f84.selectorLabels" . | nindent 6 }}
