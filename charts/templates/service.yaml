apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobd20196e-074b-4f58-a358-da409ab1adc8.fullname" . }}
  labels:
    {{- include "go-echobd20196e-074b-4f58-a358-da409ab1adc8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobd20196e-074b-4f58-a358-da409ab1adc8.selectorLabels" . | nindent 6 }}
