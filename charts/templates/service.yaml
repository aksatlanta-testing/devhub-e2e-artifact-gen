apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo836258bd-0cb8-45e9-b434-fa96ef363926.fullname" . }}
  labels:
    {{- include "go-echo836258bd-0cb8-45e9-b434-fa96ef363926.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo836258bd-0cb8-45e9-b434-fa96ef363926.selectorLabels" . | nindent 6 }}
