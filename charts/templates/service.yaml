apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo98f6d8dd-6165-482c-826a-e9aedddc71e8.fullname" . }}
  labels:
    {{- include "go-echo98f6d8dd-6165-482c-826a-e9aedddc71e8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo98f6d8dd-6165-482c-826a-e9aedddc71e8.selectorLabels" . | nindent 6 }}
