apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo726b8306-96eb-49b0-8b3e-4559c61002cf.fullname" . }}
  labels:
    {{- include "go-echo726b8306-96eb-49b0-8b3e-4559c61002cf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo726b8306-96eb-49b0-8b3e-4559c61002cf.selectorLabels" . | nindent 6 }}
