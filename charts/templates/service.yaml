apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod5acba82-1b45-4a21-8882-80d978edb45e.fullname" . }}
  labels:
    {{- include "go-echod5acba82-1b45-4a21-8882-80d978edb45e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod5acba82-1b45-4a21-8882-80d978edb45e.selectorLabels" . | nindent 6 }}
