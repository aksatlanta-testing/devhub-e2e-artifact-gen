apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2333c661-39dc-4917-b618-9737ac948b57.fullname" . }}
  labels:
    {{- include "go-echo2333c661-39dc-4917-b618-9737ac948b57.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2333c661-39dc-4917-b618-9737ac948b57.selectorLabels" . | nindent 6 }}
