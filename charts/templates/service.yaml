apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob22695f8-25e4-492e-bd84-a13c2092ca9e.fullname" . }}
  labels:
    {{- include "go-echob22695f8-25e4-492e-bd84-a13c2092ca9e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob22695f8-25e4-492e-bd84-a13c2092ca9e.selectorLabels" . | nindent 6 }}
