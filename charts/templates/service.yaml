apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodfef2da7-0a9b-4609-b1d1-b3abde7689d7.fullname" . }}
  labels:
    {{- include "go-echodfef2da7-0a9b-4609-b1d1-b3abde7689d7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodfef2da7-0a9b-4609-b1d1-b3abde7689d7.selectorLabels" . | nindent 6 }}
