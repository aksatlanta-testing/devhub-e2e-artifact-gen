apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo223a9044-4b4f-4f9c-a28a-008a01ec5e6f.fullname" . }}
  labels:
    {{- include "go-echo223a9044-4b4f-4f9c-a28a-008a01ec5e6f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo223a9044-4b4f-4f9c-a28a-008a01ec5e6f.selectorLabels" . | nindent 6 }}
