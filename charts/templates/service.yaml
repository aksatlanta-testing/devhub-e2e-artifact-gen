apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9b59a371-05f2-457c-9903-333a9e2431ee.fullname" . }}
  labels:
    {{- include "go-echo9b59a371-05f2-457c-9903-333a9e2431ee.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9b59a371-05f2-457c-9903-333a9e2431ee.selectorLabels" . | nindent 6 }}
