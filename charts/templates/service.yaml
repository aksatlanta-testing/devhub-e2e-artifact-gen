apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo40f77233-f7ad-455d-b491-cd3320a51379.fullname" . }}
  labels:
    {{- include "go-echo40f77233-f7ad-455d-b491-cd3320a51379.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo40f77233-f7ad-455d-b491-cd3320a51379.selectorLabels" . | nindent 6 }}
