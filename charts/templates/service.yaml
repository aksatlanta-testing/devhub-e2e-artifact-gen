apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob242a4ec-157d-4987-a2e5-4d3c64b90231.fullname" . }}
  labels:
    {{- include "go-echob242a4ec-157d-4987-a2e5-4d3c64b90231.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob242a4ec-157d-4987-a2e5-4d3c64b90231.selectorLabels" . | nindent 6 }}
