apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8f960a7b-abf7-4f8f-a75a-fa4b14d4a2cc.fullname" . }}
  labels:
    {{- include "go-echo8f960a7b-abf7-4f8f-a75a-fa4b14d4a2cc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8f960a7b-abf7-4f8f-a75a-fa4b14d4a2cc.selectorLabels" . | nindent 6 }}
