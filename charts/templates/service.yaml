apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0cde340b-3265-43b5-8ed7-c6bcc84a7c88.fullname" . }}
  labels:
    {{- include "go-echo0cde340b-3265-43b5-8ed7-c6bcc84a7c88.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0cde340b-3265-43b5-8ed7-c6bcc84a7c88.selectorLabels" . | nindent 6 }}
