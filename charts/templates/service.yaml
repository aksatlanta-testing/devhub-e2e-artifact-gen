apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob13847d6-044d-44a5-bff6-a806e85ba949.fullname" . }}
  labels:
    {{- include "go-echob13847d6-044d-44a5-bff6-a806e85ba949.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob13847d6-044d-44a5-bff6-a806e85ba949.selectorLabels" . | nindent 6 }}
