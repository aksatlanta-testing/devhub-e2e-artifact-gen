apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa74609eb-5765-442c-a522-c7e31e176e01.fullname" . }}
  labels:
    {{- include "go-echoa74609eb-5765-442c-a522-c7e31e176e01.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa74609eb-5765-442c-a522-c7e31e176e01.selectorLabels" . | nindent 6 }}
