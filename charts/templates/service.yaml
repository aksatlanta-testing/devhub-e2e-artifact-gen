apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo685a21ca-383a-45b2-a6c8-dc4fe100f281.fullname" . }}
  labels:
    {{- include "go-echo685a21ca-383a-45b2-a6c8-dc4fe100f281.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo685a21ca-383a-45b2-a6c8-dc4fe100f281.selectorLabels" . | nindent 6 }}
