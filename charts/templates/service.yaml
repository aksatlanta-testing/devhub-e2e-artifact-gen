apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa775e0a7-d549-40a2-927d-61030a05a098.fullname" . }}
  labels:
    {{- include "go-echoa775e0a7-d549-40a2-927d-61030a05a098.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa775e0a7-d549-40a2-927d-61030a05a098.selectorLabels" . | nindent 6 }}
