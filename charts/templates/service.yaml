apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo57d3d910-ddb1-4957-abc6-cd91b8643e22.fullname" . }}
  labels:
    {{- include "go-echo57d3d910-ddb1-4957-abc6-cd91b8643e22.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo57d3d910-ddb1-4957-abc6-cd91b8643e22.selectorLabels" . | nindent 6 }}
