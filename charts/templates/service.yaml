apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoac3b544c-9810-4a5d-a37d-2b45f5026df5.fullname" . }}
  labels:
    {{- include "go-echoac3b544c-9810-4a5d-a37d-2b45f5026df5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoac3b544c-9810-4a5d-a37d-2b45f5026df5.selectorLabels" . | nindent 6 }}
