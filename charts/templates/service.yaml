apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo76a24fa2-6720-499f-ab31-5c6442b57f21.fullname" . }}
  labels:
    {{- include "go-echo76a24fa2-6720-499f-ab31-5c6442b57f21.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo76a24fa2-6720-499f-ab31-5c6442b57f21.selectorLabels" . | nindent 6 }}
