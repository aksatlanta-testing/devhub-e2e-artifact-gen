apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo279dc3a6-4151-4596-a6d0-b6106f47268f.fullname" . }}
  labels:
    {{- include "go-echo279dc3a6-4151-4596-a6d0-b6106f47268f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo279dc3a6-4151-4596-a6d0-b6106f47268f.selectorLabels" . | nindent 6 }}
