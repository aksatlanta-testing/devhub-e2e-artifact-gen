apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodcdd6920-3f27-49ca-a0c9-407c9aa353c3.fullname" . }}
  labels:
    {{- include "go-echodcdd6920-3f27-49ca-a0c9-407c9aa353c3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodcdd6920-3f27-49ca-a0c9-407c9aa353c3.selectorLabels" . | nindent 6 }}
