apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo94ccee2d-b390-48ef-8a75-4aeb3452b861.fullname" . }}
  labels:
    {{- include "go-echo94ccee2d-b390-48ef-8a75-4aeb3452b861.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo94ccee2d-b390-48ef-8a75-4aeb3452b861.selectorLabels" . | nindent 6 }}
