apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo04b7c8c6-538c-4657-947a-5bf79b4b0ad6.fullname" . }}
  labels:
    {{- include "go-echo04b7c8c6-538c-4657-947a-5bf79b4b0ad6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo04b7c8c6-538c-4657-947a-5bf79b4b0ad6.selectorLabels" . | nindent 6 }}
