apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoed0e8107-2b7b-4b89-ad53-d412aec521cc.fullname" . }}
  labels:
    {{- include "go-echoed0e8107-2b7b-4b89-ad53-d412aec521cc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoed0e8107-2b7b-4b89-ad53-d412aec521cc.selectorLabels" . | nindent 6 }}
