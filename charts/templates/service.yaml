apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo888e0d77-6fac-4a0e-9586-d46b8b441b33.fullname" . }}
  labels:
    {{- include "go-echo888e0d77-6fac-4a0e-9586-d46b8b441b33.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo888e0d77-6fac-4a0e-9586-d46b8b441b33.selectorLabels" . | nindent 6 }}
