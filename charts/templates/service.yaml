apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo52b8b833-f993-4c3e-8d42-9b3538a3d2f4.fullname" . }}
  labels:
    {{- include "go-echo52b8b833-f993-4c3e-8d42-9b3538a3d2f4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo52b8b833-f993-4c3e-8d42-9b3538a3d2f4.selectorLabels" . | nindent 6 }}
