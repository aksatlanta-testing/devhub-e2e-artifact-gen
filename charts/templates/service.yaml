apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2e2cf57c-b553-4174-90dc-c2259b5ea100.fullname" . }}
  labels:
    {{- include "go-echo2e2cf57c-b553-4174-90dc-c2259b5ea100.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2e2cf57c-b553-4174-90dc-c2259b5ea100.selectorLabels" . | nindent 6 }}
