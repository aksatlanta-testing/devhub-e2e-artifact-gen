apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6675094a-8d48-491d-85f5-ae7881939bae.fullname" . }}
  labels:
    {{- include "go-echo6675094a-8d48-491d-85f5-ae7881939bae.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6675094a-8d48-491d-85f5-ae7881939bae.selectorLabels" . | nindent 6 }}
