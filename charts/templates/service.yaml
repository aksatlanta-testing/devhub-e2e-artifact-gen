apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo014bd8fc-e0ca-4d5a-abc2-d5a0bbaa8e91.fullname" . }}
  labels:
    {{- include "go-echo014bd8fc-e0ca-4d5a-abc2-d5a0bbaa8e91.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo014bd8fc-e0ca-4d5a-abc2-d5a0bbaa8e91.selectorLabels" . | nindent 6 }}
