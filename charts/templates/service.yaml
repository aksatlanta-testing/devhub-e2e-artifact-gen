apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7cac725b-dfd1-40e2-94c1-54e0b851943d.fullname" . }}
  labels:
    {{- include "go-echo7cac725b-dfd1-40e2-94c1-54e0b851943d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7cac725b-dfd1-40e2-94c1-54e0b851943d.selectorLabels" . | nindent 6 }}
