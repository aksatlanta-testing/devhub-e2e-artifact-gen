apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9f4304e5-38cb-495f-9698-53b6aa647816.fullname" . }}
  labels:
    {{- include "go-echo9f4304e5-38cb-495f-9698-53b6aa647816.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9f4304e5-38cb-495f-9698-53b6aa647816.selectorLabels" . | nindent 6 }}
