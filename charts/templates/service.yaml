apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6fa3caea-ddc5-4e1d-90c0-628c0ab674ac.fullname" . }}
  labels:
    {{- include "go-echo6fa3caea-ddc5-4e1d-90c0-628c0ab674ac.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6fa3caea-ddc5-4e1d-90c0-628c0ab674ac.selectorLabels" . | nindent 6 }}
