apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1d4f2583-56b2-4e7c-aa9b-cc2fa46a8116.fullname" . }}
  labels:
    {{- include "go-echo1d4f2583-56b2-4e7c-aa9b-cc2fa46a8116.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1d4f2583-56b2-4e7c-aa9b-cc2fa46a8116.selectorLabels" . | nindent 6 }}
