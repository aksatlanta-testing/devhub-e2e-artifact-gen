apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo24c5081c-ee99-4221-b650-9a2c197a1d92.fullname" . }}
  labels:
    {{- include "go-echo24c5081c-ee99-4221-b650-9a2c197a1d92.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo24c5081c-ee99-4221-b650-9a2c197a1d92.selectorLabels" . | nindent 6 }}
