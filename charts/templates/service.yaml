apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobe8d5736-c0b2-43ef-a5bc-9649e9276f17.fullname" . }}
  labels:
    {{- include "go-echobe8d5736-c0b2-43ef-a5bc-9649e9276f17.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobe8d5736-c0b2-43ef-a5bc-9649e9276f17.selectorLabels" . | nindent 6 }}
