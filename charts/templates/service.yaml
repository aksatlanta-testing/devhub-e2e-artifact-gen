apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa09e9f93-24a3-4a0a-8473-c784a3f4e7b8.fullname" . }}
  labels:
    {{- include "go-echoa09e9f93-24a3-4a0a-8473-c784a3f4e7b8.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa09e9f93-24a3-4a0a-8473-c784a3f4e7b8.selectorLabels" . | nindent 6 }}
