apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoda8fc6f6-361e-4fa7-8256-c94675b03dae.fullname" . }}
  labels:
    {{- include "go-echoda8fc6f6-361e-4fa7-8256-c94675b03dae.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoda8fc6f6-361e-4fa7-8256-c94675b03dae.selectorLabels" . | nindent 6 }}
