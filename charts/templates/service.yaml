apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo58464c80-9457-479e-af5c-9636136205f0.fullname" . }}
  labels:
    {{- include "go-echo58464c80-9457-479e-af5c-9636136205f0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo58464c80-9457-479e-af5c-9636136205f0.selectorLabels" . | nindent 6 }}
