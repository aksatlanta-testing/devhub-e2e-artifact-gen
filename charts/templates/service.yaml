apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob2625b6f-ba7a-44cc-a67d-a06399bfda8f.fullname" . }}
  labels:
    {{- include "go-echob2625b6f-ba7a-44cc-a67d-a06399bfda8f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob2625b6f-ba7a-44cc-a67d-a06399bfda8f.selectorLabels" . | nindent 6 }}
