apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5aed8dd4-f0bb-4fad-b99f-763cd9b34c00.fullname" . }}
  labels:
    {{- include "go-echo5aed8dd4-f0bb-4fad-b99f-763cd9b34c00.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5aed8dd4-f0bb-4fad-b99f-763cd9b34c00.selectorLabels" . | nindent 6 }}
