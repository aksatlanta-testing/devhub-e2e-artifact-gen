apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc228ad02-8afa-4381-a569-944e5e2749ca.fullname" . }}
  labels:
    {{- include "go-echoc228ad02-8afa-4381-a569-944e5e2749ca.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc228ad02-8afa-4381-a569-944e5e2749ca.selectorLabels" . | nindent 6 }}
