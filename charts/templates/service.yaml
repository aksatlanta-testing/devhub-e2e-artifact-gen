apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo609082a7-8110-4ba3-8f2f-2b34de69c3b5.fullname" . }}
  labels:
    {{- include "go-echo609082a7-8110-4ba3-8f2f-2b34de69c3b5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo609082a7-8110-4ba3-8f2f-2b34de69c3b5.selectorLabels" . | nindent 6 }}
