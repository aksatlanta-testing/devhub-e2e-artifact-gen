apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa47667c0-9b02-4a2e-87ae-7b2b8d32e338.fullname" . }}
  labels:
    {{- include "go-echoa47667c0-9b02-4a2e-87ae-7b2b8d32e338.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa47667c0-9b02-4a2e-87ae-7b2b8d32e338.selectorLabels" . | nindent 6 }}
