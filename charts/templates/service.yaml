apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo07f19568-08aa-477f-8e2a-13f0302c0973.fullname" . }}
  labels:
    {{- include "go-echo07f19568-08aa-477f-8e2a-13f0302c0973.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo07f19568-08aa-477f-8e2a-13f0302c0973.selectorLabels" . | nindent 6 }}
