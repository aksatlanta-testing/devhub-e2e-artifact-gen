apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5198bd80-5867-4ee4-aa46-33ce9e428ce1.fullname" . }}
  labels:
    {{- include "go-echo5198bd80-5867-4ee4-aa46-33ce9e428ce1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5198bd80-5867-4ee4-aa46-33ce9e428ce1.selectorLabels" . | nindent 6 }}
