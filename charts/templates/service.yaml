apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo00face5a-6732-45f2-8816-25d3e77f8c7a.fullname" . }}
  labels:
    {{- include "go-echo00face5a-6732-45f2-8816-25d3e77f8c7a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo00face5a-6732-45f2-8816-25d3e77f8c7a.selectorLabels" . | nindent 6 }}
