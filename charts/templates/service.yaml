apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3d0f3b8a-60da-40f5-a4e8-4875cfff1061.fullname" . }}
  labels:
    {{- include "go-echo3d0f3b8a-60da-40f5-a4e8-4875cfff1061.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3d0f3b8a-60da-40f5-a4e8-4875cfff1061.selectorLabels" . | nindent 6 }}
