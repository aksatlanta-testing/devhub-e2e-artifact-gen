apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo75681a23-a705-4e5b-a379-17d43401898e.fullname" . }}
  labels:
    {{- include "go-echo75681a23-a705-4e5b-a379-17d43401898e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo75681a23-a705-4e5b-a379-17d43401898e.selectorLabels" . | nindent 6 }}
