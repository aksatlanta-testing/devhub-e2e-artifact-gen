apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo785f0442-cabd-4b11-9eda-f8d533652df5.fullname" . }}
  labels:
    {{- include "go-echo785f0442-cabd-4b11-9eda-f8d533652df5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo785f0442-cabd-4b11-9eda-f8d533652df5.selectorLabels" . | nindent 6 }}
