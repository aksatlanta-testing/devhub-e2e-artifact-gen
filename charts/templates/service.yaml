apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo484f2837-3419-40c0-b18d-e6e8b0539776.fullname" . }}
  labels:
    {{- include "go-echo484f2837-3419-40c0-b18d-e6e8b0539776.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo484f2837-3419-40c0-b18d-e6e8b0539776.selectorLabels" . | nindent 6 }}
