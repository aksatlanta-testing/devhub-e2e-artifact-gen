apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6217b259-ab63-4be0-8549-84fbb4990427.fullname" . }}
  labels:
    {{- include "go-echo6217b259-ab63-4be0-8549-84fbb4990427.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6217b259-ab63-4be0-8549-84fbb4990427.selectorLabels" . | nindent 6 }}
