apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc4311eff-b999-4c8f-846a-c79e47c2d25f.fullname" . }}
  labels:
    {{- include "go-echoc4311eff-b999-4c8f-846a-c79e47c2d25f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc4311eff-b999-4c8f-846a-c79e47c2d25f.selectorLabels" . | nindent 6 }}
