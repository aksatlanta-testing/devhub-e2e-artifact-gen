apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3e4f35f0-7a48-4a35-9101-1059beade9ac.fullname" . }}
  labels:
    {{- include "go-echo3e4f35f0-7a48-4a35-9101-1059beade9ac.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3e4f35f0-7a48-4a35-9101-1059beade9ac.selectorLabels" . | nindent 6 }}
