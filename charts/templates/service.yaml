apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4d049bd4-e9f2-4f33-a0ae-7b70ff1a814e.fullname" . }}
  labels:
    {{- include "go-echo4d049bd4-e9f2-4f33-a0ae-7b70ff1a814e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4d049bd4-e9f2-4f33-a0ae-7b70ff1a814e.selectorLabels" . | nindent 6 }}
