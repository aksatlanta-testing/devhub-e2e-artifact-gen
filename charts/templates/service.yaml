apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7c5f116e-74f3-49f0-9e50-c37b90541311.fullname" . }}
  labels:
    {{- include "go-echo7c5f116e-74f3-49f0-9e50-c37b90541311.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7c5f116e-74f3-49f0-9e50-c37b90541311.selectorLabels" . | nindent 6 }}
