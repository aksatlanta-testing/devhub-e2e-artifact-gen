apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof376b206-783f-415d-b341-eb23e1718ab8.fullname" . }}
  labels:
    {{- include "go-echof376b206-783f-415d-b341-eb23e1718ab8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof376b206-783f-415d-b341-eb23e1718ab8.selectorLabels" . | nindent 6 }}
