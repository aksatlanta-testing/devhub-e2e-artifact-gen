apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo215725ab-3a56-4515-a3e0-2cf12d4ccfab.fullname" . }}
  labels:
    {{- include "go-echo215725ab-3a56-4515-a3e0-2cf12d4ccfab.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo215725ab-3a56-4515-a3e0-2cf12d4ccfab.selectorLabels" . | nindent 6 }}
