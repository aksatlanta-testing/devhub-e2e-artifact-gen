apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9655ac0a-7a8d-43c6-9b6f-4109bf7bd46a.fullname" . }}
  labels:
    {{- include "go-echo9655ac0a-7a8d-43c6-9b6f-4109bf7bd46a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9655ac0a-7a8d-43c6-9b6f-4109bf7bd46a.selectorLabels" . | nindent 6 }}
