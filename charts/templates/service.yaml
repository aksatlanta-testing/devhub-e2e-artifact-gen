apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofae1c5a1-14f8-4035-85b7-43e83fb7e3e4.fullname" . }}
  labels:
    {{- include "go-echofae1c5a1-14f8-4035-85b7-43e83fb7e3e4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofae1c5a1-14f8-4035-85b7-43e83fb7e3e4.selectorLabels" . | nindent 6 }}
