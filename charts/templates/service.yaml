apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof5232ba5-2ddd-4981-97e6-59247da44672.fullname" . }}
  labels:
    {{- include "go-echof5232ba5-2ddd-4981-97e6-59247da44672.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof5232ba5-2ddd-4981-97e6-59247da44672.selectorLabels" . | nindent 6 }}
