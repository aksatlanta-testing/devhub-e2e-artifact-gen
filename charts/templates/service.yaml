apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc1e047fb-8b2f-4fe4-b0de-2eda3c0798c2.fullname" . }}
  labels:
    {{- include "go-echoc1e047fb-8b2f-4fe4-b0de-2eda3c0798c2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc1e047fb-8b2f-4fe4-b0de-2eda3c0798c2.selectorLabels" . | nindent 6 }}
