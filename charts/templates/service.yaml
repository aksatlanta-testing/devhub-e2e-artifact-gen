apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoff2706a5-9d97-4c02-adb7-bfc34742d7cb.fullname" . }}
  labels:
    {{- include "go-echoff2706a5-9d97-4c02-adb7-bfc34742d7cb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoff2706a5-9d97-4c02-adb7-bfc34742d7cb.selectorLabels" . | nindent 6 }}
