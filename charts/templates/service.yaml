apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echode525653-3141-4cad-8355-3165ba76a65b.fullname" . }}
  labels:
    {{- include "go-echode525653-3141-4cad-8355-3165ba76a65b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echode525653-3141-4cad-8355-3165ba76a65b.selectorLabels" . | nindent 6 }}
