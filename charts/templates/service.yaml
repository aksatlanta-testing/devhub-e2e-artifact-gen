apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo82897285-b6a6-4686-847d-25cd4e576ced.fullname" . }}
  labels:
    {{- include "go-echo82897285-b6a6-4686-847d-25cd4e576ced.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo82897285-b6a6-4686-847d-25cd4e576ced.selectorLabels" . | nindent 6 }}
