apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoef1fb6b0-ab36-4aab-9a32-ec8b7f36b301.fullname" . }}
  labels:
    {{- include "go-echoef1fb6b0-ab36-4aab-9a32-ec8b7f36b301.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoef1fb6b0-ab36-4aab-9a32-ec8b7f36b301.selectorLabels" . | nindent 6 }}
