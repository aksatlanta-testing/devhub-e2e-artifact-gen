apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc2833407-b1f6-4d95-8ed1-8bdeba6fd6d7.fullname" . }}
  labels:
    {{- include "go-echoc2833407-b1f6-4d95-8ed1-8bdeba6fd6d7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc2833407-b1f6-4d95-8ed1-8bdeba6fd6d7.selectorLabels" . | nindent 6 }}
