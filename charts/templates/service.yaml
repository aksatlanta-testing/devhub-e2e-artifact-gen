apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7002454f-d385-4b92-9568-3d2fecf70512.fullname" . }}
  labels:
    {{- include "go-echo7002454f-d385-4b92-9568-3d2fecf70512.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7002454f-d385-4b92-9568-3d2fecf70512.selectorLabels" . | nindent 6 }}
