apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod928b186-cb09-4073-8ff3-35404bcf07c4.fullname" . }}
  labels:
    {{- include "go-echod928b186-cb09-4073-8ff3-35404bcf07c4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod928b186-cb09-4073-8ff3-35404bcf07c4.selectorLabels" . | nindent 6 }}
