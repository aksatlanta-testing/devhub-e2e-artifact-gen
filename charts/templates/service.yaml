apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo43273064-ec5e-4ee1-ae43-f20d5f8b46ca.fullname" . }}
  labels:
    {{- include "go-echo43273064-ec5e-4ee1-ae43-f20d5f8b46ca.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo43273064-ec5e-4ee1-ae43-f20d5f8b46ca.selectorLabels" . | nindent 6 }}
