apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa0d638a3-5140-4f29-8bab-59151cb60a13.fullname" . }}
  labels:
    {{- include "go-echoa0d638a3-5140-4f29-8bab-59151cb60a13.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa0d638a3-5140-4f29-8bab-59151cb60a13.selectorLabels" . | nindent 6 }}
