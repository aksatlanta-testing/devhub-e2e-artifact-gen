apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo036b3b35-68fe-454e-ab92-d9ad3f00c324.fullname" . }}
  labels:
    {{- include "go-echo036b3b35-68fe-454e-ab92-d9ad3f00c324.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo036b3b35-68fe-454e-ab92-d9ad3f00c324.selectorLabels" . | nindent 6 }}
