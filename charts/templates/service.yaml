apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo198fb4cc-e9dd-4eeb-a99b-e3d24b8dc382.fullname" . }}
  labels:
    {{- include "go-echo198fb4cc-e9dd-4eeb-a99b-e3d24b8dc382.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo198fb4cc-e9dd-4eeb-a99b-e3d24b8dc382.selectorLabels" . | nindent 6 }}
