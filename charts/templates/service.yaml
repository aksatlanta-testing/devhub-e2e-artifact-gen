apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4e87e3c3-1ebd-4873-8c3d-41c9e8f5714e.fullname" . }}
  labels:
    {{- include "go-echo4e87e3c3-1ebd-4873-8c3d-41c9e8f5714e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4e87e3c3-1ebd-4873-8c3d-41c9e8f5714e.selectorLabels" . | nindent 6 }}
