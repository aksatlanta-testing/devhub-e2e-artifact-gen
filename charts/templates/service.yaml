apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa3eb723f-60b7-48d8-b03e-96a10675965b.fullname" . }}
  labels:
    {{- include "go-echoa3eb723f-60b7-48d8-b03e-96a10675965b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa3eb723f-60b7-48d8-b03e-96a10675965b.selectorLabels" . | nindent 6 }}
