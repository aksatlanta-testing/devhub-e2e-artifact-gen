apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc4bf2278-7742-452c-b3af-f5f06a2ceae7.fullname" . }}
  labels:
    {{- include "go-echoc4bf2278-7742-452c-b3af-f5f06a2ceae7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc4bf2278-7742-452c-b3af-f5f06a2ceae7.selectorLabels" . | nindent 6 }}
