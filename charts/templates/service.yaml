apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0b275b34-d9dd-4553-80e1-9f5bc7499a34.fullname" . }}
  labels:
    {{- include "go-echo0b275b34-d9dd-4553-80e1-9f5bc7499a34.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0b275b34-d9dd-4553-80e1-9f5bc7499a34.selectorLabels" . | nindent 6 }}
