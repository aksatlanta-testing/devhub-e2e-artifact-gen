apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4915e933-bcd8-4bda-ae26-5eb3df0628c4.fullname" . }}
  labels:
    {{- include "go-echo4915e933-bcd8-4bda-ae26-5eb3df0628c4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4915e933-bcd8-4bda-ae26-5eb3df0628c4.selectorLabels" . | nindent 6 }}
