apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa36dc712-efd2-462c-bd23-da35aad65dd4.fullname" . }}
  labels:
    {{- include "go-echoa36dc712-efd2-462c-bd23-da35aad65dd4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa36dc712-efd2-462c-bd23-da35aad65dd4.selectorLabels" . | nindent 6 }}
