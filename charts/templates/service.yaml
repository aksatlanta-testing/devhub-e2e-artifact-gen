apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof336557c-bf5a-4967-9fa9-e0a5a3a4949e.fullname" . }}
  labels:
    {{- include "go-echof336557c-bf5a-4967-9fa9-e0a5a3a4949e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof336557c-bf5a-4967-9fa9-e0a5a3a4949e.selectorLabels" . | nindent 6 }}
