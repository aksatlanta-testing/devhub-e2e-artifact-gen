apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob483044c-9f89-4c01-ae5a-f8f04e7a8c4b.fullname" . }}
  labels:
    {{- include "go-echob483044c-9f89-4c01-ae5a-f8f04e7a8c4b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob483044c-9f89-4c01-ae5a-f8f04e7a8c4b.selectorLabels" . | nindent 6 }}
