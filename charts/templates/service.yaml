apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod56c7323-9f87-4834-b68e-b5c0058a4248.fullname" . }}
  labels:
    {{- include "go-echod56c7323-9f87-4834-b68e-b5c0058a4248.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod56c7323-9f87-4834-b68e-b5c0058a4248.selectorLabels" . | nindent 6 }}
