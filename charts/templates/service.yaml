apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo64552ffe-be82-4c3a-9164-8742b3c9f357.fullname" . }}
  labels:
    {{- include "go-echo64552ffe-be82-4c3a-9164-8742b3c9f357.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo64552ffe-be82-4c3a-9164-8742b3c9f357.selectorLabels" . | nindent 6 }}
