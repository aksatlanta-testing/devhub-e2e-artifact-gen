apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7ee082b4-235f-4ff8-9e2b-64b4078ebf25.fullname" . }}
  labels:
    {{- include "go-echo7ee082b4-235f-4ff8-9e2b-64b4078ebf25.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7ee082b4-235f-4ff8-9e2b-64b4078ebf25.selectorLabels" . | nindent 6 }}
