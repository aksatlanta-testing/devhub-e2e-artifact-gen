apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob2a58d0f-4ad3-483e-9a88-e9163833c68f.fullname" . }}
  labels:
    {{- include "go-echob2a58d0f-4ad3-483e-9a88-e9163833c68f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob2a58d0f-4ad3-483e-9a88-e9163833c68f.selectorLabels" . | nindent 6 }}
