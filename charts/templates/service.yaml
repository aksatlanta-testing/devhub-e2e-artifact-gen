apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1a6bf8bb-2be9-4f07-8e84-c43fbec442d0.fullname" . }}
  labels:
    {{- include "go-echo1a6bf8bb-2be9-4f07-8e84-c43fbec442d0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1a6bf8bb-2be9-4f07-8e84-c43fbec442d0.selectorLabels" . | nindent 6 }}
