apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5805096d-c6b9-49f4-9374-b437a576e91d.fullname" . }}
  labels:
    {{- include "go-echo5805096d-c6b9-49f4-9374-b437a576e91d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5805096d-c6b9-49f4-9374-b437a576e91d.selectorLabels" . | nindent 6 }}
