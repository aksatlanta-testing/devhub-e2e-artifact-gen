apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo41f1b17c-6661-4b48-abed-ba7feeab000f.fullname" . }}
  labels:
    {{- include "go-echo41f1b17c-6661-4b48-abed-ba7feeab000f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo41f1b17c-6661-4b48-abed-ba7feeab000f.selectorLabels" . | nindent 6 }}
