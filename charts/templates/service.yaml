apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobf0e2fa0-81f1-4be6-b0cc-c3f2bfce39c0.fullname" . }}
  labels:
    {{- include "go-echobf0e2fa0-81f1-4be6-b0cc-c3f2bfce39c0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobf0e2fa0-81f1-4be6-b0cc-c3f2bfce39c0.selectorLabels" . | nindent 6 }}
