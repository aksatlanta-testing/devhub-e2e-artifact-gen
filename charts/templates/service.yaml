apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo05bd404b-ea1e-41c6-9071-660baf4d8606.fullname" . }}
  labels:
    {{- include "go-echo05bd404b-ea1e-41c6-9071-660baf4d8606.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo05bd404b-ea1e-41c6-9071-660baf4d8606.selectorLabels" . | nindent 6 }}
