apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoca0731d9-cdb6-4833-b07d-505cd45f2acf.fullname" . }}
  labels:
    {{- include "go-echoca0731d9-cdb6-4833-b07d-505cd45f2acf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoca0731d9-cdb6-4833-b07d-505cd45f2acf.selectorLabels" . | nindent 6 }}
