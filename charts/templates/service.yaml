apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaa6cd190-c5c5-414f-af20-77bad895551d.fullname" . }}
  labels:
    {{- include "go-echoaa6cd190-c5c5-414f-af20-77bad895551d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaa6cd190-c5c5-414f-af20-77bad895551d.selectorLabels" . | nindent 6 }}
