apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0e8498f1-b066-49ac-9e02-7a0c406d69a0.fullname" . }}
  labels:
    {{- include "go-echo0e8498f1-b066-49ac-9e02-7a0c406d69a0.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0e8498f1-b066-49ac-9e02-7a0c406d69a0.selectorLabels" . | nindent 6 }}
