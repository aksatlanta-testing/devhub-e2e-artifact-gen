apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof6ed0f8e-2758-41e7-afdb-a268903d5c38.fullname" . }}
  labels:
    {{- include "go-echof6ed0f8e-2758-41e7-afdb-a268903d5c38.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof6ed0f8e-2758-41e7-afdb-a268903d5c38.selectorLabels" . | nindent 6 }}
