apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe6fc477b-c2fe-404a-8a43-137f92f97892.fullname" . }}
  labels:
    {{- include "go-echoe6fc477b-c2fe-404a-8a43-137f92f97892.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe6fc477b-c2fe-404a-8a43-137f92f97892.selectorLabels" . | nindent 6 }}
