apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4e354e24-8ca9-4526-85b2-731339864bd3.fullname" . }}
  labels:
    {{- include "go-echo4e354e24-8ca9-4526-85b2-731339864bd3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4e354e24-8ca9-4526-85b2-731339864bd3.selectorLabels" . | nindent 6 }}
