apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo13849e5c-0efc-4c62-b398-8016e24ba19a.fullname" . }}
  labels:
    {{- include "go-echo13849e5c-0efc-4c62-b398-8016e24ba19a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo13849e5c-0efc-4c62-b398-8016e24ba19a.selectorLabels" . | nindent 6 }}
