apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaa604578-b8d2-4559-8054-f227063a79bd.fullname" . }}
  labels:
    {{- include "go-echoaa604578-b8d2-4559-8054-f227063a79bd.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaa604578-b8d2-4559-8054-f227063a79bd.selectorLabels" . | nindent 6 }}
