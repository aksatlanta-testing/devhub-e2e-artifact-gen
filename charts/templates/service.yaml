apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob0108fd4-4da8-47ff-a396-a31ae08a3fae.fullname" . }}
  labels:
    {{- include "go-echob0108fd4-4da8-47ff-a396-a31ae08a3fae.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob0108fd4-4da8-47ff-a396-a31ae08a3fae.selectorLabels" . | nindent 6 }}
