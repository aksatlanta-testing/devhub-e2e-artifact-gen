apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0e464375-d910-457b-97ab-88b07838222c.fullname" . }}
  labels:
    {{- include "go-echo0e464375-d910-457b-97ab-88b07838222c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0e464375-d910-457b-97ab-88b07838222c.selectorLabels" . | nindent 6 }}
