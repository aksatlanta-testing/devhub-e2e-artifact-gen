apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo303625c0-0c22-4aba-adae-329adc3c3d69.fullname" . }}
  labels:
    {{- include "go-echo303625c0-0c22-4aba-adae-329adc3c3d69.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo303625c0-0c22-4aba-adae-329adc3c3d69.selectorLabels" . | nindent 6 }}
