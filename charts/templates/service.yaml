apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5d8ef1dc-d96a-488b-b0a0-d4094d946372.fullname" . }}
  labels:
    {{- include "go-echo5d8ef1dc-d96a-488b-b0a0-d4094d946372.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5d8ef1dc-d96a-488b-b0a0-d4094d946372.selectorLabels" . | nindent 6 }}
