apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1d23ad51-7564-4689-92d0-e65ced9faa92.fullname" . }}
  labels:
    {{- include "go-echo1d23ad51-7564-4689-92d0-e65ced9faa92.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1d23ad51-7564-4689-92d0-e65ced9faa92.selectorLabels" . | nindent 6 }}
