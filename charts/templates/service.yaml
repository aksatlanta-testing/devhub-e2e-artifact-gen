apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc02896b1-bf5a-48f4-8372-1a87d4787346.fullname" . }}
  labels:
    {{- include "go-echoc02896b1-bf5a-48f4-8372-1a87d4787346.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc02896b1-bf5a-48f4-8372-1a87d4787346.selectorLabels" . | nindent 6 }}
