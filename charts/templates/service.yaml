apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe39fdf85-0784-4caa-aa6d-e27e8eca2f02.fullname" . }}
  labels:
    {{- include "go-echoe39fdf85-0784-4caa-aa6d-e27e8eca2f02.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe39fdf85-0784-4caa-aa6d-e27e8eca2f02.selectorLabels" . | nindent 6 }}
