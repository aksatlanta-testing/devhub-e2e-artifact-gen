apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo26163b07-d921-4db4-8bf4-33b90d825d04.fullname" . }}
  labels:
    {{- include "go-echo26163b07-d921-4db4-8bf4-33b90d825d04.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo26163b07-d921-4db4-8bf4-33b90d825d04.selectorLabels" . | nindent 6 }}
