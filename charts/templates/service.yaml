apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo21991b5d-3ffd-41f5-8949-2b8e58bedb25.fullname" . }}
  labels:
    {{- include "go-echo21991b5d-3ffd-41f5-8949-2b8e58bedb25.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo21991b5d-3ffd-41f5-8949-2b8e58bedb25.selectorLabels" . | nindent 6 }}
