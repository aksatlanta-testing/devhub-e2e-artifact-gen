apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocef1f671-e23c-452c-9ea9-7d163a2ee52f.fullname" . }}
  labels:
    {{- include "go-echocef1f671-e23c-452c-9ea9-7d163a2ee52f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocef1f671-e23c-452c-9ea9-7d163a2ee52f.selectorLabels" . | nindent 6 }}
