apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3ad15c7d-42ef-478e-98d7-093256b7dce9.fullname" . }}
  labels:
    {{- include "go-echo3ad15c7d-42ef-478e-98d7-093256b7dce9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3ad15c7d-42ef-478e-98d7-093256b7dce9.selectorLabels" . | nindent 6 }}
