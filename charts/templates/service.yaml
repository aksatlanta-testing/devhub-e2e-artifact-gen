apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo653524e7-ef9b-4312-b4cd-d83d9ab0d002.fullname" . }}
  labels:
    {{- include "go-echo653524e7-ef9b-4312-b4cd-d83d9ab0d002.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo653524e7-ef9b-4312-b4cd-d83d9ab0d002.selectorLabels" . | nindent 6 }}
