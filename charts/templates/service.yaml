apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6d7b5e7f-ad2d-4030-9587-854ba011b5cd.fullname" . }}
  labels:
    {{- include "go-echo6d7b5e7f-ad2d-4030-9587-854ba011b5cd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6d7b5e7f-ad2d-4030-9587-854ba011b5cd.selectorLabels" . | nindent 6 }}
