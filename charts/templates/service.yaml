apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob3fb7967-1f3c-46b8-9146-ef194f799e13.fullname" . }}
  labels:
    {{- include "go-echob3fb7967-1f3c-46b8-9146-ef194f799e13.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob3fb7967-1f3c-46b8-9146-ef194f799e13.selectorLabels" . | nindent 6 }}
