apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo96cd63a3-0c4a-47b8-b2a3-fe9bda3147c5.fullname" . }}
  labels:
    {{- include "go-echo96cd63a3-0c4a-47b8-b2a3-fe9bda3147c5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo96cd63a3-0c4a-47b8-b2a3-fe9bda3147c5.selectorLabels" . | nindent 6 }}
