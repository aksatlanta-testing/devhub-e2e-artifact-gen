apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7c6182ed-458a-4bfe-b319-da9d13592ae5.fullname" . }}
  labels:
    {{- include "go-echo7c6182ed-458a-4bfe-b319-da9d13592ae5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7c6182ed-458a-4bfe-b319-da9d13592ae5.selectorLabels" . | nindent 6 }}
