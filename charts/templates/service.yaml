apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo22251004-2b63-4c43-8953-9bd1e2f21a33.fullname" . }}
  labels:
    {{- include "go-echo22251004-2b63-4c43-8953-9bd1e2f21a33.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo22251004-2b63-4c43-8953-9bd1e2f21a33.selectorLabels" . | nindent 6 }}
