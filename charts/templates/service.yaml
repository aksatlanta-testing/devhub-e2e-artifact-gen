apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9e98486b-8764-4939-8c43-abf01a234fb5.fullname" . }}
  labels:
    {{- include "go-echo9e98486b-8764-4939-8c43-abf01a234fb5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9e98486b-8764-4939-8c43-abf01a234fb5.selectorLabels" . | nindent 6 }}
