apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo92823b8e-002f-4f3b-b339-11d9034d653e.fullname" . }}
  labels:
    {{- include "go-echo92823b8e-002f-4f3b-b339-11d9034d653e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo92823b8e-002f-4f3b-b339-11d9034d653e.selectorLabels" . | nindent 6 }}
