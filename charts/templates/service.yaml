apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob480e5f3-deb0-49bf-8f22-7c7a919eaa4f.fullname" . }}
  labels:
    {{- include "go-echob480e5f3-deb0-49bf-8f22-7c7a919eaa4f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob480e5f3-deb0-49bf-8f22-7c7a919eaa4f.selectorLabels" . | nindent 6 }}
