apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo66646d34-8d98-4f75-96c8-fd90ab9c68bf.fullname" . }}
  labels:
    {{- include "go-echo66646d34-8d98-4f75-96c8-fd90ab9c68bf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo66646d34-8d98-4f75-96c8-fd90ab9c68bf.selectorLabels" . | nindent 6 }}
