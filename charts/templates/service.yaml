apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoba2f8243-6e15-4b62-855e-bb348b316ae1.fullname" . }}
  labels:
    {{- include "go-echoba2f8243-6e15-4b62-855e-bb348b316ae1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoba2f8243-6e15-4b62-855e-bb348b316ae1.selectorLabels" . | nindent 6 }}
