apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoaa28be41-dfc7-49b1-a0e5-d5cb062dc5c4.fullname" . }}
  labels:
    {{- include "go-echoaa28be41-dfc7-49b1-a0e5-d5cb062dc5c4.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoaa28be41-dfc7-49b1-a0e5-d5cb062dc5c4.selectorLabels" . | nindent 6 }}
