apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4de19a4b-c2ac-4f42-b4fd-9be0bb81e30b.fullname" . }}
  labels:
    {{- include "go-echo4de19a4b-c2ac-4f42-b4fd-9be0bb81e30b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4de19a4b-c2ac-4f42-b4fd-9be0bb81e30b.selectorLabels" . | nindent 6 }}
