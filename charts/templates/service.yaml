apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9a087493-9678-453b-a3e9-75715613e63f.fullname" . }}
  labels:
    {{- include "go-echo9a087493-9678-453b-a3e9-75715613e63f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9a087493-9678-453b-a3e9-75715613e63f.selectorLabels" . | nindent 6 }}
