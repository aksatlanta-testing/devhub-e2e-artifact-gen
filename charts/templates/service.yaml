apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo410d28fa-703a-45af-8f09-a638d2718c30.fullname" . }}
  labels:
    {{- include "go-echo410d28fa-703a-45af-8f09-a638d2718c30.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo410d28fa-703a-45af-8f09-a638d2718c30.selectorLabels" . | nindent 6 }}
