apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9e068728-910f-4436-8066-9539992a6d15.fullname" . }}
  labels:
    {{- include "go-echo9e068728-910f-4436-8066-9539992a6d15.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
