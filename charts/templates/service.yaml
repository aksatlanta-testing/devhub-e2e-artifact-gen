apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo62c01cc3-064b-4628-94a0-023a038727cc.fullname" . }}
  labels:
    {{- include "go-echo62c01cc3-064b-4628-94a0-023a038727cc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo62c01cc3-064b-4628-94a0-023a038727cc.selectorLabels" . | nindent 6 }}
