apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3b52b1b8-2fda-4a49-b7e0-6601b0e86a64.fullname" . }}
  labels:
    {{- include "go-echo3b52b1b8-2fda-4a49-b7e0-6601b0e86a64.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3b52b1b8-2fda-4a49-b7e0-6601b0e86a64.selectorLabels" . | nindent 6 }}
