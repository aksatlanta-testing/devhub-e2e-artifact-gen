apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc3e87173-6384-4e29-bf0e-3588e0abce08.fullname" . }}
  labels:
    {{- include "go-echoc3e87173-6384-4e29-bf0e-3588e0abce08.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc3e87173-6384-4e29-bf0e-3588e0abce08.selectorLabels" . | nindent 6 }}
