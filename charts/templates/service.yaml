apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoefea1453-ec91-4105-b620-caa47a66b17f.fullname" . }}
  labels:
    {{- include "go-echoefea1453-ec91-4105-b620-caa47a66b17f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoefea1453-ec91-4105-b620-caa47a66b17f.selectorLabels" . | nindent 6 }}
