apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8022ab25-cc39-4db4-a80f-592a15ba5208.fullname" . }}
  labels:
    {{- include "go-echo8022ab25-cc39-4db4-a80f-592a15ba5208.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8022ab25-cc39-4db4-a80f-592a15ba5208.selectorLabels" . | nindent 6 }}
