apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo53845acf-2b60-4ad7-b90c-5c69e5772442.fullname" . }}
  labels:
    {{- include "go-echo53845acf-2b60-4ad7-b90c-5c69e5772442.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo53845acf-2b60-4ad7-b90c-5c69e5772442.selectorLabels" . | nindent 6 }}
