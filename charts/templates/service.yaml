apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc975b5c5-0c3a-4b33-b1e2-edc83653f73c.fullname" . }}
  labels:
    {{- include "go-echoc975b5c5-0c3a-4b33-b1e2-edc83653f73c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc975b5c5-0c3a-4b33-b1e2-edc83653f73c.selectorLabels" . | nindent 6 }}
