apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7c79d8bb-d721-4110-97f9-289ed090d217.fullname" . }}
  labels:
    {{- include "go-echo7c79d8bb-d721-4110-97f9-289ed090d217.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
