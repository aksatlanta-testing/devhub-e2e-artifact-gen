apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo58f7ac94-07d3-4278-8f09-000eac87a9b8.fullname" . }}
  labels:
    {{- include "go-echo58f7ac94-07d3-4278-8f09-000eac87a9b8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo58f7ac94-07d3-4278-8f09-000eac87a9b8.selectorLabels" . | nindent 6 }}
