apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5cd04c85-c46b-4bd4-8315-3be68f29538b.fullname" . }}
  labels:
    {{- include "go-echo5cd04c85-c46b-4bd4-8315-3be68f29538b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5cd04c85-c46b-4bd4-8315-3be68f29538b.selectorLabels" . | nindent 6 }}
