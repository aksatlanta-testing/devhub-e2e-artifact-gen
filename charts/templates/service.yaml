apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocf9582fa-dc1a-4e40-8bb2-4ecda6f5b918.fullname" . }}
  labels:
    {{- include "go-echocf9582fa-dc1a-4e40-8bb2-4ecda6f5b918.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocf9582fa-dc1a-4e40-8bb2-4ecda6f5b918.selectorLabels" . | nindent 6 }}
