apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo28ca994e-2099-406f-85e7-35d39b8c7a52.fullname" . }}
  labels:
    {{- include "go-echo28ca994e-2099-406f-85e7-35d39b8c7a52.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo28ca994e-2099-406f-85e7-35d39b8c7a52.selectorLabels" . | nindent 6 }}
