apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe7b86d48-69e2-430b-be47-e56befe50f00.fullname" . }}
  labels:
    {{- include "go-echoe7b86d48-69e2-430b-be47-e56befe50f00.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe7b86d48-69e2-430b-be47-e56befe50f00.selectorLabels" . | nindent 6 }}
