apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod61eba50-3223-4210-91fc-ef02cd7321c4.fullname" . }}
  labels:
    {{- include "go-echod61eba50-3223-4210-91fc-ef02cd7321c4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod61eba50-3223-4210-91fc-ef02cd7321c4.selectorLabels" . | nindent 6 }}
