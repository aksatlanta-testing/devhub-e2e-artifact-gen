apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoab1738d3-268e-46df-8f6c-885fe50c3c43.fullname" . }}
  labels:
    {{- include "go-echoab1738d3-268e-46df-8f6c-885fe50c3c43.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoab1738d3-268e-46df-8f6c-885fe50c3c43.selectorLabels" . | nindent 6 }}
