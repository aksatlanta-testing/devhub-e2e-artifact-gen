apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe955c6cd-2eb3-4ae7-834c-6fa6e888c736.fullname" . }}
  labels:
    {{- include "go-echoe955c6cd-2eb3-4ae7-834c-6fa6e888c736.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe955c6cd-2eb3-4ae7-834c-6fa6e888c736.selectorLabels" . | nindent 6 }}
