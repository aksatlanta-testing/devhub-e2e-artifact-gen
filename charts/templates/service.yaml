apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo47282aca-3c6d-4ae7-94bb-539ef9355c84.fullname" . }}
  labels:
    {{- include "go-echo47282aca-3c6d-4ae7-94bb-539ef9355c84.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo47282aca-3c6d-4ae7-94bb-539ef9355c84.selectorLabels" . | nindent 6 }}
