apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6bb5b2df-8979-4fae-a8b3-161c9e46df0f.fullname" . }}
  labels:
    {{- include "go-echo6bb5b2df-8979-4fae-a8b3-161c9e46df0f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6bb5b2df-8979-4fae-a8b3-161c9e46df0f.selectorLabels" . | nindent 6 }}
