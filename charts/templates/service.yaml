apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4d4d86e9-3fe2-4daa-8282-524fdb93baeb.fullname" . }}
  labels:
    {{- include "go-echo4d4d86e9-3fe2-4daa-8282-524fdb93baeb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4d4d86e9-3fe2-4daa-8282-524fdb93baeb.selectorLabels" . | nindent 6 }}
