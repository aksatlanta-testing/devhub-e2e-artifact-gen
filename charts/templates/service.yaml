apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo490cb14a-cada-478a-9f9d-8c69caa8261e.fullname" . }}
  labels:
    {{- include "go-echo490cb14a-cada-478a-9f9d-8c69caa8261e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo490cb14a-cada-478a-9f9d-8c69caa8261e.selectorLabels" . | nindent 6 }}
