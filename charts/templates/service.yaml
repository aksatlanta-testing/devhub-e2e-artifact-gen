apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo13bdb8af-310c-4efc-8eab-a54900a2affd.fullname" . }}
  labels:
    {{- include "go-echo13bdb8af-310c-4efc-8eab-a54900a2affd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo13bdb8af-310c-4efc-8eab-a54900a2affd.selectorLabels" . | nindent 6 }}
