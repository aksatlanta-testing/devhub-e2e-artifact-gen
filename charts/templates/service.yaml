apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc465f26e-4c68-401d-a842-fe14724bc5d5.fullname" . }}
  labels:
    {{- include "go-echoc465f26e-4c68-401d-a842-fe14724bc5d5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc465f26e-4c68-401d-a842-fe14724bc5d5.selectorLabels" . | nindent 6 }}
