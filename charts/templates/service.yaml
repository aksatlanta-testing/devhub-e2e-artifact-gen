apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo960a1a8b-1d13-47f1-8d36-2162b2d24b75.fullname" . }}
  labels:
    {{- include "go-echo960a1a8b-1d13-47f1-8d36-2162b2d24b75.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo960a1a8b-1d13-47f1-8d36-2162b2d24b75.selectorLabels" . | nindent 6 }}
