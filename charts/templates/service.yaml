apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo16691b98-5b15-4934-b58f-5d860e630834.fullname" . }}
  labels:
    {{- include "go-echo16691b98-5b15-4934-b58f-5d860e630834.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo16691b98-5b15-4934-b58f-5d860e630834.selectorLabels" . | nindent 6 }}
