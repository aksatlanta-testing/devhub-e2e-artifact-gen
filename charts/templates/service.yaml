apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5c969c7f-3bd2-434c-9f52-85bef0700549.fullname" . }}
  labels:
    {{- include "go-echo5c969c7f-3bd2-434c-9f52-85bef0700549.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5c969c7f-3bd2-434c-9f52-85bef0700549.selectorLabels" . | nindent 6 }}
