apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodca19e35-1f40-42c4-b3f6-c2989e58dbfa.fullname" . }}
  labels:
    {{- include "go-echodca19e35-1f40-42c4-b3f6-c2989e58dbfa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodca19e35-1f40-42c4-b3f6-c2989e58dbfa.selectorLabels" . | nindent 6 }}
