apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo126ea544-4611-457c-919f-7f5e82f03139.fullname" . }}
  labels:
    {{- include "go-echo126ea544-4611-457c-919f-7f5e82f03139.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo126ea544-4611-457c-919f-7f5e82f03139.selectorLabels" . | nindent 6 }}
