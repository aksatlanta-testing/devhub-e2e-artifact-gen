apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo437d45d4-d538-41e4-8826-b6da4c563079.fullname" . }}
  labels:
    {{- include "go-echo437d45d4-d538-41e4-8826-b6da4c563079.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo437d45d4-d538-41e4-8826-b6da4c563079.selectorLabels" . | nindent 6 }}
