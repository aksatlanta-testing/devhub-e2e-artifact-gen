apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo75e804fb-9e39-48d6-91f3-88e07911e62e.fullname" . }}
  labels:
    {{- include "go-echo75e804fb-9e39-48d6-91f3-88e07911e62e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo75e804fb-9e39-48d6-91f3-88e07911e62e.selectorLabels" . | nindent 6 }}
