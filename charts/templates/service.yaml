apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob3f7be98-6634-408a-8d12-297697ede3ba.fullname" . }}
  labels:
    {{- include "go-echob3f7be98-6634-408a-8d12-297697ede3ba.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob3f7be98-6634-408a-8d12-297697ede3ba.selectorLabels" . | nindent 6 }}
