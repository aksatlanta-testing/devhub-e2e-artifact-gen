apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3a8be395-94de-43fa-b95a-922fff29ddbc.fullname" . }}
  labels:
    {{- include "go-echo3a8be395-94de-43fa-b95a-922fff29ddbc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3a8be395-94de-43fa-b95a-922fff29ddbc.selectorLabels" . | nindent 6 }}
