apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo92f502a1-2c6a-4f54-a408-6a5ccbedc58b.fullname" . }}
  labels:
    {{- include "go-echo92f502a1-2c6a-4f54-a408-6a5ccbedc58b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo92f502a1-2c6a-4f54-a408-6a5ccbedc58b.selectorLabels" . | nindent 6 }}
