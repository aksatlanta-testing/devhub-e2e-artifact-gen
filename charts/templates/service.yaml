apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo94943bae-cb43-4f45-8fdd-72301c794a0b.fullname" . }}
  labels:
    {{- include "go-echo94943bae-cb43-4f45-8fdd-72301c794a0b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo94943bae-cb43-4f45-8fdd-72301c794a0b.selectorLabels" . | nindent 6 }}
