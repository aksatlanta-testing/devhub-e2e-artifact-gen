apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo43d61c1b-dd0c-4b3c-9e08-1f447206f9bc.fullname" . }}
  labels:
    {{- include "go-echo43d61c1b-dd0c-4b3c-9e08-1f447206f9bc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo43d61c1b-dd0c-4b3c-9e08-1f447206f9bc.selectorLabels" . | nindent 6 }}
