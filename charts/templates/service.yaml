apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod58299df-f98c-490f-977d-787cdb84ae23.fullname" . }}
  labels:
    {{- include "go-echod58299df-f98c-490f-977d-787cdb84ae23.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod58299df-f98c-490f-977d-787cdb84ae23.selectorLabels" . | nindent 6 }}
