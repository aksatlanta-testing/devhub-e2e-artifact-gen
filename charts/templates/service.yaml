apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1a1563c8-ae7b-49fd-9548-d49f7a437654.fullname" . }}
  labels:
    {{- include "go-echo1a1563c8-ae7b-49fd-9548-d49f7a437654.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1a1563c8-ae7b-49fd-9548-d49f7a437654.selectorLabels" . | nindent 6 }}
