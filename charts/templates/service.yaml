apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa3050bd3-e0cc-415c-a4a8-930949504b2c.fullname" . }}
  labels:
    {{- include "go-echoa3050bd3-e0cc-415c-a4a8-930949504b2c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa3050bd3-e0cc-415c-a4a8-930949504b2c.selectorLabels" . | nindent 6 }}
