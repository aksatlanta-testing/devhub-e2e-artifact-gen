apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob54cb0c3-217c-411a-a7e8-ed91cc637d76.fullname" . }}
  labels:
    {{- include "go-echob54cb0c3-217c-411a-a7e8-ed91cc637d76.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob54cb0c3-217c-411a-a7e8-ed91cc637d76.selectorLabels" . | nindent 6 }}
