apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo878028db-2190-424f-80b3-faf76e5df2b2.fullname" . }}
  labels:
    {{- include "go-echo878028db-2190-424f-80b3-faf76e5df2b2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo878028db-2190-424f-80b3-faf76e5df2b2.selectorLabels" . | nindent 6 }}
