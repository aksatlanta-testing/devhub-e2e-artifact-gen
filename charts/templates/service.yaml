apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo71887b53-8cd6-4006-817c-c58035181cbb.fullname" . }}
  labels:
    {{- include "go-echo71887b53-8cd6-4006-817c-c58035181cbb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo71887b53-8cd6-4006-817c-c58035181cbb.selectorLabels" . | nindent 6 }}
