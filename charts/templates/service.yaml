apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa1ed52e8-ba8e-412a-94d4-3c4dcd12b03a.fullname" . }}
  labels:
    {{- include "go-echoa1ed52e8-ba8e-412a-94d4-3c4dcd12b03a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa1ed52e8-ba8e-412a-94d4-3c4dcd12b03a.selectorLabels" . | nindent 6 }}
