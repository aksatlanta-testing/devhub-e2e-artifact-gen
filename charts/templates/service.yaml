apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo926c9f91-5dcf-4d92-84a6-222ab36721f6.fullname" . }}
  labels:
    {{- include "go-echo926c9f91-5dcf-4d92-84a6-222ab36721f6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo926c9f91-5dcf-4d92-84a6-222ab36721f6.selectorLabels" . | nindent 6 }}
