apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo65d102bf-9d74-40cb-b2f0-e5cfcbe2f087.fullname" . }}
  labels:
    {{- include "go-echo65d102bf-9d74-40cb-b2f0-e5cfcbe2f087.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo65d102bf-9d74-40cb-b2f0-e5cfcbe2f087.selectorLabels" . | nindent 6 }}
