apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob85b579b-d54d-4bd6-90a1-574031795a34.fullname" . }}
  labels:
    {{- include "go-echob85b579b-d54d-4bd6-90a1-574031795a34.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob85b579b-d54d-4bd6-90a1-574031795a34.selectorLabels" . | nindent 6 }}
