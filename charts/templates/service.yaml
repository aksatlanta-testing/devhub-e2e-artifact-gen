apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2c04da55-b382-4e77-8f99-7b46cf97ef94.fullname" . }}
  labels:
    {{- include "go-echo2c04da55-b382-4e77-8f99-7b46cf97ef94.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2c04da55-b382-4e77-8f99-7b46cf97ef94.selectorLabels" . | nindent 6 }}
