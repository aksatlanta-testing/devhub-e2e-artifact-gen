apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo50ce8793-0906-4e09-bb5a-ac3a2acc9839.fullname" . }}
  labels:
    {{- include "go-echo50ce8793-0906-4e09-bb5a-ac3a2acc9839.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo50ce8793-0906-4e09-bb5a-ac3a2acc9839.selectorLabels" . | nindent 6 }}
