apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo334efec0-6469-4fce-92df-a28022f51fa6.fullname" . }}
  labels:
    {{- include "go-echo334efec0-6469-4fce-92df-a28022f51fa6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo334efec0-6469-4fce-92df-a28022f51fa6.selectorLabels" . | nindent 6 }}
