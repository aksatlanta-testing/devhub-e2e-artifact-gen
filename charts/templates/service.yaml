apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofacdb058-f43d-45c8-82ee-1beb9123397a.fullname" . }}
  labels:
    {{- include "go-echofacdb058-f43d-45c8-82ee-1beb9123397a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofacdb058-f43d-45c8-82ee-1beb9123397a.selectorLabels" . | nindent 6 }}
