apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo12922cb4-bda8-429d-83a0-5e2cb8fe4f11.fullname" . }}
  labels:
    {{- include "go-echo12922cb4-bda8-429d-83a0-5e2cb8fe4f11.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo12922cb4-bda8-429d-83a0-5e2cb8fe4f11.selectorLabels" . | nindent 6 }}
