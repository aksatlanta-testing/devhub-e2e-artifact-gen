apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobda3343b-b629-4a74-907f-03c7834a0d39.fullname" . }}
  labels:
    {{- include "go-echobda3343b-b629-4a74-907f-03c7834a0d39.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobda3343b-b629-4a74-907f-03c7834a0d39.selectorLabels" . | nindent 6 }}
