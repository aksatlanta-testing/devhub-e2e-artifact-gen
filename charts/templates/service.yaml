apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodf1e1f7e-5f1e-45ce-a4fe-5ca4cab58d66.fullname" . }}
  labels:
    {{- include "go-echodf1e1f7e-5f1e-45ce-a4fe-5ca4cab58d66.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodf1e1f7e-5f1e-45ce-a4fe-5ca4cab58d66.selectorLabels" . | nindent 6 }}
