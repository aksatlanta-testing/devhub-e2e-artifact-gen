apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoda51494c-6437-4b19-a0e9-417adf6ba10b.fullname" . }}
  labels:
    {{- include "go-echoda51494c-6437-4b19-a0e9-417adf6ba10b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoda51494c-6437-4b19-a0e9-417adf6ba10b.selectorLabels" . | nindent 6 }}
