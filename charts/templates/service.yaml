apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7d98985c-9906-4c6a-bca2-b26f3ced695d.fullname" . }}
  labels:
    {{- include "go-echo7d98985c-9906-4c6a-bca2-b26f3ced695d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7d98985c-9906-4c6a-bca2-b26f3ced695d.selectorLabels" . | nindent 6 }}
