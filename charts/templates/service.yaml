apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc00bdfe8-7548-43eb-a468-4ced338e931e.fullname" . }}
  labels:
    {{- include "go-echoc00bdfe8-7548-43eb-a468-4ced338e931e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc00bdfe8-7548-43eb-a468-4ced338e931e.selectorLabels" . | nindent 6 }}
