apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe078889a-b38f-49d6-acbd-76d03f8b4a3b.fullname" . }}
  labels:
    {{- include "go-echoe078889a-b38f-49d6-acbd-76d03f8b4a3b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe078889a-b38f-49d6-acbd-76d03f8b4a3b.selectorLabels" . | nindent 6 }}
