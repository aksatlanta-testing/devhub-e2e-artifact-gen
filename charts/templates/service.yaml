apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo98c21eec-38d3-4301-af52-ec3406114003.fullname" . }}
  labels:
    {{- include "go-echo98c21eec-38d3-4301-af52-ec3406114003.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo98c21eec-38d3-4301-af52-ec3406114003.selectorLabels" . | nindent 6 }}
