apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodd723ff7-d958-4048-9a3a-b938f13a5ecb.fullname" . }}
  labels:
    {{- include "go-echodd723ff7-d958-4048-9a3a-b938f13a5ecb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodd723ff7-d958-4048-9a3a-b938f13a5ecb.selectorLabels" . | nindent 6 }}
