apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0700b841-fd60-4894-bc4a-f71d6c1d6cc0.fullname" . }}
  labels:
    {{- include "go-echo0700b841-fd60-4894-bc4a-f71d6c1d6cc0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0700b841-fd60-4894-bc4a-f71d6c1d6cc0.selectorLabels" . | nindent 6 }}
