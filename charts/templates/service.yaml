apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof7e43729-0d3e-41c5-af7f-aac9b0734a76.fullname" . }}
  labels:
    {{- include "go-echof7e43729-0d3e-41c5-af7f-aac9b0734a76.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof7e43729-0d3e-41c5-af7f-aac9b0734a76.selectorLabels" . | nindent 6 }}
