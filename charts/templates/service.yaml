apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod76e0f98-9d7a-4294-94d2-93acb5fb4d8a.fullname" . }}
  labels:
    {{- include "go-echod76e0f98-9d7a-4294-94d2-93acb5fb4d8a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod76e0f98-9d7a-4294-94d2-93acb5fb4d8a.selectorLabels" . | nindent 6 }}
