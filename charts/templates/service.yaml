apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8809a411-c93f-4d89-902f-39f41383fdba.fullname" . }}
  labels:
    {{- include "go-echo8809a411-c93f-4d89-902f-39f41383fdba.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8809a411-c93f-4d89-902f-39f41383fdba.selectorLabels" . | nindent 6 }}
