apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc9c6ad06-dabd-4162-b23c-d6c8926cb335.fullname" . }}
  labels:
    {{- include "go-echoc9c6ad06-dabd-4162-b23c-d6c8926cb335.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc9c6ad06-dabd-4162-b23c-d6c8926cb335.selectorLabels" . | nindent 6 }}
