apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoadbb30fa-7b1f-4f54-a9b8-bf1496d0901b.fullname" . }}
  labels:
    {{- include "go-echoadbb30fa-7b1f-4f54-a9b8-bf1496d0901b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoadbb30fa-7b1f-4f54-a9b8-bf1496d0901b.selectorLabels" . | nindent 6 }}
