apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod49afe33-439d-4a7e-aa08-79674b008b43.fullname" . }}
  labels:
    {{- include "go-echod49afe33-439d-4a7e-aa08-79674b008b43.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod49afe33-439d-4a7e-aa08-79674b008b43.selectorLabels" . | nindent 6 }}
