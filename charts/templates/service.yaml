apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo19c1f7f0-b9a4-412a-a9a8-13211d6a70c1.fullname" . }}
  labels:
    {{- include "go-echo19c1f7f0-b9a4-412a-a9a8-13211d6a70c1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo19c1f7f0-b9a4-412a-a9a8-13211d6a70c1.selectorLabels" . | nindent 6 }}
