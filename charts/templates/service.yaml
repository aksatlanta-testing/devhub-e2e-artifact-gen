apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodce41d5b-87bb-4ba2-b1b3-e0620a5d529e.fullname" . }}
  labels:
    {{- include "go-echodce41d5b-87bb-4ba2-b1b3-e0620a5d529e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodce41d5b-87bb-4ba2-b1b3-e0620a5d529e.selectorLabels" . | nindent 6 }}
