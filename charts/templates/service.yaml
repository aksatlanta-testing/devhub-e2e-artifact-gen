apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo495d1d96-b431-4fa4-aff1-1fc93c12766d.fullname" . }}
  labels:
    {{- include "go-echo495d1d96-b431-4fa4-aff1-1fc93c12766d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo495d1d96-b431-4fa4-aff1-1fc93c12766d.selectorLabels" . | nindent 6 }}
