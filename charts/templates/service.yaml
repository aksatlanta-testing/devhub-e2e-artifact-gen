apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo816ba3af-0eb7-4f07-93fd-73e46b4859a4.fullname" . }}
  labels:
    {{- include "go-echo816ba3af-0eb7-4f07-93fd-73e46b4859a4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo816ba3af-0eb7-4f07-93fd-73e46b4859a4.selectorLabels" . | nindent 6 }}
