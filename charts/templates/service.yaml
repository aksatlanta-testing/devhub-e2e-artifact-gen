apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6a501ecf-5790-4994-99c6-28c6a17085c6.fullname" . }}
  labels:
    {{- include "go-echo6a501ecf-5790-4994-99c6-28c6a17085c6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6a501ecf-5790-4994-99c6-28c6a17085c6.selectorLabels" . | nindent 6 }}
