apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo65311fc8-386c-42ab-b925-d726c907ad38.fullname" . }}
  labels:
    {{- include "go-echo65311fc8-386c-42ab-b925-d726c907ad38.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo65311fc8-386c-42ab-b925-d726c907ad38.selectorLabels" . | nindent 6 }}
