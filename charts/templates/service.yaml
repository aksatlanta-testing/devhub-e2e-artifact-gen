apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof77d1460-f8a1-4d50-82e1-2c989e8105c4.fullname" . }}
  labels:
    {{- include "go-echof77d1460-f8a1-4d50-82e1-2c989e8105c4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof77d1460-f8a1-4d50-82e1-2c989e8105c4.selectorLabels" . | nindent 6 }}
