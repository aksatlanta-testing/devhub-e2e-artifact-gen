apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1cd77753-d215-4409-9343-5c9ab799e97c.fullname" . }}
  labels:
    {{- include "go-echo1cd77753-d215-4409-9343-5c9ab799e97c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1cd77753-d215-4409-9343-5c9ab799e97c.selectorLabels" . | nindent 6 }}
