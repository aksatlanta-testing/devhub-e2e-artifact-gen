apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8e09247f-d14d-484d-926a-7890ff61098d.fullname" . }}
  labels:
    {{- include "go-echo8e09247f-d14d-484d-926a-7890ff61098d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8e09247f-d14d-484d-926a-7890ff61098d.selectorLabels" . | nindent 6 }}
