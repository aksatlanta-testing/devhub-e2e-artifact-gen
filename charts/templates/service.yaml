apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8b04a953-422d-45fd-95a3-831dd29ff75d.fullname" . }}
  labels:
    {{- include "go-echo8b04a953-422d-45fd-95a3-831dd29ff75d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8b04a953-422d-45fd-95a3-831dd29ff75d.selectorLabels" . | nindent 6 }}
