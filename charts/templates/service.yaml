apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo44d26347-5ca5-47bf-8bbd-6f186ca28161.fullname" . }}
  labels:
    {{- include "go-echo44d26347-5ca5-47bf-8bbd-6f186ca28161.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo44d26347-5ca5-47bf-8bbd-6f186ca28161.selectorLabels" . | nindent 6 }}
