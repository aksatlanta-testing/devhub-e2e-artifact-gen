apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoae9160f0-bb0f-4086-9c42-b93dcf046d54.fullname" . }}
  labels:
    {{- include "go-echoae9160f0-bb0f-4086-9c42-b93dcf046d54.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoae9160f0-bb0f-4086-9c42-b93dcf046d54.selectorLabels" . | nindent 6 }}
