apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodadcae47-0eb7-4f0b-88a7-87c8db5860f0.fullname" . }}
  labels:
    {{- include "go-echodadcae47-0eb7-4f0b-88a7-87c8db5860f0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodadcae47-0eb7-4f0b-88a7-87c8db5860f0.selectorLabels" . | nindent 6 }}
