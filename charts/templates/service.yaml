apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo03d69ad0-3651-4cd4-b364-10a14bc0f525.fullname" . }}
  labels:
    {{- include "go-echo03d69ad0-3651-4cd4-b364-10a14bc0f525.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo03d69ad0-3651-4cd4-b364-10a14bc0f525.selectorLabels" . | nindent 6 }}
