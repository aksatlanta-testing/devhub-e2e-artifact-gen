apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo81d29ea7-1223-4a0d-b626-d830be7d019f.fullname" . }}
  labels:
    {{- include "go-echo81d29ea7-1223-4a0d-b626-d830be7d019f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo81d29ea7-1223-4a0d-b626-d830be7d019f.selectorLabels" . | nindent 6 }}
