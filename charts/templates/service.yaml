apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa0a1cecc-02b6-47bc-a894-f25535a93b82.fullname" . }}
  labels:
    {{- include "go-echoa0a1cecc-02b6-47bc-a894-f25535a93b82.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa0a1cecc-02b6-47bc-a894-f25535a93b82.selectorLabels" . | nindent 6 }}
