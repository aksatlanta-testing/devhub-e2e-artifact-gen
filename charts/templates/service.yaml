apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo245f8b18-c247-4f27-983e-a930468f988e.fullname" . }}
  labels:
    {{- include "go-echo245f8b18-c247-4f27-983e-a930468f988e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo245f8b18-c247-4f27-983e-a930468f988e.selectorLabels" . | nindent 6 }}
