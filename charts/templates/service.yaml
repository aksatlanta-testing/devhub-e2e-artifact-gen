apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2b45f198-a51e-44fa-9752-06e0afdd4358.fullname" . }}
  labels:
    {{- include "go-echo2b45f198-a51e-44fa-9752-06e0afdd4358.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2b45f198-a51e-44fa-9752-06e0afdd4358.selectorLabels" . | nindent 6 }}
