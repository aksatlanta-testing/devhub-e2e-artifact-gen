apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo62b109f0-5566-4e81-a092-5efca71354ba.fullname" . }}
  labels:
    {{- include "go-echo62b109f0-5566-4e81-a092-5efca71354ba.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo62b109f0-5566-4e81-a092-5efca71354ba.selectorLabels" . | nindent 6 }}
