apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo413a4dd5-cdd2-474a-9cfe-309be22726be.fullname" . }}
  labels:
    {{- include "go-echo413a4dd5-cdd2-474a-9cfe-309be22726be.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo413a4dd5-cdd2-474a-9cfe-309be22726be.selectorLabels" . | nindent 6 }}
