apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob647ce14-dc87-4df7-9e3a-17676a9b4a1f.fullname" . }}
  labels:
    {{- include "go-echob647ce14-dc87-4df7-9e3a-17676a9b4a1f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob647ce14-dc87-4df7-9e3a-17676a9b4a1f.selectorLabels" . | nindent 6 }}
