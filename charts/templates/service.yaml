apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod647405a-ffed-43f0-a82c-565fabf5b9d6.fullname" . }}
  labels:
    {{- include "go-echod647405a-ffed-43f0-a82c-565fabf5b9d6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod647405a-ffed-43f0-a82c-565fabf5b9d6.selectorLabels" . | nindent 6 }}
