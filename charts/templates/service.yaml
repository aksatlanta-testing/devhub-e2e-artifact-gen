apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3eb08d0f-f1e1-469e-b889-fd1a3b070344.fullname" . }}
  labels:
    {{- include "go-echo3eb08d0f-f1e1-469e-b889-fd1a3b070344.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3eb08d0f-f1e1-469e-b889-fd1a3b070344.selectorLabels" . | nindent 6 }}
