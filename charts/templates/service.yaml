apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9858f2c2-4531-4399-b777-b3d9477d851a.fullname" . }}
  labels:
    {{- include "go-echo9858f2c2-4531-4399-b777-b3d9477d851a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9858f2c2-4531-4399-b777-b3d9477d851a.selectorLabels" . | nindent 6 }}
