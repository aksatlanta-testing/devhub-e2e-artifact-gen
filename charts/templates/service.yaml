apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodba312bc-ed21-4dcf-b50c-a164d884478d.fullname" . }}
  labels:
    {{- include "go-echodba312bc-ed21-4dcf-b50c-a164d884478d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodba312bc-ed21-4dcf-b50c-a164d884478d.selectorLabels" . | nindent 6 }}
