apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa1b212d8-1d65-4c75-a07e-1dfc8b4793bd.fullname" . }}
  labels:
    {{- include "go-echoa1b212d8-1d65-4c75-a07e-1dfc8b4793bd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa1b212d8-1d65-4c75-a07e-1dfc8b4793bd.selectorLabels" . | nindent 6 }}
