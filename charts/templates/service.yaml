apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3e8dd575-0830-46fb-9939-90b836d73d9a.fullname" . }}
  labels:
    {{- include "go-echo3e8dd575-0830-46fb-9939-90b836d73d9a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3e8dd575-0830-46fb-9939-90b836d73d9a.selectorLabels" . | nindent 6 }}
