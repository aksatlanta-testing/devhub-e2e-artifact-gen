apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo89ab7cd3-a47e-4ec4-a2c6-b20ebfbf9818.fullname" . }}
  labels:
    {{- include "go-echo89ab7cd3-a47e-4ec4-a2c6-b20ebfbf9818.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo89ab7cd3-a47e-4ec4-a2c6-b20ebfbf9818.selectorLabels" . | nindent 6 }}
