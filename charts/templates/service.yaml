apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodb4b33c0-a569-415d-b1b5-08da2b64edc2.fullname" . }}
  labels:
    {{- include "go-echodb4b33c0-a569-415d-b1b5-08da2b64edc2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodb4b33c0-a569-415d-b1b5-08da2b64edc2.selectorLabels" . | nindent 6 }}
