apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo55e8d236-5462-4700-8cce-03cb82772c60.fullname" . }}
  labels:
    {{- include "go-echo55e8d236-5462-4700-8cce-03cb82772c60.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo55e8d236-5462-4700-8cce-03cb82772c60.selectorLabels" . | nindent 6 }}
