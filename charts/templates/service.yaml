apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocbb971aa-ae36-48dd-ba44-fd82ad1f563d.fullname" . }}
  labels:
    {{- include "go-echocbb971aa-ae36-48dd-ba44-fd82ad1f563d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocbb971aa-ae36-48dd-ba44-fd82ad1f563d.selectorLabels" . | nindent 6 }}
