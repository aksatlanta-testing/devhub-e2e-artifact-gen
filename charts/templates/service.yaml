apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0ede236b-d15b-45c1-963e-37c2e8822b50.fullname" . }}
  labels:
    {{- include "go-echo0ede236b-d15b-45c1-963e-37c2e8822b50.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0ede236b-d15b-45c1-963e-37c2e8822b50.selectorLabels" . | nindent 6 }}
