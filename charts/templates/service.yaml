apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoff6e6ac3-208d-42d2-8258-2d96595edb28.fullname" . }}
  labels:
    {{- include "go-echoff6e6ac3-208d-42d2-8258-2d96595edb28.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoff6e6ac3-208d-42d2-8258-2d96595edb28.selectorLabels" . | nindent 6 }}
