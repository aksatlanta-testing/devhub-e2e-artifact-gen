apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8aad5acb-3aed-4db3-9959-042da3675e2b.fullname" . }}
  labels:
    {{- include "go-echo8aad5acb-3aed-4db3-9959-042da3675e2b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8aad5acb-3aed-4db3-9959-042da3675e2b.selectorLabels" . | nindent 6 }}
