apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod7e4cf66-b561-42b2-873b-6f5b03321a68.fullname" . }}
  labels:
    {{- include "go-echod7e4cf66-b561-42b2-873b-6f5b03321a68.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod7e4cf66-b561-42b2-873b-6f5b03321a68.selectorLabels" . | nindent 6 }}
