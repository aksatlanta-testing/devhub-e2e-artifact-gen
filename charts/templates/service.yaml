apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo26c07009-bca6-4e80-93f3-0520be64403c.fullname" . }}
  labels:
    {{- include "go-echo26c07009-bca6-4e80-93f3-0520be64403c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo26c07009-bca6-4e80-93f3-0520be64403c.selectorLabels" . | nindent 6 }}
