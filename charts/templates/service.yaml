apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2d1a818a-eb32-4e6e-9c1e-20bfedfd495f.fullname" . }}
  labels:
    {{- include "go-echo2d1a818a-eb32-4e6e-9c1e-20bfedfd495f.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2d1a818a-eb32-4e6e-9c1e-20bfedfd495f.selectorLabels" . | nindent 6 }}
