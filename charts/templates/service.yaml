apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo189d054e-84e7-4342-bab1-5f152a4e330c.fullname" . }}
  labels:
    {{- include "go-echo189d054e-84e7-4342-bab1-5f152a4e330c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo189d054e-84e7-4342-bab1-5f152a4e330c.selectorLabels" . | nindent 6 }}
