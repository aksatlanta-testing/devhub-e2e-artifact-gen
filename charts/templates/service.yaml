apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6fc51851-cf78-41f3-a8f8-04f7564f28f9.fullname" . }}
  labels:
    {{- include "go-echo6fc51851-cf78-41f3-a8f8-04f7564f28f9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6fc51851-cf78-41f3-a8f8-04f7564f28f9.selectorLabels" . | nindent 6 }}
