apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo254c95b8-a595-47fc-a260-db8aac009127.fullname" . }}
  labels:
    {{- include "go-echo254c95b8-a595-47fc-a260-db8aac009127.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo254c95b8-a595-47fc-a260-db8aac009127.selectorLabels" . | nindent 6 }}
