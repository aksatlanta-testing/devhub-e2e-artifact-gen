apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof4a7c706-34e3-4e9d-9e72-057ba8d4f761.fullname" . }}
  labels:
    {{- include "go-echof4a7c706-34e3-4e9d-9e72-057ba8d4f761.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof4a7c706-34e3-4e9d-9e72-057ba8d4f761.selectorLabels" . | nindent 6 }}
