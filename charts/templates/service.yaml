apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9f66a4e9-04fe-4b2b-85ec-2dc6b6448047.fullname" . }}
  labels:
    {{- include "go-echo9f66a4e9-04fe-4b2b-85ec-2dc6b6448047.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9f66a4e9-04fe-4b2b-85ec-2dc6b6448047.selectorLabels" . | nindent 6 }}
