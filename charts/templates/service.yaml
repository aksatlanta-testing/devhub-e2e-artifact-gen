apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8f4e0714-e8c3-4858-bd06-9baee86f1e9d.fullname" . }}
  labels:
    {{- include "go-echo8f4e0714-e8c3-4858-bd06-9baee86f1e9d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8f4e0714-e8c3-4858-bd06-9baee86f1e9d.selectorLabels" . | nindent 6 }}
