apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1aa9acac-8297-412b-b086-b3235d45342c.fullname" . }}
  labels:
    {{- include "go-echo1aa9acac-8297-412b-b086-b3235d45342c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1aa9acac-8297-412b-b086-b3235d45342c.selectorLabels" . | nindent 6 }}
