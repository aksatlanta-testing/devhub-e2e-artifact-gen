apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2c539421-b11d-45f3-8d5c-b85c0bba283c.fullname" . }}
  labels:
    {{- include "go-echo2c539421-b11d-45f3-8d5c-b85c0bba283c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2c539421-b11d-45f3-8d5c-b85c0bba283c.selectorLabels" . | nindent 6 }}
