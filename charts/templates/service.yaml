apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3d28b623-acce-4c33-9621-139483f1aa7a.fullname" . }}
  labels:
    {{- include "go-echo3d28b623-acce-4c33-9621-139483f1aa7a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3d28b623-acce-4c33-9621-139483f1aa7a.selectorLabels" . | nindent 6 }}
