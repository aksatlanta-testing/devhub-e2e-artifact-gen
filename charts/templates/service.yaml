apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo580ccbf4-d096-4bc8-8789-da1864690b0a.fullname" . }}
  labels:
    {{- include "go-echo580ccbf4-d096-4bc8-8789-da1864690b0a.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo580ccbf4-d096-4bc8-8789-da1864690b0a.selectorLabels" . | nindent 6 }}
