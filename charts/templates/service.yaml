apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe7a2b8a7-c3ac-4490-9907-86d1033b367f.fullname" . }}
  labels:
    {{- include "go-echoe7a2b8a7-c3ac-4490-9907-86d1033b367f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe7a2b8a7-c3ac-4490-9907-86d1033b367f.selectorLabels" . | nindent 6 }}
