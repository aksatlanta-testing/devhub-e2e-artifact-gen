apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo77290144-bed1-4980-91e6-f1bf6d7ca1db.fullname" . }}
  labels:
    {{- include "go-echo77290144-bed1-4980-91e6-f1bf6d7ca1db.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo77290144-bed1-4980-91e6-f1bf6d7ca1db.selectorLabels" . | nindent 6 }}
