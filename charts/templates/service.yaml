apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc557bb00-6d24-4b21-a7eb-44aa2da981aa.fullname" . }}
  labels:
    {{- include "go-echoc557bb00-6d24-4b21-a7eb-44aa2da981aa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc557bb00-6d24-4b21-a7eb-44aa2da981aa.selectorLabels" . | nindent 6 }}
