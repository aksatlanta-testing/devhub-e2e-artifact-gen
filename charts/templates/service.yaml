apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof38b1cfb-51dd-4655-a97d-febfdfe51180.fullname" . }}
  labels:
    {{- include "go-echof38b1cfb-51dd-4655-a97d-febfdfe51180.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof38b1cfb-51dd-4655-a97d-febfdfe51180.selectorLabels" . | nindent 6 }}
