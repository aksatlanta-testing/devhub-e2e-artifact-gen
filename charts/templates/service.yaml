apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob8308b12-61e0-45b8-a1d3-1fc54905af14.fullname" . }}
  labels:
    {{- include "go-echob8308b12-61e0-45b8-a1d3-1fc54905af14.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob8308b12-61e0-45b8-a1d3-1fc54905af14.selectorLabels" . | nindent 6 }}
