apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof8212b9e-cb55-4911-84a7-ec58921745b4.fullname" . }}
  labels:
    {{- include "go-echof8212b9e-cb55-4911-84a7-ec58921745b4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof8212b9e-cb55-4911-84a7-ec58921745b4.selectorLabels" . | nindent 6 }}
