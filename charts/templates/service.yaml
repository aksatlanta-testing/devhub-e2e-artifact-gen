apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo171c2ff4-9be4-43dc-ae0a-34397952e3a6.fullname" . }}
  labels:
    {{- include "go-echo171c2ff4-9be4-43dc-ae0a-34397952e3a6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo171c2ff4-9be4-43dc-ae0a-34397952e3a6.selectorLabels" . | nindent 6 }}
