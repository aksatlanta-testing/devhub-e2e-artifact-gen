apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4ba644ba-6a63-4c1f-b8ee-a827552ee18f.fullname" . }}
  labels:
    {{- include "go-echo4ba644ba-6a63-4c1f-b8ee-a827552ee18f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4ba644ba-6a63-4c1f-b8ee-a827552ee18f.selectorLabels" . | nindent 6 }}
