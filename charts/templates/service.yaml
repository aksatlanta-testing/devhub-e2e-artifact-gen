apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe8aa7862-2a4b-4c2e-9b40-bdcecc2cae67.fullname" . }}
  labels:
    {{- include "go-echoe8aa7862-2a4b-4c2e-9b40-bdcecc2cae67.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe8aa7862-2a4b-4c2e-9b40-bdcecc2cae67.selectorLabels" . | nindent 6 }}
