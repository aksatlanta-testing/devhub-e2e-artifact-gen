apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofc75754a-3f85-4ed1-a923-dd67611ad71b.fullname" . }}
  labels:
    {{- include "go-echofc75754a-3f85-4ed1-a923-dd67611ad71b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofc75754a-3f85-4ed1-a923-dd67611ad71b.selectorLabels" . | nindent 6 }}
