apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo69ea9447-41d8-492f-8e1b-6040a266ae41.fullname" . }}
  labels:
    {{- include "go-echo69ea9447-41d8-492f-8e1b-6040a266ae41.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo69ea9447-41d8-492f-8e1b-6040a266ae41.selectorLabels" . | nindent 6 }}
