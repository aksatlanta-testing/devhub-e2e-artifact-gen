apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobcdc6832-34a3-4c04-9fcc-56ef639804b7.fullname" . }}
  labels:
    {{- include "go-echobcdc6832-34a3-4c04-9fcc-56ef639804b7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobcdc6832-34a3-4c04-9fcc-56ef639804b7.selectorLabels" . | nindent 6 }}
