apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa6b5357c-57e7-4a7f-bb9e-8b4191460446.fullname" . }}
  labels:
    {{- include "go-echoa6b5357c-57e7-4a7f-bb9e-8b4191460446.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa6b5357c-57e7-4a7f-bb9e-8b4191460446.selectorLabels" . | nindent 6 }}
