apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoac9c1e76-9a51-4d3a-92f8-91bcfed1073a.fullname" . }}
  labels:
    {{- include "go-echoac9c1e76-9a51-4d3a-92f8-91bcfed1073a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoac9c1e76-9a51-4d3a-92f8-91bcfed1073a.selectorLabels" . | nindent 6 }}
