apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9040056c-0c2e-4ef1-a720-91bfa433b515.fullname" . }}
  labels:
    {{- include "go-echo9040056c-0c2e-4ef1-a720-91bfa433b515.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9040056c-0c2e-4ef1-a720-91bfa433b515.selectorLabels" . | nindent 6 }}
