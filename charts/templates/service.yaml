apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0b7a480f-3bc2-401a-a67e-03e88a18b3cf.fullname" . }}
  labels:
    {{- include "go-echo0b7a480f-3bc2-401a-a67e-03e88a18b3cf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0b7a480f-3bc2-401a-a67e-03e88a18b3cf.selectorLabels" . | nindent 6 }}
