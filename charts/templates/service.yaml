apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9b3572a5-89e8-4ced-b8e5-bea70150c5d4.fullname" . }}
  labels:
    {{- include "go-echo9b3572a5-89e8-4ced-b8e5-bea70150c5d4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9b3572a5-89e8-4ced-b8e5-bea70150c5d4.selectorLabels" . | nindent 6 }}
