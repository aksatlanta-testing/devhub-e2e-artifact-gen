apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod50eb906-3eaa-4610-aaca-c58ae7b54146.fullname" . }}
  labels:
    {{- include "go-echod50eb906-3eaa-4610-aaca-c58ae7b54146.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod50eb906-3eaa-4610-aaca-c58ae7b54146.selectorLabels" . | nindent 6 }}
