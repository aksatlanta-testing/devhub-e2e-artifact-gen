apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof4933bca-5901-41b3-a845-cc821aa8946c.fullname" . }}
  labels:
    {{- include "go-echof4933bca-5901-41b3-a845-cc821aa8946c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof4933bca-5901-41b3-a845-cc821aa8946c.selectorLabels" . | nindent 6 }}
