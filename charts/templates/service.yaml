apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo82c5d820-4c29-42cb-a17d-4a3fd98c942c.fullname" . }}
  labels:
    {{- include "go-echo82c5d820-4c29-42cb-a17d-4a3fd98c942c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo82c5d820-4c29-42cb-a17d-4a3fd98c942c.selectorLabels" . | nindent 6 }}
