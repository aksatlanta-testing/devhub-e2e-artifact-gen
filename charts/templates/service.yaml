apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo63cc313f-91d1-4fad-bd37-493fd29cb131.fullname" . }}
  labels:
    {{- include "go-echo63cc313f-91d1-4fad-bd37-493fd29cb131.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo63cc313f-91d1-4fad-bd37-493fd29cb131.selectorLabels" . | nindent 6 }}
