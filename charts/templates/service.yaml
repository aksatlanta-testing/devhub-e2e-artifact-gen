apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo027f57c0-aa62-439c-b798-f1a5a4873558.fullname" . }}
  labels:
    {{- include "go-echo027f57c0-aa62-439c-b798-f1a5a4873558.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo027f57c0-aa62-439c-b798-f1a5a4873558.selectorLabels" . | nindent 6 }}
