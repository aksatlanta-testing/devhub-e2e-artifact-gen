apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6cff9426-86ef-4cba-9800-dba70ffc6592.fullname" . }}
  labels:
    {{- include "go-echo6cff9426-86ef-4cba-9800-dba70ffc6592.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6cff9426-86ef-4cba-9800-dba70ffc6592.selectorLabels" . | nindent 6 }}
