apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob3675812-b8d4-482b-a1c1-5089bf60d905.fullname" . }}
  labels:
    {{- include "go-echob3675812-b8d4-482b-a1c1-5089bf60d905.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob3675812-b8d4-482b-a1c1-5089bf60d905.selectorLabels" . | nindent 6 }}
