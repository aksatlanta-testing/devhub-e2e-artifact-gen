apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0bf57f35-1ea8-44ba-b04b-88a3237ef708.fullname" . }}
  labels:
    {{- include "go-echo0bf57f35-1ea8-44ba-b04b-88a3237ef708.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0bf57f35-1ea8-44ba-b04b-88a3237ef708.selectorLabels" . | nindent 6 }}
