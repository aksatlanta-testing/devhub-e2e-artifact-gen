apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa01cc7e9-313a-4667-aa4b-178bcd4dd847.fullname" . }}
  labels:
    {{- include "go-echoa01cc7e9-313a-4667-aa4b-178bcd4dd847.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa01cc7e9-313a-4667-aa4b-178bcd4dd847.selectorLabels" . | nindent 6 }}
