apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa55ef2d0-ef3b-464c-a51a-2d2dec2ebe7f.fullname" . }}
  labels:
    {{- include "go-echoa55ef2d0-ef3b-464c-a51a-2d2dec2ebe7f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa55ef2d0-ef3b-464c-a51a-2d2dec2ebe7f.selectorLabels" . | nindent 6 }}
