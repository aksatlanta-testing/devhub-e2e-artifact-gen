apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo10428c44-afe1-4738-bfec-389801b25615.fullname" . }}
  labels:
    {{- include "go-echo10428c44-afe1-4738-bfec-389801b25615.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo10428c44-afe1-4738-bfec-389801b25615.selectorLabels" . | nindent 6 }}
