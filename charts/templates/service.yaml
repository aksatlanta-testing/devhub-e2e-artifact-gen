apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof8e512d5-319f-4790-b0f1-1f7da5ee6697.fullname" . }}
  labels:
    {{- include "go-echof8e512d5-319f-4790-b0f1-1f7da5ee6697.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof8e512d5-319f-4790-b0f1-1f7da5ee6697.selectorLabels" . | nindent 6 }}
