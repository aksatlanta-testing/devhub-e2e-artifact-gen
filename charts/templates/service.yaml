apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob69f7c6b-b9d7-40b8-8bf5-940f30090daa.fullname" . }}
  labels:
    {{- include "go-echob69f7c6b-b9d7-40b8-8bf5-940f30090daa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob69f7c6b-b9d7-40b8-8bf5-940f30090daa.selectorLabels" . | nindent 6 }}
