apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6c875ace-b5bb-43db-937f-21fc05498c02.fullname" . }}
  labels:
    {{- include "go-echo6c875ace-b5bb-43db-937f-21fc05498c02.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6c875ace-b5bb-43db-937f-21fc05498c02.selectorLabels" . | nindent 6 }}
