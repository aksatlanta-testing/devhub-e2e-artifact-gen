apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3f1f9749-c4d6-46f6-b40a-902ef79e4d0a.fullname" . }}
  labels:
    {{- include "go-echo3f1f9749-c4d6-46f6-b40a-902ef79e4d0a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3f1f9749-c4d6-46f6-b40a-902ef79e4d0a.selectorLabels" . | nindent 6 }}
