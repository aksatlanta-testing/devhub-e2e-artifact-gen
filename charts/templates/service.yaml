apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe907699e-1b46-44aa-9a51-a8b3d21c6fa0.fullname" . }}
  labels:
    {{- include "go-echoe907699e-1b46-44aa-9a51-a8b3d21c6fa0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe907699e-1b46-44aa-9a51-a8b3d21c6fa0.selectorLabels" . | nindent 6 }}
