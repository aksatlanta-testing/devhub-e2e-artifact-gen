apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob893e3b9-a3c3-46cd-ad40-5cf4d4fe46e4.fullname" . }}
  labels:
    {{- include "go-echob893e3b9-a3c3-46cd-ad40-5cf4d4fe46e4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob893e3b9-a3c3-46cd-ad40-5cf4d4fe46e4.selectorLabels" . | nindent 6 }}
