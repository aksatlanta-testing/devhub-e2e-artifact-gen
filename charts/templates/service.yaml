apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa7cc206f-3265-48c9-b626-d3798dd93884.fullname" . }}
  labels:
    {{- include "go-echoa7cc206f-3265-48c9-b626-d3798dd93884.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa7cc206f-3265-48c9-b626-d3798dd93884.selectorLabels" . | nindent 6 }}
