apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo55a2d503-7341-4dae-ada4-a1bb147956a8.fullname" . }}
  labels:
    {{- include "go-echo55a2d503-7341-4dae-ada4-a1bb147956a8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo55a2d503-7341-4dae-ada4-a1bb147956a8.selectorLabels" . | nindent 6 }}
