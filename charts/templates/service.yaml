apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodbe26e61-b7de-40d7-88ed-08f7ac7e1ad8.fullname" . }}
  labels:
    {{- include "go-echodbe26e61-b7de-40d7-88ed-08f7ac7e1ad8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodbe26e61-b7de-40d7-88ed-08f7ac7e1ad8.selectorLabels" . | nindent 6 }}
