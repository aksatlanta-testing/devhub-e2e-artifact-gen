apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod4f96d80-666a-4a59-abef-639c726b1bf9.fullname" . }}
  labels:
    {{- include "go-echod4f96d80-666a-4a59-abef-639c726b1bf9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod4f96d80-666a-4a59-abef-639c726b1bf9.selectorLabels" . | nindent 6 }}
