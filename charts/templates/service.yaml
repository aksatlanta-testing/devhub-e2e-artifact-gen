apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoda104364-31bc-48b5-9483-8ea6173f5a80.fullname" . }}
  labels:
    {{- include "go-echoda104364-31bc-48b5-9483-8ea6173f5a80.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoda104364-31bc-48b5-9483-8ea6173f5a80.selectorLabels" . | nindent 6 }}
