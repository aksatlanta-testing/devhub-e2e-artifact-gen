apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7a04f5e0-424a-4c7e-acff-184026b1ac26.fullname" . }}
  labels:
    {{- include "go-echo7a04f5e0-424a-4c7e-acff-184026b1ac26.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7a04f5e0-424a-4c7e-acff-184026b1ac26.selectorLabels" . | nindent 6 }}
