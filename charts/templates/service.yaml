apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe32c6e15-72ce-4682-899c-728930ff1fee.fullname" . }}
  labels:
    {{- include "go-echoe32c6e15-72ce-4682-899c-728930ff1fee.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe32c6e15-72ce-4682-899c-728930ff1fee.selectorLabels" . | nindent 6 }}
