apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5b118fe3-4d5a-4f1e-9f9e-bf9ca506d169.fullname" . }}
  labels:
    {{- include "go-echo5b118fe3-4d5a-4f1e-9f9e-bf9ca506d169.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5b118fe3-4d5a-4f1e-9f9e-bf9ca506d169.selectorLabels" . | nindent 6 }}
