apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo73f02408-c572-4510-b152-74893a08396d.fullname" . }}
  labels:
    {{- include "go-echo73f02408-c572-4510-b152-74893a08396d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo73f02408-c572-4510-b152-74893a08396d.selectorLabels" . | nindent 6 }}
