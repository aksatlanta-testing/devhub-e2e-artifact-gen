apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9df4f84c-0ba8-45d0-a10f-2012f719a6d6.fullname" . }}
  labels:
    {{- include "go-echo9df4f84c-0ba8-45d0-a10f-2012f719a6d6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9df4f84c-0ba8-45d0-a10f-2012f719a6d6.selectorLabels" . | nindent 6 }}
