apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoffa69d16-fd99-477a-80c7-a6a211137d69.fullname" . }}
  labels:
    {{- include "go-echoffa69d16-fd99-477a-80c7-a6a211137d69.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoffa69d16-fd99-477a-80c7-a6a211137d69.selectorLabels" . | nindent 6 }}
