apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoed6b4142-0882-460a-aa8b-7c314ecfe51b.fullname" . }}
  labels:
    {{- include "go-echoed6b4142-0882-460a-aa8b-7c314ecfe51b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoed6b4142-0882-460a-aa8b-7c314ecfe51b.selectorLabels" . | nindent 6 }}
