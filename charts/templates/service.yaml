apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8a066f2b-60ed-44eb-8847-bc1a27d16dcd.fullname" . }}
  labels:
    {{- include "go-echo8a066f2b-60ed-44eb-8847-bc1a27d16dcd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8a066f2b-60ed-44eb-8847-bc1a27d16dcd.selectorLabels" . | nindent 6 }}
