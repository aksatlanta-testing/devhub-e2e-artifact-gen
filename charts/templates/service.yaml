apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc77cd148-1bdd-4564-a7af-bf62ab044733.fullname" . }}
  labels:
    {{- include "go-echoc77cd148-1bdd-4564-a7af-bf62ab044733.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc77cd148-1bdd-4564-a7af-bf62ab044733.selectorLabels" . | nindent 6 }}
