apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3be95fed-c5ef-4ec9-a1ba-1fa7e57d0b40.fullname" . }}
  labels:
    {{- include "go-echo3be95fed-c5ef-4ec9-a1ba-1fa7e57d0b40.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3be95fed-c5ef-4ec9-a1ba-1fa7e57d0b40.selectorLabels" . | nindent 6 }}
