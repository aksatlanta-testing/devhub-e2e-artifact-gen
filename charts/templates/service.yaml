apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa96e7a04-68a4-42e4-b025-976ae50c6ee0.fullname" . }}
  labels:
    {{- include "go-echoa96e7a04-68a4-42e4-b025-976ae50c6ee0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa96e7a04-68a4-42e4-b025-976ae50c6ee0.selectorLabels" . | nindent 6 }}
