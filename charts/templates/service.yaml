apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo88228ad1-e7ce-429c-b69a-a0008cdb2590.fullname" . }}
  labels:
    {{- include "go-echo88228ad1-e7ce-429c-b69a-a0008cdb2590.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo88228ad1-e7ce-429c-b69a-a0008cdb2590.selectorLabels" . | nindent 6 }}
