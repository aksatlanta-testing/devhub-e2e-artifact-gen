apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6c6dfef6-90c3-49de-a027-534953000d1d.fullname" . }}
  labels:
    {{- include "go-echo6c6dfef6-90c3-49de-a027-534953000d1d.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6c6dfef6-90c3-49de-a027-534953000d1d.selectorLabels" . | nindent 6 }}
