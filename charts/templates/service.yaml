apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo06f0e308-052d-49b0-82c2-ac0fecef6e66.fullname" . }}
  labels:
    {{- include "go-echo06f0e308-052d-49b0-82c2-ac0fecef6e66.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo06f0e308-052d-49b0-82c2-ac0fecef6e66.selectorLabels" . | nindent 6 }}
