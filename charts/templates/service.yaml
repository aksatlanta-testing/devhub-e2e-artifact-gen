apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof63e3e00-c436-4355-8830-be3b4d5d4325.fullname" . }}
  labels:
    {{- include "go-echof63e3e00-c436-4355-8830-be3b4d5d4325.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof63e3e00-c436-4355-8830-be3b4d5d4325.selectorLabels" . | nindent 6 }}
