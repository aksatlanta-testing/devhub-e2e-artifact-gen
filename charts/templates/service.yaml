apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo23236891-5ebf-4ca6-9ee6-c11aff660cbf.fullname" . }}
  labels:
    {{- include "go-echo23236891-5ebf-4ca6-9ee6-c11aff660cbf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo23236891-5ebf-4ca6-9ee6-c11aff660cbf.selectorLabels" . | nindent 6 }}
