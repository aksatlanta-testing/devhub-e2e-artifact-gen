apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob8a0a901-20e1-42c5-8320-45a11eb2376b.fullname" . }}
  labels:
    {{- include "go-echob8a0a901-20e1-42c5-8320-45a11eb2376b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob8a0a901-20e1-42c5-8320-45a11eb2376b.selectorLabels" . | nindent 6 }}
