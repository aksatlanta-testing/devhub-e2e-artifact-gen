apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo63763c7f-c643-4aa8-8734-4efa2d81e8cb.fullname" . }}
  labels:
    {{- include "go-echo63763c7f-c643-4aa8-8734-4efa2d81e8cb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo63763c7f-c643-4aa8-8734-4efa2d81e8cb.selectorLabels" . | nindent 6 }}
