apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod70e0dde-82c7-43a8-ada7-42ad9e8aaf78.fullname" . }}
  labels:
    {{- include "go-echod70e0dde-82c7-43a8-ada7-42ad9e8aaf78.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod70e0dde-82c7-43a8-ada7-42ad9e8aaf78.selectorLabels" . | nindent 6 }}
