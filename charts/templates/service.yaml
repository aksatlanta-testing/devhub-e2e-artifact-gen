apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod1fbc89a-9f37-456f-946a-ddb4caec5db1.fullname" . }}
  labels:
    {{- include "go-echod1fbc89a-9f37-456f-946a-ddb4caec5db1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod1fbc89a-9f37-456f-946a-ddb4caec5db1.selectorLabels" . | nindent 6 }}
