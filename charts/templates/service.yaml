apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoed87897a-6f4c-4f2b-a22a-9602906ec449.fullname" . }}
  labels:
    {{- include "go-echoed87897a-6f4c-4f2b-a22a-9602906ec449.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoed87897a-6f4c-4f2b-a22a-9602906ec449.selectorLabels" . | nindent 6 }}
