apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobf3c8e9c-0b97-4c82-b8ab-74bef9da5a98.fullname" . }}
  labels:
    {{- include "go-echobf3c8e9c-0b97-4c82-b8ab-74bef9da5a98.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobf3c8e9c-0b97-4c82-b8ab-74bef9da5a98.selectorLabels" . | nindent 6 }}
