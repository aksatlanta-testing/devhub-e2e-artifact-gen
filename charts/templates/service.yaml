apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9be28cac-d7ba-4b04-988b-07ccf53aa7c5.fullname" . }}
  labels:
    {{- include "go-echo9be28cac-d7ba-4b04-988b-07ccf53aa7c5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9be28cac-d7ba-4b04-988b-07ccf53aa7c5.selectorLabels" . | nindent 6 }}
