apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo21484b80-eac4-4840-a4c0-03c46be858c5.fullname" . }}
  labels:
    {{- include "go-echo21484b80-eac4-4840-a4c0-03c46be858c5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo21484b80-eac4-4840-a4c0-03c46be858c5.selectorLabels" . | nindent 6 }}
