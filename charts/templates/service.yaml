apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0dd844e1-4000-40d7-a7e7-8729540ea72c.fullname" . }}
  labels:
    {{- include "go-echo0dd844e1-4000-40d7-a7e7-8729540ea72c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0dd844e1-4000-40d7-a7e7-8729540ea72c.selectorLabels" . | nindent 6 }}
