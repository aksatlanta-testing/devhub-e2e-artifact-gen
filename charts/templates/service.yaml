apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2b219b84-2cf8-48f0-b6df-b7c5cd404d75.fullname" . }}
  labels:
    {{- include "go-echo2b219b84-2cf8-48f0-b6df-b7c5cd404d75.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2b219b84-2cf8-48f0-b6df-b7c5cd404d75.selectorLabels" . | nindent 6 }}
