apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoef01921d-5416-4d94-8b72-ea1e0b1fd2f0.fullname" . }}
  labels:
    {{- include "go-echoef01921d-5416-4d94-8b72-ea1e0b1fd2f0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoef01921d-5416-4d94-8b72-ea1e0b1fd2f0.selectorLabels" . | nindent 6 }}
