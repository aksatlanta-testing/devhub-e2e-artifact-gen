apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo20fbc2fc-62a3-4e19-8d1d-c6a172096dd8.fullname" . }}
  labels:
    {{- include "go-echo20fbc2fc-62a3-4e19-8d1d-c6a172096dd8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo20fbc2fc-62a3-4e19-8d1d-c6a172096dd8.selectorLabels" . | nindent 6 }}
