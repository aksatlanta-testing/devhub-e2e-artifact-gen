apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo49a8152f-1f3f-4d7f-aeb8-dd1bd33a4c80.fullname" . }}
  labels:
    {{- include "go-echo49a8152f-1f3f-4d7f-aeb8-dd1bd33a4c80.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo49a8152f-1f3f-4d7f-aeb8-dd1bd33a4c80.selectorLabels" . | nindent 6 }}
