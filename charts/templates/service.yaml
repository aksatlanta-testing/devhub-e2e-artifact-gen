apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe3252266-06cd-4cb0-96ea-7090b35aefa6.fullname" . }}
  labels:
    {{- include "go-echoe3252266-06cd-4cb0-96ea-7090b35aefa6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe3252266-06cd-4cb0-96ea-7090b35aefa6.selectorLabels" . | nindent 6 }}
