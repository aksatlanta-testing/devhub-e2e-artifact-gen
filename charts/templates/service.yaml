apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob087e2e6-dade-4ec1-a4d2-230b372858ba.fullname" . }}
  labels:
    {{- include "go-echob087e2e6-dade-4ec1-a4d2-230b372858ba.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob087e2e6-dade-4ec1-a4d2-230b372858ba.selectorLabels" . | nindent 6 }}
