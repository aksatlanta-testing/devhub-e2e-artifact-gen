apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc3c0a71e-6e55-4093-9578-613d8c70c385.fullname" . }}
  labels:
    {{- include "go-echoc3c0a71e-6e55-4093-9578-613d8c70c385.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc3c0a71e-6e55-4093-9578-613d8c70c385.selectorLabels" . | nindent 6 }}
