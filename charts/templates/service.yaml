apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof7ce5bd8-ee92-4dcf-903e-26b42ccfb17f.fullname" . }}
  labels:
    {{- include "go-echof7ce5bd8-ee92-4dcf-903e-26b42ccfb17f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof7ce5bd8-ee92-4dcf-903e-26b42ccfb17f.selectorLabels" . | nindent 6 }}
