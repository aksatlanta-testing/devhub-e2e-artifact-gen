apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9fcd3782-fb4f-41fa-be99-88ffab795093.fullname" . }}
  labels:
    {{- include "go-echo9fcd3782-fb4f-41fa-be99-88ffab795093.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9fcd3782-fb4f-41fa-be99-88ffab795093.selectorLabels" . | nindent 6 }}
