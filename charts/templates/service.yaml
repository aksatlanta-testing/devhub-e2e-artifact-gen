apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc63049c8-d725-4334-8b81-513b3f1ac0a3.fullname" . }}
  labels:
    {{- include "go-echoc63049c8-d725-4334-8b81-513b3f1ac0a3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc63049c8-d725-4334-8b81-513b3f1ac0a3.selectorLabels" . | nindent 6 }}
