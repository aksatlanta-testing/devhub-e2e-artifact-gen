apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3878e8a4-080e-45ec-82cc-bece583b38ab.fullname" . }}
  labels:
    {{- include "go-echo3878e8a4-080e-45ec-82cc-bece583b38ab.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3878e8a4-080e-45ec-82cc-bece583b38ab.selectorLabels" . | nindent 6 }}
