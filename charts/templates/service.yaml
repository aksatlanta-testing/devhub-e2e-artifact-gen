apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoacfc9a61-8703-403d-aad1-551fb66e9060.fullname" . }}
  labels:
    {{- include "go-echoacfc9a61-8703-403d-aad1-551fb66e9060.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoacfc9a61-8703-403d-aad1-551fb66e9060.selectorLabels" . | nindent 6 }}
