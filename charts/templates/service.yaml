apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo070be2a4-f359-4624-a1c0-d4629f84c388.fullname" . }}
  labels:
    {{- include "go-echo070be2a4-f359-4624-a1c0-d4629f84c388.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo070be2a4-f359-4624-a1c0-d4629f84c388.selectorLabels" . | nindent 6 }}
