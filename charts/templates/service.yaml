apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodc2d368b-157a-487f-840c-7869f1d4227f.fullname" . }}
  labels:
    {{- include "go-echodc2d368b-157a-487f-840c-7869f1d4227f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodc2d368b-157a-487f-840c-7869f1d4227f.selectorLabels" . | nindent 6 }}
