apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe2f471cb-530e-47dc-9aca-65e49c863ddc.fullname" . }}
  labels:
    {{- include "go-echoe2f471cb-530e-47dc-9aca-65e49c863ddc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe2f471cb-530e-47dc-9aca-65e49c863ddc.selectorLabels" . | nindent 6 }}
