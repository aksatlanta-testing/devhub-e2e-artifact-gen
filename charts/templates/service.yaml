apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo86aecb72-a2f8-41ec-8382-af123066bd82.fullname" . }}
  labels:
    {{- include "go-echo86aecb72-a2f8-41ec-8382-af123066bd82.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo86aecb72-a2f8-41ec-8382-af123066bd82.selectorLabels" . | nindent 6 }}
