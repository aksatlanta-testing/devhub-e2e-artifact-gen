apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9c26b4b6-3320-41dc-8f54-19613d159d46.fullname" . }}
  labels:
    {{- include "go-echo9c26b4b6-3320-41dc-8f54-19613d159d46.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9c26b4b6-3320-41dc-8f54-19613d159d46.selectorLabels" . | nindent 6 }}
