apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo02aef649-9cf5-4d69-9092-877fec2e009a.fullname" . }}
  labels:
    {{- include "go-echo02aef649-9cf5-4d69-9092-877fec2e009a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo02aef649-9cf5-4d69-9092-877fec2e009a.selectorLabels" . | nindent 6 }}
