apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob27b7d3e-7877-4a61-a1db-047591db3913.fullname" . }}
  labels:
    {{- include "go-echob27b7d3e-7877-4a61-a1db-047591db3913.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob27b7d3e-7877-4a61-a1db-047591db3913.selectorLabels" . | nindent 6 }}
