apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof40ec274-716c-4d5b-a91a-194179c2aabd.fullname" . }}
  labels:
    {{- include "go-echof40ec274-716c-4d5b-a91a-194179c2aabd.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof40ec274-716c-4d5b-a91a-194179c2aabd.selectorLabels" . | nindent 6 }}
