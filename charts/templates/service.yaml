apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo48adb5b4-cfe9-48f8-8c0e-2d986d8fa039.fullname" . }}
  labels:
    {{- include "go-echo48adb5b4-cfe9-48f8-8c0e-2d986d8fa039.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo48adb5b4-cfe9-48f8-8c0e-2d986d8fa039.selectorLabels" . | nindent 6 }}
