apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4bdfe768-3b0d-4122-8c61-b6a3112c243c.fullname" . }}
  labels:
    {{- include "go-echo4bdfe768-3b0d-4122-8c61-b6a3112c243c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4bdfe768-3b0d-4122-8c61-b6a3112c243c.selectorLabels" . | nindent 6 }}
