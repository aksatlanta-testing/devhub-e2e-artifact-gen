apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo79e2c377-2a01-4d39-8e1f-c1df781e6be6.fullname" . }}
  labels:
    {{- include "go-echo79e2c377-2a01-4d39-8e1f-c1df781e6be6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo79e2c377-2a01-4d39-8e1f-c1df781e6be6.selectorLabels" . | nindent 6 }}
