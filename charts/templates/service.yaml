apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofd623258-87f4-4e8b-92f3-c555760f6b0f.fullname" . }}
  labels:
    {{- include "go-echofd623258-87f4-4e8b-92f3-c555760f6b0f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofd623258-87f4-4e8b-92f3-c555760f6b0f.selectorLabels" . | nindent 6 }}
