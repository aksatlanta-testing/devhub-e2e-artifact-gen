apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobb3467fd-2f32-43b2-a656-3f2856b94f05.fullname" . }}
  labels:
    {{- include "go-echobb3467fd-2f32-43b2-a656-3f2856b94f05.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobb3467fd-2f32-43b2-a656-3f2856b94f05.selectorLabels" . | nindent 6 }}
