apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8c6a6921-d296-4fe6-9583-302f4a9a6ee9.fullname" . }}
  labels:
    {{- include "go-echo8c6a6921-d296-4fe6-9583-302f4a9a6ee9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8c6a6921-d296-4fe6-9583-302f4a9a6ee9.selectorLabels" . | nindent 6 }}
