apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa590f55b-e011-4430-9fc7-777a9226d51d.fullname" . }}
  labels:
    {{- include "go-echoa590f55b-e011-4430-9fc7-777a9226d51d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa590f55b-e011-4430-9fc7-777a9226d51d.selectorLabels" . | nindent 6 }}
