apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo48f33ace-079c-49c5-ab5c-e95d4c4817d0.fullname" . }}
  labels:
    {{- include "go-echo48f33ace-079c-49c5-ab5c-e95d4c4817d0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo48f33ace-079c-49c5-ab5c-e95d4c4817d0.selectorLabels" . | nindent 6 }}
