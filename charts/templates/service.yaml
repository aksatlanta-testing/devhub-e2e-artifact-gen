apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofc06bd15-5d7a-4cec-b545-f16c3040d4cb.fullname" . }}
  labels:
    {{- include "go-echofc06bd15-5d7a-4cec-b545-f16c3040d4cb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofc06bd15-5d7a-4cec-b545-f16c3040d4cb.selectorLabels" . | nindent 6 }}
