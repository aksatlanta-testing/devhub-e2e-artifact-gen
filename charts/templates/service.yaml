apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoefc3003d-c2a2-4e52-9605-d0805e2a00f5.fullname" . }}
  labels:
    {{- include "go-echoefc3003d-c2a2-4e52-9605-d0805e2a00f5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoefc3003d-c2a2-4e52-9605-d0805e2a00f5.selectorLabels" . | nindent 6 }}
