apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobc4e414e-9cd1-47a7-b9e9-8ce26bb63b94.fullname" . }}
  labels:
    {{- include "go-echobc4e414e-9cd1-47a7-b9e9-8ce26bb63b94.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobc4e414e-9cd1-47a7-b9e9-8ce26bb63b94.selectorLabels" . | nindent 6 }}
