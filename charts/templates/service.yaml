apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo26735999-9a6f-4a39-b17f-14f99b365926.fullname" . }}
  labels:
    {{- include "go-echo26735999-9a6f-4a39-b17f-14f99b365926.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo26735999-9a6f-4a39-b17f-14f99b365926.selectorLabels" . | nindent 6 }}
