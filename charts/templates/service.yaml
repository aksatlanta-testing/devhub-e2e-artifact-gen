apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2d34c8dd-b904-42a7-a02b-4fb066487ebf.fullname" . }}
  labels:
    {{- include "go-echo2d34c8dd-b904-42a7-a02b-4fb066487ebf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2d34c8dd-b904-42a7-a02b-4fb066487ebf.selectorLabels" . | nindent 6 }}
