apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6ac17b58-5f71-40be-aad0-3dfb19e6a0f2.fullname" . }}
  labels:
    {{- include "go-echo6ac17b58-5f71-40be-aad0-3dfb19e6a0f2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6ac17b58-5f71-40be-aad0-3dfb19e6a0f2.selectorLabels" . | nindent 6 }}
