apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof5ef15ea-b489-4642-a779-c1a71904c825.fullname" . }}
  labels:
    {{- include "go-echof5ef15ea-b489-4642-a779-c1a71904c825.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof5ef15ea-b489-4642-a779-c1a71904c825.selectorLabels" . | nindent 6 }}
