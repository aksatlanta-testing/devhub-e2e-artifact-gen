apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoca9f02fe-0bdf-4bfd-bf29-72596109c44a.fullname" . }}
  labels:
    {{- include "go-echoca9f02fe-0bdf-4bfd-bf29-72596109c44a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoca9f02fe-0bdf-4bfd-bf29-72596109c44a.selectorLabels" . | nindent 6 }}
