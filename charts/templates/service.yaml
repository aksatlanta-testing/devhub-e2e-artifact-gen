apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo36074ebd-7407-4f29-a8d5-fba02c9f31fa.fullname" . }}
  labels:
    {{- include "go-echo36074ebd-7407-4f29-a8d5-fba02c9f31fa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo36074ebd-7407-4f29-a8d5-fba02c9f31fa.selectorLabels" . | nindent 6 }}
