apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0043ba4b-4d73-4830-90a4-5c18d48d21b1.fullname" . }}
  labels:
    {{- include "go-echo0043ba4b-4d73-4830-90a4-5c18d48d21b1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0043ba4b-4d73-4830-90a4-5c18d48d21b1.selectorLabels" . | nindent 6 }}
