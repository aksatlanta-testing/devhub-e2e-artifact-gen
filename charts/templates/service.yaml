apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo42f0276e-afa9-4735-854d-e910311c8028.fullname" . }}
  labels:
    {{- include "go-echo42f0276e-afa9-4735-854d-e910311c8028.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo42f0276e-afa9-4735-854d-e910311c8028.selectorLabels" . | nindent 6 }}
