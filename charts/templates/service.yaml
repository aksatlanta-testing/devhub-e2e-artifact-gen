apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8d600c7d-dec8-4aa0-9bfd-42989ec78300.fullname" . }}
  labels:
    {{- include "go-echo8d600c7d-dec8-4aa0-9bfd-42989ec78300.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8d600c7d-dec8-4aa0-9bfd-42989ec78300.selectorLabels" . | nindent 6 }}
