apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo312122a1-fa37-46f5-9142-9032a897205f.fullname" . }}
  labels:
    {{- include "go-echo312122a1-fa37-46f5-9142-9032a897205f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo312122a1-fa37-46f5-9142-9032a897205f.selectorLabels" . | nindent 6 }}
