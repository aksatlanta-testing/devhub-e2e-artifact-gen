apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo984e61a1-d315-4d4a-88d2-b872d78ca3f3.fullname" . }}
  labels:
    {{- include "go-echo984e61a1-d315-4d4a-88d2-b872d78ca3f3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo984e61a1-d315-4d4a-88d2-b872d78ca3f3.selectorLabels" . | nindent 6 }}
