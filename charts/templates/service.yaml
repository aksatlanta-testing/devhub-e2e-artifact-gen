apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5d92d024-2764-4d83-8beb-d160486c19ce.fullname" . }}
  labels:
    {{- include "go-echo5d92d024-2764-4d83-8beb-d160486c19ce.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5d92d024-2764-4d83-8beb-d160486c19ce.selectorLabels" . | nindent 6 }}
