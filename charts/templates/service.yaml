apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9e6048e6-2779-46eb-b0e8-3f05ee8ad205.fullname" . }}
  labels:
    {{- include "go-echo9e6048e6-2779-46eb-b0e8-3f05ee8ad205.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9e6048e6-2779-46eb-b0e8-3f05ee8ad205.selectorLabels" . | nindent 6 }}
