apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2d2900ce-cf75-4e3f-a81a-3fd7abb21dfd.fullname" . }}
  labels:
    {{- include "go-echo2d2900ce-cf75-4e3f-a81a-3fd7abb21dfd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2d2900ce-cf75-4e3f-a81a-3fd7abb21dfd.selectorLabels" . | nindent 6 }}
