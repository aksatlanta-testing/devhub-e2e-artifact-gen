apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9e62bfd5-cd0c-49e6-89e3-b9ff1540c2a8.fullname" . }}
  labels:
    {{- include "go-echo9e62bfd5-cd0c-49e6-89e3-b9ff1540c2a8.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9e62bfd5-cd0c-49e6-89e3-b9ff1540c2a8.selectorLabels" . | nindent 6 }}
