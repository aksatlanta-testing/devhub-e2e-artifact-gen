apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob3da2d3f-1ae0-4958-bd7f-ba9da1701dea.fullname" . }}
  labels:
    {{- include "go-echob3da2d3f-1ae0-4958-bd7f-ba9da1701dea.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob3da2d3f-1ae0-4958-bd7f-ba9da1701dea.selectorLabels" . | nindent 6 }}
