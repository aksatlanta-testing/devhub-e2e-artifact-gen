apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe04f7ecc-6e3e-4586-873a-da32fbe67e97.fullname" . }}
  labels:
    {{- include "go-echoe04f7ecc-6e3e-4586-873a-da32fbe67e97.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe04f7ecc-6e3e-4586-873a-da32fbe67e97.selectorLabels" . | nindent 6 }}
