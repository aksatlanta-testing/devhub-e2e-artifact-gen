apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo300891d8-c503-4193-9ff3-f241d6130a37.fullname" . }}
  labels:
    {{- include "go-echo300891d8-c503-4193-9ff3-f241d6130a37.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo300891d8-c503-4193-9ff3-f241d6130a37.selectorLabels" . | nindent 6 }}
