apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod69d2228-2c45-4dbb-9ed1-1d72bc4bfca1.fullname" . }}
  labels:
    {{- include "go-echod69d2228-2c45-4dbb-9ed1-1d72bc4bfca1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod69d2228-2c45-4dbb-9ed1-1d72bc4bfca1.selectorLabels" . | nindent 6 }}
