apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6d87c390-4372-4ff4-b761-4cf5fabd67e0.fullname" . }}
  labels:
    {{- include "go-echo6d87c390-4372-4ff4-b761-4cf5fabd67e0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6d87c390-4372-4ff4-b761-4cf5fabd67e0.selectorLabels" . | nindent 6 }}
