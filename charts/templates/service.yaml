apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocf8c5bf2-23ab-4a40-a6f1-86e6c1577032.fullname" . }}
  labels:
    {{- include "go-echocf8c5bf2-23ab-4a40-a6f1-86e6c1577032.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocf8c5bf2-23ab-4a40-a6f1-86e6c1577032.selectorLabels" . | nindent 6 }}
