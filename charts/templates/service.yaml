apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6848923e-e635-479f-b63a-680ccd912cbc.fullname" . }}
  labels:
    {{- include "go-echo6848923e-e635-479f-b63a-680ccd912cbc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6848923e-e635-479f-b63a-680ccd912cbc.selectorLabels" . | nindent 6 }}
