apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod43538c8-3189-40cb-a76d-c80c1524fcae.fullname" . }}
  labels:
    {{- include "go-echod43538c8-3189-40cb-a76d-c80c1524fcae.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod43538c8-3189-40cb-a76d-c80c1524fcae.selectorLabels" . | nindent 6 }}
