apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo686c8aee-a511-4f87-a2f7-002c05c971aa.fullname" . }}
  labels:
    {{- include "go-echo686c8aee-a511-4f87-a2f7-002c05c971aa.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo686c8aee-a511-4f87-a2f7-002c05c971aa.selectorLabels" . | nindent 6 }}
