apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo013cc321-d1b0-4b3a-a39b-5c077e8b7b0d.fullname" . }}
  labels:
    {{- include "go-echo013cc321-d1b0-4b3a-a39b-5c077e8b7b0d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo013cc321-d1b0-4b3a-a39b-5c077e8b7b0d.selectorLabels" . | nindent 6 }}
