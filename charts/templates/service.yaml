apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echocdcfa455-d181-461c-b17c-07e065ef4b75.fullname" . }}
  labels:
    {{- include "go-echocdcfa455-d181-461c-b17c-07e065ef4b75.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echocdcfa455-d181-461c-b17c-07e065ef4b75.selectorLabels" . | nindent 6 }}
