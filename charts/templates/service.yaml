apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo011e5d55-625f-4898-8178-6f4ff9b98f96.fullname" . }}
  labels:
    {{- include "go-echo011e5d55-625f-4898-8178-6f4ff9b98f96.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo011e5d55-625f-4898-8178-6f4ff9b98f96.selectorLabels" . | nindent 6 }}
