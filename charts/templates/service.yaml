apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1344183b-7a13-4afc-a999-42f9335f5aca.fullname" . }}
  labels:
    {{- include "go-echo1344183b-7a13-4afc-a999-42f9335f5aca.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1344183b-7a13-4afc-a999-42f9335f5aca.selectorLabels" . | nindent 6 }}
