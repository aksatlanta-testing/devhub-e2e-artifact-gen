apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo573056e2-e2a3-4728-baf2-6f92e46a3a7e.fullname" . }}
  labels:
    {{- include "go-echo573056e2-e2a3-4728-baf2-6f92e46a3a7e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo573056e2-e2a3-4728-baf2-6f92e46a3a7e.selectorLabels" . | nindent 6 }}
