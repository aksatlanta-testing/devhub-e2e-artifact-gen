apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob883ae92-f61c-4bbb-82d0-17db47e64cea.fullname" . }}
  labels:
    {{- include "go-echob883ae92-f61c-4bbb-82d0-17db47e64cea.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob883ae92-f61c-4bbb-82d0-17db47e64cea.selectorLabels" . | nindent 6 }}
