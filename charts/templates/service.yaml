apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8bb36828-ffca-4926-bd86-74645c00e678.fullname" . }}
  labels:
    {{- include "go-echo8bb36828-ffca-4926-bd86-74645c00e678.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8bb36828-ffca-4926-bd86-74645c00e678.selectorLabels" . | nindent 6 }}
