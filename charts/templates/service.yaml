apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo087acf9e-a799-4aed-be54-92b22cbb0944.fullname" . }}
  labels:
    {{- include "go-echo087acf9e-a799-4aed-be54-92b22cbb0944.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo087acf9e-a799-4aed-be54-92b22cbb0944.selectorLabels" . | nindent 6 }}
