apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodaea49a0-1393-4722-a708-ef7e7ac8f655.fullname" . }}
  labels:
    {{- include "go-echodaea49a0-1393-4722-a708-ef7e7ac8f655.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodaea49a0-1393-4722-a708-ef7e7ac8f655.selectorLabels" . | nindent 6 }}
