apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo95947ed1-6656-45ce-82de-298438c3407b.fullname" . }}
  labels:
    {{- include "go-echo95947ed1-6656-45ce-82de-298438c3407b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo95947ed1-6656-45ce-82de-298438c3407b.selectorLabels" . | nindent 6 }}
