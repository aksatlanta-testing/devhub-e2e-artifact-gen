apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo46b7339f-a8a3-4bbb-a65c-85bb774fdad6.fullname" . }}
  labels:
    {{- include "go-echo46b7339f-a8a3-4bbb-a65c-85bb774fdad6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo46b7339f-a8a3-4bbb-a65c-85bb774fdad6.selectorLabels" . | nindent 6 }}
