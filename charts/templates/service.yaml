apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9738dd7a-f821-432f-9185-3d94a98fa29e.fullname" . }}
  labels:
    {{- include "go-echo9738dd7a-f821-432f-9185-3d94a98fa29e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9738dd7a-f821-432f-9185-3d94a98fa29e.selectorLabels" . | nindent 6 }}
