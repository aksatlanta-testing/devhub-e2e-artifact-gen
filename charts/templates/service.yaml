apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo70ccfb0e-8147-413b-8599-da8cb3429a34.fullname" . }}
  labels:
    {{- include "go-echo70ccfb0e-8147-413b-8599-da8cb3429a34.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo70ccfb0e-8147-413b-8599-da8cb3429a34.selectorLabels" . | nindent 6 }}
