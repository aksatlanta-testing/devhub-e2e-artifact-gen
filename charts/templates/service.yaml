apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0a359295-e50c-4275-b4eb-2d4bd42727f9.fullname" . }}
  labels:
    {{- include "go-echo0a359295-e50c-4275-b4eb-2d4bd42727f9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0a359295-e50c-4275-b4eb-2d4bd42727f9.selectorLabels" . | nindent 6 }}
