apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo17845b43-80a3-4ca3-aac4-db5f0ad0f8fc.fullname" . }}
  labels:
    {{- include "go-echo17845b43-80a3-4ca3-aac4-db5f0ad0f8fc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo17845b43-80a3-4ca3-aac4-db5f0ad0f8fc.selectorLabels" . | nindent 6 }}
