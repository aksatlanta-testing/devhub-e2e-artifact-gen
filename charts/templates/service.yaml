apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0c4167c9-8ac7-44eb-a9c6-02c13e484c8f.fullname" . }}
  labels:
    {{- include "go-echo0c4167c9-8ac7-44eb-a9c6-02c13e484c8f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0c4167c9-8ac7-44eb-a9c6-02c13e484c8f.selectorLabels" . | nindent 6 }}
