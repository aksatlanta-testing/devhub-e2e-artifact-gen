apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0f2c05f7-5068-418a-8b16-b351ef04efce.fullname" . }}
  labels:
    {{- include "go-echo0f2c05f7-5068-418a-8b16-b351ef04efce.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0f2c05f7-5068-418a-8b16-b351ef04efce.selectorLabels" . | nindent 6 }}
