apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7cec6d1b-c1a5-4a6f-af28-d21ee2a6b0c0.fullname" . }}
  labels:
    {{- include "go-echo7cec6d1b-c1a5-4a6f-af28-d21ee2a6b0c0.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7cec6d1b-c1a5-4a6f-af28-d21ee2a6b0c0.selectorLabels" . | nindent 6 }}
