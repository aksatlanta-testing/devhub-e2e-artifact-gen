apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo533a6d04-5c82-43c0-9c43-20e0269f456a.fullname" . }}
  labels:
    {{- include "go-echo533a6d04-5c82-43c0-9c43-20e0269f456a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo533a6d04-5c82-43c0-9c43-20e0269f456a.selectorLabels" . | nindent 6 }}
