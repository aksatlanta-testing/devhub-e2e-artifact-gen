apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo95ab120b-c056-471a-a753-2d82e86744fd.fullname" . }}
  labels:
    {{- include "go-echo95ab120b-c056-471a-a753-2d82e86744fd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo95ab120b-c056-471a-a753-2d82e86744fd.selectorLabels" . | nindent 6 }}
