apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2197b6ec-ec1a-45a9-86c5-a4a2c9a6f9bd.fullname" . }}
  labels:
    {{- include "go-echo2197b6ec-ec1a-45a9-86c5-a4a2c9a6f9bd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2197b6ec-ec1a-45a9-86c5-a4a2c9a6f9bd.selectorLabels" . | nindent 6 }}
