apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe4a09ade-5036-43c8-a79e-d417e32596bf.fullname" . }}
  labels:
    {{- include "go-echoe4a09ade-5036-43c8-a79e-d417e32596bf.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe4a09ade-5036-43c8-a79e-d417e32596bf.selectorLabels" . | nindent 6 }}
