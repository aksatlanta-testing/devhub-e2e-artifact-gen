apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoacbcf4f7-f217-49f5-b1d5-cb33895f2f34.fullname" . }}
  labels:
    {{- include "go-echoacbcf4f7-f217-49f5-b1d5-cb33895f2f34.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoacbcf4f7-f217-49f5-b1d5-cb33895f2f34.selectorLabels" . | nindent 6 }}
