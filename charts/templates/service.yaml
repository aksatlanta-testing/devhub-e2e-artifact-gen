apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo89b00238-a748-48d4-907c-d898d02aa7d7.fullname" . }}
  labels:
    {{- include "go-echo89b00238-a748-48d4-907c-d898d02aa7d7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo89b00238-a748-48d4-907c-d898d02aa7d7.selectorLabels" . | nindent 6 }}
