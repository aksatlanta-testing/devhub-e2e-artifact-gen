apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo09a54fe2-7e99-4e9b-8295-752fc90f4a51.fullname" . }}
  labels:
    {{- include "go-echo09a54fe2-7e99-4e9b-8295-752fc90f4a51.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo09a54fe2-7e99-4e9b-8295-752fc90f4a51.selectorLabels" . | nindent 6 }}
