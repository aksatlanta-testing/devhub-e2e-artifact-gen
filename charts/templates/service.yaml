apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc575d92d-ee94-4737-986d-1bc0552c6c8b.fullname" . }}
  labels:
    {{- include "go-echoc575d92d-ee94-4737-986d-1bc0552c6c8b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc575d92d-ee94-4737-986d-1bc0552c6c8b.selectorLabels" . | nindent 6 }}
