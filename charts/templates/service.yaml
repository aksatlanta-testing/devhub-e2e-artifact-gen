apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo55d3a581-7175-4f28-a8e0-f5ce9230ed3a.fullname" . }}
  labels:
    {{- include "go-echo55d3a581-7175-4f28-a8e0-f5ce9230ed3a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo55d3a581-7175-4f28-a8e0-f5ce9230ed3a.selectorLabels" . | nindent 6 }}
