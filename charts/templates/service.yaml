apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof2ac084e-65f7-4624-959a-7fe8900644ca.fullname" . }}
  labels:
    {{- include "go-echof2ac084e-65f7-4624-959a-7fe8900644ca.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof2ac084e-65f7-4624-959a-7fe8900644ca.selectorLabels" . | nindent 6 }}
