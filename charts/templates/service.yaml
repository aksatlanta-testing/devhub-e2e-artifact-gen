apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo64eab004-e2ec-4e96-9d53-0437eb154e40.fullname" . }}
  labels:
    {{- include "go-echo64eab004-e2ec-4e96-9d53-0437eb154e40.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo64eab004-e2ec-4e96-9d53-0437eb154e40.selectorLabels" . | nindent 6 }}
