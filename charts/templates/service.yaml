apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9c0a950e-b622-462f-b031-6837cc61f98d.fullname" . }}
  labels:
    {{- include "go-echo9c0a950e-b622-462f-b031-6837cc61f98d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9c0a950e-b622-462f-b031-6837cc61f98d.selectorLabels" . | nindent 6 }}
