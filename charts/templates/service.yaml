apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo48dfd909-58be-4195-b1e0-553e0c4204b4.fullname" . }}
  labels:
    {{- include "go-echo48dfd909-58be-4195-b1e0-553e0c4204b4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo48dfd909-58be-4195-b1e0-553e0c4204b4.selectorLabels" . | nindent 6 }}
