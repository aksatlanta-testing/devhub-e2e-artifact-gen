apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo37f90ff0-09c3-4566-a2c4-b40218bb50be.fullname" . }}
  labels:
    {{- include "go-echo37f90ff0-09c3-4566-a2c4-b40218bb50be.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo37f90ff0-09c3-4566-a2c4-b40218bb50be.selectorLabels" . | nindent 6 }}
