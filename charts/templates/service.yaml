apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa05f8a61-ed5f-47fa-998c-6b8c4e3d7098.fullname" . }}
  labels:
    {{- include "go-echoa05f8a61-ed5f-47fa-998c-6b8c4e3d7098.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa05f8a61-ed5f-47fa-998c-6b8c4e3d7098.selectorLabels" . | nindent 6 }}
