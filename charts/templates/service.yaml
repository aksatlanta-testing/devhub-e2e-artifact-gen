apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofae99153-b0d8-49ff-b7af-e98651a85d95.fullname" . }}
  labels:
    {{- include "go-echofae99153-b0d8-49ff-b7af-e98651a85d95.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofae99153-b0d8-49ff-b7af-e98651a85d95.selectorLabels" . | nindent 6 }}
