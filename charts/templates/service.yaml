apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2636afce-b217-40c1-ae6f-b5166fad008c.fullname" . }}
  labels:
    {{- include "go-echo2636afce-b217-40c1-ae6f-b5166fad008c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2636afce-b217-40c1-ae6f-b5166fad008c.selectorLabels" . | nindent 6 }}
