apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo43b8c119-17c9-4955-a9d4-3a5f1d3b373e.fullname" . }}
  labels:
    {{- include "go-echo43b8c119-17c9-4955-a9d4-3a5f1d3b373e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo43b8c119-17c9-4955-a9d4-3a5f1d3b373e.selectorLabels" . | nindent 6 }}
