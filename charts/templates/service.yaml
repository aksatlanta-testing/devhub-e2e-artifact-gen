apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod239f45e-a85a-4e41-9a4b-d01c73667463.fullname" . }}
  labels:
    {{- include "go-echod239f45e-a85a-4e41-9a4b-d01c73667463.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod239f45e-a85a-4e41-9a4b-d01c73667463.selectorLabels" . | nindent 6 }}
