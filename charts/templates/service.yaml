apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoff47a8a0-1168-417d-ab5b-252ff04a6354.fullname" . }}
  labels:
    {{- include "go-echoff47a8a0-1168-417d-ab5b-252ff04a6354.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoff47a8a0-1168-417d-ab5b-252ff04a6354.selectorLabels" . | nindent 6 }}
