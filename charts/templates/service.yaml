apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3a1f83cb-cc23-4db0-832d-717e845f2c4c.fullname" . }}
  labels:
    {{- include "go-echo3a1f83cb-cc23-4db0-832d-717e845f2c4c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3a1f83cb-cc23-4db0-832d-717e845f2c4c.selectorLabels" . | nindent 6 }}
