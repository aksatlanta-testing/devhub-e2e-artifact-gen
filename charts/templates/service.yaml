apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4bf49938-360b-4314-a36f-83f897467807.fullname" . }}
  labels:
    {{- include "go-echo4bf49938-360b-4314-a36f-83f897467807.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
