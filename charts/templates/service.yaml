apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1c8efbf9-9f93-4f39-a4db-90a4977f2a29.fullname" . }}
  labels:
    {{- include "go-echo1c8efbf9-9f93-4f39-a4db-90a4977f2a29.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1c8efbf9-9f93-4f39-a4db-90a4977f2a29.selectorLabels" . | nindent 6 }}
