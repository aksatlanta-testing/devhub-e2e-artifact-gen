apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc97621f0-9173-479e-928c-17058a1d5f38.fullname" . }}
  labels:
    {{- include "go-echoc97621f0-9173-479e-928c-17058a1d5f38.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc97621f0-9173-479e-928c-17058a1d5f38.selectorLabels" . | nindent 6 }}
