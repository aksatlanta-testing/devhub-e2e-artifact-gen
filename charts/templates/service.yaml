apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echobbb73a12-7bb7-4f3e-a74e-513731c733e3.fullname" . }}
  labels:
    {{- include "go-echobbb73a12-7bb7-4f3e-a74e-513731c733e3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echobbb73a12-7bb7-4f3e-a74e-513731c733e3.selectorLabels" . | nindent 6 }}
