apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo265272b3-f5a0-4859-a91f-3fbef30775b6.fullname" . }}
  labels:
    {{- include "go-echo265272b3-f5a0-4859-a91f-3fbef30775b6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo265272b3-f5a0-4859-a91f-3fbef30775b6.selectorLabels" . | nindent 6 }}
