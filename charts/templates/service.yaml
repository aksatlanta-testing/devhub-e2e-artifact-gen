apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoed5ff674-89f5-44e6-b231-14b4abde1f64.fullname" . }}
  labels:
    {{- include "go-echoed5ff674-89f5-44e6-b231-14b4abde1f64.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoed5ff674-89f5-44e6-b231-14b4abde1f64.selectorLabels" . | nindent 6 }}
