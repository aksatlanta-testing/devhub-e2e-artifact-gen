apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod6215e89-dda7-44f3-abc5-05e0f55aadd3.fullname" . }}
  labels:
    {{- include "go-echod6215e89-dda7-44f3-abc5-05e0f55aadd3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod6215e89-dda7-44f3-abc5-05e0f55aadd3.selectorLabels" . | nindent 6 }}
