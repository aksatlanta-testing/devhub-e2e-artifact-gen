apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc0e94a03-a5e2-4a99-9c36-4302c0d20f2b.fullname" . }}
  labels:
    {{- include "go-echoc0e94a03-a5e2-4a99-9c36-4302c0d20f2b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc0e94a03-a5e2-4a99-9c36-4302c0d20f2b.selectorLabels" . | nindent 6 }}
