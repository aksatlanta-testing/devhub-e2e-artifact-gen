apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe47eee2a-ce8e-495a-a8af-c8c2a0b98eb5.fullname" . }}
  labels:
    {{- include "go-echoe47eee2a-ce8e-495a-a8af-c8c2a0b98eb5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe47eee2a-ce8e-495a-a8af-c8c2a0b98eb5.selectorLabels" . | nindent 6 }}
