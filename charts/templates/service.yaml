apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob0510265-755a-4e58-b7b2-5439ccbd8cd7.fullname" . }}
  labels:
    {{- include "go-echob0510265-755a-4e58-b7b2-5439ccbd8cd7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob0510265-755a-4e58-b7b2-5439ccbd8cd7.selectorLabels" . | nindent 6 }}
