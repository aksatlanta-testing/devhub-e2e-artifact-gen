apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6a8c5c30-a23e-4aa6-b540-b2240918de28.fullname" . }}
  labels:
    {{- include "go-echo6a8c5c30-a23e-4aa6-b540-b2240918de28.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6a8c5c30-a23e-4aa6-b540-b2240918de28.selectorLabels" . | nindent 6 }}
