apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3dd883ca-260e-42a2-9635-d6c1391ace61.fullname" . }}
  labels:
    {{- include "go-echo3dd883ca-260e-42a2-9635-d6c1391ace61.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3dd883ca-260e-42a2-9635-d6c1391ace61.selectorLabels" . | nindent 6 }}
