apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3813307e-7337-4ded-9b10-7e125a0a3f51.fullname" . }}
  labels:
    {{- include "go-echo3813307e-7337-4ded-9b10-7e125a0a3f51.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3813307e-7337-4ded-9b10-7e125a0a3f51.selectorLabels" . | nindent 6 }}
