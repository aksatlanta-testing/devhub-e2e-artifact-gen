apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoafdfcb48-0113-40a6-853b-55be811a82d5.fullname" . }}
  labels:
    {{- include "go-echoafdfcb48-0113-40a6-853b-55be811a82d5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoafdfcb48-0113-40a6-853b-55be811a82d5.selectorLabels" . | nindent 6 }}
