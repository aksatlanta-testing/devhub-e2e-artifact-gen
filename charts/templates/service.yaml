apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo03eb1d90-afdf-484e-a38c-a9accab6b6d3.fullname" . }}
  labels:
    {{- include "go-echo03eb1d90-afdf-484e-a38c-a9accab6b6d3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo03eb1d90-afdf-484e-a38c-a9accab6b6d3.selectorLabels" . | nindent 6 }}
