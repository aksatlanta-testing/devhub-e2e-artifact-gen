apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo06390353-4f48-4125-84ec-238a4cf31f6c.fullname" . }}
  labels:
    {{- include "go-echo06390353-4f48-4125-84ec-238a4cf31f6c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo06390353-4f48-4125-84ec-238a4cf31f6c.selectorLabels" . | nindent 6 }}
