apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob7f44e6d-679a-4dbe-aa0c-2aa804ee1c6e.fullname" . }}
  labels:
    {{- include "go-echob7f44e6d-679a-4dbe-aa0c-2aa804ee1c6e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob7f44e6d-679a-4dbe-aa0c-2aa804ee1c6e.selectorLabels" . | nindent 6 }}
