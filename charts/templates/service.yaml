apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8441083f-1b84-4a4b-9d84-c0177ccebe4b.fullname" . }}
  labels:
    {{- include "go-echo8441083f-1b84-4a4b-9d84-c0177ccebe4b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8441083f-1b84-4a4b-9d84-c0177ccebe4b.selectorLabels" . | nindent 6 }}
