apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoedebf5a4-b276-44fb-b848-925182b1f562.fullname" . }}
  labels:
    {{- include "go-echoedebf5a4-b276-44fb-b848-925182b1f562.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoedebf5a4-b276-44fb-b848-925182b1f562.selectorLabels" . | nindent 6 }}
