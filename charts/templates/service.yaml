apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5d6bcba7-62f6-417c-b75e-af856f1880f3.fullname" . }}
  labels:
    {{- include "go-echo5d6bcba7-62f6-417c-b75e-af856f1880f3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5d6bcba7-62f6-417c-b75e-af856f1880f3.selectorLabels" . | nindent 6 }}
