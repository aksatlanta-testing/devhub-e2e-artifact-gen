apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo59dd8d44-3f56-472e-ba46-9704afb8a951.fullname" . }}
  labels:
    {{- include "go-echo59dd8d44-3f56-472e-ba46-9704afb8a951.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo59dd8d44-3f56-472e-ba46-9704afb8a951.selectorLabels" . | nindent 6 }}
