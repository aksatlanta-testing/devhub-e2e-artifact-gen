apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6900c94e-5055-43c7-85d1-f949e116cd60.fullname" . }}
  labels:
    {{- include "go-echo6900c94e-5055-43c7-85d1-f949e116cd60.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6900c94e-5055-43c7-85d1-f949e116cd60.selectorLabels" . | nindent 6 }}
