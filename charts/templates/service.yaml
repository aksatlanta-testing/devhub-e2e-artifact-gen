apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1b006dda-8a77-434e-82c0-1ef4fe3dc00c.fullname" . }}
  labels:
    {{- include "go-echo1b006dda-8a77-434e-82c0-1ef4fe3dc00c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1b006dda-8a77-434e-82c0-1ef4fe3dc00c.selectorLabels" . | nindent 6 }}
