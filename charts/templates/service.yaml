apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo212f2c44-5452-4353-95f3-4f5f972086e8.fullname" . }}
  labels:
    {{- include "go-echo212f2c44-5452-4353-95f3-4f5f972086e8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo212f2c44-5452-4353-95f3-4f5f972086e8.selectorLabels" . | nindent 6 }}
