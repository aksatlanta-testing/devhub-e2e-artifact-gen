apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5ef30605-c66f-4618-a276-2eb1d55b87be.fullname" . }}
  labels:
    {{- include "go-echo5ef30605-c66f-4618-a276-2eb1d55b87be.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5ef30605-c66f-4618-a276-2eb1d55b87be.selectorLabels" . | nindent 6 }}
