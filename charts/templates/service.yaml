apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo4ebb7d7f-156a-403c-835f-32285a049ad2.fullname" . }}
  labels:
    {{- include "go-echo4ebb7d7f-156a-403c-835f-32285a049ad2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo4ebb7d7f-156a-403c-835f-32285a049ad2.selectorLabels" . | nindent 6 }}
