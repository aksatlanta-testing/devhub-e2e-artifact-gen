apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6b5a748e-f9cd-4d1b-a657-8fff40c95a8b.fullname" . }}
  labels:
    {{- include "go-echo6b5a748e-f9cd-4d1b-a657-8fff40c95a8b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6b5a748e-f9cd-4d1b-a657-8fff40c95a8b.selectorLabels" . | nindent 6 }}
