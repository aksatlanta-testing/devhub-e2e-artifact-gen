apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9e9e7641-3b00-455c-a5e5-f361926bb8ee.fullname" . }}
  labels:
    {{- include "go-echo9e9e7641-3b00-455c-a5e5-f361926bb8ee.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9e9e7641-3b00-455c-a5e5-f361926bb8ee.selectorLabels" . | nindent 6 }}
