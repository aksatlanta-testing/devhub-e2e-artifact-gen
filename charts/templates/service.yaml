apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8935eece-12c3-4819-bc71-d26f3af65114.fullname" . }}
  labels:
    {{- include "go-echo8935eece-12c3-4819-bc71-d26f3af65114.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8935eece-12c3-4819-bc71-d26f3af65114.selectorLabels" . | nindent 6 }}
