apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo311f7e7d-5e6e-4bb8-b1ff-c534296ed64a.fullname" . }}
  labels:
    {{- include "go-echo311f7e7d-5e6e-4bb8-b1ff-c534296ed64a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo311f7e7d-5e6e-4bb8-b1ff-c534296ed64a.selectorLabels" . | nindent 6 }}
