apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2aae2bd8-b4cc-4d66-9835-fc8c73817453.fullname" . }}
  labels:
    {{- include "go-echo2aae2bd8-b4cc-4d66-9835-fc8c73817453.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2aae2bd8-b4cc-4d66-9835-fc8c73817453.selectorLabels" . | nindent 6 }}
