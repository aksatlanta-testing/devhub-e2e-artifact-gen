apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo266e9731-b1b8-4fd2-98e9-25fe276bcc65.fullname" . }}
  labels:
    {{- include "go-echo266e9731-b1b8-4fd2-98e9-25fe276bcc65.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo266e9731-b1b8-4fd2-98e9-25fe276bcc65.selectorLabels" . | nindent 6 }}
