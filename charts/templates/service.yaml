apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof5c26848-c032-4f5b-8125-739cc5983bfd.fullname" . }}
  labels:
    {{- include "go-echof5c26848-c032-4f5b-8125-739cc5983bfd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof5c26848-c032-4f5b-8125-739cc5983bfd.selectorLabels" . | nindent 6 }}
