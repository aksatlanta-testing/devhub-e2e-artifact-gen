apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc0cfb154-e9ef-49d5-8a79-b1d4bf484c78.fullname" . }}
  labels:
    {{- include "go-echoc0cfb154-e9ef-49d5-8a79-b1d4bf484c78.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc0cfb154-e9ef-49d5-8a79-b1d4bf484c78.selectorLabels" . | nindent 6 }}
