apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof09c8bc8-ef46-4462-8381-639dddae3d47.fullname" . }}
  labels:
    {{- include "go-echof09c8bc8-ef46-4462-8381-639dddae3d47.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof09c8bc8-ef46-4462-8381-639dddae3d47.selectorLabels" . | nindent 6 }}
