apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6f55cc86-a93e-42fb-9665-4372821d63b9.fullname" . }}
  labels:
    {{- include "go-echo6f55cc86-a93e-42fb-9665-4372821d63b9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6f55cc86-a93e-42fb-9665-4372821d63b9.selectorLabels" . | nindent 6 }}
