apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof88e0a84-adf2-4ebb-9f4c-7a1b046dd984.fullname" . }}
  labels:
    {{- include "go-echof88e0a84-adf2-4ebb-9f4c-7a1b046dd984.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof88e0a84-adf2-4ebb-9f4c-7a1b046dd984.selectorLabels" . | nindent 6 }}
