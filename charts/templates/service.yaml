apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe2580d31-c9e8-4e06-b063-9aec85b94353.fullname" . }}
  labels:
    {{- include "go-echoe2580d31-c9e8-4e06-b063-9aec85b94353.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe2580d31-c9e8-4e06-b063-9aec85b94353.selectorLabels" . | nindent 6 }}
