apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2e2d9f01-a3af-49d1-8b73-d3115496d4a1.fullname" . }}
  labels:
    {{- include "go-echo2e2d9f01-a3af-49d1-8b73-d3115496d4a1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2e2d9f01-a3af-49d1-8b73-d3115496d4a1.selectorLabels" . | nindent 6 }}
