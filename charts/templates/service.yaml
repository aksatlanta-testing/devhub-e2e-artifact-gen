apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoace30408-b19d-41ad-81a0-d449dc1cc49f.fullname" . }}
  labels:
    {{- include "go-echoace30408-b19d-41ad-81a0-d449dc1cc49f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoace30408-b19d-41ad-81a0-d449dc1cc49f.selectorLabels" . | nindent 6 }}
