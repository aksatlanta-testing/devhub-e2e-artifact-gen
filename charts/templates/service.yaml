apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5f56ee72-42c4-4e95-ab3c-92360c7a0d80.fullname" . }}
  labels:
    {{- include "go-echo5f56ee72-42c4-4e95-ab3c-92360c7a0d80.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5f56ee72-42c4-4e95-ab3c-92360c7a0d80.selectorLabels" . | nindent 6 }}
