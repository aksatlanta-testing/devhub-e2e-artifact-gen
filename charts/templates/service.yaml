apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoae4f8bed-1841-44f6-ba59-c5a2604e67a4.fullname" . }}
  labels:
    {{- include "go-echoae4f8bed-1841-44f6-ba59-c5a2604e67a4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoae4f8bed-1841-44f6-ba59-c5a2604e67a4.selectorLabels" . | nindent 6 }}
