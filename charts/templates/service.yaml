apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo803f53dd-6e52-4c60-b20d-4e1c059964ea.fullname" . }}
  labels:
    {{- include "go-echo803f53dd-6e52-4c60-b20d-4e1c059964ea.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo803f53dd-6e52-4c60-b20d-4e1c059964ea.selectorLabels" . | nindent 6 }}
