apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo17a2d9f6-de1b-484a-8002-ff1581959ec2.fullname" . }}
  labels:
    {{- include "go-echo17a2d9f6-de1b-484a-8002-ff1581959ec2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo17a2d9f6-de1b-484a-8002-ff1581959ec2.selectorLabels" . | nindent 6 }}
