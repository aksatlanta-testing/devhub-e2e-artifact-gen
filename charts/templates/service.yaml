apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo435dbb40-b4fb-4c29-ba22-32564744961c.fullname" . }}
  labels:
    {{- include "go-echo435dbb40-b4fb-4c29-ba22-32564744961c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo435dbb40-b4fb-4c29-ba22-32564744961c.selectorLabels" . | nindent 6 }}
