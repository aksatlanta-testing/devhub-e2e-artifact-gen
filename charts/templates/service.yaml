apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe45b5c8e-a325-42d0-8155-96fab287d6ef.fullname" . }}
  labels:
    {{- include "go-echoe45b5c8e-a325-42d0-8155-96fab287d6ef.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe45b5c8e-a325-42d0-8155-96fab287d6ef.selectorLabels" . | nindent 6 }}
