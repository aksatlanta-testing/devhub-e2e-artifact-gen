apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8f4e17d4-f9f1-408e-b25d-bd3deaab50b3.fullname" . }}
  labels:
    {{- include "go-echo8f4e17d4-f9f1-408e-b25d-bd3deaab50b3.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8f4e17d4-f9f1-408e-b25d-bd3deaab50b3.selectorLabels" . | nindent 6 }}
