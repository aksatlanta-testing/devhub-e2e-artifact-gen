apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob757eefa-18c4-47a3-8d13-f8f8cfadf541.fullname" . }}
  labels:
    {{- include "go-echob757eefa-18c4-47a3-8d13-f8f8cfadf541.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob757eefa-18c4-47a3-8d13-f8f8cfadf541.selectorLabels" . | nindent 6 }}
