apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe2e0d1ea-f637-4d60-995f-0aae341043dc.fullname" . }}
  labels:
    {{- include "go-echoe2e0d1ea-f637-4d60-995f-0aae341043dc.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe2e0d1ea-f637-4d60-995f-0aae341043dc.selectorLabels" . | nindent 6 }}
