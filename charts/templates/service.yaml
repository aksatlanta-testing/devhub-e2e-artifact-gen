apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo40a43013-ee6f-4d67-b7e8-646ac3dbe1a4.fullname" . }}
  labels:
    {{- include "go-echo40a43013-ee6f-4d67-b7e8-646ac3dbe1a4.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo40a43013-ee6f-4d67-b7e8-646ac3dbe1a4.selectorLabels" . | nindent 6 }}
