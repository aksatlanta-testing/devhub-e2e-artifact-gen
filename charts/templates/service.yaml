apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3b98b078-9856-4236-aea0-00138b6d865d.fullname" . }}
  labels:
    {{- include "go-echo3b98b078-9856-4236-aea0-00138b6d865d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3b98b078-9856-4236-aea0-00138b6d865d.selectorLabels" . | nindent 6 }}
