apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob4bf9049-bee7-4ca2-b770-3899a04927ce.fullname" . }}
  labels:
    {{- include "go-echob4bf9049-bee7-4ca2-b770-3899a04927ce.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob4bf9049-bee7-4ca2-b770-3899a04927ce.selectorLabels" . | nindent 6 }}
