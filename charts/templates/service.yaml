apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2dc51102-8a5a-41ae-b260-8cb3893daf58.fullname" . }}
  labels:
    {{- include "go-echo2dc51102-8a5a-41ae-b260-8cb3893daf58.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2dc51102-8a5a-41ae-b260-8cb3893daf58.selectorLabels" . | nindent 6 }}
