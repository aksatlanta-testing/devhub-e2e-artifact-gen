apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo61da38f1-7689-4f0b-8e06-6eda14ef59cd.fullname" . }}
  labels:
    {{- include "go-echo61da38f1-7689-4f0b-8e06-6eda14ef59cd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo61da38f1-7689-4f0b-8e06-6eda14ef59cd.selectorLabels" . | nindent 6 }}
