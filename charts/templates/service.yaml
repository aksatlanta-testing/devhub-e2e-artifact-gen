apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo839d89b5-d917-432f-9340-89279909b1eb.fullname" . }}
  labels:
    {{- include "go-echo839d89b5-d917-432f-9340-89279909b1eb.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo839d89b5-d917-432f-9340-89279909b1eb.selectorLabels" . | nindent 6 }}
