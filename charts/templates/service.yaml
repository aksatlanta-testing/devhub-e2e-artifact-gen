apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3d1f61c1-d3d8-4ae6-8106-83ab6ca59906.fullname" . }}
  labels:
    {{- include "go-echo3d1f61c1-d3d8-4ae6-8106-83ab6ca59906.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3d1f61c1-d3d8-4ae6-8106-83ab6ca59906.selectorLabels" . | nindent 6 }}
