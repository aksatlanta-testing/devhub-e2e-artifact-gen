apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo32bb52ba-5316-4fa4-90e2-e0edca058a3e.fullname" . }}
  labels:
    {{- include "go-echo32bb52ba-5316-4fa4-90e2-e0edca058a3e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo32bb52ba-5316-4fa4-90e2-e0edca058a3e.selectorLabels" . | nindent 6 }}
