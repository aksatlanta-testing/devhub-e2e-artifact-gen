apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2b4e4e94-0ebf-4783-9b49-c561bf4ade85.fullname" . }}
  labels:
    {{- include "go-echo2b4e4e94-0ebf-4783-9b49-c561bf4ade85.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2b4e4e94-0ebf-4783-9b49-c561bf4ade85.selectorLabels" . | nindent 6 }}
