apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe9d53989-f9af-4678-9cd7-97daff0701f2.fullname" . }}
  labels:
    {{- include "go-echoe9d53989-f9af-4678-9cd7-97daff0701f2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe9d53989-f9af-4678-9cd7-97daff0701f2.selectorLabels" . | nindent 6 }}
