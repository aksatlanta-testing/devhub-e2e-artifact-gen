apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo561ae720-3660-4eb5-9f61-56f240b8bbed.fullname" . }}
  labels:
    {{- include "go-echo561ae720-3660-4eb5-9f61-56f240b8bbed.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo561ae720-3660-4eb5-9f61-56f240b8bbed.selectorLabels" . | nindent 6 }}
