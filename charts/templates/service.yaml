apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8710c38e-08c6-4c63-ad7f-912d156a8054.fullname" . }}
  labels:
    {{- include "go-echo8710c38e-08c6-4c63-ad7f-912d156a8054.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8710c38e-08c6-4c63-ad7f-912d156a8054.selectorLabels" . | nindent 6 }}
