apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8139536f-6efb-49a3-8336-5b8a8369823b.fullname" . }}
  labels:
    {{- include "go-echo8139536f-6efb-49a3-8336-5b8a8369823b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8139536f-6efb-49a3-8336-5b8a8369823b.selectorLabels" . | nindent 6 }}
