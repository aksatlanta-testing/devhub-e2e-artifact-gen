apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echodc29df2d-db82-4ef0-b8ca-7f4bb7bd9e6f.fullname" . }}
  labels:
    {{- include "go-echodc29df2d-db82-4ef0-b8ca-7f4bb7bd9e6f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echodc29df2d-db82-4ef0-b8ca-7f4bb7bd9e6f.selectorLabels" . | nindent 6 }}
