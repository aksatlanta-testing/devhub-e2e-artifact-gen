apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo53657575-f708-4d11-9559-8b2be33d425e.fullname" . }}
  labels:
    {{- include "go-echo53657575-f708-4d11-9559-8b2be33d425e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo53657575-f708-4d11-9559-8b2be33d425e.selectorLabels" . | nindent 6 }}
