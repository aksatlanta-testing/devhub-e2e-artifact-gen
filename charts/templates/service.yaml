apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod5b18d4e-3bfa-49d2-92e7-c0b4609cf7dc.fullname" . }}
  labels:
    {{- include "go-echod5b18d4e-3bfa-49d2-92e7-c0b4609cf7dc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod5b18d4e-3bfa-49d2-92e7-c0b4609cf7dc.selectorLabels" . | nindent 6 }}
