apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoed2a07f8-3964-4389-9291-187a606c95dd.fullname" . }}
  labels:
    {{- include "go-echoed2a07f8-3964-4389-9291-187a606c95dd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoed2a07f8-3964-4389-9291-187a606c95dd.selectorLabels" . | nindent 6 }}
