apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo474440c6-799f-4af3-914f-8de61af92a80.fullname" . }}
  labels:
    {{- include "go-echo474440c6-799f-4af3-914f-8de61af92a80.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo474440c6-799f-4af3-914f-8de61af92a80.selectorLabels" . | nindent 6 }}
