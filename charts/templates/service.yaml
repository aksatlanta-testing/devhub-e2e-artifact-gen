apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo398848ba-9f0a-487e-be25-ff517e4c571f.fullname" . }}
  labels:
    {{- include "go-echo398848ba-9f0a-487e-be25-ff517e4c571f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo398848ba-9f0a-487e-be25-ff517e4c571f.selectorLabels" . | nindent 6 }}
