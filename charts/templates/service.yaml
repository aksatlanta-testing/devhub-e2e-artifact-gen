apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo77e0c897-376c-47b9-b8aa-fcd1105cfbc1.fullname" . }}
  labels:
    {{- include "go-echo77e0c897-376c-47b9-b8aa-fcd1105cfbc1.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo77e0c897-376c-47b9-b8aa-fcd1105cfbc1.selectorLabels" . | nindent 6 }}
