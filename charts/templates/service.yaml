apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofedc376a-bdf4-42a5-a2a3-e6bf87f683c9.fullname" . }}
  labels:
    {{- include "go-echofedc376a-bdf4-42a5-a2a3-e6bf87f683c9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofedc376a-bdf4-42a5-a2a3-e6bf87f683c9.selectorLabels" . | nindent 6 }}
