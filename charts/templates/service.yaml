apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo08b530a3-ce25-4262-aa2d-ec867e485713.fullname" . }}
  labels:
    {{- include "go-echo08b530a3-ce25-4262-aa2d-ec867e485713.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo08b530a3-ce25-4262-aa2d-ec867e485713.selectorLabels" . | nindent 6 }}
