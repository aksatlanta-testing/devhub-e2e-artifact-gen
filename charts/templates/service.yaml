apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa7814423-46a4-4190-9df3-d3f4b8a32f57.fullname" . }}
  labels:
    {{- include "go-echoa7814423-46a4-4190-9df3-d3f4b8a32f57.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa7814423-46a4-4190-9df3-d3f4b8a32f57.selectorLabels" . | nindent 6 }}
