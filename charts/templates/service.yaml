apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob99fa25e-baa8-4060-b9c5-55964757bd31.fullname" . }}
  labels:
    {{- include "go-echob99fa25e-baa8-4060-b9c5-55964757bd31.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob99fa25e-baa8-4060-b9c5-55964757bd31.selectorLabels" . | nindent 6 }}
