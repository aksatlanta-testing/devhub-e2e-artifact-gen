apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5893156c-9318-4bbe-b653-e24bfccd1023.fullname" . }}
  labels:
    {{- include "go-echo5893156c-9318-4bbe-b653-e24bfccd1023.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5893156c-9318-4bbe-b653-e24bfccd1023.selectorLabels" . | nindent 6 }}
