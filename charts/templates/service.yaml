apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoa3fc94d9-9529-4bc8-857a-dcf5211d7de2.fullname" . }}
  labels:
    {{- include "go-echoa3fc94d9-9529-4bc8-857a-dcf5211d7de2.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoa3fc94d9-9529-4bc8-857a-dcf5211d7de2.selectorLabels" . | nindent 6 }}
