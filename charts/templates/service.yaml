apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoda129964-0b66-469f-bdbb-c9b8fc143178.fullname" . }}
  labels:
    {{- include "go-echoda129964-0b66-469f-bdbb-c9b8fc143178.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoda129964-0b66-469f-bdbb-c9b8fc143178.selectorLabels" . | nindent 6 }}
