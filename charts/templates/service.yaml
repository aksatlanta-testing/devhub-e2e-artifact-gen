apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo42e954d1-e0af-43a2-bb11-01264c01c297.fullname" . }}
  labels:
    {{- include "go-echo42e954d1-e0af-43a2-bb11-01264c01c297.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo42e954d1-e0af-43a2-bb11-01264c01c297.selectorLabels" . | nindent 6 }}
