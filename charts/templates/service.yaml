apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo25160b32-ee80-4b17-8e14-2ec747759776.fullname" . }}
  labels:
    {{- include "go-echo25160b32-ee80-4b17-8e14-2ec747759776.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo25160b32-ee80-4b17-8e14-2ec747759776.selectorLabels" . | nindent 6 }}
