apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc0061270-6bf3-4f48-98d9-5fd1f666a9ef.fullname" . }}
  labels:
    {{- include "go-echoc0061270-6bf3-4f48-98d9-5fd1f666a9ef.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc0061270-6bf3-4f48-98d9-5fd1f666a9ef.selectorLabels" . | nindent 6 }}
