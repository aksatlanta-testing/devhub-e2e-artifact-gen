apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc8f80815-c178-4bf8-86a3-1c19695701bd.fullname" . }}
  labels:
    {{- include "go-echoc8f80815-c178-4bf8-86a3-1c19695701bd.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc8f80815-c178-4bf8-86a3-1c19695701bd.selectorLabels" . | nindent 6 }}
