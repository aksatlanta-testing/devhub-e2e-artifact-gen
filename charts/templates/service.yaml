apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo7577a521-bedc-4f4a-a544-635a320d7e5c.fullname" . }}
  labels:
    {{- include "go-echo7577a521-bedc-4f4a-a544-635a320d7e5c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo7577a521-bedc-4f4a-a544-635a320d7e5c.selectorLabels" . | nindent 6 }}
