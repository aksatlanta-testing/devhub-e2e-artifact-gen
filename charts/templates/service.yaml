apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc38f5a81-44ce-47f7-afa6-aedeed45909c.fullname" . }}
  labels:
    {{- include "go-echoc38f5a81-44ce-47f7-afa6-aedeed45909c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc38f5a81-44ce-47f7-afa6-aedeed45909c.selectorLabels" . | nindent 6 }}
