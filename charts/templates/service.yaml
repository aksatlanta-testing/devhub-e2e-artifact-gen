apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoad045e8d-91b8-45f9-95d7-d64063fd948d.fullname" . }}
  labels:
    {{- include "go-echoad045e8d-91b8-45f9-95d7-d64063fd948d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoad045e8d-91b8-45f9-95d7-d64063fd948d.selectorLabels" . | nindent 6 }}
