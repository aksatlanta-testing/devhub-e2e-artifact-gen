apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof49debc1-2d63-49c9-95b2-e5c2d2856af6.fullname" . }}
  labels:
    {{- include "go-echof49debc1-2d63-49c9-95b2-e5c2d2856af6.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof49debc1-2d63-49c9-95b2-e5c2d2856af6.selectorLabels" . | nindent 6 }}
