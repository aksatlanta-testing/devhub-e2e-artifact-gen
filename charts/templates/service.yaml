apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo54ef9355-d886-474e-a551-da552bcb8b45.fullname" . }}
  labels:
    {{- include "go-echo54ef9355-d886-474e-a551-da552bcb8b45.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo54ef9355-d886-474e-a551-da552bcb8b45.selectorLabels" . | nindent 6 }}
