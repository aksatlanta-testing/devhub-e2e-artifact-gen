apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3b4d6767-9bf5-4ae3-8eb7-3539d2bbbd96.fullname" . }}
  labels:
    {{- include "go-echo3b4d6767-9bf5-4ae3-8eb7-3539d2bbbd96.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3b4d6767-9bf5-4ae3-8eb7-3539d2bbbd96.selectorLabels" . | nindent 6 }}
