apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo34c3e53b-415a-4630-8279-80e3a8a7f4df.fullname" . }}
  labels:
    {{- include "go-echo34c3e53b-415a-4630-8279-80e3a8a7f4df.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo34c3e53b-415a-4630-8279-80e3a8a7f4df.selectorLabels" . | nindent 6 }}
