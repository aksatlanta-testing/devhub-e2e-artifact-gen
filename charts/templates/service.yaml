apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6ab892f5-0118-49a2-a770-0d5bb5fb20c5.fullname" . }}
  labels:
    {{- include "go-echo6ab892f5-0118-49a2-a770-0d5bb5fb20c5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6ab892f5-0118-49a2-a770-0d5bb5fb20c5.selectorLabels" . | nindent 6 }}
