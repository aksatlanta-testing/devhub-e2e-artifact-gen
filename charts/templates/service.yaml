apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo76c6a8aa-2ab8-4554-a882-a735bd85d36e.fullname" . }}
  labels:
    {{- include "go-echo76c6a8aa-2ab8-4554-a882-a735bd85d36e.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo76c6a8aa-2ab8-4554-a882-a735bd85d36e.selectorLabels" . | nindent 6 }}
