apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof58f1a0b-9241-4973-8ef3-29a92a61b7e9.fullname" . }}
  labels:
    {{- include "go-echof58f1a0b-9241-4973-8ef3-29a92a61b7e9.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof58f1a0b-9241-4973-8ef3-29a92a61b7e9.selectorLabels" . | nindent 6 }}
