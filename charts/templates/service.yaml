apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob3567328-7c18-447b-9321-88d066c83ac7.fullname" . }}
  labels:
    {{- include "go-echob3567328-7c18-447b-9321-88d066c83ac7.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob3567328-7c18-447b-9321-88d066c83ac7.selectorLabels" . | nindent 6 }}
