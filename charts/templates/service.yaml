apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoeddeace0-2b7f-4b04-ad6d-cd8a4191cd6f.fullname" . }}
  labels:
    {{- include "go-echoeddeace0-2b7f-4b04-ad6d-cd8a4191cd6f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoeddeace0-2b7f-4b04-ad6d-cd8a4191cd6f.selectorLabels" . | nindent 6 }}
