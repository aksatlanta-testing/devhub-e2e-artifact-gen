apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo84fb2aba-7035-4258-bd60-3b76d2d98a95.fullname" . }}
  labels:
    {{- include "go-echo84fb2aba-7035-4258-bd60-3b76d2d98a95.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo84fb2aba-7035-4258-bd60-3b76d2d98a95.selectorLabels" . | nindent 6 }}
