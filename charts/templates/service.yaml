apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoafd9e308-5600-442b-902c-dce609dbf9ed.fullname" . }}
  labels:
    {{- include "go-echoafd9e308-5600-442b-902c-dce609dbf9ed.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoafd9e308-5600-442b-902c-dce609dbf9ed.selectorLabels" . | nindent 6 }}
