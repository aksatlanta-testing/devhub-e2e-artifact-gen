apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo397c951c-3608-4e2e-bcc3-2680d325af31.fullname" . }}
  labels:
    {{- include "go-echo397c951c-3608-4e2e-bcc3-2680d325af31.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo397c951c-3608-4e2e-bcc3-2680d325af31.selectorLabels" . | nindent 6 }}
