apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoc319733b-f898-4093-9c60-87bf3a722e87.fullname" . }}
  labels:
    {{- include "go-echoc319733b-f898-4093-9c60-87bf3a722e87.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoc319733b-f898-4093-9c60-87bf3a722e87.selectorLabels" . | nindent 6 }}
