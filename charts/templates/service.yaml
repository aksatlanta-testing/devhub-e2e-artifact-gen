apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echob03e9044-8ad4-4d84-8fda-a34d99cfeb7d.fullname" . }}
  labels:
    {{- include "go-echob03e9044-8ad4-4d84-8fda-a34d99cfeb7d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echob03e9044-8ad4-4d84-8fda-a34d99cfeb7d.selectorLabels" . | nindent 6 }}
