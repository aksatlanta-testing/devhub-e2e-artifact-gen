apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof610625b-7e68-475b-8334-f9164ce1581b.fullname" . }}
  labels:
    {{- include "go-echof610625b-7e68-475b-8334-f9164ce1581b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof610625b-7e68-475b-8334-f9164ce1581b.selectorLabels" . | nindent 6 }}
