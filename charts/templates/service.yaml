apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo62fdce79-29d0-41fa-982c-8297842f5b85.fullname" . }}
  labels:
    {{- include "go-echo62fdce79-29d0-41fa-982c-8297842f5b85.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo62fdce79-29d0-41fa-982c-8297842f5b85.selectorLabels" . | nindent 6 }}
