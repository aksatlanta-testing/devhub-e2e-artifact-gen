apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo3d90f2e4-9cf7-4747-8bc6-7de8b1272d8e.fullname" . }}
  labels:
    {{- include "go-echo3d90f2e4-9cf7-4747-8bc6-7de8b1272d8e.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo3d90f2e4-9cf7-4747-8bc6-7de8b1272d8e.selectorLabels" . | nindent 6 }}
