apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo513653a0-715b-4bbd-b73a-17b85a4da58d.fullname" . }}
  labels:
    {{- include "go-echo513653a0-715b-4bbd-b73a-17b85a4da58d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo513653a0-715b-4bbd-b73a-17b85a4da58d.selectorLabels" . | nindent 6 }}
