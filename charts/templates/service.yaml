apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo0a1b3726-66e0-4f9a-9ddc-4d3eacd554b8.fullname" . }}
  labels:
    {{- include "go-echo0a1b3726-66e0-4f9a-9ddc-4d3eacd554b8.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo0a1b3726-66e0-4f9a-9ddc-4d3eacd554b8.selectorLabels" . | nindent 6 }}
