apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod62b2c8d-39b4-4709-89b3-a1c3dc25b8ab.fullname" . }}
  labels:
    {{- include "go-echod62b2c8d-39b4-4709-89b3-a1c3dc25b8ab.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod62b2c8d-39b4-4709-89b3-a1c3dc25b8ab.selectorLabels" . | nindent 6 }}
