apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo5cac04dd-2a4e-42da-a73a-82f4612ecc41.fullname" . }}
  labels:
    {{- include "go-echo5cac04dd-2a4e-42da-a73a-82f4612ecc41.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo5cac04dd-2a4e-42da-a73a-82f4612ecc41.selectorLabels" . | nindent 6 }}
