apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod41e5a50-a47c-4353-ab52-eda83eb415ad.fullname" . }}
  labels:
    {{- include "go-echod41e5a50-a47c-4353-ab52-eda83eb415ad.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod41e5a50-a47c-4353-ab52-eda83eb415ad.selectorLabels" . | nindent 6 }}
