apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo1359241a-cda5-42af-ba73-6312e59757ff.fullname" . }}
  labels:
    {{- include "go-echo1359241a-cda5-42af-ba73-6312e59757ff.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo1359241a-cda5-42af-ba73-6312e59757ff.selectorLabels" . | nindent 6 }}
