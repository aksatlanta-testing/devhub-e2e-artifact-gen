apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2d70266a-34d3-434e-b777-38ca4ef564ef.fullname" . }}
  labels:
    {{- include "go-echo2d70266a-34d3-434e-b777-38ca4ef564ef.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2d70266a-34d3-434e-b777-38ca4ef564ef.selectorLabels" . | nindent 6 }}
