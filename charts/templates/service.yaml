apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9f74a83c-64ad-478d-b25e-c6a46a7b0ebc.fullname" . }}
  labels:
    {{- include "go-echo9f74a83c-64ad-478d-b25e-c6a46a7b0ebc.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9f74a83c-64ad-478d-b25e-c6a46a7b0ebc.selectorLabels" . | nindent 6 }}
