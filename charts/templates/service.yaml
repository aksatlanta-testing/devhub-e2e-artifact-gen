apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofc91d88d-ae5d-40bb-8727-80208549307a.fullname" . }}
  labels:
    {{- include "go-echofc91d88d-ae5d-40bb-8727-80208549307a.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofc91d88d-ae5d-40bb-8727-80208549307a.selectorLabels" . | nindent 6 }}
