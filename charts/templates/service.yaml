apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoe0825653-34ca-4e8f-9df8-581a95cd999f.fullname" . }}
  labels:
    {{- include "go-echoe0825653-34ca-4e8f-9df8-581a95cd999f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoe0825653-34ca-4e8f-9df8-581a95cd999f.selectorLabels" . | nindent 6 }}
