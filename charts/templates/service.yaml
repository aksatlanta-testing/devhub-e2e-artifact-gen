apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo8a4b3df2-e754-404a-ba5f-2a3a795ded2f.fullname" . }}
  labels:
    {{- include "go-echo8a4b3df2-e754-404a-ba5f-2a3a795ded2f.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo8a4b3df2-e754-404a-ba5f-2a3a795ded2f.selectorLabels" . | nindent 6 }}
