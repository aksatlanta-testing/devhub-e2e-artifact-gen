apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6e0500d6-c443-4a92-90d7-5d6e402e9cac.fullname" . }}
  labels:
    {{- include "go-echo6e0500d6-c443-4a92-90d7-5d6e402e9cac.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6e0500d6-c443-4a92-90d7-5d6e402e9cac.selectorLabels" . | nindent 6 }}
