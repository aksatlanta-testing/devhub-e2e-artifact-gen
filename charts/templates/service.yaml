apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo84cdebf2-0c5c-4e9c-9ae3-27b5bbfbf7e5.fullname" . }}
  labels:
    {{- include "go-echo84cdebf2-0c5c-4e9c-9ae3-27b5bbfbf7e5.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo84cdebf2-0c5c-4e9c-9ae3-27b5bbfbf7e5.selectorLabels" . | nindent 6 }}
