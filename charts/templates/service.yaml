apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echof76337ae-2be4-4f4c-9481-d89ac99a2836.fullname" . }}
  labels:
    {{- include "go-echof76337ae-2be4-4f4c-9481-d89ac99a2836.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echof76337ae-2be4-4f4c-9481-d89ac99a2836.selectorLabels" . | nindent 6 }}
