apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo37c0be0c-8180-4641-9674-05e1b668af5c.fullname" . }}
  labels:
    {{- include "go-echo37c0be0c-8180-4641-9674-05e1b668af5c.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo37c0be0c-8180-4641-9674-05e1b668af5c.selectorLabels" . | nindent 6 }}
