apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo38eca7c2-f0b2-403c-8779-7136c9cbee11.fullname" . }}
  labels:
    {{- include "go-echo38eca7c2-f0b2-403c-8779-7136c9cbee11.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo38eca7c2-f0b2-403c-8779-7136c9cbee11.selectorLabels" . | nindent 6 }}
