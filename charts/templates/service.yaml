apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo418e3c99-8138-4f9a-9e9e-77e48b0ad183.fullname" . }}
  labels:
    {{- include "go-echo418e3c99-8138-4f9a-9e9e-77e48b0ad183.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo418e3c99-8138-4f9a-9e9e-77e48b0ad183.selectorLabels" . | nindent 6 }}
