apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo6b7598b6-5990-4f46-867a-f978dbdb9009.fullname" . }}
  labels:
    {{- include "go-echo6b7598b6-5990-4f46-867a-f978dbdb9009.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo6b7598b6-5990-4f46-867a-f978dbdb9009.selectorLabels" . | nindent 6 }}
