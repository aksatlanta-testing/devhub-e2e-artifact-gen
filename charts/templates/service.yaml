apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2d88350a-2ea3-499a-a1c4-ea7cacce5456.fullname" . }}
  labels:
    {{- include "go-echo2d88350a-2ea3-499a-a1c4-ea7cacce5456.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2d88350a-2ea3-499a-a1c4-ea7cacce5456.selectorLabels" . | nindent 6 }}
