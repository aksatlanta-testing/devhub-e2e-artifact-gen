apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo87aee183-d62d-4bbe-a95e-fc04184b173b.fullname" . }}
  labels:
    {{- include "go-echo87aee183-d62d-4bbe-a95e-fc04184b173b.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo87aee183-d62d-4bbe-a95e-fc04184b173b.selectorLabels" . | nindent 6 }}
