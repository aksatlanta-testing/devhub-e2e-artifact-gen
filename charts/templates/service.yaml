apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo9ab1e6d9-8b95-4de4-9c4f-e83667cae900.fullname" . }}
  labels:
    {{- include "go-echo9ab1e6d9-8b95-4de4-9c4f-e83667cae900.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo9ab1e6d9-8b95-4de4-9c4f-e83667cae900.selectorLabels" . | nindent 6 }}
