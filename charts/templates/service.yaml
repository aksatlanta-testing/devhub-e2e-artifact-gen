apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echod43690a9-1a7a-49da-98ed-0a1306b83555.fullname" . }}
  labels:
    {{- include "go-echod43690a9-1a7a-49da-98ed-0a1306b83555.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echod43690a9-1a7a-49da-98ed-0a1306b83555.selectorLabels" . | nindent 6 }}
