apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo82e68da3-9339-4be6-a62f-69ee047a5a5d.fullname" . }}
  labels:
    {{- include "go-echo82e68da3-9339-4be6-a62f-69ee047a5a5d.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo82e68da3-9339-4be6-a62f-69ee047a5a5d.selectorLabels" . | nindent 6 }}
