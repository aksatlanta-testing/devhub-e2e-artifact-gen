apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echoffbe3ea7-be35-4a6a-aa32-57e33fe5ee3b.fullname" . }}
  labels:
    {{- include "go-echoffbe3ea7-be35-4a6a-aa32-57e33fe5ee3b.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echoffbe3ea7-be35-4a6a-aa32-57e33fe5ee3b.selectorLabels" . | nindent 6 }}
