apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo595ffb04-be96-40f5-bed0-a6d95e935008.fullname" . }}
  labels:
    {{- include "go-echo595ffb04-be96-40f5-bed0-a6d95e935008.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo595ffb04-be96-40f5-bed0-a6d95e935008.selectorLabels" . | nindent 6 }}
