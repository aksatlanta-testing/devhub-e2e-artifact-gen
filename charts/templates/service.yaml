apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofdcc371c-24f4-494e-a193-69918e8710ae.fullname" . }}
  labels:
    {{- include "go-echofdcc371c-24f4-494e-a193-69918e8710ae.labels" . | nindent 4 }}
    kubernetes.azure.com/generator: {{.Values.generatorLabel}}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofdcc371c-24f4-494e-a193-69918e8710ae.selectorLabels" . | nindent 6 }}
