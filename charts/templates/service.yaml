apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo571b2672-7e3e-48fd-8bce-eca4a728f1de.fullname" . }}
  labels:
    {{- include "go-echo571b2672-7e3e-48fd-8bce-eca4a728f1de.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo571b2672-7e3e-48fd-8bce-eca4a728f1de.selectorLabels" . | nindent 6 }}
