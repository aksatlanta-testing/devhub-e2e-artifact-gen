apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echofce9ed79-8646-44d6-ab1e-1f4ee9aaadca.fullname" . }}
  labels:
    {{- include "go-echofce9ed79-8646-44d6-ab1e-1f4ee9aaadca.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echofce9ed79-8646-44d6-ab1e-1f4ee9aaadca.selectorLabels" . | nindent 6 }}
