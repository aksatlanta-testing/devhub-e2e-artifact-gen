apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-echo2a795f85-24fb-4bd8-a892-c6d4fdfd2854.fullname" . }}
  labels:
    {{- include "go-echo2a795f85-24fb-4bd8-a892-c6d4fdfd2854.labels" . | nindent 4 }}
  annotations:
    {{ toYaml .Values.service.annotations | nindent 4 }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
      name: svchttp
  selector:
    {{- include "go-echo2a795f85-24fb-4bd8-a892-c6d4fdfd2854.selectorLabels" . | nindent 6 }}
