apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "go-echodebeeb4f-f6a0-4535-b4ed-5a7c277cdf3f.fullname" . }}-config
  labels:
    {{- include "go-echodebeeb4f-f6a0-4535-b4ed-5a7c277cdf3f.labels" . | nindent 4 }}
  namespace: {{ .Values.namespace }}
data:
{{- range $key, $value := .Values.envVars }}
  {{ $key }}: {{ $value }}
{{- end }}
