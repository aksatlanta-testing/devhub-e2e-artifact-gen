apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "go-echoebde9a7f-08e4-4f2a-9acd-60bb046bd34b.fullname" . }}-config
  labels:
    {{- include "go-echoebde9a7f-08e4-4f2a-9acd-60bb046bd34b.labels" . | nindent 4 }}
  namespace: {{ .Values.namespace }}
data:
{{- range $key, $value := .Values.envVars }}
  {{ $key }}: {{ $value }}
{{- end }}
