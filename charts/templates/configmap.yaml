  labels:
    {{- include "go-echoa9e5ba18-eed3-4af7-a83f-fe1f1bb76dba.labels" . | nindent 4 }}
  namespace: {{ .Values.namespace }}
data:
{{- range $key, $value := .Values.envVars }}
