apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "go-echobf0e2fa0-81f1-4be6-b0cc-c3f2bfce39c0.fullname" . }}-config
  labels:
    {{- include "go-echobf0e2fa0-81f1-4be6-b0cc-c3f2bfce39c0.labels" . | nindent 4 }}
  namespace: {{ .Values.namespace }}
data:
{{- range $key, $value := .Values.envVars }}
  {{ $key }}: {{ $value }}
{{- end }}
