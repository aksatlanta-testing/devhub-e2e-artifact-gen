apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "go-echofaa4c1e3-4c97-428c-809e-dffdc1cdb0d1.fullname" . }}-config
  labels:
    {{- include "go-echofaa4c1e3-4c97-428c-809e-dffdc1cdb0d1.labels" . | nindent 4 }}
  namespace: {{ .Values.namespace }}
data:
{{- range $key, $value := .Values.envVars }}
  {{ $key }}: {{ $value }}
{{- end }}
