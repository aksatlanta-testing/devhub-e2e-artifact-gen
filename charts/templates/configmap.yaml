apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "go-echob73ad27d-8aa0-4d8a-ba70-e552f89b6d6d.fullname" . }}-config
  labels:
    {{- include "go-echob73ad27d-8aa0-4d8a-ba70-e552f89b6d6d.labels" . | nindent 4 }}
  namespace: {{ .Values.namespace }}
data:
{{- range $key, $value := .Values.envVars }}
  {{ $key }}: {{ $value }}
{{- end }}
