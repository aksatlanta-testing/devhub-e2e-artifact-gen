metadata:
  name: {{ include "go-echoaeea9f7a-b654-49f6-abd8-ce746bdf29ef.fullname" . }}-config
  labels:
    {{- include "go-echoaeea9f7a-b654-49f6-abd8-ce746bdf29ef.labels" . | nindent 4 }}
  namespace: {{ .Values.namespace }}
data:
{{- range $key, $value := .Values.envVars }}
