apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "go-echoc170bdc7-af12-433f-98fd-ea423623d9d4.fullname" . }}-config
  labels:
    {{- include "go-echoc170bdc7-af12-433f-98fd-ea423623d9d4.labels" . | nindent 4 }}
  namespace: {{ .Values.namespace }}
data:
{{- range $key, $value := .Values.envVars }}
  {{ $key }}: {{ $value }}
{{- end }}
