apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "go-echof25093eb-bc4f-4e9c-a4d1-ea672f9bcbc0.fullname" . }}-config
  labels:
    {{- include "go-echof25093eb-bc4f-4e9c-a4d1-ea672f9bcbc0.labels" . | nindent 4 }}
  namespace: {{ .Values.namespace }}
data:
{{- range $key, $value := .Values.envVars }}
