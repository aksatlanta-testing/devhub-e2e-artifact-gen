apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "go-echofd5a9a9f-e2b3-430a-bd9e-caa06f47cf8c.fullname" . }}-config
  labels:
    {{- include "go-echofd5a9a9f-e2b3-430a-bd9e-caa06f47cf8c.labels" . | nindent 4 }}
  namespace: {{ .Values.namespace }}
data:
{{- range $key, $value := .Values.envVars }}
  {{ $key }}: {{ $value }}
{{- end }}
