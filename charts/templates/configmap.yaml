apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "go-echof75e30c5-33ea-4f3c-91b3-fa9f4f2bb2d4.fullname" . }}-config
  labels:
    {{- include "go-echof75e30c5-33ea-4f3c-91b3-fa9f4f2bb2d4.labels" . | nindent 4 }}
  namespace: {{ .Values.namespace }}
data:
{{- range $key, $value := .Values.envVars }}
