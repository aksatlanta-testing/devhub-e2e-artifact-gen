apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "go-echo6f7dcf9f-8f93-45fe-ac4e-f3fca87f4b5d.fullname" . }}-config
  labels:
    {{- include "go-echo6f7dcf9f-8f93-45fe-ac4e-f3fca87f4b5d.labels" . | nindent 4 }}
  namespace: {{ .Values.namespace }}
data:
{{- range $key, $value := .Values.envVars }}
  {{ $key }}: {{ $value }}
{{- end }}
