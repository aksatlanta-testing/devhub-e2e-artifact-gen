apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "go-echodfdcc56d-8b67-4ef2-b6e4-4de0ad475002.fullname" . }}-config
  labels:
    {{- include "go-echodfdcc56d-8b67-4ef2-b6e4-4de0ad475002.labels" . | nindent 4 }}
  namespace: {{ .Values.namespace }}
data:
{{- range $key, $value := .Values.envVars }}
  {{ $key }}: {{ $value }}
{{- end }}
