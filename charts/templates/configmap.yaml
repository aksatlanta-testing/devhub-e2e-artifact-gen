apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "go-echof496fb8b-b2be-4f7d-ba5f-8a14a12c0c21.fullname" . }}-config
  labels:
    {{- include "go-echof496fb8b-b2be-4f7d-ba5f-8a14a12c0c21.labels" . | nindent 4 }}
  namespace: {{ .Values.namespace }}
data:
{{- range $key, $value := .Values.envVars }}
  {{ $key }}: {{ $value }}
{{- end }}
