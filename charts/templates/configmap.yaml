  labels:
    {{- include "go-echofc8283ad-5c26-4ac0-8ffe-1bd0bda44b7e.labels" . | nindent 4 }}
  namespace: {{ .Values.namespace }}
data:
{{- range $key, $value := .Values.envVars }}
