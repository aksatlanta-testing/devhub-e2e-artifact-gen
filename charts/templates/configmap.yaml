apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "go-echof8212b9e-cb55-4911-84a7-ec58921745b4.fullname" . }}-config
  labels:
    {{- include "go-echof8212b9e-cb55-4911-84a7-ec58921745b4.labels" . | nindent 4 }}
  namespace: {{ .Values.namespace }}
data:
{{- range $key, $value := .Values.envVars }}
  {{ $key }}: {{ $value }}
{{- end }}
