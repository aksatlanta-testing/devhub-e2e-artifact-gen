apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "go-echoa9f2fba3-39a3-4327-92b4-ecbc5de588a5.fullname" . }}-config
  labels:
    {{- include "go-echoa9f2fba3-39a3-4327-92b4-ecbc5de588a5.labels" . | nindent 4 }}
  namespace: {{ .Values.namespace }}
data:
{{- range $key, $value := .Values.envVars }}
  {{ $key }}: {{ $value }}
{{- end }}
