  name: {{ include "go-echofaf3fc9e-df41-4487-92c3-4e5d8b6c63f0.fullname" . }}-config
  labels:
    {{- include "go-echofaf3fc9e-df41-4487-92c3-4e5d8b6c63f0.labels" . | nindent 4 }}
  namespace: {{ .Values.namespace }}
data:
{{- range $key, $value := .Values.envVars }}
